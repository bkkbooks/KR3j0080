body:
  text: 案書篇儒家之宗孔子也墨家之祖墨翟也且案儒道傳而墨法廢者儒之道義可為而墨之法議難從也何以驗之墨家薄葬右鬼道乖相反違其實宜以難從也乖違如何使鬼非死人之精也右之未可知今墨家謂鬼審死人之精也厚其精而薄其屍此於其神厚而於其體薄也薄厚不相勝華實不相副則怒而降禍雖有其鬼終以死恨人情欲厚惡薄神心猶然用墨子之法事鬼求福福罕至而禍常來也以一況百而墨家為法皆若此類也廢而不傳蓋有以也春秋左氏傳者蓋出孔子壁中孝武皇帝時魯共王壞孔子教授堂以為宮得佚春秋三十篇左氏傳也公羊高穀梁寘胡母氏皆傳春秋各門異戶獨左氏傳為近得實何以驗之禮記造於孔子之堂太史公漢之通人也左氏之言與二書合公羊高穀梁寘胡母氏不相合又諸家去孔子遠遠不如近聞不如見劉子政玩弄左氏童僕妻子皆呻吟之光武皇帝之時陳元范升上書連屬條事是非左氏遂立范升尋因罪罷元升天下極才講論是非有餘力矣陳元言訥范升章詘左氏得實明矣言多怪頗與孔子不語怪力相違返也呂氏春秋亦如此焉國語左氏之外傳也左氏傳經辭語尚略故復選錄國語之辭以實然則左氏國語世儒之實書也公孫龍著堅白之論析言剖辭務折曲之言無道理之較無益於治齊有三鄒子之書瀇洋無涯其文少驗多驚耳之言案大才之人率多侈縱無實是之驗華虛誇誕無審察之實商鞅相秦作耕戰之術管仲相齊造輕重之篇富民豐國彊主弱敵公賞罰與鄒衍之書並言而太史公兩紀世人疑惑不知所從案張儀與蘇秦同時蘇秦之死儀固知之儀知各審宜從儀言以定其實而說不明兩傳其文東海馮商亦作列傳豈蘇秦商之所為邪何文相違甚也三代世表言五帝三王皆黃帝子孫自黃帝轉相生不更稟氣於天作殷本紀言契母簡狄浴於川遇玄鳥墜卵吞之遂生契焉及周本紀言后稷之母姜嫄野出見大人跡履之則妊身生后稷焉夫觀世表則契與后稷黃帝之子孫也讀殷周本紀則玄鳥大人之精氣也二者不可兩傳而太史公兼紀不別案帝王之妃不宜野出浴於川水今言浴於川吞玄鳥之卵出於野履大人之跡違尊貴之節誤是非之言也新語陸賈所造蓋董仲舒相被服焉皆言君臣政治得失言可采行事美足觀鴻知所言參貳經傳雖古聖之言不能過增陸賈之言未見遺闕而仲舒之言雩祭可以應天土龍可以致雨頗難曉也夫致旱者以雩祭不夏郊之祀豈晉侯之過邪以政失道陰陽不和也晉廢夏郊之祀晉侯寢疾用鄭子產之言祀夏郊而疾愈如審雩不脩龍不治與晉同禍為之再也以政致旱宜復以政政虧而復脩雩治龍其何益哉春秋公羊氏之說亢陽之節足以復政陰陽相渾旱湛相報天道然也何乃脩雩設龍乎雩祀神喜哉或雨至亢陽不改旱禍不除變復之義安所施哉且夫寒溫與旱湛同俱政所致其咎在人獨為亢旱求福不為寒溫求祐未曉其故如當復報寒溫宜為雩龍之事鴻材巨識第兩疑焉董仲舒著書不稱子者意殆自謂過諸子也漢作書者多司馬子長楊子雲河漢也其餘涇渭也然而子長少臆中之說子雲無世俗之論仲舒說道術奇矣北方三家尚矣讖書云董仲舒亂我書蓋孔子言也讀之者或為亂我書者煩亂孔子之書也或以為亂者理也理孔子之書也共一亂字理之與亂相去甚遠然而讀者用心不同不省本實故說誤也夫言煩亂孔子之書才高之語也其言理孔子之書亦知奇之言也出入聖人之門亂理孔子之書子長子雲無此言焉世俗用心不實省事失情二語不定轉側不安案仲舒之書不違儒家不反孔子其言煩亂孔子之書者非也孔子之書不亂其言理孔子之書者亦非也孔子曰師摯之始關雎之亂洋洋乎盈耳哉亂者終孔子言也孔子生周始其本仲舒在漢終其末班叔皮續太史公書蓋其義也賦頌篇下其有亂曰章蓋其類也孔子終論定於仲舒之言其修雩治龍必將有義未可怪也顏淵曰舜何人也予何人也五帝三王顏淵獨慕舜者知己步騶有同也知德所慕默識所追同一實也仲舒之言道德政治可嘉美也質定世事論說世疑桓君山莫上也故仲舒之文可及而君山之論難追也驥與眾馬絕跡或蹈驥哉有馬於此足行千里終不名驥者與驥毛色異也有人於此文偶仲舒論次君山終不同於二子者姓名殊也故馬效千里不必驥騄人期賢知不必孔墨何以驗之君山之論難追也兩刃相割利鈍乃知二論相訂是非乃見是故韓非之四難桓寬之鹽鐵君山新論之類也世人或疑言非是偽論者實之故難為也卿決疑訟獄定嫌罪是非不決曲直不立世人必謂卿獄之吏才不任職至於論不務全疑兩傳并紀不宜明處孰與剖破渾沌解決亂絲言無不可知文無不可曉哉案孔子作春秋采毫毛之善貶纖介之惡可褒則義以明其行善可貶則明其惡以譏其操新論之義與春秋會一也夫俗好珍古不貴今謂今之文不如古書夫古今一也才有高下言有是非不論善惡而徒貴古是謂古人賢今人也案東番鄒伯奇臨淮袁太伯袁文術會稽吳君高周長生之輩位雖不至公卿誠能知之囊橐文雅之英雄也觀伯奇之元思太伯之易章句文術之咸銘君高之越紐錄長生之洞歷劉子政揚子雲不能過也蓋才有淺深無有古今文有偽真無有故新廣陵陳子迴顏方今尚書郎班固蘭臺令楊終傅毅之徒雖無篇章賦頌記奏文辭斐炳賦象屈原賈生奏象唐林谷永並比以觀好其美一也當今未顯使在百世之後則子政子雲之黨也韓非著書李斯采以言事楊子雲作太玄侯鋪子隨而宣之非斯同門雲鋪共朝覩奇見益不為古今變心易意實事貪善不遠為術併肩以迹相輕好奇無已故奇名無窮楊子雲反離騷之經非能盡反一篇文往往見非反而奪之六略之錄萬三千篇雖不盡見指趣可知略借不合義者案而論之
