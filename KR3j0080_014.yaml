body:
  text: 物勢篇儒者論曰天地故生人此言妄也夫天地合氣人偶自生也猶夫婦合氣子則自生也夫婦合氣非當時欲得生子情欲動而合合而生子矣且夫婦不故生子以知天地不故生人也然則人生於天地也猶魚之於淵蟣虱之於人也因氣而生種類相産萬物生天地之間皆一實也傳曰天地不故生人人偶自生若此論事者何故云天地為爐萬物為銅陰陽為火造化為工乎案陶冶者之用火爍銅燔器故為之也而云天地不故生人人偶自生耳可謂陶冶者不故為器而器偶自成乎夫比不應事未可謂喻文不稱實未可謂是也曰是喻人稟氣不能純一若爍銅之下形燔器之得火也非謂天地生人與陶冶同也興喻人皆引人事人事有體不可斷絶以目視頭頭不得不動以手相足足不得不搖目與頭同形手與足同體今夫陶冶者初埏埴作器必模範為形故作之也燃炭生火必調和爐竈故為之也及銅爍不能皆成器燔不能盡善不能故生也夫天不能故生人則其生萬物亦不能故也天地合氣物偶自生矣夫耕耘播種故為之也及其成與不熟偶自然也何以驗之如天故生萬物當令其相親愛不當令之相賊害也或曰五行之氣天生萬物以萬物含五行之氣五行之氣更相賊害曰天自當以一行之氣生萬物令之相親愛不當令五行之氣反使相賊害也或曰欲為之用故令相賊害賊害相成也故天用五行之氣生萬物人用萬物作萬事不能相制不能相使不相賊害不成為用金不賊木木不成用火不爍金金不成器故諸物相賊相利含血之蟲相勝服相齧噬相啖食者皆五行之氣使之然也曰天生萬物欲令相為用不得不相賊害也則生虎狼蝮蛇及蜂蠆之蟲皆賊害人天又欲使人為之用邪且一人之身含五行之氣故一人之行有五常之操五常五常行之道也五藏在內五行氣俱如論者之言含血之蟲懷五行之氣輒相賊害一人之身胸懷五藏自相賊也一人之操行義之心自相害也且五行之氣相賊害含血之蟲相勝服其驗何在曰寅木也其禽虎也戌土也其禽犬也丑未亦土也丑禽牛未禽羊也木勝土故犬與牛羊為虎所服也亥水也其禽豕也巳火也其禽蛇也子亦水也其禽鼠也午亦火也其禽馬也水勝火故豕食蛇火為水所害故馬食鼠屎而腹脹曰審如論者之言含血之蟲亦有不相勝之效午馬也子鼠也酉雞也卯兔也水勝火鼠何不逐馬金勝木雞何不啄兔亥豕也未羊也丑牛也土勝水牛羊何不殺豕巳蛇也申猴也火勝金蛇何不食獼猴獼猴者畏鼠也囓獼猴者犬也鼠水獼猴金也水不勝金獮猴何故畏鼠也戌土也申猴也土不勝金猴何故畏犬東方木也其星倉龍也西方金也其星白虎也南方火也其星朱鳥也北方水也其星玄武也天有四星之精降生四獸之體含血之蟲以四獸為長四獸含五行之氣最較著案龍虎交不相賊鳥龜會不相害以四獸驗之以十二辰之禽效之五行之蟲以氣性相刻則尤不相應凡萬物相刻賊含血之蟲則相勝服至於相啖食者自以齒牙頓利筋力優劣動作巧便氣勢勇桀若人之在世勢不與適力不均等自相勝服以力相服則以刃相賊矣夫人以刃相賊猶物以齒角爪牙相觸刺也力強角利勢烈牙長則能勝氣微爪短誅膽小距頓則服畏也人有勇怯故戰有勝負勝者未必受金氣負者未必得木精也孔子畏陽虎卻行流汗陽虎未必色白孔子未必面青也鷹之擊鳩雀梟之啄鵠鴈未必鷹梟生於南方而鳩雀鵠鴈産於西方也自是筋力勇怯相勝服也一堂之上必有論者一鄉之中必有訟者訟必有曲直論必有是非非而曲者為負是而直者為勝亦或辨口利舌辭喻橫出為勝或詘弱綴跲蹥蹇不比者為負以舌論訟猶以劍戟鬭也利劍長戟手足健疾者勝頓刀短矛手足緩留者負夫物之相勝或以筋力或以氣勢或以巧便小有氣勢口足有便則能以小而制大大無骨力角翼不徑則以大而服小鵲食蝟皮博勞食蛇蝟蛇不便也蚊虻之力不如牛馬牛馬困於蚊虻蚊虻乃有勢也鹿之角足以觸犬獼猴之手足以搏鼠然而鹿制於犬獼猴服於鼠角爪不利也故十年圍之牛為牧豎所驅長仞之象為越僮所鉤無便故也故夫得其便也則以小能勝大無其便也則以強服於羸也
