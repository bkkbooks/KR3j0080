body:
  text: 難歲篇俗人險心好信禁忌知者亦疑莫能實定是以儒雅服從工伎得勝吉凶之書伐經典之義工伎之說凌儒雅之論今略實論令世觀覽揔核是非使世一悟移徙法曰徙抵太歲凶負太歲亦凶抵太歲名曰歲下負太歲名曰歲破故皆凶也假令太歲在子天下之人皆不得南北徙起宅嫁娶亦皆避之其移東西若徙四維相之如者皆吉何者不與太歲相觸亦不抵太歲之衝也實問避太歲者何意也令太歲惡人徙乎則徙者皆有禍令太歲不禁人徙惡人抵觸之乎則道上之人南北行者皆有殃太歲之意猶長吏之心也長吏在塗人行觸車馬干其吏從長吏怒之豈獨抱器載物去宅徙居觸犯之者而乃責之哉昔文帝出過霸陵橋有一人行逢車駕逃於橋下以為文帝之車已過疾走而出驚乘輿馬文帝怒以屬廷尉張釋之釋之當論使太歲之神行若文帝出乎則人犯之者必有如橋下走出之人矣方今行道路者暴溺仆死何以知非觸遇太歲之出也為移徙者又不能處不能處則犯與不犯未可知未可知則其行與不行未可審也且太歲之神審行乎則宜有曲折不宜直南北也長吏出舍行有曲折如天神直道不曲折乎則從東西四維徙者猶干之也若長吏之南北行人從東如西四維相之如者猶抵觸之如不正南北南北之徙又何犯如太歲不動行乎則宜有宮室營堡不與人相見人安得而觸之如太歲無體與長吏異若煙雲虹霓直經天地極子午南北陳乎則東西徙若四維徙者亦干之譬若今時人行觸繁霧蜮氣無從橫負鄉皆中傷焉如審如氣人當見之雖不移徙亦皆中傷且太歲天別神也與青龍無異龍之體不過數千丈如令神者宜長大饒之數萬丈令體掩北方當言太歲在北方不當言在子其東有丑其西有亥明不專掩北方極東西之廣明矣令正言在子位觸土之中直子午者不得南北徙耳東邊直丑巳之地西邊直亥未之民何為不得南北徙丑與亥地之民使太歲左右通不得南北徙及東西徙何則丑在子東亥在子西丑亥之民東西徙觸歲之位巳未之民東西徙忌歲所破儒者論天下九州以為東西南北盡地廣長九州之內五千里竟三河土中周公卜宅經曰王來紹上帝自服于土中雒則土之中也鄒衍論之以為九州之內五千里竟合為一州在東南位名曰赤縣神州自有九州者九焉九九八十一凡八十一州此言殆虛地形難審假令有之亦一難也使天下九州如儒者之議直雒邑以南對三河以北豫州荊州冀州之部有太歲耳雍梁之間青兗徐楊之地安得有太歲使如鄒衍之論則天下九州在東南位不直子午安得有太歲如太歲不在天地極分散在民間則一家之宅輒有太歲雖不南北徙猶抵觸之假令從東里徙西里西里有太歲從東宅徙西宅西宅有太歲或在人之東西或在人之南北猶行途上東西南北皆逢觸人太歲位數千萬億天下之民徙者皆凶為移徙者何以審之如審立於天地之際猶王者之位在土中也東方之民張弓西射人不謂之射王者以不能至王者之都自止射其處也今徙豈能北至太歲位哉自止徙百步之內何為謂之傷太歲乎且移徙之家禁南北徙者以為歲在子位子者破午南北徙者抵觸其衝故謂之凶夫破者須有以椎破之也如審有所用則不徙之民皆被破害如無所用何能破之夫雷天氣也盛夏擊折折木破山時暴殺人使太歲所破若迅雷也則聲音宜疾死者宜暴如不若雷亦無能破如謂衝抵為破衝抵安能相破東西相與為衝而南北相與為抵如必以衝抵為凶則東西常凶而南北常惡也如以太歲神其衝獨凶神莫過於天地天地相與為衝則天地之間無生人也式上十二神登明從魁之輩工伎家謂之皆天神也常立子丑之位俱有衝抵之氣神雖不若太歲宜有微敗移徙者雖避太歲之凶獨觸十二神之害為移徙時者何以不禁冬氣寒水也水位在北方夏氣熱火也火位在南方案秋冬寒春夏熱者天下普然非獨南北之方水火衝也今太歲位在子耳天下皆為太歲非獨子午衝也審以所立者為主則午可為大夏子可為大冬冬夏南北徙者可復凶乎立春艮王震相巽胎離沒坤死兌囚乾廢坎休王之衝死相之衝囚王相衝位有死囚之氣乾坤六子天下正道伏羲文王象以治世文為經所載道為聖所信明審於太歲矣人或以立春東北徙抵艮之下不被凶害太歲立於子彼東北徙坤卦近於午猶艮以坤徙觸子位何故獨凶正月建於寅破於申從寅申徙相之如者無有凶害太歲不指午而空曰歲破午實無凶禍而虛禁南北豈不妄哉十二月為一歲四時節竟陰陽氣終竟復為一歲日月積聚之名耳何故有神而謂之立於子位乎積分為日纍日為月連月為時結時為歲歲則日月時之類也歲而有神日月時亦復有神乎千五百三十九歲為一統四千六百一十七歲為一元歲猶統元也歲有神統元復有神乎論之以為無假令有之何故害人神莫過於天地天地不害人人謂百神百神不害人太歲之氣天地之氣也何憎於人觸而為害且文曰甲子不徙言甲與子殊位太歲立子不居甲為移徙者運之而復居甲為之而復居甲為移徙者亦宜復禁東西徙甲與子鈞其凶宜同不禁甲而獨忌子為移徙者竟妄不可用也人居不能不移徙移徙不能不觸歲不觸歲不能不得時死工伎之人見今人之死則歸禍於往時之徙俗心險危死者不絶故太歲之言傳世不滅
