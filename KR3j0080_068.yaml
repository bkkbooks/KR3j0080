body:
  text: 四諱篇俗有大諱四一曰諱西益宅西益宅謂之不祥不祥必有死亡相懼以此故世莫敢西益宅防禁所從來者遠矣傳曰魯哀公欲西益宅史爭之以為不祥哀公作色而怒左右數諫而弗聽乃以問其傅宰質睢曰吾欲西益宅史以為不祥何如宰質睢曰天下有三不祥西益宅不與焉哀公大說有頃復問曰何謂三不祥對曰不行禮義一不祥也嗜欲無止二不祥也不聽規諫三不祥也哀公繆然深惟慨然自反遂不西益宅令史與宰質睢止其益宅徒為煩擾則西益宅祥與不祥未可知也令史與質睢以為西益宅審不祥則史與質睢與今俗人等也夫宅之四面皆地也三面不謂之凶益西面獨謂不祥何哉西益宅何傷於地體何害於宅神西益不祥損之能善乎西益不祥東益能吉乎夫不祥必有祥者猶不吉必有吉矣宅有形體神有吉凶動德致福犯刑起禍今言西益宅謂之不祥何益而祥者且惡人西益宅者誰也如地惡之益東家之西損西家之東何傷於地如以宅神不欲西益神猶人也人之處宅欲得廣大何故惡之而以宅神惡煩擾則四面益宅皆當不祥諸工技之家說吉凶之占皆有事狀宅家言治宅犯凶神移徙言忌歲月祭祀言觸血忌喪葬言犯剛柔皆有鬼神凶惡之禁人不忌避有病死之禍至於西益宅何害而謂之不祥不祥之禍何以為敗實說其義不祥者義理之禁非吉凶之忌也夫西方長老之地尊者之位也尊長在西卑幼在東尊長主也卑幼助也主少而助多尊無二上卑有百下也西益宅益主不增助二上不百下也於義不善故謂不祥不祥者不宜也於義不宜未有凶也何以明之夫墓死人所藏田人所飲食宅人所居處三者於人吉凶宜等西益宅不祥西益墓與田不言不祥夫墓死人所居因忽不慎田非人所處不設尊卑宅者長幼所共加慎致意者何可不之諱義詳於宅略於墓與田也二曰諱被刑為徒不上丘墓但知不可不能知其不可之意問其禁之者不能知其諱受禁行者亦不曉其忌連相放效至或于被刑父母死不送葬若至墓側不敢臨葬其失至於不行弔喪見他人之柩夫徒善人也被刑謂之徒丘墓之上二親也死亡謂之先宅與墓何別親與先何異如以徒被刑先人責之則不宜入宅與親相見如以徒不得與死人相見則親死在堂不得哭柩如以徒不得升丘墓則徒不得上山陵世俗禁之執據何義實說其意徒不上丘墓有二義義理之諱非凶惡之忌也徒用心以為先祖全而生之子孫亦當全而歸之故曾子有疾召門弟子曰開豫足開豫手而今而後吾知免夫小子曾子重慎臨絶效全喜免毀傷之禍也孔子曰身體髮膚受之父母弗敢毀傷孝者怕入刑辟刻畫身體毀傷髮膚少德泊行不戒慎之所致也愧負刑辱深自刻責故不升墓祀於先古禮廟祭今俗墓祀故不升墓慚負先人一義也墓者鬼神所在祭祀之處祭祀之禮齊戒潔清重之至也今已被刑刑殘之人不宜與祭供侍先人卑謙謹敬退讓自賤之意也緣先祖之意見子孫被刑惻怛憯傷恐其臨祀不忍歆享故不上墓二義也昔太伯見王季有聖子文王知太王意欲立之入吳采藥斷髮文身以隨吳俗太王薨太伯還王季辟主太伯再讓王季不聽三讓曰吾之吳越吳越之俗斷髮文身吾刑餘之人不可為宗廟社稷之主王季知不可權而受之夫徒不上丘墓太伯不為主之義也是謂祭祀不可非謂柩當葬身不送也葬死人先祖痛見刑人先祖哀權可哀之身送可痛之尸使先祖有知痛尸哀形何愧之有如使無知丘墓田野也何慚之有慚愧先者謂身體刑殘與人異也古者肉刑形毀不全乃不可耳方今象刑象刑重者髡鉗之法也若完城旦以下施刑綵衣系躬冠帶與俗人殊何為不可世俗信而謂之皆凶其失至於不弔鄉黨尸不升他人之丘惑也三曰諱婦人乳子以為不吉將舉吉事入山林遠行度川澤者皆不與之交通乳子之家亦忌惡之丘墓廬道畔踰月乃入惡之甚也暫卒見若為不吉極原其事何以為惡夫婦人之乳子也子含元氣而出元氣天地之精微也何凶而惡之人物也子亦物也子生與萬物之生何以異諱人之生謂之惡萬物之生又惡之乎生與胞俱出如以胞為不吉人之有胞猶木實之有枎也包裹兒身因與俱出若鳥卵之有殼何妨謂之惡如惡以為不吉則諸生物有枎殼者宜皆惡之萬物廣多難以驗事人生何以異於六畜皆含血氣懷子子生與人無異獨惡人而不憎畜豈以人體大氣血盛乎則夫牛馬體大於人凡可惡之事無與鈞等獨有一物不見比類乃可疑也今六畜與人無異其乳皆同一狀六畜與人無異諱人不諱六畜不曉其故也世能別人之産與六畜之乳吾將聽其諱如不能別則吾謂世俗所諱妄矣且凡人所惡莫有腐臭腐臭之氣敗傷人心故鼻聞臭口食腐心損口惡霍亂嘔吐夫更衣之室可謂臭矣鮑魚之肉可謂腐矣然而有甘之更衣之室不以為忌肴食腐魚之肉不以為諱意不存以為惡故不計其可與不也凡可憎惡者若濺墨漆附著人身今目見鼻聞一過則已忽亡輒去何故惡之出見負豕於塗腐澌於溝不以為凶者汙辱自在彼人不著己之身也今婦人乳子自在其身齊戒之人何故忌之江北乳子不出房室知其無惡也至於犬乳置之宅外此復惑也江北諱犬不諱人江南諱人不諱犬謠俗防惡各不同也夫人與犬何以異房室宅外何以殊或惡或不惡或諱或不諱世俗防禁竟無經也月之晦也日月合宿紀為一月猶八日月中分謂之弦十五日日月相望謂之望三十日日月合宿謂之晦晦與弦望一實也非月晦日月光氣與月朔異也何故踰月謂之吉乎如實凶踰月未可謂吉如實吉雖未踰月猶為可也實說諱忌産子乳犬者欲使人常自潔清不欲使人被污辱也夫自潔清則意精意精則行清行清而貞廉之節立矣四曰諱舉正月五月子以為正月五月子殺父與母不得舉也已舉之父母偶死則信而謂之真矣夫正月五月子何故殺父與母人之含氣在腹腸之內其生十月而産共一元氣也正月與二月何殊五月與六月何異而謂之凶也世傳此言久矣拘數之人莫敢犯之弘識大材實核事理深睹吉凶之分者然後見之昔齊相田嬰賤妾有子名之曰文文以五月生嬰告其母曰勿舉也其母竊舉生之及長其母因兄弟而見其子文於嬰嬰怒曰吾令女去此子而敢生之何也文頓首因曰君所以不舉五月子者何故嬰曰五月子者長至戶將不利其父母文曰人生受命於天乎將受命於戶邪嬰默然文曰必受命於天君何憂焉如受命於戶即高其戶誰能至者嬰善其言曰子休矣其後使文主家待賓客賓客日進名聞諸侯文長過戶而嬰不死以田文之說言之以田嬰不死效之世俗所諱虛妄之言也夫田嬰俗父而田文雅子也嬰信忌不實義文信命不辟諱雅俗異材舉措殊操故嬰名暗而不明文聲馳而不滅實說世俗諱之亦有緣也夫正月歲始五月盛陽子以此月生精熾熱烈厭勝父母父母不堪將受其患傳相放效莫謂不然有空諱之言無實凶之效世俗惑之誤非之甚也夫忌諱非一必託之神怪若設以死亡然后世人信用畏避忌諱之語四方不同略舉通語令世觀覽若夫曲俗微小之諱衆多非一咸勸人為善使人重慎無鬼神之害凶醜之禍世諱作豆醬惡聞雷一人不食欲使人急作不欲積家踰至春也世諱厲刀井上恐刀墮井中也或說以為刑之字井與刀也厲刀井上井刀相見恐被刑也毋承屋檐而坐恐瓦墮擊人首也毋反懸冠為似死人服或說惡其反而承塵溜也毋偃寢為其象尸也毋以箸相受為其不固也毋相代掃為修冢之人冀人來代己也諸言毋者教人重慎勉人為善禮曰毋摶飯毋流啜禮義之禁未必吉凶之言也
