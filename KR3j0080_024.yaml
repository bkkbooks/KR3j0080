body:
  text: 道虛篇儒書言黃帝採首山銅鑄鼎於荊山下鼎既成有龍垂胡髯下迎黃帝黃帝上騎龍群臣後宮從上七十餘人龍乃上去餘小臣不得上乃悉持龍髯龍髯拔墮黃帝之弓百姓仰望黃帝既上天乃抱其弓與龍胡髯吁號故後世因名其處曰鼎湖其弓曰烏號太史公記誄五帝亦云黃帝封禪已仙去群臣朝其衣冠因葬埋之曰此虛言也實黃帝者何等也號乎諡也如諡臣子所誄列也誄生時所行為之諡黃帝好道遂以升天臣子誄之宜以仙升不當以黃諡諡法曰靜民則法曰黃黃帝者安民之諡非得道之稱也百王之諡文則曰文武則曰武文武不失實所以勸操行也如黃帝之時質未有諡乎名之為黃帝何世之人也使黃帝之臣子知君使後世之人迹其行黃帝之世號諡有無雖疑未定黃非升仙之稱明矣龍不升天黃帝騎之乃明黃帝不升天也龍起雲雨因乘而行雲散雨止降復入淵如實黃帝騎龍隨溺於淵也案黃帝葬於橋山猶曰群臣葬其衣冠審騎龍而升天衣不離形如封禪已仙去衣冠亦不宜遺黃帝實仙不死而升天臣子百姓所親見也見其升天知其不死必也葬不死之衣冠與實死者無以異非臣子實事之心別生於死之意也載太山之上者七十有二君皆勞情苦思憂念王事然後功成事立致治太平太平則天下和安乃升太山而封禪焉夫修道求仙與憂職勤事不同心思道則忘事憂事則害性世稱堯若臘舜若腒心愁憂苦形體羸臞使黃帝致太平乎則其形體宜如堯舜堯舜不得道黃帝升天非其實也使黃帝廢事修道則心意調和形體肥徑是與堯舜異也異則功不同矣功不同天下未太平而升封又非實也五帝三王皆有聖德之優者黃帝不在上焉如聖人皆仙仙者非獨黃帝如聖人不仙黃帝何為獨仙世見黃帝好方術方術仙者之業則謂黃帝仙矣又見鼎湖之名則言黃帝採首山銅鑄鼎而龍垂胡髯迎黃帝矣是與説會稽之山無以異也夫山名曰會稽即云夏禹巡狩會計於此山上故曰會稽夫禹至會稽治水不巡狩猶黃帝好方伎不升天也無會計之事猶無鑄鼎龍垂胡髯之實也里名勝母可謂實有子勝其母乎邑名朝歌可謂民朝起者歌乎儒書言淮南王學道招會天下有道之人傾一國之尊下道術之士是以道術之士並會淮南奇方異術莫不爭出王遂得道舉家升天畜産皆仙犬吠於天上雞鳴於雲中此言仙藥有餘犬雞食之并隨王而升天也好道學仙之人皆謂之然此虛言也夫人物也雖貴為王侯性不異於物物無不死人安能仙鳥有毛羽能飛不能升天人無毛羽何用飛升使有毛羽不過與鳥同況其無有升天如何案能飛升之物生有毛羽之兆能馳走之物生有蹄足之形馳走不能飛升飛升不能馳走稟性受氣形體殊別也今人稟馳走之性故生無毛羽之兆長大至老終無奇怪好道學仙中生毛羽終以飛升使物性可變金木水火可革更也蝦蟆化為鶉雀入水為蜄蛤稟自然之性非學道所能為也好道之人恐其或若等之類故謂人能生毛羽毛羽備具能升天也且夫物之生長無卒成暴起皆有浸漸為道學仙之人能先生數寸之毛羽從地自奮升樓臺之陛乃可謂升天今無小升之兆卒有大飛之驗何方術之學成無浸漸也毛羽大之效難以觀實且以人髯髮物色少老驗之物生也色青其熟也色黃人之少也髮黑其老也髮白黃為物熟驗白為人老效物黃人雖灌溉壅養終不能青髮白雖吞藥養性終不能黑黑青不可復還老衰安可復卻黃之與白猶肉腥炙之燋魚鮮煮之熟也燋不可復令腥熟不可復令鮮鮮腥猶少壯燋熟猶衰老也天養物能使物暢至秋不得延之至春吞藥養性能令人無病不能壽之為仙為仙體輕氣強猶未能升天令見輕強之驗亦無毛羽之效何用升天天之與地皆體也地無下則天無上矣天無上上升之路何如穿天之體人力不能入如天之門在西北升天之人宜從崑崙上淮南之國在地東南如審升天宜舉家先從崑崙乃得其階如鼓翼邪飛趨西北之隅是則淮南王有羽翼也今不言其從之崑崙亦不言其身生羽翼空言升天竟虛非實也案淮南王劉安孝武皇帝之時也父長以罪遷蜀嚴道至雍道死安嗣為王恨父徙死懷反逆之心招會術人欲為大事伍被之屬充滿殿堂作道術之書發怪奇之文合景亂首八公之儔欲示神奇若得道之狀道終不成效驗不立乃與伍被謀為反事事覺自殺或言誅死誅死自殺同一實也世見其書深冥奇怪又觀八公之儔似若有效則傳稱淮南王仙而升天失其實也儒書言盧敖遊乎北海經乎太陰入乎玄關至於蒙穀之上見一士焉深目而玄準鴈頸而鳶肩浮上而殺下軒軒然方迎風而舞顧見盧敖樊然下其臂遁逃乎碑下敖乃視之方卷然龜背而食合梨盧敖仍與之語曰吾子唯以敖為倍俗去群離黨窮觀於六合之外者非敖而已乎敖幼而好遊至長不渝解周行四極唯北陰之未窺今卒睹夫子於是殆可與敖為友乎若士者悖然而笑曰嘻子中州之民也不宜遠至此此猶光日月而戴列星四時之所行陰陽之所生也此其比夫不名之地猶㟮屼也若我南遊乎罔浪之野北息乎沉薶之鄉西窮乎窅冥之黨而東貫澒濛之先光此其下無地而上無天聽焉無聞而視焉則營此其外猶有狀有狀之餘一舉而能千萬里吾猶未能之在今子遊始至於此乃語窮觀豈不亦遠哉然子處矣吾與汗漫期於九垓之上吾不可久若士者舉臂而縱身遂入雲中盧敖目仰而視之不見乃止喜心不怠怡悵若有喪曰吾比夫子也猶黃鵠之與壤蟲也終日行而不離咫尺而自以為遠豈不悲哉若盧敖者唯龍無翼者升則乘雲盧敖言若士者有翼言乃可信今不言有翼何以升雲且凡能輕舉入雲中者飲食與人殊之故也龍食與蛇異故其舉措與蛇不同聞為道者服金玉之精食紫芝之英食精身輕故能神仙若士者食合蜊之肉與庸民同食無精輕之驗安能縱體而升天聞食氣者不食物食物者不食氣若士者食物如不食氣則不能輕舉矣或時盧敖學道求仙遊乎北海離衆遠去無得道之效慚於鄉里負於論議自知以必然之事見責於世則作誇誕之語云見一士其意以為有仙求仙之未得期數未至也淮南王劉安坐反而死天下並聞當時並見儒書尚有言其得道仙去雞犬升天者況盧敖一人之身獨行絶迹之地空造幽冥之語乎是與河東蒲坂項曼都之語無以異也曼都好道學仙委家亡去三年而返家問其狀曼都曰去時不能自知忽見若臥形有仙人數人將我上天離月數里而止見月上下幽冥幽冥不知東西居月之旁其寒悽愴口飢欲食仙人輒飲我以流霞一杯每飲一杯數月不飢不知去幾何年月不知以何為過忽然若臥復下至此河東號之曰斥仙實論者聞之乃知不然夫曼都能上天矣何為不仙已三年矣何故復還夫人去民間升皇天之上精氣形體有變於故者矣萬物變化無復還者復育化為蟬羽翼既成不能復化為復育能升之物皆有羽翼升而復降羽翼如故見曼都之身有羽翼乎言乃可信身無羽翼言虛妄也虛則與盧敖同一實也或時曼都好道默委家去周章遠方終無所得力倦望極默復歸家慚愧無言則言上天其意欲言道可學得審有仙人己殆有過故成而復斥升而復降儒書言齊王疾痟使人之宋迎文摯文摯至視王之疾謂太子曰王之疾必可已也雖然王之疾已則必殺摯也太子曰何故文摯對曰非怒王則疾不可治也王怒則摯必死太子頓首強請曰苟已王之疾臣與臣之母以死爭之於王王必幸臣與臣之母願先生之勿患也文摯曰諾請以死為王與太子期將往不至者三齊王固已怒矣文摯至不解屨登床履王衣問王之疾王怒而不與言文摯因出辭以重王怒王叱而起疾乃遂已王大怒不悅將生烹文摯太子與王后急爭之而不能得果以鼎生烹文摯爨之三日三夜顏色不變文摯曰誠欲殺我則胡不覆之以絶陰陽之氣王使覆之文摯乃死夫文摯道人也入水不濡入火不燋故在鼎三日三夜顏色不變此虛言也夫文摯而烹三日三夜顏色不變為一覆之故絶氣而死非得道之驗也諸生息之物氣絶則死死之物烹之輒爛置生息之物密器之中覆蓋其口漆塗其隙中外氣隔息不得泄有頃死也如置湯鑊之中亦輒爛矣何則體同氣均稟性於天共一類也文摯不息乎與金石同入湯不爛是也令文摯息乎烹之不死非也令文摯言言則以聲聲以呼吸呼吸之動因血氣之發血氣之發附於骨肉骨肉之物烹之輒死今言烹之不死一虛也既能烹煮不死此真人也與金石同金石雖覆蓋與不覆蓋者無以異也今言文摯覆之則死二虛也置人寒水之中無湯火之熱鼻中口內不通於外斯須之頃氣絶而死矣寒水沉人尚不得生況在沸湯之中有猛火之烈乎言其入湯不死三虛也人沒水中口不見於外言音不揚烹文摯之時身必沒於鼎中沒則口不見口不見則言不揚文摯之言四虛也烹輒死之人三日三夜顏色不變癡愚之人尚知怪之使齊王無知太子群臣宜見其奇奇怪文摯則請出尊寵敬事從之問道今言三日三夜無臣子請出之言五虛也此或時聞文摯實烹烹而輒死世見文摯為道人也則為虛生不死之語矣猶黃帝實死也傳言升天淮南坐反書言度世世好傳虛故文摯之語傳至於今世無得道之效而有有壽之人世見長壽之人學道為仙踰百不死共謂之仙矣何以明之如武帝之時有李少君以祠竈辟穀卻老方見上上尊重之少君匿其年及所生長常自謂七十而能使物卻老其遊以方遍諸侯無妻子人聞其能使物及不老更饋遺之常餘錢金衣食人皆以為不治産業而饒給又不知其何許人愈信爭事之少君資好方善為巧發奇中嘗從武安侯飲座中有年九十餘者少君乃言與其王父遊射處老人為兒時從其王父識其處一座盡驚少君見上上有古銅器問少君少君曰此器齊桓公十五年陳於柏寢已而案其刻果齊桓公器一宮盡驚以為少君神數百歲人也久之少君病死今世所謂得道之人李少君之類也少君死於人中人見其尸故知少君性壽之人也如少君處山林之中入絶迹之野獨病死於巖石之間尸為虎狼狐狸之食則世復以為真仙去矣世學道之人無少君之壽年未至百與衆俱死愚夫無知之人尚謂之尸解而去其實不死所謂尸解者何等也謂身死精神去乎謂身不死得免去皮膚也如謂身死精神去乎是與死無異人亦仙人也如謂不死免去皮膚乎諸學道死者骨肉具在與恆死之尸無以異也夫蟬之去復育龜之解甲蛇之脫皮鹿之墮角殼皮之物解殼皮持骨肉去可謂尸解矣今學道而死者尸與復育相似尚未可謂尸解何則案蟬之去復育無以神於復育況不相似復育謂之尸解蓋復虛妄失其實矣太史公與李少君同世並時少君之死臨尸者雖非太史公足以見其實矣如實不死尸解而去太史公宜紀其狀不宜言死其處座中年九十老父為兒時者少君老壽之效也或少君年十四五老父為兒隨其王父少君年二百歲而死何為不識武帝去桓公鑄銅器且非少君所及見也或時聞宮殿之內有舊銅器或案其刻以告之者故見而知之今時好事之人見舊劍古鉤多能名之可復謂目見其鑄作之時乎世或言東方朔亦道人也姓金氏字曼倩變姓易名遊宦漢朝外有仕宦之名內乃度世之人此又虛也夫朔與少君並在武帝之時太史公所及見也少君有教穀道祠竈卻老之方又名齊桓公所鑄鼎知九十老人王父所遊射之驗然尚無得道之實而徒性壽遲死之人也況朔無少君之方術效驗世人何見謂之得道案武帝之時道人文成五利之輩入海求仙人索不死之藥有道術之驗故為上所信朔無入海之使無奇怪之效也如使有奇不過少君之類及文成五利之輩耳況謂之有道此或時偶復若少君矣自匿所生之處當時在朝之人不知其故朔盛稱其年長人見其面狀少性又恬淡不好仕宦善逢占卜射覆為怪奇之戲世人則謂之得道之人矣世或以老子之道為可以度世恬淡無欲養精愛氣夫人以精神為壽命精神不傷則壽命長而不死成事老子行之踰百度世為真人矣夫恬淡少欲孰與鳥獸鳥獸亦老而死鳥獸含情欲有與人相類者矣未足以言草木之生何情欲而春生秋死乎夫草木無欲壽不踰歲人多情欲壽至於百此無情欲者反夭有情欲者壽也夫如是老子之術以恬淡無欲延壽度世者復虛也或時老子李少君之類也行恬淡之道偶其性命亦自壽長世見其命壽又聞其恬淡則謂老子以術度世矣世或以辟穀不食為道術之人謂王子喬之輩以不食穀與恆人殊食故與恆人殊壽踰百度世遂為仙人此又虛也夫人之生也稟食飲之性故形上有口齒形下有孔竅口齒以噍食孔竅以注瀉順此性者為得天正道逆此性者為違所稟受失本氣於天何能得久壽使子喬生無齒口孔竅是稟性與人殊稟性與人殊尚未可謂壽況形體均同而以所行者異言其得度世非性之實也夫人之不食也猶身之不衣也衣以溫膚食以充腹膚溫腹飽精神明盛如飢而不飽寒而不溫則有凍餓之害矣凍餓之人安能久壽且人之生也以食為氣猶草木生以土為氣矣拔草木之根使之離土則枯而蚤死閉人之口使之不食則餓而不壽矣道家相誇曰真人食氣以氣而為食故傳曰食氣者壽而不死雖不穀飽亦以氣盈此又虛也夫氣謂何氣也如謂陰陽之氣陰陽之氣不能飽人人或咽氣氣滿腹脹不能饜飽如謂百藥之氣人或服藥食一合屑吞數十丸藥力烈盛胸中憒毒不能飽人食氣者必謂吹詬呼吸吐故納新也昔有彭祖嘗行之矣不能久壽病而死矣道家或以導氣養性度世而不死以為血脈在形體之中不動搖屈伸則閉塞不通不通積聚則為病而死此又虛也夫人之形猶草木之體也草木在高山之巔當疾風之衝晝夜動搖者能復勝彼隱在山谷間鄣於疾風者乎案草木之生動搖者傷而不暢人之導引動搖形體者何故壽而不死夫血脈之藏於身也猶江河之流地江河之流濁而不清血脈之動亦擾不安不安則猶人勤苦無聊也安能得久生乎道家或以服食藥物輕身益氣延年度世此又虛也夫服食藥物輕身益氣頗有其驗若夫延年度世世無其效百藥愈病病愈而氣復氣復而身輕矣凡人稟性身本自輕氣本自長中於風濕百病傷之故身重氣劣也服食良藥身氣復故非本氣少身重得藥而乃氣長身輕也稟受之時本自有之矣故夫服食藥物除百病令身輕氣長復其本性安能延年至於度世有血脈之類無有不生生無不死以其生故知其死也天地不生故不死陰陽不生故不死死者生之效生者死之驗也夫有始者必有終有終者必有始唯無終始者乃長生不死人之生其猶冰也水凝而為冰氣積而為人冰極一冬而釋人竟百歲而死人可令不死冰可令不釋乎諸學仙術為不死之方其必不成猶不能使冰終不釋也
