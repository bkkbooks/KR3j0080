body:
  text: 命祿篇凡人遇偶及遭纍害皆由命也有死生壽夭之命亦有貴賤貧富之命自王公逮庶人聖賢及下愚凡有首目之類含血之屬莫不有命命當貧賤雖富貴之猶涉禍患失其富貴矣命當富貴雖貧賤之猶逢福善離其貧賤矣故命貴從賤地自達命賤從富位自危故夫富貴若有神助貧賤若有鬼禍命貴之人俱學獨達並仕獨遷命富之人俱求獨得並為獨成貧賤反此難達難遷難得難成獲過受罪疾病亡遺失其富貴貧賤矣是故才高行厚未必保其必富貴智寡德薄未可信其必貧賤或時才高行厚命惡廢而不進知寡德薄命善興而超踰故夫臨事知愚操行清濁性與才也仕宦貴賤治産貧富命與時也命則不可勉時則不可力知者歸之於天故坦蕩恬忽雖其貧賤使富貴若鑿溝伐薪加勉力之趨致彊健之勢鑿不休則溝深斧不止則薪多無命之人皆得所願安得貧賤凶危之患哉然則或時溝未通而遇湛薪未多而遇虎仕宦不貴治産不富鑿溝遇湛伐薪逢虎之類也有才不得施有智不得行或施而功不立或行而事不成雖才智如孔子猶無成立之功世俗見人節行高則曰賢哲如此何不貴見人謀慮深則曰辨慧如此何不富貴富有命福祿不在賢哲與辨慧故曰富不可以籌策得貴不可以才能成智慮深而無財才能高而無官懷銀紆紫未必稷契之才積金纍玉未必陶朱之智或時下愚而千金頑魯而典城故官御同才其貴殊命治生鈞知其富異祿祿命有貧富知不能豐殺性命有貴賤才不能進退成王之才不如周公桓公之知不若管仲然成桓受尊命而周管稟卑秩也案古人君希有不學於人臣知博希有不為父師然而人君猶以無能處主位人臣猶以鴻才為厮役故貴賤在命不在智愚貧富在祿不在頑慧世之論事者以才高者當為將相能下者宜為農商見智能之士官位不至怪而訾之曰是必毀於行操行操之士亦怪毀之曰是必乏於才知殊不知才知行操雖高官位富祿有命才智之人以吉盛時舉事而福至人謂才智明審凶衰禍來謂愚暗不知吉凶之命盛衰之祿也白圭子貢轉貨致富積纍金玉人謂術善學明非也主父偃辱賤於齊排擯不用赴闕舉疏遂用於漢官至齊相趙人徐樂亦上書與偃章會上善其言徵拜為郎人謂偃之才樂之慧非也儒者明說一經習之京師明如匡稚圭深如趙鮑子都初階甲乙之科遷轉至郎博士人謂經明才高所得非也而說若范雎之干秦昭封為應侯蔡澤之說范雎拜為客卿人謂雎澤美善所致非也皆命祿貴富善至之時也孔子曰死生有命富貴在天魯平公欲見孟子嬖人臧倉毀孟子而止孟子曰天也孔子聖人孟子賢者誨人安道不失是非稱言命者有命審也淮南書曰仁鄙在時不在行利害在命不在智賈生曰天不可與期道不可與謀遲速有命焉識其時高祖擊黥布為流矢所中疾甚呂后迎良醫醫曰可治高祖罵之曰吾以布衣提三尺劍取天下此非天命乎命乃在天雖扁鵲何益韓信與帝論兵謂高祖曰陛下所謂天授非智力所得揚子雲曰遇不遇命也太史公曰富貴不違貧賤貧賤不違富貴是謂從富貴為貧賤從貧賤為富貴也夫富貴不欲為貧賤貧賤自至貧賤不求為富貴富貴自得也春夏囚死秋冬王相非能為之也日朝出而暮入非能求之也天道自然代王自代入為文帝周亞夫以庶子為條侯此時代王非太子亞夫非適嗣逢時遇會卓然卒至命貧以力勤致富富至而死命賤以才能取貴貴至而免才力而致富貴命祿不能奉持猶器之盈量手之持重也器受一升以一升則平受之如過一升則滿溢也手舉一鈞以一鈞則平舉之過一鈞則躓仆矣前世明是非歸之於命也命審然也信命者則可幽居俟時不須勞精苦形求索之也猶珠玉之在山澤不求貴價於人人自貴之天命難知人不耐審雖有厚命猶不自信故必求之也如自知雖逃富避貴終不得離故曰力勝貧慎勝禍勉力勤事以致富砥才明操以取貴農夫力耕得穀多商賈遠行得利深廢時失務欲望富貴不可得也雖云有命當須索之如信命不求謂當自至可不假而自得不作而自成不行而自至夫命富之人筋力自彊命貴之人才智自高若千里之馬氣力自徑頭目蹄足自相副也有求而不得者矣未必不求而得之者也精學不求貴貴自至矣力作不求富富自到矣富貴之福不可求致貧賤之禍不可苟除也由此言之有富貴之命不求自得信命者曰自知吉不待求也天命吉厚不求自得天命凶厚求之無益夫物不求而自生則人亦有不求貴而自貴者矣人情有不教而自善者有教而終不善者矣天性猶命也越王翳逃山中至誠不願自冀得代越人燻其穴遂不得免彊立為君而天命當然雖逃避之終不得離故夫不求自得之貴歟
