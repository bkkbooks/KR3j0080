body:
  text: 氣壽篇凡人稟命有二品一曰所當觸值之命二曰彊弱壽夭之命所當觸值謂兵燒壓溺也彊壽弱夭謂稟氣渥薄也兵燒壓溺遭以所稟為命未必有審期也若夫彊弱夭壽以百為數不至百者氣自不足也夫稟氣渥則其體彊體彊則其命長氣薄則其體弱體弱則其命短命短則多病壽短始生而死未産而傷稟之薄弱也渥彊之人必卒其壽若夫無所遭遇虛居困劣短氣而死此稟之薄用之竭也此與始生而死未産而傷一命也皆由稟氣不足不自致於百也人之稟氣或充實而堅強或虛劣而軟弱充實堅強其年壽虛劣軟弱失棄其身天地生物物有不遂父母生子子有不就物有為實枯死而墮人有為兒夭命而傷使實不枯亦至滿歲使兒不傷亦至百年然為實兒而死枯者稟氣薄則雖形體完其虛劣氣少不能充也兒生號啼之聲鴻朗高暢者壽嘶喝濕下者夭何則稟壽夭之命以氣多少為主性也婦人疏字者子活數乳者子死譬若瓠華多實少也何則疏而氣渥子堅彊數而氣薄子軟弱也懷子而前已産子死則謂所懷不活名之曰懷其意以為已産之子死故感傷之子失其性矣所産子死所懷子凶者字乳亟數氣薄不能成也雖成人形體則易感傷獨先疾病病獨不治百歲之命是其正也不能滿百者雖非正猶為命也譬猶人形一丈正形也名男子為丈夫尊公嫗為丈人不滿丈者失其正也雖失其正猶乃為形也夫形不可以不滿丈之故謂之非形猶命不可以不滿百之故謂之非命也非天有長短之命而人各有稟受也由此言之人受氣命於天卒與不卒同也語曰圖王不成其弊可以霸霸者王之弊也霸本當至於王猶壽當至於百也不能成王退而為霸不能至百消而為夭王霸同一業優劣異名壽夭或一氣長短殊數何以知不滿百為夭者百歲之命也以其形體小大長短同一等也百歲之身五十之體無以異也身體不異血氣不殊鳥獸與人異形故其年壽與人殊數何以明人年以百為壽也世間有矣儒者說曰太平之時人民侗長百歲左右氣和之所生也堯典曰朕在位七十載求禪得舜舜徵三十歲在位堯退而老八歲而終至殂落九十八歲未在位之時必已成人今計數百有餘矣又曰舜生三十徵用二十在位五十載陟方乃死適百歲矣文王謂武王曰我百爾九十吾與爾三焉文王九十七而薨武王九十三而崩周公武王之弟也兄弟相差不過十年武王崩周公居攝七年復政退老出入百歲矣邵公周公之兄也至康王之時尚為太保出入百有餘歲矣聖人稟和氣故年命得正數氣和為治平故太平之世多長壽人百歲之壽蓋人年之正數也猶物至秋而死物命之正期也物先秋後秋則亦如人死或增百歲或減百也先秋後秋為期增百減百為數物或出地而死猶人始生而夭也物或踰秋不死亦如人年多度百至於三百也傳稱老子二百餘歲邵公百八十高宗享國百年周穆王享國百年並未享國之時皆出百三十四十歲矣
