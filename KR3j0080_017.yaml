body:
  text: 變虛篇傳書曰宋景公之時熒惑守心公懼召子韋而問之曰熒惑在心何也子韋曰熒惑天罰也心宋分野也禍當君雖然可移於宰相公曰宰相所使治國家也而移死焉不祥子韋曰可移於民公曰民死寡人將誰為君也寧獨死耳子韋曰可移於歲公曰民饑必死為人君而欲殺其民以自活也其誰以我為君者乎是寡人之命固盡也子毋復言子韋還走北面再拜曰臣敢賀君天之處高而聽卑君有君人之言三天必三賞君今夕星必徙三舍君延命二十一年公曰奚知之對曰君有三善言故有三賞星必三徙三徙行七星星當一年三七二十一故君命延二十一歲臣請伏於陛下以伺之星必不徙臣請死耳是夕也火星果徙三舍如子韋之言則延年審得二十一歲矣星徙審則延命延命明則景公為善天祐之也則夫世間人能為景公之行者則必得景公祐矣此言虛也何則皇天遷怒使熒惑本景公身有惡而守心則雖聽子韋言猶無益也使其不為景公則雖不聽子韋之言亦無損也齊景公時有彗星使人禳之晏子曰無益也秪取誣焉天道不闇不貳其命若之何禳之也且天之有彗以除穢也君無穢德又何禳焉若德之穢禳之何益詩曰惟此文王小心翼翼昭事上帝聿懷多福厥德不回以受方國君無回德方國將至何患於彗詩曰我無所監夏后及商用亂之故民卒流亡若德回亂民將流亡祝史之為無能補也公說乃止齊君欲禳彗星之凶猶子韋欲移熒惑之禍也宋君不聽猶晏子不肯從也則齊君為子韋晏子為宋君也同變共禍一事二人天猶賢宋君使熒惑徙三舍延二十一年獨不多晏子使彗消而增其壽何天祐善偏駮不齊一也人君有善言善行善行動於心善言出於意同由共本一氣不異宋景公出三善言則其先三善言之前必有善行也有善行必有善政政善則嘉瑞臻福祥至熒惑之星無為守心也使景公有失誤之行以致惡政惡政發則妖異見熒惑之守心猶榖之生朝高宗消桑榖之變以政不以言景公卻熒惑之異亦宜以行景公有惡行故熒惑守心不改政修行坐出三善言安能動天天安肯應何以效之使景公出三惡言能使熒惑守心乎夫三惡言不能使熒惑守心三善言安能使熒惑退徙三舍以三善言獲二十一年如有百善言得千歲之壽乎非天祐善之意應誠為福之實也子韋之言天處高而聽卑君有君人之言三天必三賞君夫天體也與地無異諸有體者耳咸附於首體與耳殊未之有也天之去人高數萬里使耳附天聽數萬里之語弗能聞也人坐樓臺之上察地之螻蟻尚不見其體安能聞其聲何則螻蟻之體細不若人形大聲音孔氣不能達也今天之崇高非直樓臺人體比於天非若螻蟻於人也謂天非若螻蟻於人也謂天聞人之言隨善惡為吉凶誤矣四夷入諸夏因譯而通同形均氣語不相曉雖五帝三王不能去譯獨曉四夷況天與人異體音與人殊乎人不曉天所為天安能知人所行使天體乎耳高不能聞人言使天氣乎氣若雲煙安能聽人辭說災變之家曰人在天地之間猶魚在水中矣其能以行動天地猶魚鼓而振水也魚動而水蕩氣變此非實事也假使真然不能至天魚長一尺動於水中振旁側之水不過數尺大若不過與人同所振蕩者不過百步而一里之外澹然澄靜離之遠也今人操行變氣遠近宜與魚等氣應而變宜與水均以七尺之細形形中之微氣不過與一鼎之蒸火同從下地上變皇天何其高也且景公賢者也賢者操行上不及聖下不過惡人世間聖人莫不堯舜惡人莫不桀紂堯舜操行多善無移熒惑之效桀紂之政多惡有反景公脫禍之驗景公出三善言延年二十一歲是則堯舜宜獲千歲桀紂宜為殤子今則不然各隨年壽堯舜桀紂皆近百載是竟子韋之言妄延年之語虛也且子韋之言曰熒惑天使也心宋分野也禍當君若是者天使熒惑加禍於景公也如何可移於將相若歲與國民乎天之有熒惑也猶王者之有方伯也諸侯有當死之罪使方伯圍守其國國君問罪於臣臣明罪在君雖然可移於臣子與人民設國君許其言令其臣歸罪於國方伯聞之肯聽其言釋國君之罪更移以付國人乎方伯不聽者自國君之罪非國人之辜也方伯不聽自國君之罪榮惑安肯移禍於國人若此子韋之言妄也曰景公聽乎言庸何能動天使諸侯不聽其臣言引過自予方伯聞其言釋其罪委之去乎方伯不釋諸侯之罪熒惑安肯徙去三舍夫聽與不聽皆無福善星徙之實未可信用天人同道好惡不殊人道不然則知天無驗矣宋衛陳鄭之俱災也氣變見天梓慎知之請於子產有以除之子產不聽天道當然人事不能卻也使子產聽梓慎四國能無災乎堯遭鴻水時臣必有梓慎子韋之知矣然而不卻除者堯與子產同心也案子韋之言曰熒惑天使也心宋分野也禍當君審如此言禍不可除星不可卻也若夫寒溫失和風雨不時政事之家謂之失誤所致可以善政賢行變而復也若熒惑守心若必死猶亡禍安可除修政改行安能卻之善政賢行尚不能卻出虛華之三言謂星卻而禍除增壽延年享長久之福誤矣觀子韋之言景公言熒惑之禍非寒暑風雨之類身死命終之祥也國且亡身且死祅氣見於天容色見於面面有容色雖善操行不能滅死徵已見也在體之色不可以言行滅在天之妖安可以治除乎人病且死色見於面人或謂之曰此必死之徵也雖然可移於五鄰若移於奴役當死之人正言不可容色肯為善言之故滅而當死之命肯為之長乎氣不可滅命不可長然則熒惑安可卻景公之年安可增乎由此言之熒惑守心未知所為故景公不死也且言星徙三舍者何謂也星三徙於一舍乎一徙歷於三舍也案子韋之言曰君有君人之言三天必三賞君今夕星必徙三舍若此星竟徙三舍也夫景公一坐有三善言星徙三舍如有十善言星徙十舍乎熒惑守心為善言卻如景公復出三惡言熒惑食心乎為善言卻為惡言進無善無惡熒惑安居不行動乎或時熒惑守心為旱災不為君薨子韋不知以為死禍信俗至誠之感熒惑之處星必偶自當去景公自不死世則謂子韋之言審景公之誠感天矣亦或時子韋知星行度適自去自以著己之知明君臣推讓之所致見星之數七因言星七舍復得二十一年因以星舍計年之數是與齊太卜無以異也齊景公問太卜曰子之道何能對曰能動地晏子往見公公曰寡人問太卜曰子道何能對曰能動地地固可動乎晏子嘿然不對出見太卜曰昔吾見鉤星在房心之間地其動乎太卜曰然晏子出太卜走見公曰臣非能動地地固將自動夫子韋言星徙猶太卜言地動也地固且自動太卜言己能動之星固將自徙子韋言君能徙之使晏子不言鉤星在房心間則太卜之姦對不覺宋無晏子之知臣故子韋之一言遂售其欺耳案子韋書錄序奏亦言子韋曰君出三善言熒惑宜有動於是候之果徙舍不言三或時星當自去子韋以為驗實動離舍世增言三既空增三舍之數又虛生二十一年之壽也
