body:
  text: 自紀篇王充者會稽上虞人也字仲任其先本魏郡元城人孫一幾世嘗從軍有功封會稽陽亭一歲倉卒國絶因家焉以農桑為業世祖勇任氣卒咸不揆於人歲凶橫道傷殺怨讎衆多會世擾亂恐為怨讎所擒祖父泛舉家簷載就安會稽留錢唐縣以賈販為事生子二人長曰蒙少曰誦誦即充父祖世任氣至蒙誦滋甚故蒙誦在錢唐勇勢凌人末復與豪家丁伯等結怨舉家徙處上虞建武三年充生為小兒與儕倫遨戲不好狎侮儕倫好掩雀捕蟬戲錢林熙充獨不肯誦奇之六歲教書恭願仁順禮敬具備矜莊寂寥有巨人之志父未嘗笞母未嘗非閭里未嘗讓八歲出於書館書館小僮百人以上皆以過失袒謫或以書醜得鞭充書日進又無過失手書既成辭師受論語尚書日諷千字經明德就謝師而專門援筆而衆奇所讀文書亦日博多才高而不尚苟作口辨而不好談對非其人終日不言其論説始若詭於衆極聽其終衆乃是之以筆著文亦如此焉操行事上亦如此焉在縣位至掾功曹在都尉府位亦掾功曹在太守為列掾五官功曹行事入州為從事不好徼名於世不為利害見將常言人長希言人短專薦未達解已進者過及所不善亦弗譽有過不解亦弗復陷能釋人之大過亦悲夫人之細非好自周不肯自彰勉以行操為基恥以材能為名衆會乎坐不問不言賜見君將不及不對在鄉里慕蘧伯玉之節在朝廷貪史子魚之行見汙傷不肯自明位不進亦不懷恨貧無一畝庇身志佚於王公賤無斗石之秩意若食萬鍾得官不欣失位不恨處逸樂而欲不放居貧苦而志不倦淫讀古文甘聞異言世書俗説多所不安幽處獨居考論實虛充為人清重遊必擇友不好苟交所友位雖微卑年雖幼稚行苟離俗必與之友好傑友雅徒不泛結俗材俗材因其微過蜚條陷之然終不自明亦不非怨其人或曰有良材奇文無罪見陷胡不自陳羊勝之徒摩口膏舌鄒陽自明入獄復出苟有全完之行不宜為人所缺既耐勉自伸不宜為人所屈答曰不清不見塵不高不見危不廣不見削不盈不見虧士茲多口為人所陷蓋亦其宜好進故自明憎退故自陳吾無好憎故默無言羊勝為讒或使之也鄒陽得免或拔之也孔子稱命孟子言天吉凶安危不在於人昔人見之故歸之於命委之於時浩然恬忽無所怨尤福至不謂己所得禍到不謂己所為故時進意不為豐時退志不為虧不嫌虧以求盈不違險以趨平不鬻智以干祿不辭爵以弔名不貪進以自明不惡退以怨人同安危而齊死生鈞吉凶而一敗成遭十羊勝謂之無傷動歸於天故不自明充性恬淡不貪富貴為上所知拔擢越次不慕高官不為上所知貶黜抑屈不恚下位比為縣吏無所擇避或曰心難而行易好友同志仕不擇地濁操傷行世何效放答曰可效放者莫過孔子孔子之仕無所避矣為乘田委吏無於邑之心為司空相國無説豫之色舜耕歷山若終不免及受堯禪若卒自得憂德之不豐不患爵之不尊恥名之不白不惡位之不遷垂棘與瓦同櫝明月與礫同囊苟有二寶之質不害為世所同世能知善雖賤猶顯不能別白雖尊猶辱處卑與尊齊操位賤與貴比德斯可矣俗性貪進忽退收成棄敗充升擢在位之時衆人蟻附廢退窮居舊故叛去志俗人之寡恩故間居作譏俗節義十二篇冀俗人觀書而自覺故直露其文集以俗言或譴謂之淺答曰以聖典而示小雅以雅言而説丘野不得所曉無不逆者故蘇秦精説於趙而李兌不説商鞅以王説秦而孝公不用夫不得心意所欲雖盡堯舜之言猶飲牛以酒啖馬以脯也故鴻麗深懿之言關於大而不通於小不得已而強聽入胸者少孔子失馬於野野人閉不與子貢妙稱而怒馬圄諧説而喜俗曉形露之言勉以深鴻之文猶和神仙之藥以治齀咳制貂狐之裘以取薪菜也且禮有所不偫事有所不須斷決知辜不必皋陶調和葵韭不俟狄牙閭巷之樂不用韶武里母之祀不待太牢既有不須而又不宜牛刀割雞舒戟采葵鈇鉞裁箸盆盎酌卮大小失宜善之者希何以為辨喻深以淺何以為智喻難以易賢聖銓材之所宜故文能為深淺之差充既疾俗情作譏俗之書又閔人君之政徒欲治人不得其宜不曉其務愁精苦思不睹所趨故作政務之書又傷偽書俗文多不實誠故為論衡之書夫賢聖歿而大義分蹉跎殊趨各自開門通人觀覽不能訂銓遙聞傳授筆寫耳取在百歲之前歷日彌久以為昔古之事所言近是信之入骨不可自解故作實論其文盛其辨爭浮華虛偽之語莫不證定沒華虛之文存敦厖之朴撥流失之風反宓戲之俗充書形露易觀或曰口辨者其言深筆敏者其文沉案經藝之文賢聖之言鴻重優雅難卒曉睹世讀之者訓古乃下蓋賢聖之材鴻故其文語與俗不通玉隱石間珠匿魚腹非玉工珠師莫能采得寶物以隱閉不見實語亦宜深沉難測譏俗之書欲悟俗人故形露其指為分別之文論衡之書何為復然豈材有淺極不能為深覆何文之察與彼經藝殊軌轍也答曰玉隱石間珠匿魚腹故為深覆及玉色剖於石心珠光出於魚腹其猶隱乎吾文未集於簡札之上藏於胸臆之中猶玉隱珠匿也及出荴露猶玉剖珠出乎爛若天文之照順若地理之曉嫌疑隱微盡可名處且名白事自定也論衡者論之平也口則務在明言筆則務在露文高士之文雅言無不可曉指無不可睹觀讀之者曉然若盲之開目聆然若聾之通耳三年盲子卒見父母不察察相識安肯説喜道畔巨樹塹邊長溝所居昭察人莫不知使樹不巨而隱溝不長而匿以斯示人堯舜猶惑人面色部七十有餘頰股明潔五色分別隱微憂喜皆可得察占射之者十不失一使面黝而黑醜垢重襲而覆部占射之者十而失九夫文由語也或淺露分別或深迂優雅孰為辨者故口言以明志言恐滅遺故著之文字文字與言同趨何為猶當隱閉指意獄當嫌辜卿決疑事渾沌難曉與彼分明可知孰為良吏夫口論以分明為公筆辨以荴露為通吏文以昭察為良深覆典雅指意難覩唯賦頌耳經傳之文賢聖之語古今言殊四方談異也當言事時非務難知使指意閉隱也後人不曉世相離遠此名曰語異不名曰材鴻淺文讀之難曉名曰不巧不名曰知明秦始皇讀韓非之書嘆曰猶獨不得此人同時其文可曉故其事可思如深鴻優雅須師乃學投之於地何嘆之有夫筆著者欲其易曉而難為不貴難知而易造口論務解分而可聽不務深迂而難睹孟子相賢以眸子明瞭者察文以義可曉充書違詭於俗或難曰文貴夫順合衆心不違人意百人讀之莫譴千人聞之莫怪故管子曰言室滿室言堂滿堂今殆説不與世同故文刺於俗不合於衆答曰論貴是而不務華事尚然而不高合論説辨然否安得不譎常心逆俗耳衆心非而不從故喪黜其偽而存定其真如當從衆順人心者循舊守雅諷習而已何辨之有孔子侍坐於魯哀公公賜桃與黍孔子先食黍而後啖桃可謂得食序矣然左右皆掩口而笑貫俗之日久也今吾實猶孔子之序食也俗人違之猶左右之掩口也善雅歌於鄭為不悲禮舞於趙為不好堯舜之典伍伯不肯觀孔墨之籍季孟不肯讀寧危之計黜於閭巷撥世之言訾於品俗有美味於斯俗人不嗜狄牙甘食有寶玉於是俗人投之卞和佩服孰是孰非可信者誰禮俗相背何世不然魯文逆祀去者三人定公順祀畔者五人蓋獨是之語高士不舍俗夫不好惑衆之書賢者欣頌愚者逃頓充書不能純美或曰口無擇言筆無擇文文必麗以好言必辨以巧言瞭於耳則事味於心文察於目則篇留於手故辨言無不聽麗文無不寫今新書既在論譬説俗為戾又不美好於觀不快蓋師曠調音曲無不悲狄牙和膳肴無淡味然則通人造書文無瑕穢呂氏淮南懸於市門觀讀之者無訾一言今無二書之美文雖衆盛猶多譴毀答曰夫養實者不育華調行者不飾辭豐草多華英茂林多枯枝為文欲顯白其為安能令文而無譴毀救火拯溺義不得好辨論是非言不得巧入澤隨龜不暇調足深淵捕蛟不暇定手言姦辭簡指趨妙遠語甘文峭務意淺小稻穀千鍾粳皮太半閲錢滿億穿決出萬大羹必有淡味至寶必有瑕穢大簡必有大好良工必有不巧然則辨言必有所屈通文猶有所黜言金由貴家起文糞自賤室出淮南呂氏之無纍害所由出者家富官貴也夫貴故得懸於市富故有千金副觀讀之者惶恐畏忌雖見乖不合焉敢譴一字充書既成或稽合於古不類前人或曰謂之飾文偶辭或徑或迂或屈或舒謂之論道實事委璅文給甘酸諧於經不驗集於傳不合稽之子長不當內之子雲不入文不與前相似安得名佳好稱工巧答曰飾貌以強類者失形調辭以務似者失情百夫之子不同父母殊類而生不必相似各以所稟自為佳好文必有與合然后稱善是則代匠斫不傷手然后稱工巧也文士之務各有所從或調辭以巧文或辨偽以實事必謀慮有合文辭相襲是則五帝不異事三王不殊業也美色不同面皆佳於目悲音不共聲皆快於耳酒醴異氣飲之皆醉百穀殊味食之皆飽謂文當與前合是謂舜眉當復八采禹目當復重瞳充書文重或曰文貴約而指通言尚省而趍明辨士之言要而達文人之辭寡而章今所作新書出萬言繁不省則讀者不能盡篇非一則傳者不能領被躁人之名以多為不善語約易言文重難得玉少石多多者不為珍龍少魚衆少者固為神答曰有是言也蓋寡言無多而華文無寡為世用者百篇無害不為用者一章無補如皆為用則多者為上少者為下纍積千金比於一百孰為富者蓋文多勝寡財富愈貧世無一卷吾有百篇人無一字吾有萬言孰者為賢今不曰所言非而云泰多不曰世不好善而云不能領斯蓋吾書所以不得省也夫宅舍多土地不得小戶口衆簿籍不得少今失實之事多華虛之語衆指實定宜辨爭之言安得約徑韓非之書一條無異篇以十第文以萬數夫形大衣不得褊事衆文不得褊事衆文饒水大魚多帝都穀多王市肩磨書雖文重所論百種按古太公望近董仲舒傳作書篇百有餘吾書亦才出百而云泰多蓋謂所以出者微觀讀之者不能不譴呵也河水沛沛比夫衆川孰者為大蟲繭重厚稱其出絲孰為多者充仕數不耦而徒著書自紀或戲曰所貴鴻材者仕宦耦合身容説納事得功立故為高也今吾子涉世落魄仕數黜斥材未練於事力未盡於職故徒幽思屬文著記美言何補於身衆多欲以何趍乎答曰材鴻莫過孔子孔子才不容斥逐伐樹接浙見圍削迹困餓陳蔡門徒菜色今吾材不逮孔子不偶之厄未與之等偏可輕乎且達者未必知窮者未必愚遇者則得不遇失之故夫命厚祿善庸人尊顯命薄祿惡奇俊落魄必以偶合稱材量德則夫專城食土者材賢孔墨身貴而名賤則居潔而行墨食千鍾之祿無一長之德乃可戲也若夫德高而名白官卑而祿泊非才能之過未足以為纍也士願與憲共廬不慕與賜同衡樂與夷俱旅不貪與跖比迹高士所貴不與俗均故其名稱不與世同身與草木俱朽聲與日月並彰行與孔子比窮文與楊雄為雙吾榮之身通而知困官大而德細於彼為榮於我為纍偶合容説身尊體佚百載之後與物俱歿名不流於一嗣文不遺於一札官雖傾倉文德不豐非吾所臧德汪濊而淵懿知滂沛而盈溢筆瀧漉而雨集言溶㵠而泉出富材羡知貴行尊志體列於一世名傳於千載乃吾所謂異也充細族孤門或啁之曰宗祖無淑懿之基文墨無篇籍之遺雖著鴻麗之論無所稟階終不為高夫氣無漸而卒至曰變物無類而妄生曰異不常有而忽見曰妖詭於衆而突出曰怪吾子何祖其先不載況未嘗履墨塗出儒門吐論數千萬言宜為妖變安得寶斯文而多賢答曰鳥無世鳳皇獸無種麒麟人無祖聖賢物無常嘉珍才高見屈遭時而然士貴故孤興物貴故獨産文孰常在有以放賢是則醴泉有故源而嘉禾有舊根也屈奇之士見倜儻之辭生度不與俗協庸甬不能程是故罕發之迹記於牒籍希出之物勒於鼎銘五帝不一世而起伊望不同家而出千里殊迹百載異發士貴雅材而慎興不因高據以顯達母驪犢騂無害犧牲祖濁裔清不榜奇人鯀惡禹聖叟頑舜神伯牛寢疾仲弓潔全顏路庸固回傑超倫孔墨祖愚丘翟聖賢楊家不通卓有子雲桓氏稽可遹出君山更稟於元故能著文充以元和三年徙家辟難詣楊州部丹陽九江廬江後入為治中材小任大職在刺割筆札之思歷年寢廢章和二年罷州家居年漸七十時可懸輿仕路隔絶志窮無如事有否然身有利害髮白齒落日月踰邁儔倫彌索鮮所恃賴貧無供養志不娛快曆數冉冉庚辛域際雖懼終徂愚猶沛沛乃作養性之書凡十六篇養氣自守適食則酒閉明塞聰愛精自保適輔服藥引導庶冀性命可延斯須不老既晚無還垂書示後惟人性命長短有期人亦蟲物生死一時年歷但訖孰使留之猶入黃泉消為土灰上自黃唐下臻秦漢而來折衷以聖道析理於通材如衡之平如鑑之開幼老生死古今罔不詳該命以不延吁嘆悲哉
