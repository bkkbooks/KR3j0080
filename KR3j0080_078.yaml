body:
  text: 實知篇儒者論聖人以為前知千歲後知萬世有獨見之明獨聽之聰事來則名不學自知不問自曉故稱聖聖則神矣若蓍龜之知吉凶蓍草稱神龜稱靈矣賢者才下不能及智劣不能料故謂之賢夫名異則實殊質同則稱鈞以聖名論之知聖人卓絶與賢殊也孔子將死遺讖書曰不知何一男子自謂秦始皇上我之堂踞我之床顛倒我衣裳至沙丘而亡其後秦王兼吞天下號始皇巡狩至魯觀孔子宅乃至沙丘道病而崩又曰董仲舒亂我書其後江都相董仲舒論思春秋造著傳記又書曰亡秦者胡也其後二世胡亥竟亡天下用三者論之聖人後知萬世之效也孔子生不知其父若母匿之吹律自知殷宋大夫子氏之世也不案圖書不聞人言吹律精思自知其世聖人前知千歲之驗也曰此皆虛也案神怪之言皆在讖記所表皆效圖書亡秦者胡河圖之文也孔子條暢增益以表神怪或後人詐記以明效驗高皇帝封吳王送之拊其背曰漢後五十年東南有反者豈汝邪到景帝時濞與七國通謀反漢建此言者或時觀氣見象處其有反不知主名高祖見濞之勇則謂之是原此以論孔子見始皇仲舒或時但言將有觀我之宅亂我之書後人見始皇入其宅仲舒讀其書則增益其辭著其主名如孔子神而空見始皇仲舒則其自為殷後子氏之世亦當默而知之無為吹律以自定也孔子不吹律不能立其姓及其見始皇睹仲舒亦復以吹律之類矣案始皇本事始皇不至魯安得上孔子之堂踞孔子之床顛倒孔子之衣裳乎始皇三十七年十月癸丑出遊至雲夢望祀虞舜於九嶷浮江下觀藉柯度梅渚過丹陽至錢唐臨浙江濤惡乃西百二十里從陜中度上會稽祭大禹立石刊頌望于南海還過吳從江乘渡旁海上北至琅邪自琅邪北至榮成山因至之罘遂並海西至平原津而病崩於沙丘平臺既不至魯讖記何見而云始皇至魯至魯未可知其言孔子曰不知何一男子之言亦未可用不知何一男子之言不可用則言董仲舒亂我書亦復不可信也行事文記譎常人言耳非天地之書則皆緣前因古有所據狀如無聞見則無所狀凡聖人見禍福也亦揆端推類原始見終從閭巷論朝堂由昭昭察冥冥讖書祕文遠見未然空虛暗昧豫睹未有達聞暫見卓譎怪神若非庸口所能言放象事類以見禍推原往驗以處來事賢者亦能非獨聖也周公治魯太公知其後世當有削弱之患太公治齊周公睹其後世當有劫弒之禍見法術之極睹禍亂之前矣紂作象箸而箕子譏魯以偶人葬而孔子嘆緣象箸見龍干之患偶人睹殉葬之禍也太公周公俱見未然箕子孔子並睹未有所由見方來者賢聖同也魯侯老太子弱次室之女倚柱而嘯由老弱之徵見敗亂之兆也婦人之知尚能推類以見方來況聖人君子才高智明者乎秦始皇七年嚴襄王母夏太后薨孝文王后曰華陽后與文王葬壽陵夏太后子嚴襄王葬於范陵故夏太后別葬杜陵曰東望吾子西望吾夫後百年旁當有萬家邑其後皆如其言必以推類見方來為聖次室夏太后聖也秦昭王七年樗里子卒葬于渭南章臺之東曰後百年當有天子宮挾我墓至漢興長樂宮在其東未央宮在其西武庫正值其墓竟如其言先知之效見方來之驗也如以此效聖樗里子聖人也如非聖人先知見方來不足以明聖然則樗里子見天子宮挾其墓也亦猶辛有知伊川之當戎昔辛有過伊川見被髮而祭者曰不及百年此其戎乎其後百年晉遷陸渾之戎於伊川焉竟如其言辛有之知當戎見被髮之兆也樗里子之見天子宮挾其墓亦見博平之墓也韓信葬其母亦行營高敞地令其旁可置萬家其後竟有萬家處其墓旁故樗里子之見博平王有宮臺之兆猶韓信之睹高敞萬家之臺也先知之見方來之事無達視洞聽之聰明皆案兆察迹推原事類春秋之時卿大夫相與會遇見動作之變聽言談之詭善則明吉祥之福惡則處凶妖之禍明福處禍遠圖未然無神怪之知皆由兆類以今論之故夫可知之事者思慮所能見也不可知之事不學不問不能知也不學自知不問自曉古今行事未之有也夫可知之事惟精思之雖大無難不可知之事厲心學問雖小無易故智能之士不學不成不問不知難曰夫項託年七歲教孔子案七歲未入小學而教孔子性自知也孔子曰生而知之上也學而知之其次也夫言生而知之不言學問謂若項託之類也王莽之時勃海尹方年二十一無所師友性智開敏明達六藝魏都牧淳于倉奏方不學得文能讀誦論義引五經文文説議事厭合人之心帝徵方使射蜚蟲策射無弗知者天下謂之聖人夫無所師友明達六藝本不學書得文能讀此聖人也不學自能無師自達非神如何曰雖無師友亦已有所問受矣不學書已弄筆墨矣兒始生産耳目始開雖有聖性安能有知項託七歲其三四歲時而受納人言矣尹方年二十一其十四五時多聞見矣性敏才茂獨思無所據不睹兆象不見類驗卻念百世之後有馬生牛牛生驢桃生李李生梅聖人能知之乎臣弒君子弒父仁如顏淵孝如曾參勇如賁育辨如賜豫聖人能見之乎孔子曰其或繼周者雖百世可知也又曰後生可畏焉知來者之不如今也論損益言可知稱後生言焉知後生難處損益易明也此尚為遠非所聽察也使一人立於牆東令之出聲使聖人聽之牆西能知其黑白短長鄉里姓字所自從出乎溝有流澌澤有枯骨髮首陋亡肌肉腐絶使聖人詢之能知其農商老少若所犯而坐死乎非聖人無知其知無以知也知無以知非問不能知也不能知則賢聖所共病也難曰詹何坐弟子侍有牛鳴於門外弟子曰是黑牛也而白蹄詹何曰然是黑牛也而白其蹄使人視之果黑牛而以布裹其蹄詹何賢者也尚能聽聲而知其色以聖人之智反不能知乎曰能知黑牛白其蹄能知此牛誰之牛乎白其蹄者以何事乎夫術數直見一端不能盡其實雖審一事曲辨問之輒不能盡知何則不目見口問不能盡知也魯僖公二十九年介葛盧來朝舍于昌衍之上聞牛鳴曰是牛生三犧皆已用矣或問何以知之曰其音云人問牛主竟如其言此復用術數非知所能見也廣漢楊翁仲能聽鳥獸之音乘蹇馬之野而田間有放眇馬者相去數里鳴聲相聞翁仲謂其御曰彼放馬知此馬而目眇其御曰何以知之曰罵此轅中馬蹇此馬亦罵之眇其御不信使往視之馬目竟眇焉翁仲之知馬聲猶詹何介葛盧之聽牛鳴也據術任數相合其意不達視洞聽遙見流目以察之也夫聽聲有術則察色有數矣推用術數若先聞見衆人不知則謂神聖若孔子之見獸名曰狌狌太史公之見張良似婦人之形矣案孔子未嘗見狌狌至輒能名之太史公與張良異世而目見其形使衆人聞此言則謂神而先知然而孔子名狌狌聞昭人之歌太史公之見張良觀宣室之畫也陰見默識用思深祕衆人闊略寡所意識見賢聖之名物則謂之神推此以論詹何見黑牛白蹄猶此類也彼不以術數則先時聞見於外矣方今占射事之工據正術數術數不中集以人事人事於術數而用之者與神無異詹何之徒方今占射事者之類也如以詹何之徒性能知之不用術數是則巢居者先知風穴處者先知雨智明早成項託尹方其是也難曰黃帝生而神靈弱而能言帝嚳生而自言其名未有聞見於外生輒能言稱其名非神靈之效生知之驗乎曰黃帝生而言然而母懷之二十月生計其月數亦已二歲在母身中矣帝嚳能自言其名然不能言他人之名雖有一能未能遍通所謂神而生知者豈謂生而能言其名乎乃謂不受而能知之未得能見之也黃帝帝嚳雖有神靈之驗亦皆早成之才也人才早成亦有晚就雖未就師家問室學人見其幼成早就稱之過度云項託七歲是必十歲云教孔子是必孔子問之云黃帝帝嚳生而能言是亦數月云尹方年二十一是亦且三十云無所師友有不學書是亦遊學家習世俗褒稱過實毀敗踰惡世俗傳顏淵年十八歲升太山望見吳昌門外有繫白馬定考實顏淵年三十不升太山不望吳昌門項託之稱尹方之譽顏淵之類也人才有高下知物由學學之乃知不問不識子貢曰夫子焉不學而亦何常師之有孔子曰吾十有五而志乎學五帝三王皆有所師曰是欲為人法也曰精思亦可為人法何必以學者事難空知賢聖之才能立也所謂神者不學而知所謂聖者須學以聖以聖人學知其非聖天地之間含血之類無性知者狌狌知往鳱鵲知來稟天之性自然者也如以聖人為若狌狌乎則夫狌狌之類鳥獸也僮謠不學而知可謂神而先知矣如以聖人為若僮謠乎則夫僮謠者妖也世間聖神以為巫與鬼神用巫之口告人如以聖人為若巫乎則夫為巫者亦妖也與妖同氣則與聖異類矣巫與聖異則聖不能神矣不能神則賢之黨也同黨則所知者無以異也及其有異以入道也聖人疾賢者遲賢者才多聖人智多所知同業多少異量所道一途步騶相過事有難知易曉賢聖所共關思也若夫文質之復三教之重正朔相緣損益相因賢聖所共知也古之水火今之水火也今之聲色後世之聲色也鳥獸草木人民好惡以今而見古以此而知來千歲之前萬世之後無以異也追觀上古探察來世文質之類水火之輩賢聖共之見兆聞象圖畫禍福賢聖共之見怪名物無所疑惑賢聖共之事可知者賢聖所共知也不可知者聖人亦不能知也何以明之使聖空坐先知雨也性能一事知遠道孔竅不普未足以論也所論先知性達者盡知萬物之性畢睹千道之要也如知一不通二達左不見右偏駮不純踦校不具非所謂聖也如必謂之聖是明聖人無以奇也詹何之徒聖孔子之黨亦稱聖是聖無以異於賢賢無以乏於聖也賢聖皆能何以稱聖奇於賢乎如俱任用術數賢何以不及聖實者聖賢不能性知須任耳目以定情實其任耳目也可知之事思之輒決不可知之事待問乃解天下之事世間之物可思而知愚夫能開精不可思而知上聖不能省孔子曰吾嘗終日不食終夜不寢以思無益不如學也天下事有不可知猶結有不可解也兒説善解結結無有不可解結有不可解兒説不能解也非兒説不能解也結有不可解及其解之用不能也聖人知事事無不可知事有不可知聖人不能知非聖人不能知事有不可知及其知之用不知也故夫難知之事學問所能及也不可知之事問之學之不能曉也
