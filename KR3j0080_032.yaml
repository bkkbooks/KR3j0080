body:
  text: 說日篇儒者曰日朝見出陰中暮不見入陰中陰氣晦冥故沒不見如實論之不出入陰中何以效之夫夜陰也氣亦晦冥或夜舉火者光不滅焉夜之陰北方之陰也朝出日入所舉之火也火夜舉光不滅日暮入獨不見非氣驗也夫觀冬日之出入朝出東南暮入西南東南西南非陰何故謂之出入陰中且夫星小猶見日大反滅世儒之論竟虛妄也儒者曰冬日短夏日長亦復以陰陽夏時陽氣多陰氣少陽氣光明與日同耀故日出輒無鄣蔽冬陰氣晦冥掩日之光日雖出猶隱不見故冬日日短陰多陽少與夏相反如實論之日之長短不以陰陽何以驗之復以北方之星北方之陰冬日之陰也北方之陰不蔽星光冬日之陰何故獨滅日明由此言之以陰陽說者失其實矣實者夏時日在東井冬時日在牽牛牽牛去極遠故日道短東井近極故日道長夏北至東井冬南至牽牛故冬夏節極皆謂之至春秋未至故謂之分或曰夏時陽氣盛陽氣在南方故天舉而高冬時陽氣衰天抑而下高則日道多故日長下則日道少故日短也日陽氣盛天南方舉而日道長月亦當復長案夏日長之時日出東北而月出東南冬日短之時日出東南月出東北如夏時天舉南方日月當俱出東北冬時天復下日月亦當俱出東南由此言之夏時天不舉南方冬時天不抑下也然則夏日之長也其所出之星在北方也冬日之短也其所出之星在南方也問曰當夏五月日長之時在東井東井近極故日道長今案察五月之時日出於寅入於戌日道長去人遠何以得見其出於寅入於戌乎日在東井之時去人極近夫東井近極若極旋轉人常見之矣使東井在極旁側得無夜常為晝乎日晝夜行十六分人常見之不復出入焉儒者或曰日月有九道故曰日行有近遠晝夜有長短也夫復五月之時晝十一分夜五分六月晝十分夜六分從六月往至十一月月減一分此則日行月從一分道也歲日行天十六道也豈徒九道或曰天高南方下北方日出高故見入下故不見天之居若倚蓋矣故極在人之北是其效也極在天下之中今在人北其若倚蓋明矣日明既以倚蓋喻當若蓋之形也極星在上之北若蓋之葆矣其下之南有若蓋之莖者正何所乎夫取蓋倚於地不能運立而樹之然后能轉今天運轉其北際不著地者觸礙何以能行由此言之天不若倚蓋之狀日之出入不隨天高下明矣或曰天北際下地中日隨天而入地地密鄣隱故人不見然天地夫婦也合為一體天在地中地與天合天地并氣故能生物北方陰也合體并氣故居北方天運行於地中乎不則北方之地低下而不平也如審運行地中鑿地一丈轉見水源天行地中出入水中乎如北方低下不平是則九川北注不得盈滿也實者天不在地中日亦不隨天隱天平正與地無異然而日出上日入下者隨天轉運視天若覆盆之狀故視日上下然似若出入地中矣然則日之出近也其入遠不復見故謂之入運見於東方近故謂之出何以驗之繫明月之珠於車蓋之橑轉而旋之明月之珠旋邪人望不過十里天地合矣遠非合也今視日入非入也亦遠也當日入西方之時其下民亦將謂之日中從日入之下東望今之天下或時亦天地合如是方今天下在南方也故日出於東方入於西方北方之地日出北方入於南方各於近者為出遠者為入實者不入遠矣臨大澤之濱望四邊之際與天屬其實不屬遠若屬矣日以遠為入澤以遠為屬其實一也澤際有陸人望而不見陸在察之若亡日亦在視之若入皆遠之故也太山之高參天入雲去之百里不見埵塊夫去百里不見太山況日去人以萬里數乎太山之驗則既明矣試使一人把大炬火夜行於道平易無險去人不一里火光滅矣非滅也遠也今日西轉不復見者非入也問曰天平正與地無異今仰視天觀日月之行天高南方下北方何也曰方今天下在東南之上視天若高日月道在人之南今天下在日月道下故觀日月之行若高南下北也何以驗之即天高南方南方之星亦當高今視南方之星低下天復低南方乎夫視天之居近者則高遠則下焉極北方之民以為高南方為下極東極西亦如此焉皆以近者為高遠者為下從北塞下近仰視斗極且在人上胸奴之北地之邊陲北上視天天復高北下南日月之道亦在其上立太山之上太山高去下十里太山下夫天之高下猶人之察太山也平正四方中央高下皆同今望天之四邊若下者非也遠也非徒下若合矣儒者或以旦暮日出入為近日中為遠或以日中為近日出入為遠其以日出入為近日中為遠者見日出入時大日中時小也察物近則大遠則小故日出入為近日中為遠也其以日出入為遠日中時為近者見日中時溫日出入時寒也夫火光近人則溫遠人則寒故以日中為近日出入為遠也二論各有所見故是非曲直未有所定如實論之日中近而日出入遠何以驗之以植竿於屋下夫屋高三丈竿於屋棟之下正而樹之上扣棟下抵地是以屋棟去地三丈如旁邪倚之則竿末旁跌不得扣棟是為去地過三丈也日中時日正在天上猶竿之正樹去地三丈也日出入邪在人旁猶竿之旁跌去地過三丈也夫如是日中為近出入為遠可知明矣試復以屋中堂而坐一人一人行於屋上其行中屋之時正在坐人之上是為屋上之人與屋下坐人相去三丈矣如屋上人在東危若西危上其與屋下坐人相去過三丈矣日中時猶人正在屋上矣其始出與入猶人在東危與西危也日中去人近故溫日出入遠故寒然則日中時日小其出入時大者日中光明故小其出入時光暗故大猶晝日察火光小夜察之火光大也既以火為效又以星為驗晝日星不見者光耀滅之也夜無光耀星乃見夫日月星之類也平旦日入光銷故視大也儒者論日旦出扶桑暮入細柳扶桑東方之地細柳西方之野也桑柳天地之際日月常所出入之處問曰歲二月八月時日出正東日入正西可謂日出於扶桑入於細柳今夏日長之時日出於東北入於西北冬日短之時日出於東南入於西南冬與夏日之出入在於四隅扶桑細柳正在何所乎所論之言獨謂春秋不謂冬與夏也如實論之日不出於扶桑入於細柳何以驗之隨天而轉近則見遠則不見當在扶桑細柳之時從扶桑細柳之民謂之日中之時從扶桑細柳察之或時為日出入皆以其上者為中旁則為旦夕安得出於扶桑入細柳儒者論曰天左旋日月之行不繫於天各自旋轉難之曰使日月自行不繫於天日行一度月行十三度當日月出時當進而東旋何還始西轉繫於天隨天四時轉行也其喻若蟻行於磑上日月行遲天行疾天持日月轉故日月實東行而反西旋也或問日月天皆行行度不同三者舒疾驗之人物為以何以喻曰天日行一周日行一度二千里日晝行千里夜行千里騏驥晝日亦行千里然則日行舒疾與騏驥之步相似類也月行十三度十度二萬里三度六千里月一旦一夜行二萬六千里與晨鳧飛相類似也天行三百六十五度積凡七十三萬里也其行甚疾無以為驗當與陶鈞之運弩矢之流相類似乎天行已疾去人高遠視之若遲蓋望遠物者動若不動行若不行何以驗之乘船江海之中順風而驅近岸則行疾遠岸則行遲船行一實也或疾或遲遠近之視使之然也仰視天之運不若騏驥負日而馳皆日暮而日在其前何則騏驥近而日遠也遠則若遲近則若疾六萬里之程難以得運行之實也儒者說曰日行一度天一日一夜行三百六十五度天左行日月右行與天相迎問日月之行也繫著於天也日月附天而行不直自行也何以言之易曰日月星辰麗乎天百果草木麗於土麗者附也附天所行若人附地而圓行其取喻若蟻行於磑上焉問曰何知不離天直自行也如日能直自行當自東行無為隨天而西轉也月行與日同亦皆附天何以驗之驗之以雲雲不附天常止於所處使不附天亦當自止其處由此言之日行附天明矣問曰日火也火在地不行日在天何以為行曰附天之氣行附地之氣不行火附地地不行故火不行難曰附地之氣不行水何以行曰水之行也東流入海也西北方高東南方下水性歸下猶火性趨高也使地不高西方則水亦不東流難曰附地之氣不行人附地何以行曰人之行求有為也人道有為故行求古者質朴鄰國接境雞犬之聲相聞終身不相往來焉難曰附天之氣行列星亦何以不行曰列星著天天已行也隨天而轉是亦行也難曰人道有為故行天道無為何行曰天之行也施氣自然也施氣則物自生非故施氣以生物也不動氣不施氣不施物不生與人行異日月五星之行皆施氣焉儒者曰日中有三足烏月中有兔蟾蜍夫日者天之火也與地之火無以異也地火之中無生物天火之中何故有烏火中無生物生物入火中燋爛而死焉烏安得立夫月者水也水中有生物非兔蟾蜍也兔與蟾蜍久在水中無不死者日月毀於天螺蚌泊於淵同氣審矣所謂兔蟾蜍者豈反螺與蚌邪且問儒者烏兔蟾蜍死乎生也如死久在日月燋枯腐朽如生日蝕時既月晦常盡烏兔蟾蜍皆何在夫烏兔蟾蜍日月氣也若人之腹臟萬物之心膂也月尚可察也人之察日無不眩不能知日審何氣遏而見其中有物名曰烏乎審日不能見烏之形遏而見其足有三乎此已非實且聽儒者之言蟲物非一日中何為有烏月中何為有兔蟾蜍儒者謂日蝕月蝕也彼見日蝕常於晦朔晦朔月與日合故得蝕之夫春秋之時日蝕多矣經曰某月朔日有蝕之日有蝕之者未必月也知月蝕之何諱不言月或說日蝕之變陽弱陰彊也人物在世氣力徑彊乃能乘凌案月晦光既朔則如盡微弱甚矣安得勝日夫日之蝕月蝕也日蝕謂月蝕之月誰蝕之者無蝕月也月自損也以月論日亦知日月蝕光自損也大率四十一二月日一食百八十日月一蝕蝕之皆有時非時為變及其為變氣自然也日時晦朔月復為之乎夫日當實滿以虧為變必謂有蝕之者山崩地動蝕者誰也或說日食者月掩之也日在上月在下障於月之形也日月合相襲月在上日在下者不能掩日日在上月在日下障於月月掩日光故謂之食也障於月也若陰雲蔽日月不見矣其端合者相食是也其合相當如襲璧者日既是也日月合於晦朔天之常也日食月掩日光非也何以驗之使日月合月掩日光其初食崖當與旦復時易處假令日在東月在西月之行疾東及日掩日崖須臾過日而東西崖初掩之處光當復東崖未掩者當復食今察日之食西崖光缺其復也西崖光復過掩東崖復西崖謂之合襲相掩障如何儒者謂日月之體皆至圓彼從下望見其形若斗筐之狀狀如正圓不如望遠光氣氣不圓矣夫日月不圓視之若圓者去人遠也何以驗之夫日者火之精也月者水之精也在地水火不圓在天水火何故獨圓日月在天猶五星五星猶列星列星不圓光耀若圓去人遠也何以明之春秋之時星霣宋都就而視之石也不圓以星不圓知日月五星亦不圓也儒者說日及工伎之家皆以日為一禹貢益山海經言日有十在海外東方有湯谷上有扶桑十日浴沐水中有大木九日居下枝一日居上枝淮南書又言燭十日堯時十日竝出萬物焦枯堯上射十日以故不竝一日見也世俗又名甲乙為日甲至癸凡十日日之有十猶星之有五也通人談士歸於難知不肯辨明是以文二傳而不定世兩言而無主誠實論之且無十焉何以驗之夫日猶月也日而有十月有十二乎星有五五行之精金木水火土各異光色如日有十其氣必異今觀日光無有異者察其小大前後若一如審氣異光色宜殊如誠同氣宜合為一無為十也驗日陽遂火從天來日者天火也察火在地一氣也地無十火天安得十日然則所謂十日者殆更自有他物光質如日之狀居湯谷水中時緣據扶桑禹益見之則紀十日數家度日之光數日之質刺徑千里假令日出是扶桑木上之日扶桑木宜覆萬里乃能受之何則一日徑千里十日宜萬里也天之去人六萬里餘里也仰察之日光眩耀火光盛明不能堪也使日出是扶桑木上之日禹益見之不能知其為日也何則仰察一日目猶眩耀況察十日乎當禹益見之若斗筐之狀故名之為日夫大如斗筐望六萬里之形非就見即察之體也由此言之禹益所見意似日非日也天地之間物氣相類其實非者多海外西南有珠樹焉察之是珠然非魚中之珠也夫十日之日猶珠樹之珠也珠樹似珠非真珠十日似日非實日也淮南見山海經則虛言真人燭十日妄紀堯時十日竝出且日火也湯谷水也水火相賊則十日浴於湯谷當滅敗焉火燃木扶桑木也十日處其上宜燋枯焉今浴湯谷而光不滅登扶桑而枝不燋不枯與今日出同不驗於五行故知十日非真日也且禹益見十日之時終不以夜猶以晝也則一日出九日宜留安得俱出十日如平旦日未出且天行有度數日隨天轉行安得留扶桑枝間浴湯谷之水乎留則失行度行度差跌不相應矣如行出之日與十日異是意似日而非日也春秋莊公七年夏四月辛卯夜中恆星不見星霣如雨公羊傳曰如雨者何非雨也非雨則曷為謂之如雨不修春秋曰雨星不及地尺而復君子修之曰星霣如雨不修春秋者未修春秋時魯史記曰星霣如雨不及地尺而復君子者孔子孔子修之曰星霣如雨孔子之意以為地有山陵樓臺云不及地尺恐失其實更正之曰如雨如雨者為從地上而下星亦從天霣而復與同故曰如夫孔子雖不云及地尺但言如雨其謂霣之者皆是星也孔子雖不定其位著其文謂霣為星與史同焉從平地望泰山之巔鶴如烏烏如爵者泰山高遠物之小大失其實天之去地六萬餘里高遠非直泰山之巔也星著於天人察之失星之實非直望鶴烏之類也數等星之質百里體大光盛故能垂耀人望見之若鳳卵之狀遠失其實也如星霣審在天之星霣而至地人不知其為星也何則霣時小大不與在天同也今見星霣如在天時是非星也非星則氣為之也人見鬼如死人之狀其實氣象非真死人然則霣星之形其實非星孔子不正云霣者非星而徙正言如雨非雨之文蓋俱失星之實矣春秋左氏傳四年辛卯夜中恆星不見夜明也星霣如雨與雨俱也其言夜明故不見與易之言日中見斗相依類也日中見斗幽不明也夜中星不見夜光明也事異義同蓋其實也其言與雨俱之集也夫辛卯之夜明故星不見明則不雨之驗也雨氣陰暗安得明明則無雨安得與雨俱夫如是言與雨俱者非實且言夜明不見安得見星與雨俱又僖公十六年正月戊申霣石于宋五左氏傳曰星也夫謂霣石為星則謂霣星為石矣辛卯之夜星霣為星則實為石矣辛卯之夜星霣如是石地有樓臺樓臺崩壞孔子雖不合言及地尺雖地必有實數魯史目見不空言者也云與雨俱雨集於地石亦宜然至地而樓臺不壞非星明矣且左丘明謂石為星何以審之當時石霣輕然何以其從天墜也秦時三山亡亡者不消散有在其集下時必有聲音從或時夷狄之山集於宋宋聞石霣則謂之星也左丘明省則謂之星夫星萬物之精與日月同說五星者謂五行之精之光也五星衆星同光耀獨謂列星為石恐失其實實者辛卯之夜霣星若雨而非星也與彼湯谷之十日若日而非日也儒者又曰雨從天下謂正從天墜也如實論之雨從地上不從天下見雨從上集則謂從天下矣其實地上也然其出地起於山何以明之春秋傳曰觸石而出膚寸而合不崇朝而遍雨天下惟太山也太山雨天下小山雨一國各以小大為近遠差雨之出山或謂雲載而行雲散水墜名為雨矣夫雲則雨雨則雲矣初出為雲雲繁為雨猶甚而泥露濡污衣服若雨之狀非雲與俱雲載行雨也或曰尚書曰月之從星則以風雨詩曰月麗于畢俾滂沱矣二經咸言所謂為之非天如何夫雨從山發月經星麗畢之時麗畢之時當雨也時不雨月不麗山不雲天地上下自相應也月麗於上山蒸於下氣體偶合自然道也雲霧雨之徵也夏則為露冬則為霜溫則為雨寒則為雪雨露凍凝者皆由地發不從天降也
