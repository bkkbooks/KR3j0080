body:
  text: 初稟篇人生性命當富貴者初稟自然之氣養育長大富貴之命效矣文王得赤雀武王得白魚赤烏儒者論之以為雀則文王受命魚烏則武王受命文武受命於天天用雀與魚烏命授之也天用赤雀命文王文王不受天復用魚烏命武王也若此者謂本無命於天修己行善善行聞天天乃授以帝王之命也故雀與魚烏天使為王之命也王所奉以行誅者也如實論之非命也命謂初所稟得而生也人生受性則受命矣性命俱稟同時並得非先稟性後乃受命也何以明之棄事堯為司馬居稷官故為后稷曾孫公劉居邰後徙居邠後孫古公亶甫三子太伯仲雍季歷季歷生文王昌昌在襁褓之中聖瑞見矣故古公曰我世當有興者其在昌乎於是太伯知之乃辭之吳文身斷髮以讓王季文王受命謂此時也天命在人本矣太王古公見之早也此猶為未文王在母身之中已受命也王者一受命內以為性外以為體體者面輔骨法生而稟之吏秩百石以上王侯以下郎將大夫以至元士外及刺史太守居祿秩之吏稟富貴之命生而有表見於面故許負姑布子卿輒見其驗仕者隨秩遷轉遷轉之人或至公卿命祿尊貴位望高大王者尊貴之率高大之最也生有高大之命其時身有尊貴之奇古公知之見四乳之怪也夫四乳聖人證也在母身中稟天聖命豈長大之後修行道德四乳乃生以四乳論望羊亦知為胎之時已受之矣劉媼息於大澤夢與神遇遂生高祖此時已受命也光武生於濟陽宮夜半無火內中光明軍下卒蘇永謂公曹史充蘭曰此吉事也毋多言此時已受命也獨謂文王武王得赤雀魚烏乃受命非也上天一命王者乃興不復更命也得富貴大命自起王矣何以驗之富家之翁資纍千金生有富骨治生積貨至於年老成為富翁矣夫王者天下之翁也稟命定於身中猶鳥之別雄雌於卵殼之中也卵殼孕而雌雄生日月至而骨節強強則雄自率將雌雄非生長之後或教使為雄然後乃敢將雌此氣性剛強自為之矣夫王者天下之雄也其命當王王命定於懷妊猶富貴骨生有鳥雄卵成也非唯人鳥也萬物皆然草木生於實核出土為栽蘖稍生莖葉成為長短巨細皆由實核王者長巨之最也朱草之莖如針紫芝之栽如豆成為瑞矣王者稟氣而生亦猶此也或曰王者生稟天命及其將王天復命之猶公卿以下詔書封拜乃敢即位赤雀魚烏上天封拜之命也天道人事有相命使之義自然無為天之道也命文以赤雀武以白魚是有為也管仲與鮑叔分財取多鮑叔不與管仲不求內有以相知視彼猶我取之不疑聖人起王猶管之取財也朋友彼我無有授與之義上天自然有命使之驗是則天道有為朋友自然也當漢祖斬大蛇之時誰使斬者豈有天道先至而乃敢斬之哉勇氣奮發性自然也夫斬大蛇誅秦殺項同一實也周之文武受命伐殷亦一義也高祖不受命使之將獨謂文武受雀魚之命誤矣難曰康叔之誥曰冒聞于上帝帝休天乃大命文王如無命史經何為言天乃大命文王所謂大命者非天乃命文王也聖人動作天命之意也與天合同若天使之矣書方激勸康叔勉使為善故言文王行道上聞於天天乃大命之也詩曰乃眷西顧此惟豫度與此同義天無頭面眷顧如何人有顧睨以人效天事易見故曰眷顧天乃大命文王眷顧之義實天不命也何以驗之夫大人與天地合其德與日月合其明與四時合其序與鬼神合其吉凶先天而天不違後天而奉天時如必須天有命乃以從事安得先天而後天乎以其不待天命直以心發故有先天後天之勤言合天時故有不違奉天之文論語曰大哉堯之為君唯天為大唯堯則之王者則天不違奉天之義也推自然之性與天合同是則所謂大命文王也自文王意文王自為非天驅赤雀使告文王云當為王乃敢起也然則文王赤雀及武王白魚非天之命昌熾祐也吉人舉事無不利者人徒不召而至瑞物不招而來黯然諧合若或使之出門聞吉顧睨見善自然道也文王當興赤雀適來魚躍烏飛武王偶見非天使雀至白魚來也吉物動飛而聖遇也白魚入于王舟王陽曰偶適也光祿大夫劉琨前為弘農太守虎渡河光武皇帝曰偶適自然非或使之也故夫王陽之言適光武之曰偶可謂合於自然也
