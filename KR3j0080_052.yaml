body:
  text: 是應篇儒者論太平瑞應皆言氣物卓異朱草醴泉翔風甘露景星嘉禾萐脯蓂莢屈軼之屬又言山出車澤出馬男女異路市無二價耕者讓畔行者讓路頒白不提挈關梁不閉道無虜掠風不鳴條雨不破塊五日一風十日一雨其盛茂者致黃龍騏驎鳳皇夫儒者之言有溢美過實瑞應之物或有或無夫言鳳皇騏驎之屬大瑞較然不得增飾其小瑞徵應恐多非是夫風氣雨露本當和適言其風翔露甘風不鳴條雨不破塊可也言其五日一風十日一雨襃之也風雨雖適不能五日十日正如其數言男女不相干市價不相欺可也言其異路無二價襃之也太平之時豈更為男女各作道哉不更作道一路而行安得異乎太平之時無商人則可如有必求便利以為業買物安肯不求賤賣貨安肯不求貴有求貴賤之心必有二價之語此皆有其事而襃增過其實也若夫萐脯蓂莢屈軼之屬殆無其物何以驗之說以實者太平無有此物儒者言萐脯生於庖廚者言廚中自生肉脯薄如萐形搖鼓生風寒涼食物使之不臭夫太平之氣雖和不能使廚生肉萐以為寒涼若能如此則能使五穀自生不須人為之也能使廚自生肉萐何不使飯自蒸於甑火自燃於竈乎凡生萐者欲以風吹食物也何不使食物自不臭何必生萐以風之乎廚中能自生萐則冰室何事而復伐冰以寒物乎人夏月操萐須手搖之然後生風從手握持以當疾風萐亦鼓動言萐脯自鼓可也須風乃鼓不風不動從手風來自足以寒廚中之物何須萐脯世言燕太子丹使日再中天雨粟烏白頭馬生角廚門象生肉足論之既虛則萐脯之語五應之類恐無其實儒者又言古者蓂莢夾階而生月朔日一莢生至十五日而十五莢於十六日日一莢落至月晦莢盡來月朔一莢復生王者南面視莢生落則知日數多少不須煩擾案日曆以知之也夫天既能生莢以為日數何不使莢有日名王者視莢之字則知今日名乎徒知日數不知日名猶復案曆然後知之是則王者視日則更煩擾不省蓂莢之生安能為福夫蓂莢草之實也猶豆之有莢也春夏未生其生必於秋末冬月隆寒霜雪霣零萬物皆枯儒者敢謂蓂莢達冬獨不死乎如與萬物俱生俱死莢成而以秋末是則季秋得察莢春夏冬三時不得案也且月十五日生十五莢於十六日莢落二十一日六莢落落莢棄殞不可得數猶當計未落莢以知日數是勞心苦意非善祐也使莢生於堂上人君坐戶牖間望察莢生以知日數匪謂善矣今云夾階而生生於堂下也王者之堂墨子稱堯舜堂高三尺儒家以為卑下假使之然高三尺之堂蓂莢生於階下王者欲視其莢不能從戶牖之間見也須臨堂察之乃知莢數夫起視堂下之莢孰與懸日曆於扆坐傍顧輒見之也天之生瑞欲以娛王者須起察乃知日數是生煩物以累之也且莢草也王者之堂旦夕所坐古者雖質宮室之中草生輒耘安得生莢而人得經月數之乎且凡數日一二者欲以紀識事也古有史官典曆主日王者何事而自數莢堯候四時之中命曦和察四星以占時氣四星至重猶不躬視而自察莢以數日也儒者又言太平之時屈軼生於庭之末若草之狀主指佞人佞人入朝屈軼庭末以指之聖王則知佞人所在夫天能故生此物以指佞人不使聖王性自知之或佞人本不生出必復更生一物以指明之何天之不憚煩也聖王莫過堯舜堯舜之治最為平矣即屈軼已自生於庭之末佞人來輒指知之則舜何難於知佞人而使皋陶陳知人之術經曰知人則哲惟帝難之人含五常音氣交通且猶不能相知屈軼草也安能知佞如儒者之言是則太平之時草木踰賢聖也獄訟有是非人情有曲直何不并令屈軼指其非而不直者必若心聽訟三人斷獄乎故夫屈軼之草或時無有而空言生或時實有而虛言能指假令能指或時草性見人而動吉者質朴見草之動則言能指能指則言指佞人司南之杓投之於地其柢指南魚肉之蟲集地北行夫蟲之性然也今草能指亦天性也聖人因草能指宣言曰庭末有屈軼能指佞人百官臣子懷姦心者則各變性易操為忠正之行矣猶今府廷畫皋陶觟䚦也儒者說云觟䚦者一角之羊也青色四足或曰似熊能知曲直性識有罪皋陶治獄其罪疑者令羊觸之有罪則觸無罪則不觸斯蓋天生一角聖獸助獄為驗故皋陶敬羊起坐事之此則神奇瑞應之類也曰夫觟䚦則復屈軼之語也羊本二角觟䚦一角體損於群不及眾類何以為奇鱉三足曰能龜三足曰賁案能與賁不能神於四足之龜鱉一角之羊何能聖於兩角之禽狌狌知往乾鵲知來鸚鵲能言天性能一不能為二或時觟䚦之性徒能觸人未必能知罪人皋陶欲神事助政惡受罪者之不厭服因觟䚦觸人則罪之欲人畏之不犯受罪之家沒齒無怨言也夫物性各自有所知如以觟䚦能觸謂之為神則狌狌之徒皆為神也巫知吉凶占人禍福無不然者如以觟䚦謂之巫類則巫何奇而以為善斯皆人欲神事立化也師尚父為周司馬將師伐紂到孟津之上杖鉞把旄號其眾曰倉兕倉兕倉兕者水中之獸也善覆人船因神以化欲令急渡不急渡倉兕害汝則復觟䚦之類也河中有此異物時出浮揚一身九頭人畏惡之未必覆人之舟也尚父緣河有此異物因以威眾夫觟䚦之觸罪人猶倉兕之覆舟也蓋有虛名無其實效也人畏怪奇故空褒增又言太平之時有景星尚書中候曰堯時景星見於軫夫景星或時五星也大者歲星太白也彼或時歲星太白行於軫度古質不能推步五星不知歲星太白何如狀見大星則謂景星矣詩又言東有啟明西有長庚亦或時復歲星太白也或時昏見於西或時晨出於東詩人不知則名曰啟明長庚矣然則長庚與景星同皆五星也太平之時日月精明五星日月之類也太平更有景星可復更有日月乎詩人俗人也中候之時質世也俱不知星王莽之時太白經天精如半月使不知星者見之則亦復名之曰景星爾雅釋四時章曰春為發生夏為長嬴秋為收成冬為安寧四氣和為景星夫如爾雅之言景星乃四時氣和之名也恐非著天之大星爾雅之書五經之訓故儒者所共觀察也而不信從更謂大星為景星豈爾雅所言景星與儒者之所說異哉爾雅又言甘露時降萬物以嘉謂之醴泉醴泉乃謂甘露也今儒者說之謂泉從地中出其味甘若醴故曰醴泉二說相遠實未可知案爾雅釋水泉章泉一見一否曰瀸檻泉正出正出涌出也沃泉懸出懸出下出也是泉出之異輒有異名使太平之時更有醴泉從地中出當於此章中言之何故反居釋四時章中言甘露為醴泉乎若此儒者之言醴泉從地中出又言甘露其味甚甜未可然也儒曰道至天者日月精明星辰不失其行翔風起甘雨降雨霽而陰曀者謂之甘雨非謂雨水之味甘也推此以論甘露必謂其降下時適潤養萬物未必露味甘也亦有露甘味如飴蜜者俱太平之應非養萬物之甘露也何以明之案甘露如飴蜜者著於樹木不著五穀彼露味不甘者其下時土地滋潤流濕萬物洽沾濡溥由此言之爾雅且近得實緣爾雅之言驗之於物案味甘之露下著樹木察所著之樹不能茂於所不著之木然今之甘露殆異於爾雅之所謂甘露欲驗爾雅之甘露以萬物豐熟災害不生此則甘露降下之驗也甘露下是則醴泉矣
