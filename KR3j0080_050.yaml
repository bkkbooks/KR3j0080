body:
  text: 講瑞篇儒者之論自說見鳳皇騏驎而知之何則案鳳皇騏驎之象又春秋獲麟文曰有麇而角麞而角者則是騏驎矣其見鳥而象鳳皇者則鳳皇矣黃帝堯舜周之盛時皆致鳳皇孝宣帝之時鳳皇集于上林後又於長樂之宮東門樹上高五尺文章五色周獲麟麟似麞而角武帝之麟亦如麞而角如有大鳥文章五色獸狀如麞首戴一角考以圖象驗之古今則鳳麟可得審也夫鳳皇鳥之聖者也騏驎獸之聖者也五帝三王皋陶孔子人之聖也十二聖相各不同而欲以麞戴角則謂之騏驎相與鳳皇象合者謂之鳳皇如何夫聖鳥獸毛色不同猶十二聖骨體不均也戴角之相猶戴干也顓頊戴干堯舜未必然今魯所獲麟戴角即後所見麟未必戴角也如用魯所獲麟求知世間之麟則必不能知也何則毛羽骨角不合同也假令合同或時似類未必真是虞舜重瞳王莽亦重瞳晉文駢脅張儀亦駢脅如以骨體毛色比則王莽虞舜而張儀晉文也有若在魯最似孔子孔子死弟子共坐有若問以道事有若不能對者何也體狀似類實性非也今五色之鳥一角之獸或時似類鳳皇騏驎其實非真而說者欲以骨體毛色定鳳皇騏驎誤矣是故顏淵庶幾不似孔子有若恆庸反類聖人由是言之或時真鳳皇騏驎骨體不似恆庸鳥獸毛色類真知之如何儒者自謂見鳳皇騏驎輒而知之則是自謂見聖人輒而知之也皋陶馬口孔子反宇設使輒有知而絶殊馬口反宇尚未可謂聖何則十二聖相不同前聖之相難以照後聖也骨法不同姓名不等身形殊狀生出異土雖復有聖何如知之桓君山謂楊子雲曰如後世復有聖人徒知其才能之勝己多不能知其聖與非聖人也子雲曰誠然夫聖人難知知能之美若桓楊者尚復不能知世儒懷庸庸之知齎無異之議見聖不能知可保必也夫不能知聖則不能知鳳皇與騏驎世人名鳳皇騏驎何用自謂能知之乎夫上世之名鳳皇騏驎聞其鳥獸之奇者耳毛角有奇又不妄翔苟遊與鳥獸爭飽則謂之鳳皇騏驎矣世人之知聖亦猶此也聞聖人人之奇者身有奇骨知能博達則謂之聖矣及其知之非卒見暫聞輒而名之為聖也與之偃伏從之受學然後知之何以明之子貢事孔子一年自謂過孔子二年自謂與孔子同三年自知不及孔子當一年二年之時未知孔子聖也三年之後然乃知之以子貢知孔子三年乃定世儒無子貢之才其見聖人不從之學任倉卒之視無三年之接自謂知聖誤矣少正卯在魯與孔子並孔子之門三盈三虛唯顏淵不去顏淵獨知孔子聖也夫門人去孔子歸少正卯不徒不能知孔子之聖又不能知少正卯之佞門人皆惑子貢曰夫少正卯魯之聞人也夫子為政何以先誅之孔子曰賜退非爾所及夫才能知佞若子貢尚不能知聖世儒見聖自謂能知之妄也夫以不能知聖言之則亦知其不能知鳳皇與騏驎也使鳳皇羽翮長廣騏驎體高大則見之者以為大鳥巨獸耳何以別之如必以巨大別之則其知聖人亦宜以巨大春秋之時鳥有爰居不可以為鳳皇長狄來至不可以為聖人然則鳳皇騏驎與鳥獸等也世人見之何用知之如以中國無有從野外來而知之則是鸜鵒同也鸜鵒非中國之禽也鳳皇騏驎亦非中國之禽獸也皆非中國之物儒者何以謂鸜鵒惡鳳皇騏驎善乎或曰孝宣之時鳳皇集于上林群鳥從之以千萬數以其衆鳥之長聖神有異故群鳥附從如見大鳥來集群鳥附之則是鳳皇鳳皇審則麒麟定矣夫鳳皇與騏驎同性鳳皇見群鳥從騏驎見衆獸亦宜隨案春秋之麟不言衆獸隨之宣帝武帝皆得騏驎無衆獸附從之文如以騏驎為人所獲附從者散鳳皇人不獲自來蜚翔附從可見書曰簫韶九成鳳皇來儀大傳曰鳳皇在列樹不言群鳥從也豈宣帝所致者異哉或曰記事者失之唐虞之君鳳皇實有附從上世久遠記事遺失經書之文末足以實也夫實有而記事者失之亦有實無而記事者生之夫如是儒書之文難以實事案附從以知鳳皇未得實也且人有佞猾而聚者鳥亦有佼黠而從群者當唐虞之時鳳愨願宣帝之時佼黠乎何其俱有聖人之德行動作之操不均同也無鳥附從或時是鳳皇群鳥附從或時非也君子在世清節自守不廣結從出入動作人不附從豪猾之人任俠用氣往來進退士衆雲合夫鳳皇君子也必以隨多者效鳳皇是豪黠為君子也歌曲彌妙和者彌寡行操益清交者益鮮鳥獸亦然必以附從效鳳皇是用和多為妙曲也龍與鳳皇為比類宣帝之時黃龍出于新豐群蛇不隨神雀鸞鳥皆衆鳥之長也其仁聖雖不及鳳皇然其從群鳥亦宜數十信陵孟嘗食客三千稱為賢君漢將軍衛青及將軍霍去病門無一客亦稱名將太史公曰盜跖橫行聚黨數千人伯夷叔齊隱處首陽山鳥獸之操與人相似人之得衆不足以別賢以鳥附從審鳳皇如何或曰鳳皇騏驎太平之瑞也太平之際見來至也然亦有未太平而來至也鳥獸奇骨異毛卓絶非常則是矣何為不可知鳳皇騏驎通常以太平之時來至者春秋之時騏驎嘗嫌於王孔子而至光武皇帝生於濟陽鳳皇來集夫光武始生之時成哀之際也時未太平而鳳皇至如以自為光武有聖德而來是則為聖王始生之瑞不為太平應也嘉瑞或應太平或為始生其實難知獨以太平之際驗之如何或曰鳳皇騏驎生有種類若龜龍有種類矣龜故生龜龍故生龍形色小大不異於前者也見之父察其子孫何為不可知夫恆物有種類瑞物無種適生故曰德應龜龍然也人見神龜靈龍而別之乎宋元王之時漁者網得神龜焉漁父不知其神也方今世儒漁父之類也以漁父不而知神龜則亦知夫世人不而知靈龍也龍或時似蛇蛇或時似龍韓子曰馬之似鹿者千金良馬似鹿神龍或時似蛇如審有類形色不異王莽時有大鳥如馬五色龍文與衆鳥數十集于沛國蘄縣宣帝時鳳皇集于地高五尺與言如馬身高同矣文章五色與言五色龍文物色均矣衆鳥數十與言俱集附從等也如以宣帝時鳳皇體色衆鳥附從案知鳳皇則王莽所致鳥鳳皇也如審是王莽致之是非瑞也如非鳳皇體色附從何為均等且瑞物皆起和氣而生生於常類之中而有詭異之性則為瑞矣故夫鳳皇之至也猶赤烏之集也謂鳳皇有種赤烏復有類乎嘉禾醴泉甘露嘉禾生於禾中與禾中異穗謂之嘉禾醴泉甘露出而甘美也皆泉露之所生出非天上有甘露之種地下有醴泉之類聖治公平而乃沾下産出也蓂莢朱草亦生在地集於衆草無常本根暫時産出旬月枯折故謂之瑞夫鳳皇騏驎亦瑞也何以有種類案周太平越常獻白雉白雉雉生而白色耳非有白雉之種也魯人得戴角之麞謂之騏驎亦或時生於麞非有騏驎之類由此言之鳳皇亦或時生於鵠鵲毛奇羽殊出異衆鳥則謂之鳳皇耳安得與衆鳥殊種類也有若曰騏驎之於走獸鳳皇之於飛鳥太山之於丘垤河海之於行潦類也然則鳳皇騏驎都與鳥獸同一類體色詭耳安得異種同類而有奇奇為不世不世難審識之如何堯生丹朱舜生商均商均丹朱堯舜之類也骨性詭耳鯀生禹瞽瞍生舜舜禹鯀瞽瞍之種也知德殊矣試種嘉禾之實不能得嘉禾恆見粢粱之粟莖穗怪奇人見叔梁紇不知孔子父也見伯魚不知孔子之子也張湯之父五尺湯長八尺湯孫長六尺孝宣鳳皇高五尺所從生鳥或時高二尺後所生之鳥或時高一尺安得常種種類無常故曾晳生參氣性不世顏路出回古今卓絶馬有千里不必騏驥之駒鳥有仁聖不必鳳皇之雛山頂之溪不通江湖然而有魚水精自為之也廢庭壞殿基上草生地氣自出之也按溪水之魚殿基上之草無類而出瑞應之自至天地未必有種類也夫瑞應猶災變也瑞以應善災以應惡善惡雖反其應一也災變無種瑞應亦無類也陰陽之氣天地之氣也遭善而為和遇惡而為變豈天地為善惡之政更生和變之氣乎然則瑞應之出殆無種類因善而起氣和而生亦或時政平氣和衆物變化猶春則鷹變為鳩秋則鳩化為鷹蛇鼠之類輒為魚鱉蝦蟆為鶉雀為蜄蛤物隨氣變不可謂無黃石為老父授張良書去復為石世儒知之或時太平氣和麞為騏驎鵠為鳳皇因故氣性隨時變化豈必有常類哉褒姒玄黿之子二龍漦也晉之二卿熊羆之裔也吞燕子薏苡履大跡之語世之人然之獨謂瑞有常類哉以物無種計之以人無類議之以體變化論之鳳皇騏驎生無常類則形色何為當同案禮記瑞命篇云雄曰鳳雌曰皇雄鳴曰即即雌鳴曰足足詩云梧桐生矣于彼高岡鳳皇鳴矣于彼朝陽菶菶萋萋噰噰喈喈瑞命與詩俱言鳳皇之鳴瑞命之言即即足足詩云雍雍喈喈此聲異也使聲審則形不同也使聲同詩與禮異世傳鳳皇之鳴故將疑焉案魯之獲麟云有麞而角言有麞者色如麞也麞色有常若鳥色有常矣武王之時火流為烏云其色赤赤非烏之色故言其色赤如似麞而色異亦當言其色白若黑今成事色同故言有麞麞無角有異於故故言而角也夫如是魯之所得驎者若麞之狀也武帝之時西巡狩得白驎一角而五趾角或時同言五趾者足不同矣魯所得麟云有麞不言色者麞無異色也武帝云得白驎色白不類麞故不言有麞正言白驎色不同也孝宣之時九真貢獻驎狀如鹿而兩角者孝武言一角不同矣春秋之麟如麞宣帝之驎言如鹿鹿與麞小大相倍體不同也夫三王之時驎毛色角趾身體高大不相似類推此准後世驎出必不與前同明矣夫騏驎鳳皇之類騏驎前後體色不同而欲以宣帝之時所見鳳皇高五尺文章五色準前況後當復出鳳皇謂與之同誤矣後當復出見之鳳皇騏驎必已不與前世見出者相似類而世儒自謂見輒而知之奈何案魯人得驎不敢正名驎曰有麞而角者時誠無以知也武帝使謁者終軍議之終軍曰野禽并角明天下同本也不正名驎而言野禽者終軍亦疑無以審也當今世儒之知不能過魯人與終軍其見鳳皇騏驎必從而疑之非恆之鳥獸耳何能審其鳳皇騏驎乎以體色言之未必等以鳥獸隨從多者言之未必善以希見言之有鸜鵒來以相奇言之聖人有奇骨體賢者亦有奇骨聖賢俱奇人無以別由賢聖言之聖鳥聖獸亦與恆鳥庸獸俱有奇怪聖人賢者亦有知而絶殊骨無異者聖賢鳥獸亦有仁善廉清體無奇者世或有富貴不聖身有骨為富貴表不為聖賢驗然則鳥亦有五采獸有一角而無仁聖者夫如是上世所見鳳皇騏驎何知其非恆鳥獸今之所見鵲麞之屬安知非鳳皇騏驎也方今聖世堯舜之主流布道化仁聖之物何為不生或時以有鳳皇騏驎亂於鵠鵲麞鹿世人不知美玉隱在石中楚王令尹不能知故有抱玉泣血之痛今或時鳳皇騏驎以仁聖之性隱於恆毛庸羽無一角五色表之世人不之知猶玉在石中也何用審之為此論草於永平之初時來有瑞其孝明宣惠衆瑞並至至元和章和之際孝章耀德天下和洽嘉瑞奇物同時俱應鳳皇騏驎連出重見盛於五帝之時此篇已成故不得載或問曰講瑞謂鳳皇騏驎難知世瑞不能別今孝章之所致鳳皇騏驎不可得知乎曰五鳥之記四方中央皆有大鳥其出衆鳥皆從小大毛色類鳳皇實難知也故夫世瑞不能別別之如何以政治時王之德不及唐虞之時其鳳皇騏驎目不親見然而唐虞之瑞必真是者堯之德明也孝宣比堯舜天下太平萬里慕化仁道施行鳥獸仁者感動而來瑞物小大毛色足翼必不同類以政治之得失主之明暗準況衆瑞無非真者事或難知而易曉其此之謂也又以甘露驗之甘露和氣所生也露無故而甘和氣獨已至矣和氣至甘露降德洽而衆瑞湊案永平以來訖於章和甘露常降故知衆瑞皆是而鳳凰騏驎皆真也
