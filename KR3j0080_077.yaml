body:
  text: 祭意篇禮王者祭天地諸侯祭山川卿大夫祭五祀士庶人祭其先宗廟社稷之祀自天子達於庶人尚書曰肆類于上帝禋于六宗望于山川遍于群神禮曰有虞氏禘黃帝而郊嚳祖顓頊而宗堯夏后氏亦禘黃帝而郊鯀祖顓頊而宗禹殷人禘嚳而郊冥祖契而宗湯周人禘嚳而郊稷祖文王而宗武王燔柴於大壇祭天也瘞埋於大折祭地也用騂犢埋少牢於大昭祭時也相近於坎壇祭寒暑也王宮祭日也夜明祭月也幽宗祭星也雩宗祭水旱也四坎壇祭四方也山林川谷丘陵能出雲為風雨見怪物皆曰神有天下者祭百神諸侯在其地則祭亡其地則不祭此皆法度之祀禮之常制也王者父事天母事地推人事父母之事故亦有祭天地之祀山川以下報功之義也緣生人有功得賞鬼神有功亦祀之山出雲雨潤萬物六宗居六合之間助天地變化王者尊而祭之故曰六宗社稷報生萬物之功社報萬物稷報五穀五祀報門戶井竈室中霤之功門戶人所出入井竈人所飲食中霤人所託處五者功鈞故俱祀之傳或曰少昊有四叔曰重曰該曰修曰熙實能金木及水使重為句芒該為蓐收修及熙為玄冥世不失職遂濟窮桑此其三祀也顓頊氏有子曰犁為祝融共工氏有子曰句龍為后土此其二祀也后土為社稷田正也有烈山氏之子曰柱為稷自夏以上祀之周棄亦為稷自商以來祀之禮曰烈山氏之有天下也其子曰柱能殖百穀夏之衰也周棄繼之故祀以為稷共工氏之霸九州也其子曰后土能平九土故祀以為社傳或曰炎帝作火死而為竈禹勞力天下水死而為社禮曰王為群姓立七祀曰司命曰中霤曰國門曰國行曰泰厲曰戶曰竈諸侯為國立五祀曰司命曰中霤曰國門曰國行曰公厲大夫立三祀曰族厲曰門曰行適士立二祀曰門曰行庶人立一祀或立戶或立竈社稷五祀之祭未有所定皆為思其德不忘其功也中心愛之故飲食之愛鬼神者祭祀之自禹興修社稷祀后稷其後絶廢高皇帝四年詔天下祭靈星七年使天下祭社稷靈星之祭祭水旱也於禮舊名曰雩雩之禮為民祈穀雨祈穀實也春求雨秋求實一歲再祀蓋重穀也春以二月秋以八月故論語曰暮春者春服既成冠者五六人童子六七人浴乎沂風乎舞雩詠而歸暮春四月也周之四月正歲二月也二月之時龍星始出故傳曰龍見而雩龍星見時歲已啓蟄故又曰啓蟄而雩春雩之禮廢秋雩之禮存故世常修靈星之祀到今不絶名變於舊故世人不識禮廢不具故儒者不知世儒案禮不知靈星何祀其難曉而不識説縣官名曰明星緣明星之名説曰歲星歲星東方也東方主春春主生物故祭歲星求春之福也四時皆有力於物獨求春者重本尊始也審如儒者之説求春之福反以秋祭非求春也月令祭戶以春祭門以秋各宜其時如或祭門以秋謂之祭戶論者肯然之乎不然則明星非歲星也乃龍星也龍星二月見則春雩祈穀雨龍星八月將入則秋雩祈穀實儒者或見其義語不空生春雩廢秋雩興故秋雩之名自若為明星也實曰靈星靈星者神也神者謂龍星也群神謂風伯雨師雷公之屬風以搖之雨以潤之雷以動之四時生成寒暑變化日月星辰人所瞻仰水旱人所忌惡四方氣所由來山林川谷民所取材用此鬼神之功也凡祭祀之義有二一曰報功二曰修先報功以勉力修先以崇恩力勉恩崇功立化通聖王之務也是故聖王制祭祀也法施於民則祀之以死勤事則祀之以勞定國則祀之能禦大災則祀之能捍大患則祀之帝嚳能序星辰以著衆堯能賞均刑法以義終舜勤民事而野死鯀勤洪水而殛死禹能修鯀之功黃帝正名百物以明民共財顓頊能修之契為司徒而民成冥勤其官而水死湯以寬治民而除其虐文王以文治武王以武功去民之災凡此功烈施布於民民賴其力故祭報之宗廟先祖己之親也生時有養親之道死亡義不可背故修祭祀示如生存推人事鬼神緣生事死人有賞功供養之道故有報恩祀祖之義孔子之畜狗死使子戇埋之曰吾聞之也弊帷不棄為埋馬也弊蓋不棄為埋狗也丘也貧無蓋於其封也亦與之席毋使其首陷焉延陵季子過徐徐君好其劍季子以當使於上國未之許與季子使還徐君已死季子解劍帶其冢樹御者曰徐君已死尚誰為乎季子曰前已心許之矣可以徐君死故負吾心乎遂帶劍於冢樹而去祀為報功者其用意猶孔子之埋畜狗也祭為不背先者其恩猶季之帶劍於冢樹也聖人知其若此祭猶齋戒畏敬若有鬼神修興弗絶若有禍福重恩尊功殷勤厚恩未必有鬼而享之者何以明之以飲食祭地也人將飲食謙退示當有所先孔子曰雖疏食菜羹瓜祭必齋如也禮曰侍食於君君使之祭然後飲食之祭猶禮之諸祀也飲食亦可毋祭禮之諸神亦可毋祀也祭祀之實一也用物之費同也知祭地無神猶謂諸祀有鬼不知類也經傳所載賢者所紀尚無鬼神況不著篇籍世間淫祀非鬼之祭信其有神為禍福矣好道學仙者絶穀不食與人異食欲為清潔也鬼神清潔於仙人如何與人同食乎論之以為人死無知其精不能為鬼假使有之與人異食異食則不肯食人之食不肯食人之食則無求於人無求於人則不能為人禍福矣凡人之有喜怒也有求得與不得得則喜不得則怒喜則施恩而為福怒則發怒而為禍鬼神無喜怒則雖常祭而不絶久廢而不修其何禍福於人哉
