body:
  text: 答佞篇或問曰賢者行道得尊官厚祿人何必為佞以取富貴曰佞人知行道可以得富貴必以佞取爵祿者不能禁欲也知力耕可以得穀勉貿可以得貨然而必盜竊情欲不能禁者也以禮進退也人莫不貴然而違禮者衆尊義者希心情貪欲志慮亂溺也夫佞與賢者同材佞以情自敗偷盜與田商同知偷盜以欲自劾也問曰佞與賢者同材材行宜鈞而佞人曷為獨以情自敗曰富貴皆人所欲也雖有君子之行猶有飢渴之情君子耐以禮防情以義割欲故得循道循道則無禍小人縱貪利之欲踰禮犯義故進得苟佞苟佞則有罪夫賢者君子也佞人小人也君子與小人本殊操異行取捨不同問曰佞與讒者同道乎有以異乎曰讒與佞俱小人也同道異材俱以嫉妬為性而施行發動之異讒以口害人佞以事危人讒人以直道不違佞人依違匿端讒人無詐慮佞人有術數故人君皆能遠讒親仁莫能知賢別佞難曰人君皆能遠讒親仁而莫能知賢別佞然則佞人意不可知乎曰佞可知人君不能知庸庸之君不能知賢不能知賢不能知佞唯聖賢之人以九德檢其行以事效考其言行不合於九德言不驗於事效人非賢則佞矣夫知佞以知賢知賢以知佞知佞則賢智自覺知賢則姦佞自得賢佞異行考之一驗情心不同觀之一實問曰九德之法張設久矣觀讀之者莫不曉見斗斛之量多少權衡之縣輕重也然而居國有土之君曷為常有邪佞之臣與常有欺惑之患曰不患無斗斛所量非其穀不患無銓衡所銓非其物故也在人君位者皆知九德之可以檢行事效可以知情然而惑亂不能見者則明不察之故也人有不能行行無不可檢人有不能考情無不可知問曰行不合於九德效不檢於考功進近非賢非賢則佞夫庸庸之材無高之知不能及賢賢功不效賢行不應可謂佞乎曰材有不相及行有不相追功有不相襲若知無相襲人材相什百取舍宜同賢佞殊行是是非非實名俱立而效有成敗是非之言俱當功有正邪言合行違名盛行廢佞人也問曰行合九德則賢不合則佞世人操行者可盡謂佞乎曰諸非皆惡惡中之逆者謂之無道惡中之巧者謂之佞人聖王刑憲佞在惡中聖王賞勸賢在善中純潔之賢善中殊高賢中之聖也惡中大佞惡中之雄也故曰觀賢由善察佞由惡善惡定成賢佞形矣問曰聰明有蔽塞推行有謬誤今以是者為賢非者為佞殆不得賢之實乎曰聰明蔽塞推行謬誤人之所歉也故曰刑故無小宥過無大聖君原心省意故誅故貰誤故賊加增過誤減損一獄吏所能定也賢者見之不疑矣問曰言行無功效可謂佞乎曰蘇秦約六國為從彊秦不敢窺兵於關外張儀為橫六國不敢同攻於關內六國約從則秦畏而六國彊三秦稱橫則秦彊而天下弱功著效明載紀竹帛雖賢何以加之太史公敘言衆賢儀秦有篇無嫉惡之文功鈞名敵不異於賢夫功之不可以效賢猶名之不可實也儀秦排難之人也處擾攘之世行揣摩之術當此之時稷契不能與之爭計禹皋陶不能與之比效若夫陰陽調和風雨時適五穀豐熟盜賊衰息人舉廉讓家行道德之功命祿貴美術數所致非道德之所成也太史公記功故高來祀記録成則著效明驗攬載高卓以儀秦功美故列其狀由此言之佞人亦能以權說立功為效無效未可為佞也難曰惡中立功者謂之佞能為功者材高知明思慮遠者必傍義依仁亂於大賢故覺佞之篇曰人主好辨佞人言利人主好文佞人辭麗心合意同偶當人主說而不見其非何以知其僞而伺其奸乎曰是謂庸庸之君也材下知昏蔽惑不見賢聖之君察之審明若視俎上之脯指掌中之理數局上之棊摘轅中之馬魚鱉匿淵捕漁者知其源禽獸藏山畋獵者見其脈佞人異行於世世不能見庸庸之主無高材之人也難曰人君好辨佞人言利人主好文佞人辭麗言操合同何以覺之曰文王官人法曰推其往行以揆其來言聽其來言以省其往行觀其陽以考其陰察其內以揆其外是故詐善設節者可知飾僞無情者可辨質誠居善者可得含忠守節者可見也人之舊性不辨人君好辨佞人學求合於上也人之故能不文人君好文佞人意欲稱上上奢己麗服上儉己不飭今操與古殊朝行與家別考鄉里之迹證朝廷之行察共親之節明事君之操外內不相稱名實不相副際會發見奸為覺露也問曰人操行無恆權時制宜信者欺人直者曲撓權變所設前後異操事有所應左右異語儒書所載權變非一今以素故考之毋乃失實乎曰賢者有權佞者有權賢者之有權後有應佞人之有權亦反經後有惡故賢人之權為事為國佞人之權為身為家觀其所權賢佞可論察其發動邪正可名問曰佞人好毀人有諸曰佞人不毀人如毀人是讒人也何則佞人求利故不毀人苟利於己曷為毀之苟不利於己毀之無益以計求便以數取利利則便得妬人共事然後危人其危人也非毀之而其害人也非泊之譽而危之故人不知厚而害之故人不疑是故佞人危人人危而不怨害人人敗而不仇隱情匿意為之功也如毀人人亦毀之衆不親士不附也安能得容世取利於上問曰佞人不毀人於世間毀人於將前乎曰佞人以人欺將不毀人於將然則佞人奈何曰佞人毀人譽之危人安之毀危奈何假令甲有高行奇知名聲顯聞將恐人君召問扶而勝己欲故廢不言常騰譽之薦之者衆將議欲用問佞人佞人必對曰甲賢而宜召也何則甲意不欲留縣前聞其語矣聲望欲入府在郡則望欲入州志高則操與人異望遠則意不顧近屈而用之其心不滿不則臥病賤而命之則傷賢不則損威故人君所以失名損譽者好臣所常臣也自耐下之用之可也自度不能下之用之不便夫用之不兩相益舍之不兩相損人君畏其志信佞人之言遂置不用問曰佞人直以高才洪知考上世人乎將有師學檢也曰佞人自有知以詐人及其說人主須術以動上猶上人自有勇以威人及其戰鬭須兵法以進衆術則從橫師則鬼谷也傳曰蘇秦張儀習從橫之術於鬼谷先生掘地為坑曰下說令我泣出則耐分人君之地蘇秦下說鬼谷先生泣下沾襟張儀不若蘇秦相趙并相六國張儀貧賤往歸蘇秦座之堂下食以僕妾之食數讓激怒欲令相秦儀忿恨遂西入秦蘇秦使人厚送其後覺知曰此在其術中吾不知也此吾所不及蘇君者知深有術權變鋒出故身尊崇榮顯為世雄傑深謀明術深淺不能並行明暗不能並知問曰佞人養名作高有諸曰佞人食利專權不養名作高貪權據凡則高名自立矣稱於小人不行於君子何則利義相伐正邪相反義動君子利動小人佞人貪利名之顯君不安不則身危舉世為佞者皆以禍衆不能養其身安能養其名上世列傳棄宗養身違利赴名竹帛所載伯成子高委國而耕於陵子辭位灌園近世蘭陵王仲子東郡昔廬君陽寢位久病不應上徵可謂養名矣夫不以道進必不以道出身不以義止必不以義立名佞人懷貪利之心輕禍重身傾死為僇矣何名之養義廢德壞操行隨辱何云作高問曰大佞易知乎小佞易知也曰大佞易知小佞難知何則大佞材高其迹易察小佞知下其效難省何以明之成事小盜難覺大盜易知也攻城襲邑剽劫虜掠發則事覺道路皆知盜也穿鑿垣墻狸步鼠竊莫知謂誰曰大佞姦深惑亂其人如大佞易知人君何難書曰知人則哲惟帝難之虞舜大聖歡兜大佞大聖難知大佞大佞不憂大聖何易之有曰是謂下知之上知之上知之大難小易下知之大易小難何則大佞材高論說麗美因麗美之說人主之威人立心並不能責知或不能覺小佞材下對鄉失漏際會不密人君警悟得知其故大難小易也屋漏在上知者在下漏大下見之著漏小下見之微或曰雍也仁而不佞孔子曰焉用佞禦人以口給屢憎於民誤設計數煩擾農商損下益上愁民說主損上益下忠臣之說也損下益上佞人之義也季氏富於周公而求也為之聚斂而附益之小子鳴鼓而攻之可也聚斂季氏不知其惡不知百姓所共非也
