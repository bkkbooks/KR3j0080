body:
  text: 治期篇世謂古人君賢則道德施行施行則功成治安人君不肖則道德頓廢頓廢則功敗治亂古今論者莫謂不然何則見堯舜賢聖致太平桀紂無道致亂得誅如實論之命期自然非德化也吏百石以下若斗食以上居位治民為政布教教行與止民治與亂皆有命焉或才高行潔居位職廢或智淺操汙治民而立上古之黜陟幽明考功據有功而加賞案無功而施罰是考命而長祿非實才而厚能也論者因考功之法據效而定賢則謂民治國安者賢君之所致民亂國危者無道之所為也故危亂之變至論者以責人君歸罪於為政不得其道人君受以自責愁神苦思撼動形體而危亂之變終不減除空憤人君之心使明知之主虛受之責世論傳稱使之然也夫賢君能治當安之民不能化當亂之世良醫能行其針藥使方術驗者遇未死之人得未死之病也如命窮病困則雖扁鵲末如之何夫命窮病困之不可治猶夫亂民之不可安也藥氣之愈病猶教導之安民也皆有命時不可令勉力也公伯寮訴子路於季孫子服景伯以告孔子孔子曰道之將行也與命也道之將廢也與命也由此言之教之行廢國之安危皆在命時非人力也夫世亂民逆國之危殆災害繫於上天賢君之德不能消卻詩道周宣王遭大旱矣詩曰周餘黎民靡有孑遺言無有孑遺一人不被害者宣王賢者嫌於德微仁惠盛者莫過堯湯堯遭洪水湯遭大旱水旱災害之甚者也而二聖逢之豈二聖政之所致哉天地歷數當然也以堯湯之水旱準百王之災害非政所致非政所致則其福祐非德所為也賢君之治國也猶慈父之治家慈父耐平教明令不耐使子孫皆為孝善子孫孝善是家興也百姓平安是國昌也昌必有衰興必有廢興昌非德所能成然則衰廢非德所能敗也昌衰興廢皆天時也此善惡之實未言苦樂之效也家安人樂富饒財用足也案富饒者命厚所致非賢惠所獲也人皆知富饒居安樂者命祿厚而不知國安治化行者歷數吉也故世治非賢聖之功衰亂非無道之致國當衰亂賢聖不能盛時當治惡人不能亂世之治亂在時不在政國之安危在數不在教賢不賢之君明不明之政無能損益世稱五帝之時天下太平家有十年之蓄人有君子之行或時不然世增其美亦或時然非政所致何以審之夫世之所以為亂者不以賊盜衆多兵革並起民棄禮義負畔其上乎若此者由穀食乏絶不能忍飢寒夫飢寒並至而能無為非者寡然則溫飽並至而能不為善者希傳曰倉廩實民知禮節衣食足民知榮辱讓生於有餘爭起於不足穀足食多禮義之心生禮豐義重平安之基立矣故飢歲之春不食親戚穰歲之秋召及四鄰不食親戚惡行也召及四鄰善義也為善惡之行不在人質性在於歲之飢穰由此言之禮義之行在穀足也案穀成敗自有年歲年歲水旱五穀不成非政所致時數然也必謂水旱政治所致不能為政者莫過桀紂桀紂之時宜常水旱案桀紂之時無飢耗之災災至自有數或時返在聖君之世實事者説堯之洪水湯之大旱皆有遭遇非政惡之所致説百王之害獨謂為惡之應此見堯湯德優百王劣也審一足以見百明惡足以照善堯湯證百王至百王遭變非政所致以變見而明禍福五帝致太平非德所就明矣人之溫病而死也先有凶色見於面部其病遇邪氣也其病不愈至於身死命壽訖也國之亂亡與此同驗有變見於天地猶人溫病而死色見於面部也有水旱之災猶人遇氣而病也災禍不除至於國亡猶病不愈至於身死也論者謂變徵政治賢人溫病色凶可謂操行所生乎謂水旱者無道所致賢者遭病可謂無狀所得乎謂亡者為惡極賢者身死可謂罪重乎夫賢人有被病而早死惡人有完強而老壽人之病死不在操行為惡也然則國之亂亡不在政之是非惡人完強而老壽非政平安而常存由此言之禍變不足以明惡福瑞不足以表善明矣在天之變日月薄蝕四十二月日一食五十六月月亦一食食有常數不在政治百變千災皆同一狀未必人君政教所致歲星害鳥帑周楚有禍綝然之氣見宋衛陳鄭皆災當此之時六國政教未必失誤也歷陽之都一夕沈而為湖當時歷陽長吏未必誑妄也成敗繫於天吉凶制於時人事未為天氣已見非時而何五穀生地一豐一耗穀糶在市一貴一賤豐者未必賤耗者未必貴豐耗有歲貴賤有時時當貴豐穀價增時當賤耗穀直減夫穀之貴賤不在豐耗猶國之治亂不在善惡賢君之立偶在當治之世德自明於上民自善於下世平民安瑞祐並至世則謂之賢君所致無道之君偶生於當亂之時世擾俗亂災害不絶遂以破國亡身滅嗣世皆謂之為惡所致若此明於善惡之外形不見禍福之內實也禍福不在善惡善惡之證不在禍福長吏到官未有所行政教因前無所改更然而盜賊或多或寡災害或無或有夫何故哉長吏秩貴當階平安以升遷或命賤不任當由危亂以貶詘也以今之長吏況古之國君安危存亡可得論也
