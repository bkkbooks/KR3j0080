body:
  text: 齊世篇語稱上世之人侗長佼好堅強老壽百歲左右下世之人短小陋醜夭折早死何則上世和氣純渥婚姻以時人民稟善氣而生生又不傷骨節堅定故長大老壽狀貌美好下世反此故短小夭折形面醜惡此言妄也夫上世治者聖人也下世治者亦聖人也聖人之德前後不殊則其治世古今不異上世之天下世之天也天不變易氣不改更上世之民下世之民也俱稟元氣元氣純和古今不異則稟以為形體者何故不同夫稟氣等則懷性均懷性均則形體同形體同則醜好齊醜好齊則夭壽適一天一地並生萬物萬物之生俱得一氣氣之薄渥萬世若一帝王治世百代同道人民嫁娶同時共禮雖言男三十而娶女二十而嫁法制張設未必奉行何以效之以今不奉行也禮樂之制存見於今今之人民肯行之乎今人不肯行古人亦不肯舉以今之人民知古之人民也人物也物亦物也人生一世壽至一百歲生為十歲兒時所見地上之物生死改易者多至於百歲臨且死時所見諸物與年十歲時所見無以異也使上世下世民人無有異則百歲之間足以卜筮六畜長短五穀大小昆蟲草木金石珠玉蜎蜚蠕動跂行喙息無有異者此形不異也古之水火今之水火也今氣為水火也使氣有異則古之水清火熱而今水濁火寒乎人生長六七尺大三四圍面有五色壽至於百萬世不異如以上世人民侗長佼好堅強老壽下世反此則天地初立始為人時長可如防風之君色如宋朝壽如彭祖乎從當今至千世之後人可長如莢英色如嫫母壽如朝生乎王莽之時長人生長一丈名曰霸出建武年中潁川張仲師長二尺二寸張湯八尺有餘其父不滿五尺俱在今世或長或短儒者之言竟非誤也語稱上世使民以宜傴者抱關侏儒俳優如皆侗長佼好安得傴侏之人乎語稱上世之人質朴易化下世之人文薄難治故易曰上古之時結繩以治後世易之以書契先結繩易化之效後書契難治之驗也故夫宓犧之前人民至質朴臥者居居坐者于于群居聚處知其母不識其父至宓犧時人民頗文知欲詐愚勇欲恐怯強欲凌弱衆欲暴寡故宓犧作八卦以治之至周之時人民文薄八卦難復因襲故文王衍為六十四首極其變使民不倦至周之時人民久薄故孔子作春秋采毫毛之善貶纖介之惡稱曰周監於二代郁郁乎文哉吾從周孔子知世浸弊文薄難治故加密致之罔設纖微之禁檢柙守持備具悉極此言妄也上世之人所懷五常也下世之人亦所懷五常也俱懷五常之道共稟一氣而生上世何以質朴下世何以文薄彼見上世之民飲血茹毛無五穀之食後世穿地為井耕土種穀飲井食粟有水火之調又見上古巖居穴處衣禽獸之皮後世易以宮室有布帛之飾則謂上世質朴下世文薄矣夫器業變易性行不異然而有質朴文薄之語者世有盛衰衰極久有弊也譬猶衣食之於人也初成鮮完始熟香潔少久穿敗連日臭茹矣文質之法古今所共一質一文一衰一盛古而有之非獨今也何以效之傳曰夏后氏之王教以忠上教以忠君子忠其失也小人野救野莫如敬殷之王教以敬上教用敬君子敬其失也小人鬼救鬼莫如文故周之王教以文上教以文君子文其失也小人薄救薄莫如忠承周而王者當教以忠夏所承唐虞之教薄故教以忠唐虞以文教則其所承有鬼失矣世人見當今之文薄也狎侮非之則謂上世朴質下世文薄猶家人子弟不謹則謂他家子弟謹良矣語稱上世之人重義輕身遭忠義之事得己所當赴死之分明也則必赴湯趨鋒死不顧恨故弘演之節陳不占之義行事比類書籍所載亡命捐身衆多非一今世趨利苟生棄義妄得不相勉以義不相激以行義廢身不以為纍行隳事不以相畏此言妄也夫上世之士今世之士也俱含仁義之性則其遭事並有奮身之節古有無義之人今有建節之士善惡雜廁何世無有述事者好高古而下今貴所聞而賤所見辨士則談其久者文人則著其遠者近有奇而辨不稱今有異而筆不記若夫琅邪兒子明歲敗之時兄為飢人欲食自縛叩頭代兄為食飢人美其義兩舍不食兄死收養其孤愛不異於己之子歲敗穀盡不能兩活餓殺其子活兄之子臨淮許君叔亦養兄孤子歲倉卒之時餓其親子活兄之子與子明同義會稽孟章父英為郡決曹掾郡將撾殺非辜事至覆考英引罪自豫卒代將死章後復為郡功曹從役攻賊兵卒比敗為賊所射以身代將卒死不去此弘演之節陳不占之義何以異當今著文書者肯引以為比喻乎比喻之證上則求虞夏下則索殷周秦漢之際功奇行殊猶以為後又況當今在百代下言事者目親見之乎畫工好畫上代之人秦漢之士功行譎奇不肯圖不肯圖今世之士者尊古卑今也貴鵠賤雞鵠遠而雞近也使當今説道深於孔墨名不得與之同立行崇於曾顏聲不得與之鈞何則世俗之性賤所見貴所聞也有人於此立義建節實核其操古無以過為文書者肯載於篇籍表以為行事乎作奇論造新文不損於前人好事者肯舍久遠之書而垂意觀讀之乎楊子雲作太玄造法言張伯松不肯一觀與之併肩故賤其言使子雲在伯松前伯松以為金匱矣語稱上世之時聖人德優而功治有奇故孔子曰大哉堯之為君也唯天為大唯堯則之蕩蕩乎民無能名焉巍巍乎其有成功也煥乎其有文章也舜承堯不墮洪業禹襲舜不虧大功其後至湯舉兵伐桀武王把鉞討紂無巍巍蕩蕩之文而有動兵討伐之言蓋其德劣而兵試武用而化薄化薄不能相逮之明驗也及至秦漢兵革雲擾戰力角勢秦以得天下既得天下無嘉瑞之美若叶和萬國鳳皇來儀之類非德劣不及功薄不若之徵乎此言妄也夫天地氣和即生聖人聖人之治即立大功和氣不獨在古先則聖人何故獨優世俗之性好褒古而毀今少所見而多所聞又見經傳增賢聖之美孔子尤大堯舜之功又聞堯禹禪而相讓湯武伐而相奪則謂古聖優於今功化渥於後矣夫經有褒增之文世有空加之言讀經覽書者所共見也孔子曰紂之不善不若是之甚也是以君子惡居下流天下之惡皆歸焉世常以桀紂與堯舜相反稱美則説堯舜言惡則舉紂桀孔子曰紂之不善不若是之甚也則知堯舜之德不若是其盛也堯舜之禪湯武之誅皆有天命非優劣所能為人事所能成也使湯武在唐虞亦禪而不伐堯舜在殷周亦誅而不讓蓋有天命之實而世空生優劣之語經言叶和萬國時亦有丹水鳳皇來儀時亦有有苗兵皆動而並用則知德亦何優劣而小大也世論桀紂之惡甚於亡秦實事者謂亡秦惡甚於桀紂秦漢善惡相反猶堯舜桀紂相違也亡秦與漢皆在後世亡秦惡甚於桀紂則亦知大漢之德不劣於唐虞也唐之萬國固增而非實者也有虞之鳳皇宣帝已五致之矣孝明帝符瑞並至夫德優故有瑞瑞鈞則功不相下宣帝孝明如劣不及堯舜何以能致堯舜之瑞光武皇帝龍興鳳舉取天下若拾遺何以不及殷湯周武世稱周之成康不虧文王之隆舜巍巍不虧堯之盛功也方今聖朝承光武襲孝明有浸酆溢美之化無細小毫髮之虧上何以不逮舜禹下何以不若成康世見五帝三王事在經傳之上而漢之記故尚為文書則謂古聖優而功大後世劣而化薄矣
