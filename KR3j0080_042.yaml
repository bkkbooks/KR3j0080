body:
  text: 譴告篇論災異者謂古之人君為政失道天用災異譴告之也災異非一復以寒溫為之效人君用刑非時則寒施賞違節則溫天神譴告人君猶人君責怒臣下也故楚嚴王曰天不下災異天其忘豫乎災異為譴告故嚴王懼而思之也曰此疑也夫國之有災異也猶家人之有變怪也有災異謂天譴告人君有變怪天復譴告家人乎家人既明人之身中亦將可以喻身中病猶天有災異也血脈不調人生疾病風氣不和歲生災異災異謂天譴告國政疾病天復譴告人乎釀酒於罌烹肉於鼎皆欲其氣味調得也時或鹹苦酸淡不應口者猶人勺藥失其和也夫政治之有災異也猶烹釀之有惡味也苟謂災異為天譴告是其烹釀之誤得見譴告也占大以小明物事之喻足以審天使嚴王知如孔子則其言可信衰世霸者之才猶夫變復之家也言未必信故疑之夫天道自然也無為如譴告人是有為非自然也黃老之家論說天道得其實矣且天審能譴告人君宜變易其氣以覺悟之用刑非時刑氣寒而天宜為溫施賞違節賞氣溫而天宜為寒變其政而易其氣故君得以覺悟知是非今乃隨寒從溫為寒為溫非譴告之意欲令變更之宜大王亶父以王季之可立故易名為歷歷者適也太伯覺悟之吳越採藥以避王季使大王不易季名而復字之季太伯豈覺悟以避之哉今刑賞失法天欲改易其政宜為異氣若太王之易季名今乃重為同氣以譴告之人君何時將能覺悟以見刑賞之誤哉鼓瑟者誤於張弦設柱宮商易聲其師知之易其弦而復移其柱夫天之見刑賞之誤猶瑟師之睹弦柱之非也不更變氣以悟人君反增其氣以渥其惡則天無心意苟隨人君為誤非也紂為長夜之飲文王朝夕曰祀茲酒齊奢於祀晏子祭廟豚不掩俎何則非疾之者宜有以改易之也子弟傲慢父兄教以謹敬吏民橫悖長吏示以和順是故康叔伯禽失子弟之道見於周公拜起驕悖三見三笞往見商子商子令觀橋梓之樹二子見橋梓心感覺悟以知父子之禮周公可隨為驕商子可順為慢必須加之捶杖教觀於物者冀二人之見異以奇自覺悟也夫人君之失政猶二子失道也天不告以政道令其覺悟若二子觀見橋梓而顧隨刑賞之誤為寒溫之報此則天與人君俱為非也無相覺悟之感有相隨從之氣非皇天之意愛下譴告之宜也凡物能相割截者必異性者也能相奉成者必同氣者也是故離下兌上曰革革更也火金殊氣故能相革如俱火而皆金安能相革屈原疾楚之臭汙故稱香潔之辭漁父議以不隨俗故陳沐浴之言凡相溷者或教之薰燧或令之負豕二言之於除臭汙也孰是孰非非有不易少有以益夫用寒溫非刑賞也能易之乎西門豹急佩韋以自寬董安于緩帶絃以自促二賢知佩帶變己之物而以攻身之短天至明矣人君失政不以他氣譴告變易反隨其誤就起其氣此則皇天用意不若二賢審也楚莊王好獵樊姬為之不食鳥獸之肉秦繆公好淫樂華陽后為之不聽鄭衛之音二姬非兩主拂其欲而不順其行皇天非賞罰而順其操而渥其氣此蓋皇天之德不若婦人賢也故諫之為言間也持善間惡必謂之一亂周繆王任刑甫刑篇曰報虐用威威虐皆惡也用惡報惡亂莫甚焉今刑賞失實惡也天復為惡以應之此則皇天之操與繆王同也故以善駮惡以惡懼善告人之理勸厲為善之道也舜戒禹曰毋若丹朱敖周公勑成王曰毋若殷王紂毋者禁之也丹朱殷紂至惡故曰毋以禁之夫言毋若孰與言必若哉故毋必二辭聖人審之況肯譴非為非順人之過以增其惡哉天人同道大人與天合德聖賢以善反惡皇天以惡隨非豈道同之效合德之驗哉孝武皇帝好仙司馬長卿獻大人賦上乃仙仙有凌雲之氣孝成皇帝好廣宮室楊子雲上甘泉頌妙稱神怪若曰非人力所能為鬼神力乃可成皇帝不覺為之不止長卿之賦如言仙無實效子雲之頌言奢有害孝武豈有仙仙之氣者孝成豈有不覺之惑哉然即天之不為他氣以譴告人君反順人心以非應之猶二子為賦頌令兩帝惑而不悟也竇嬰灌夫疾時為邪相與日引繩以糾纏之心疾之甚安肯從其欲太伯教吳冠帶孰與隨從其俗與之俱倮也故吳之知禮義也太伯改其俗也蘇武入胸奴終不左衽趙他入南越箕踞椎髻漢朝稱蘇武而毀趙他趙他之性習越土氣畔冠帶之制陸賈說之夏服雅禮風告以義趙他覺悟運心嚮內如陸賈復越服夷談從其亂俗安能令之覺悟自變從漢制哉三教之相違文質之相反政失不相反襲也譴告人君誤不變其失而襲其非欲行譴告之教不從如何管蔡篡畔周公告教之至于再三其所以告教之者豈云當篡畔哉人道善善惡惡施善以賞加惡以罪天道宜然刑賞失實惡也為惡氣以應之惡惡之義安所施哉漢正首匿之罪制亡從之法惡其隨非而與惡人為群黨也如束罪人以詣吏離惡人與異居首匿亡從之法除矣狄牙之調味也酸則沃之以水淡則加之以鹹水火相變易故膳無鹹淡之失也今刑賞失實不為異氣以變其過而又為寒於寒為溫於溫此猶憎酸而沃之以鹹惡淡而灌之以水也由斯言之譴告之言疑乎必信也今熯薪燃釜火猛則湯熱火微則湯冷夫政猶火寒溫猶熱冷也顧可言人君為政賞罰失中也逆亂陰陽使氣不和乃言天為人君為寒為溫以譴告之乎儒者之說又言人君失政天為異不改災其人民不改乃災其身也先異後災先教後誅之義也曰此復疑也以夏樹物物枯不生以秋收穀穀棄不藏夫為政教猶樹物收穀也顧可言政治失時氣物為災乃言天為異以譴告之不改為災以誅伐之乎儒者之說俗人言也盛夏陽氣熾烈陰氣干之激射襒裂中殺人物謂天罰陰過外一聞若是內實不然夫謂災異為譴告誅伐猶為雷殺人罰陰過也非謂之言不然之說也或曰谷子雲上書陳言變異明天之譴告不改後將復有願貫械待時後竟復然即不為譴告何故復有子雲之言故後有以示改也曰夫變異自有占候陰陽物氣自有終始履霜以知堅冰必至天之道也子雲識微知後復然借變復之說以效其言故願貫械以待時也猶齊晏子見鉤星在房心之間則知地且動也使子雲見鉤星則將復曰天以鉤星譴告政治不改將有地動之變矣然則子雲之願貫械待時猶子韋之願伏陛下以俟熒惑徙處必然之驗故譴告之言信也豫之譴告何傷於義損皇天之德使自然無為轉為人事故難聽之也稱天之譴告譽天之聰察也反以聰察傷損於天德何以知其聾也以其聽之聰也何以知其盲也以其視之明也何以知其狂也以其言之當也夫言當視明聽聰而道家謂之狂而盲聾今言天之譴告是謂天狂而盲聾也易曰大人與天地合其德故太伯曰天不言殖其道於賢者之心夫大人之德則天德也賢者之言則天言也大人刺而賢者諫是則天譴告也而反歸譴告於災異故疑之也六經之文聖人之語動言天者欲化無道懼愚者欲言非獨吾心亦天意也及其言天猶以人心非謂上天蒼蒼之體也變復之家見誣言天災異時至則生譴告之言矣驗古以知今知天以人受終于文祖不言受終于天堯之心知天之意也堯授之天亦授之百官臣子皆鄉與舜舜之授禹禹之傳啓皆以人心效天意詩之眷顧洪範之震怒皆以人心效天之意文武之卒成王幼少周道未成周公居攝當時豈有上天之教哉周公推心合天志也上天之心在聖人之胸及其譴告在聖人之口不信聖人之言反然災異之氣求索上天之意何其遠哉世無聖人安所得聖人之言賢人庶幾之才亦聖人之次也
