body:
  text: 藝增篇世俗所患患言事增其實著文垂辭辭出溢其真稱美過其善進惡沒其罪何則俗人好奇不奇言不用也故譽人不增其美則聞者不快其意毀人不益其惡則聽者不愜於心聞一增以為十見百益以為千使夫純朴之事十剖百判審然之語千反萬畔墨子哭於練絲楊子哭於歧道蓋傷失本悲離其實也蜚流之言百傳之語出小人之口馳閭巷之間其猶是也諸子之文筆墨之疏人賢所著妙思所集宜如其實猶或增之儻經藝之言如其實乎言審莫過聖人經藝萬世不易猶或出溢增過其實增過其實皆有事為不妄亂誤以少為多也然而必論之者方言經藝之增與傳語異也經增非一略舉較著令恍惑之人觀覽采擇得以開心通意曉解覺悟尚書曰協和萬國是美堯德致太平之化化諸夏并及夷狄也言協和方外可也言萬國增之也夫唐之與周俱治五千里內周時諸侯千七百七十三國荒服戎服要服及四海之外不粒食之民若穿胸耴耳焦僥跂踵之輩并合其數不能三千天之所覆地之所載盡於三千之中矣而尚書云萬國褒增過實以美堯也欲言堯之德大所化者衆諸夏夷狄莫不雍和故曰萬國猶詩言子孫千億矣美周宣王之德能慎天地天地祚之子孫衆多至於千億言子孫衆多可也言千億增之也夫子孫雖衆不能千億詩人頌美增益其實案后稷始受邰封訖於宣王宣王以至外族內屬血脈所連不能千億夫千與萬數之大名也萬言衆多故尚書言萬國詩言千億詩云鶴鳴九皋聲聞于天言鶴鳴九折之澤聲猶聞於天以喻君子修德窮僻名猶達朝廷也言其聞高遠可矣言其聞於天增之也彼言聲聞於天見鶴鳴於雲中從地聽之度其聲鳴於地當復聞於天也夫鶴鳴雲中人聞聲仰而視之目見其形耳目同力耳聞其聲則目見其形矣然則耳目所聞見不過十里使參天之鳴人不能聞也何則天之去人以萬數遠則目不能見耳不能聞今鶴鳴從下聞之鶴鳴近也以從下聞其聲則謂其鳴於地當復聞於天失其實矣其鶴鳴於雲中人從下聞之如鳴於九皋人無在天上者何以知其聞於天上也無以知意從準況之也詩人或時不知至誠以為然或時知而欲以喻事故增而甚之詩曰維周黎民靡有孑遺是謂周宣王之時遭大旱之災也詩人傷旱之甚民被其害言無有孑遺一人不愁痛者夫旱甚則有之矣言無孑遺一人增之也夫周之民猶今之民也使今之民也遭大旱之災貧羸無蓄積扣心思雨若其富人穀食饒足者廩囷不空口腹不飢何愁之有天之旱也山林之間不枯猶地之水丘陵之上不湛也山林之間富貴之人必有遺脫者矣而言靡有孑遺增益其文欲言旱甚也易曰豐其屋蔀其家窺其戶闃其無人也非其無人也無賢人也尚書曰毋曠庶官曠空庶衆也毋空衆官置非其人與空無異故言空也夫不肖者皆懷五常才劣不逮不成純賢非狂妄頑嚚身中無一知也德有大小材有高下居官治職皆欲勉效在官尚書之官易之戶中猶能有益如何謂之空而無人詩曰濟濟多士文王以寧此言文王得賢者多而不肖者少也今易宜言闃其少人尚書宜言無少衆官以少言之可也言空而無人亦尤甚焉五穀之於人也食之皆飽稻粱之味甘而多腴豆麥雖糲亦能愈飢食豆麥者皆謂糲而不甘莫謂腹空無所食竹木之杖皆能扶病竹杖之力弱劣不及木或操竹杖皆謂不徑莫謂手空無把持夫不肖之臣豆麥竹杖之類也易持其具臣在戶言無人者惡之甚也尚書衆官亦容小材而云無空者刺之甚也論語曰大哉堯之為君也蕩蕩乎民無能名焉傳曰有年五十擊壤於路者觀者曰大哉堯之德乎擊壤者曰吾日出而作日入而息鑿井而飲耕田而食堯何等力此言蕩蕩無能名之效也言蕩蕩可也乃欲言民無能名增之也四海之大萬民之衆無能名堯之德者殆不實也夫擊壤者曰堯何等力欲言民無能名也觀者曰大哉堯之德乎此何等民者猶能知之實有知之者云無竟增之儒書又言堯舜之民可比屋而封言其家有君子之行可皆官也夫言可封可也言比屋增之也人年五十為人父為人父而不知君何以示子太平之世家為君子人有禮義父不失禮子不廢行夫有行者有知知君莫如臣臣賢能知君能知其君故能治其民今不能知堯何可封官年五十擊壤於路與豎子未成人者為伍何等賢者子路使子羔為郈宰孔子以為不可未學無所知也擊壤者無知官之如何稱堯之蕩蕩不能述其可比屋而封言賢者可比屋而封不能議讓其愚而無知之夫擊壤者難以言比屋比屋難以言蕩蕩二者皆增之所由起美堯之德也尚書曰祖伊諫紂曰今我民罔不欲喪罔無也我天下民無不欲王亡者夫言欲王之亡可也言無不增之也紂雖惡民臣蒙恩者非一而祖伊增語欲以懼紂也故曰語不益心不惕心不惕行不易增其語欲以懼之冀其警悟也蘇秦説齊王曰臨災之中車轂擊人肩磨舉袖成幕連衽成帷揮汗成雨齊雖熾盛不能如此蘇秦增語激齊王也祖伊之諫紂猶蘇秦之説齊王也賢聖增文外有所為內未必然何以明之夫武成之篇言武王伐紂血流浮杵助戰者多故至血流如此皆欲紂之亡也土崩瓦解安肯戰乎然祖伊之言民無不欲如蘇秦增語武成言血流浮杵亦太過焉死者血流安能浮杵案武王伐紂於牧之野河北地高壤靡不乾燥兵頓血流輒燥入土安得杵浮且周殷士卒皆齎盛糧或作乾糧無杵臼之事安得杵而浮之言血流杵欲言誅紂惟兵頓士傷故至浮杵春秋莊公七年夏四月辛卯夜中恆星不見星霣如雨公羊傳曰如雨者何非雨也非雨則曷為謂之如雨不修春秋曰如雨星不及地尺而復君子修之曰星霣如雨不修春秋者未修春秋時魯史記曰雨星不及地尺如復君子者謂孔子也孔子修之曰星霣如雨如雨者如雨狀也山氣為雲上不及天下而為雲雨星星隕不及地上復在天故曰如雨孔子正言也夫星霣或時至地或時不能尺丈之數難審也史記言尺亦以太甚矣夫地有樓臺山陵安得言尺孔子言如雨得其實矣孔子作春秋故正言如雨如孔子不作不及地尺之文遂傳至今光武皇帝之時郎中汝南賁光上書言孝文皇帝時居明光宮天下斷獄三人頌美文帝陳其效實光武皇帝曰孝文時不居明光宮斷獄不三人積善修德美名流之是以君子惡居下流夫賁光上書於漢漢為今世增益功美猶過其實況上古帝王久遠賢人從後褒述失實離本獨已多矣不遭光武論千世之後孝文之事載在經藝之上人不知其增居明光宮斷獄三人而遂為實事也
