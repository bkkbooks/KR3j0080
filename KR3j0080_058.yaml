body:
  text: 恢國篇顏淵喟然歎曰仰之彌高鑽之彌堅此言顏淵學於孔子積纍歲月見道彌深也宣漢之篇高漢於周擬漢過周論者未極也恢而極之彌見漢奇夫經熟講者要妙乃見國極論者恢奇彌出恢論漢國在百代之上審矣何以驗之黃帝有涿鹿之戰堯有丹水之師舜時有苗不服夏啓有扈叛逆高宗伐鬼方三年剋之周成王管蔡悖亂周公東征前代皆然漢不聞此高祖之時陳狶反彭越叛治始安也孝景之時吳楚興兵怨鼂錯也胸奴時擾正朔不及天荒之地王功不加兵今皆內附貢獻牛馬此則漢之威盛莫敢犯也紂為至惡天下叛之武王舉兵皆願就戰八百諸侯不期俱至項羽惡微號而用兵與高祖俱起威力輕重未有所定則項羽力徑折鐵難於摧木高祖誅項羽折鐵武王伐紂摧木然則漢力勝周多矣凡克敵一則易二則難湯武伐桀紂一敵也高祖誅秦殺項羽兼勝二家力倍湯武武王為殷西伯臣事於紂以臣伐周夷齊恥之扣馬而諫武王不聽不食周粟餓死首陽高祖不為秦臣光武不仕王莽誅惡伐無道無伯夷之譏可謂順於周矣丘山易以起高淵汙易以為深起於微賤無所因階者難襲爵乘位尊祖統業者易堯以唐侯入嗣帝位舜以司徒因堯授禪禹以司空緣功代舜湯由七十里文王百里武王為西伯襲文王位三郊五代之起皆有因緣力易為也高祖從亭長提三尺劍取天下光武由白水奮威武帝海內無尺土所因一位所乘直奉天命推勳自然此則起高於淵汙為深於丘山也比方五代孰者為優傳書或稱武王伐紂太公陰謀食小兒以丹令身純赤長大教言殷亡殷民見兒身赤以為天神及言殷亡皆謂商滅兵至牧野晨舉脂燭姦謀惑民權掩不備周之所諱也世謂之虛漢取天下無此虛言武成之篇言周伐紂血流浮杵以武成言之食兒以丹晨舉脂燭殆且然矣漢伐亡新光武將五千人王莽遣二公將三萬人戰于昆陽雷雨晦冥前後不相見漢兵出昆陽城擊二公軍一而當十二公兵散天下以雷雨助漢威敵孰與舉脂燭以人事譎取殷哉或云武王伐紂紂赴火死武王就斬以鉞懸其首於大白之旌齊宣王憐釁鍾之牛睹其色之觳觫也楚莊王赦鄭伯之罪見其肉袒而形暴也君子惡惡不惡其身紂尸赴於火中所見悽愴非徒色之觳觫袒之暴形也就斬以鉞懸辜其首何其忍哉高祖入咸陽閻樂誅二世項羽殺子嬰高祖雍容入秦不戮二尸光武入長安劉聖公已誅王莽乘兵即害不刃王莽之死夫斬赴火之首與貰被刃者之身德虐孰大也豈以羑里之恨哉以人君拘人臣其逆孰與秦奪周國莽鴆平帝也鄒伯奇論桀紂之惡不若亡秦亡秦不若王莽然則紂惡微而周誅之痛秦莽罪重而漢伐之輕寬狹誰也高祖母妊之時蛟龍在上夢與神遇好酒貰飲酒舍負讎及醉留臥其上常有神怪夜行斬蛇蛇嫗悲哭與呂后俱之田廬時自隱匿光氣暢見呂后輒知始皇望見東南有天子氣及起五星聚於東井楚望漢軍雲氣五色光武且生鳳皇集於城嘉禾滋於屋皇妣之身夜半無燭宮中光明初者蘇伯阿望舂陵氣鬱鬱葱葱光武起過舊廬見氣憧憧上屬於天五帝三王初生始起不聞此怪堯母感於赤龍及起不聞奇祐禹母吞薏苡將王得玄圭契母咽燕子湯起白狼銜鉤后稷母履大人之跡文王起得赤雀武王得魚烏皆不及漢太平之瑞黃帝堯舜鳳皇一至凡諸衆瑞重至者希漢文帝黃龍玉棓武帝黃龍麒麟連木宣帝鳳皇五至麒麟神雀甘露醴泉黃龍神光平帝白雉黑雉孝明麒麟神雀甘露醴泉白雉黑雉芝草連木嘉禾與宣帝同奇有神鼎黃金之怪一代之瑞纍仍不絶此則漢德豐茂故瑞祐多也孝明天崩今上嗣位元二之間嘉德布流三年零陵生芝草五本四年甘露降五縣五年芝復生六本黃龍見大小凡八前世龍見不雙芝生無二甘露一降而今八龍並出十一芝纍生甘露流五縣德惠盛熾故瑞繁夥也自古帝王孰能致斯儒者論曰王者推行道德受命於天論衡初稟以為王者生稟天命性命難審且兩論之酒食之賜一則為薄再則為厚如儒者之言五代皆一受命唯漢獨再此則天命於漢厚也如審論衡之言生稟自然此亦漢家所稟厚也絶而復屬死而復生世有死而復生之人人必謂之神漢統絶而復屬光武存亡可謂優矣武王伐紂庸蜀之夷佐戰牧野成王之時越常獻雉倭人貢暢幽厲衰微戎狄攻周平王東走以避其難至漢四夷朝貢孝平元始元年越常重譯獻白雉一黑雉二夫以成王之賢輔以周公越常獻一平帝得三後至四年金城塞外羌豪良願等種獻其魚鹽之地願內屬漢遂得西王母石室因為西海郡周時戎狄攻王至漢內屬獻其寶地西王母國在絶極之外而漢屬之德孰大壤孰廣方今哀牢鄯善婼降附歸德胸奴時擾遣將攘討獲虜生口千萬數夏禹倮入吳國太伯採藥斷髮文身唐虞國界吳為荒服越在九夷罽衣關頭今皆夏服褒衣履舄巴蜀越嶲鬱林日南遼東樂浪周時被髮椎髻今戴皮辨周時重譯今吟詩書春秋之義君親無將將而必誅廣陵王荊迷於㜸巫楚王英惑於俠客事情列見孝明三宥二王吞藥周誅管蔡違斯遠矣楚外家許氏與楚王謀議孝明曰許氏有屬於王欲王尊貴人情也聖心原之不繩於法隱彊侯傅懸書市里誹謗聖政今上海恩免奪爵士惡其人者憎其胥餘立二王之子安楚廣陵彊弟員嗣祀陰氏二王帝族也位為王侯與管蔡同管蔡滅嗣二王立後恩已褒矣隱彊異姓也尊重父祖復存其祀立武庚之義繼祿父之恩方斯羸矣何則並為帝王舉兵相征貪天下之大絶成湯之統非聖君之義失承天之意也隱彊臣子也漢統自在絶滅陰氏無損於義而猶存之惠滂沛也故夫雨露之施內則注於骨肉外則布於他族唐之晏晏舜之蒸蒸豈能踰此歡兜之行靖言庸回共工私之稱薦於堯三苗巧佞之人或言有罪之國鯀不能治水知力極盡罪皆在身不加於上唐虞放流死於不毛怨惡謀上懷挾叛逆考事失實誤國殺將罪惡重於四子孝明加恩則論徙邊今上寬惠還歸州里開闢以來恩莫斯大晏子曰鉤星在房心之間地其動乎夫地動天時非政所致皇帝振畏猶歸於治廣徵賢良訪求過闕高宗之側身周成之開匱㢙能逮此穀登歲平庸主因緣以建德政顛沛危殆聖哲優者乃立功化是故微病恆醫皆巧篤劇扁鵲乃良建初孟年無妄氣至歲之疾疫也比旱不雨牛死民流可謂劇矣皇帝敦德俊乂在官第五司空股肱國維轉穀振贍民不乏餓天下慕德雖危不亂民饑於穀飽於道德身流在道心回鄉內以故道路無盜賊之跡深幽迥絶無劫奪之姦以危為寧以困為通五帝三王孰能堪斯哉
