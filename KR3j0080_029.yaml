body:
  text: 非韓篇韓子之術明法尚功賢無益於國不加賞不肖無害於治不施罰責功重賞任刑用誅故其論儒也謂之不耕而食比之於一蠹論有益與無益也比之於鹿馬馬之似鹿者千金天下有千金之馬無千金之鹿鹿無益馬有用也儒者猶鹿有用之吏猶馬也夫韓子知以鹿馬喻不知以冠履譬使韓子不冠徒履而朝吾將聽其言也加冠於首而立於朝受無益之服增無益之仕言與服相違行與術相反吾是以非其言而不用其法也煩勞人體無益於人身莫過跪拜使韓子逢人不拜見君父不跪未必有賊於身體也然須拜跪以尊親者禮義至重不可失也故禮義在身身未必肥而禮義去身身未必瘠而化衰以謂有益禮義不如飲食使韓子賜食君父之前不拜而用肯為之乎夫拜跪禮義之效非益身之實也然而韓子終不失者不廢禮義以苟益也夫儒生禮義也耕戰飲食也貴耕戰而賤儒生是棄禮義求飲食也使禮義廢綱紀敗上下亂而陰陽繆水旱失時五穀不登萬民饑死農不得耕士不得戰也子貢去告朔之餼羊孔子曰賜也爾愛其羊我愛其禮子貢惡費羊孔子重廢禮也故以舊防為無益而去之必有水災以舊禮為無補而去之必有亂患儒者之在世禮義之舊防也有之無益無之有損庠序之設自古有之重本尊始故立官置吏官不可廢道不可棄儒生道官之吏也以為無益而廢之是棄道也夫道無成效於人成效者須道而成然足蹈路而行所蹈之路須不蹈者身須手足而動待不動者故事或無益而益者須之無效而效者待之儒生耕戰所須待也棄而不存如何也韓子非儒謂之無益有損蓋謂俗儒無行操舉措不重禮以儒名而俗行以實學而偽說貪官尊榮故不足貴夫志潔行顯不徇爵祿去卿相之位若脫躧者居位治職功雖不立此禮義為業者也國之所以存者禮義也民無禮義傾國危主今儒者之操重禮愛義率無禮之士激無義之人人民為善愛其主上此亦有益也聞伯夷風者貪夫廉懦夫有立志聞柳下惠風者薄夫敦鄙夫寬此上化也非人所見段干木闔門不出魏文敬之表式其閭秦軍聞之卒不攻魏使魏無干木秦兵入境境土危亡秦彊國也兵無不勝兵加於魏魏國必破三軍兵頓流血千里今魏文式闔門之士卻彊秦之兵全魏國之境濟三軍之眾功莫大焉賞莫先焉齊有高節之士曰狂譎華士二人昆弟也義不降志不仕非其主太公封於齊以此二子解沮齊眾開不為上用之路同時誅之韓子善之以為二子無益而有損也夫狂譎華士段干木之類也太公誅之無所卻到魏文侯式之卻彊秦而全魏功孰大者使韓子善干木闔門高節魏文式之是也狂譎華士之操干木之節也善太公誅之非也使韓子非干木之行下魏文之式則干木以此行而有益魏文用式之道為有功是韓子不賞功尊有益也論者或曰魏文式段干木之閭秦兵為之不至非法度之功一功特然不可常行雖全國有益非所貴也夫法度之功者謂何等也養三軍之士明賞罰之命嚴刑峻法富國彊兵此法度也案秦之彊肯為此乎六國之亡皆滅於秦兵六國之兵非不銳士眾之力非不勁也然而不勝至於破亡者彊弱不敵眾寡不同雖明法度其何益哉使童子變孟賁之意孟賁怒之童子操刃與孟賁戰童子必不勝力不如也孟賁怒而童子脩禮盡敬孟賁不忍犯也秦之與魏孟賁之與童子也魏有法度秦必不畏猶童子操刃孟賁不避也其尊士式賢者之閭非徒童子修禮盡敬也夫力少則修德兵彊則奮威秦以兵彊威無不勝卻軍還眾不犯魏境者賢干木之操高魏文之禮也夫敬賢弱國之法度力少之彊助也謂之非法度之功如何高皇帝議欲廢太子呂后患之即召張子房而取策子房教以敬迎四皓而厚禮之高祖見之心消意沮太子遂安使韓子為呂后議進不過彊諫退不過勁力以此自安取誅之道也豈徒易哉夫太子敬厚四皓以消高帝之議猶魏文式段干木之閭卻彊秦之兵也治國之道所養有二一曰養德二曰養力養德者養名高之人以示能敬賢養力者養氣力之士以明能用兵此所謂文武張設德力具足者也事或可以德懷或可以力摧外以德自立內以力自備慕德者不戰而服犯德者畏兵而卻徐偃王脩行仁義陸地朝者三十二國彊楚聞之舉兵而滅之此有德守無力備者也夫德不可獨任以治國力不可直任以御敵也韓子之術不養德偃王之操不任力二者偏駮各有不足偃王有無力之禍知韓子必有無德之患凡人稟性也清濁貪廉各有操行猶草木異質不可復變易也狂譎華士不仕於齊猶段干木不仕於魏矣性行清廉不貪富貴非時疾世義不苟仕雖不誅此人此人行不可隨也太公誅之韓子是之是謂人無性行草木無質也太公誅二子使齊有二子之類必不為二子見誅之故不清其身使無二子之類雖養之終無其化堯不誅許由唐民不皆樔處武王不誅伯夷周民不皆隱餓魏文侯式段干木之閭魏國不皆闔門由此言之太公不誅二子齊國亦不皆不仕何則清廉之行人所不能為也夫人所不能為養使為之不能使勸人所能為誅以禁之不能使止然則太公誅二子無益於化空殺無辜之民賞無功殺無辜韓子所非也太公殺無辜韓子是之是韓子之術殺無辜也夫執不仕者未必有正罪也太公誅之如出仕未有功太公肯賞之乎賞須功而加罰待罪而施使太公不賞出仕未有功之人則其誅不仕未有罪之民非也而韓子是之失誤之言也且不仕之民性廉寡欲好仕之民性貪多利利欲不存於心則視爵祿猶糞土矣廉則約省無極貪則奢泰不止奢泰不止則其所欲不避其主案古篡畔之臣希清白廉潔之人貪故能立功憍故能輕生積功以取大賞奢泰以貪主位太公遺此法而去故齊有陳氏劫殺之患太公之術致劫殺之法也韓子善之是韓子之術亦危亡也周公聞太公誅二子非而不是然而身執贄以下白屋之士白屋之士二子之類也周公禮之太公誅之二子之操孰為是者宋人有御馬者不進拔劍剄而棄之於溝中又駕一馬馬又不進又剄而棄之於溝若是者三以此威馬至矣然非王良之法也王良登車馬無罷駑堯舜治世民無狂悖王良馴馬之心堯舜順民之意人同性馬殊類也王良能調殊類之馬太公不能率同性之士然則周公之所下白屋王良之馴馬也太公之誅二子宋人之剄馬也舉王良之法與宋人之操使韓子平之韓子必是王良而非宋人矣王良全馬宋人賊馬也馬之賊則不若其全然則民之死不若其生使韓子非王良自同於宋人賊善人矣如非宋人宋人之術與太公同非宋人是太公韓子好惡無定矣治國猶治身也治一身省恩德之行多傷害之操則交黨踈絕恥辱至身推治身以況治國治國之道當任德也韓子任刑獨以治世是則治身之人任傷害也韓子豈不知任德之為善哉以為世衰事變民心靡薄故作法術專意於刑也夫世不乏於德猶歲不絕於春也謂世衰難以德治可謂歲亂不可以春生乎人君治一國猶天地生萬物天地不為亂歲去春人君不以衰世屏德孔子曰斯民也三代所以直道而行也周穆王之世可謂衰矣任刑治政亂而無功甫侯諫之穆王存德享國久長功傳於世夫穆王之治初亂終治非知昏於前才妙於後也前任蚩尤之刑後用甫侯之言也夫治人不能捨恩治國不能廢德治物不能去春韓子欲獨任刑用誅如何魯繆公問於子思曰吾聞龐𢵧是子不孝不孝其行奚如子思對曰君子尊賢以崇德舉善以勸民若夫過行是細人之所識也臣不知也子思出子服厲伯見君問龐𢵧是子子服厲伯對以其過皆君之所未曾聞自是之後君貴子思而賤子服厲伯韓子聞之以非繆公以為明君求姦而誅之子思不以姦聞而厲伯以姦對厲伯宜貴子思宜賤今繆公貴子思賤厲伯失貴賤之宜故非之也夫韓子所尚者法度也人為善法度賞之惡法度罰之雖不聞善惡於外善惡有所制矣夫聞惡不可以行罰猶聞善不可以行賞也非人不舉姦者非韓子之術也使韓子聞善必將試之試之有功乃肯賞之夫聞善不輒加賞虛言未必可信也若此聞善與不聞無以異也夫聞善不輒賞則聞惡不輒罰矣聞善必試之聞惡必考之試有功乃加賞考有驗乃加罰虛聞空見實試未立賞罰未加賞罰未加善惡未定未定之事須術乃立則欲耳聞之非也鄭子產晨出過東匠之宮聞婦人之哭也撫其僕之手而聽之有間使吏執而問之手殺其夫者也翼日其僕問曰夫子何以知之子產曰其聲懼凡人於其所親愛也知病而憂臨死而懼已死而哀今哭夫已死不哀而懼是以知其有姦也韓子聞而非之曰子產不亦多事乎姦必待耳目之所及而后知之則鄭國之得姦者寡矣不任典城之吏察參伍之正不明度量待盡聰明勞知慮而以知姦不亦無術乎韓子之非子產是也其非繆公非也夫婦人之不哀猶龐𢵧是子不孝也非子產待耳目以知姦獨欲繆公須問以定邪子產不任典城之吏而以耳聞定實繆公亦不任吏而以口問立誠夫耳聞口問一實也俱不任吏皆不參伍厲伯之對不可以立實猶婦人之哭不可以定誠矣不可以定誠使吏執而問之不可以立實不使吏考獨信厲伯口以罪不考之姦如何韓子曰子思不以過聞繆公貴之子服厲伯以姦聞繆公賤之人情皆喜貴而惡賤故季氏之亂成而不上聞此魯君之所以劫也夫魯君所以劫者以不明法度邪以不早聞姦也夫法度明雖不聞姦姦無由生法度不明雖日求姦決其源鄣之以掌也御者無銜見馬且犇無以制也使王良持轡馬無欲犇之心御之有數也今不言魯君無術而曰不聞姦不言審法度而曰不通下情韓子之非繆公也與術意而相違矣龐𢵧是子不孝子思不言繆公貴之韓子非之以為明君求善而賞之求姦而誅之夫不孝之人下愚之才也下愚無禮順情從欲與鳥獸同謂之惡可也謂姦非也姦人外善內惡色厲內荏作為操止像類賢行以取升進容媚於上安肯作不孝著身為惡以取棄殉之咎乎龐𢵧是子可謂不孝不可謂姦韓子謂之姦失姦之實矣韓子曰布帛尋常庸人不擇爍金百鎰盜跖不搏以此言之法明民不敢犯也設明法於邦有盜賊之心不敢犯矣不測之者不敢發矣姦心藏於胸中不敢以犯罪法罪法恐之也明法恐之則不須考姦求邪於下矣使法峻民無姦者使法不峻民多為姦而不言明王之嚴刑峻法而云求姦而誅之言求姦是法不峻民或犯之也世不專意於明法而專心求姦韓子之言與法相違人之釋溝渠也知其必溺身不塞溝渠而繕船楫者知水之性不可閼其勢必溺人也臣子之性欲姦君父猶水之性溺人也不教所以防姦而非其不聞知是猶不備水之具而徒欲早知水之溺人也溺於水不責水而咎己者己失防備也然則人君劫於臣己失法也備溺不閼水源防劫不求臣姦韓子所宜用教己也水之性勝火如裹之以釜水煎而不得勝必矣夫君猶火也臣猶水也法度釜也火不求水之姦君亦不宜求臣之罪也
