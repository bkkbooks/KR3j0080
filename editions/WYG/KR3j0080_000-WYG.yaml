front:
  text: 御製讀王充論衡向偶翻閱諸書見有王充論衡喜其識博而言辯頗具出俗之識其全書則未之覽也兹因校四庫全書始得其全卷而讀之乃知其為背經離道好竒立異之人而欲以言傳者也夫欲以言傳者不衷於聖賢未有能傳者也孔孟為千古聖賢孟或可問而不可刺充則刺孟而且問孔矣此與明末李贄之邪説何異夫時命坎坷當悔其所以自致坎坷耳不宜怨天尤人誣及聖賢為激語以自表則己己犯非聖無法之誅即有韙其言者亦不過同其亂世惑民之流耳君子必不為也且其死偽篇以杜伯之鬼為無而言毒篇又以杜伯之鬼為有似此矛盾處不可屈指數予故闢而訶之讀論衡者效其博辯取其軼材則可效其非聖滅道以為正人篤論則不可乾隆戊戌孟秋欽定四庫全書子部十
