body:
  text: 論衡雜家類三雜説之屬提要臣等謹案論衡三十卷漢王充撰充字仲任上虞人自紀謂在縣為掾功曹在都尉府位亦掾功曹在太守為列掾五官功曹行事又稱永和三年徙家辟詣揚州部丹陽九江廬江復人為治中章和二年罷州家居其書凡八十五篇而第四十四招致篇有録無書實八十四篇考其自紀曰書雖文重所論百種案古太公望近董仲舒𫝊作書篇百有餘吾書亦纔出百而云太多然則原書實百餘篇此本目録八十五篇已非其舊矣充書大㫖詳於自紀一篇葢内傷時命之坎坷外疾俗之虛偽故發憤著書其言多激刺孟問孔二篇至于奮其筆端以與聖賢相軋可謂誖矣又露才揚己好為物先至於述其祖父頑狠以自表所長傎亦甚焉其他論辨如日月不圓諸説雖為葛洪所駁載在晉志然大抵訂訛砭俗中理者多亦殊有禆於風教儲泳袪疑說謝應芳辨惑編不是過也至其文反覆詰難頗傷詞費則充所謂宅舍多土地不得小户口衆簿籍不得少失實之事多虛華之語衆指實定宜辨爭之言安得約徑者固已自言之矣充所作别有譏俗書政務書晚年又作養性書今皆不傳惟此書存儒者頗病其蕪雜然終不能廢也髙似孫子略曰袁崧後漢書載充作論衡中土未有傳者蔡邕入吳始見之以為談助談助之言可以了此書矣其論可云允愜此所以攻之者衆而好之者終不絶歟乾隆四十三年十一月恭校上總纂官臣紀昀臣陸鍚熊臣孫士毅總校官臣陸費墀欽定四庫全書子部十論衡目録雜家類三雜説之屬卷一逢遇第一累害第二命禄第三氣壽第四卷二幸偶第五命義第六無形第七率性第八吉驗第九卷三偶㑹第十骨相第十一初稟第十二本性第十三物勢第十四怪竒第十五卷四書虛第十六變虛第十七卷五異虛第十八感虛第十九卷六福虛第二十禍虛第二十一龍虛第二十二雷虛第二十三卷七道虛第二十四語増第二十五卷八儒増第二十六藝増第二十七卷九問孔第二十八卷十非韓第二十九刺孟第三十卷十一談天第三十一説日第三十二答佞第三十三卷十二程材第三十四量知第三十五謝短第三十六卷十三效力第三十七别通第三十八超竒第三十九卷十四狀留第四十寒温第四十一譴告第四十二卷十五變動第四十三招致第四十四闕明雩第四十五順鼓第四十六卷十六亂龍第四十七遭虎第四十八商蟲第四十九講瑞第五十卷十七指瑞第五十一是應第五十二治期第五十三巻十八自然第五十四感類第五十五齊世第五十六卷十九宣漢第五十七恢國第五十八驗符第五十九卷二十須頌第六十佚文第六十一論死第六十二巻二十一死偽第六十三卷二十二紀妖第六十四訂鬼第六十五卷二十三言毒第六十六薄葬第六十七四諱第六十八􅀈時第六十九卷二十四譏日第七十卜筮第七十一辨祟第七十二難嵗第七十三卷二十五詰術第七十四解除第七十五祀義第七十六祭意第七十七卷二十六實知第七十八知實第七十九卷二十七定賢第八十卷二十八正説第八十一書解第八十二巻二十九案書第八十三對作第八十四卷三十自紀第八十五欽定四庫全書論衡卷一漢
