  - {type: variant, offset: 343, length: 332, content: 尺書人人或誕論說紛然莫知所宗充心不能忍於是作論衡之書以爲衡者論之平也其爲九虚三增論死訂鬼以祛世俗之惑使見者曉然知然否之分論者之大旨如此非所謂岀於衆人之表者乎然觀其為書其釋物類也好舉形似以相質正而其理之一者有所未明其辯訛謬也或疑或决或信其所聞而任其所見尚有不得其事實者况乎天人之際性命之理㣲妙而難知者乎故其爲書可以謂之異書而不可以爲經常之典觀其書者見謂才進而實無以自成其才終則以爲談助而巳充之爲書或得或失不得而不論也雖然自漢以來操觚之士焦心勞思求一言之傳而不可得論衡之書獨傅至今譬之三代鼎彛之噐冝乎為世之所寳也且充之時去三代未逺文賢所傅見於是書者多矣其可使之無傅乎今世刻本㑹稽者最善克荘公為之校正而補刻之傅之人人其與帳中之書戒人勿廣者可謂遼絶矣至元七年仲春安陽韓性書, WYG: 部十}
