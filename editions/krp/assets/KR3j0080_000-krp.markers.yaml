  - {type: variant, offset: 5, length: 4, content: 崇文総目, WYG: 向偶翻閱諸書見有王充論衡喜其識博而言辯頗具出俗之識其全書則未之覽也兹因校四庫全書始得其全卷而讀之乃知其為背經離道好竒立異之人而欲以言傳者也夫欲以言傳者不衷於聖賢未有能傳者也孔孟為千古聖賢孟或可問而不可刺充則刺孟而且問孔矣此與明末李贄之邪説何異夫時命坎坷當悔其所以自致坎坷耳不宜怨天尤人誣及聖賢為激語以自表則己己犯非聖無法之誅即有韙其言者亦不過同其亂世惑民之流耳君子必不為也且其死偽篇以杜伯之鬼為無而言毒篇又以杜伯之鬼為有似此矛盾處不可屈指數予故闢而訶之讀論衡者效其博辯取其軼材則可效其非聖滅道以為正人篤論則不可乾隆戊戌孟秋欽定四庫全書子部十論衡雜家類三雜説之屬提要臣等謹案論衡}
  - {type: page-break, offset: 5, content: '', id: KR3j0080_WYG_000-1b, image: WYG0862/WYG0862-0001b.png}
  - {type: page-break, offset: 5, content: '', id: KR3j0080_WYG_000-2a, image: WYG0862/WYG0862-0002a.png}
  - {type: variant, offset: 12, length: 1, content: 世, WYG: 漢王充撰充字仲任上虞人自紀謂在縣為掾功曹在都尉府位亦掾功曹在太守為列掾五官功曹行事又稱永和三年徙家辟詣揚州部丹陽九江廬江復人為治中章和二年罷州家居其書凡八十五篇而第四十四招致篇有録無書實八十四篇考其自紀曰書雖文重}
  - {type: page-break, offset: 12, content: '', id: KR3j0080_WYG_000-2b, image: WYG0862/WYG0862-0002b.png}
  - {type: variant, offset: 13, length: 1, content: 所, SBCK: 􅀁}
  - {type: variant, offset: 14, length: 0, content: '', WYG: 論百種案古太公望近董仲舒𫝊作書篇百有餘吾書亦纔出百而云太多然則原書實百餘篇此本目録八十五篇已非其舊矣充書大㫖詳於自紀一篇葢内傷時命之坎坷外疾俗之虛偽故發憤著書其言多激刺孟問孔二篇至于奮其筆端以與聖賢相軋可謂誖矣又露才揚己好為物先至於述其祖父頑狠以自表所長傎亦甚焉其他論辨如日月不圓諸説雖為葛洪所駁載在晉志然大抵訂訛砭俗中理者多亦殊有禆於風教儲泳袪疑說謝應芳辨惑編不是過也至其文反覆詰難頗傷詞費則充所謂宅舍多土地不得小户口衆簿籍不得少失實之事多虛華之語衆指實定宜辨爭之言安得約徑者固已自言之矣充所作别有譏俗書政務書晚年又作養性書今皆不}
