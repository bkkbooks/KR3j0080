  - {type: variant, offset: 5601, length: 400, content: 矣夫如是巿虎之訛投杼之誤不足怪則玉變爲石珠化爲礫不足詭也何則昧心冥冥之知使之然也文王所以爲糞土而惡來所以爲金玉也非紂憎聖而好惡也心知惑蔽蔽惑不能審則㣲子十去比干五剖未足痛也故三監䜛聖人周公奔楚後母毁孝子伯竒放流當時周世孰有不惑乎後鴟鴞作而黍離興諷詠之者乃悲傷之故無雷風之變周公之惡不㓕當夏不隕霜鄒行之罪不除徳不能感天誠不能動變君子篤信審已也安能遏累害於人聖賢不治名害至不免辟形章墨短掩匿白長不理身冤不弭流言受垢取毁不求潔完故惡見而善不彰行缺而跡不顯邪僞之人治身以巧俗脩詐以偶衆猶漆盤盂之工穿墻不見弄丸劒之倡手指不知也世不見短故共稱之將不聞惡故顯用之夫如是世俗之所謂賢㓗者未必非惡所謂邪汚者未必非善也或曰言有招患行有召耻所在常由小人夫小人性患耻者也含邪而玍懷僞而遊沐浴累害之中何招召之有故夫火生者不傷濕水居者無溺患火不苦熱水不痛寒氣性自然焉招之君子也以忠言招患以髙行招耻何世不然然而太山之惡君子不得名毛, WYG: ''}
