  - {type: variant, offset: 0, length: 4444, content: 論衡卷第三十王充自紀篇自紀篇王充者㑹稽上虞人也字仲任其先本魏郡元城一姓孫一幾世嘗從軍有功封㑹稽陽亭一歲倉卒國絶因家焉以農桑為業世祖勇任氣卒咸不揆於人歲凶横道傷殺怨讎衆多㑹世擾亂恐為怨讎所擒祖父汎舉家檐載就安㑹稽留錢唐縣以賈販為事生子二人長曰蒙少曰誦誦即充父祖世任氣至蒙誦滋甚故蒙誦在錢唐勇勢凌人末復與豪家丁伯等結怨舉家徙處上虞建武三年充生為小兒與儕倫遨戯不好狎侮儕倫好掩雀捕蟬戯錢林熈充獨不肯誦竒之六歲教書恭愿仁順禮敬具備矜莊寂寥有巨人之志父未嘗笞母未嘗非閭里未嘗讓八歲出於書館書館小僮百人以上皆以過失袒謫或以書醜得鞭充書日進又無過失手書既成辭師受論語尚書日諷千字經明徳就謝師而專門援筆而衆竒所讀文書亦日博多才髙而不尚茍作口辯而不好談對非其人終日不言其論說始若詭於衆極聽其終衆乃是之以筆著文亦如此焉操行事上亦如此焉在縣位至掾功曹在都尉府位亦掾功曹在太守為列掾五官功曹行事入州為從事不好徼名於世不為利害見將常言人長希言人短專薦未達解已進者過及所不善亦弗譽有過不解亦弗復䧟能釋人之大過亦悲夫人之細非好自周不肯自彰勉以行操為基耻以材能為名衆㑹乎坐不問不言賜見君將不及不對在鄉里慕蘧伯玉之節在朝廷貪史子魚之行見汗傷不肯自明位不進亦不懐恨貧無一畆庇身志佚於王公賤無斗石之秩意若食萬鍾得官不欣失位不恨處逸樂而欲不放居貧苦而志不倦淫讀古文甘聞異言世書俗說多所不安幽處獨居考論實虚充為人清重遊必擇友不好茍交所友位雖微卑年雖幼稚行茍離俗必與之友好傑友雅徒不汜結俗材俗材因其微過蜚條䧟之然終不自明亦不非怨其人或曰有良材竒文無罪見䧟胡不自陳羊勝之徒摩口膏舌鄒陽自明入獄復出茍有全完之行不宜為人所缺既耐勉自伸冝不為人所屈荅曰不清不見塵不髙不見危不廣不見削不盈不見虧士兹多口為人所䧟盖亦其宜好進故自明憎退故自陳吾無好憎故黙無言羊勝為讒或使之也鄒陽得免或抜之也孔子稱命孟子言天吉凶安危不在於人昔人見之故歸之於命委之於時浩然恬忽無所怨尤福至不謂已所得禍到不謂已所為故時進意不為豐時退志不為虧不嫌虧以求盈不違險以趨平不鬻智以干禄不辭爵以弔名不貪進以自明不惡退以怨人同安危而齊死生鈞吉凶而一敗成遭十羊勝謂之無傷動歸於天故不自明充性恬澹不貪富貴為上所知拔擢越次不慕髙官不為上所知貶黜抑屈不恚下位比為縣吏無所擇避或曰心難而行易好犮同志仕不擇地濁操傷行世何效放荅曰可效放者莫過孔子孔子之仕無所避矣為乗曰委吏無於邑之心為司空相國無說豫之色舜耕歴山若終不免及受堯禪若卒自得憂徳之不豐不患爵之不尊耻名之不白不惡位之不遷垂棘與瓦同櫝明月與礫同囊茍有二寳之質不害為世所同世能知善雖賤猶顯不能别白雖尊猶辱處卑與尊齊操位賤與貴比徳斯可矣俗性貪進忽退收成棄敗充升擢在位之時衆人蟻附廢退窮居舊故叛去志俗人之寡恩故閑居作譏俗節義十二篇兾俗人觀書而自覺故直露其文集以俗言或譴謂之淺荅曰以聖典而示小雅以雅言而說丘野不得所曉無不逆者故蘇秦精說於趙而李兊不說商鞅以王說秦而孝公不用夫不得心意所欲雖盡堯舜之言猶飲牛以酒啖馬以脯也故鴻麗深懿之言關於大而不通於小不得已而強聽入胷者少孔子失馬於野野人閉不與子貢妙稱而怒馬圄諧說而懿俗曉露之言勉以深鴻之文猶和神仙之藥以治齀欬制貂狐之表以取薪菜也且禮有所不㣥事有所不湏㫁決知辜不必臯陶調和葵韮不俟狄牙閭巷之樂不用韶武里母之祀不待太牢既有不湏而又不宜牛刀割雞舒㦸采葵鈇鉞裁箸盆盎酌巵大小失宜善之者希何以為辯喻深以淺何以為智喻難以易賢聖銓材之所宜故文能為深淺之差充既疾俗情作譏俗之書又閔人君之政徒欲治人不得其宜不曉其務愁精苦思不睹所趨故作政務之書又傷偽書俗文多不實誠故為論衡之書夫賢聖歿而大義分蹉跎殊趨各自開門通人觀覽不能釘銓遥聞傳授筆冩耳取在百歲之前歴日彌乆以為昔古之事所言近是信之入骨不可自解故作實論其文盛其辯争浮華虛偽之語莫不澄定没華虚之文存敦厖之朴撥流失之風反宓戯之俗充書形露易觀或曰口辯者其言深筆敏者其文沉案經藝之文賢聖之言鴻重優雅難卒曉睹世讀之者訓古乃下盖賢聖之材鴻故其文語與俗不通玉隠石間珠匿魚腹非玉工珠師莫能采得寳物以隠閉不見實語亦宜深沉難測譏俗之書欲悟俗人故形露其指為分别之文論衡之書何為復然豈材有淺極不能為覆何文之察與彼經藝殊軌轍也荅曰玉隠石間珠匿魚腹故為深覆及玉色剖於石心珠光出於魚腹其隠乎猶吾文未集於簡札之上藏於胷臆之中猶玉隠珠匿也及出荴露猶玉剖珠出乎爛若天文之照順若地理之曉嫌疑隠㣲盡可名處且名白事自定也論衡者論之平也口則務在明言筆則務在露文髙士之文雅言無不可曉指無不可睹觀讀之者曉然若盲之開目聆然若聾之通耳三年盲子卒見父母不察察相識安肯說喜道畔巨樹塹邊長溝所居昭察人莫不知使樹不巨而隠溝不長而匿以斯示人堯舜猶惑人靣色部七十有餘頰肌明潔五色分别隠微憂喜皆可得察占射之者十不失一使面黝而黑醜垢重襲而覆部占射之者十而失九夫文由語也或淺露分别或深迃優雅孰為辯者故口言以明志言恐滅遺故著之文字文字與言同趨何為猶當隠閉指意獄當嫌辜卿決疑事渾沌難曉與彼分明可知孰為良吏夫口論以分明為公筆辯以荴露為通吏文以昭察為良深覆典雅指意難覩唯賦頌耳經傳之文賢聖之語古今言殊四方談異也當言事時非務難知使指閉隠也後人不曉世相離逺此名曰語異不名曰材鴻淺文讀之難曉名曰不巧不名曰知明秦始皇讀韓非之書嘆曰猶獨不得此人同時其文可曉故其事可思如深鴻優雅湏師乃學投之於地何嘆之有夫筆著者欲其易曉而難為不貴難知而易造口論務解分而可聽不務深迃而難睹孟子相賢以眸子明瞭者察文以義可曉充書違詭於俗或難曰文貴夫順合衆心不違人意百人讀之莫譴千人聞之莫怪故管子曰言室滿室言堂滿堂今殆說不與世同故文刺於俗不合於衆荅曰論貴是而不務華事尚然而不髙合論說辯然否安得不譎常心逆俗耳衆心非而不從故喪黜其偽而存定其真如當從衆順人心者循舊守雅諷習而已何辯之有孔子侍坐於魯哀公公賜桃與黍孔子先食黍而啖桃可謂得食序矣然左右皆掩口而笑貫俗之日乆也今吾實猶孔子之序食也俗人違之猶左右之掩口也善雅歌於鄭為人悲禮舞於趙為不好堯舜之典伍伯不肯觀孔墨之籍季孟不肯讀寧危之計黜於閭巷撥世之言訾於品俗有美味於斯俗人不嗜狄牙甘食有寳玉於是俗人投之卞和佩服孰是孰非可信者誰禮俗相背何世不然魯文逆祀畔者五人盖猶是之語髙士不舍俗夫不好惑衆之書賢者欣頌愚者逃頓充書不能純美或曰口無擇言筆無擇文文必麗以好言必辯以巧言瞭於耳則事味於心文察於目則篇留於手故辯言無不聽麗文無不冩今新書既在論譬說俗爲戾又不美好於觀不快盖師曠調音曲無不悲狄牙和膳肴無澹味然則通人造書文無瑕穢吕氏淮南懸於市門觀讀之者無訾一言今無二書之美文雖衆盛猶多譴毁荅曰夫養實者不育華調行者不餙辭豐草多華英茂林多枯枝爲文欲顯白其爲安能令文而無譴毁救火拯溺義不得好辯論是非言不得巧入澤隨龜不暇調足深淵捕蛟不暇定手言姦辭簡指趨妙遠語甘文峭務意淺小稻糓千鍾糠皮太半閱錢滿億穿決出萬大羮必有澹味至寳必有瑕穢大簡必有大好良工必有不巧然則辯言必有所屈通文猶有所黜言金由貴家起文糞自賤室出淮南吕氏之無累害所由出者家冨官貴也夫貴故得懸於市冨故有千金副觀讀之者惶恐畏忌雖見乖不合焉敢譴一字充書旣成或稽合於古不類前人或曰謂之飾文偶辭或徑或迃或屈或舒謂之論道實事委璅文給甘酸諧於經不驗集於傳不合稽之子長不當内之子雲不入文不與前相似安得名佳好稱工巧荅曰飾貌以彊類者失形調辭以務似者失情百夫之子不同父母殊類而生不必相似各以所禀自為佳好文必有與合然后稱善是則代匠斵不傷手然后稱工巧也文士之務各有所從或調辭以巧文或辯偽以實事必謀慮有合文辭相襲是則五帝不異事三王不殊業也美色不同面皆佳於目悲音不共聲皆快於耳酒醴異氣飲之皆醉百糓殊味食之皆飽謂文當與前合是謂舜眉當復八采禹目當復重瞳充書文重或曰文貴約而指通言尚省而趍明辯士之言要而達文人之辭寡而章今所作新書出萬言繁不省則讀者不能盡篇非一則傳者不能領被躁人之名以多為不善語約易言文重難得石多玉少多者不為珍龍少魚衆少者固為神荅曰有是言也盖寡言無多而華文無寡為世用者百篇無害不為用者一章無補如皆為用則多者為上少者下為累積千金比於一百孰為富者盖文多勝寡財寡愈貧世無一卷吾有百篇人無一字吾有萬言孰者為賢今不曰所言非而云泰多不曰世不好善而云不能領斯盖吾書所以不得省也夫宅舍多土地不得小戸口衆簿籍不得少今失實之事多華虚之語衆指實定宜辯争之言安得約徑韓非之書一條無異篇以十第文以萬數夫形大衣不得𥚹事衆文不得𥚹事衆文饒水大魚多帝都糓多王市肩磨書雖文重所論百種按古太公望近董仲舒傳作書篇百有餘吾書亦纔出百而云泰多盖謂所以出者微觀讀之者不能不譴呵也河水沛沛比夫衆川孰者爲大蟲繭重厚稱其出絲孰爲多者充仕數不耦而徒著書自紀或虧曰所貴鴻材者仕宦耦合身容說納事得功立故為髙也今吾子涉世落魄仕數黜斥材未練於事力未盡於職故徒幽思屬文著記美言何補於身衆多欲以何趨乎荅曰材鴻莫過孔子孔子才不容斥逐伐樹接浙見圍削迹困餓陳蔡門徒菜色今吾材不逮孔子不偶之厄未與之等偏可輕乎且達者未必知竆者未必愚遇者則得不遇失之故夫命厚禄善庸人尊顯命薄禄惡竒俊落魄必以偶合稱材量徳則夫專城食土者材賢孔墨身貴而名賤則居潔而行墨食千鍾之禄無一長之徳乃可戯也若夫徳髙而名白官卑而禄泊非才能之過未足以為累也士願與憲共廬不慕與賜同衡樂與夷俱旅不貪與蹠比迹髙士所貴不與俗均故其名稱不與世同身與草木俱朽聲與日月並彰行與孔子比窮文與楊雄為雙吾榮之身通而知困官大而徳細於彼為榮於我為累偶合容說身尊體佚百載之後與物俱歿名不流於一嗣文不遺於一札官雖傾倉文徳不豐非吾所臧徳汪濊而淵懿知滂沛而盈溢筆瀧漉而雨集言溶㵠窟字一有而泉出富材羨知貴行尊志體列於一世名傳於千載乃吾所謂異也充細族孤門或啁之曰宗祖無淑懿之基文墨無篇籍之遺雖著鴻麗之論無所禀階終不為髙夫氣無漸而卒至曰變物無類而妄生曰異不常有而忽見曰妖詭於衆而突出曰怪吾子何祖其先不載況未嘗履墨涂出儒門吐論數千萬言冝為妖變安得寳斯文而多賢荅曰鳥無世鳳皇獸無種麒麟人無祖聖賢物無常嘉珍高才見屈遭時而然貴士故孤興物貴故獨産文孰常在有以放賢是則澧泉有故源而嘉禾有舊根也屈竒之士見倜儻之辭生度不與俗協庸角不能程是故罕發之迹記於牒籍希岀之物勒於鼎銘五帝不一世而起伊望不同家而岀千里殊跡百載異發土貴雅材而慎興不因髙據以顯達母驪犢騂無害犧牲祖濁裔清不牓竒人爲妨牓讀鯀惡禹聖叟頑舜神伯牛寢疾仲弓潔全顔路庸固回傑超倫孔墨祖愚丘翟聖賢楊家不通卓有子雲桓氏稽可遹出君山更禀於元故能著文充以元和三年徙家辟詣楊州部丹陽九江廬江後入為治中材小任大職在刺割筆札之思歴年寢廢章和二年罷州家居年漸七十時可懸輿仕路隔絶志窮無如事有否然身有利害髮白齒落日月踰邁儔倫彌索鮮所恃賴貧無供養志不娛快曆數冉冉庚辛域際雖懼終徂愚猶沛沛乃作養性之書凡十六篇養氣自守適食則酒閉明塞聰愛精自保適輔服藥引導庶兾性命可延斯湏不老既晚無還垂書示後惟人性命長短有期人亦蟲物生死一時年歴但記孰使留之猶入黄泉消為土灰上自黄唐下臻秦漢而來折衷以聖道㭊理於通材如衡之平如鑑之開幼老生死古今罔不詳該命以不延吁嘆悲哉論衡卷第三十陸奎刻周慈寫, WYG: ''}
