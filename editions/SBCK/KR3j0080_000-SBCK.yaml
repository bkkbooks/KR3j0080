body:
  text: 王充氏論衡崇文総目三十卷世􅀁傳本或為二十七卷史館本與崇文総目同諸本繕寫互有同異宋慶暦中進士楊文昌􅀁㝎者號􅁛完善番陽洪公重刻扵㑹稽蓬莱閣下嵗月既乆文字澷滅不可復讀江南諸道行御史臺􅀴􅊗克荘公以􅀁蔵善本重加校正紹興路緫管宋公文瓉為之補􅈓而其本復完充生㑹稽而受業太學閲書巿肆遂通衆流其為學博矣閉門絶慶弔著論衡六十一萹凡二十餘萬言其用㓛勤矣書成蔡吧得之秘之帳中以為談助王朗得之及来許下人􅁛其才進故時人以為異書遂大行扵世傳之至今盖其為學博其用㓛勤其着述誠有岀扵衆人之表者也嘗試論之天地之大萬物之衆無一㝎之形而有一㝎之理人由之而不能知知之而不能名也古昔聖人窮神知化著之蕳編使天下之人皆知其􅀁以然之故而各有以全其才五三六􅀴為萬世之准則者此也先王之澤熄家自為學人自為書紫朱雜厠瓦玉集揉羣經專門猶失其實諸子尺書人人或誕論說紛然莫知所宗充心不能忍於是作論衡之書以爲衡者論之平也其爲九虚三增論死訂􅀑以祛世俗之惑使見者曉然知然否之分論者之大旨如此非所謂岀於衆人之表者乎然觀其為書其􅇚物􅁼也好舉形似以相質正而其理之一者有所未明其辯訛謬也或疑或决或信其所聞而任其所見尚有不得其事實者况乎天人之際性命之理㣲妙而難知者乎故其爲書可以謂之異書而不可以爲經常之典觀其書者見謂才進而實無以自成其才終則以爲談助而巳充之爲書或得或失不得而不論也雖然自漢以來操觚之士焦心勞思求一言之傳而不可得論衡之書獨傅至今譬之三代鼎彛之噐冝乎為世之所寳也且充之時去三代未逺文賢所傅見於是書者多矣其可使之無傅乎今世刻本㑹稽者最善克荘公為之校正而補刻之傅之人人其與帳中之書戒人勿廣者可謂遼絶矣至元七年仲春安陽韓性書論衡目錄八十五篇凡三十卷王充第一卷逢遇第一累害第二命禄第三氣壽第四第二卷幸遇第五命義第六無形第七率性第八吉驗第九第三卷偶㑹第十骨相第十一初稟第十二本性第十三物勢第十四怪竒第十五第四卷書虚第十六變虚第十七第五卷異虚第十八感虚第十九第六卷福虚第二十禍虚第二十一龍虚第二十二雷虚第二十三第七卷道虚第二十四語増第二十五第八卷儒増第二十六藝増第二十七第九卷問孔第二十八第十卷非韓第二十九刺孟第三十第十一卷談天第三十一說日第三十二荅佞第三十三第十二卷程材第三十四量知第三十五謝短第三十六第十三卷效力第三十七别通第三十八超竒第三十九第十四卷狀留第四十寒温第四十一譴告第四十二第十五卷變動第四十三招致第四十四闕明雩第四十五順鼓第四十六第十六卷亂龍第四十七遭虎第四十八商蟲第四十九講瑞第五十第十七卷指瑞第五十一是應第五十二治期第五十三第十八卷自然第五十四感類第五十五齊世第五十六第十九卷宣漢第五十七恢國第五十八驗符第五十九第二十卷須頌第六十佚文第六十一論死第六十二第二十一卷死僞第六十三第二十二卷紀妖第六十四訂􅀑第六十五第二十三卷言毒第六十六薄葬第六十七四諱第六十八時第六十九第二十四卷譏日第七十卜筮第七十一辨祟第七十二難嵗第七十三第二十五卷詰術第七十四解除第七十五祀義第七十六祭意第七十七第二十六卷實知第七十八知實第七十九第二十七卷定賢第八十第二十八卷正說第八十一書解第八十二第二十九卷案書第八十三對作第八十四第三十卷自紀第八十五論衡目録
