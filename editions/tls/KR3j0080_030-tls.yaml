body:
  text: 刺孟篇孟子見梁惠王王曰叟不遠千里而來將何以利吾國乎孟子曰仁義而已何必曰利夫利有二有貨財之利有安吉之利惠王曰何以利吾國何以知不欲安吉之利而孟子徑難以貨財之利也易曰利見大人利涉大川乾元亨利貞尚書曰黎民亦尚有利哉皆安吉之利也行仁義得安吉之利孟子必且詰問惠王何謂利吾國惠王言貨財之利乃可荅若設今惠王之問未知何趣孟子徑荅以貨財之利如惠王實問貨財孟子無以驗效也如問安吉之利而孟子荅以貨財之利失對上之指違道理之實也齊王問時子我欲中國而授孟子室養弟子以萬鍾使諸大夫國人皆有所矜式子盍為我言之時子因陳子而以告孟子孟子曰夫時子惡知其不可也如使予欲富辭十萬而受萬是為欲富乎夫孟子辭十萬失謙讓之理也夫富貴者人之所欲也不以其道得之不居也故君子之於爵祿也有所辭有所不辭豈以己不貪富貴之故而以距逆宜當受之賜乎陳臻問曰於齊王餽兼金一百鎰而不受於宋歸七十鎰而受於薛歸五十鎰而受取前日之不受是則今受之非也今日之受是則前日之不受非也夫君子必居一於此矣孟子曰皆是也當在宋也予將有遠行行者必以賮辭曰歸賮予何為不受當在薛也予有戒心辭曰聞戒故為兵戒歸之備乎予何為不受若於齊則未有處也無處而歸之是貨之也焉有君子而可以貨取乎夫金歸或受或不受皆有故非受之時己貪當不受之時己不貪也金有受不受之義而室亦宜有受不受之理今不曰己無功若已致仕受室非理而曰己不貪富貴引前辭十萬以況後萬前當受十萬之多安得辭之彭更問曰後車數十乘從者數百人以傳食於諸侯不亦泰乎孟子曰非其道則一簞食而不可受於人如其道則舜受堯之天下不以為泰受堯天下孰與十萬舜不辭天下者是其道也今不曰受十萬非其道而曰己不貪富貴失謙讓也安可以為戒乎沈同以其私問曰燕可伐與孟子曰可子噲不得與人燕子之不得受燕於子噲有士於此而子悅之不告於王而私與之子之爵祿夫士也亦無王命而私受之於子則可乎何以異於是齊人伐燕或問曰勸齊伐燕有諸曰未也沈同曰燕可伐與吾應之曰可彼然而伐之彼如曰孰可以伐之則應之曰為天吏則可以伐之今有殺人者或問之曰人可殺與則將應之曰可彼如曰孰可以殺之則應之曰為士師則可以殺之今以燕伐燕何為勸之也夫或問孟子勸王伐燕不誠是乎沈同問燕可伐與此挾私意欲自伐之也知其意慊於是宜曰燕雖可伐須為天吏乃可以伐之沈同意絕則無伐燕之計矣不知有此私意而徑應之不省其語是不知言也公孫丑問曰敢問夫子惡乎長孟子曰我知言又問何謂知言曰詖辭知其所蔽淫辭知其所陷邪辭知其所離遁辭知其所窮生於其心害於其政發於其政害於其事雖聖人復起必從吾言矣孟子知言者也又知言之所起之禍其極所致之害見彼之問則知其措辭所欲之矣知其所之則知其極所當害矣孟子有云民舉安王庶幾改諸予日望之孟子所去之王豈前所不朝之王哉而是何其前輕之疾而後重之甚也如非是前王前不去而於後去之是後王不肖甚於前而去三日宿於前不甚不朝而宿於景丑氏何孟子之操前後不同所以為王終始不一也且孟子在魯魯平公欲見之嬖人臧倉毀孟子止平公樂正子以告曰行或使之止或尼之行止非人所能也予之不遇魯侯天也前不遇於魯後不遇於齊無以異也前歸之天今則歸之於王孟子論稱竟何定哉夫不行於齊王不用則若臧倉之徒毀讒之也此亦止或尼之也皆天命不遇非人所能也去何以不徑行而留三宿乎天命不當遇於齊王不用其言天豈為三日之間易命使之遇乎在魯則歸之於天絕意無冀在齊則歸之於王庶幾有望夫如是不遇之議一在人也或曰初去未可以定天命也冀三日之間王復追之天命或時在三日之間故可也夫言如是齊王初使之去者非天命乎如使天命在三日之間魯平公比三日亦或時棄臧倉之議更用樂正子之言往見孟子孟子歸之於天何其早乎如三日之間公見孟子孟子奈前言何乎孟子去齊充虞塗問曰夫子若不豫色然前日虞聞諸夫子曰君子不怨天不尤人曰彼一時也此一時也五百年必有王者興其間必有名世者矣由周以來七百有餘歲矣以其數則過矣以其時考之則可矣夫天未欲平治天下乎如欲平治天下當今之世舍我而誰也吾何為不豫哉夫孟子言五百年有王者興何以見乎帝嚳王者而堯又王天下堯傳於舜舜又王天下舜傳於禹禹又王天下四聖之王天下也繼踵而興禹至湯且千歲湯至周亦然始於文王而卒傳於武王武王崩成王周公共治天下由周至孟子之時又七百歲而無王者五百歲必有王者之驗在何世乎云五百歲必有王者誰所言乎論不實事考驗信浮淫之語不遇去齊有不豫之色非孟子之賢效與俗儒無殊之驗也五百年者以為天出聖期也又言以天未欲平治天下也其意以為天欲平治天下當以五百年之間生聖王也如孟子之言是謂天故生聖人也然則五百歲者天生聖人之期乎如是其期天何不生聖聖王非其期故不生孟子猶信之孟子不知天也自周已來七百餘歲矣以其數則過矣以其時考之則可矣何謂數過何謂時可乎數則時時則數矣數過過五百年也從周到今七百餘歲踰二百歲矣設或王者生失時矣又言時可何謂也云五百年必有王者興又言其間必有名世與王者同乎異也如同何為再言之如異名世者謂何等也謂孔子之徒孟子之輩教授後生覺悟頑愚乎已有孔子己又以生矣如謂聖臣乎當與聖王同時聖王出聖臣見矣言五百年而已何為言其間如不謂五百年時謂其中間乎是謂二三百年之時也聖人不與五百年時聖王相得夫如是孟子言其間必有名世者竟謂誰也夫天未欲平治天下也如欲治天下舍予而誰也言若此者不自謂當為王者有王者若為王臣矣為王者臣皆天也己命不當平治天下不浩然安之於齊懷恨有不豫之色失之矣彭更問曰士無事而食可乎孟子曰不通功易事以羨補不足則農有餘粟女有餘布子如通之則梓匠輪輿皆得食於子於此有人焉入則孝出則悌守先王之道以待後世之學者而不得食於子子何尊梓匠輪輿而輕為仁義者哉曰梓匠輪輿其志將以求食也君子之為道也其志亦將以求食與孟子曰子何以其志為哉其有功於子可食而食之矣且子食志乎食功乎曰食志曰有人於此毀瓦畫墁其志將以求食也則子食之乎曰否曰然則子非食志食功也夫孟子引毀瓦畫墁者欲以詰彭更之言也知毀瓦畫墁無功而有志彭更必不食也雖然引毀瓦畫墁非所以詰彭更也何則諸志欲求食者毀瓦畫墁者不在其中不在其中則難以詰人矣夫人無故毀瓦畫墁此不癡狂則遨戲也癡狂之人志不求食遨戲之人亦不求食求食者皆多人所共得利之事以所作鬻賣於市得賈以歸乃得食焉今毀瓦畫墁無利於人何志之有有知之人知其無利固不為也無知之人與癡狂比固無其志夫毀瓦畫墁猶比童子擊壤於塗何以異哉擊壤於塗者其志亦欲求食乎此尚童子未有志也巨人博戲亦畫墁之類也博戲之人其志復求食乎博戲者尚有相奪錢財錢財眾多己亦得食或時有志夫投石超距亦畫墁之類也投石超距之人其志有求食者乎然則孟子之詰彭更也未為盡之也如彭更以孟子之言可謂禦人以口給矣匡章子曰陳仲子豈不誠廉士乎居於於陵三日不食耳無聞目無見也井上有李螬食實者過半扶服往將食之三咽然後耳有聞目有見也孟子曰於齊國之士吾必以仲子為巨擘焉雖然仲子惡能廉充仲子之操則蚓而後可者也夫蚓上食槁壤下飲黃泉仲子所居之室伯夷之所築與抑亦盜跖之所築與所食之粟伯夷之所樹與抑亦盜跖之所樹與是未可知也曰是何傷哉彼身織屨妻辟纑以易之也曰仲子齊之世家兄戴蓋祿萬鍾以兄之祿為不義之祿而不食也以兄之室為不義之室而弗居也辟兄離母處於於陵他日歸則有饋其兄生鵝者也己頻蹙曰惡用是鶂鶂者為哉他日其母殺是鵝也與之食之其兄自外來至曰是鶂鶂之肉也出而吐之以母則不食以妻則食之以兄之室則不居以於陵則居之是尚能為充其類也乎若仲子者蚓而後充其操者也夫孟子之非仲子也不得仲子之短矣仲子之怪鵝如吐之者豈為在母則不食乎乃先譴鵝曰惡用鶂鶂者為哉他日其母殺以食之其兄曰是鶂鶂之肉仲子恥負前言即吐而出之而兄不告則不吐不吐則是食於母也謂之在母則不食失其意矣使仲子執不食於母鵝膳至不當食也今既食之知其為鵝怪而吐之故仲子之吐鵝也恥食不合己志之物也非負親親之恩而欲勿母食也又言仲子惡能廉充仲子之操則蚓而後可者也夫蚓上食槁壤下飲黃泉是謂蚓為至廉也仲子如蚓乃為廉潔耳今所居之宅伯夷之所築所食之粟伯夷之所樹仲子居而食之於廉潔可也或時食盜跖之所樹粟居盜跖之所築室汙廉潔之行矣用此非仲子亦復失之室因人故粟以屨纑易之正使盜之所樹築己不聞知今兄之不義有其操矣操見於眾昭晳議論故避於陵不處其宅織屨辟纑不食其祿也而欲使仲子處於陵之地避若兄之宅吐若兄之祿耳聞目見昭晳不疑仲子不處不食明矣今於陵之宅不見築者為誰粟不知樹者為誰何得成室而居之何得成粟而食之孟子非之是為太備矣仲子所居或時盜之所築仲子不知而居之謂之不充其操唯蚓然後可者也夫盜室之地中亦有蚓焉食盜宅中之槁壤飲盜宅中之黃泉蚓惡能為可乎充仲子之操滿孟子之議魚然後乃可夫魚處江海之中食江海之土海非盜所鑿土非盜所聚也然則仲子有大非孟子非之不能得也夫仲子之去母辟兄與妻獨處於陵以兄之宅為不義之宅以兄之祿為不義之祿故不處不食廉潔之至也然則其從於陵歸候母也宜自齎食而行鵝膳之進也必與飯俱母之所為飯者兄之祿也母不自有私粟以食仲子明矣仲子食兄祿也伯夷不食周粟餓死於首陽之下豈一食周粟而以汙其潔行哉仲子之操近不若伯夷而孟子謂之若蚓乃可失仲子之操所當比矣孟子曰莫非天命也順受其正是故知命者不立乎巖牆之下盡其道而死者為正命也桎梏而死者非正命也夫孟子之言是謂人無觸值之命也順操行者得正命妄行苟為得非正命是天命於操行也夫子不王顏淵早夭子夏失明伯牛為癘四者行不順與何以不受正命比干剖子胥烹子路葅天下極戮非徒桎梏也必以桎梏效非正命則比干子胥行不順也人稟性命或當壓溺兵燒雖或慎操脩行其何益哉竇廣國與百人俱臥積炭之下炭崩百人皆死廣國獨濟命當封侯也積炭與巖墻何以異命不當壓雖巖崩有廣國之命者猶將脫免行或使之止或尼之命當壓猶或使之立於墻下孔甲所入主人之子天命當賤雖載入宮猶為守者不立巖墻之下與孔甲載子入宮同一實也
