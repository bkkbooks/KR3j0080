body:
  text: 書解篇或曰士之論高何必以文荅曰夫人有文質乃成物有華而不實有實而不華者易曰聖人之情見乎辭出口為言集札為文文辭施設實情敷烈夫文德世服也空書為文實行為德著之於衣為服故曰德彌盛者文彌縟德彌彰者文彌明大人德擴其文炳小人德熾其文斑官尊而文繁德高而文積華而晥者大夫之簀曾子寢疾命元起易由此言之衣服以品賢賢以文為差愚傑不別須文以立折非唯於人物亦咸然龍鱗有文於蛇為神鳳羽五色於鳥為君虎猛毛蚡蜦龜知背負文四者體不質於物為聖賢且夫山無林則為土山地無毛則為瀉土人無文則為僕人土山無麋鹿瀉土無五穀人無文德不為聖賢上天多文而后土多理二氣協和聖賢稟受法象本類故多文彩瑞應符命莫非文者晉唐叔虞魯成季友惠公夫人號曰仲子生而怪奇文在其手張良當貴出與神會老父授書卒封留侯河神故出圖洛靈故出書竹帛所記怪奇之物不出潢洿物以文為表人以文為基棘子成欲彌文子貢譏之謂文不足奇者子成之徒也著作者為文儒說經者為世儒二儒在世未知何者為優或曰文儒不若世儒世儒說聖人之經解賢者之傳義理廣博無不實見故在官常位位最尊者為博士門徒聚眾招會千里身雖死亡學傳於後文儒為華淫之說於世無補故無常官弟子門徒不見一人身死之後莫有紹傳此其所以不如世儒者也荅曰不然夫世儒說聖情共起並驗俱追聖人事殊而務同言異而義鈞何以謂之文儒之說無補於世世儒業易為故世人學之多非事可析第故官廷設其位文儒之業卓絕不循人寡其書業雖不講門雖無人書文奇偉世人亦傳彼虛說此實篇折累二者孰者為賢案古俊乂著作辭說自用其業自明於世世儒當時雖尊不遭文儒之書其跡不傳周公制禮樂名垂而不滅孔子作春秋聞傳而不絕周公孔子難以論言漢世文章之徒陸賈司馬遷劉子政楊子雲其材能若奇其稱不由人世傳詩家魯申公書家千乘歐陽公孫不遭太史公世人不聞夫以業自顯孰與須人乃顯夫能紀百人孰與廑能顯其名或曰著作者思慮間也未必材知出異人也居不幽思不至使著作之人總眾事之凡典國境之職汲汲忙忙或暇著作試使庸人積閑暇之思亦能成篇八十數文王日昃不暇食周公一沐三握髮何暇優游為麗美之文於筆札孔子作春秋不用於周也司馬長卿不預公卿之事故能作子虛之賦楊子雲存中郎之官故能成太玄經就法言使孔子得王春秋不作長卿子雲為相賦玄不工籍荅曰文王日昃不暇食此謂演易而益卦周公一沐三握髮為周改法而制周道不弊孔子不作休思慮間也周法闊踈不可因也夫稟天地之文發於胸臆豈為間作不暇日哉感偽起妄源流氣烝管仲相桓公致於九合商鞅相孝公為秦開帝業然而二子之書篇章數十長卿子雲二子之倫也俱感故才並才同故業鈞皆士而各著不以思慮間也問事彌多而見彌博官彌劇而識彌泥居不幽則思不至思不至則筆不利嚚頑之人有幽室之思雖無憂不能著一字蓋人材有能無有不暇有無材而不能思無有知而不能著有鴻材欲作而無起細知以問而能記蓋奇有無所因無有不能言兩有無所睹無不暇造作或曰凡作者精思已極居位不能領職蓋人思有所倚著則精有所盡索著作之人書言通奇其材已極其知已罷案古作書者多位布散槃解輔傾寧危非著作之人所能為也夫有所偪有所泥則有所自篇章數百呂不韋作春秋舉家徙蜀淮南王作道書禍至滅族韓非著治術身下秦獄身且不全安能輔國夫有長於彼安能不短於此深於作文安能不淺於政治荅曰人有所優固有所劣人有所工固有所拙非劣也志意不為也非拙也精誠不加也志有所存顧不見泰山思有所至有身不暇徇也稱干將之利刺則不能擊擊則不能刺非刃不利不能一旦二也蛢彈雀則失鷃射鵲則失鴈方員畫不俱成左右視不並見人材有兩為不能成一使干將寡刺而更擊蛢捨鵲而射鴈則下射無失矣人委其篇章專為政治則子產子賤之跡不足侔也古作書者多立功不用也管仲晏嬰功書並作商鞅虞卿篇治俱為高祖既得天下馬上之計未敗陸賈造新語高祖粗納采呂氏橫逆劉氏將傾非陸賈之策帝室不寧蓋材知無不能在所遭遇遇亂則知立功有起則以其材著書者也出口為言著文為篇古以言為功者多以文為敗者希呂不韋淮南王以他為過不以書有非使客作書不身自為如不作書猶蒙此章章之禍人古今違屬未必皆著作材知極也鄒陽舉䟽免罪於梁徐樂上書身拜郎中材能以其文為功於人何嫌不能營衛其身韓蚤信公子非國不傾危及非之死李斯妬奇非以著作材極不能復有為也春物之傷或死之也殘物不傷秋亦大長假令非不死秦未可知故才人能令其行可尊不能使人必法己能令其言可行不能使人必采取之矣或曰古今作書者非一各穿鑿失經傳之實違聖人質故謂之蕞殘比之玉屑故曰蕞殘滿車不成為道玉屑滿篋不成為寶前人近聖猶為蕞殘況遠聖從後復重為者乎其作必為妄其言必不明安可采用而施行荅曰聖人作其經賢者造其傳述作者之意採聖人之志故經須傳也俱賢所為何以獨謂經傳是他書記非彼見經傳傳經之文經須而解故謂之是他書與書相違更造端緒故謂之非若此者韙是於五經使言非五經雖是不見聽使五經從孔門出到今常令人不缺滅謂之純壹信之可也今五經遭亡秦之奢侈觸李斯之橫議燔燒禁防伏生之徒抱經深藏漢興收五經經書缺滅而不明篇章棄散而不具鼂錯之輩各以私意分拆文字師徒相因相授不知何者為是亡秦無道敗亂之也秦雖無道不燔諸子諸子尺書文篇具在可觀讀以正說可采掇以示後人後人復作猶前人之造也夫俱鴻而知皆傳記所稱文義與經相薄何以獨謂文書失經之實由此言之經缺而不完書無佚本經有遺篇折累二者孰與蕞殘易據事象詩采民以為篇樂須民驩禮待民平四經有據篇章乃成尚書春秋采掇史記史記興無異書以民事一意六經之作皆有據由此言之書亦為本經亦為末末失事實本得道質折累二者孰為玉屑知屋漏者在宇下知政失者在草野知經誤者在諸子諸子尺書文明實是說章句者終不求解扣明師師相傳初為章句者非通覽之人也
