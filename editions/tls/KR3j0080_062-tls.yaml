body:
  text: 論死篇世謂人死為鬼有知能害人試以物類驗之人死不為鬼無知不能害人何以驗之驗之以物人物也物亦物也物死不為鬼人死何故獨能為鬼世能別物不能為鬼則人為鬼不為鬼尚難分明如不能別則亦無以知其能為鬼也人之所以生者精氣也死而精氣滅能為精氣者血脈也人死血脈竭竭而精氣滅滅而形體朽朽而成灰土何用為鬼人無耳目則無所知故聾盲之人比於草木夫精氣去人豈徒與無耳目同哉朽則消亡荒忽不見故謂之鬼神人見鬼神之形故非死人之精也何則鬼神荒忽不見之名也人死精神升天骸骨歸土故謂之鬼神鬼者歸也神者荒忽無形者也或說鬼神陰陽之名也陰氣逆物而歸故謂之鬼陽氣導物而生故謂之神神者伸也申復無已終而復始人用神氣生其死復歸神氣陰陽稱鬼神人死亦稱鬼神氣之生人猶水之為冰也水凝為冰氣凝為人冰釋為水人死復神其名為神也猶冰釋更名水也人見名異則謂有知能為形而害人無據以論之也人見鬼若生人之形以其見若生人之形故知非死人之精也何以效之以囊橐盈粟米米在囊中若粟在橐中滿盈堅彊立樹可見人瞻望之則知其為粟米囊橐何則囊橐之形若其容可察也如囊穿米出橐敗粟棄則囊橐委辟人瞻望之弗復見矣人之精神藏於形體之內猶粟米在囊橐之中也死而形體朽精氣散猶囊橐穿敗粟米棄出也粟米棄出囊橐無復有形精氣散亡何能復有體而人得見之乎禽獸之死也其肉盡索皮毛尚在制以為裘人望見之似禽獸之形故世有衣狗裘為狗盜者人不覺知假狗之皮毛故人不意疑也今人死皮毛朽敗雖精氣尚在神安能復假此形而以行見乎夫死人不能假生人之形以見猶生人不能假死人之魂以亡矣六畜能變化象人之形者其形尚生精氣尚在也如死其形腐朽雖虎兕勇悍不能復化魯公牛哀病化為虎亦以未死也世有以生形轉為生類者矣未有以死身化為生象者也天地開闢人皇以來隨壽而死若中年夭亡以億萬數計今人之數不若死者多如人死輒為鬼則道路之上一步一鬼也人且死見鬼宜見數百千萬滿堂盈廷填塞巷路不宜徒見一兩人也人之兵死也世言其血為燐血者生時之精氣也人夜行見燐不象人形渾沌積聚若火光之狀燐死人之血也其形不類生人之形也其形不類生人之形精氣去人何故象人之體人見鬼也皆象死人之形則可疑死人為鬼或反象生人之形病者見鬼云甲來甲時不死氣象甲形如死人為鬼病者何故見生人之體乎天地之性能更生火不能使滅火復燃能更生人不能令死人復見不能使滅灰更為燃火吾乃頗疑死人能復為形案火滅不能復燃以況之死人不能復為鬼明矣夫為鬼者人謂死人之精神如審鬼者死人之精神則人見之宜徒見裸袒之形無為見衣帶被服也何則衣服無精神人死與形體俱朽何以得貫穿之乎精神本以血氣為主血氣常附形體形體雖朽精神尚在能為鬼可也今衣服絲絮布帛也生時血氣不附著而亦自無血氣敗朽遂已與形體等安能自若為衣服之形由此言之見鬼衣服象之則形體亦象之矣象之則知非死人之精神也夫死人不能為鬼則亦無所知矣何以驗之以未生之時無所知也人未生在元氣之中既死復歸元氣元氣荒忽人氣在其中人未生無所知其死歸無知之本何能有知乎人之所以聰明智惠者以含五常之氣也五常之氣所以在人者以五藏在形中也五藏不傷則人智惠五藏有病則人荒忽荒忽則愚癡矣人死五藏腐朽腐朽則五常無所託矣所用藏智者已敗矣所用為智者已去矣形須氣而成氣須形而知天下無獨燃之火世間安得有無體獨知之精人之死也其猶夢也夢者殄之次也殄者死之比也人殄不悟則死矣案人殄復悟死復來者與夢相似然則夢殄死一實也人夢不能知覺時所作猶死不能識生時所為矣人言談有所作於臥人之旁臥人不能知猶對死人之棺為善惡之事死人不能復知也夫臥精氣尚在形體尚全猶無所知況死人精神消亡形體朽敗乎人為人所敺傷詣吏告苦以語人有知之故也或為人所殺則不知何人殺也或家不知其尸所在使死人有知必恚人之殺己也當能言於吏旁告以賊主名若能歸語其家告以尸之所在今則不能無知之效也世間死者令生人殄而用其言及巫叩元絃下死人魂因巫口談皆誇誕之言也如不誇誕物之精神為之象也或曰不能言也夫不能言則亦不能知矣知用氣言亦用氣焉人之未病也智惠精神定矣病則惽亂精神擾也夫死病之甚者也病死之微猶惽亂況其甚乎精神擾自無所知況其散也人之死也猶火之滅也火滅而燿不照人死而知不惠二者宜同一實論者猶謂死有知惑也人病且死與火之且滅何以異火滅光消而燭在人死精亡而形存謂人死有知是謂火滅復有光也隆冬之月寒氣用事水凝為冰踰春氣溫冰釋為水人生於天地之間其猶冰也陰陽之氣凝而為人年終壽盡死還為氣夫春水不能復為冰死魂安能復為形妬夫媢妻同室而處淫亂失行忿怒鬭訟夫死妻更嫁妻死夫更娶以有知驗之宜大忿怒今夫妻死者寂莫無聲更嫁娶者平忽無禍無知之驗也孔子葬母於防既而雨甚至防墓崩孔子聞之泫然流涕曰古者不修墓遂不復修使死有知必恚人不脩也孔子知之宜輒修墓以喜魂神然而不修聖人明審曉其無知也枯骨在野時鳴呼有聲若夜聞哭聲謂之死人之音非也何以驗之生人所以言語吁呼者氣括口喉之中動搖其舌張歙其口故能成言譬猶吹簫笙簫笙折破氣越不括手無所弄則不成音夫簫笙之管猶人之口喉也手弄其孔猶人之動舌也人死口喉腐敗舌不復動何能成言然而枯骨時呻鳴者人骨自有能呻鳴者焉或以為妖也是與夜鬼哭無以異也妖氣為呻鳴之變自有所為依倚死骨之側人則謂之骨尚有知呻鳴於野草澤暴體以千萬數呻鳴之聲宜步屬焉夫有能使不言者言未有言者死能復使之言言者亦不能復使之言猶物生以青為氣或予之也物死青者去或奪之也予之物青奪之青去去後不能復予之青物亦不能復自青聲色俱通並稟於天青青之色猶梟梟之聲也死物之色不能復青獨為死人之聲能復自言惑也人之所以能言語者以有氣力也氣力之盛以能飲食也飲食損減則氣力衰衰則聲音嘶困不能食則口不能復言夫死困之甚何能復言或曰死人歆肴食氣故能言夫死人之精生人之精也使生人不飲食而徒以口歆肴食之氣不過三日則餓死矣或曰死人之精神於生人之精故能歆氣為音夫生人之精在於身中死則在於身外死之與生何以殊身中身外何以異取水實於大盎中盎破水流地地水能異於盎中之水乎地水不異於盎中之水身外之精何故殊於身中之精人死不為鬼無知不能語言則不能害人矣何以驗之夫人之怒也用氣其害人用力用力須䈥骨而彊彊則能害人忿怒之人呴呼於人之旁口氣喘射人之面雖勇如賁育氣不害人使舒手而擊舉足而蹶則所擊蹶無不破折夫死骨朽䈥力絕手足不舉雖精氣尚在猶呴吁之時無嗣助也何以能害人也凡人與物所以能害人者手臂把刃爪牙堅利之故也今人死手臂朽敗不能復持刃爪牙隳落不能復囓噬安能害人兒之始生也手足具成手不能搏足不能蹶者氣適凝成未能堅彊也由此言之精氣不能堅彊審矣氣為形體形體微弱猶未能害人況死氣去精神絕微弱猶未能害人寒骨謂能害人者邪死人之氣不去邪何能害人鷄卵之未孚也澒溶於鷇中潰而視之若水之形良雌傴伏體方就成就成之後能啄蹶之夫人之死猶澒溶之時澒溶之氣安能害人人之所以勇猛能害人者以飲食也飲食飽足則彊壯勇猛彊壯勇猛則能害人矣人病不能飲食則身羸弱羸弱困甚故至於死病困之時仇在其旁不能咄叱人盜其物不能禁奪羸弱困劣之故也夫死羸弱困劣之甚者也何能害人有雞犬之畜為人所盜竊雖怯無勢之人莫不忿怒忿怒之極至相賊滅敗亂之時人相啖食者使其神有知宜能害人身貴於雞犬己死重於見盜忿怒於雞犬無怨於食己不能害人之驗也蟬之未蛻也為復育已蛻也去復育之體更為蟬之形使死人精神去形體若蟬之去復育乎則夫為蟬者不能害為復育者夫蟬不能害復育死人之精神何能害生人之身夢者之義疑或言夢者精神自止身中為吉凶之象或言精神行與人物相更今其審止身中死之精神亦將復然今其審行人夢殺傷人夢殺傷人若為人所復殺明日視彼之身察己之體無兵刃創傷之驗夫夢用精神精神死之精神也夢之精神不能害人死之精神安能為害火熾而釜沸沸止而氣歇以火為主也精神之怒也乃能害人不怒不能害人火猛竈中釜湧氣蒸精怒胸中力盛身熱今人之將死身體清涼涼益清甚遂以死亡當死之時精神不怒身亡之後猶湯之離釜也安能害人物與人通人有癡狂之病如知其物然而理之病則愈矣夫物未死精神依倚形體故能變化與人交通已死形體壞爛精神散亡無所復依不能變化夫人之精神猶物之精神也物生精神為病其死精神消亡人與物同死而精神亦滅安能為害禍設謂人貴精神有異成事物能變化人則不能是反人精神不若物物精神奇於人也水火燒溺凡能害人者皆五行之物金傷人木敺人土壓人水溺人火燒人使人死精神為五行之物乎害人不為乎不能害人不為物則為氣矣氣之害人者太陽之氣為毒者也使人死其氣為毒乎害人不為乎不能害人夫論死不為鬼無知不能害人則夫所見鬼者非死人之精其害人者非其精所為明矣
