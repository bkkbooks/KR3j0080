body:
  text: 謝短篇程材量知言儒生文吏之材不能相過以儒生脩大道以文吏曉簿書道勝於事故謂儒生頗愈文吏也此職業外相程相量也其內各有所以為短未實謝也夫儒生能說一經自謂通大道以驗文吏文吏曉簿書自謂文無害以戲儒生各持滿而自藏非彼而是我不知所為短不悟於己未足論衡詶之將使𥇛然各知所乏夫儒生所短不徒以不曉簿書文吏所劣不徒以不通大道也反以閉闇不覽古今不能各自知其所業之事未具足也二家各短不能自知也世之論者而亦不能詶之如何夫儒生之業五經也南面為師旦夕講授章句滑習義理究備於五經可也五經之後秦漢之事無不能知者短也夫知古不知今謂之陸沉然則儒生所謂陸沉者也五經之前至於天地始開帝王初立者主名為誰儒生又不知也夫知今不知古謂之盲瞽五經比於上古猶為今也徒能說經不曉上古然則儒生所謂盲瞽者也儒生猶曰上古久遠其事闇昧故經不載而師不說也夫三王之事雖遠矣經雖不載義所連及五經之家所當共知儒生所當審說也夏自禹嚮國幾載而至於殷殷自湯幾祀而至於周周自文王幾年而至於秦桀亡夏而紂棄殷滅周者何王也周猶為遠秦則漢之所伐也夏始於禹殷本於湯周祖后稷秦初為人者誰秦燔五經坑殺儒士五經之家所共聞也秦何起而燔五經何感而坑儒士秦則前代也漢國自儒生之家也從高祖至今朝幾世歷年訖今幾載初受何命復獲何瑞得天下難易孰與殷周家人子弟學問歷幾歲人問之曰居宅幾年祖先何為不能知者愚子弟也然則儒生不能知漢事世之愚蔽人也溫故知新可以為師古今不知稱師如何彼人曰二尺四寸聖人文語朝夕講習義類所及故可務知漢事未載於經名為尺藉短書比於小道其能知非儒者之貴也儒生不能都曉古今欲各別說其經經事義類乃以不知為貴也事不曉不以為短請復別問儒生各以其經旦夕之所講說先問易家易本何所起造作之者為誰彼將應曰伏羲作八卦文王演為六十四孔子作彖象繫辭三聖重業易乃具足問之曰易有三家一曰連山二曰歸藏三曰周易伏羲所作文王所造連山乎歸藏周易也秦燔五經易何以得脫漢興幾年而復立宣帝之時河內女子壞老屋得易一篇名為何易此時易具足未問尚書家曰今旦夕所授二十九篇奇有百二篇又有百篇二十九篇何所起百二篇何所造秦焚詩書之時尚書諸篇皆何在漢興始錄尚書者何帝初受學者何人問禮家曰前孔子時周已制禮殷禮夏禮凡三王因時損益篇有多少文有增減不知今禮周乎殷夏也彼必以漢承周將曰周禮夫周禮六典又六轉六六三十六三百六十是以周官三百六十也案今禮經不見六典無三百六十官又不見天子天子禮廢何時豈秦滅之哉宣帝時河內女子壞老屋得佚禮一篇十六篇中是何篇是者高祖詔叔孫通制作儀品十六篇何在而復定儀禮見在十六篇秦火之餘也更秦之時篇凡有幾問詩家曰詩作何帝王時也彼將曰周衰而詩作蓋康王時也康王德缺於房大臣刺晏故詩作也夫文武之隆貴在成康康王未衰詩安得作周非一王何知其康王也二王之末皆衰夏殷衰時詩何不作尚書曰詩言志歌詠言此時已有詩也斷取周以來而謂興於周古者采詩詩有文也今詩無書何知非秦燔五經詩獨無餘札也問春秋家曰孔子作春秋周何王時也自衛反魯然後樂正春秋作矣自衛反魯哀公時也自衛何君也俟孔子以何禮而孔子反魯作春秋乎孔子錄史記以作春秋史記本名春秋乎制作以為經乃歸春秋也法律之家亦為儒生問曰九章誰所作也彼聞皋陶作獄必將曰皋陶也詰曰皋陶唐虞時唐虞之刑五刑案今律無五刑之文或曰蕭何也詰曰蕭何高祖時也孝文之時齊太倉令淳于意有罪徵詣長安其女緹縈為父上書言肉刑壹施不得改悔文帝痛其言乃改肉刑案今九章象刑非肉刑也文帝在蕭何後知時肉刑也蕭何所造反具象刑也而云九章蕭何所造乎古禮三百威儀三千刑亦正刑三百科條三千出於禮入於刑禮之所去刑之所取故其多少同一數也今禮經十六蕭何律有九章不相應又何五經題篇皆以事義別之至禮與律猶經也題之禮言經禮律言盜律何夫揔問儒生以古今之義儒生不能知別各以其經事問之又不能曉斯則坐守何信師法不頗博覽之咎也文吏自謂知官事曉簿書問之曰曉知其事當能究達其義通見其意否文吏必將罔然問之曰古者封侯各專國土今置太守令長何義古人井田民為公家耕今量租芻何意一業歲使民居更一月何據年二十三傅十五賦七歲頭錢二十三何緣有臈何帝王時門戶井竈何立社稷先農靈星何祠歲終逐疫何驅使立桃梗象人於門戶何旨挂蘆索於戶上畫虎於門闌何放除墻壁書畫厭火丈夫何見步之六尺冠之六寸何應有尉史令史無丞長史何制兩郡移書曰敢告卒人兩縣不言何解郡言事二府曰敢言之司空曰上何狀賜民爵八級何法名曰簪褭上造何謂吏上功曰伐閱名籍墨狀何指七十賜王杖何起著鳩於杖末不著爵何杖苟以鳩為善不賜鳩而賜鳩杖而不爵何說日分六十漏之盡百鼓之致五何故吏衣黑衣宮闕赤墀何慎服鞶於腰著絇於履何備佩刀於右帶劍於左何人備著鉤於履冠在於首何象吏居城郭出乘車馬坐治文書起城郭何王造車輿何工生馬何地作書何人造城郭及馬所生難知也遠也造車作書易曉也必將應曰倉頡作書奚仲作車詰曰倉頡何感而作書奚仲何起而作車又不知也文吏所當知然而不知亦不博覽之過也夫儒生不覽古今所知不過守信經文滑習章句解剝互錯分明乖異文吏不曉吏道所能不過案獄考事移書下記對鄉便給之准无一閱備皆淺略不及偏駮不純俱有闕遺何以相言
