body:
  text: 感虛篇儒者傳書言堯之時十日並出萬物燋枯堯上射十日九日去一日常出此言虛也夫人之射也不過百步矢力盡矣日之行也行天星度天之去人以萬里數堯上射之安能得日使堯之時天地相近不過百步則堯射日矢能及之過百步不能得也假使堯時天地相近堯射得之猶不能傷日傷日何肯去何則日火也使在地之火附一把炬人從旁射之雖中安能滅之地火不為見射而滅天火何為見射而去此欲言堯以精誠射之精誠所加金石為虧蓋誠無堅則亦無遠矣夫水與火各一性也能射火而滅之則當射水而除之洪水之時氾濫中國為民大害堯何不推精誠射而除之堯能射日使火不為害不能射河使水不為害夫射水不能卻水則知射日之語虛非實也或曰日氣也射雖不及精誠滅之夫天亦遠使其為氣則與日月同使其為體則與金石等以堯之精誠滅日虧金石上射日則能穿天乎世稱桀紂之惡射天而毆地譽高宗之德政消桑榖今堯不能以德滅十日而必射之是德不若高宗惡與桀紂同也安能以精誠獲天之應也傳書言武王伐紂渡孟津陽侯之波逆流而擊疾風晦冥人馬不見於是武王左操黃鉞右執白旄瞋目而麾之曰余在天下誰敢害吾意者於是風霽波罷此言虛也武王渡孟津時士眾喜樂前歌後舞天人同應人喜天怒非實宜也前歌後舞未必其實麾風而止之迹近為虛夫風者氣也論者以為天地之號令也武王誅紂是乎天當安靜以祐之如誅紂非乎而天風者怒也武王不奉天令求索己過瞋目言曰余在天下誰敢害吾意者重天怒增己之惡也風何肯止父母怒子不改過瞋目大言父母肯貰之乎如風天所為禍氣自然是亦無知不為瞋目麾之故止夫風猶雨也使武王瞋目以旄麾雨而止之乎武王不能止雨則亦不能止風或時武王適麾之風偶自止世褒武王之德則謂武王能止風矣傳書言魯陽公與韓戰戰酣日暮公援戈而麾之日為之反三舍此言虛也凡人能以精誠感動天者專心一意委務積神精通于天天為變動然尚未可謂然魯陽公志在於戰為日暮一麾安能令日反使聖人麾日日終不反魯陽公何人而使日反乎鴻範曰星有好風星有好雨日月之行則有冬有夏月之從星則有風雨夫星與日月同精日月不從星星輒復變明日月行有常度不得從星之好惡也安得從魯陽公之所欲星之在天也為日月舍猶地有郵亭為長吏廨也二十八舍有分度一舍十度或增或減言日反三舍乃三十度也日日行一度一麾之間反三十日時所在度也如謂舍為度三度亦三日行也一麾之間令日卻三日也宋景公推誠出三善言熒惑徙三舍實論者猶謂之虛魯陽公爭鬭惡日之暮以此一戈麾無誠心善言日為之反殆非其實哉且日火也聖人麾火終不能卻魯陽公麾日安能使反或時戰時日正卯戰迷謂日之暮麾之轉左曲道日若卻世好神怪因謂之反不道所謂也傳書言荊軻為燕太子謀刺秦王白虹貫日衛先生為秦畫長平之事太白蝕昴此言精誠感天天為變動也夫言白虹貫日太白蝕昴實也言荊軻之謀衛先生之畫感動皇天故白虹貫日太白蝕昴者虛也夫以筯撞鍾以筭擊鼓不能鳴者所用撞擊之者小也今人之形不過七尺以七尺形中精神欲有所為雖積銳意猶筯撞鍾筭擊鼓也安能動天精非不誠所用動者小也且所欲害者人也人不動天反動乎問曰人之害氣能相動乎曰不能豫讓欲害趙襄子襄子心動貫高欲篡高祖高祖亦心動二子懷精故兩主振感曰禍變且至身自有怪非適人所能動也何以驗之時或遭狂人於途以刃加己狂人未必念害己身也然而己身先時已有妖怪矣由此言之妖怪之至禍變自凶之象非欲害己者之所為也且凶之人卜得惡兆筮得凶卦出門見不吉占危睹禍氣禍氣見於面猶白虹太白見於天也變見於天妖出於人上下適然自相應也傳書言燕太子丹朝於秦不得去從秦王求歸秦王執留之與之誓曰使日再中天雨粟令烏白頭馬生角廚門木象生肉足乃得歸當此之時天地祐之日為再中天雨粟烏白頭馬生角廚門木象生肉足秦王以為聖乃歸之此言虛也燕太子丹何人而能動天聖人之拘不能動天太子丹賢者也何能致此夫天能祐太子生諸瑞以免其身則能和秦王之意以解其難見拘一事而易生瑞五事而難舍一事之易為五事之難何天之不憚勞也湯困夏臺文王拘羑里孔子厄陳蔡三聖之困天不能祐使拘之者睹祐知聖出而尊厚之或曰拘三聖者不與三誓三聖心不願故祐聖之瑞無因而至天之祐人猶借人以物器矣人不求索則弗與也曰太子願天下瑞之時豈有語言乎心願而已然湯閉於夏臺文王拘於羑里時心亦願出孔子厄陳蔡心願食天何不令夏臺羑里關鑰毀敗湯文涉出雨粟陳蔡孔子食飽乎太史公曰世稱太子丹之令天雨粟馬生角大抵皆虛言也太史公書漢世實事之人而云虛言近非實也傳書言杞梁氏之妻嚮城而哭城為之崩此言杞梁從軍不還其妻痛之嚮城而哭至誠悲痛精氣動城故城為之崩也夫言嚮城而哭者實也言城為之崩者虛也夫人哭悲莫過雍門子雍門子哭對孟嘗君孟嘗君為之於邑蓋哭之精誠故對嚮之者悽愴感慟也夫雍門子能動孟嘗之心不能感孟嘗衣者衣不知惻怛不以人心相關通也今城土也土猶衣也無心腹之藏安能為悲哭感慟而崩使至誠之聲能動城土則其對林木而哭能折草破木乎嚮水火而泣能涌水滅火乎夫草木水火與土無異然杞梁之妻不能崩城明矣或時城適自崩杞梁妻適哭下世好虛不原其實故崩城之名至今不滅傳書言鄒衍無罪見拘於燕當夏五月仰天而歎天為隕霜此與杞梁之妻哭而崩城無以異也言其無罪見拘當夏仰天而歎實也言天為之雨霜虛也夫萬人舉口並解吁嗟猶未能感天鄒衍一人冤而壹歎安能下霜鄒衍之冤不過曾子伯奇曾子見疑而吟伯奇被逐而歌疑逐與拘同吟歌與歎等曾子伯奇不能致寒鄒衍何人獨能雨霜被逐之冤尚未足言申生伏劍子胥刎頸實孝而賜死誠忠而被誅且臨死時皆有聲辭聲辭出口與仰天歎無異天不為二子感動獨為鄒衍動豈天痛見拘不悲流血哉伯奇冤痛相似而感動不同也夫熯一炬火爨一鑊水終日不能熱也倚一尺冰置庖廚中終夜不能寒也何則微小之感不能動大巨也今鄒衍之歎不過如一炬尺冰而皇天巨大不徒鑊水庖廚之醜類也一仰天歎天為隕霜何天之易感霜之易降也夫哀與樂同喜與怒均衍興怨痛使天下霜使衍蒙非望之賞仰天而笑能以冬時使天熱乎變復之家曰人君秋賞則溫夏罰則寒寒不累時則霜不降溫不兼日則冰不釋一夫冤而一歎天輒下霜何氣之易變時之易轉也寒溫自有時不合變復之家且從變復之說或時燕王好用刑寒氣應至而衍囚拘而歎歎時霜適自下世見適歎而霜下則謂鄒衍歎之致也傳書言師曠奏白雪之曲而神物為之下降風雨暴至平公因之癃病晉國赤地或言師曠清角之曲一奏之有雲從西北起再奏之大風至大雨隨之裂帷幕破俎豆墮廊瓦坐者散走平公恐懼伏乎廊室晉國大旱赤地三年平公癃病夫白雪與清角或同曲而異名其禍敗同一實也傳書之家載以為是世俗觀見信以為然原省其實殆虛言也夫清角何音之聲而能致此曰清角木音也故致風而雨如木為風雨與風俱三尺之木數絃之聲感動天地何其神也此復一哭崩城一歎下霜之類也師曠能鼓清角必有所受非能質性生出之也其初受學之時宿昔習弄非直一再奏也審如傳書之言師曠學清角時風雨當至也傳書言瓠芭鼓瑟淵魚出聽師曠鼓琴六馬仰秣或言師曠鼓清角一奏之有玄鶴二八自南方來集於廊門之危再奏之而列三奏之延頸而鳴舒翼而舞音中宮商之聲聲吁于天平公大悅坐者皆喜尚書曰擊石拊石百獸率舞此雖奇怪然尚可信何則鳥獸好悲聲耳與人耳同也禽獸見人欲食亦欲食之聞人之樂何為不樂然而魚聽仰秣玄鶴延頸百獸率舞蓋且其實風雨之至晉國大旱赤地三年平公癃病殆虛言也或時奏清角時天偶風雨風雨之後晉國適旱平公好樂喜笑過度偶發癃病傳書之家信以為然世人觀見遂以為實實者樂聲不能致此何以驗之風雨暴至是陰陽亂也樂能亂陰陽則亦能調陰陽也王者何須脩身正行擴施善政使鼓調陰陽之曲和氣自至太平自立矣傳書言湯遭七年旱以身禱於桑林自責以六過天乃雨或言五年禱辭曰余一人有罪無及萬夫萬夫有罪在余一人天無以一人之不敏使上帝鬼神傷民之命於是剪其髮麗其手自以為牲用祈福於上帝上帝甚說時雨乃至言湯以身禱於桑林自責若言剪髮麗手自以為牲用祈福於上帝者實也言雨至為湯自責以身禱之故殆虛言也孔子疾病子路請禱孔子曰有諸子路曰有之誄曰禱爾于上下神祇孔子曰丘之禱久矣聖人脩身正行素禱之日久天地鬼神知其無罪故曰禱久矣易曰大人與天地合其德與日月合其明與四時合其敘與鬼神合其吉凶此言聖人與天地鬼神同德行也即須禱以得福是不同也湯與孔子俱聖人也皆素禱之日久孔子不使子路禱以治病湯何能以禱得雨孔子素禱身猶疾病湯亦素禱歲猶大旱然則天地之有水旱猶人之有疾病也疾病不可以自責除水旱不可以禱謝去明矣湯之致旱以過乎是不與天地同德也今不以過致旱乎自責禱謝亦無益也人形長七尺形中有五常有癉熱之病深自剋責猶不能愈況以廣大之天自有水旱之變湯用七尺之形形中之誠自責禱謝安能得雨邪人在層臺之上人從層臺下叩頭求請臺上之物臺上之人聞其言則憐而與之如不聞其言雖至誠區區終無得也夫天去人非徒層臺之高也湯雖自責天安能聞知而與之雨乎夫旱火變也湛水異也堯遭洪水可謂湛矣堯不自責以身禱祈必舜禹治之知水變必須治也除湛不以禱祈除旱亦宜如之由此言之湯之禱祈不能得雨或時旱久時當自雨湯以旱久亦適自責世人見雨之下隨湯自責而至則謂湯以禱祈得雨矣傳書言倉頡作書天雨粟鬼夜哭此言文章興而亂漸見故其妖變致天雨粟鬼夜哭也夫言天雨粟鬼夜哭實也言其應倉頡作書虛也夫河出圖洛出書聖帝明王之瑞應也圖書文章與倉頡所作書何以異天地為圖書倉頡作文字業與天地同指與鬼神合何非何惡而致雨粟神哭之怪哉使天地鬼神惡人有書則其出圖書非也天不惡人有書作書何非而致此怪或時倉頡適作書天適雨粟鬼偶夜哭而雨粟鬼神哭自有所為世見應書而至則謂作書生亂敗之象應事而動也天雨穀論者謂之從天而下應變而生如以雲雨論之雨穀之變不足怪也何以驗之夫雲雨出於丘山降散則為雨矣人見其從上而墜則謂之天雨水也夏日則雨水冬日天寒則雨凝而為雪皆由雲氣發於丘山不從天上降集於地明矣夫穀之雨猶復雲布之亦從地起因與疾風俱飄參於天集於地人見其從天落也則謂之天雨穀建武三十一年中陳留雨穀穀下蔽地案視穀形若茨而黑有似於稗實也此或時夷狄之地生出此穀夷狄不粒食此穀生於草野之中成熟垂委於地遭疾風暴起吹揚與之俱飛風衰穀集墜於中國中國見之謂之天雨穀何以效之野火燔山澤山澤之中草木皆燒其葉為灰疾風暴起吹揚之參天而飛風衰葉下集於道路夫天雨穀者草木葉燒飛而集之類也而世以為雨穀作傳書者以為變怪天主施氣地主產物有葉實可啄食者皆地所生非天所為也今穀非氣所生須土以成雖云怪變怪變因類生地之物更從天集生天之物可從地出乎地之有萬物猶天之有列星也星不更生於地穀何獨生於天乎傳書又言伯益作井龍登玄雲神棲崑崙言龍井有害故龍神為變也夫言龍登玄雲實也言神棲崑崙又言為作井之故龍登神去虛也夫作井而飲耕田而食同一實也伯益作井致有變動始為耕耘者何故無變神農之橈木為耒教民耕耨民始食穀穀始播種耕土以為田鑿地以為井井出水以救渴田出穀以拯饑天地鬼神所欲為也龍何故登玄雲神何故棲崑崙夫龍之登玄雲古今有之非始益作井而乃登也方今盛夏雷雨時至龍多登雲雲雨與龍相應龍乘雲雨而行物類相致非有為也堯時天下大和百姓無事有五十之民擊壤於塗觀者曰大哉堯之德也擊壤者曰吾日出而作日入而息鑿井而飲耕田而食堯何等力堯時已有井矣唐虞之時豢龍御龍龍常在朝夏末政衰龍乃隱伏非益鑿井龍登雲也所謂神者何神也百神皆是百神何故惡人為井使神與人同則亦宜有飲之欲有飲之欲憎井而去非其實也夫益殆不鑿井龍不為鑿井登雲神不棲於崑崙傳書意妄造生之也傳書言梁山崩壅河三日不流晉君憂之晉伯宗以輦者之言令景公素縞而哭之河水為之流通此虛言也夫山崩壅河猶人之有癰腫血脈不通也治癰腫者可復以素服哭泣之聲治乎堯之時洪水滔天懷山襄陵帝堯吁嗟博求賢者水變甚於河壅堯憂深於景公不聞以素縞哭泣之聲能厭勝之堯無賢人若輦者之術乎將洪水變大不可以聲服除也如素縞而哭悔過自責也堯禹之治水以力役不自責梁山堯時山也所壅之河堯時河也山崩河壅天雨水踊二者之變無以殊也堯禹治洪水以力役輦者治壅河用自責變同而治異人鈞而應殊殆非賢聖變復之實也凡變復之道所以能相感動者以物類也有寒則復之以溫溫復解之以寒故以龍致雨以刑逐暑皆緣五行之氣用相感勝之山崩壅河素縞哭之於道何意乎此或時河壅之時山初崩土積聚水未盛三日之後水盛土散稍壞沮矣壞沮水流竟注東去遭伯宗得輦者之言因素縞而哭哭之因流流時謂之河變起此而復其實非也何以驗之使山恆自崩乎素縞哭無益也使其天變應之宜改政治素縞而哭何政所改而天變復乎傳書言曾子之孝與母同氣曾子出薪於野有客至而欲去曾母曰願留參方到即以右手搤其左臂曾子左臂立痛即馳至問母曰臂何故痛母曰今者客來欲去吾搤臂以呼汝耳蓋以至孝與父母同氣體有疾病精神輒感曰此虛也夫孝悌之至通於神明乃謂德化至天地俗人緣此而說言孝悌之至精氣相動如曾母臂痛曾子臂亦輒痛曾母病曾子亦輒病乎曾母死曾子亦輒死乎攷事曾母先死曾子不死矣此精氣能小相動不能大相感也世稱申喜夜聞其母歌心動開關問歌者為誰果其母蓋聞母聲聲音相感心悲意動開關而問蓋其實也今曾母在家曾子在野不聞號呼之聲母小搤臂安能動子疑世人頌成聞曾子之孝天下少雙則為空生母搤臂之說也世稱南陽卓公為緱氏令蝗不入界蓋以賢明至誠災蟲不入其縣也此又虛也夫賢明至誠之化通於同類能相知心然後慕服蝗蟲閩虻之類也何知何見而能知卓公之化使賢者處深野之中閩虻能不入其舍乎閩虻不能避賢者之舍蝗蟲何能不入卓公之縣如謂蝗蟲變與閩虻異夫寒溫亦災變也使一郡皆寒賢者長一縣一縣之界能獨溫乎夫寒溫不能避賢者之縣蝗蟲何能不入卓公之界夫如是蝗蟲適不入界卓公賢名偶稱於世世則謂之能卻蝗蟲矣何以驗之夫蝗之集於野非能普博盡蔽地也往往積聚多少有處非所積之地則盜跖所居所少之野則伯夷所處也集過有多少不能盡蔽覆也夫集地有多少則其過縣有留去矣多少不可以驗善惡有無安可以明賢不肖也蓋時蝗自過不謂賢人界不入明矣
