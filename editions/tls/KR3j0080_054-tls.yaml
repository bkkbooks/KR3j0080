body:
  text: 自然篇天地合氣萬物自生猶夫婦合氣子自生矣萬物之生含血之類知飢知寒見五穀可食取而食之見絲麻可衣取而衣之或說以為天生五穀以食人生絲麻以衣人此謂天為人作農夫桑女之徒也不合自然故其義疑未可從也試依道家論之天者普施氣萬物之中穀愈飢而絲麻救寒故人食穀衣絲麻也夫天之不故生五穀絲麻以衣食人由其有災變不欲以譴告人也物自生而人衣食之氣自變而人畏懼之以若說論之厭於人心矣如天瑞為故自然焉在無為何居何以知天之自然也以天無口目也案有為者口目之類也口欲食而目欲視有嗜欲於內發之於外口目求之得以為利欲之為也今無口目之欲於物無所求索夫何為乎何以知天無口目也以地知之地以土為體土本無口目天地夫婦也地體無口目亦知天無口目也使天體乎宜與地同使天氣乎氣若雲煙雲煙之屬安得口目或曰凡動行之類皆本無有為有欲故動動則有為今天動行與人相似安得無為曰天之動行也施氣也體動氣乃出物乃生矣由人動氣也體動氣乃出子亦生也夫人之施氣也非欲以生子氣施而子自生矣天動不欲以生物而物自生此則自然也施氣不欲為物而物自為此則無為也謂天自然無為者何氣也恬澹無欲無為無事者也老聃得以壽矣老聃稟之於天使天無此氣老聃安所稟受此性師無其說而弟子獨言者未之有也或復於桓公公曰以告仲父左右曰一則仲父二則仲父為君乃易乎桓公曰吾未得仲父故難已得仲父何為不易夫桓公得仲父任之以事委之以政不復與知皇天以至優之德與王政隨而譴告之則天德不若桓公而霸君之操過上帝也或曰桓公知管仲賢故委任之如非管仲亦將譴告之矣使天遭堯舜必無譴告之變曰天能譴告人君則亦能故命聖君擇才若堯舜授以王命委以王事勿復與知今則不然生庸庸之君失道廢德隨譴告之何天不憚勞也曹參為漢相縱酒歌樂不聽政治其子諫之笞之二百當時天下無擾亂之變淮陽鑄偽錢吏不能禁汲黯為太守不壞一鑪不刑一人高枕安臥而淮陽政清夫曹參為相若不為相汲黯為太守若郡無人然而漢朝無事淮陽刑錯者參德優而黯威重也計天之威德孰與曹參汲黯而謂天與王政隨而譴告之是謂天德不若曹參厚而威不若汲黯重也蘧伯玉治衛子貢使人問之何以治衛對曰以不治治之夫不治之治無為之道也或曰太平之應河出圖洛出書不畫不就不為不成天地出之有為之驗也張良遊泗水之上遇黃石公授太公書蓋天佐漢誅秦故命令神石為鬼書授人復為有為之效也曰此皆自然也夫天安得以筆墨而為圖書乎天道自然故圖書自成晉唐叔虞魯成季友生文在其手故叔曰虞季曰友宋仲子生有文在其手曰為魯夫人三者在母之時文字成矣而謂天為文字在母之時天使神持錐筆墨刻其身乎自然之化固疑難知外若有為內實自然是以太史公紀黃石事疑而不能實也趙簡子夢上天見一男子在帝之側後出見人當道則前所夢見在帝側者也論之以為趙國且昌之妖也黃石授書亦漢且興之象也妖氣為鬼鬼象人形自然之道非或為之也草木之生華葉青葱皆有曲折象類文章謂天為文字復為華葉乎宋人或刻木為楮葉者三年乃成孔子曰使天地三年乃成一葉則萬物之有葉者寡矣如孔子之言萬物之葉自為生也自為生也故能並成如天為之其遲當若宋人刻楮葉矣觀鳥獸之毛羽毛羽之采色遏可為乎鳥獸未能盡實春觀萬物之生秋觀其成天地為之乎物自然也如謂天地為之為之宜用手天地安得萬萬千千手並為萬萬千千物乎諸物在天地之間也猶子在母腹中也母懷子氣十月而生鼻口耳目髮膚毛理血脈脂腴骨節爪齒自然成腹中乎母為之也偶人千萬不名為人者何也鼻口耳目非性自然也武帝幸王夫人王夫人死思見其形道士以方術作夫人形形成出入宮門武帝大驚立而迎之忽不復見蓋非自然之真方士巧妄之偽故一見恍忽消散滅亡有為之化其不可久行猶王夫人形不可久見也道家論自然不知引物事以驗其言行故自然之說未見信也然雖自然亦須有為輔助耒耜耕耘因春播種者人為之也及穀入地日夜長大人不能為也或為之者敗之道也宋人有閔其苗之不長者就而揠之明日枯死夫欲為自然者宋人之徒也問曰人生於天地天地無為人稟天性者亦當無為而有為何也曰至德純渥之人稟天氣多故能則天自然無為稟氣薄少不遵道德不似天地故曰不肖不肖者不似也不似天地不類聖賢故有為也天地為鑪造化為工稟氣不一安能皆賢賢之純者黃老是也黃者黃帝也老者老子也黃老之操身中恬澹其治無為正身共己而陰陽自和無心於為而物自化無意於生而物自成易曰黃帝堯舜垂衣裳而天下治垂衣裳者垂拱無為也孔子曰大哉堯之為君也惟天為大惟堯則之又曰巍巍乎舜禹之有天下也而不與焉周公曰上帝引佚上帝謂舜禹也舜禹承安繼治任賢使能恭己無為天下治舜禹承堯之安堯則天而行不作功邀名無為之化自成故曰蕩蕩乎民無能名焉年五十者擊壤於塗不能知堯之德蓋自然之化也易曰大人與天地合其德黃帝堯舜大人也其德與天地合故知無為也天道無為故春不為生而夏不為長秋不為成冬不為藏陽氣自出物自生長陰氣自起物自成藏汲井決陂灌溉園田物亦生長霈然而雨物之莖葉根荄莫不洽濡程量澍澤孰與汲井決陂哉故無為之為大矣本不求功故其功立本不求名故其名成沛然之雨功名大矣而天地不為也氣和而雨自集儒家說夫婦之道取法於天地知夫婦法天地不知推夫婦之道以論天地之性可謂惑矣夫天覆於上地偃於下下氣烝上上氣降下萬物自生其中間矣當其生也天不須復與也由子在母懷中父不能知也物自生子自成天地父母何與知哉及其生也人道有教訓之義天道無為聽恣其性故放魚於川縱獸於山從其性命之欲也不驅魚令上陵不逐獸令入淵者何哉拂詭其性失其所宜也夫百姓魚獸之類也上德治之若烹小鮮與天地同操也商鞅變秦法欲為殊異之功不聽趙良之議以取車裂之患德薄多欲君臣相憎怨也道家德厚下當其上上安其下純蒙無為何復譴告故曰政之適也君臣相忘於治魚相忘於水獸相忘於林人相忘於世故曰天也孔子謂顏淵曰吾服汝忘也汝之服於我亦忘也以孔子為君顏淵為臣尚不能譴告況以老子為君文子為臣乎老子文子似天地者也淳酒味甘飲之者醉不相知薄酒酸苦賓主嚬蹙夫相譴告道薄之驗也謂天譴告曾謂天德不若淳酒乎禮者忠信之薄亂之首也相譏以禮故相譴告三皇之時坐者于于行者居居乍自以為馬乍自以為牛純德行而民瞳矇曉惠之心未形生也當時亦無災異如有災異不名曰譴告何則時人愚憃不知相繩責也末世衰微上下相非災異時至則造譴告之言矣夫今之天古之天也非古之天厚而今之天薄也譴告之言生於今者人以心准況之也誥誓不及五帝要盟不及三王交質子不及五伯德彌薄者信彌衰心險而行詖則犯約而負教教約不行則相譴告譴告不改舉兵相滅由此言之譴告之言衰亂之語也而謂之上天為之斯蓋所以疑也且凡言譴告者以人道驗之也人道君譴告臣上天譴告君也謂災異為譴告夫人道臣亦有諫君以災異為譴告而王者亦當時有諫上天之義其效何在苟謂天德優人不能諫優德亦宜玄默不當譴告萬石君子有過不言對案不食至優之驗也夫人之優者猶能不言皇天德大而乃謂之譴告乎夫天無為故不言災變時至氣自為之夫天地不能為亦不能知也腹中有寒腹中疾痛人不使也氣自為之夫天地之間猶人背腹之中也謂天為災變凡諸怪異之類無小大薄厚皆天所為乎牛生馬桃生李如論者之言天神入牛腹中為馬把李實提桃間乎牢曰子云吾不試故藝又曰吾少也賤故多能鄙事人之賤不用於大者類多伎能天尊貴高大安能撰為災變以譴告人且吉凶蜚色見於面人不能為色自發也天地猶人身氣變猶蜚色人不能為蜚色天地安能為氣變然則氣變之見殆自然也變自見色自發占候之家因以言也夫寒溫譴告變動招致四疑皆已論矣譴告於天道尤詭故重論之論之所以難別也說合於人事不入於道意從道不隨事雖違儒家之說合黃老之義也
