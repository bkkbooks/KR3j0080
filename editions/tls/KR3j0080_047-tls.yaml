body:
  text: 亂龍篇董仲舒申春秋之雩設土龍以招雨其意以雲龍相致易曰雲從龍風從虎以類求之故設土龍陰陽從類雲雨自至儒者或問曰夫易言雲從龍者謂真龍也豈謂土哉楚葉公好龍墻壁槃盂皆畫龍必以象類為若真是則葉公之國常有雨也易又曰風從虎謂虎嘯而谷風至也風之與虎亦同氣類設為土虎置之谷中風能至乎夫土虎不而致風土龍安能而致雨古者畜龍乘車駕龍故有豢龍氏御龍氏夏后之庭二龍常在季年夏衰二龍低伏真龍在地猶無雲雨況偽象乎禮畫雷樽象雷之形雷樽不聞能致雷土龍安而動雨頓牟掇芥磁石引針皆以其真是不假他類他類肖似不能掇取者何也氣性異殊不能相感動也劉子駿掌雩祭典土龍事桓君山亦難以頓牟磁石不能真是何能掇針取芥子駿窮無以應子駿漢朝智囊筆墨淵海窮無以應者是事非議誤不得道理實也曰夫以非真難是也不以象類說非也夫東風至而酒湛溢按酒味酸從東方木也其味酸故酒湛溢也鯨魚死彗星出天道自然非人事也事與彼雲龍相從同一實也日火也月水也水火感動常以真氣今伎道之家鑄陽燧取飛火於日作方諸取水於月非自然也而天然之也土龍亦非真何為不能感天一也陽燧取火於天五月丙午日中之時消煉五石鑄以為器乃能得火今妄取刀劍偃月之鉤摩以向日亦能感天夫土龍既不得比於陽燧當與刀劍偃月鉤為比二也齊孟嘗君夜出秦關關未開客為鷄鳴而真鷄鳴和之夫雞可以姦聲感則雨亦可以偽象致三也李子長為政欲知囚情以梧桐為人象囚之形鑿地為埳以蘆為郭臥木囚其中囚罪正則木囚不動囚冤侵奪木囚動出不知囚之精神著木人乎將精神之氣動木囚也夫精神感動木囚何為獨不應從土龍四也舜以聖德入大麓之野虎狼不犯蟲蛇不害禹鑄金鼎象百物以入山林亦辟凶殃論者以為非實然而上古久遠周鼎之神不可無也夫金與土同五行也使作土龍者如禹之德則亦將有雲雨之驗五也頓牟掇芥磁石鉤象之石非頓牟也皆能掇芥土龍亦非真當與磁石鉤象為類六也楚葉公好龍墻壁盂樽皆畫龍象真龍聞而下之夫龍與雲雨同氣故能感動以類相從葉公以為畫致真龍今獨何以不能致雲雨七也神靈示人以象不以實故寢臥夢悟見事之象將吉吉象來將凶凶象至神靈之氣雲雨之類八也神靈以象見實土龍何獨不能以偽致真也上古之人有神荼鬱壘者昆弟二人性能執鬼居東海度朔山上立桃樹下簡閱百鬼鬼無道理妄為人禍荼與鬱壘縛以蘆索執以食虎故今縣官斬桃為人立之戶側畫虎之形著之門闌夫桃人非荼鬱壘也畫虎非食鬼之虎也刻畫效象冀以禦凶今土龍亦非致雨之龍獨信桃人畫虎不知土龍九也此尚因緣昔書不見實驗魯般墨子刻木為鳶蜚之三日而不集為之巧也使作土龍者若魯般墨子則亦將有木鳶蜚不集之類夫蜚鳶之氣雲雨之氣也氣而蜚木鳶何獨不能從土龍十也夫雲雨之氣也知於蜚鳶之氣未可以言釣者以木為魚丹漆其身近之水流而擊之起水動作魚以為真並來聚會夫丹木非真魚也魚含血而有知猶為象至雲雨之知不能過魚見土龍之象何能疑之十一也此尚魚也知不如人匈奴敬畏郅都之威刻木象都之狀交弓射之莫能一中不知都之精神在形象邪亡將匈奴敬畏精神在木人也如都之精神在形象天龍之神亦在土龍如匈奴精在木人則雩祭者之精亦在土龍十二也金翁叔休屠王之太子也與父俱來降漢父道死與母俱來拜為騎都尉母死武帝圖其母於甘泉殿上署曰休屠王焉提翁叔從上上甘泉拜謁起立向之泣涕沾襟久乃去夫圖畫非母之實身也因見形象涕泣輒下思親氣感不待實然也夫土龍猶甘泉之圖畫也雲雨見之何為不動十三也此尚夷狄也有若似孔子孔子死弟子思慕共坐有若孔子之座弟子知有若非孔子也猶共坐而尊事之雲雨之知使若諸弟子之知雖知土龍非真然猶感動思類而至十四也有若孔子弟子疑其體象則謂相似孝武皇帝幸李夫人夫人死思見其形道士以術為李夫人夫人步入殿門武帝望見知其非也然猶感動喜樂近之使雲雨之氣如武帝之心雖知土龍非真然猶愛好感起而來十五也既效驗有十五又亦有義四焉立春東耕為土象人男女各二人秉耒把鋤或立土牛象人土牛未必能耕也順氣應時示率下也今設土龍雖知不能致雨亦當夏時以類應變與立土人土牛同義一也禮宗廟之主以木為之長尺二寸以象先祖孝子入廟主心事之雖知木主非親亦當盡敬有所主事土龍與木主同雖知非真示當感動立意於象二也塗車芻靈聖人知其無用示象生存不敢無也夫設土龍知其不能動雨也示若塗車芻靈而有致三也天子射熊諸侯射麋卿大夫射虎豹士射鹿豕示服猛也名布為侯示射無道諸侯也夫畫布為熊麋之象名布為侯禮貴意象示義取名也土龍亦夫熊麋布侯之類四也夫以象類有十五驗以禮示意有四義仲舒覽見深鴻立事不妄設土龍之象果有狀也龍蹔出水雲雨乃至古者畜龍御龍常存無雲雨猶舊交相闊遠卒然相見歡欣歌笑或至悲泣涕偃伏少久則示行各恍忽矣易曰雲從龍非言龍從雲也雷樽刻雷雲之象龍安肯來夫如是傳之者何可解則桓君山之難可說也則劉子駿不能對劣也劣則董仲舒之龍說不終也論衡終之故曰亂龍亂龍者亂有終也
