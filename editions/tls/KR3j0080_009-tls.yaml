body:
  text: 吉驗篇凡人稟貴命於天必有吉驗見於地見於地故有天命也驗見非一或以人物或以禎祥或以光氣傳言黃帝妊二十月而生生而神靈弱而能言長大率諸侯諸侯歸之教熊羆戰以伐炎帝炎帝敗績性與人異故在母之身留多十月命當為帝故能教物物為之使堯體就之如日望之若雲洪水滔天虵龍為害堯使禹治水驅虵龍水治東流虵龍潛處有殊奇之骨故有詭異之驗有神靈之命故有驗物之效天命當貴故從唐侯入嗣帝后之位舜未逢堯鰥在側陋瞽瞍與象謀欲殺之使之完廩火燔其下令之浚井土掩其上舜得下廩不被火災穿井旁出不觸土害堯聞徵用試之於職官治職脩事無廢亂使入大麓之野虎狼不搏蝮虵不噬逢烈風疾雨行不迷惑夫人欲殺之不能害之毒螫之野禽蟲不能傷卒受帝命踐天子祚后稷之時母履大人跡或言衣帝嚳之服坐息帝嚳之處而妊身怪而棄之隘巷牛馬不敢踐之寘之冰上鳥以翼覆之慶集其身母知其神怪乃收養之長大佐堯位至司馬烏孫王號昆莫匈奴攻殺其父而昆莫生棄於野烏𠾑肉往食之單于怪之以為神而收長之及壯使將兵數有功單于乃復以其父之民予昆莫命令長守於西域夫后稷不當棄故牛馬不踐鳥以羽翼覆愛其身昆莫不當死故烏𠾑肉就而食之北夷橐離國王侍婢有娠王欲殺之婢對曰有氣大如雞子從天而下我故有娠後產子捐於豬溷中豬以口氣噓之不死復徙置馬欄中欲使馬藉殺之馬復以口氣噓之不死王疑以為天子令其母收取奴畜之名東明令牧牛馬東明善射王恐奪其國也欲殺之東明走南至掩淲水以弓擊水魚鱉浮為橋東明得渡魚鱉解散追兵不得渡因都王夫餘故北夷有夫餘國焉東明之母初妊時見氣從天下及生棄之豬馬以氣吁之而生之長大王欲殺之以弓擊水魚鱉為橋天命不當死故有豬馬之救命當都王夫餘故有魚鱉為橋之助也伊尹且生之時其母夢人謂己曰臼出水疾東走毋顧明旦視臼出水即東走十里顧其鄉皆為水矣伊尹命不當沒故其母感夢而走推此以論歷陽之都其策命若伊尹之類必有先時感動在他地之效齊襄公之難桓公為公子與子糾爭立管仲輔子糾鮑叔佐桓公管仲與桓公爭引弓射之中其帶鉤夫人身長七尺帶約其要鉤挂於帶在身所掩不過一寸之內既微小難中又滑澤銛靡鋒刃中鉤者莫不蹉跌管仲射之正中其鉤中矢觸因落不跌中旁肉命當富貴有神靈之助故有射鉤不中之驗楚共王有五子子招子圍子干子晳棄疾五人皆有寵共王無適立乃望祭山川請神決之乃與巴姬埋璧於太室之庭令五子齊而入拜康王跨之子圍肘加焉子干子晳皆遠之棄疾弱抱而入再拜皆壓紐故共王死招為康王至子失之圍為靈王及身而弒子干為王十有餘日子晳不立又懼俱誅死皆絕無後棄疾後立竟續楚祀如其神符其王日之長短與拜去璧遠近相應也夫璧在地中五子不知相隨入拜遠近不同壓紐若神將教誋之矣晉屠岸賈作難誅趙盾之子朔死其妻有遺腹子及岸賈聞之索於宮母置兒於袴中祝曰趙氏宗滅乎若當啼即不滅若無聲及索之而終不啼遂脫得活程嬰齎負之匿於山中至景公時韓厥言於景公景公乃與韓厥共立趙孤續趙氏祀是為文子當趙孤之無聲若有掩其口者矣由此言之趙文子立命也高皇帝母曰劉媼嘗息大澤之陂夢與神遇是時雷電晦冥蛟龍在上及生而有美質性好用酒嘗從王媼武負貰酒飲醉止臥媼負見其身常有神怪每留飲醉酒售數倍後行澤中手斬大虵一嫗當道而哭云赤帝子殺吾子此驗既著聞矣秦始皇帝常曰東南有天子氣於是東遊以厭當之高祖之起也與呂后隱於芒碭山澤間呂后與人求之見其上常有氣直起往求輒得其處後與項羽約先入秦關者王之高祖先至項羽怨恨范增曰吾令人望其氣氣皆為龍成五采此皆天子之氣也急擊之高祖往謝項羽羽與亞父謀殺高祖使項莊拔劍起舞項伯知之因與項莊俱起每劍加高祖之上項伯輒以身覆高祖之身劍遂不得下殺勢不得成會有張良樊噲之救卒得免脫遂王天下初妊身有蛟龍之神既生酒舍見雲氣之怪夜行斬虵虵嫗悲哭始皇呂后望見光氣項羽謀殺項伯為蔽謀遂不成遭得良噲蓋富貴之驗氣見而物應人助輔援也竇太后弟名曰廣國年四五歲家貧為人所掠賣其家不知其所在傳賣十餘家至宜陽為其主人入山作炭暮寒臥炭下百餘人炭崩盡壓死廣國獨得脫自卜數日當為侯從其家之長安聞竇皇后新立家在清河觀津乃上書自陳竇太皇后言於景文帝召見問其故果是乃厚賜之文景帝立拜廣國為章武侯夫積炭崩百餘人皆死廣國獨脫命當富貴非徒得活又封為侯虞子大陳留東莞昏人也其生時以夜適免母身母見其上氣若一疋練狀經上天明以問人人皆曰吉貴氣與天通長大仕宦位至司徒公廣文伯河東蒲坂人也其生亦以夜半時適生有人從門呼其父名父出應之不見人見一木杖植其門側好善異於眾其父持杖入門以示人人占曰吉文伯長大學宦位至廣漢太守文伯當富貴故父得賜杖其占者若曰以杖當得子之力矣光武帝建平元年十二月甲子生於濟陽宮後殿第二內中皇考為濟陽令時夜無火室內自明皇考怪之即召功曹史充蘭使出問卜工蘭與馬下卒蘇永俱之卜王長孫所長孫卜謂永蘭曰此吉事也毋多言是歲有禾生屋景天備火中三本一莖九穗長於禾一二尺蓋嘉禾也哀帝之初有鳳凰下濟陽宮故訖今濟陽宮有鳳凰廬始與李父等俱起到柴界中遇賊兵惶惑走濟陽舊廬比到見光若火正赤在舊廬道南光耀憧憧上屬天有頃不見王莽時謁者蘇伯阿能望氣使過春陵城郭鬱鬱葱葱及光武到河北與伯阿見問曰卿前過春陵何用知其氣佳也伯阿對曰見其鬱鬱葱葱耳蓋天命當興聖王當出前後氣驗照察明著繼體守文因據前基稟天光氣驗不足言創業龍興由微賤起於顛沛若高祖光武者曷嘗無天人神怪光顯之驗乎
