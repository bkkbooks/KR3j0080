body:
  text: 辨祟篇世俗信禍祟以為人之疾病死亡及更患被罪戮辱懽笑皆有所犯起功移徙祭祀喪葬行作入官嫁娶不擇吉日不避歲月觸鬼逢神忌時相害故發病生禍絓法入罪至于死亡殫家滅門皆不重慎犯觸忌諱之所致也如實論之乃妄言也凡人在世不能不作事作事之後不能不有吉凶見吉則指以為前時擇日之福見凶則刺以為往者觸忌之禍多或擇日而得禍觸忌而獲福工伎射事者欲遂其術見禍忌而不言聞福匿而不達積禍以驚不慎列福以勉畏時故世人無愚智賢不肖人君布衣皆畏懼信向不敢抵犯歸之久遠莫能分明以為天地之書賢聖之術也人君惜其官人民愛其身相隨信之不復狐疑故人君興事工伎滿閤人民有為觸傷問時奸書偽文由此滋生巧惠生意作知求利驚惑愚暗漁富偷貧愈非古法度聖人之至意也聖人舉事先定於義義已定立決以卜筮示不專己明與鬼神同意共指欲令眾下信用不疑故書列七卜易載八卦從之未必有福違之未必有禍然而禍福之至時也死生之到命也人命懸於天吉凶存於時命窮操行善天不能續命長操行惡天不能奪天百神主也道德仁義天之道也戰栗恐懼天之心也廢道滅德賤天之道嶮隘恣睢悖天之意世間不行道德莫過桀紂妄行不軌莫過幽厲桀紂不早死幽厲不夭折由此言之逢福獲喜不在擇日避時涉患麗禍不在觸歲犯月明矣孔子曰死生有命富貴在天苟有時日誠有禍祟聖人何惜不言何畏不說案古圖籍仕者安危千君萬臣其得失吉凶官位高下位祿降升各有差品家人治產貧富息耗壽命長短各有遠近非高大尊貴舉事以吉日下小卑賤以凶時也以此論之則亦知禍福死生不在遭逢吉祥觸犯凶忌也然則人之生也精氣育也人之死者命窮絕也人之生未必得吉逢喜其死獨何為謂之犯凶觸忌以孔子證之以死生論之則亦知夫百禍千凶非動作之所致也孔子聖人知府也死生大事也大事道效也孔子云死生有命富貴在天眾文微言不能奪俗人愚夫不能易明矣人之於世禍福有命人之操行亦自致之其安居無為禍福自至命也其作事起功吉凶至身人也人之疾病希有不由風濕與飲食者當風臥濕握錢問祟飽飯饜食齋精解禍而病不治謂祟不得命自絕謂筮不審俗人之知也夫倮蟲三百六十人為之長人物也萬物之中有知慧者也其受命於天稟氣於元與物無異鳥有巢棲獸有窟穴蟲魚介鱗各有區處猶人之有室宅樓臺也能行之物死傷病困小大相害或人捕取以給口腹非作窠穿穴有所觸東西行徙有所犯也人有死生物亦有終始人有起居物亦有動作血脈首足耳目鼻口與人不別惟好惡與人不同故人不能曉其音不見其指耳及其游於黨類接於同品其知去就與人無異共天同地並仰日月而鬼神之禍獨加於人不加於物未曉其故也天地之性人為貴豈天禍為貴者作不為賤者設哉何其性類同而禍患別也刑不上大夫聖王於貴者闊也聖王刑賤不罰貴鬼神禍貴不殃賤非易所謂大人與鬼神合其吉凶也或有所犯抵觸縣官羅麗刑法不曰過所致而曰家有負居處不慎飲食過節不曰失調和而曰徙觸時死者累屬葬棺至十不曰氣相汙而曰葬日凶有事歸之有犯無為歸之所居居衰宅耗蜚凶流尸集人室居又禱先祖寢禍遣殃疾病不請醫更患不修行動歸於禍名曰犯觸用知淺略原事不實俗人之材也猶繫罪司空作徒未必到吏日惡繫役時凶也使殺人者求吉日出詣吏剬罪推善時入獄繫寧能令事解赦令至哉人不觸禍不被罪不被罪不入獄一旦令至解械徑出未必有解除其凶者也天下千獄獄中萬囚其舉事未必觸忌諱也居位食祿專城長邑以千萬數其遷徙日未必逢吉時也歷陽之都一夕沉而為湖其民未必皆犯歲月也高祖始起豐沛俱復其民未必皆慎時日也項羽攻襄安襄安無噍類未必不禱賽也趙軍為秦所坑於長平之下四十萬眾同時俱死其出家時未必不擇時也辰日不哭哭有重喪戊己死者復尸有隨一家滅門先死之日未必辰與戊己也血忌不殺牲屠肆不多禍上朔不會眾沽舍不觸殃塗上之暴尸未必出以往亡室中之殯柩未必還以歸忌由此言之諸占射禍祟者皆不可信用信用之者皆不可是夫使食口十人居一宅之中不動钁鍤不更居處祠祀嫁娶皆擇吉日從春至冬不犯忌諱則夫十人比至百年能不死乎占射事者必將復曰宅有盛衰若歲破直符不知避也夫如是令數問工伎之家宅盛即留衰則避之及歲破直符輒舉家移比至百年能不死乎占射事者必將復曰移徙觸時往來不吉夫如是復令輒問工伎之家可徙則往可還則來比至百年能不死乎占射事者必將復曰泊命壽極夫如是人之死生竟自有命非觸歲月之所致無負凶忌之所為也
