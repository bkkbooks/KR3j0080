body:
  text: 適蟲篇變復之家謂蟲食穀者部吏所致也貪則侵漁故蟲食穀身黑頭赤則謂武官頭黑身赤則謂文官使加罰於蟲所象類之吏則蟲滅息不復見矣夫頭赤則謂武吏頭黑則謂文吏所致也時或頭赤身白頭黑身黃或頭身皆黃或頭身皆青或皆白若魚肉之蟲應何官吏時或白布豪民猾吏被刑乞貸者威勝於官取多於吏其蟲形象何如狀哉蟲之滅也皆因風雨案蟲滅之時則吏未必伏罰也陸田之中時有鼠水田之中時有魚蝦蟹之類皆為穀害或時希出而暫為害或常有而為災等類眾多應何官吏魯宣公履畝而稅應時而有蝝生者或言若蝗蝗時至蔽天如雨集地食物不擇穀草察其頭身象類何吏變復之家謂蝗何應建武三十一年蝗起太山郡西南過陳留河南遂入夷狄所集鄉縣以千百數當時鄉縣之吏未皆履畝蝗食穀草連日老極或蜚徙去或止枯死當時鄉縣之吏未必皆伏罪也夫蟲食穀自有止期猶蠶食桑自有足時也生出有日死極有月期盡變化不常為蟲使人君不罪其吏蟲猶自亡夫蟲風氣所生蒼頡知之故凡蟲為風之字取氣於風故八日而化生春夏之物或食五穀或食眾草食五穀吏受錢穀也其食他草受人何物倮蟲三百人為之長由此言之人亦蟲也人食蟲所食蟲亦食人所食俱為蟲而相食物何為怪之設蟲有知亦將非人曰女食天之所生吾亦食之謂我為變不自謂為災凡含氣之類所甘嗜者口腹不異人甘五穀惡蟲食之自生天地之間惡蟲之出設蟲能言以此非人亦無以詰也夫蟲之在物間也知者不怪其食萬物也不謂之災甘香渥味之物蟲生常多故穀之多蟲者粢也稻時有蟲麥與豆無蟲必以有蟲責主者吏是其粢鄉部吏常伏罪也神農后稷藏種之方煮馬屎以汁漬種者令禾不蟲如或以馬屎漬種其鄉部吏鮑焦陳仲子也是故后稷神農之術用則其鄉吏可免為姦何則蟲無從生上無以察也蟲食他草平事不怪食五穀葉乃謂之災桂有蠹桑有蝎桂中藥而桑給蠶其用亦急與穀無異蠹蝎不為怪獨謂蟲為災不通物類之實闇於災變之情也穀蟲曰蟲蠱若蛾矣粟米饐熱生蠱夫蠱食粟米不謂之災蟲食苗葉歸之於政如說蟲之家謂粟輕苗重也蟲之種類眾多非一魚肉腐臭有蟲醯醬不閉有蟲飯溫濕有蟲書卷不舒有蟲衣襞不懸有蟲瘑疽瘡瘻癥瘕有蟲或白或黑或長或短大小鴻殺不相似類皆風氣所生并連以死生不擇日若生日短促見而輒滅變復之家見其希出出又食物則謂之災災出當有所罪則依所似類之吏順而說之人腹中有三蟲下地之澤其蟲曰蛭蛭食人足三蟲食腸順說之家將謂三蟲何似類乎凡天地之間陰陽所生蚑蟯之類蜫蠕之屬含氣而生開口而食食有甘不同心等欲彊大食細弱知慧反頓愚他物小大連相齧噬不謂之災獨謂蟲食穀物為應政事失道理之實不達物氣之性也然夫蟲之生也必依溫濕溫濕之氣常在春夏秋冬之氣寒而乾燥蟲未曾生若以蟲生罪鄉部吏是則鄉部吏貪於春夏廉於秋冬雖盜跖之吏以秋冬署蒙伯夷之舉矣夫春夏非一而蟲時生者溫濕甚也甚則陰陽不和陰陽不和政也徒當歸於政治而指謂部吏為姦失事實矣何知蟲以溫濕生也以蠱蟲知之穀乾燥者蟲不生溫濕饐餲蟲生不禁藏宿麥之種烈日乾暴投於燥器則蟲不生如不乾暴閘喋之蟲生如雲煙以蠱閘喋准況眾蟲溫濕所生明矣詩云營營青蠅止于藩愷悌君子無信讒言讒言傷善青蠅污白同一禍敗詩以為興昌邑王夢西階下有積蠅矢明旦召問郎中龔遂遂對曰蠅者讒人之象也夫矢積於階下王將用讒臣之言也由此言之蠅之為蟲應人君用讒何故不謂蠅為災乎如蠅可以為災夫蠅歲生世間人君常用讒乎案蟲害人者莫如蚊䖟蚊䖟歲生如以蚊䖟應災世間常有害人之吏乎必以食物乃為災人則物之最貴者也蚊䖟食人尤當為災必以暴生害物乃為災夫歲生而食人與時出而害物災孰為甚人之病疥亦希非常疥蟲何故不為災且天將雨螘出蚋蜚為與氣相應也或時諸蟲之生自與時氣相應如何輒歸罪於部吏乎天道自然吉凶偶會非常之蟲適生貪吏遭署人察貪吏之操又見災蟲之生則謂部吏之所為致也
