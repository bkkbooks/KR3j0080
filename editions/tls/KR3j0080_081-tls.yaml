body:
  text: 正說篇儒者說五經多失其實前儒不見本末空生虛說後儒信前師之言隨舊述故滑習辭語苟名一師之學趨為師教授及時蚤仕汲汲競進不暇留精用心考實根核故虛說傳而不絕實事沒而不見五經並失其實尚書春秋事較易略正題目麤粗之說以照篇中微妙之文說尚書者或以為本百兩篇後遭秦燔詩書遺在者二十九篇夫言秦燔詩書是也言本百兩篇者妄也蓋尚書本百篇孔子以授也遭秦用李斯之議燔燒五經濟南伏生抱百篇藏於山中孝景皇帝時始存尚書伏生已出山中景帝遣鼂錯往從受尚書二十餘篇伏生老死書殘不竟鼂錯傳於倪寬至孝宣皇帝之時河內女子發老屋得逸易禮尚書各一篇奏之宣帝下示博士然后易禮尚書各益一篇而尚書二十九篇始定矣至孝景帝時魯共王壞孔子教授堂以為殿得百篇尚書於墻壁中武帝使使者取視莫能讀者遂祕於中外不得見至孝成皇帝時徵為古文尚書學東海張霸案百篇之序空造百兩之篇獻之成帝帝出祕百篇以校之皆不相應於是下霸於吏吏白霸罪當至死成帝高其才而不誅亦惜其文而不滅故百兩之篇傳在世間者傳見之人則謂尚書本有百兩篇矣或言秦燔詩書者燔詩經之書也其經不燔焉夫詩經獨燔其詩書五經之總名也傳曰男子不讀經則有博戲之心子路使子羔為費宰孔子曰賊夫人之子子路曰有民人焉有社稷焉何必讀書然後為學五經總名為書傳者不知秦燔書所起故不審燔書之實秦始皇三十四年置酒咸陽宮博士七十人前為壽僕射周青臣進頌秦始皇齊人淳于越進諫以為始皇不封子弟卒有田常六卿之難無以救也譏青臣之頌謂之為諛秦始皇下其議丞相府丞相斯以為越言不可用因此謂諸生之言惑亂黔首乃令史官盡燒五經有敢藏詩書百家語者刑唯博士官乃得有之五經皆燔非獨詩家之書也傳者信之見言詩書則獨謂詩經謂之書矣傳者或知尚書為秦所燔而謂二十九篇其遺脫不燒者也審若此言尚書二十九篇火之餘也七十一篇為炭灰二十九篇獨遺邪夫伏生年老鼂錯從之學時適得二十餘篇伏生死矣故二十九篇獨見七十一篇遺脫遺脫者七十一篇反謂二十九篇遺脫矣或說尚書二十九篇者法斗四七宿也四七二十八篇其一曰斗矣故二十九夫尚書滅絕於秦其見在者二十九篇安得法乎宣帝之時得佚尚書及易禮各一篇禮易篇數亦始足焉得有法案百篇之序闕遺者七十一篇獨為二十九篇立法如何或說曰孔子更選二十九篇二十九篇獨有法也蓋俗儒之說也未必傳記之明也二十九篇殘而不足有傳之者因不足之數立取法之說失聖人之意違古今之實夫經之有篇也猶有章句有章句也猶有文字也文字有意以立句句有數以連章章有體以成篇篇則章句之大者也謂篇有所法是謂章句復有所法也詩經舊時亦數千篇孔子刪去復重正而存三百篇猶二十九篇也謂二十九篇有法是謂三百五篇復有法也或說春秋十二公法十二月也春秋十二公猶尚書之百篇百篇無所法十二公安得法說春秋者曰二百四十二年人道浹王道備善善惡惡撥亂世反諸正莫近於春秋若此者人道王道適具足也三軍六師萬二千人足以陵敵伐寇橫行天下令行禁止未必有所法也孔子作春秋紀魯十二公猶三軍之有六師也士眾萬二千猶年有二百四十二也六師萬二千人足以成軍十二公二百四十二年足以立義說事者好神道恢義不肖以遭禍是故經傳篇數皆有所法考實根本論其文義與彼賢者作書詩無以異也故聖人作經賢者作書義窮理竟文辭備足則為篇矣其立篇也種類相從科條相附殊種異類論說不同更別為篇意異則文殊事改則篇更據事意作安得法象之義乎或說春秋二百四十二年者上壽九十中壽八十下壽七十孔子據中壽三世而作三八二十四故二百四十年也又說為赤制之中數也又說二百四十二年人道浹王道備夫據三世則浹備之說非言浹備之說為是則據三世之論誤二者相伐而立其義聖人之意何定哉凡紀事言年月日者詳悉重之也洪範五紀歲月日星紀事之文非法象之言也紀十二公享國之年凡有二百四十二凡此以立三世之說矣實孔子紀十二公者以為十二公事適足以見王義邪據三世三世之數適得十二公而足也如據十二公則二百四十二年不為三世見也如據三世取三八之數二百四十年而已何必取二說者又曰欲合隱公之元也不取二年隱公元年不載於經夫春秋自據三世之數而作何用隱公元年之事為始須隱公元年之事為始是竟以備足為義據三世之說不復用矣設隱公享國五十年將盡紀元年以來邪中斷以備三八之數也如盡紀元年以來三八之數則中斷如中斷以備三世之數則隱公之元不合何如且年與月日小大異耳其所紀載同一實也二百四十二年謂之據三世二百四十二年中之日月必有數矣年據三世月日多少何據哉夫春秋之有年也猶尚書之有章章以首義年以紀事謂春秋之年有據是謂尚書之章亦有據也說易者皆謂伏羲作八卦文王演為六十四夫聖王起河出圖洛出書伏羲王河圖從河水中出易卦是也禹之時得洛書書從洛水中出洪範九章是也故伏羲以卦治天下禹案洪範以治洪水古者烈山氏之王得河圖夏后因之曰連山歸藏氏之王得河圖殷人因之曰歸藏伏羲氏之王得河圖周人因之曰周易其經卦皆八其別皆六十四文王周公因彖十八章究六爻世之傳說易者言伏羲作八卦不實其本則謂伏羲真作八卦也伏羲得八卦非作之文王得成六十四非演之也演作之言生於俗傳苟信一文使夫真是幾滅不存既不知易之為河圖又不知存於俗何家易也或時連山歸藏或時周易案禮夏殷周三家相損益之制較著不同如以周家在後論今為周易則禮亦宜為周禮六典不與今禮相應今禮未必為周則亦疑今易未必為周也案左丘明之傳引周家以卦與今易相應殆周易也說禮者皆知禮也為禮何家禮也孔子曰殷因於夏禮所損益可知也周因於殷禮所損益可知也由此言之夏殷周各自有禮方今周禮邪夏殷也謂之周禮周禮六典案今禮經不見六典或時殷禮未絕而六典之禮不傳世因謂此為周禮也案周官之法不與今禮相應然則周禮六典是也其不傳猶古文尚書春秋左氏不興矣說論者皆知說文解語而已不知論語本幾何篇但知周以八寸為尺不知論語所獨一尺之意夫論語者弟子共紀孔子之言行勑記之時甚多數十百篇以八寸為尺紀之約省懷持之便也以其遺非經傳文紀識恐忘故但以八寸尺不二尺四寸也漢興失亡至武帝發取孔子壁中古文得二十一篇齊魯二河間九篇三十篇至昭帝女讀二十一篇宣帝下太常博士時尚稱書難曉名之曰傳後更隸寫以傳誦初孔子孫孔安國以教魯人扶卿官至荊州刺史始曰論語今時稱論語二十篇又失齊魯河間九篇本三十篇分布亡失或二十一篇篇目或多或少文讚或是或誤說論語者但知以剝解之問以纖微之難不知存問本根篇數章目溫故知新可以為師今不知古稱師如何孟子曰王者之迹熄而詩亡詩亡然後春秋作晉之乘楚之檮杌魯之春秋一也若孟子之言春秋者魯史記之名乘檮杌同孔子因舊故之名以號春秋之經未必有奇說異意深美之據也今俗儒說之春者歲之始秋者其終也春秋之經可以奉始養終故號為春秋春秋之經何以異尚書說尚書者以為上古帝王之書或以為上所為下所書授事相實而為名不依違作意以見奇說尚書者得經之實說春秋者失聖之意矣春秋左氏傳桓公十有七年冬十月朔日有食之不書日官失之也謂官失之言蓋其實也史官記事若今時縣官之書矣其年月尚大難失日者微小易忘也蓋紀以善惡為實不以日月為意若夫公羊穀梁之傳日月不具輒為意使夫平常之事有怪異之說徑直之文有曲折之義非孔子之心夫春秋實及言冬夏不言者亦與不書日月同一實也唐虞夏殷周者土地之名堯以唐侯嗣位舜從虞地得達禹由夏而起湯因殷而興武王階周而伐皆本所興昌之地重本不忘始故以為號若人之有姓矣說尚書謂之有天下之代號唐虞夏殷周者功德之名盛隆之意也故唐之為言蕩蕩也虞者樂也夏者大也殷者中也周者至也堯則蕩蕩民無能名舜則天下虞樂禹承二帝之業使道尚蕩蕩民無能名殷則道得中周武則功德無不至其立義美也其褒五家大矣然而違其正實失其初意唐虞夏殷周猶秦之為秦漢之為漢秦起於秦漢興於漢中故曰猶秦漢猶王莽從新都侯起故曰亡新使秦漢在經傳之上說者將復為秦漢作道德之說矣堯老求禪四嶽舉舜堯曰我其試哉說尚書曰試者用也我其用之為天子也文為天子也文又曰女于時觀厥刑于二女觀者觀示虞舜於天下不謂堯自觀之也若此者高大堯舜以為聖人相見已審不須觀試精耀相炤曠然相信又曰四門穆穆入于大麓烈風雷雨不迷言大麓三公之位也居一公之位大總錄二公之事眾多並吉若疾風大雨夫聖人才高未必相知也聖成事舜難知佞使皋陶陳知人之法佞難知聖亦難別堯之才猶舜之知也舜知佞堯知聖堯聞舜賢四嶽舉之心知其奇而未必知其能故言我其試哉試之於職妻以二女觀其夫婦之法職治脩而不廢夫道正而不僻復令入大鹿之野而觀其聖逢烈風疾雨終不迷惑堯乃知其聖授以天下夫文言觀試觀試其才也說家以為譬喻增飾使事失正是滅而不存曲折失意使偽說傳而不絕造說之傳失之久矣後生精者苟欲明經不原實而原之者亦校古隨舊重是之文以為說證經之傳不可從五經皆多失實之說尚書春秋行事成文較著可見故頗獨論
