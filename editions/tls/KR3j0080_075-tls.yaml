body:
  text: 解除篇世信祭祀謂祭祀必有福又然解除謂解除必去凶解除初禮先設祭祀比夫祭祀若生人相賓客矣先為賓客設膳食已驅以刃杖鬼神如有知必恚止戰不肯徑去若懷恨反而為禍如無所知不能為凶解之無益不解無損且人謂鬼神何如狀哉如謂鬼有形象形象生人生人懷恨必將害人如無形象與煙雲同驅逐雲煙亦不能除形既不可知心亦不可圖鬼神集止人宅欲何求乎如勢欲殺人當驅逐之時避人隱匿驅逐之止則復還立故處如不欲殺人寄託人家雖不驅逐亦不為害貴人之出也萬民並觀填街滿巷爭進在前士卒驅之則走而卻士卒還去即復其處士卒立守終日不離僅能禁止何則欲在於觀不為壹驅還也使鬼神與生人同有欲於宅中猶萬民有欲於觀也士卒驅逐不久立守則觀者不卻也然則驅逐鬼者不極一歲鬼神不去今驅逐之終食之間則舍之矣舍之鬼復還來何以禁之暴穀於庭雞雀啄之主人驅彈則走縱之則來不終日立守雞雀不禁使鬼神乎不為驅逐去止使鬼不神乎與雞雀等不常驅逐不能禁也虎狼入都弓弩巡之雖殺虎狼不能除虎狼所為來之患盜賊攻城官軍擊之雖卻盜賊不能滅盜賊所為之禍虎狼之來應政失也盜賊之至起世亂也然則鬼神之集為命絕也殺虎狼卻盜賊不能使政得世治然則盛解除驅鬼神不能使凶去而命延病人困篤見鬼之至性猛剛者挺劍操杖與鬼戰鬭戰鬭壹再錯指受服知不服必不終也夫解除所驅逐鬼與病人所見鬼無以殊也其驅逐之與戰鬭無以異也病人戰鬭鬼猶不去宅主解除鬼神必不離由此言之解除宅者何益於事信其凶去不可用也且夫所除宅中客鬼也宅中主神有十二焉青龍白虎列十二位龍虎猛神天之正鬼也飛尸流凶安敢妄集猶主人猛勇姦客不敢闚也有十二神舍之宅主驅逐名為去十二神之客恨十二神之意安能得吉如無十二神則亦無飛尸流凶無神無凶解除何補驅逐何去解逐之法緣古逐疫之禮也昔顓頊氏有子三人生而皆亡一居江水為虐鬼一居若水為魍魎一居歐隅之間主疫病人故歲終事畢驅逐疫鬼因以送陳迎新內吉也世相倣效故有解除夫逐疫之法亦禮之失也行堯舜之德天下太平百災消滅雖不逐疫疫鬼不往行桀紂之行海內擾亂百禍並起雖日逐疫疫鬼猶來衰世好信鬼愚人好求福周之季世信鬼脩祀以求福助愚主心惑不顧自行功猶不立治猶不定故在人不在鬼在德不在祀國期有遠近人命有長短如祭祀可以得福解除可以去凶則王者可竭天下之財以興延期之祀富家翁嫗可求解除之福以取踰世之壽案天下人民夭壽貴賤皆有祿命操行吉凶皆有衰盛祭祀不為福福不由祭祀世信鬼神故好祭祀祭祀無鬼神故通人不務焉祭祀厚事鬼神之道也猶無吉福之驗況盛力用威驅逐鬼神其何利哉祭祀之禮解除之法眾多非一且以一事效其非也夫小祀足以況大祭一鬼足以卜百神世間繕治宅舍鑿地掘土功成作畢解謝土神名曰解土為土偶人以像鬼神令巫祝延以解土神已祭之後心快意喜謂鬼神解謝殃禍除去如討論之乃虛妄也何以驗之夫土地猶人之體也普天之下皆為一體頭足相去以萬里數人民居土上猶蚤虱著人身也蚤蝨食人賊人肌膚猶人鑿地賊地之體也蚤蝨內知有欲解人之心相與聚會解謝於所食之肉旁人能知之乎夫人不能知蚤蝨之音猶地不能曉人民之言也胡越之人耳口相類心意相似對口交耳而談尚不相解況人不與地相似地之耳口與人相遠乎今所解者地乎則地之耳遠不能聞也所解一宅之土則一宅之土猶人一分之肉也安能曉之如所解宅神乎則此名曰解宅不名曰解土禮入宗廟無所主意斬尺二寸之木名之曰主主心事之不為人像今解土之祭為土偶人像鬼之形何能解乎神荒忽無形出入無門故謂之神今作形像與禮相違失神之實故知其非象似布藉不設鬼形解土之禮立土偶人如祭山可為石形祭門戶可作木人乎晉中行寅將亡召其太祝欲加罪焉曰子為我祝犧牲不肥澤也且齊戒不敬也使吾國亡何也祝簡對曰昔者吾先君中行密子有車十乘不憂其薄也憂德義之不足也今主君有革車百乘不憂德義之薄也唯患車之不足也夫舩車飭則賦歛厚賦歛厚則民謗詛君苟以祝為有益於國乎則詛亦將為亡矣一人祝之一國詛之一祝不勝萬詛國亡不亦宜乎祝其何罪中行子乃慚今世信祭祀中行子之類也不脩其行而豐其祝不敬其上而畏其鬼身死禍至歸之於祟謂祟未得得祟脩祀禍繁不止歸之於祭謂祭未敬夫論解除解除無益論祭祀祭祀無補論巫祝巫祝無力竟在人不在鬼在德不在祀明矣哉
