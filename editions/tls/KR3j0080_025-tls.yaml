body:
  text: 語增篇傳語曰聖人憂世深思勤事愁擾精神感動形體故稱堯若腊舜若腒桀紂之君垂腴尺餘夫言聖人憂世念人身體羸惡不能身體肥澤可也言堯舜若腊與腒桀紂垂腴尺餘增之也齊桓公云寡人未得仲父極難既得仲父甚易桓公不及堯舜仲父不及禹契桓公猶易堯舜反難乎以桓公得管仲易知堯舜得禹契不難夫易則少憂少憂則不愁不愁則身體不臞舜承堯太平堯舜襲德功假荒服堯尚有憂舜安能無事故經曰上帝引逸謂虞舜也舜承安繼治任賢使能恭己無為而天下治故孔子曰巍巍乎舜禹之有天下而不與焉夫不與尚謂之臞若腒如德劣承衰若孔子栖栖周流應聘身不得容道不得行可骨立跛附僵仆道路乎紂為長夜之飲糟丘酒池沉湎於酒不舍晝夜是必以病病則不甘飲食不甘飲食則肥腴不得至尺經曰惟湛樂是從時亦罔有克壽魏公子無忌為長夜之飲困毒而死紂雖未死宜羸臞矣然桀紂同行則宜同病言其腴垂過尺餘非徒增之又失其實矣傳語又稱紂力能索鐵伸鉤撫梁易柱言其多力也蜚廉惡來之徒並幸受寵言好伎力之主致伎力之士也或言武王伐紂兵不血刃夫以索鐵伸鉤之力輔以蜚廉惡來之徒與周軍相當武王德雖盛不能奪紂素所厚之心紂雖惡亦不失所與同行之意雖為武王所擒時亦宜殺傷十百人今言不血刃非紂多力之效蜚廉惡來助紂之驗也案武王之符瑞不過高祖武王有白魚赤烏之祐高祖有斷大虵老嫗哭於道之瑞武王有八百諸侯之助高祖有天下義兵之佐武王之相望羊而已高祖之相龍顏隆準項紫美鬚髯身有七十二黑子高祖又逃呂后於澤中呂后輒見上有雲氣之驗武王不聞有此夫相多於望羊瑞明於魚烏天下義兵並來會漢助彊於諸侯武王承紂高祖襲秦二世之惡隆盛於紂天下畔秦宜多於殷案高祖伐秦還破項羽戰場流血暴尸萬數失軍亡眾幾死一再然後得天下用兵苦誅亂劇獨云周兵不血刃非其實也言其易可也言不血刃增之也案周取殷之時太公陰謀之書食小兒丹教云殷亡兵到牧野晨舉脂燭察武成之篇牧野之戰血流浮杵赤地千里由此言之周之取殷與漢秦一實也而云取殷易兵不血刃美武王之德增益其實也凡天下之事不可增損考察前後效驗自列自列則是非之實有所定矣世稱紂力能索鐵伸鉤又稱武王伐之兵不血刃夫以索鐵伸鉤之力當人則是孟賁夏育之匹也以不血刃之德取人則是三皇五帝之屬也以索鐵之力不宜受服以不血刃之德不宜頓兵今稱紂力則武王德貶譽武王則紂力少索鐵不血刃不得兩立殷周之稱不得二全不得二全則必一非孔子曰紂之不善不若是之甚也是以君子惡居下流天下之惡皆歸焉孟子曰吾於武成取二三策耳以至仁伐不仁如何其血之浮杵也若孔子言殆沮浮杵若孟子之言近不血刃浮杵過其實不血刃亦失其正一聖一賢共論一紂輕重殊稱多少異實紂之惡不若王莽紂殺比干莽鴆平帝紂以嗣立莽盜漢位殺主隆於誅臣嗣立順於盜位士眾所畔宜甚於紂漢誅王莽兵頓昆陽死者萬數軍至漸臺血流沒趾而獨謂周取天下兵不血刃非其實也傳語曰文王飲酒千鍾孔子百觚欲言聖人德盛能以德將酒也如一坐千鍾百觚此酒徒非聖人也飲酒有法胸腹小大與人均等飲酒用千鍾用肴宜盡百牛百觚則宜用十羊夫以千鍾百牛百觚十羊言之使文王之身如防風之君孔子之體如長狄之人乃能堪之案文王孔子之體不能及防風長狄以短小之身飲食眾多是缺文王之廣貶孔子之崇也案酒誥之篇朝夕曰祀茲酒此言文王戒慎酒也朝夕戒慎則民化之外出戒慎之教內飲酒盡千鍾導民率下何以致化承紂疾惡何以自別且千鍾之效百觚之驗何所用哉使文王孔子因祭用酒乎則受福胙不能厭飽因饗射之用酒乎饗射飲酒自有禮法如私燕賞賜飲酒乎則賞賜飲酒宜與下齊賜尊者之前三觴而退過於三觴醉酗生亂文王孔子率禮之人也賞賚左右至於醉酗亂身自用酒千鍾百觚大之則為桀紂小之則為酒徒用何以立德成化表名垂譽乎世聞德將毋醉之言見聖人有多德之效則虛增文王以為千鍾空益孔子以百觚矣傳語曰紂沉湎於酒以糟為丘以酒為池牛飲者三千人為長夜之飲亡其甲子夫紂雖嗜酒亦欲以為樂令酒池在中庭乎則不當言為長夜之飲坐在深室之中閉窗舉燭故曰長夜令坐於室乎每當飲者起之中庭乃復還坐則是煩苦相踖藉不能甚樂令池在深室之中則三千人宜臨池坐前俛飲池酒後仰食肴膳倡樂在前乃為樂耳如審臨池而坐則前飲害於肴膳倡樂之作不得在前夫飲食既不以禮臨池牛飲則其啖肴不復用杯亦宜就魚肉而虎食則知夫酒池牛飲非其實也傳又言紂懸肉以為林令男女倮而相逐其間是為醉樂淫戲無節度也夫肉當內於口口之所食宜潔不辱今言男女倮相逐其間何等潔者如以醉而不計潔辱則當共浴於酒中而倮相逐於肉間何為不肯浴於酒中以不言浴於酒知不倮相逐於肉間傳者之說或言車行酒騎行炙百二十日為一夜夫言用酒為池則言其車行酒非也言其懸肉為林即言騎行炙非也或時紂沉湎覆酒滂沱於地即言以酒為池釀酒糟積聚則言糟為丘懸肉以林則言肉為林林中幽冥人時走戲其中則言倮相逐或時載酒用鹿車則言車行酒騎行炙或時十數夜則言其百二十或時醉不知問日數則言其亡甲子周公封康叔告以紂用酒期於悉極欲以戒之也而不言糟丘酒池懸肉為林長夜之飲亡其甲子聖人不言殆非實也傳言曰紂非時與三千人牛飲於酒池夫夏官百殷二百周三百紂之所與相樂非民必臣也非小臣必大官其數不能滿三千人傳書家欲惡紂故言三千人增其實也傳語曰周公執贄下白屋之士謂候之也夫三公鼎足之臣王者之貞幹也白屋之士閭巷之微賤者也三公傾鼎足之尊執贄候白屋之士非其實也或時待士卑恭不驕白屋人則言其往候白屋或時起白屋之士以璧迎禮之人則言其執贄以候其家也傳語曰堯舜之儉茅茨不剪采椽不斲夫言茅茨采椽可也言不剪不斲增之也經曰弼成五服五服五采服也服五采之服又茅茨采椽何宮室衣服之不相稱也服五采畫日月星辰茅茨采椽非其實也傳語曰秦始皇帝燔燒詩書坑殺儒士言燔燒詩書滅去五經文書也坑殺儒士者言其皆挾經傳文書之人也燒其書坑其人詩書絕矣言燒燔詩書坑殺儒士實也言其欲滅詩書故坑殺其人非其誠又增之也秦始皇帝三十四年置酒咸陽臺儒士七十人前為壽僕射周青臣進頌始皇之德齊淳于越進諫始皇不封子弟功臣自為枝輔㓨周青臣以為面諛始皇下其議於丞相李斯李斯非淳于越曰諸生不師今而學古以非當世惑亂黔首臣請勑史官非秦記皆燒之非博士官所職天下有敢藏詩書百家語諸刑書者悉詣守尉雜燒之有敢偶語詩書者棄市以古非今者族滅吏見知弗舉者與同罪始皇許之明年三十五年諸生在咸陽者多為妖言始皇使御史案問諸生諸生傳相告引者自除犯禁者四百六十七人皆坑之燔詩書起淳于越之諫坑儒士起自諸生為妖言見坑者四百六十七人傳增言坑殺儒士欲絕詩書又言盡坑之此非其實而又增之傳語曰町町若荊軻之閭言荊軻為燕太子丹刺秦王後誅軻九族其後恚恨不已復夷軻之一里一里皆滅故曰町町此言增之也夫秦雖無道無為盡誅荊軻之里始皇幸梁山之宮從山上望見丞相李斯車騎甚盛恚出言非之其後左右以告李斯李斯立損車騎始皇知左右洩其言莫知為誰盡捕諸在旁者皆殺之其後墜星下東郡至地為石民或刻其石曰始皇帝死地分始皇聞之令御史逐問莫服盡取石旁人誅之夫誅從行於梁山宮及誅石旁人欲得洩言刻石者不能審知故盡誅之荊軻之閭何罪於秦而盡誅之如刺秦王在閭中不知為誰盡誅之可也荊軻已死刺者有人一里之民何為坐之始皇二十年燕使荊軻刺秦王秦王覺之體解軻以徇不言盡誅其閭彼或時誅軻九族九族眾多同里而處誅其九族一里且盡好增事者則言町町也
