body:
  text: 變動篇論災異者已疑於天用災異譴告人矣更說曰災異之至殆人君以政動天天動氣以應之譬之以物擊鼓以椎扣鍾鼓猶天椎猶政鍾鼓聲猶天之應也人主為於下則天氣隨人而至矣曰此又疑也夫天能動物物焉能動天何則人物繫於天天為人物主也故曰王良策馬車騎盈野非車騎盈野而乃王良策馬也天氣變於上人物應於下矣故天且雨商羊起舞非使天雨也商羊者知雨之物也天且雨屈其一足起舞矣故天且雨螻蟻徙丘蚓出琴絃緩固疾發此物為天所動之驗也故天且風巢居之蟲動且雨穴處之物擾風雨之氣感蟲物也故人在天地之間猶蚤虱之在衣裳之內螻蟻之在穴隙之中蚤虱螻蟻為逆順橫從能令衣裳穴隙之間氣變動乎蚤虱螻蟻不能而獨謂人能不達物氣之理也夫風至而樹枝動樹枝不能致風是故夏末蜻蛚鳴寒螿啼感陰氣也雷動而雉驚發蟄而虵出起陽氣也夜及半而鶴唳晨將旦而鷄鳴此雖非變天氣動物物應天氣之驗也顧可言寒溫感動人君人君起氣而以賞罰迺言以賞罰感動皇天天為寒溫以應政治乎六情風家言風至為盜賊者感應之而起非盜賊之人精氣感天使風至也風至搖不軌之心而盜賊之操發矣何以驗之盜賊之人見物而取睹敵而殺皆在徙倚漏刻之間未必宿日有其思也而天風已以貪狼陰賊之日至矣以風占貴賤者風從王相鄉來則貴從囚死地來則賤夫貴賤多少斗斛故也而風至糶穀之人貴賤其價天氣動搖人物者也故穀價低昂一貴一賤矣天官之書以正月朝占四方之風風從南方來者旱從北方來者湛東方來者為疫西方來者為兵太史公實道言以風占水旱兵疫者人物吉凶統於天也使物生者春也物死者冬也春生而冬殺者天也如或欲春殺冬生物終不死生何也物生統於陽物死繫於陰也故以口氣吹人人不能寒吁人人不能溫使見吹吁之人涉冬觸夏將有凍暘之患矣寒溫之氣繫於天地而統於陰陽人事國政安能動之且天本而人末也登樹搖其枝不能動其株如伐株萬莖枯矣人事猶樹枝寒溫猶根株也人生於天含天之氣以天為主猶耳目手足繫於心矣心有所為耳目視聽手足動作謂天應人是謂心為耳目手足使乎旌旗垂旒旒綴於杆杆東則旒隨而西苟謂寒溫隨刑賞而至是以天氣為綴旒也鉤星在房心之間地且動之占也齊太卜知之謂景公臣能動地景公信之夫謂人君能致寒溫猶齊景公信太卜之能動地夫人不能動地而亦不能動天夫寒溫天氣也天至高大人至卑小箸不能鳴鍾而螢火不而爨鼎者何也鐘長而箸短鼎大而螢小也以七尺之細形感皇天之大氣其無分銖之驗必也占大將且入國邑氣寒則將且怒溫則將喜夫喜怒起事而發未入界未見吏民是非未察喜怒未發而寒溫之氣已豫至矣怒喜致寒溫怒喜之後氣乃當至是竟寒溫之氣使人君怒喜也或曰未至誠也行事至誠若鄒衍之呼天而霜降杞梁妻哭而城崩何天氣之不能動乎夫至誠猶以心意之好惡也有果蓏之物在人之前去口一尺心欲食之口氣吸之不能取也手掇送口然後得之夫以果蓏之細員圌易轉去口不遠至誠欲之不能得也況天去人高遠其氣莽蒼無端末乎盛夏之時當風而立隆冬之月嚮日而坐其夏欲得寒而冬欲得溫也至誠極矣欲之甚者至或當風鼓箑嚮日燃爐而天終不為冬夏易氣者寒暑有節不為人變改也夫正欲得之而猶不能致況自刑賞意思不欲求寒溫乎萬人俱歎未能動天一鄒衍之口安能降霜鄒衍之狀孰與屈原見拘之冤孰與沉江離騷楚辭悽愴孰與一歎屈原死時楚國無霜此懷襄之世也厲武之時卞和獻玉刖其兩足奉玉泣出涕盡續之以血夫鄒衍之誠孰與卞和見拘之冤孰與刖足仰天而歎孰與泣血夫歎固不如泣拘固不如刖料計冤情衍不如和當時楚地不見霜李斯趙高纔殺太子扶蘇并及蒙恬蒙驁其時皆吐痛苦之言與歎聲同又禍至死非徒見拘而其死之地寒氣不生秦坑趙卒於長平之下四十萬眾同時俱陷當時啼號非徒歎也誠雖不及鄒衍四十萬之冤度當一賢臣之痛入坑埳之啼度過拘囚之呼當時長平之下不見隕霜甫刑曰庶僇旁告無辜于天帝此言蚩尤之民被冤旁告無罪于上天也以眾民之叫不能致霜鄒衍之言殆虛妄也南方至熱煎沙爛石父子同水而浴北方至寒凝冰坼土父子同穴而處燕在北邊鄒衍時周之五月正歲三月也中州內正月二月霜雪時降北邊至寒三月下霜未為變也此殆北邊三月尚寒霜適自降而衍適呼與霜逢會傳曰燕有寒谷不生五穀鄒衍吹律寒谷復溫則能使氣溫亦能使氣復寒何知衍不令時人知己之冤以天氣表己之誠竊吹律於燕谷獄令氣寒而因呼天乎即不然者霜何故降范雎為須賈所讒魏齊僇之折幹摺脅張儀遊於楚楚相掠之被捶流血二子冤屈太史公列記其狀鄒衍見拘雎儀之比也且子長何諱不言案衍列傳不言見拘而使霜降偽書遊言猶太子丹使日再中天雨粟也由此言之衍呼而降霜虛矣則杞梁之妻哭而崩城妄也頓牟叛趙襄子帥師攻之軍到城下頓牟之城崩者十餘丈襄子擊金而退之夫以杞梁妻哭而城崩襄子之軍有哭者乎秦之將滅都門內崩霍光家且敗第墻自壞誰哭於秦宮泣於霍光家者然而門崩墻壞秦霍敗亡之徵也或時杞國且圮而杞梁之妻適哭城下猶燕國適寒而鄒衍偶呼也事以類而時相因聞見之者或而然之夫城老墻朽猶有崩壞一婦之哭崩五丈之城是城則一指摧三仞之楹也春秋之時山多變山城一類也哭能崩城復能壞山乎女然素縞而哭河河流通信哭城崩固其宜也案杞梁從軍死不歸其婦迎之魯君弔於途妻不受弔棺歸於家魯君就弔不言哭於城下本從軍死從軍死不在城中妻向城哭非其處也然則杞梁之妻哭而崩城復虛言也因類以及荊軻刺秦王白虹貫日衛先生為秦畫長平之計太白食昴復妄言也夫豫子謀殺襄子伏於橋下襄子至橋心動貫高欲殺高祖藏人於壁中高祖至柏人亦動心二子欲刺兩主兩主心動實論之尚謂非二子精神所能感也而況荊軻欲刺秦王秦王之心不動而白虹貫日乎然則白虹貫日天變自成非軻之精為虹而貫日也鉤星在房心間地且動之占也地且動鉤星應房心夫太白食昴猶鉤星在房心也謂衛先生長平之議令太白食昴疑矣歲星害鳥尾周楚惡之綝然之氣見宋衛陳鄭災案時周楚未有非而宋衛陳鄭未有惡也然而歲星先守尾災氣著垂於天其後周楚有禍宋衛陳鄭同時皆然歲星之害周楚天氣災四國也何知白虹貫日不致刺秦王太白食昴不使長平計起也
