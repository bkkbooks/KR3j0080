body:
  text: 明雩篇變復之家以久雨為湛久暘為旱旱應亢陽湛應沈溺或難曰夫一歲之中十日者一雨五日者一風雨頗留湛之兆也暘頗久旱之漸也湛之時人君未必沈溺也旱之時未必亢陽也人君為政前後若一然而一湛一旱時氣也范蠡計然曰太歲在于水毀金穰木饑火旱夫如是水旱饑穰有歲運也歲直其運氣當其世變復之家指而名之人君用其言求過自改暘久自雨雨久自暘變復之家遂名其功人君然之遂信其術試使人君恬居安處不求己過天猶自雨雨猶自暘暘濟雨濟之時人君無事變復之家猶名其術是則陰陽之氣以人為主不統於天也夫人不能以行感天天亦不隨行而應人春秋魯大雩旱求雨之祭也旱久不雨禱祭求福若人之疾病祭神解禍矣此變復也詩云月離于畢比滂沱矣書曰月之從星則以風雨然則風雨隨月所離從也房星四表三道日月之行出入三道出北則湛出南則旱或言出北則旱南則湛案月為天下占房為九州候月之南北非獨為魯也孔子出使子路齎雨具有頃天果大雨子路問其故孔子曰昨暮月離于畢後日月復離畢孔子出子路請齎雨具孔子不聽出果無雨子路問其故孔子曰昔日月離其陰故雨昨暮月離其陽故不雨夫如是魯雨自以月離豈以政哉如審以政令月離于畢為雨占天下共之魯雨天下亦宜皆雨六國之時政治不同人君所行賞罰異時必以雨為應政令月離六七畢星然後足也魯繆公之時歲旱繆公問縣子天旱不雨寡人欲暴巫奚如縣子不聽欲徙市奚如對曰天子崩巷市七日諸侯薨巷市五日為之徙市不亦可乎案縣子之言徙市得雨也案詩書之文月離畢得雨日月之行有常節度肯為徙市故離畢之陰乎夫月畢天下占徙魯之市安耐移月月之行天三十日而周一月之中一過畢星離陽則暘離陰則雨假令徙市之感能令月離畢陰其時徙市而得雨乎夫如縣子言未可用也董仲舒求雨申春秋之義設虛立祀父不食於枝庶天不食於下地諸侯雩禮所祀未知何神如天神也唯王者天乃歆諸侯及今長吏天不享也神不歆享安耐得神如雲雨之氣也雲雨之氣何用歆享觸石而出膚寸而合不崇朝而辨雨天下泰山也泰山雨天下小山雨國邑然則大雩所祭豈祭山乎假令審然不而得也何以效之水異川而居相高分寸不決不流不鑿不合誠令人君禱祭水旁能令高分寸之水流而合乎夫見在之水相差無幾人君請之終不耐行況雨無形兆深藏高山人君雩祭安耐得之夫雨水在天地之間也猶夫涕泣在人形中也或齎酒食請於惠人之前求出其泣惠人終不為之隕涕夫泣不可請而出雨安可求而得雍門子悲哭孟嘗君為之流涕蘇秦張儀悲說坈中鬼谷先生泣下沾襟或者儻可為雍門之聲出蘇張之說以感天乎天又耳目高遠音氣不通杞梁之妻又已悲哭天不雨而城反崩夫如是竟當何以致雨雩祭之家何用感天案月出北道離畢之陰希有不雨由此言之北道畢星之所在也北道星肯為雩祭之故下其雨乎孔子出使子路齎雨具之時魯未必雩祭也不祭沛然自雨不求曠然自暘夫如是天之暘雨自有時也一歲之中暘雨連屬當其雨也誰求之者當其暘也誰止之者人君聽請以安民施恩必非賢也天至賢矣時未當雨偽請求之故妄下其雨人君聽請之類也變復之家不推類驗之空張法術惑人君或未當雨而賢君求之而不得或適當自雨惡君求之遭遇其時是使賢君受空責而惡君蒙虛名也世稱聖人純而賢者駮純則行操無非無非則政治無失然而世之聖君莫有如堯湯堯遭洪水湯遭大旱如謂政治所致堯湯惡君也如非政治是運氣也運氣有時安可請求世之論者猶謂堯湯水旱水旱者時也其小旱湛皆政也假令審然何用致湛審以政致之不脩所以失之而徒請求安耐復之世審稱堯湯水旱天之運氣非政所致夫天之運氣時當自然雖雩祭請求終無補益而世又稱湯以五過禱於桑林時立得雨夫言運氣則桑林之說絀稱桑林則運氣之論消世之說稱者竟當何由救水旱之術審當何用夫災變大抵有二有政治之災有無妄之變政治之災須耐求之求之雖不耐得而惠愍惻隱之恩不得已之意也慈父之於子孝子之於親知病不祀神疾痛不和藥夫知病之必不可治治之無益然終不肯安坐待絕猶卜筮求祟召毉和藥者惻痛慇懃冀有驗也既死氣絕不可如何升屋之危以衣招復悲恨思慕冀其悟也雩祭者之用心慈父孝子之用意也無妄之災百民不知必歸於主為政治者慰民之望故亦必雩問政治之災無妄之變何以別之曰德酆政得災猶至者無妄也德衰政失變應來者政治也夫政治則外雩而內改以復其虧無妄則內守舊政外脩雩禮以慰民心故夫無妄之氣歷世時至當固自一不宜改政何以驗之周公為成王陳立政之言曰時則物有間之自一話一言我則末維成德之彥以乂我受民周公立政可謂得矣知非常之物不賑不至故勑成王自一話一言政事無非毋敢變易然則非常之變無妄之氣間而至也水氣間堯旱氣間湯周宣以賢遭遇久旱建初孟年北州連旱牛死民乏放流就賤聖主寬明於上百官共職於下太平之明時也政無細非旱猶有氣間之也聖主知之不改政行轉穀賑贍損酆濟耗斯見之審明所以救赴之者得宜也魯文公間歲大旱臧文仲曰脩城郭貶食省用務嗇勸分文仲知非政故徒脩備不改政治變復之家見變輒歸於政不揆政之無非見異懼惑變易操行以不宜改而變秪取災焉何以言必當雩也曰春秋大雩傳家左丘明公羊穀梁無譏之文當雩明矣曾晳對孔子言其志曰暮春者春服既成冠者五六人童子六七人浴乎沂風乎舞雩詠而歸孔子曰吾與點也魯設雩祭於沂水之上暮者晚也春謂四月也春服既成謂四月之服成也冠者童子雩祭樂人也浴乎沂涉沂水也象龍之從水中出也風乎舞雩風歌也詠而饋詠歌饋祭也歌詠而祭也說論之家以為浴者浴沂水中也風乾身也周之四月正歲二月也尚寒安得浴而風乾身由此言之涉水不浴雩祭審矣春秋左氏傳曰啟蟄而雩又曰龍見而雩啟蟄龍見皆二月也春二月雩秋八月亦雩春祈穀雨秋祈穀實當今靈星秋之雩也春雩廢秋雩在故靈星之祀歲雩祭也孔子曰吾與點也善點之言欲以雩祭調和陰陽故與之也使雩失正點欲為之孔子宜非不當與也樊遲從游感雩而問刺魯不能崇德而徒雩也夫雩古而有之故禮曰雩宗祭水旱也故有雩禮故孔子不譏而仲舒申之夫如是雩祭祀禮也雩祭得禮則大水鼓用牲于社亦古禮也得禮無非當雩一也禮祭地社報生萬物之功土地廣遠難得辨祭故立社為位主心事之為水旱者陰陽之氣也滿六合難得盡祀故脩壇設位敬恭祈求效事社之義復災變之道也推生事死推人事鬼陰陽精氣儻如生人能飲食乎故共馨香奉進旨嘉區區惓惓冀見荅享推祭社言之當雩二也歲氣調和災害不生尚猶而雩今有靈星古昔之禮也況歲氣有變水旱不時人君之懼必痛甚矣雖有靈星之祀猶復雩恐前不備肜繹之義也冀復災變之虧獲酆穰之報三也禮之心悃愊樂之意歡忻悃愊以玉帛效心歡忻以鍾鼓驗意雩祭請祈人君精誠也精誠在內無以效外故雩祀盡己惶懼關納精心於雩祀之前玉帛鍾鼓之義四也臣得罪於君子獲過於父比自改更且當謝罪惶懼於旱如政治所致臣子得罪獲過之類也默改政治潛易操行不彰於外天怒不釋故必雩祭惶懼之義五也漢立博士之官師弟子相訶難欲極道之深形是非之理也不出橫難不得從說不發苦詰不聞甘對導米低仰欲求粺也砥石劘厲欲求銛也推春秋之義求雩祭之說實孔子之心考仲舒之意孔子既歿仲舒已死世之論者孰當復問唯若孔子之徒仲舒之黨為能說之
