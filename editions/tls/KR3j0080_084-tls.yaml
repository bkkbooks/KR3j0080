body:
  text: 對作篇或問曰賢聖不空生必有以用其心上自孔墨之黨下至荀孟之徒教訓必作垂文何也對曰聖人作經賢者傳記匡濟薄俗驅民使之歸實誠也案六略之書萬三千篇增善消惡割截橫拓驅役遊慢期便道善歸正道焉孔子作春秋周民弊也故采求毫毛之善貶纖介之惡撥亂世反諸正人道浹王道備所以檢柙靡薄之俗者悉具密致夫防決不備有水溢之害網解不結有獸失之患是故周道不弊則民不文薄民不文薄春秋不作楊墨之學不亂傳義則孟子之傳不造韓國不小弱法度不壞廢則韓非之書不為高祖不辨得天下馬上之計未轉則陸賈之語不奏眾事不失實凡論不壞亂則桓譚之論不起故夫賢聖之興文也起事不空為因因不妄作作有益於化化有補於正故漢立蘭臺之官校審其書以考其言董仲舒作道術之書頗言災異政治所失書成文具表在漢室主父偃嫉之誣奏其書天子下仲舒於吏當謂之下愚仲舒當死天子赦之夫仲舒言災異之事孝武猶不罪而尊其身況所論無觸忌之言核道實之事收故實之語乎故夫賢人之在世也進則盡忠宣化以明朝廷退則稱論貶說以覺失俗俗也不知還則立道輕為非論者不追救則迷亂不覺悟是故論衡之造也起眾書並失實虛妄之言勝真美也故虛妄之語不黜則華文不見息華文放流則實事不見用故論衡者所以銓輕重之言立真偽之平非苟調文飾辭為奇偉之觀也其本皆起人間有非故盡思極心以機世俗世俗之性好奇怪之語說虛妄之文何則實事不能快意而華虛驚耳動心也是故才能之士好談論者增益實事為美盛之語用筆墨者造生空文為虛妄之傳聽者以為真然說而不舍覽者以為實事傳而不絕不絕則文載竹帛之上不舍則誤入賢者之耳至或南面稱師賦姦偽之說典城佩紫讀虛妄之書明辨然否疾心傷之安能不論孟子傷楊墨之議大奪儒家之論引平直之說褒是抑非世人以為好辯孟子曰予豈好辯哉予不得已也今吾不得已也虛妄顯於真實誠亂於偽世人不悟是非不定紫朱雜廁瓦玉集糅以情言之豈吾心所能忍哉衛驂乘者越職而呼車惻怛發心恐上之危也夫論說者閔世憂俗與衛驂乘者同一心矣愁精神而幽魂魄動胸中之靜氣賊年損壽無益於性禍重於顏回違負黃老之教非人所貪不得已故為論衡文露而旨直辭姦而情實其政務言治民之道論衡諸篇實俗間之凡人所能見與彼作者無以異也若夫九虛三增論死訂鬼世俗所久感人所不能覺也人君遭弊改教於上人臣遇惑作論於下下實得則上教從矣冀悟迷惑之心使知虛實之分實虛之分定而華偽之文滅華偽之文滅則純誠之化日以孳矣或曰聖人作賢者述以賢而作者非也論衡政務可謂作者非曰作也亦非述也論也論者述之次也五經之興可謂作矣太史公書劉子政序班叔皮傳可謂述矣桓君山新論鄒伯奇檢論可謂論矣今觀論衡政務桓鄒之二論也非所謂作也造端更為前始未有若倉頡作書奚仲作車是也易言伏羲作八卦前是未有八卦伏羲造之故曰作也文王圖八自演為六十四故曰衍謂論衡之成猶六十四卦而又非也六十四卦以狀衍增益其卦溢其數多今論衡就世俗之書訂其真偽辯其實虛非造始更為無本於前也儒生就先師之說詰而難之文吏就獄卿之事覆而考之謂論衡為作儒生文吏謂作乎上書奏記陳列便宜皆欲輔政今作書者猶上書奏記說發胸臆文成手中其實一也夫上書謂之奏奏記轉易其名謂之書建初孟年中州頗歉潁川汝南民流四散聖主憂懷詔書數至論衡之人奏記郡守宜禁奢侈以備困乏言不納用退題記草名曰備乏酒縻五穀生起盜賊沉湎飲酒盜賊不絕奏記郡守禁民酒退題記草名曰禁酒由此言之夫作書者上書奏記之文也記謂之造作上書上書奏記是作也晉之乘而楚之檮杌魯之春秋人事各不同也易之乾坤春秋之元楊氏之玄卜氣號不均也由此言之唐林之奏谷永之章論衡政務同一趨也漢家極筆墨之林書論之造漢家尤多陽成子長作樂楊子雲造玄二經發於臺下讀於闕掖卓絕驚耳不述而作材疑聖人而漢朝不譏況論衡細說微論解釋世俗之疑辯照是非之理使後進曉見然否之分恐其廢失著之簡牘祖經章句之說先師奇說之類也其言伸繩彈割俗傳俗傳蔽惑偽書放流賢通之人疾之無已孔子曰詩人疾之不能默丘疾之不能伏是以論也玉亂於石人不能別或若楚之王尹以玉為石卒使卞和受刖足之誅是反為非虛轉為實安能不言俗傳既過俗書又偽若夫鄒衍謂今天下為一州四海之外有若天下者九州淮南書言共工與顓頊爭為天子不勝怒而觸不周之山使天柱折地維絕堯時十日並出堯上射九日魯陽戰而日暮援戈麾日日為卻還世間書傳多若等類浮妄虛偽沒奪正是心濆涌筆手擾安能不論論則考之以心效之以事浮虛之事輒立證驗若太史公之書據許由不隱燕太子丹不使日再中讀見之者莫不稱善政務為郡國守相縣邑令長陳通政事所當尚務欲令全民立化奉稱國恩論衡九虛三增所以使俗務實誠也論死訂鬼所以使俗薄喪葬也孔子徑庭麗級被棺歛者不省劉子政上薄葬奉送藏者不約光武皇帝草車茅馬為明器者不姦何世書俗言不載信死之語汶濁之也今著論死及死偽之篇明死無知不能為鬼冀觀覽者將一曉解約葬更為節儉斯蓋論衡有益之驗也言苟有益雖作何害倉頡之書世以紀事奚仲之車世以自載伯余之衣以辟寒暑桀之瓦屋以辟風雨夫不論其利害而徒譏其造作是則倉頡之徒有非世本十五家皆受責也故夫有益也雖作無害也雖無害何補古有命使采爵欲觀風俗知下情也詩作民間聖王可云汝民也何發作囚罪其身歿滅其詩乎今已不然故詩傳亞今論衡政務其猶詩也冀望見采而云有過斯蓋論衡之書所以興也且凡造作之過意其言妄而謗誹也論衡實事疾妄齊世宣漢恢國驗符盛褒須頌之言無誹謗之辭造作如此可以免於罪矣
