body:
  text: 書虛篇世信虛妄之書以為載於竹帛上者皆賢聖所傳無不然之事故信而是之諷而讀之睹真是之傳與虛妄之書相違則并謂短書不可信用夫幽冥之實尚可知沈隱之情尚可定顯文露書是非易見籠總并傳非實事用精不專無思於事也夫世間傳書諸子之語多欲立奇造異作驚目之論以駭世俗之人為譎詭之書以著殊異之名傳書言延陵季子出游見路有遺金當夏五月有披裘而薪者季子呼薪者曰取彼地金來薪者投鎌於地瞋目拂手而言曰何子居之高視之下儀貌之壯語言之野也吾當夏五月披裘而薪豈取金者哉季子謝之請問姓字薪者曰子皮相之士也何足語姓名遂去不顧世以為然殆虛言也夫季子恥吳之亂吳欲共立以為主終不肯受去之延陵終身不還廉讓之行終始若一許由讓天下不嫌貪封侯伯夷委國饑死不嫌貪刀鉤廉讓之行大可以況小小難以況大季子能讓吳位何嫌貪地遺金季子使於上國道過徐徐君好其寶劍未之即予還而徐君死解劍帶冢樹而去廉讓之心恥負其前志也季子不負死者棄其寶劍何嫌一叱生人取金於地季子未去吳乎公子也已去吳乎延陵君也公子與君出有前後車有附從不能空行於塗明矣既不恥取金何難使左右而煩披裘者世稱柳下惠之行言其能以幽冥自脩潔也賢者同操故千歲交志置季子於冥昧之處尚不取金況以白日前後備具取金於路非季子之操也或時季子實見遺金憐披裘薪者欲以益之或時言取彼地金欲以予薪者不自取也世俗傳言則言季子取遺金也傳書或言顏淵與孔子俱上魯太山孔子東南望吳閶門外有繫白馬引顏淵指以示之曰若見吳昌門乎顏淵曰見之孔子曰門外何有曰有如繫練之狀孔子撫其目而止之因與俱下下而顏淵髮白齒落遂以病死蓋以精神不能若孔子彊力自極精華竭盡故早夭死世俗聞之皆以為然如實論之殆虛言也案論語之文不見此言考六經之傳亦無此語夫顏淵能見千里之外與聖人同孔子諸子何諱不言蓋人目之所見不過十里過此不見非所明察遠也傳曰太山之高巍然去之百里不見埵堁遠也案魯去吳千有餘里使離朱望之終不能見況使顏淵何能審之如才庶幾者明目異於人則世宜稱亞聖不宜言離朱人目之視也物大者易察小者難審使顏淵處昌門之外望太山之形終不能見況從太山之上察白馬之色色不能見明矣非顏淵不能見孔子亦不能見也何以驗之耳目之用均也目不能見百里則耳亦不能聞也陸賈曰離婁之明不能察帷薄之內師曠之聰不能聞百里之外昌門之與太山非直帷薄之內百里之外也秦武王與孟說舉鼎不任絕脈而死舉鼎用力力由䈥脈䈥脈不堪絕傷而死道理宜也今顏淵用目望遠望遠目睛不任宜盲眇髮白齒落非其致也髮白齒落用精於學勤力不休氣力竭盡故至於死伯奇放流首髮早白詩云惟憂用老伯奇用憂而顏淵用睛蹔望倉卒安能致此儒書言舜葬於蒼梧禹葬於會稽者巡狩年老道死邊土聖人以天下為家不別遠近不殊內外故遂止葬夫言舜禹實也言其巡狩虛也舜之與堯俱帝者也共五千里之境同四海之內二帝之道相因不殊堯典之篇舜巡狩東至岱宗南至霍山西至太華北至恆山以為四嶽者四方之中諸侯之來並會嶽下幽深遠近無不見者聖人舉事求其宜適也禹王如舜事無所改巡狩所至以復如舜舜至蒼梧禹到會稽非其實也實者舜禹之時鴻水未治堯傳於舜舜受為帝與禹分部行治鴻水堯崩之後舜老亦以傳於禹舜南治水死於蒼梧禹東治水死於會稽賢聖家天下故因葬焉吳君高說會稽本山名夏禹巡守會計於此山因以名郡故曰會稽夫言因山名郡可也言禹巡狩會計於此山虛也巡狩本不至會稽安得會計於此山宜聽君高之說誠為會稽會計禹到南方何所會計如禹始東死於會稽舜亦巡狩至於蒼梧安所會計百王治定則出巡巡則輒會計是則四方之山皆會計也百王太平升封太山太山之上封可見者七十有二紛綸湮滅者不可勝數如審帝王巡狩則輒會計會計之地如太山封者四方宜多夫郡國成名猶萬物之名不可說也獨為會稽立歟周時舊名吳越也為吳越立名從何往哉六國立名狀當如何天下郡國且百餘縣邑出萬鄉亭聚里皆有號名賢聖之才莫能說君高能說會稽不能辨定方名會計之說未可從也巡狩考正法度禹時吳為裸國斷髮文身考之無用會計如何傳書言舜葬於蒼梧象為之耕禹葬會稽鳥為之田蓋以聖德所致天使鳥獸報祐之也世莫不然如考實之殆虛言也夫舜禹之德不能過堯堯葬於冀州或言葬於崇山冀州鳥獸不耕而鳥獸獨為舜禹耕何天恩之偏駮也或曰舜禹治水不得寧處故舜死於蒼梧禹死於會稽勤苦有功故天報之遠離中國故天痛之夫天報舜禹使鳥田象耕何益舜禹天欲報舜禹宜使蒼梧會稽常祭祀之使鳥獸田耕不能使人祭祭加舜禹之墓田施人民之家天之報祐聖人何其拙也且無益哉由此言之鳥田象耕報祐舜禹非其實也實者蒼梧多象之地會稽眾鳥所居禹貢曰彭蠡既瀦陽鳥攸居天地之情鳥獸之行也象自蹈土鳥自食草土撅草盡若耕田狀壤靡泥易人隨種之世俗則謂為舜禹田海陵麋田若象耕狀何嘗帝王葬海陵者邪傳書言吳王夫差殺伍子胥煮之於鑊乃以鴟夷橐投之於江子胥恚恨驅水為濤以溺殺人今時會稽丹徒大江錢唐浙江皆立子胥之廟蓋欲慰其恨心止其猛濤也夫言吳王殺子胥投之於江實也言其恨恚驅水為濤者虛也屈原懷恨自投湘江湘江不為濤申徒狄蹈河而死河水不為濤世人必曰屈原申徒狄不能勇猛力怒不如子胥夫衛葅子路而漢烹彭越子胥勇猛不過子路彭越然二士不能發怒於鼎鑊之中以烹湯葅汁瀋漎旁人子胥亦然自先入鼎鑊後乃入江在鑊中之時其神安居豈怯於鑊湯而勇於江水哉何其怒氣前後不相副也且投於江中何江也有丹徒大江有錢唐浙江有吳通陵江或言投於丹徒大江無濤欲言投於錢唐浙江浙江山陰江上虞江皆有濤三江有濤豈分橐中之體散置三江中乎人若恨恚也仇讎未死子孫遺在可也今吳國已滅夫差無類吳為會稽立置太守子胥之神復何怨苦為濤不止欲何求索吳越在時分會稽郡越治山陰吳都今吳餘暨以南屬越錢唐以北屬吳錢唐之江兩國界也山陰上虞在越界中子胥入吳之江為濤當自止吳界中何為入越之地怨恚吳王發怒越江違失道理無神之驗也且夫水難驅而人易從也生任䈥力死用精魂子胥之生不能從生人營衛其身自令身死䈥力消絕精魂飛散安能為濤使子胥之類數百千人乘船渡江不能越水一子胥之身煮湯鑊之中骨肉糜爛成為羹葅何能有害也周宣王殺其臣杜伯燕簡公殺其臣莊子義其後杜伯射宣王莊子義害簡公事理似然猶為虛言今子胥不能完體為杜伯子義之事以報吳王而驅水往來豈報讎之義有知之驗哉俗語不實成為丹青丹青之文賢聖惑焉夫地之有百川也猶人之有血脈也血脈流行汎揚動靜自有節度百川亦然其朝夕往來猶人之呼吸氣出入也天地之性上古有之經曰江漢朝宗于海唐虞之前也其發海中之時漾馳而已入三江之中殆小淺狹水激沸起故騰為濤廣陵曲江有濤文人賦之大江浩洋曲江有濤竟以隘狹也吳殺其身為濤廣陵子胥之神竟無知也溪谷之深流者安洋淺多沙石激揚為瀨夫濤瀨一也謂子胥為濤誰居溪谷為瀨者乎案濤入三江江岸沸踊中央無聲必以子胥為濤子胥之身聚岸涯也濤之起也隨月盛衰小大滿損不齊同如子胥為濤子胥之怒以月為節也三江時風揚侯之波亦溺殺人子胥之神復為風也秦始皇渡湘水遭風問湘山何祠左右對曰堯之女舜之妻也始皇大怒使刑徒三千人斬湘山之樹而履之夫謂子胥之神為濤猶謂二女之精為風也傳書言孔子當泗水而葬泗水為之卻流此言孔子之德能使水卻不湍其墓也世人信之是故儒者稱論皆言孔子之後當封以泗水卻流為證如原省之殆虛言也夫孔子死孰與其生生能操行慎道應天死操行絕天祐至德故五帝三王招致瑞應皆以生存不以死亡孔子生時推排不容故歎曰鳳鳥不至河不出圖吾已矣夫生時無祐死反有報乎孔子之死五帝三王之死也五帝三王無祐孔子之死獨有天報是孔子之魂聖五帝之精不能神也泗水無知為孔子卻流天神使之然則孔子生時天神何不使人尊敬如泗水卻流天欲封孔子之後孔子生時功德應天天不封其身乃欲封其後乎是蓋水偶自卻流江河之流有回復之處百川之行或易道更路與卻流無以異則泗水卻流不為神怪也傳書稱魏公子之德仁惠下士兼及鳥獸方與客飲有鸇擊鳩鳩走巡於公子案下鸇追擊殺之於公子之前公子恥之即使人多設羅得鸇數十枚責讓以擊鳩之罪擊鳩之鸇低頭不敢仰視公子乃殺之世稱之曰魏公子為鳩報仇此虛言也夫鸇物也情心不同音語不通聖人不能使鳥獸為義理之行公子何人能使鸇低頭自責鳥為鸇者以千萬數向擊鳩蜚去安可復得能低頭自責是聖鳥也曉公子之言則知公子之行矣知公子之行則不擊鳩於其前人猶不能改過鳥與人異謂之能悔世俗之語失物類之實也或時公子實捕鸇鸇得人持其頭變折其頸疾痛低垂不能仰視緣公子惠義之人則因褒稱言鸇服過蓋言語之次空生虛妄之美功名之下常有非實之加傳書言齊桓公妻姑姊妹七人此言虛也夫亂骨肉犯親戚無上下之序者禽獸之性則亂不知倫理案桓公九合諸侯一正天下道之以德將之以威以故諸侯服從莫敢不率非內亂懷鳥獸之性者所能為也夫率諸侯朝事王室恥上無勢而下無禮也外恥禮之不存內何犯禮而自壞外內不相副則功無成而威不立矣世稱桀紂之惡不言淫於親戚實論者謂夫桀紂惡微於亡秦亡秦過泊於王莽無淫亂之言桓公妻姑姊妺七人是惡浮於桀紂而過重於秦莽也春秋采毫毛之美貶纖芥之惡桓公惡大不貶何哉魯文姜齊襄公之妹也襄公通焉春秋經曰莊二年冬夫人姜氏會齊侯于郜春秋何尤於襄公而書其奸何宥於桓公隱而不譏如經失之傳家左丘明公羊穀梁何諱不言案桓公之過多內寵內嬖如夫人者六有五公子爭立齊亂公薨三月乃訃世聞內嬖六人嫡庶無別則言亂於姑姊妹七人矣傳書言齊桓公負婦人而朝諸侯此言桓公之淫亂無禮甚也夫桓公大朝之時負婦人於背其游宴之時何以加此方脩士禮崇厲肅敬負婦人於背何以能率諸侯朝事王室葵丘之會桓公驕矜當時諸侯畔者九國睚眥不得九國畔去況負婦人淫亂之行何以肯留或曰管仲告諸侯曰吾君背有疽創不得婦人瘡不衰愈諸侯信管仲故無畔者夫十室之邑必有忠信若孔子當時諸侯千人以上必知方術治疽不用婦人管仲為君諱也諸侯知仲為君諱而欺己必恚怒而畔去何以能久統會諸侯成功於霸或曰桓公實無道任賢相管仲故能霸天下夫無道之人與狂無異信讒遠賢反害仁義安能任管仲能養人令之成事桀殺關龍逢紂殺王子比干無道之君莫能用賢使管仲賢桓公不能用用管仲故知桓公無亂行也有賢明之君故有貞良之臣臣賢君明之驗奈何謂之有亂難曰衛靈公無道之君時知賢臣管仲為輔何明桓公不為亂也夫靈公無道任用三臣僅以不喪非有功行也桓公尊九九之人拔甯戚於車下責苞茅不貢運兵攻楚九合諸侯一匡天下千世一出之主也而云負婦人於背虛矣說尚書者曰周公居攝帶天子之綬戴天子之冠負扆南面而朝諸侯戶牖之間曰扆南面之坐位也負扆南面鄉坐扆在後也桓公朝諸侯之時或南面坐婦人立於後也世俗傳云則曰負婦人於背矣此則夔一足宋丁公鑿井得一人之語也唐虞時夔為大夫性知音樂調聲悲善當時人曰調樂如夔一足矣世俗傳言夔一足案秩宗官缺帝舜博求眾稱伯夷伯夷稽首讓于夔龍秩宗卿官漢之宗正也斷足足非其理也且一足之人何用行也夏后孔甲田于東陽萯山天雨晦冥入于民家主人方乳或曰后來之子必貴或曰不勝之子必賤孔甲曰為余子孰能賤之遂載以歸析橑斧斬其足卒為守者孔甲之欲貴之子有餘力矣斷足無宜故為守者今夔一足無因趨步坐調音樂可也秩宗之官不宜一足猶守者斷足不可貴也孔甲不得貴之子伯夷不得讓於夔焉宋丁公者宋人也未鑿井時常有寄汲計之日去一人作自鑿井後不復寄汲計之日得一人之作故曰宋丁公鑿井得一人俗傳言曰丁公鑿井得一人於井中夫人生於人非生於土也穿土鑿井無為得人推此以論負婦人之語猶此類也負婦人而坐則云婦人在背知婦人在背非道則生管仲以婦人治疽之言矣使桓公用婦人徹胤服婦人於背女氣瘡可去以婦人治疽方朝諸侯桓公重衣婦人襲裳女氣分隔負之何益桓公思士作庭燎而夜坐以思致士反以白日負婦人見諸侯乎傳書言聶政為嚴翁仲刺殺韓王此虛也夫聶政之時韓列侯也列侯之三年聶政刺韓相俠累十二年列侯卒與聶政殺俠累相去十七年而言聶政刺殺韓王短書小傳竟虛不可信也傳書又言燕太子丹使刺客荊軻刺秦王不得誅死後高漸麗復以擊筑見秦王秦王說之知燕太子之客乃冒其眼使之擊筑漸麗乃置鉛於筑中以為重當擊筑秦王膝進不能自禁漸麗以筑擊秦王顙秦王病傷三月而死夫言高漸麗以筑擊秦王實也言中秦王病傷三月而死虛也夫秦王者秦始皇帝也始皇二十年燕太子丹使荊軻刺始皇始皇殺軻明矣二十一年使將軍王翦攻燕得太子首二十五年遂伐燕而虜燕王喜後不審何年高漸麗以筑擊始皇不中誅漸麗當三十七年游天下到會稽至琅邪北至勞盛山並海西至平原津而病到沙丘平臺始皇崩夫讖書言始皇還到沙丘而亡傳書又言病筑瘡三月而死於秦一始皇之身世或言死於沙丘或言死於秦其死言恆病瘡傳書之言多失其實世俗之人不能定也
