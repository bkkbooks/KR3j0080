body:
  text: 奇怪篇儒者稱聖人之生不因人氣更稟精於天禹母吞薏苡而生禹故夏姓曰姒禼母吞燕卵而生禼故殷姓曰子后稷母履大人迹而生后稷故周姓曰姬詩曰不坼不副是生后稷説者又曰禹禼逆生闓母背而出后稷順生不坼不副不感動母體故曰不坼不副逆生者子孫逆死順生者子孫順亡故桀紂誅死赧王奪邑言之有頭足故人信其説明事以驗證故人然其文讖書又言堯母慶都野出赤龍感己遂生堯高祖本紀言劉媼嘗息大澤之陂夢與神遇是時雷電晦冥太公往視見蛟龍於上已而有身遂生高祖其言神驗文又明著世儒學者莫謂不然如實論之虛妄言也彼詩言不坼不副言其不感動母體可也言其闓母背而出妄也夫蟬之生於復育也闓背而出天之生聖子與復育同道乎兔舐雄毫而懷子及其子生從口而出案禹母吞薏苡禼母咽燕卵與兔吮毫同實也禹禼之母生子宜皆從口不當闓背夫如是闓背之説竟虛妄也世間血刃死者多未必其先祖初為人者生時逆也秦失天下閻樂斬胡亥項羽誅子嬰秦之先祖伯翳豈逆生乎夫如是為順逆之説以驗三家之祖誤矣且夫薏苡草也燕卵鳥也大人迹土也三者皆形非氣也安能生人説聖者以為稟天精微之氣故其為有殊絶之知今三家之生以草以鳥以土可謂精微乎天地之性唯人為貴則物賤矣今貴人之氣更稟賤物之精安能精微乎夫令鳩雀施氣於鴈鵠終不成子者何也鳩雀之身小鴈鵠之形大也今燕之身不過五寸薏苡之莖不過數尺二女吞其卵實安能成七尺之形乎爍一鼎之銅以灌一錢之形不能成一鼎明矣今謂大人天神故其迹巨巨迹之人一鼎之爍銅也薑原之身一錢之形也使大人施氣於薑原薑原之身小安能盡得其精不能盡得其精則后稷不能成人堯高祖審龍之子子性類父龍能乘雲堯與高祖亦宜能焉萬物生於土各似本種不類土者生不出於土土徒養育之也母之懷子猶土之育物也堯高祖之母受龍之施猶土受物之播也物生自類本種夫二帝宜似龍也且夫含血之類相與為牝牡牝牡之會皆見同類之物精感欲動乃能授施若夫牡馬見雌牛雄雀見牝雞不相與合者異類故也今龍與人異類何能感於人而施氣或曰夏之衰二龍鬭於庭吐漦於地龍亡漦在櫝而藏之至周幽王發出龍漦化為玄黿入于後宮與處女交遂生褒姒玄黿與人異類何以感於處女而施氣乎夫玄黿所交非正故褒姒為禍周國以亡以非類妄交則有非道妄亂之子今堯高祖之母不以道接會何故二帝賢聖與褒姒異乎或曰趙簡子病五日不知人覺言我之帝所有熊來帝命我射之中熊熊死有羆來我又射之中羆羆死後問當道之鬼鬼曰熊羆晉二卿之先祖也熊羆物也與人異類何以施類於人而為二卿祖夫簡子所射熊羆二卿當亡簡子當昌之祆也簡子見之若寢夢矣空虛之象不必有實假令有之或時熊羆先化為人乃生二卿魯公牛哀病化為虎人化為獸亦如獸為人玄黿入後宮殆先化為人天地之間異類之物相與交接未之有也天人同道好惡均心人不好異類則天亦不與通人雖生於天猶蟣虱生於人也人不好蟣虱天無故欲生於人何則異類殊性情欲不相得也天地夫婦也天施氣於地以生物人轉相生精微為聖皆因父氣不更稟取如更稟者為聖禼后稷不聖如聖人皆當更稟十二聖不皆然也黃帝帝嚳帝顓頊帝舜之母何所受氣文王武王周公孔子之母何所感吞此或時見三家之姓曰姒氏子氏姬氏則因依放空生怪説猶見鼎湖之地而著黃帝升天之説矣失道之意還反其字蒼頡作書與事相連薑原履大人迹迹者基也姓當為下其土乃為女旁頤非基迹之字不合本事疑非實也以周姬況夏殷亦知子之與姒非燕子薏苡也或時禹契后稷之母適欲懷妊遭吞薏苡燕卵履大人迹也世好奇怪古今同情不見奇怪謂德不異故因以為姓世間誠信因以為然聖人重疑因不復定世士淺論因不復辨儒生是古因生其説彼詩言不坼不副者言后稷之生不感動母身也儒生穿鑿因造禹契逆生之説感於龍夢與神遇猶此率也堯高祖之母適欲懷妊遭逢雷龍載雲雨而行人見其形遂謂之然夢與神遇得聖子之象也夢見鬼合之非夢與神遇乎安得其實野出感龍及蛟龍居上或堯高祖受富貴之命龍為吉物遭加其上吉祥之瑞受命之證也光武皇帝産於濟陽宮鳳凰集於地嘉禾生於屋聖人之生奇鳥吉物之為瑞應必以奇吉之物見而子生謂之物之子是則光武皇帝嘉禾之精鳳皇之氣歟案帝繫之篇及三代世表禹鯀之子也禼稷皆帝嚳之子其母皆帝嚳之妃也及堯亦嚳之子帝王之妃何為適草野古時雖質禮已設制帝王之妃何為浴於水夫如是言聖人更稟氣於天母有感吞者虛妄之言也實者聖人自有種族如文武各有類孔子吹律自知殷後項羽重瞳自知虞舜苗裔也五帝三王皆祖黃帝黃帝聖人本稟貴命故其子孫皆為帝王帝王之生必有怪奇不見於物則效於夢矣
