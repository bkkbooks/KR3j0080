body:
  text: 禍虛篇世謂受福祐者既以為行善所致又謂被禍害者為惡所得以為有沉惡伏過天地罰之鬼神報之天地所罰小大猶發鬼神所報遠近猶至傳曰子夏喪其子而喪其明曾子弔之哭子夏曰天乎豫之無罪也曾子怒曰商汝何無罪也吾與汝事夫子於洙泗之間退而老於西河之上使西河之民疑汝於夫子爾罪一也喪爾親使民未有異聞爾罪二也喪爾子喪爾明爾罪三也而曰汝何無罪歟子夏投其杖而拜曰吾過矣吾過矣吾離群而索居亦以久矣夫子夏喪其明曾子責以罪子夏投杖拜曾子之言蓋以天實罰過故目失其明己實有之故拜受其過始聞暫見皆以為然熟考論之虛妄言也夫失明猶失聽也失明則盲失聽則聾病聾不謂之有過失明謂之有罪惑也蓋耳目之病猶心腹之有病也耳目失明聽謂之有罪心腹有病可謂有過乎伯牛有疾孔子自牖執其手曰亡之命矣夫斯人也而有斯疾也原孔子言謂伯牛不幸故傷之也如伯牛以過致疾天報以惡與子夏同孔子宜陳其過若曾子謂子夏之狀今乃言命命非過也且夫天之罰人猶人君罪下也所罰服罪人君赦之子夏服過拜以自悔天德至明宜愈其盲如非天罪子夏失明亦無三罪且喪明之病孰與被厲之病喪明有三罪被厲有十過乎顏淵早夭子路葅醢早死葅醢天下極禍也以喪明言之顏淵子路有百罪也由此言之曾子之言誤矣然子夏之喪明喪其子也子者人情所通親者人所力報也喪親民無聞喪子失其明此恩損於親而愛增於子也增則哭泣無數數哭中風目失明矣曾子因俗之議以著子夏三罪子夏亦緣俗議因以失明故拜受其過曾子子夏未離於俗故孔子門敘行未在上第也秦襄王賜白起劍白起伏劍將自刎曰我有何罪於天乎良久曰我固當死長平之戰趙卒降者數十萬我詐而盡坑之是足以死遂自殺白起知己前罪服更後罰也夫白起知己所以罪不知趙卒所以坑如天審罰有過之人趙降卒何辜于天如用兵妄傷殺則四十萬衆必有不亡不亡之人何故以其善行無罪而竟坑之卒不得以善蒙天之祐白起何故獨以其罪伏天之誅由此言之白起之言過矣秦二世使使者詔殺蒙恬蒙恬喟然嘆曰我何過於天無罪而死良久徐曰恬罪故當死矣夫起臨洮屬之遼東城徑萬里此其中不能毋絶地脈此乃恬之罪也即吞藥自殺太史公非之曰夫秦之初滅諸侯天下之心未定夷傷未瘳而恬為名將不以此時強諫救百姓之急養老矜孤修衆庶之和而阿意興功此其子兄弟過遇誅不亦宜乎何與乃罪地脈也夫蒙恬之言既非而太史公非之亦未是何則蒙恬絶地脈罪至當死地養萬物何過於人而蒙恬絶其脈蒙恬知己有絶地脈之罪不知地脈所以絶之過自非如此與不自非何以異太史公為非恬之為名將不能以強諫故致此禍夫當諫不諫故致受死亡之戮身任李陵坐下蠶室如太史公之言所任非其人故殘身之戮天命而至也非蒙恬以不強諫故致此禍則己下蠶室有非者矣己無非則其非蒙恬非也作伯夷之傳則列善惡之行云七十子之徒仲尼獨薦顏淵好學然回也屢空糟粳不厭卒夭死天之報施善人如何哉盜跖日殺不辜肝人之肉暴戾恣睢聚黨數千橫行天下竟以壽終是獨遵何哉若此言之顏回不當早夭盜跖不當全活也不怪顏淵不當夭而獨謂蒙恬當死過矣漢將李廣與望氣王朔燕語曰自漢擊胸奴而廣未常不在其中而諸校尉以下才能不及中然以胡軍功取侯者數十人而廣不為後人然終無尺寸之功以得封邑者何也豈吾相不當侯且固命也朔曰將軍自念豈常有恨者乎廣曰吾為隴西太守羌常反吾誘而降之八百餘人吾詐而同日殺之至今恨之獨此矣朔曰禍莫大於殺已降此乃將軍所以不得侯者也李廣然之聞者信之夫不侯猶不王者也不侯何恨不王何負乎孔子不王論者不謂之有負李廣不侯王朔謂之有恨然則王朔之言失論之實矣論者以為人之封侯自有天命天命之符見於骨體大將軍衛青在建章宮時鉗徒相之曰貴至封侯後竟以功封萬戶侯衛青未有功而鉗徒見其當封之證由此言之封侯有命非人操行所能得也鉗徒之言實而有效王朔之言虛而無驗也多橫恣而不罹禍順道而違福王朔之説白起自非蒙恬自咎之類也倉卒之世以財利相劫殺者衆同車共船千里為商至闊迥之地殺其人而并取其財尸捐不收骨暴不葬在水為魚鱉之食在土為螻蟻之糧惰窳之人不力農勉商以積穀貨遭歲飢饉腹餓不飽椎人若畜割而食之無君子小人並為魚肉人所不能知吏所不能覺千人以上萬人以下計一聚之中生者百一死者十九可謂無道至痛甚矣皆得陽達富厚安樂天不責其無仁義之心道相并殺非其無力作而倉卒以人為食加以渥禍使之夭命章其陰罪明示世人使知不可為非之驗何哉王朔之言未必審然傳書李斯妬同才幽殺韓非於秦後被車裂之罪商鞅欺舊交擒魏公子卬後受誅死之禍彼欲言其賊賢欺交故受患禍之報也夫韓非何過而為李斯所幽公子卬何罪而為商鞅所擒車裂誅死賊賢欺交幽死見擒何以致之如韓非公子卬有惡天使李斯商鞅報之則李斯商鞅為天奉誅宜蒙其賞不當受其禍如韓非公子卬無惡非天所罰李斯商鞅不得幽擒論者説曰韓非公子卬有陰惡伏罪人不聞見天獨知之故受戮殃夫諸有罪之人非賊賢則逆道如賊賢則被所賊者何負如逆道則被所逆之道何非凡人窮達禍福之至大之則命小之則時太公窮賤遭周文而得封寧戚隱厄逢齊桓而見官非窮賤隱厄有非而得封見官有是也窮達有時遭遇有命也太公寧戚賢者也尚可謂有非聖人純道者也虞舜為父弟所害幾死再三有遇唐堯堯禪舜不為帝嘗見害未有非立為帝未有是前時未到後則命時至也案古人君臣困窮後得達通未必初有惡天禍其前卒有善神祐其後也一身之行一行之操結髮終死前後無異然一成一敗一進一退一窮一通一全一壞遭遇適然命時當也
