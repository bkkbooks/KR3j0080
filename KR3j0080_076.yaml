body:
  text: 祀義篇世信祭祀以為祭祀者必有福不祭祀者必有禍是以病作卜祟祟得脩祀祀畢意解意解病已執意以為祭祀之助勉奉不絕謂死人有知鬼神飲食猶相賓客賓客悅喜報主人恩矣其脩祭祀是也信其享之非也實者祭祀之意主人自盡恩懃而已鬼神未必歆享之也何以明之今所祭者報功則緣生人為恩義耳何歆享之有今所祭死人死人無知不能飲食何以審其不能歆享飲食也夫天者體也與地同天有列宿地有宅舍宅舍附地之體列宿著天之形形體具則有口乃能食使天地有口能食祭食宜食盡如無口則無體無體則氣也若雲霧耳亦無能食如天地之精神若人之有精神矣以人之精神何宜飲食中人之體七八尺身大四五圍食斗食歠斗羹乃能飽足多者三四斗天地之廣大以萬里數圜丘之上一蠒栗牛粢飴大羹不過數斛以此食天地天地安能飽天地用心猶人用意也人食不飽足則怨主人不報以德矣必謂天地審能飽食則夫古之郊者負天地山猶人之有骨節也水猶人之有血脈也故人食腸滿則骨節與血脈因以盛矣今祭天地則山川隨天地而飽今別祭山川以為異神是人食已更食骨節與血脈也社稷報生穀物之功萬物生於天地猶毫毛生於體也祭天地則社稷設其中矣人君重之故復別祭必以為有神是人之膚肉當復食也五祀初本在地門戶用木與土土木生於地井竈室中霤皆屬於地祭地五祀設其中矣人君重之故復別祭必以為有神是食已當復食形體也風伯雨師雷公是群神也風猶人之有吹喣也雨猶人之有精液也雷猶人之有腹鳴也三者附於天地祭天地三者在矣人君重之故復別祭必以為有神則人吹喣精液腹鳴當復食也日月猶人之有目星辰猶人之有髮三光附天祭天三光在矣人君重之故復別祭必以為有神則人之食已復食目與髮也宗廟己之先也生存之時謹敬供養死不敢不信故脩祭祀緣生事死示不忘先五帝三王郊宗黃帝帝嚳之屬報功重力不敢忘德未必有鬼神審能歆享之也夫不能歆享則不能神不能神則不能為福亦不能為禍禍福之起由於喜怒喜怒之發由於腹腸有腹腸者輒能飲食不能飲食則無腹腸無腹腸則無用喜怒無用喜怒則無用為禍福矣或曰歆氣不能食也夫歆之與飲食一實也用口食之用口歆之無腹腸則無口無口無用食則亦無用歆矣何以驗其不能歆也以人祭祀有過不能即時犯也夫歆不用口則用鼻矣口鼻能歆之則目能見之目能見之則手能擊之今手不能擊則知口鼻不能歆之也或難曰宋公鮑之身有疾祝曰夜姑掌將事於厲者厲鬼杖楫而與之言曰何而粢盛之不膏也何而芻犧之不肥碩也何以珪璧之不中度量也而罪歟其鮑之罪歟夜姑順色而對曰鮑身尚幼在襁褓不預知焉審是掌之厲鬼舉楫而掊之斃於壇下此非能言用手之驗乎曰夫夜姑之死未必厲鬼擊之也時命當死也妖象厲鬼象鬼之形則象鬼之言象鬼之言則象鬼而擊矣何以明之夫鬼者神也神則先知先知則宜自見粢盛之不膏珪璧之失度犧牲之臞小則因以責讓夜姑以楫擊之而已無為先問先問不知之效也不知不神之驗也不知不神則不能見體出言以楫擊人也夜姑義臣也引罪自予已故鬼擊之如無義而歸之鮑身則厲鬼將復以楫掊鮑之身矣且祭祀不備神怒見體以殺掌祀如禮備神喜肯見體以食賜主祭乎人有喜怒鬼亦有喜怒人不為怒者身存不為喜者身亡厲鬼之怒見體而罰宋國之祀必時中禮夫神何不見體以賞之乎夫怒喜不與人同則其賞罰不與人等賞罰不與人等則其掊夜姑不可信也且夫歆者內氣也言者出氣也能歆則能言猶能吸則能呼矣如鬼神能歆則宜言於祭祀之上今不能言知不能歆一也凡能歆者口鼻通也使鼻鼽不通口鉗不開則不能歆之矣人之死也口鼻腐朽安能復歆二也禮曰人死也斯惡之矣與人異類故惡之也為尸不動朽敗滅亡其身不與生人同則知不與生人通矣身不同知不通其飲食不與人鈞矣胡越異類飲食殊味死之與生非直胡之與越也由此言之死人不歆三也當人之臥也置食物其旁不能知也覺乃知之知乃能食之夫死長臥不覺者也安能知食不能歆之四也或難曰祭則鬼享之何謂也曰言其脩具謹潔粢牲肥香人臨見之意飲食之推己意以況鬼神鬼神有知必享此祭故曰鬼享之也難曰易曰東鄰殺牛不如西鄰之礿祭夫言東鄰不若西鄰言東鄰牲大福少西鄰祭少福多也今言鬼不享何以知其福有多少也曰此亦謂脩具謹潔與不謹潔也紂殺牛祭不致其禮文王礿祭竭盡其敬夫禮不至則人非之禮敬盡則人是之是之則舉事多助非之則言行見畔見畔若祭不見享之禍多助若祭見歆之福非鬼為祭祀之故有喜怒也何以明之苟鬼神不當須人而食須人而食是不能神也信鬼神歆祭祀祭祀為禍福謂鬼神居處何如狀哉自有儲偫邪將以人食為饑飽也如自有儲偫儲偫必與人異不當食人之物如無儲偫則人朝夕祭乃可耳壹祭壹否則神壹饑壹飽壹饑壹飽則神壹怒壹喜矣且病人見鬼及臥夢與死人相見如人之形故其祭祀如人之食緣有飲食則宜有衣服故復以繒製衣以象生儀其祭如生人之食人欲食之冀鬼饗之其製衣也廣縱不過一尺若五六寸以所見長大之神貫一尺之衣其肯喜而加福於人乎以所見之鬼為審死人乎則其製衣宜若生人之服如以所製之衣審鬼衣之乎則所見之鬼宜如偶人之狀夫如是也世所見鬼非死人之神或所衣之神非所見之鬼也鬼神未定厚禮事之安得福祐而堅信之乎
