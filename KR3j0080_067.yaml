body:
  text: 薄葬篇賢聖之業皆以薄葬省用為務然而世尚厚葬有奢泰之失者儒家論不明墨家議之非故也墨家之議右鬼以為人死輒為神鬼而有知能形而害人故引杜伯之類以為效驗儒家不從以為死人無知不能為鬼然而賻祭備物者示不負死以觀生也陸賈依儒家而説故其立語不肯明處劉子政舉薄葬之奏務欲省用不能極論是以世俗內持狐疑之議外聞杜伯之類又見病且終者墓中死人來與相見故遂信是謂死如生閔死獨葬魂孤無副丘墓閉藏穀物乏匱故作偶人以侍尸柩多藏食物以歆精魂積浸流至或破家盡業以充死棺殺人以殉葬以快生意非知其內無益而奢侈之心外相慕也以為死人有知與生人無以異孔子非之而亦無以定實然而陸賈之論兩無所處劉子政奏亦不能明儒家無知之驗墨家有知之效事莫明於有效論莫定於有證空言虛語雖得道心人猶不信是以世俗輕愚信禍福者畏死不懼義重死不顧生竭財以事神空家以送終辨士文人有效驗若墨家之以杜伯為據則死人無知之實可明薄葬省財之教可立也今墨家非儒儒家非墨各有所持故乖不合業難齊同故二家爭論世無祭祀復生之人故死生之義未有所定實者死人暗昧與人殊途其實荒忽難得深知有知無知之情不可定為鬼之實不可是通人知士雖博覽古今窺涉百家條入葉貫不能審知唯聖心賢意方比物類為能實之夫論不留精澄意苟以外效立事是非信聞見於外不詮訂於內是用耳目論不以心意議也夫以耳目論則以虛象為言虛象效則以實事為非是故是非者不徒耳目必開心意墨議不以心而原物苟信聞見則雖效驗章明猶為失實失實之議難以教雖得愚民之欲不合知者之心喪物索用無益於世此蓋墨術所以不傳也魯人將以璵璠斂孔子聞之徑庭麗級而諫夫徑庭麗級非禮也孔子為救患也患之所由常由有所貪璵璠寶物也魯人用斂姦人間之欲心生矣姦人欲生不畏罪法不畏罪法則丘墓抇矣孔子睹微見著故徑庭麗級以救患直諫夫不明死人無知之義而著丘墓必抇之諫雖盡比干之執人人必不聽何則諸侯財多不憂貧威強不懼抇死人之議狐疑未定孝子之計從其重者如明死人無知厚葬無益論定議立較著可聞則璵璠之禮不行徑庭之諫不發矣今不明其説而強其諫此蓋孔子所以不能立其教孔子非不明死生之實其意不分別者亦陸賈之語指也夫言死人無知則臣子倍其君父故曰喪祭禮廢則臣子恩泊臣子恩泊則倍死亡先倍死亡先則不孝獄多聖人懼開不孝之源故不明死人無知之實異道不相連事生厚化自生雖事死泊何損於化使死者有知倍之非也如無所知倍之何損明其無知未必有倍死之害不明無知成事已有賊生之費孝子之養親病也未死之時求卜迎醫冀禍消藥有益也既死之後雖審如巫咸良如扁鵲終不復使何則知死氣絶終無補益治死無益厚葬何差乎倍死恐傷化絶卜拒醫獨不傷義乎親之生也坐之高堂之上其死也葬之黃泉之下黃泉之下非人所居然而葬之不疑者以死絶異處不可同也如當亦如生存恐人倍之宜葬於宅與生同也不明無知為人倍其親獨明葬黃泉不為離其先乎親在獄中罪疑未定孝子馳走以救其難如罪定法立終無門戶雖曾子子騫坐泣而已何則計動無益空為煩也今死親之魂定無所知與拘親之罪決不可救何以異不明無知恐人倍其先獨明罪定不為忽其親乎聖人立義有益於化雖小弗除無補於政雖大弗與今厚死人何益於恩倍之弗事何損於義孔子又謂為明器不成示意有明俑則偶人象類生人故魯用偶人葬孔子嘆睹用人殉之兆也故嘆以痛之即如生當備物不示如生意悉其教用偶人葬恐後用生殉用明器獨不為後用善器葬乎絶用人之源不防喪物之路重人不愛用痛人不憂國傳議之所失也救漏防者悉塞其穴則水泄絶穴不悉塞水有所漏漏則水為患害論死不悉則奢禮不絶不絶則喪物索用用索物喪民貧耗之至危亡之道也蘇秦為燕使齊國之民高大丘冢多藏財物蘇秦身弗以勸勉之財盡民貧國空兵弱燕軍卒至無以自衛國破城亡主出民散今不明死之無知使民自竭以厚葬親與蘇秦姦計同一敗墨家之議自違其術其薄葬而又右鬼右鬼引效以杜伯為驗杜伯死人如謂杜伯為鬼則夫死者審有知如有知而薄葬之是怒死人也人情欲厚而惡薄以薄受死者之責雖右鬼其何益哉如以鬼非死人則其信杜伯非也如以鬼是死人則其薄葬非也術用乖錯首尾相違故以為非非與是不明皆不可行夫如是世俗之人可一詳覽詳覽如斯可一薄葬矣
