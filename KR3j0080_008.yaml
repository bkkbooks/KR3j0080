body:
  text: 率性篇論人之性定有善有惡其善者固自善矣其惡者故可教告率勉使之為善凡人君父審觀臣子之性善則養育勸率無令近惡近惡則輔保禁防令漸於善善漸於惡惡化於善成為性行召公戒成王曰今王初服厥命於戲若生子罔不在厥初生生子謂十五子初生意於善終以善初生意於惡終以惡詩曰彼姝者子何以與之傳言譬猶練絲染之藍則青染之丹則赤十五之子其猶絲也其有所漸化為善惡猶藍丹之染練絲使之為青赤也青赤一成真色無異是故楊子哭岐道墨子哭練絲也蓋傷離本不可復變也人之性善可變為惡惡可變為善猶此類也蓬生麻間不扶自直白紗入緇不染自黑彼蓬之性不直紗之質不黑麻扶緇染使之直黑夫人之性猶蓬紗也在所漸染而善惡變矣王良造父稱為善御不能使不良為良也如徒能御良其不良者不能馴服此則駔工庸師服馴技能何奇而世稱之故曰王良登車馬不罷駑堯舜為政民無狂愚傳曰堯舜之民可比屋而封桀紂之民可比屋而誅斯民也三代所以直道而行也聖主之民如彼惡主之民如此竟在化不在性也聞伯夷之風者貪夫廉而懦夫有立志聞柳下惠之風者薄夫敦而鄙夫寬徒聞風名猶或變節況親接形面相敦告乎孔門弟子七十之徒皆任卿相之用被服聖教文才雕琢知能十倍教訓之功而漸漬之力也未入孔子之門時閭巷常庸無奇其尤甚不率者唯子路也世稱子路無恆之庸人未入孔門時戴雞佩豚勇猛無禮聞誦讀之聲搖雞奮豚揚脣吻之音聒賢聖之耳惡至甚矣孔子引而教之漸漬磨礪闓導牖進猛氣消損驕節屈折卒能政事序在四科斯蓋變性使惡為善之明效也夫肥沃墝埆土地之本性也肥而沃者性美樹稼豐茂墝而埆者性惡深耕細鋤厚加糞壤勉致人功以助地力其樹稼與彼肥沃者相似類也地之高下亦如此焉以钁鍤鑿地以埤增下則其下與高者齊如復增钁鍤則夫下者不徒齊者也反更為高而其高者反為下使人之性有善有惡彼地有高有下勉致其教令之善則將善者同之矣善以化渥釀其教令變更為善善則且更宜反過於往善猶下地增加钁鍤更崇於高地也賜不受命而貨殖焉賜本不受天之富命所加貨財積聚為世富人者得貨殖之術也夫得其術雖不受命猶自益饒富性惡之人亦不稟天善性得聖人之教志行變化世稱利劍有千金之價棠溪魚腸之屬龍泉太阿之輩其本鋌山中之恆鐵也冶工鍛鍊成為銛利豈利劍之鍛與鍊乃異質哉工良師巧鍊一數至也試取東下直一金之劍更熟鍛鍊足其火齊其銛猶千金之劍也夫鐵石天然尚為鍛鍊者變易故質況人含五常之性賢聖未之熟鍛鍊耳奚患性之不善哉古貴良醫者能知篤劇之病所從生起而以針藥治而已之如徒知病之名而坐觀之何以為奇夫人有不善則乃性命之疾也無其教治而欲令變更豈不難哉天道有真偽真者固自與天相應偽者人加知巧亦與真者無以異也何以驗之禹貢曰璆琳琅玕璆玉也琳珠也琅玕珠之類也者此則土地所生真玉珠也然而道人消爍五石作五色之玉比之真玉光不殊別兼魚蚌之珠與禹貢璆琳皆真玉珠也然而隨侯以藥作珠精耀如真道士之教至知巧之意加也陽遂取火於天五月丙午日中之時消鍊五石鑄以為器磨礪生光仰以嚮日則火來至此真取火之道也今妄以刀劍偃月之鉤月摩拭朗白仰以嚮日亦得火焉夫偃月鉤非陽遂也所以耐取火者摩拭之所致也今夫性惡之人使與性善者同類乎可率勉之令其為善使之異類乎亦可令與道人之所鑄玉隨侯之所作珠人之所摩刀劍偃月鉤焉教導以學漸漬以德亦將日有仁義之操黃帝與炎帝爭為天子教熊羆貔虎以戰于阪泉之野三戰得志炎帝敗績堯以天下讓舜鯀為諸侯欲得三公而堯不聽怒其猛獸欲以為亂比獸之角可以為城舉尾可以為旌奮心盛氣阻戰為強夫禽獸與人殊形猶可命戰況人同類乎推此以論百獸率舞潭魚出聽六馬仰秣不復疑矣異類以殊為同同類以鈞為異所由不在於物在於人也凡含血氣者教之所以異化也三苗之民或賢或不肖堯舜齊之恩教加也楚越之人處莊嶽之間經歷歲月變為舒緩風俗侈也故曰齊舒緩秦慢易楚促急燕戇投以莊嶽言之四國之民更相出入久居單處性必變易夫性惡者心比木石木石猶為人用況非木石在君子之迹庶幾可見有癡狂之疾歌啼於路不曉東西不睹燥濕不覺疾病不知飢飽性已毀傷不可如何前無所觀卻無所畏也是故王法不廢學校之官不除獄理之吏欲令凡衆見禮義之教學校勉其前法禁防其後使丹朱之志亦將可勉何以驗之三軍之士非能制也勇將率勉視死如歸且闔廬嘗試其士於五湖之側皆加刃於肩血流至地句踐亦試其士於寢宮之庭赴火死者不可勝數火夫刃非人性之所貪也二主激率念不顧生是故軍之法輕刺血孟賁勇也聞軍令懼是故叔孫通制定禮儀拔劍爭功之臣奉禮拜伏初驕倨而後遜順聖教威德變易性也不患性惡患其不服聖教自遇而以生禍也豆麥之種與稻粱殊然食能去飢小人君子稟性異類乎譬諸五穀皆為用實不異而效殊者稟氣有厚泊故性有善惡也殘則受不仁之氣泊而怒則稟勇渥也仁泊則戾而少慈勇渥則猛而無義而又和氣不足喜怒失時計慮輕愚妄行之人罪故為惡人受五常含五臟皆具於身稟之泊少故其操行不及善人猶酒或厚或泊也非厚與泊殊其釀也麴糵多少使之然也是故酒之泊厚同一麴糵人之善惡共一元氣氣有少多故性有賢愚西門豹急佩韋以自緩董安于緩帶弦以自促急之與緩俱失中和然而韋弦附身成為完具之人能納韋弦之教補接不足則豹安于之名可得參也貧劣宅屋不具墻壁宇達人指訾之如財貨富愈起屋築墻以自蔽鄣為之具宅人弗復非魏之行田百畝鄴獨二百西門豹灌以漳水成為膏腴則畝收一鍾夫人之質猶鄴田道教猶漳水也患不能化不患人性之難率也雒陽城中之道無水水工激上雒中之水日夜馳流水工之功也由此言之迫近君子而仁義之道數加於身孟母之徙宅蓋得其驗人間之水污濁在野外者清潔俱為一水源從天涯或濁或清所在之勢使之然也南越王趙他本漢賢人也化南夷之俗背畔王制椎髻箕坐好之若性陸賈説以漢德懼以聖威蹶然起坐心覺改悔奉制稱蕃其於椎髻箕坐也惡之若性前則若彼後則若此由此言之亦在於教不獨在性也
