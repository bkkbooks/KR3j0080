body:
  text: 儒增篇儒書稱堯舜之德至優至大天下太平一人不刑又言文武之隆遺在成康刑錯不用四十餘年是欲稱堯舜襃文武也夫為言不益則美不足稱為文不渥則事不足襃堯舜雖優不能使一人不刑文武雖盛不能使刑不用言其犯刑者少用刑希䟽可也言其一人不刑刑錯不用增之也夫能使一人不刑則能使一國不伐能使刑錯不用則能使兵寢不施案堯伐丹水舜征有苗四子服罪刑兵設用成王之時四國篡畔淮夷徐戎並為患害夫刑人用刀伐人用兵罪人用法誅人用武武法不殊兵刀不異巧論之人不能別也夫德劣故用兵犯法故施刑刑與兵猶足與翼也走用足飛用翼形體雖異其行身同刑之與兵全眾禁邪其實一也稱兵之不用言刑之不施是猶人耳缺目完以目完稱人體全不可從也人桀於刺虎怯於擊人而以刺虎稱謂之勇不可聽也身無敗缺勇無不進乃為全耳今稱一人不刑不言一兵不用襃刑錯不用不言一人不畔未得為優未可謂盛也儒書稱楚養由基善射射一楊葉百發能百中之是稱其巧於射也夫言其時射一楊葉中之可也言其百發而百中增之也夫一楊葉射而中之中之一再行敗穿不可復射矣如就葉懸於樹而射之雖不欲射葉楊葉繁茂自中之矣是必使上取楊葉一一更置地而射之也射之數十行足以見巧觀其射之者亦皆知射工亦必不至於百明矣言事者好增巧美數十中之則言其百中矣百與千數之大者也實欲言十則言百百則言千矣是與書言協和萬邦詩曰子孫千億同一意也儒書言衛有忠臣弘演為衛哀公使未還狄人攻哀公而殺之盡食其肉獨捨其肝弘演使還致命於肝痛哀公之死身肉盡肝無所附引刀自刳其腹盡出其腹實乃內哀公之肝而死言此者欲稱其忠矣言其自刳內哀公之肝而死可也言盡出其腹實乃內哀公之肝增之也人以刃相刺中五藏輒死何則五藏氣之主也猶頭脈之湊也頭一斷手不能取他人之頭著之於頸奈何獨能先出其腹實乃內哀公之肝腹實出輒死則手不能復把矣如先內哀公之肝乃出其腹實則文當言內哀公之肝出其腹實今先言盡出其腹實內哀公之肝又言盡增其實也儒書言楚熊渠子出見寢石以為伏虎將弓射之矢沒其衛或曰養由基見寢石以為兕也射之矢飲羽或言李廣便是熊渠養由基李廣主名不審無害也或以為虎或以為兕兕虎俱猛一實也或言沒衛或言飲羽羽則衛言不同耳要取以寢石似虎兕畏懼加精射之入深也夫言以寢石為虎射之矢入可也言其沒衛增之也夫見似虎者意以為是張弓射之盛精加意則其見真虎與是無異射似虎之石矢入沒衛若射真虎之身矢洞度乎石之質難射肉易射也以射難沒衛言之則其射易者洞不疑矣善射者能射遠中微不失毫釐安能使弓弩更多力乎養由基從軍射晉侯中其目夫以匹夫射萬乘之主其加精倍力必與射寢石等當中晉侯之目也可復洞達於項乎如洞達於項晉侯宜死車張十石之弩恐不能入一寸矢摧為三況以一人之力引微弱之弓雖加精誠安能沒衛人之精乃氣也氣乃力也有水火之難惶惑恐懼舉徙器物精誠至矣素舉一石者倍舉二石然則見伏石射之精誠倍故不過入一寸如何謂之沒衛乎如有好用劍者見寢石懼而斫之可復謂能斷石乎以勇夫空拳而暴虎者卒然見寢石以手椎之能令石有跡乎巧人之精與拙人等古人之誠與今人同使當今射工射禽獸於野其欲得之不餘精力乎及其中獸不過數寸跌誤中石不能內鋒箭摧折矣夫如是儒書之言楚熊渠子養由基李廣射寢石矢沒衛飲羽者皆增之也儒書稱魯般墨子之巧刻木為鳶飛之三日而不集夫言其以木為鳶飛之可也言其三日不集增之也夫刻木為鳶以象鳶形安能飛而不集乎既能飛翔安能至於三日如審有機關一飛遂翔不可復下則當言遂飛不當言三日猶世傳言曰魯般巧亡其母也言其巧工為母作木車馬木人御者機關備具載母其上一驅不還遂失其母如木鳶機關備具與木車馬等則遂飛不集機關為須臾間不能遠過三日則木車等亦宜三日止於道路無為徑去以失其母二者必失實者矣書說孔子不能容於世周流游說七十餘國未嘗得安夫言周流不遇可也言干七十國增之也案論語之篇諸子之書孔子自衛反魯在陳絕糧削迹於衛忘味於齊伐樹於宋并費與頓牟至不能十國傳言七十國非其實也或時干十數國也七十之說文書傳之因言干七十國矣論語曰孔子問公叔文子於公明賈曰信乎夫子不言不笑不取乎公明賈對曰以告者過也夫子時然後言人不厭其言也樂然後笑人不厭其笑也義然後取人不厭其取也子曰豈其然乎豈其然乎夫公叔文子實時言樂笑義取人傳說稱之言其不言不笑不取也俗言竟增之也書言秦繆公伐鄭過晉不假途晉襄公率姜戎要擊於崤塞之下匹馬隻輪無反者時秦遣三大夫孟明視西乞術白乙丙皆得復還夫三大夫復還車馬必有歸者文言匹馬隻輪無反者增其實也書稱齊之孟嘗魏之信陵趙之平原楚之春申君待士下客招會四方各三千人欲言下士之至趨之者眾也夫言士多可也言其三千增之也四君雖好士士至雖眾不過各千餘人書則言三千矣夫言眾必言千數言少則言無一世俗之情言事之失也傳記言高子羔之喪親泣血三年未嘗見齒君子以為難難為故也夫不以為非實而以為難君子之言誤矣高子泣血殆必有之何則荊和獻寶於楚楚刖其足痛寶不進己情不達泣涕涕盡因續以血今高子痛親哀極涕竭血隨而出實也而云三年未嘗見齒是增之也言未嘗見齒欲言其不言不笑也孝子喪親不笑可也安得不言言安得不見齒孔子曰言不文或時不言傳則言其不見齒或時傳則言其不見齒三年矣高宗諒陰三年不言尊為天子不言而其文言不言猶疑於增況高子位賤而曰未嘗見齒是必增益之也儒書言禽息薦百里奚繆公未聽出禽息當門仆頭碎首而死繆公痛之乃用百里奚此言賢者薦善不愛其死仆頭碎首而死以達其友也世士相激文書傳稱之莫謂不然夫仆頭以薦善古今有之禽息仆頭蓋其實也言碎首而死是增之也夫人之扣頭痛者血流雖忿恨惶恐無碎首者非首不可碎人力不能自碎也執刃刎頸樹鋒刺胸鋒刃之助故手足得成勢也言禽息舉椎自擊首碎不足怪也仆頭碎首力不能自將也有扣頭而死者未有使頭破首碎者也此或時扣頭薦百里奚世空言其死若或扣頭而死世空言其首碎也儒書言荊軻為燕太子刺秦王操匕首之劍刺之不得秦王拔劍擊之軻以匕首擿秦王不中中銅柱入尺欲言匕首之利荊軻勢盛投銳利之刃陷堅彊之柱稱荊軻之勇故增益其事也夫言入銅柱實也言其入尺增之也夫銅雖不若匕首堅剛入之不過數寸殆不能入尺以入尺言之設中秦王匕首洞過乎車張十石之弩射垣木之表尚不能入尺以荊軻之手力投輕小之匕首身被龍淵之劍刃入堅剛之銅柱是荊軻之力勁於十石之弩銅柱之堅不若木表之剛也世稱荊軻之勇不言其多力多力之人莫若孟賁使孟賁擿銅柱能洞過出一尺乎此亦或時匕首利若干將莫邪所刺無前所擊無下故有入尺之效夫稱干將莫邪亦過其實刺擊無前下亦入銅柱尺之類也儒書言董仲舒讀春秋專精一思志不在他三年不窺園菜夫言不窺園菜實也言三年增之也仲舒雖精亦時解休解休之間猶宜游於門庭之側則能至門庭何嫌不窺園菜聞用精者察物不見存道以亡身不聞不至門庭坐思三年不及窺園也尚書毋佚曰君子所其毋逸先知稼穡之艱難乃佚佚者解也人之䈥骨非木非石不能不解故張而不弛文王不為弛而不張文王不行一弛一張文王以為常聖人材優尚有弛張之時仲舒材力劣於聖安能用精三年不休儒書言夏之方盛也遠方圖物貢金九牧鑄鼎象物而為之備故入山澤不逢惡物用辟神姦故能叶于上下以承天休夫金之性物也用遠方貢之為美鑄以為鼎用象百物之奇安能入山澤不逢惡物辟除神姦乎周時天下太平越裳獻白雉倭人貢鬯草食白雉服鬯草不能除凶金鼎之器安能辟姦且九鼎之來德盛之瑞也服瑞應之物不能致福男子服玉女子服珠珠玉於人無能辟除寶奇之物使為蘭服作牙身或言有益者九鼎之語也夫九鼎無能辟除傳言能辟神姦是則書增其文也世俗傳言周鼎不爨自沸不投物物自出此則世俗增其言也儒書增其文也是使九鼎以無怪空為神也且夫謂周之鼎神者何用審之周鼎之金遠方所貢禹得鑄以為鼎也其為鼎也有百物之象如為遠方貢之為神乎遠方之物安能神如以為禹鑄之為神乎禹聖不能神聖人身不能神鑄器安能神如以金之物為神乎則夫金者石之類也石不能神金安能神以有百物之象為神乎夫百物之象猶雷罇也雷罇刻畫雲雷之形雲雷在天神於百物雲雷之象不能神百物之象安能神也傳言秦滅周周之九鼎入于秦案本事周赧王之時秦昭王使將軍摎攻王赧王赧惶懼犇秦頓首受罪盡獻其邑三十六口三萬秦受其獻還王赧王赧卒秦王取九鼎寶器矣若此者九鼎在秦也始皇二十八年北遊至琅邪還過彭城齊戒禱祠欲出周鼎使千人沒泗水之中求弗能得案時昭王之後三世得始皇帝秦無危亂之禍鼎宜不亡亡時殆在周傳言王赧犇秦秦取九鼎或時誤也傳又言宋太丘社亡鼎沒水中彭城下其後二十九年秦并天下若此者鼎未入秦也其亡從周去矣未為神也春秋之時五石隕于宋五石者星也星之去天猶鼎之亡於地也星去天不為神鼎亡於地何能神秦秋之時三山亡猶太丘社之去宋五星之去天三山亡五石隕太丘社去皆自有為然鼎亡亡亦有應也未可以亡之故乃謂之神如鼎與秦三山同乎亡不能神如有知欲辟危亂之禍乎則更桀紂之時矣衰亂無道莫過桀紂桀紂之時鼎不亡去周之衰亂未若桀紂留無道之桀紂去衰末之周非亡去之宜有神知之驗也或時周亡之時將軍摎人眾見鼎盜取姦人鑄爍以為他器始皇求不得也後因言有神名則空生沒於泗水之語矣孝文皇帝之時趙人新垣平上言周鼎亡在泗水中今河溢通於泗水臣望東北汾陰直有金氣意周鼎其出乎兆見弗迎則不至於是文帝使使治廟汾陰南臨河欲祠出周鼎人有上書告新垣平所言神器事皆詐也於是下平事於吏吏治誅新垣平夫言鼎在泗水中猶新垣平詐言鼎有神氣見也
