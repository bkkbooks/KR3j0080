body:
  text: 順鼓篇春秋之義大水鼓用牲于社說者曰鼓者攻之也或曰脅之脅則攻矣陰勝攻社以救之或難曰攻社謂得勝負之義未可得順義之節也人君父事天母事地母之黨類為害可攻母以救之乎以政令失道陰陽繆盩者人君也不自攻以復之反逆節以犯尊天地安肯濟使湛水害傷天不以地害天攻之可也今湛水所傷物也萬物於地卑也害犯至尊之體於道違逆論春秋者曾不知難案雨出於山流入於川湛水之類山川是矣大水之災不攻山川社土也五行之性水土不同以水為害而攻土土勝水攻社之義毋乃如今世工匠之用椎鑿也以椎擊鑿令鑿穿木今儻攻土令厭水乎且夫攻社之義以為攻陰之類也甲為盜賊傷害人民甲在不亡舍甲而攻乙之家耐止甲乎今雨者水也水在不自攻水而乃攻社案天將雨山先出雲雲積為雨雨流為水然則山者父母水者子弟也重罪刑及族屬罪父母子弟乎罪其朋徒也計山水與社俱為雨類也孰為親者社土也五行異氣相去遠殷太戊桑榖俱生或曰高宗恐駭側身行道思索先王之政興滅國繼絶世舉逸民明養老之義桑榖消亡享國長久此說春秋者所共聞也水災與桑榖之變何以異殷王改政春秋攻社道相違反行之何從周成王之時天大雷雨偃禾拔木為害大矣成王開金縢之書求索行事見周公之功執書以泣過雨止風反禾大木復起大雨久湛其實一也成王改過春秋攻社兩經二義行之如何月令之家蟲食穀稼取蟲所類象之吏笞擊僇辱以滅其變實論者謂之未必真是然而為之厭合人意今致雨者政也吏也不變其政不罪其吏而徒攻社能何復塞苟以為當攻其類衆陰之精月也方諸鄉月水自下來月離于畢出房北道希有不雨月中之獸兔蟾蜍也其類在地螺與蚄也月毀於天螺坊臽缺同類明矣雨久不霽攻陰之類宜捕斬兔蟾蜍椎破螺坊為得其實蝗蟲時至或飛或集所集之地穀草枯索吏卒部民塹道作坎榜驅內於塹坎杷蝗積聚以千斛數正攻蝗之身蝗猶不止況徒攻陰之類雨安肯霽尚書大傳曰煙氛郊社不修山川不祝風雨不時霜雪不降責於天公臣多弒主㜸多殺宗五品不訓責於人公城郭不繕溝池不修水泉不降水為民害責於地公王者三公各有所主諸侯卿大夫各有分職大水不責卿大夫而擊鼓攻社何如不然魯國失禮孔子作經表以為戒也公羊高不能實董仲舒不能定故攻社之義至今復行之使高尚生仲舒未死將難之曰久雨湛水溢誰致之者使人君也宜改政易行以復塞之如人臣也宜罪其人以過解天如非君臣陰陽之氣偶時運也擊鼓攻社何而救止春秋說曰人君亢陽致旱沈溺致水夫如是旱則為亢陽之行水則為沈溺之操何乃攻社攻社不解朱絲縈之亦復未曉說者以為社陰朱陽也水陰也以陽色縈之助鼓為救夫大山失火灌以罋水衆知不能救之者何也火盛水少熱不能勝也今國湛水猶大山失火也以若繩之絲縈社為救猶以罋水灌大山也原天心以人意狀天治以人事人相攻擊氣不相兼兵不相負不能取勝今一國水使真欲攻陰以絶其氣悉發國人操刀把杖以擊之若歲終逐疫然后為可楚漢之際六國之時兵革戰攻力彊則勝弱劣則負攻社一人擊鼓無兵革之威安能救雨夫一暘一雨猶一晝一夜也其遭若堯湯之水旱猶一冬一夏也如或欲以人事祭祀復塞其變冬求為夏夜求為晝也何以效之久雨不霽試使人君高枕安臥雨猶自止止久至於大旱試使人君高枕安臥旱猶自雨何則陽極反陰陰極反陽故夫天地之有湛也何以知不如人之有水病也其有旱也何以知不如人有疸疾也禱請求福終不能愈變操易行終不能救使醫食藥冀可得愈命盡期至醫藥無效堯遭洪水春秋之大水也聖君知之不禱於神不改乎政使禹治之百川東流夫堯之使禹治水猶病水者之使醫也然則堯之洪水天地之水病也禹之治水洪水之良醫也說者何以易之攻社之義於事不得雨不霽祭女媧於禮何見伏羲女媧俱聖者也舍伏羲而祭女媧春秋不言董仲舒之議其故何哉夫春秋經但言鼓豈言攻哉說者見有鼓文則言攻矣夫鼓未必為攻說者用意異也季氏富於周公而求也為之聚斂而附益之孔子曰非吾徒也小子鳴鼓攻之可也攻者責也責讓之也六國兵革相攻不得難此此又非也以卑而責尊為逆矣或據天責之也王者母事地母有過子可據父以責之乎下之於上宜言諫若事臣子之禮也責讓上之禮也乖違禮意行之如何夫禮以鼓助號呼明聲響也古者人君將出撞鍾擊鼓故警戒下也必以伐鼓為攻此社此則鍾聲鼓鳴攻擊上也大水用鼓或時再告社陰之太盛雨湛不霽陰盛陽微非道之宜口祝不副以鼓自助與日食鼓用牲于社同一義也俱為告急彰陰盛也事大而急者用鍾鼓小而緩者用鈴篍彰事告急助口氣也天道難知大水久湛假令政治所致猶先告急乃斯政行盜賊之發與此同操盜賊亦政所致比求闕失猶先發告鼓用牲于社發覺之也社者衆陰之長故伐鼓使社知之說鼓者以為攻之故攻母逆義之難緣此而至今言告以陰盛陽微攻尊之難奚從來哉且告宜於用牲用牲不宜於攻告事用牲禮也攻之用牲於禮何見朱絲如繩示在陽也陽氣實微故用物微也投一寸之針布一丸之艾於血脈之蹊篤病有瘳朱絲如一寸之針一丸之艾也吳攻破楚昭王亡走申包胥間步赴秦哭泣求救卒得助兵卻吳而存楚擊鼓之人誠如何耳使誠若申包胥一人擊得假令一人擊鼓將耐令社與秦王同感以土勝水之威卻止雲雨雲雨氣得與吳同恐消散入山百姓被害者得蒙霽晏有楚國之安矣迅雷風烈君子必變雖夜必興衣冠而坐懼威變異也夫水旱猶雷風也雖運氣無妄欲令人君高枕据臥以俟其時無惻怛憂民之心堯不用牲或時上世質也倉頡作書奚仲作車可以前代之時無書車之事非後世為之乎時同作殊事乃可難異世易俗相非如何世俗圖畫女媧之象為婦人之形又其號曰女仲舒之意殆謂女媧古婦人帝王者也男陽而女陰陰氣為害故祭女媧求福祐也傳又言共工與顓頊爭為天子不勝怒而觸不周之山使天柱折地維絶女媧消煉五色石以補蒼天斷鼇之足以立四極仲舒之祭女媧殆見此傳也本有補蒼天立四極之神天氣不和陽道不勝儻女媧以精神助聖王止雨湛乎
