body:
  text: 別通篇富人之宅以一丈之地為內內中所有柙匱所贏縑布絲綿帛也貧人之宅亦以一丈為內內中空虛徒四壁立故名曰貧夫通人猶富人不通者猶貧人也俱以七尺為形通人胸中懷百家之言不通者空腹無一牒之誦貧人之內徒四所壁立也慕料貧富不相如則夫通與不通不相及也世人慕富不榮通羞貧不賤不賢不推類以況之也夫富人可慕者貨財多則饒裕故人慕之夫富人不如儒生儒生不如通人通人積文十篋以上聖人之言賢者之語上自黃帝下至秦漢治國肥家之術刺世譏俗之言備矣使人通明博見其為可榮非徒縑布絲綿帛也蕭何入秦收拾文書漢所以能制九州者文書之力也以文書御天下天下之富孰與家人之財人目不見青黃曰盲耳不聞宮商曰聾鼻不知香臭曰癰癰聾與盲不成人者也人不博覽者不聞古今不見事類不知然否猶目盲耳聾鼻癰者也儒生不博覽猶為閉暗況庸人無篇章之業不知是非其為閉暗甚矣此則土木之人耳目俱足無聞見也涉淺水者見蝦其頗深者察魚鱉其尤甚者觀蛟龍足行跡殊故所見之物異也入道淺深其猶此也淺者則見傳記諧文深者入聖室觀祕書故入道彌深所見彌大人之遊也必欲入都都多奇觀也入都必欲見市市多異貨也百家之言古今行事其為奇異非徒都邑大市也遊於都邑者心厭觀於大市者意飽況遊於道藝之際哉大川旱不枯者多所疏也潢汙兼日不雨泥輒見者無所通也是故大川相間小川相屬東流歸海故海大也海不通於百川安得巨大之名夫人含百家之言猶海懷百川之流也不謂之大者是謂海小於百川也夫海大於百川也人皆知之通者明於不通莫之能別也潤下作鹹水之滋味也東海水鹹流廣大也西州鹽井源泉深也人或無井而食或穿井不得泉有鹽井之利乎不與賢聖通業望有高世之名難哉法令之家不見行事議罪不審章句之生不覽古今論事不實或以說一經為是何須博覽夫孔子之門講習五經五經皆習庶幾之才也顏淵曰博我以文才智高者能為博矣顏淵之曰博者豈徒一經哉我不能博五經又不能博衆事守信一學不好廣觀無溫故知新之明而有守愚不覽之暗其謂一經是者其宜也開戶內日之光日光不能照幽鑿窗啓牖以助戶明也夫一經之說猶日明也助以傳書猶窗牖也百家之言令人曉明非徒窗牖之開日光之照也是故日光照室內道術明胸中開戶內光坐高堂之上眇升樓臺窺四鄰之庭人之所願也閉戶幽坐向冥冥之內穿壙穴臥造黃泉之際人之所惡也夫閉心塞意不高瞻覽者死人之徒也哉孝武皇帝時燕王旦在明光宮欲入所臥處戶三盡自閉使侍者二十人開戶戶不開其後旦坐謀反自殺夫戶閉燕王旦死之狀也死者凶事也故以閉塞為占齊慶封不通六國大夫會而賦詩慶封不曉其後果有楚靈之禍也夫不開通於學者尸尚能行者也亡國之社屋其上柴其下者示絶於天地春秋薄社周以為城戒夫經藝傳書人當覽之猶社當通氣於天地也故人之不通覽者薄社之類也是故氣不通者彊壯之人死榮華之物枯東海之中可食之物雜糅非一以其大也夫水精氣渥盛故其生物也衆多奇異故夫大人之胸懷非一才高知大故其於道術無所不包學士同門高業之生衆共宗之何則知經指深曉師言多也夫古今之事百家之言其為深多也豈徒師門高業之生哉甘酒醴不酟飴蜜未為能知味也耕夫多殖嘉穀謂之上農夫其少者謂之下農夫學士之才農夫之力一也能多種穀謂之上農能博學問不謂之上儒是稱牛之服重不譽馬速也譽手毀足孰謂之慧矣縣道不通於野野路不達於邑騎馬乘舟者必不由也故血脈不通人以甚病夫不通者惡事也故其禍變致不善是故盜賊宿於穢草邪心生於無道無道者無道術也醫能治一病謂之巧能治百病謂之良是故良醫服百病之方治百人之疾大才懷百家之言故能治百族之亂扁鵲之衆方孰若巧之一伎子貢曰不得其門而入不見宗廟之美百官之富蓋以宗廟百官喻孔子道也孔子道美故譬以宗廟衆多非一故喻以百官由此言之道達廣博者孔子之徒也殷周之地極五千里荒服要服勤能牧之漢氏廓土牧萬里之外要荒之地褒衣博帶夫德不優者不能懷遠才不大者不能博見故多聞博識無頑鄙之訾深知道術無淺暗之毀也人好觀圖畫者圖上所畫古之列人也見列人之面孰與觀其言行置之空壁形容具存人不激勸者不見言行也古賢之遺文竹帛之所載粲然豈徒墻壁之畫哉空器在廚金銀塗飾其中無物益於饑人不顧也肴膳甘醢土釜之盛入者饗之古賢文之美善可甘非徒器中之物也讀觀有益非徒膳食有補也故器空無實饑者不顧胸虛無懷朝廷不御也劍伎之家鬭戰必勝者得曲城越女之學也兩敵相遭一巧一拙其必勝者有術之家也孔墨之業賢聖之書非徒曲城越女之功也成人之操益人之知非徒戰鬭必勝之策也故劍伎之術有必勝之名賢聖之書有必尊之聲縣邑之吏召諸治下將相問以政化曉慧之吏陳所聞見將相覺悟得以改政右文聖賢言行竹帛所傳練人之心聰人之知非徒縣邑之吏對向之語也禹益並治洪水禹主治水益主記異物海外山表無遠不至以所聞見作山海經非禹益不能行遠山海不造然則山海之造見物博也董仲舒睹重常之鳥劉子政曉二負之尸皆見山海經故能立二事之說使禹益行地不遠不能作山海經董劉不讀山海經不能定二疑實沉臺台子産博物故能言之龍見絳郊蔡墨曉占故能禦之父兄在千里之外且死遺教戒之書子弟賢者求索觀讀服臆不舍重先敬長謹慎之也不肖者輕慢佚忽無原察之意古聖先賢遺後人文字其重非徒父兄之書也或觀讀采取或棄捐不録二者之相高下也行路之人皆能論之況辨照然否者不能別之乎孔子病商瞿卜期日中孔子曰取書來比至日中何事乎聖人之好學也且死不休念在經書不以臨死之故棄忘道藝其為百世之聖師法祖修蓋不虛矣自孔子以下至漢之際有才能之稱者非有飽食終日無所用心也不說五經則讀書傳書傳文大難以備之卜卦占射凶吉皆文武之道昔有商瞿能占爻卦末有東方朔翼少君能達占射覆道雖小亦聖人之術也曾又不知人生稟五常之性好道樂學故辨於物今則不然飽食快飲慮深求臥腹為飯坑腸為酒囊是則物也倮蟲三百人為之長天地之性人為貴貴其識知也今閉暗脂塞無所好欲與三百倮蟲何以異而謂之為長而貴之乎諸夏之人所以貴於夷狄者以其通仁義之文知古今之學也如徒任其胸中之知以取衣食經歷年月白首沒齒終無曉知夷狄之次也觀夫蜘蛛之經絲以罔飛蟲也人之用作安能過之任胸中之知舞權利之詐以取富壽之樂無古今之學蜘蛛之類也含血之蟲無餓死之患皆能以知求索飲食也人不通者亦能自供仕官為吏亦得高官將相長吏猶吾大夫高子也安能別之隨時積功以命得官不曉古今以位為賢與文人異術安得識別通人俟以不次乎將相長吏不得若右扶風蔡伯偕鬱林太守張孟嘗東萊太守李季公之徒心自通明覽達古今故其敬通人也如見大賓燕昭為鄒衍擁篲彼獨受何性哉東成令董仲綬知為儒梟海內稱通故其接人能別奇偉是以鍾離産公以編戶之民受圭璧之敬知之明也故夫能知之也凡石生光氣不知之也金玉無潤色自武帝以至今朝數舉賢良令人射策甲乙之科若董仲舒唐子高谷子雲丁伯玉策既中實文說美善博覽膏腴之所生也使四者經徒能㨨筆徒能記疏不見古今之書安能建美善於聖王之庭乎孝明之時讀蘇武傳見武官名曰栘中監以問百官百官莫知夫倉頡之章小學之書文字備具至於無能對聖國之問者是皆美命隨牒之人多在官也木旁多文字且不能知其欲及若董仲舒之知重常劉子政之知二負難哉或曰通人之官蘭臺令史職校書定字比夫太史太祝職在文書無典民之用不可施設是以蘭臺之史班固賈逵楊終傅毅之徒名香文美委積不紲無大用於世曰此不繼周世通覽之人鄒衍之徒孫卿之輩受時王之寵尊顯於世董仲舒雖無鼎足之位知在公卿之上周監二代漢監周秦然則蘭臺之官國所監得失也以心如丸卵為體內藏眸子如豆為身光明令史雖微典國道藏通人所由進猶博士之官儒生所由興也委積不紲豈聖國微遇之哉殆以書未定而職未畢也
