body:
  text: 無形篇人稟元氣於天各受壽夭之命以立長短之形猶陶者用埴為簋廉廡冶者用銅為柈杅矣器形已成不可小大人體已定不可減增用氣為性性成命定體氣與形骸相抱生死與期節相須形不可變化命不可減加以陶冶言之人命短長可得論也或難曰陶者用埴為簋廉廡簋廉廡一成遂至毀敗不可復變若夫冶者用銅為柈杅柈杅雖已成器猶可復爍柈可得為尊尊不可為簋人稟氣於天雖各受壽夭之命立以形體如得善道神藥形可變化命可加增曰冶者變更成器須先以火燔爍乃可大小短長人冀延年欲比於銅器宜有若爐炭之化乃易形形易壽亦可增人何由變易其形便如火爍銅器乎禮曰水潦降不獻魚鱉何則雨水暴下蟲蛇變化化為魚鱉離本真暫變之蟲臣子謹慎故不敢獻人願身之變冀若蟲蛇之化乎夫蟲蛇未化者不若不化者蟲蛇未化人不食也化為魚鱉人則食之見食則壽命乃短非所冀也歲月推移氣變物類蝦蟆為鶉雀為蜄蛤人願身之變冀若鶉與蜄蛤魚鱉之類也人設捕蜄蛤得者食之雖身之不化壽命不得長非所冀也魯公牛哀寢疾七日變而成虎鯀殛羽山化為黃能願身變者冀若牛哀之為虎鯀之為能乎則夫虎能之壽不能過人天地之性人最為貴變人之形更為禽獸非所冀也凡可冀者以老翁變為嬰兒其次白髮復黑齒落復生身氣丁彊超乘不衰乃可貴也徒變其形壽命不延其何益哉且物之變隨氣若應政治有所象為非天所欲壽長之故變易其形也又非得神草珍藥食之而變化也人恆服藥固壽能增加本性益其身年也遭時變化非天之正氣人所受之真性也天地不變日月不易星辰不沒正也人受正氣故體不變時或男化為女女化為男由高岸為谷深谷為陵也應政為變為政變非常性也漢興老父授張良書已化為石是以石之精為漢興之瑞也猶河精為人持璧與秦使者秦亡之徵也蠶食桑老績而為繭繭又化而為蛾蛾有兩翼變去蠶形蠐螬化為復育復育轉而為蟬蟬生兩翼不類蠐螬凡諸命蠕蜚之類多變其形易其體至人獨不變者稟得正也生為嬰兒長為丈夫老為父翁從生至死未嘗變更者天性然也天性不變者不可令復變變者不可令不變若夫變者之壽不若不變者人欲變其形輒增益其年可也如徒變其形而年不增則蟬之類也何謂人願之龍之為蟲一存一亡一短一長龍之為性也變化斯須輒復非常由此言之人物也受不變之形形不可變更年不可增減傳稱高宗有桑榖之異悔過反政享福百年是虛也傳言宋景公出三善言熒惑卻三舍延年二十一載是又虛也又言秦繆公有明德上帝賜之十九年是又虛也稱赤松王喬好道為仙度世不死是又虛也假令人生立形謂之甲終老至死常守甲形如好道為仙未有使甲變為乙者也夫形不可變更年不可減增何則形氣性天也形為春氣為夏人以氣為壽形隨氣而動氣性不均則於體不同牛壽半馬馬壽半人然則牛馬之形與人異矣稟牛馬之形當自得牛馬之壽牛馬之不變為人則年壽亦短於人世稱高宗之徒不言其身形變異而徒言其增延年壽故有信矣形之血氣也猶囊之貯粟米也粟米一石囊之高大亦適一石如損益粟米囊亦增減人以氣為壽氣猶粟米形猶囊也增減其壽亦當增減其身形安得如故如以人形與囊異氣與粟米殊更以苞瓜喻之苞瓜之汁猶人之血也其肌猶肉也試令人損益苞瓜之汁令其形如故耐為之乎人不耐損益苞瓜之汁天安耐增減人之年人年不可增減高宗之徒誰益之者而云增加如言高宗之徒形體變易其年亦增乃可信也今言年增不言其體變未可信也何則人稟氣於天氣成而形立則命相須以至終死形不可變化年亦不可增加以何驗之人生能行死則僵仆死則氣滅形消而壞稟氣生人形不可得變其年安可增人生至老身變者髮與膚也人少則髮黑老則髮白白久則黃髮之變形非變也人少則膚白老則膚黑黑久則黯若有垢矣髮黃而膚為垢故禮曰黃耇無疆髮膚變異故人老壽遲死骨肉不可變更壽極則死矣五行之物可變改者唯土也埏以為馬變以為人是謂未入陶竈更火者也如使成器入竈更火牢堅不可復變今人以為天地所陶冶矣形已成定何可復更也圖仙人之形體生毛臂變為翼行於雲則年增矣千歲不死此虛圖也世有虛語亦有虛圖假使之然蟬蛾之類非真正人也海外三十五國有毛民羽民羽則翼矣毛羽之民土形所出非言為道身生毛羽也禹益見西王母不言有毛羽不死之民亦在外國不言有毛羽毛羽之民不言不死不死之民不言毛羽毛羽未可以效不死仙人之有翼安足以驗長壽乎
