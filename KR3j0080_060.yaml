body:
  text: 須頌篇古之帝王建鴻德者須鴻筆之臣褒頌紀載鴻德乃彰萬世乃聞問說書者欽明文思以下誰所言也曰篇家也篇家誰也孔子也然則孔子鴻筆之人也自衛反魯然後樂正雅頌各得其所也鴻筆之奮蓋斯時也或說尚書曰尚者上也上所為下所書也下者誰也曰臣子也然則臣子書上所為矣問儒者禮言制樂言作何也曰禮者上所制故曰制樂者下所作故曰作天下太平頌聲作方今天下太平矣頌詩樂聲可以作未儒者不知也故曰拘儒衛孔悝之鼎銘周臣勸行孝宣皇帝稱潁川太守黃霸有治狀賜金百斤漢臣勉政夫以人主頌稱臣子臣子當褒君父於義較矣虞氏天下太平夔歌舜德宣王惠周詩頌其行召伯述職周歌棠樹是故周頌三十一殷頌五魯頌四凡頌四十篇詩人所以嘉上也由此言之臣子當頌明矣儒者謂漢無聖帝治化未太平宣漢之篇論漢已有聖帝治已太平恢國之篇極論漢德非徒實然乃在百代之上表德頌功宣褒主上詩之頌言右臣之典也舍其家而觀他人之室忽其父而稱異人之翁未為德也漢今天下之家也先帝今上民臣之翁也夫曉主德而頌其美識國奇而恢其功孰與疑暗不能也孔子稱大哉堯之為君也唯天為大唯堯則之蕩蕩乎民無能名焉或年五十擊壤於塗或曰大哉堯之德也擊壤者曰吾日出而作日入而息鑿井而飲耕田而食堯何等力孔子及言大哉堯之德也者皆知堯者也涉聖世不知聖主是則盲者不能別青黃也知聖主不能頌是則喑者不能言是非也然則方今盲喑之儒與唐擊壤之民同一才矣夫孔子及唐人言大哉者知堯德蓋堯盛也擊壤之民云堯何等力是不知堯德也夜舉燈燭光曜所及可得度也日照天下遠近廣狹難得量也浮於淮濟皆知曲折入東海者不曉南北故夫廣大從橫難數極深揭厲難測漢德酆廣日光海外也知者知之不知者不知漢盛也漢家著書多上及殷周諸子並作皆論他事無褒頌之言論衡有之又詩頌國名周頌與杜撫班固所上漢頌相依類也宣帝之時畫圖漢列士或不在於畫上者子孫恥之何則父祖不賢故不畫圖也夫頌言非徒畫文也如千世之後讀經書不見漢美後世怪之故夫古之通經之臣紀主令功記於竹帛頌上令德刻於鼎銘文人涉世以此自勉漢德不及六代論者不德之故也地有丘汙故有高平或以钁鍤平而夷之為平地矣世見五帝三王為經書漢事不載則謂五三優於漢矣或以論為钁鍤損三五少豐滿漢家之下豈徒並為平哉漢將為丘五三轉為汙矣湖池非一廣狹同也樹竿測之深淺可度漢與百代俱為主也實而論之優劣可見故不樹長竿不知深淺之度無論衡之論不知優劣之實漢在百代之末上與百代料德湖池相與比也無鴻筆之論不免庸庸之名論者好稱古而毀今恐漢將在百代之下豈徒同哉諡者行之跡也諡之美者成宣也惡者靈厲也成湯遭旱周宣亦然然而成湯加成宣王言宣無妄之災不能虧政臣子纍諡不失實也由斯以論堯堯亦美諡也時亦有洪水百姓不安猶言堯者得實考也夫一字之諡尚猶明主況千言之論萬文之頌哉船車載人孰與其徒多也素車朴船孰與加漆采畫也然則鴻筆之人國之船車采畫也農無彊夫穀粟不登國無彊文德暗不彰漢德不休亂在百代之間彊筆之儒不著載也高祖以來著書者不講論漢司馬長卿為封禪書文約不具司馬子長紀黃帝以至孝武楊子雲録宣帝以至哀平陳平仲紀光武班孟堅頌孝明漢家功德頗可觀見今上即命未有褒載論衡之人為此畢精故有齊世宣漢恢國驗符龍無雲雨不能參天鴻筆之人國之雲雨也載國德於傳書之上宣昭名於萬世之後厥高非徒參天也城墻之土平地之壤也人加築蹈之力樹立臨池國之功德崇於城墻文人之筆徑於築蹈聖主德盛功立若不褒頌紀載奚得傳馳流去無疆乎人有高行或譽得其實或欲稱之不能言或謂不善不肯陳一斷此三者孰者為賢五三之際於斯為盛孝明之時衆瑞並至百官臣子不為少矣唯班固之徒稱頌國德可謂譽得其實矣頌文譎以奇彰漢德於百代使帝名如日月孰與不能言言之不美善哉秦始皇東南遊升會稽山李斯刻石紀頌帝德至琅琊亦然秦無道之國刻石文世觀讀之者見堯舜之美由此言之須頌明矣當今非無李斯之才也無從升會稽歷琅琊之階也紘歌為妙異之曲坐者不曰善紘歌之人必怠不精何則妙異難為觀者不知善也聖國揚妙異之政衆臣不頌將順其美安得所施哉今方技之書在竹帛無主名所從生出見者忽然不御服也如題曰甲甲某子之方若言已驗嘗試人爭刻寫以為珍祕上書於國奏記於郡譽薦士吏稱術行能章下記出士吏賢妙何則章表其行記明其才也國德溢熾莫有宣褒使聖國大漢有庸庸之名咎在俗儒不實論也古今聖王不絶則其符瑞亦宜纍屬符瑞之出不同於前或時已有世無以知故有講瑞俗儒好長古而短今言瑞則渥前而薄後是應實而定之漢不為少漢有實事儒者不稱古有虛美誠心然之信久遠之僞忽近今之實斯蓋三增九虛所以成也能聖實聖所以興也儒者稱聖過實稽合於漢漢不能及非不能及儒者之說使難及也實而論之漢更難及穀熟歲平聖王因緣以立功化故治期之篇為漢激發治有期亂有時能以亂為治者優優者有之建初孟年無妄氣至聖世之期也皇帝敦德救備其災故順鼓明雩為漢應變是故災變之至或在聖世時旱禍湛為漢論災是故春秋為漢制法論衡為漢平說從門應庭聽堂室之言什而失九如升堂窺室百不失一論衡之人在古荒流之地其遠非徒門庭也日刺徑千里人不謂之廣者遠也望夜甚雨月光不暗人不睹曜者隱也聖者垂日月之明處在中州隱於百里遙聞傳授不實形耀不實難論得詔書到計吏至乃聞聖政是以褒功失丘山之積頌德遺膏腴之美使至臺閣之下蹈班賈之跡論功德之實不失毫釐之微武王封比干之墓孔子顯三纍之行大漢之德非直比干三纍也道立國表路出其下望國表者昭然知路漢德明著莫立邦表之言故浩廣之德未光於世也
