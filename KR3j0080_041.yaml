body:
  text: 寒溫篇説寒溫者曰人君喜則溫怒則寒何則喜怒發於胸中然後行出於外外成賞罰賞罰喜怒之效故寒溫渥盛凋物傷人夫寒溫之代至也在數日之間人君未必有喜怒之氣發胸中然後渥盛於外見外寒溫則知胸中之氣也當人君喜怒之時胸中之氣未必更寒溫也胸中之氣何以異於境內之氣胸中之氣不為喜怒變境內寒溫何所生起六國之時秦漢之際諸侯相伐兵革滿道國有相攻之怒將有相勝之志夫有相殺之氣當時天下未必常寒也太平之世唐虞之時政得民安人君常喜絃歌鼓舞比屋而有當時天下未必常溫也豈喜怒之氣為小發不為大動邪何其不與行事相中得也夫近水則寒近火則溫遠之漸微何則氣之所加遠近有差也成事火位在南水位在北北邊則寒南極則熱火之在爐水之在溝氣之在軀其實一也當人君喜怒之時寒溫之氣閨門宜甚境外宜微今案寒溫外內均等殆非人君喜怒之所致世儒説稱妄處之也王者之變在天下諸侯之變在境內卿大夫之變在其位庶人之變在其家夫家人之能致變則喜怒亦能致氣父子相怒夫妻相督若當怒反喜縱過飾非一室之中宜有寒溫由此言之變非喜怒所生明矣或曰以類相招致也喜者和溫和溫賞賜陽道施豫陽氣溫故溫氣應之怒者慍恚慍恚誅殺陰道肅殺陰氣寒故寒氣應之虎嘯而谷風至龍興而景雲起同氣共類動相招致故曰以形逐影以龍致雨雨應龍而來影應形而去天地之性自然之道也秋冬斷刑小獄微原大辟盛寒寒隨刑至相招審矣夫比寒溫於風雲齊喜怒於龍虎同氣共類動相招致可矣虎嘯之時風從谷中起龍興之時雲起百里內他谷異境無有風雲今寒溫之變並時皆然百里用刑千里皆寒殆非其驗齊魯接境賞罰同時設齊賞魯罰所致宜殊當時可齊國溫魯地寒乎案前世用刑者蚩尤亡秦甚矣蚩尤之民湎湎紛紛亡秦之路赤衣比肩當時天下未必常寒也帝都之市屠殺牛羊日以百數刑人殺牲皆有賊心帝都之市氣不能寒或曰人貴於物唯人動氣夫用刑者動氣乎用受刑者為變也如用刑者刑人殺禽同一心也如用受刑者人禽皆物也俱為萬物百賤不能當一貴乎或曰唯人君動氣衆庶不能夫氣感必須人君世何稱於鄒衍鄒衍匹夫一人感氣世又然之刑一人而氣輒寒生一人而氣輒溫乎赦令四下萬刑並除當時歲月之氣不溫往年萬戶失火熛焱參天河決千里四望無垠火與溫氣同水與寒氣類失火河決之時不寒不溫然則寒溫之至殆非政治所致然而寒溫之至遭與賞罰同時變復之家因緣名之矣春溫夏暑秋涼冬寒人君無事四時自然夫四時非政所為而謂寒溫獨應政治正月之始正月之後立春之際百刑皆斷囹圄空虛然而一寒一溫當其寒也何刑所斷當其溫也何賞所施由此言之寒溫天地節氣非人所為明矣人有寒溫之病非操行之所及也遭風逢氣身生寒溫變操易行寒溫不除夫身近而猶不能變除其疾國邑遠矣安能調和其氣人中於寒飲藥行解所苦稍衰轉為溫疾吞發汗之丸而應愈燕有寒谷不生五穀鄒衍吹律寒谷可種燕人種黍其中號曰黍谷如審有之寒溫之災復以吹律之事調和其氣變政易行何能滅除是故寒溫之疾非藥不愈黍谷之氣非律不調堯遭洪水使禹治之寒溫與堯之洪水同一實也堯不變政易行知夫洪水非政行所致洪水非政行所致亦知寒溫非政治所招或難曰洪範庶徵曰急恆寒若舒恆燠若若順燠溫恆常也人君急則常寒順之舒則常溫順之寒溫應急舒謂之非政如何夫豈謂急不寒舒不溫哉人君急舒而寒溫遞至偶適自然若故相應猶卜之得兆筮之得數也人謂天地應令問其實適然夫寒溫之應急舒猶兆數之應令問也外若相應其實偶然何以驗之夫天道自然自然無為二令參偶遭適逢會人事始作天氣已有故曰道也使應政事是有為非自然也易京氏布六十四卦於一歲中六日七分一卦用事卦有陰陽氣有升降陽升則溫陰升則寒由此言之寒溫隨卦而至不應政治也案易無妄之應水旱之至自有期節百災萬變殆同一曲變復之家疑且失實何以為疑夫大人與天地合德先天而天不違後天而奉天時洪範曰急恆寒若舒恆燠若如洪範之言天氣隨人易徙當先天而天不違耳何故復言後天而奉天時乎後者天已寒溫於前而人賞罰於後也由此言之人言與尚書不合一疑也京氏占寒溫以陰陽升降變復之家以刑賞喜怒兩家乖違二疑也民間占寒溫今日寒而明日溫朝有繁霜夕有列光旦雨氣溫旦暘氣寒夫雨者陰暘者陽也寒者陰而溫者陽也旦暘反寒暘旦雨反溫不以類相應三疑也三疑不定自然之説亦未立也
