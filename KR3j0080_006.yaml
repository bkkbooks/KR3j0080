body:
  text: 命義篇墨家之論以為人死無命儒家之議以為人死有命言有命者見子夏言死生有命富貴在天言無命者聞歷陽之都一宿沉而為湖秦將白起坑趙降卒於長平之下四十萬衆同時皆死春秋之時敗績之軍死者蔽草尸且萬數飢饉之歲餓者滿道溫氣疫癘千戶滅門如必有命何其秦齊同也言有命者曰夫天下之大人民之衆一歷陽之都一長平之坑同命俱死未可怪也命當溺死故相聚於歷陽命當壓死故相積於長平猶高祖初起相工入豐沛之邦多封侯之人矣未必老少男女俱貴而有相也卓躒時見往往皆然而歷陽之都男女俱沒長平之坑老少並陷萬數之中必有長命未當死之人遭時衰微兵革並起不得終其壽人命有長短時有盛衰衰則疾病被災蒙禍之驗也宋衛陳鄭同日並災四國之民必有祿盛未當衰之人然而俱災國禍陵之也故國命勝人命壽命勝祿命人有壽夭之相亦有貧富貴賤之法俱見於體故壽命修短皆稟於天骨法善惡皆見於體命當夭折雖稟異行終不得長祿當貧賤雖有善性終不得遂項羽且死顧謂其徒曰吾敗乃命非用兵之過此言實也實者項羽用兵過於高祖高祖之起有天命焉國命繫於衆星列宿吉凶國有禍福衆星推移人有盛衰人之有吉凶猶歲之有豐耗命有衰盛物有貴賤一歲之中一貴一賤一壽之間一衰一盛物之貴賤不在豐耗人之衰盛不在賢愚子夏曰死生有命富貴在天而不曰死生在天富貴有命者何則死生者無象在天以性為主稟得堅強之性則氣渥厚而體堅強堅強則壽命長壽命長則不夭死稟性軟弱者氣少泊而性羸窳羸窳則壽命短短則蚤死故言有命命則性也至於富貴所稟猶性所稟之氣得衆星之精衆星在天天有其象得富貴象則富貴得貧賤象則貧賤故曰在天在天如何天有百官有衆星天施氣而衆星布精天所施氣衆星之氣在其中矣人稟氣而生含氣而長得貴則貴得賤則賤貴或秩有高下富或資有多少皆星位尊卑小大之所授也故天有百官天有衆星地有萬民五帝三王之精天有王梁造父人亦有之稟受其氣故巧於御傳曰説命有三一曰正命二曰隨命三曰遭命正命謂本稟之自得吉也性然骨善故不假操行以求福而吉自至故曰正命隨命者戮力操行而吉福至縱情施欲而凶禍到故曰隨命遭命者行善得惡非所冀望逢遭於外而得凶禍故曰遭命凡人受命在父母施氣之時已得吉凶矣夫性與命異或性善而命凶或性惡而命吉操行善惡者性也禍福吉凶者命也或行善而得禍是性善而命凶或行惡而得福是性惡而命吉也性自有善惡命自有吉凶使命吉之人雖不行善未必無福凶命之人雖勉操行未必無禍孟子曰求之有道得之有命性善乃能求之命善乃能得之性善命凶求之不能得也行惡者禍隨而至而盜跖莊蹻橫行天下聚黨數千攻奪人物斷斬人身無道甚矣宜遇其禍乃以壽終夫如是隨命之説安所驗乎遭命者行善於內遭凶於外也若顏淵伯牛之徒如何遭凶顏淵伯牛行善者也當得隨命福祐隨至何故遭凶顏淵困於學以才自殺伯牛空居而遭惡疾及屈平伍員之徒盡忠輔上竭王臣之節而楚放其身吳烹其尸行善當得隨命之福乃觸遭命之禍何哉言隨命則無遭命言遭命則無隨命儒者三命之説竟何所定且命在初生骨表著見今言隨操行而至此命在末不在本也則富貴貧賤皆在初稟之時不在長大之後隨操行而至也正命者至百而死隨命者五十而死遭命者初稟氣時遭凶惡也謂妊娠之時遭得惡物也或遭雷雨之變長大夭死此謂三命亦有三性有正有隨有遭正者稟五常之性也隨者隨父母之性也遭者遭得惡物象之故也故妊婦食兔子生缺脣月令曰是月也雷將發聲有不戒其容止者生子不備必有大凶瘖聾跛盲氣遭胎傷故受性狂悖羊舌似我初生之時聲似豺狼長大性惡被禍而死在母身時遭受此性丹朱商均之類是也性命在本故禮有胎教之法子在身時席不正不坐割不正不食非正色目不視非正聲耳不聽及長置以賢師良傅教君臣父子之道賢不肖在此時矣受氣時母不謹慎心妄慮邪則子長大狂悖不善形體醜惡素女對黃帝陳五女之法非徒傷父母之身乃又賊男女之性人有命有祿有遭遇有幸偶命者貧富貴賤也祿者盛衰興廢也以命當富貴遭當盛之祿常安不危以命當貧賤遇當衰之祿則禍殃乃至常苦不樂遭者遭逢非常之變若成湯囚夏臺文王厄牖里矣以聖明之德而有囚厄之變可謂遭矣變雖甚大命善祿盛變不為害故稱遭逢之禍晏子所遭可謂大矣直兵指胸曲刃加頸蹈死亡之地當劍戟之鋒執死得生還命善祿盛遭逢之禍不能害也歷陽之都長平之坑其中必有命善祿盛之人一宿同填而死遭逢之禍大命善祿盛不能卻也譬猶水火相更也水盛勝火火盛勝水遇者遇其主而用也雖有善命盛祿不遇知己之主不得效驗幸者謂所遭觸得善惡也獲罪得脫幸也無罪見拘不幸也執拘未久蒙令得出命善祿盛夭災之禍不能傷也偶者謂事君有偶也以道事君君善其言遂用其身偶也行與主乖退而遠不偶也退遠未久上官録召命善祿盛不偶之害不能留也故夫遭遇幸偶或與命祿并或與命祿離遭遇幸偶遂以成完遭遇不幸偶遂以敗傷是與命祿并者也中不遂成善轉為惡若是與命祿離者也故人之在世有吉凶之性命有盛衰之禍福重以遭遇幸偶之逢獲從生死而卒其善惡之行得其胸中之志希矣
