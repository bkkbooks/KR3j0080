body:
  text: 佚文篇孝武皇帝封弟為魯恭王恭王壞孔子宅以為宮得佚尚書百篇禮三百春秋三十篇論語二十一篇聞紘歌之聲懼復封塗上言武帝武帝遣吏發取古經論語此時皆出經傳也而有聞紘歌之聲文當興於漢喜樂得闓之祥也當傳於漢寢藏墻壁之中恭王闓之聖王感動紘歌之象此則古文不當掩漢俟以為符也孝成皇帝讀百篇尚書博士郎吏莫能曉知徵天下能為尚書者東海張霸通左氏春秋案百篇序以左氏訓詁造作百二篇具成奏上成帝出祕尚書以考校之無一字相應者成帝下霸於吏吏當器辜大不謹敬成帝奇霸之才赦其辜亦不滅其經故百二尚書傳在民間孔子曰才難能推精思作經百篇才高卓遹希有之人也成帝赦之多其文也雖姦非實次序篇句依倚事類有似真是故不燒滅之䟽一櫝相遺以書書十數札奏記長吏文成可觀讀之滿意百不能一張霸推精思至於百篇漢世寡類成帝赦之不亦宜乎楊子山為郡上計吏見三府為哀牢傳不能成歸郡作上孝明奇之徵在蘭臺夫以三府掾史叢積成才不能成一篇子山成之上覽其文子山之傳豈必審是傳聞依為之有狀會三府之士終不能為子山為之斯須不難成帝赦張霸豈不有以哉孝武之時詔百官對策董仲舒策文最善王莽時使郎吏上奏劉子駿章尤美美善不空才高知深之驗也易曰聖人之情見於辭文辭美惡足以觀才永平中神雀群集孝明詔上神爵頌百官頌上文皆比瓦石唯班固賈逵傅毅楊終侯諷五頌金玉孝明覽焉夫以百官之眾郎吏非一唯五人文善非奇而何孝武善子虛之賦徵司馬長卿孝成玩弄眾書之多善楊子雲出入遊獵子雲乘從使長卿桓君山子雲作吏書所不能盈牘文所不能成句則武帝何貪成帝何欲故曰玩楊子雲之篇樂於居千石之官挾桓君山之書富於積猗頓之財韓非之書傳在秦庭始皇歎曰獨不得與此人同時陸賈新語每奏一篇高祖左右稱曰萬歲夫嘆思其人與喜稱萬歲豈可空為哉誠見其美懽氣發於內也候氣變者於天不於地天文明也衣裳在身文著於衣不在於裳衣法天也察掌理者在左不觀右左文明也占在右不觀左右文明也易曰大人虎變其文炳君子豹變其文蔚又曰觀乎天文觀乎人文此言天人以文為觀大人君子以文為操也高祖在母身之時息於澤陂蛟龍在上龍觩炫燿及起楚望漢軍氣成五采將入咸陽五星聚東井星有五色天或者憎秦滅其文章欲漢興之故先受命以文為瑞也惡人操意前後乖違始皇前歎韓非之書後惑李斯之議燔五經之文設挾書之律五經之儒抱經隱匿伏生之徒竄藏山中殄賢聖之文厥辜深重嗣不及孫李斯創議身伏五刑漢興易亡秦之軌削李斯之跡高祖始令陸賈造書未興五經惠景以至元成經書並修漢朝郁郁厥語所聞孰與亡秦王莽無道漢軍雲起臺閣廢頓文書棄散光武中興修存未詳孝明世好文人並徵蘭臺之官文雄會聚今上即命詔求亡失購募以金安得不有好文之聲唐虞既遠所在書散殷周頗近諸子存焉漢興以來傳文未遠以所聞見伍唐虞而什殷周煥炳郁郁莫盛於斯天晏暘者星辰曉爛人性奇者掌文藻炳漢今為盛故文繁湊也孔子曰文王既歿文不在茲乎文王之文傳在孔子孔子為漢制文傳在漢也受天之文文人宜遵五經六藝為文諸子傳書為文造論著說為文上書奏記為文文德之操為文立五文在世皆當賢也造論著說之文尤宜勞焉何則發胸中之思論世俗之事非徒諷古經續故文也論發胸臆文成手中非說經藝之人所能為也周秦之際諸子並作皆論他事不頌主上無益於國無補於化造論之人頌上恢國國業傳在千載主德參貳日月非適諸子書傳所能並也上書陳便宜奏記薦吏士一則為身二則為人繁文麗辭無上書文德之操治身完行徇利為私無為主者夫如是五文之中論者之文多矣則可尊明矣孔子稱周曰唐虞之際於斯為盛周之德其可謂至德已矣孔子周之文人也設生漢世亦稱漢之至德矣趙他王南越倍主滅使不從漢制箕踞椎髻沉溺夷俗陸賈說以漢德懼以帝威心覺醒悟蹶然起坐世儒之愚有趙他之惑鴻文之人陳陸賈之說觀見之者將有蹶然起坐趙他之悟漢氏浩爛不有殊卓之聲文人之休國之符也望豐屋知名家睹喬木知舊都鴻文在國聖世之驗也孟子相人以眸子焉心清則眸子瞭瞭者目文瞭也夫候國占人同一實也國君聖而文人聚人心惠而目多采蹂蹈文錦於泥塗之中聞見之者莫不痛心知文錦之可惜不知文人之當尊不通類也夫文人文章豈徒調墨弄筆為美麗之觀哉載人之行傳人之名也善人願載思勉為善邪人惡載力自禁裁然則文人之筆勸善懲惡也謚法所以章善即以著惡也加一字之謚人猶勸懲聞知之者莫不自勉況極筆墨之力定善惡之實言行畢載文以千數傳流於世成為丹青故可尊也楊子雲作法言蜀富賈人齎錢十萬願載於書子雲不聽曰夫富無仁義之行猶圈中之鹿欄中之牛也安得妄載班叔皮續太史公書載鄉里人以為惡戒邪人枉道繩墨所彈安得避諱是故子雲不為財勸叔皮不為恩撓文人之筆獨已公矣賢聖定意於筆筆集成文文具情顯後人觀之見以正邪安且妄記足蹈於地跡有好醜文集於札志有善惡故夫占跡以睹足觀文以知情詩三百一言以蔽之曰思無邪論衡篇以十數亦一言也曰疾虛妄
