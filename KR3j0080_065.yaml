body:
  text: 訂鬼篇凡天地之間有鬼非人死精神為之也皆人思念存想之所致也致之何由由於疾病人病則憂懼憂懼則鬼出凡人不病則不畏懼故得病寢衽畏懼鬼至畏懼則存想存想則目虛見何以效之傳曰伯樂學相馬顧玩所見無非馬者宋之庖丁學解牛三年不見生牛所見皆死牛也二者用精至矣思念存想自見異物也人病見鬼猶伯樂之見馬庖丁之見牛也伯樂庖丁所見非馬與牛則亦知夫病者所見非鬼也病者困劇身體痛則謂鬼持箠杖驅擊之若見鬼把椎鎖繩纆立守其旁病痛恐懼妄見之也初疾畏驚見鬼之來疾困恐死見鬼之怒身自疾痛見鬼之擊皆存想虛致未必有其實也夫精念存想或泄於目或泄於口或泄於耳泄於目目見其形泄於耳耳聞其聲泄於口口言其事晝日則鬼見暮臥則夢聞獨臥空室之中若有所畏懼則夢見夫人據案其身矣夫覺見臥聞俱用精神畏懼存想同一實也一曰人之見鬼目光與臥亂也人之晝也氣倦精盡夜則欲臥臥而目光反反而精神見人物之象矣人病亦氣倦精盡目雖不臥光已亂於臥也故亦見人物象病者之見也若臥若否與夢相似當其見也其人不自知覺與夢故其見物不能知其鬼與人精盡氣倦之效也何以驗之以狂者見鬼也狂癡獨語不與善人相得者病困精亂也夫病且死之時亦與狂等臥病及狂三者皆精衰倦目光反照故皆獨見人物之象焉一曰鬼者人所見得病之氣也氣不和者中人中人為鬼其氣象人形而見故病篤者氣盛氣盛則象人而至至則病者見其象矣假令得病山林之中其見鬼則見山林之精人或病越地者病見越人坐其側由此言之灌夫竇嬰之徒或時氣之形象也凡天地之間氣皆統於天天文垂象於上其氣降而生物氣和者養生不和者傷害本有象於天則其降下有形於地矣故鬼之見也象氣為之也衆星之體為人與鳥獸故其病人則見人與鳥獸之形一曰鬼者老物精也夫物之老者其精為人亦有未老性能變化象人之形人之受氣有與物同精者則其物與之交及病精氣衰劣也則來犯陵之矣何以效之成事俗間與物交者見鬼之來也夫病者所見之鬼與彼病物何以異人病見鬼來象其墓中死人來迎呼之者宅中之六畜也及見他鬼非是所素知者他家若草野之中物為之也一曰鬼者本生於人時不成人變化而去天地之性本有此化非道術之家所能論辨與人相觸犯者病病人命當死死者不離人何以明之禮曰顓頊氏有三子生而亡去為疫鬼一居江水是為虐鬼一居若水是為魍魎鬼一居人宮室區隅漚庫善驚人小兒前顓頊之世生子必多若顓頊之鬼神以百數也諸鬼神有形體法能立樹與人相見者皆生於善人得善人之氣故能似類善人之形能與善人相害陰陽浮游之類若雲煙之氣不能為也一曰鬼者甲乙之神也甲乙者天之別氣也其形象人人病且死甲乙之神至矣假令甲乙之日病則死見庚辛之神矣何則甲乙鬼庚辛報甲乙故病人且死殺鬼之至者庚辛之神也何以效之以甲乙日病者其死生之期常在庚辛之日此非論者所以為實也天道難知鬼神暗昧故具載列令世察之也一曰鬼者物也與人無異天地之間有鬼之物常在四邊之外時往來中國與人雜廁凶惡之類也故人病且死者乃見之天地生物也有人如鳥獸及其生凶物亦有似人象鳥獸者故凶禍之家或見蜚尸或見走凶或見人形三者皆鬼也或謂之鬼或謂之凶或謂之魅或謂之魑皆生存實有非虛無象類之也何以明之成事俗間家人且凶見流光集其室或見其形若鳥之狀時流人堂室察其不謂若鳥獸矣夫物有形則能食能食則便利便利有驗則形體有實矣左氏春秋曰投之四裔以禦魑魅山海經曰北方有鬼國說螭者謂之龍物也而魅與龍相連魅則龍之類矣又言國人物之黨也山海經又曰滄海之中有度朔之山上有大桃木其屈蟠三千里其枝間東北曰鬼門萬鬼所出入也上有二神人一曰神荼一曰鬱壘主閲領萬鬼惡害之鬼執以葦索而以食虎於是黃帝乃作禮以時驅之立大桃人門戶畫神荼鬱壘與虎懸葦索以禦凶魅有形故執以食虎案可食之物無空虛者其物也性與人殊時見時匿與龍不常見無以異也一曰人且吉凶妖祥先見人之且死見百怪鬼在百怪之中故妖怪之動象人之形或象人之聲為應故其妖動不離人形天地之間妖怪非一言有妖聲有妖文有妖或妖氣象人之形或人含氣為妖象人之形諸所見鬼是也人含氣為妖巫之類是也是以實巫之辭無所因據其吉凶自從口出若童之謠矣童謠口自言巫辭意自出口自言意自出則其為人與聲氣自立音聲自發同一實也世稱紂之時夜郊鬼哭及倉頡作書鬼夜哭氣能象人聲而哭則亦能象人形而見則人以為鬼矣鬼之見也人之妖也天地之間禍福之至皆有兆象有漸不卒然有象不猥來天地之道人將亡凶亦出國將亡妖亦見猶人且吉吉祥至國且昌昌瑞到矣故夫瑞應妖祥其實一也而世獨謂鬼者不在妖祥之中謂鬼猶神而能害人不通妖祥之道不睹物氣之變也國將亡妖見其亡非妖也人將死鬼來其死非鬼也亡國者兵也殺人者病也何以明之齊襄公將為賊所殺游于姑棼遂田于貝丘見大豕從者曰公子彭生也公怒曰彭生敢見引弓射之豕人立而啼公懼墜于車傷足喪履而為賊殺之夫殺襄公者賊也先見大豕於路則襄公且死之妖也人謂之彭生者有似彭生之狀也世人皆知殺襄公者非豕而獨謂鬼能殺人一惑也天地之氣為妖者太陽之氣也妖與毒同氣中傷人者謂之毒氣變化者謂之妖世謂童謠熒惑使之彼言有所見也熒惑火星火有毒熒故當熒惑守宿國有禍敗火氣恍惚故妖象存亡龍陽物也故時變化鬼陽氣也時藏時見陽氣赤故世人盡見鬼其色純朱蜚凶陽也陽火也故蜚凶之類為火光火熱焦物故止集樹木枝葉枯死鴻範五行二曰火五事二曰言言火同氣故童謠詩歌為妖言言出文成故世有文書之怪世謂童子為陽故妖言出於小童童巫含陽故大雩之祭舞童暴巫雩祭之禮倍陰合陽故猶日食陰勝攻社之陰也日食陰勝故攻陰之類天旱陽勝故愁陽之黨巫為陽黨故魯僖遭旱議欲焚巫巫含陽氣以故陽地之民多為巫巫黨於鬼故巫者為鬼巫鬼巫比於童謠故巫之審者能處吉凶吉凶能處吉凶之徒也故申生之妖見於巫巫含陽能見為妖也申生為妖則知杜伯莊子義厲鬼之徒皆妖也杜伯之屬為妖則其弓矢杖楫皆妖毒也妖象人之形其毒象人之兵鬼毒同色故杜伯弓矢皆朱彤也毒象人之兵則其中人人輒死也中人微者即為腓病者不即時死何則腓者毒氣所加也妖或施其毒不見其體或見其形不施其毒或出其聲不成其言或明其言不知其音若夫申生見其體成其言者也杜伯之屬見其體施其毒者也詩妖童謠石言之屬明其言者也濮水琴聲紂郊鬼哭出其聲者也妖之見出也或且凶而豫見或凶至而因出因出則妖與毒俱行豫見妖出不能毒申生之見豫見之妖也杜伯莊子義厲鬼至因出之妖也周宣王燕簡公宋夜姑時當死故妖見毒因擊晉惠公身當獲命未死故妖直見而毒不射然則杜伯莊子義厲鬼之見周宣王燕簡夜姑且死之妖也申生之出晉惠公且見獲之妖也伯有之夢駟帶公孫段且卒之妖也老父結草魏顆且勝之祥亦或時杜回見獲之妖也蒼犬噬呂后呂后且死妖象犬形也魏其灌夫守武安武安且卒妖象魏其灌夫之面也故凡世間所謂妖祥所謂鬼神者皆太陽之氣為之也太陽之氣天氣也天能生人之體故能象人之容夫人之所以生者陰陽氣也陰氣主為骨肉陽氣主為精神人之生也陰陽氣具故骨肉堅精氣盛精氣為知骨肉為強故精神言談形體固守骨肉精神合錯相持故能常見而不滅亡也太陽之氣孤而無陰故徒能為象不能為形無骨肉有精氣故一見恍惚輒復滅亡也
