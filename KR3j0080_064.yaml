body:
  text: 紀妖篇衛靈公將之晉至濮水之上夜聞鼓新聲者説之使人問之左右皆報弗聞乃召師涓而告之曰有鼓新聲者使人問左右盡報弗聞其狀似鬼神子為我聽而寫之師涓曰諾因靜坐撫琴而寫之明日報曰臣得之矣然而未習也請更宿而習之靈公曰諾因復宿明日已習遂去之晉晉平公觴之於施夷之臺酒酣靈公起曰有新聲願請奏以示公平公曰善乃召師涓令坐師曠之旁援琴鼓之未終師曠撫而止之曰此亡國之聲不可遂也平公曰此何道出師曠曰此師延所作淫聲與紂為靡靡之樂也武王誅紂懸之白旄師延東走至濮水而自投故聞此聲者必於濮水之上先聞此聲者其國削不可遂也平公曰寡人所好者音也子其使遂之師涓鼓究之平公曰此所謂何聲也師曠曰此所謂清商公曰清商固最悲乎師曠曰不如清徵公曰清徵可得聞乎師曠曰不可古之得聽清徵者皆有德義之君也今吾君德薄不足以聽之平公曰寡人所好者音也願試聽之師曠不得已援琴而鼓之一奏之有玄鶴二八從南方來集於廊門之上危再奏之而列三奏之延頸而鳴舒翼而舞音中宮商之聲聲徹于天平公大悅坐者皆喜平公提觴而起為師曠壽反坐而問曰樂莫悲于清徵乎師曠曰不如清角平公曰清角可得聞乎師曠曰不可昔者黃帝合鬼神於西大山之上駕象輿六蛟龍畢方並轄蚩尤居前風伯進掃雨師灑道虎狼在前鬼神在後蟲蛇伏地白雲覆上大合鬼神乃作為清角今主君德薄不足以聽之聽之將恐有敗平公曰寡人老矣所好者音也願遂聽之師曠不得已而鼓之一奏之有雲從西北起再奏之大風至大雨隨之裂帷幕破俎豆隳廊瓦坐者散走平公恐懼伏于廊室之間晉國大旱赤地三年平公之身遂癃病是何謂也曰是非衛靈公國且削則晉平公且病若國且旱之妖也師曠曰先聞此聲者國削二國先聞之矣何以知新聲非師延所鼓也曰師延自投濮水形體腐於水中精氣消於泥塗安能復鼓琴屈原自沉於江屈原善著文師延善鼓琴如師延能鼓琴則屈原能復書矣楊子雲弔屈原屈原何不報屈原生時文無不作不能報子雲者死為泥塗手既朽無用書也屈原手朽無用書則師延指敗無用鼓琴矣孔子當泗水而葬泗水卻流世謂孔子神而能卻泗水孔子好教授猶師延之好鼓琴也師延能鼓琴於濮水之中孔子何為不能教授於泗水之側乎趙簡子病五日不知人大夫皆懼於是召進扁鵲扁鵲入視病出董安于問扁鵲扁鵲曰血脈治也而怪昔秦繆公嘗如此矣七日而悟悟之日告公孫支與子輿曰我之帝所甚樂吾所以久者適有學也帝告我晉國且大亂五世不安其後將霸未老而死霸者之子且令而國男女無別公孫支書而藏之秦策於是出晉獻公之亂文公之霸而襄公之敗秦師於崤而歸縱淫此之所謂今主君之病與之同不出三日病必間間必有言也居二日半簡子悟告大夫曰我之帝所甚樂與百神遊于鈞天廣樂九奏萬舞不類三代之樂其聲動人心有一熊欲援我帝命我射之中熊熊死有羆來我又射之中羆羆死帝甚喜賜我二笥皆有副吾見兒在帝側帝屬我一翟犬曰及而子之長也以賜之帝告我晉國且衰七世而亡嬴姓將大敗周人於范魁之西而亦不能有也今余將思虞舜之勳適余將以其胄女孟姚配而七世之孫董安于受言書而藏之以扁鵲言告簡子簡子賜扁鵲田四萬畝他日簡子出有人當道辟之不去從者將拘之當道者曰吾欲有謁於主君從者以聞簡子召之曰嘻吾有所見子晣也當道者曰屏左右願有謁簡子屏人當道者曰日者主君之病臣在帝側簡子曰然有之子見我何為當道者曰帝令主君射熊與羆皆死簡子曰是且何也當道者曰晉國且有大難主君首之帝令主君滅二卿夫熊羆皆其祖也簡子曰帝賜我二笥皆有副何也當道者曰主君之子將剋二國於翟皆子姓也簡子曰吾見兒在帝側帝屬我一翟犬曰及而子之長以賜之夫兒何説以賜翟犬當道者曰兒主君之子也翟犬代之先也主君之子且必有代及主君之後嗣且有革政而胡服并二國於翟簡子問其姓而延之以官當道者曰臣野人致帝命耳遂不見是何謂也曰是皆妖也其占皆如當道者言所見於帝前之事所見當道之人妖人也其後晉二卿范氏中行氏作亂簡子攻之中行昭子范文子敗出奔齊始簡子使姑布子卿相諸子莫吉至翟婦之子無恤以為貴簡子與語賢之簡子募諸子曰吾藏寶符於常山之上先得者賞諸子皆上山無所得無恤還曰已得符矣簡子問之無恤曰從常山上臨代代可取也簡子以為賢乃廢太子而立之簡子死無恤代是為襄子襄子既立誘殺代王而并其地又并知氏之地後取空同戎自簡子後七世至武靈王吳廣入其女娃嬴子孟姚其後武靈王遂取中山并胡地武靈王之十九年更為胡服國人化之皆如其言無不然者蓋妖祥見於兆審矣皆非實事吉凶之漸若天告之何以知天不實告之也以當道之人在帝側也夫在天帝之側皆貴神也致帝之命是天使者也人君之使車騎備具天帝之使單身當道非其狀也天官百二十與地之王者無以異也地之王者官屬備具法象天官稟取制度天地之官同則其使者亦宜鈞官同人異者未可然也何以知簡子所見帝非實帝也以夢占知之樓臺山陵官位之象也人夢上樓臺升山陵輒得官位實樓臺山陵非官位也則知簡子所夢見帝者非天帝也人臣夢見人君人君必不見又必不賜以人臣夢占之知帝賜二笥翟犬者非天帝也非天帝則其言與百鬼遊于鈞天非天也魯叔孫穆子夢天壓己者審然是天下至地也不至地則有樓臺之抗不得及己及己則樓臺宜壞樓臺不壞是天不至地不至地則不得壓己不得壓己則壓己者非天也則天之象也叔孫穆子所夢壓己之天非天則知趙簡子所遊之天非天也或曰人亦有直夢夢見甲明日則見甲矣夢見君明日則見君矣曰然人有直夢直夢皆象也其象直耳何以明之直夢者夢見甲夢見君明日見甲與君此直也如問甲與君甲與君則不見也甲與君不見所夢見甲與君者象類之也乃甲與君象類之則知簡子所見帝者象類帝也且人之夢也占者謂之魂行夢見帝是魂之上天也上天猶上山也夢上山足登山手引木然後能升升天無所緣何能得上天之去人以萬里數人之行日百里魂與體形俱尚不能疾況魂獨行安能速乎使魂行與形體等則簡子之上下天宜數歲乃悟七日輒覺期何疾也夫魂者精氣也精氣之行與雲煙等案雲煙之行不能疾使魂行若蜚鳥乎行不能疾人或夢蜚者用魂蜚也其蜚不能疾於鳥天地之氣尤疾速者飄風也飄風之發不能終一日使魂行若飄風乎則其速不過一日之行亦不能至天人夢上天一臥之頃也其覺或尚在天上未終下也若人夢行至雒陽覺因從雒陽悟矣魂神蜚馳何疾也疾則必非其狀必非其狀則其上天非實事也非實事則為妖祥矣夫當道之人簡子病見於帝側後見當道象人而言與相見帝側之時無以異也由此言之臥夢為陰候覺為陽占審矣趙襄子既立知伯益驕請地韓魏韓魏豫之請地於趙趙不豫知伯益怒遂率韓魏攻趙襄子襄子懼乃奔保晉陽原過從後至於王澤見三人自帶以上可見自帶以下不可見豫原過竹二節莫通曰為我以是遺趙無恤既至以告襄子襄子齊三日親自剖竹有赤書曰趙無恤余霍大山山陽侯天使也三月丙戌余將使汝反滅知氏汝亦祀我百邑余將賜汝林胡之地襄子再拜受三神之令是何謂也曰是蓋襄子且勝之祥也三國攻晉陽歲餘引汾水灌其城城不浸者三板襄子懼使相張孟談私於韓魏韓魏與合謀竟以三月丙戌之日反滅知氏共分其地蓋妖祥之氣象人之形稱霍大山之神猶夏庭之妖象龍稱褒之二君趙簡子之祥象人稱帝之使也何以知非霍大山之神也曰大山地之體猶人有骨節骨節安得神如大山有神宜象大山之形何則人謂鬼者死人之精其象如生人之形今大山廣長不與人同而其精神不異於人不異於人則鬼之類人鬼之類人則妖祥之氣也秦始皇帝三十六年熒惑守心有星墜下至地為石民或刻其石曰始皇死而地分始皇聞之令御史逐問莫服盡取石旁家人誅之因燔其石秋使者從關東夜過華陰平舒或有人持璧遮使者曰為我遺鎬池君因言曰今年祖龍死使者問之因忽不見置其璧去使者奉璧具以言聞始皇帝默然良久曰山鬼不過知一歲事乃言曰祖龍者人之先也使御府視璧乃二十八年行渡江所沉璧也明三十七年夢與海神戰如人狀是何謂也曰皆始皇且死之妖也始皇夢與海神戰恚怒入海候神射大魚自琅邪至勞成山不見至之罘山還見巨魚射殺一魚遂旁海西至平原津而病到沙丘而崩當星墜之時熒惑為妖故石旁家人刻書其石若或為之文曰始皇死或教之也猶世間童謠非童所為氣導之也凡妖之發或象人為鬼或為人象鬼而使其實一也晉公子重耳失國乏食於道從耕者乞飯耕者奉塊土以賜公子公子怒咎犯曰此吉祥天賜土地也其後公子得國復土如咎犯之言齊田單保即墨之城欲詐燕軍云天神下助我有一人前曰我可以為神乎田單卻走再拜事之竟以神下之言聞於燕軍燕軍信其有神又見牛若五采之文遂信畏懼軍破兵北田單卒勝復獲侵地此人象鬼之妖也使者過華陰人持璧遮道委璧而去妖鬼象人之形也夫沉璧於江欲求福也今還璧示不受物福不可得也璧者象前所沉之璧其實非也何以明之以鬼象人而見非實人也人見鬼象生存之人定問生存之人不與己相見妖氣象類人也妖氣象人之形則其所齎持之物非真物矣祖龍死謂始皇也祖人之本龍人君之象也人物類則其言禍亦放矣漢高皇帝以秦始皇崩之歲為泗上亭長送徒至驪山徒多道亡因縱所將徒遂行不還被酒夜經澤中令一人居前前者還報曰前有大蛇當道願還高祖醉曰壯士行何畏乃前拔劍擊斬蛇蛇遂分兩徑開行數里醉因臥高祖後人至蛇所有一老嫗夜哭之人曰嫗何為哭嫗曰人殺吾子人曰嫗子為何見殺嫗曰吾子白帝子也化為蛇當徑今者赤帝子斬之故哭人以嫗為妖言因欲笞之嫗因忽不見是何謂也曰是高祖初起威勝之祥也何以明之以嫗忽然不見也不見非人非人則鬼妖矣夫以嫗非人則知所斬之蛇非蛇也云白帝子何故為蛇夜而當道謂蛇白帝子高祖赤帝子白帝子為蛇赤帝子為人五帝皆天之神也子或為蛇或為人人與蛇異物而其為帝同神非天道也且蛇為白帝子則嫗為白帝后乎帝者之后前後宜備帝者之子官屬宜盛今一蛇死於徑一嫗哭於道云白帝子非實明矣夫非實則象象則妖也妖則所見之物皆非物也非物則氣也高祖所殺之蛇非蛇也則夫鄭厲公將入鄭之時邑中之蛇與邑外之蛇鬭者非蛇也厲公將入鄭妖氣象蛇而鬭也鄭國鬭蛇非蛇則知夏庭二龍為龍象為龍象則知鄭子産之時龍戰非龍也天道難知使非妖也使是亦妖也留侯張良椎秦始皇誤中副車始皇大怒索求張良張良變姓名亡匿下邳嘗間從容步遊下邳圯上有一老父衣褐至良所直墮其履圯下顧謂張良曰孺子下取履良愕然欲驅之以其老為強忍下取履因跪進履父以足受履笑去良大驚父去里所復還曰孺子可教矣後五日平明與我期此良怪之因跪曰諾五日平明良往父已先在怒曰與老人期後何也去後五日早會五日雞鳴復往父又已先在復怒曰後何也去後五日復早來五日良夜未半往有頃父來喜曰當如是矣出一篇書曰讀是則為帝者師後十年興十三年孺子見我濟北穀成山下黃石即我也遂去無他言弗復見旦日視其書乃太公兵法也良因異之常習讀之是何謂也曰是高祖將起張良為輔之祥也良居下邳任俠後十年陳涉等起沛公略地下邳良從遂為師將封為留侯後十三年從高祖過濟北果得穀成山下黃石取而葆祠之及留侯死并葬黃石蓋吉凶之象神矣天地之化巧矣使老父象黃石黃石象老父何其神邪問曰黃石審老父老父審黃石耶曰黃石不能為老父老父不能為黃石妖祥之氣見故驗也何以明之晉平公之時石言魏榆平公問於師曠曰石何故言對曰石不能言或憑依也不然民聽濫也夫石不能人言則亦不能人形矣石言與始皇時石墜東郡民刻之無異也刻為文言為辭辭之與文一實也民刻文氣發言民之與氣一性也夫石不能自刻則亦不能言不能言則亦不能為人矣太公兵法氣象之也何以知非實也以老父非人知書亦非太公之書也氣象生人之形則亦能象太公之書問曰氣無刀筆何以為文曰魯惠公夫人仲子生而有文在其掌曰為魯夫人晉唐叔虞文在其手曰虞魯成季友文在其手曰友三文之書性自然老父之書氣自成也性自然氣自成與夫童謠口自言無以異也當童之謠也不知所受口自言之口自言文自成或為之也推此以省太公釣得巨魚刳魚得書云呂尚封齊及武王得白魚喉下文曰以豫發蓋不虛矣因此復原河圖洛書言興衰存亡帝王際會審有其文矣皆妖祥之氣吉凶之端也
