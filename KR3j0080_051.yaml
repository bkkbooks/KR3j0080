body:
  text: 指瑞篇儒者說鳳皇騏驎為聖王來以為鳳皇騏驎仁聖禽也思慮深避害遠中國有道則來無道則隱稱鳳皇騏驎之仁知者欲以襃聖人也非聖人之德不能致鳳皇騏驎此言妄也夫鳳皇騏驎聖聖人亦聖聖人恓恓憂世鳳皇騏驎亦宜率教聖人游於世間鳳皇騏驎亦宜與鳥獸會何故遠去中國處於邊外豈聖人濁鳳皇騏驎清哉何其聖德俱而操不同也如以聖人者當隱乎十二聖宜隱如以聖者當見鳳驎亦宜見如以仁聖之禽思慮深避害遠則文王拘於羑里孔子厄於陳蔡非也文王孔子仁聖之人憂世憫民不圖利害故其有仁聖之知遭拘厄之患凡人操行能脩身正節不能禁人加非於己案人操行莫能過聖人聖人不能自免於厄而鳳驎獨能自全於世是鳥獸之操賢於聖人也且鳥獸之知不與人通何以能知國有道與無道也人同性類好惡均等尚不相知鳥獸與人異性何能知之人不能知鳥獸鳥獸亦不能知人兩不能相知鳥獸為愚於人何以反能知之儒者咸稱鳳皇之德欲以表明王之治反令人有不及鳥獸論事過情使實不著且鳳驎豈獨為聖王至哉孝宣皇帝之時鳳皇五至騏驎一至神雀黃龍甘露醴泉莫不畢見故有五鳳神雀甘露黃龍之紀使鳳驎審為聖王見則孝宣皇帝聖人也如孝宣帝非聖則鳳驎為賢來也為賢來則儒者稱鳳皇騏驎失其實也鳳皇騏驎為堯舜來亦為宣帝來矣夫如是為聖且賢也儒者說聖太隆則論鳳驎亦過其實春秋曰西狩獲死驎人以示孔子孔子曰孰為來哉孰為來哉反袂拭面泣涕沾襟儒者說之以為天以驎命孔子孔子不王之聖也夫驎為聖王來孔子自以不王而時王魯君無感驎之德怪其來而不知所為故曰孰為來哉孰為來哉知其不為治平而至為己道窮而來望絕心感故涕泣沾襟以孔子言孰為來哉知驎為聖王來也曰前孔子之時世儒已傳此說孔子聞此說而希見其物也見驎之至怪所為來實者驎至無所為來常有之物也行邁魯澤之中而魯國見其物遭獲之也孔子見驎之獲獲而又死則自比於驎自謂道絕不復行將為小人所徯獲也故孔子見驎而自泣者據其見得而死也非據其本所為來也然則驎之至也自與獸會聚也其死人殺之也使驎有知為聖王來時無聖王何為來乎思慮深避害遠何故為魯所獲殺乎夫以時無聖王而驎至知不為聖王來也為魯所獲殺知其避害不能遠也聖獸不能自免於難聖人亦不能自免於禍禍難之事聖者所不能避而云鳳驎思慮深避害遠妄也且鳳驎非生外國也中國有聖王乃來至也生於中國長於山林之間性廉見希人不得害也則謂之思慮深避害遠矣生與聖王同時行與治平相遇世間謂之聖王之瑞為聖來矣剝巢破卵鳳皇為之不翔焚林而畋漉池而漁龜龍為之不遊鳳皇龜龍之類也皆生中國與人相近巢剝卵破屏竄不翔林焚池漉伏匿不遊無遠去之文何以知其在外國也龜龍鳳皇同一類也希見不害謂在外國龜龍希見亦在外國矣孝宣皇帝之時鳳皇騏驎黃龍神雀皆至其至同時則其性行相似類則其生出宜同處矣龍不生於外國外國亦有龍鳳驎不生外國外國亦有鳳驎然則中國亦有未必外國之鳳驎也人見鳳驎希見則曰在外國見遇太平則曰為聖王來夫鳳皇騏驎之至也猶醴泉之出朱草之生也謂鳳皇在外國聞有道而來醴泉朱草何知而生於太平之時醴泉朱草和氣所生然則鳳皇騏驎亦和氣所生也和氣生聖人聖人生於衰世物生為瑞人生為聖同時俱然時其長大相逢遇矣衰世亦有和氣和氣時生聖人聖人生於衰世衰世亦時有鳳驎也孔子生於周之末世騏驎見於魯之西澤光武皇帝生於成哀之際鳳皇集於濟陽之地聖人聖物生於盛衰世聖王遭出聖物遭見見聖物猶吉命之人逢吉祥之類也其實相遇非相為出也夫鳳驎之來與白魚赤烏之至無以異也魚遭自躍王舟逢之火偶為烏王仰見之非魚聞武王之德而入其舟烏知周家當起集於王屋也謂鳳驎為聖王來是謂魚烏為武王至也王者受富貴之命故其動出見吉祥異物見則謂之瑞瑞有小大各以所見定德薄厚若夫白魚赤烏小物小安之兆也鳳皇騏驎大物太平之象也故孔子曰鳳鳥不至河不出圖吾已矣夫不見太平之象自知不遇太平之時矣且鳳皇騏驎何以為太平之象鳳皇騏驎仁聖之禽也仁聖之物至天下將為仁聖之行矣尚書大傳曰高宗祭成湯之廟有雉升鼎耳而鳴高宗問祖己祖己曰遠方君子殆有至者祖己見雉有似君子之行今從外來則曰遠方君子將有至者矣夫鳳皇騏驎猶雉也其來之象亦與雉同孝武皇帝西巡狩得白驎一角而五趾又有木枝出復合於本武帝議問群臣謁者終軍曰野禽并角明同本也眾枝內附示無外也如此瑞者外國宜有降者是若應殆且有解編髮削左衽襲冠帶而蒙化焉其後數月越地有降者匈奴名王亦將數千人來降竟如終軍之言終軍之言得瑞應之實矣推此以況白魚赤烏猶此類也魚水精白者殷之色也烏者孝鳥赤者周之應氣也先得白魚後得赤烏殷之統絕色移在周矣據魚烏之見以占武王則知周之必得天下也世見武王誅紂出遇魚烏則謂天用魚烏命使武王誅紂事相似類其實非也春秋之時鸜鵒來巢占者以為凶夫野鳥來巢魯國之都且為丘墟昭公之身且出奔也後昭公為季氏所攻出奔於齊死不歸魯賈誼為長沙太傅服鳥集舍發書占之云服鳥入室主人當去其後賈誼竟去野鳥雖殊其占不異夫鳳驎之來與野鳥之巢服鳥之集無以異也是鸜鵒之巢服鳥之集偶巢適集占者因其野澤之物巢集城宮之內則見魯國且凶傅舍人不吉之瑞矣非鸜鵒服鳥知二國禍將至而故為之巢集也王者以天下為家家人將有吉凶之事而吉凶之兆豫見於人知者占之則知吉凶將至非吉凶之物有知故為吉凶之人來也猶蓍龜之有兆數矣龜兆蓍數常有吉凶吉人卜筮與吉相遇凶人與凶相逢非蓍龜神靈知人吉凶出兆見數以告之也虛居卜筮前無過客猶得吉凶然則天地之間常有吉凶吉凶之物來至自當與吉凶之人相逢遇矣或言天使之所為也夫巨大之天使細小之物音語不通情指不達何能使物物亦不為天使其來神怪若天使之則謂天使矣夏后孔甲畋于首山天雨晦冥入于民家主人方乳或曰后來之子必大貴或曰不勝之子必有殃夫孔甲之入民室也偶遭雨而廕庇也非知民家將生子而其子必凶為之至也既至人占則有吉凶矣夫吉凶之物見於王朝若入民家猶孔甲遭雨入民室也孔甲不知其將生子為之故到謂鳳皇諸瑞有知應吉而至誤矣
