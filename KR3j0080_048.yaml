body:
  text: 遭虎篇變復之家謂虎食人者功曹為姦所致也其意以為功曹衆吏之率虎亦諸禽之雄也功曹為姦采漁於吏故虎食人以象其意夫虎食人人亦有殺虎謂虎食人功曹受取於吏如人食虎吏受於功曹也乎案世清廉之士百不能一居功曹之官皆有姦心私舊故可以幸苞苴賂遺小大皆有必謂虎應功曹是野中之虎常害人也夫虎出有時猶龍見有期也陰物以冬見陽蟲以夏出出應其氣氣動其類參伐以冬出心尾以夏見參伐則虎星心尾則龍象象出而物見氣至而類動天地之性也動於林澤之中遭虎搏噬之時稟性狂勃貪叨飢餓觸自來之人安能不食人之䈥力羸弱不適巧便不知故遇輒死使孟賁登山馮婦入林亦無此害也孔子行魯林中婦人哭甚哀使子貢問之何以哭之哀也曰去年虎食吾夫今年食吾子是以哭哀也子貢曰若此何不去也對曰吾善其政之不苛吏之不暴也子貢還報孔子孔子曰弟子識諸苛政暴吏甚於虎也夫虎害人古有之矣政不苛吏不暴德化之足以卻虎然而二歲比食二人林中獸不應善也為廉不應姦吏亦不應矣或曰虎應功曹之姦所謂不苛政者非功曹也婦人廉吏之部也雖有善政安耐化虎夫魯無功曹之官功曹之官相國是也魯相者殆非孔墨必三家也為相必無賢操以不賢居權位其惡必不廉也必以相國為姦令虎食人是則魯野之虎常食人也水中之毒不及陵上陵上之氣不入水中各以所近罹殃取禍是故漁者不死於山獵者不溺於淵好入山林窮幽測深涉虎窟寢虎搏噬之何以為變魯公牛哀病化為虎搏食其兄同變化者不以為怪入山林草澤見害於虎怪之非也蝮蛇悍猛亦能害人行山澤中中於蝮蛇應何官吏蜂蠆害人入毒氣害人水火害人人為蜂蠆所螫為毒氣所中為火所燔為水所溺又誰致之者苟謂禽獸乃應吏政行山林中麋鹿野豬牛象熊羆豺狼蜼蠼皆復殺人苟謂食人乃應為變䗢𧌡閩虻皆食人人身彊大故不至死倉卒之世穀食乏貴百姓飢餓自相啖食厥變甚於虎變復之家不處苛政且虎所食非獨人也含血之禽有形之獸虎皆食之食人謂應功曹之姦食他禽獸應何官吏夫虎毛蟲人倮蟲毛蟲飢食倮蟲何變之有四夷之外大人食小人虎之與蠻夷氣性一也平陸廣都虎所不由也山林草澤虎所生出也必以虎食人應功曹之姦是則平陸廣都之縣功曹常為賢山林草澤之邑功曹常伏誅也夫虎食人於野應功曹之姦虎時入邑行於民間功曹游於閭巷之中乎實說虎害人於野不應政其行都邑乃為怪夫虎山林之獸不狎之物也常在草野之中不為馴畜猶人家之有鼠也伏匿希出非可常見也命吉居安鼠不擾亂祿衰居危鼠為殃變夫虎亦然也邑縣吉安長吏無患虎匿不見長吏且危則虎入邑行於民間何則長吏光氣已消都邑之地與野均也推此以論虎所食人亦命時也命訖時衰光氣去身視肉猶尸也故虎食之天道偶會虎適食人長吏遭惡故謂為變應上失矣古今凶驗非唯虎也野物皆然楚王英宮樓未成鹿走上階其後果薨魯昭公且出鸜鵒來巢其後季氏逐昭公昭公奔齊遂死不還賈誼為長沙王傅鵩鳥集舍發書占之曰主人將去其後遷為梁王傅懷王好騎墜馬而薨賈誼傷之亦病而死昌邑王時夷鴣鳥集宮殿下王射殺之以問郎中令龔遂龔遂對曰夷鴣野鳥入宮亡之應也其後昌邑王竟亡盧奴令田光與公孫弘等謀反其且覺時狐鳴光舍屋上光心惡之其後事覺坐誅會稽東部都尉禮文伯時羊伏廳下其後遷為東萊太守都尉王子鳳時麇入府中其後遷為丹陽太守夫吉凶同占遷免一驗俱象空亡精氣消去也故人且亡也野鳥入宅城且空也草蟲入邑等類衆多行事比肩略舉較著以定實驗也
