body:
  text: 偶會篇命吉凶之主也自然之道適偶之數非有他氣旁物厭勝感動使之然也世謂子胥伏劍屈原自沉子蘭宰嚭誣讒吳楚之君冤殺之也偶二子命當絕子蘭宰嚭適為讒而懷王夫差適信姦也君適不明臣適為讒二子之命偶自不長二偶三合似若有之其實自然非他為也夏殷之朝適窮桀紂之惡適稔商周之數適起湯武之德適豐關龍逢殺箕子比干囚死當桀紂惡盛之時亦二子命訖之期也任伊尹之言納呂望之議湯武且興之會亦二臣當用之際也人臣命有吉凶賢不肖之主與之相逢文王時當昌呂望命當貴高宗治當平傅說德當遂非文王高宗為二臣生呂望傅說為兩君出也君明臣賢光曜相察上脩下治度數相得顏淵死子曰天喪予子路死子曰天祝予孔子自傷之辭非實然之道也孔子命不王二子壽不長也不王不長所稟不同度數並放適相應也二龍之祅當效周厲適闓櫝褒姒當喪周國幽王稟性偶惡非二龍使厲王發孽褒姒令幽王愚惑也遭逢會遇自相得也僮謠之語當驗鬭雞之變適生鸜鵒之占當應魯昭之惡適成非僮謠致鬭競鸜鵒招君惡也期數自至人行偶合也堯命當禪舜丹朱為無道虞統當傳夏商均行不軌非舜禹當得天下能使二子惡也美惡是非適相逢也火星與昴星出入昴星低時火星出昴星見時火星伏非火之性厭服昴也時偶不並度轉乖也正月建寅斗魁破申非寅建使申破也轉運之衡偶自應也父歿而子嗣姑死而婦代非子婦代使父姑終歿也老少年次自相承也世謂秋氣擊殺穀草穀草不任凋傷而死此言失實夫物以春生夏長秋而熟老適自枯死陰氣適盛與之會遇何以驗之物有秋不死者生性未極也人生百歲而終物生一歲而死物死謂陰氣殺之人終觸何氣而亡論者猶或謂鬼喪之夫人終鬼來物死寒至皆適遭也人終見鬼或見鬼而不死物死觸寒或觸寒而不枯壞屋所壓崩崖所墜非屋精崖氣殺此人也屋老崖沮命凶之人遭㞐適履月毀於天螺消於淵風從虎雲從龍同類通氣性相感動若夫物事相遭吉凶同時偶適相遇非氣感也殺人者罪至大辟殺者罪當重死者命當盡也故害氣下降凶命先中聖王德施厚祿先逢是故德令降於殿堂命長之囚出於牢中天非為囚未當死使聖王出德令也聖王適下赦拘囚適當免死猶人以夜臥晝起矣夜月光盡不可以作人力亦倦欲壹休息晝日光明人臥亦覺力亦復足非天以日作之以夜息之也作與日相應息與夜相得也鴈鵠集於會稽去避碣石之寒來遭民田之畢蹈履民田啄食草糧糧盡食索春雨適作避熱北去復之碣石象耕靈陵亦如此焉傳曰舜葬蒼梧象為之耕禹葬會稽鳥為之佃失事之實虛妄之言也丈夫有短壽之相娶必得早寡之妻早寡之妻嫁亦遇夭折之夫也世曰男女早死者夫賊妻妻害夫非相賊害命自然也使火燃以水沃之可謂水賊火火適自滅水適自覆兩名各自敗不為相賊今男女之早夭非水沃火之比適自滅覆之類也賊父之子妨兄之弟與此同召同宅而處氣相加凌羸瘠消單至於死亡可謂相賊或客死千里之外兵燒厭溺氣不相犯相賊如何王莽姑姊正君許嫁二夫二夫死當適趙而王薨氣未相加遙賊三家何其痛也黃次公取鄰巫之女世謂女相貴故次公位至丞相其實不然次公當貴行與女會女亦自尊故入次公門偶適然自相遭遇時也無祿之人商而無盈農而無播非其性賊貨而命妨穀也命貧居無利之貨祿惡殖不滋之穀也世謂宅有吉凶徙有歲月實事則不然天道難知假令有之命凶之人當衰之家治宅遭得不吉之地移徙適觸歲月之忌一家犯忌口以十數坐而死者必祿衰命泊之人也推此以論仕宦進退遷徙可復見也時適當退君用讒口時適當起賢人薦己故仕且得官也君子輔善且失位也小人毀奇公伯寮愬子路於季孫孔子稱命魯人臧倉讒孟子於平公孟子言天道未當行與讒相遇天未與己惡人用口故孔子稱命不怨公伯寮孟子言天不尤臧倉誠知時命當自然也推此以論人君治道功化可復言也命當貴時適平期當亂祿遭衰治亂成敗之時與人興衰吉凶適相遭遇因此論聖賢迭起猶此類也聖主龍興於倉卒良輔超拔於際會世謂韓信張良輔助漢王故秦滅漢興高祖得王夫高祖命當自王信良之輩時當自興兩相遭遇若故相求是故高祖起於豐沛豐沛子弟相多富貴非天以子弟助高祖也命相小大適相應也趙簡子廢太子伯魯立庶子無恤無恤遭賢命亦當君趙也世謂伯魯不肖不如無恤伯魯命當賤知慮多泯亂也韓生仕至太傅世謂賴倪寬實謂不然太傅當貴遭與倪寬遇也趙武藏於袴中終日不啼非或掩其口閼其聲也命時當生睡臥遭出也故軍功之侯必斬兵死之頭富家之商必奪貧室之財削土免侯罷退令相罪法明白祿秩適極故厲氣所中必加命短之人凶歲所著必饑虛耗之家矣
