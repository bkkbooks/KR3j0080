body:
  text: 時篇世俗起土興功歲月有所食所食之地必有死者假令太歲在子歲食於酉正月建寅月食於巳子寅地興功則酉巳之家見食矣見食之家作起厭勝以五行之物懸金木水火假令歲月食西家西家懸金歲月食東家東家懸炭設祭祀以除其凶或空亡徙以辟其殃連相倣效皆謂之然如考實之虛妄迷也何以明之夫天地之神用心等也人民無狀加罪行罰非有二心兩意前後相反也移徙不避歲月歲月惡其不避己之衝位怒之也今起功之家亦動地體無狀之過與移徙等起功之家當為歲月所食何故反令巳酉之地受其咎乎豈歲月之神怪移徙而不咎起功哉用心措意何其不平也鬼神罪過人猶縣官謫罰民也民犯刑罰多非一小過宥罪大惡犯辟未有以無過受罪無過而受罪世謂之冤今巳酉之家無過於月歲子寅起宅空為見食此則歲月冤無罪也且夫太歲在子子宅直符午宅為破不須興功起事空居無為猶被其害今歲月所食待子寅有為巳酉乃凶太歲歲月之神用罰為害動靜殊致非天從歲月神意之道也審論歲月之神歲則太歲也在天邊際立於子位起室者在中國一州之內假令楊州在東南使如鄒衍之言天下為一州又在東南歲食於酉食西羗之地東南之地安得凶禍假令歲在人民之間西宅為酉地則起功之家宅中亦有酉地何以不近食其宅中之酉地而反食佗家乎且食之者審誰也如審歲月歲月天之從神飲食與天同天食不食人故郊祭不以為牲如非天神亦不食人天地之間百神所食聖人謂當與人等推生事死推人事鬼故百神之祀皆用眾物無用人者物食人者虎與狼也歲月之神豈虎狼之精哉倉卒之世穀食乏匱人民饑餓自相啖食豈其啖食死者其精為歲月之神哉歲月有神日亦有神歲食月食日何不食積日為月積月為時積時為歲千五百三十九歲為一統四千六百一十七歲為一元增積相倍之數分餘終竟之名耳安得鬼神之怪禍福之驗乎如歲月終竟者宜有神則四時有神統元有神月三日魄八日弦十五日望與歲月終竟何異歲月有神魄與弦望復有神也一日之中分為十二時平旦寅日出卯也十二月建寅卯則十二月時所加寅卯也日加十二辰不食月建十二辰獨食豈日加無神月建獨有哉何故月建獨食日加不食乎如日加無神用時決事非也如加時有神獨不食非也神之口腹與人等也人饑則食飽則止不為起功乃一食也歲月之神起功乃食一歲之中興功者希歲月之神饑乎倉卒之世人民亡室宅荒廢興功者絕歲月之神餓乎且田與宅俱人所治興功用力勞佚鈞等宅掘土而立木田鑿溝而起堤堤與木俱立掘與鑿俱為起宅歲月食治田獨不食豈起宅時歲月饑治田時飽乎何事鈞作同飲食不等也說歲月食之家必銓功之小大立遠近之步數假令起三尺之功食一步之內起十丈之役食一里之外功有小大禍有近遠蒙恬為秦築長城極天下之半則其為禍宜以萬數案長城之造秦民不多死周公作雒興功至大當時歲月宜多食聖人知其審食宜徙所食地置於吉祥之位如不知避人民多凶經傳之文賢聖宜有刺譏今聞築雒之民四方和會功成事畢不聞多死說歲月食之家殆虛非實也且歲月審食猶人口腹之饑必食也且為己酉地有厭勝之故畏一金刃懼一死炭豈閉口不敢食哉如實畏懼宜如其數五行相勝物氣鈞適如泰山失火沃以一杯之水河決千里塞以一掊之土能勝之乎非失五行之道小大多少不能相當也天地之性人物之力少不勝多小不厭大使三軍持木杖匹夫持一刃伸力角氣匹夫必死金性勝木然而木勝金負者木多而金寡也積金如山燃一炭火以燔爍之金必不消非失五行之道金多火少少多小大不鈞也五尺童子與孟賁爭童子不勝非童子怯力少之故也狼眾食人人眾食狼敵力角氣能以小勝大者希爭彊量功能以寡勝眾者鮮天道人物不能以小勝大者少不能服多以一刃之金一炭之火厭除凶咎卻歲之殃如何也
