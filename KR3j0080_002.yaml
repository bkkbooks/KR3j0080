body:
  text: 纍害篇凡人仕宦有稽留不進行節有毀傷不全罪過有纍積不除聲名有暗昧不明才非下行非悖也又知非昏策非昧也逢遭外禍纍害之也非唯人行凡物皆然生動之類咸被纍害纍害自外不由其內夫不本纍害所從生起而徒歸責於被纍害者智不明暗塞於理者也物以春生人保之以秋成人必不能保之卒然牛馬踐根刀鎌割莖生者不育至秋不成不成之類遇害不遂不得生也夫鼠涉飯中捐而不食捐飯之味與彼不污者鈞以鼠為害棄而不御君子之纍害與彼不育之物不御之飯同一實也俱由外來故為纍害修身正行不能來福戰栗戒慎不能避禍禍福之至幸不幸也故曰得非己力故謂之福來不由我故謂之禍不由我者謂之何由由鄉里與朝廷也夫鄉里有三纍朝廷有三害纍生於鄉里害發於朝廷古今才洪行淑之人遇此多矣何謂三纍三害凡人操行不能慎擇友友同心恩篤異心踈薄踈薄怨恨毀傷其行一纍也人才高下不能鈞同同時並進高者得榮下者慚恚毀傷其行二纍也人之交遊不能常歡歡則相親忿則踈遠踈遠怨恨毀傷其行三纍也位少人衆仕者爭進進者爭位見將相毀增加傅致將昧不明然納其言一害也將吏異好清濁殊操清吏增郁郁之白舉涓涓之言濁吏懷恚怨恨徐求其過因纖微之謗被以罪罰二害也將或幸佐吏之身納信其言佐吏非清節必拔人越次忤失其意毀之過度清正之仕抗行伸志遂為所憎毀傷於將三害也夫未進也身被三纍已用也身蒙三害雖孔丘墨翟不能自免顏回曾參不能全身也動百行作萬事嫉妬之人隨而雲起枳棘鉤挂容體蜂蠆之黨喙螫懷慘豈徒六哉六者章章世曾不見夫不原士之操行有三纍仕宦有三害身完全者謂之潔被毀謗者謂之辱官升進者謂之善位廢退者謂之惡完全升進幸也而稱之毀謗廢退不遇也而訾之用心若此必為不知三纍三害也論者既不知纍害所從生又不知被纍害者行賢潔也以塗搏泥以墨點繒孰有知之清受塵白取垢青蠅所汙常在練素處顛者危勢豐者虧頽墜之類常在懸垂屈平潔白邑犬群吠吠所怪也非俊疑傑固庸能態也偉士坐以俊傑之才招致群吠之聲夫如是豈宜更勉奴下循不肖哉不肖奴下非所勉也豈宜更偶俗全身以弭謗哉偶俗全身則鄉原也鄉原之人行全無闕非之無舉刺之無刺也此又孔子之所罪孟軻之所愆也古賢美極無以衛身故循性行以俊纍害者果賢潔之人也極纍害之謗而賢潔之實見焉立賢潔之迹毀謗之塵安得不生絃者思折伯牙之指御者願摧王良之手何則欲專良善之名惡彼之勝己也是故魏女色艷鄭袖劓之朝吳忠貞無忌逐之戚施彌妬蘧除多佞是故濕堂不灑塵卑屋不蔽風風衝之物不得育水湍之岸不得峭夫如是牖里陳蔡可得知而沉江蹈河可得曉也以軼才取容媚於俗求全功名於將不遭鄧析之禍取子胥之誅幸矣孟賁之尸人不刃者氣絶也死灰百斛人不沃者光滅也動身章彰智顯光氣於世奮志敖黨立卓異於俗固常通人所讒嫉也以方心偶遇俗之纍求益反損蓋孔子所以憂心孟軻所以惆悵也德鴻者招謗為士者多口以休熾之聲彌口舌之患求無危傾之害遠矣臧倉之毀未嘗絶也公伯寮之遡未嘗滅也垤成丘山汙為江河矣夫如是市虎之訛投杼之誤不足怪則玉變為石珠化為礫不足詭也何則昧心冥冥之知使之然也文王所以為糞土而惡來所以為金玉也非紂憎聖而好惡也心知惑蔽蔽惑不能審則微子十去比干五剖未足痛也故三監讒聖人周公奔楚後母毀孝子伯奇放流當時周世孰有不惑乎後鴟梟作而黍離興諷詠之者乃悲傷之故無雷風之變周公之惡不滅當夏不隕霜鄒衍之罪不除德不能感天誠不能動變君子篤信審己也安能遏纍害於人聖賢不治名害至不免辟避形章彰墨短掩匿白長不理身冤不弭流言受垢取毀不求潔完故惡見而善不彰行缺而迹不顯邪偽之人治身以巧俗修詐以偶衆猶漆盤盂之工穿墻不見弄丸劍之倡手指不知也世不見短故共稱之將不聞惡故顯用之夫如是世俗之所謂賢潔者未必非惡所謂邪污者未必非善也或曰言有招患行有召恥所在常由小人夫小人性患恥者也含邪而生懷偽而遊沐浴纍害之中何招召之有故夫火生者不傷濕水居者無溺患火不苦熱水不痛寒氣性自然焉召招之君子也以忠言招患以高行招恥何世不然然而太山之惡君子不得名毛髮之善小人不得有也以玷污言之清受塵而白取垢以毀謗言之貞良見妬高奇見噪以遇罪言之忠言招患高行招恥以不純言之玉有瑕而珠有毀焦陳留君兄名稱兗州行完迹潔無纖芥之毀及其當為從事刺史焦康絀而不用夫未進也被三纍已用也蒙三害雖孔丘墨翟不能自免顏回曾參不能全身也何則衆好純譽之人非真賢也公侯已下玉石雜糅賢士之行善惡相苞夫采玉者破石拔玉選士者棄惡取善夫如是纍害之人負世以行指擊之者從何往哉
