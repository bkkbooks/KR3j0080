body:
  text: 譏日篇世俗既信歲時而又信日舉事若病死災患大則謂之犯觸歲月小則謂之不避日禁歲月之傳既用日禁之書亦行世俗之人委心信之辨論之士亦不能定是以世人舉事不考於心而合於日不參於義而致於時時日之書衆多非一略舉較著明其是非使信天時之人將一疑而倍之夫禍福隨盛衰而至代謝而然舉事曰凶人畏凶有效曰吉人冀吉有驗禍福自至則述前之吉凶以相戒懼此日禁所以纍世不疑惑者所以連年不悟也葬歷曰葬避九空地臽及日之剛柔月之奇耦日吉無害剛柔相得奇耦相應乃為吉良不合此歷轉為凶惡夫葬藏棺也斂藏尸也初死藏尸於棺少久藏棺於墓墓與棺何別斂與葬何異斂於棺不避凶葬於墓獨求吉如以墓為重夫墓土也棺木也五行之性木土鈞也治木以贏尸穿土以埋棺治與穿同事尸與棺一實也如以穿土賊地之體鑿溝耕園亦宜擇日世人能異其事吾將聽其禁不能異其事吾不從其諱日之不害又求日之剛柔剛柔既合又索月之奇耦夫日之剛柔月之奇耦合於葬歷驗之於古無不相得何以明之春秋之時天子諸侯卿大夫死以千百數案其葬日未必合於歷又曰雨不克葬庚寅日中乃葬假令魯小君以剛日死至葬日己丑剛柔等矣剛柔合善日也不克葬者避雨也如善日不當以雨之故廢而不用也何則雨不便事耳不用剛柔重凶不吉欲便事而犯凶非魯人之意臣子重慎之義也今廢剛柔待庚寅日中以暘為吉也禮天子七月而葬諸侯五月卿大夫士三月假令天子正月崩七月葬二月崩八月葬諸侯卿大夫士皆然如驗之葬歷則天子諸侯葬月常奇常耦也衰世好信禁不肖君好求福春秋之時可謂衰矣隱哀之間不肖甚矣然而葬埋之日不見所諱無忌之故也周文之世法度備具孔子意密春秋義纖如廢吉得凶妄舉觸禍宜有微文小義貶譏之辭今不見其義無葬歷法也祭祀之歷亦有吉凶假令血忌月殺之日固凶以殺牲設祭必有患禍夫祭者供食鬼也鬼者死人之精也若非死人之精人未嘗見鬼之飲食也推生事死推人事鬼見生人有飲食死為鬼當能復飲食感物思親故祭祀也及他神百鬼之祠雖非死人其事之禮亦與死人同蓋以不見其形但以生人之禮准況之也生人飲食無日鬼神何故有日如鬼神審有知與人無異則祭不宜擇日如無知也不能飲食雖擇日避忌其何補益實者百祀無鬼死人無知百祀報功示不忘德死如事生示不背亡祭之無福不祭無禍祭與不祭尚無禍福況日之吉凶何能損益如以殺牲見血辟血忌月殺則生人食六畜亦宜辟之海內屠肆六畜死者日數千頭不擇吉凶早死者未必屠工也天下死罪冬月斷囚亦數千人其刑於市不擇吉日受禍者未必獄吏也肉盡殺牲獄具斷囚囚斷牲殺創血之實何以異於祭祀之牲獨為祭祀設歷不為屠工獄吏立日世俗用意不實類也祭非其鬼又信非其諱持二非往求一福不能得也沐書曰子日沐令人愛之卯日沐令人白頭夫人之所愛憎在容貌之好醜頭髮白黑在年歲之稚老使醜如嫫母以子日沐能得愛乎使十五女子以卯日沐能令白髮乎且沐者去首垢也洗去足垢盥去手垢浴去身垢皆去一形之垢其實等也洗盥浴不擇日而沐獨有日如以首為最尊尊則浴亦治面面亦首也如以髮為最尊則櫛亦宜擇日櫛用木沐用水水與木俱五行也用木不避忌用水獨擇日如以水尊於木則諸用水者宜皆擇日且水不若火尊如必以尊卑則用火者宜皆擇日且使子沐人愛之卯沐其首白者誰也夫子之性水也卯木也水不可愛木色不白子之禽鼠卯之獸兔也鼠不可愛兔毛不白以子日沐誰使可愛卯日沐誰使凝白者夫如是沐之日無吉凶為沐立日歷者不可用也裁衣有書書有吉凶凶日製衣則有禍吉日則有福夫衣與食俱輔人體食輔其內衣衛其外飲食不擇日製衣避忌日豈以衣為於其身重哉人道所重莫如食急故八政一曰食二曰貨衣服貨也如以加之於形為尊重在身之物莫大於冠造冠無禁裁衣有忌是於尊者略卑者詳也且夫沐去頭垢冠為首飾浴除身垢衣衛體寒沐有忌冠無諱浴無吉凶衣有利害俱為一體共為一身或善或惡所諱不均俗人淺知不能實也且衣服不如車馬九錫之禮一曰車馬二曰衣服作車不求良辰裁衣獨求吉日俗人所重失輕重之實也工伎之書起宅蓋屋必擇日夫屋覆人形宅居人體何害於歲月而必擇之如以障蔽人身者神惡之則夫裝車治船著蓋施帽亦當擇日如以動地穿土神惡之則夫鑿溝耕園亦宜擇日夫動土擾地神地神能原人無有惡意但欲居身自安則神之聖心必不忿怒不忿怒雖不擇日猶無禍也如土地之神不能原人之意苟惡人動擾之則雖擇日何益哉王法禁殺傷人殺傷人皆伏其罪雖擇日犯法終不免罪如不禁也雖妄殺傷終不入法縣官之法猶鬼神之制也穿鑿之過猶殺傷之罪也人殺傷不在擇日繕治室宅何故有忌又學書諱丙日云倉頡以丙日死也禮不以子卯舉樂殷夏以子卯日亡也如以丙日書子卯日舉樂未必有禍重先王之亡日悽愴感動不忍以舉事也忌日之法蓋丙與子卯之類也殆有所諱未必有凶禍也堪輿曆曆上諸神非一聖人不言諸子不傳殆無其實天道難知假令有之諸神用事之日也忌之何福不諱何禍王者以甲子之日舉事民亦用之王者聞之不刑法也夫王者不怒民不與己相避天神何為獨當責之王法舉事以人事之可否不問日之吉凶孔子曰卜其宅兆而安厝之春秋祭祀不言卜日禮曰內事以柔日外事以剛日剛柔以慎內外不論吉凶以為禍福
