body:
  text: 感類篇陰陽不和災變發起或時先世遺咎或時氣自然賢聖感類慊懼自思災變惡徵何為至乎引過自責恐有罪畏慎恐懼之意未必有其實事也何以明之以湯遭旱自責以五過也聖人純完行無缺失矣何自責有五過然如書曰湯自責天應以雨湯本無過以五過自責天何故雨以無過致旱亦知自責不能得雨也由此言之旱不為湯至雨不應自責然而前旱後雨者自然之氣也此言書之語也難之曰春秋大雩董仲舒設土龍皆為一時間也一時不雨恐懼雩祭求陰請福憂念百姓也湯遭旱七年以五過自責謂何時也夫遭旱一時輒自責乎旱至七年乃自責也謂一時輒自責七年乃雨天之應誠何其留也如謂七年乃自責憂念百姓何其遲也不合雩祭之法不厭憂民之義書之言未可信也由此論之周成王之雷風發亦此類也金滕曰秋大熟未穫天大雷雨以風禾盡偃大木斯拔邦人大恐當此之時周公死儒者說之以為成王狐疑於葬周公欲以天子禮葬公公人臣也欲以人臣禮葬公公有王功狐疑於葬周公之間天大雷雨動怒示變以彰聖功古文家以武王崩周公居攝管蔡流言王意狐疑周公周公奔楚故天雷雨以悟成王夫一雷一雨之變或以為葬疑或以為信讒二家未可審且訂葬疑之說秋夏之際陽氣尚盛未嘗無雷雨也顧其拔木椻禾頗為狀耳當雷雨時成王感懼開金滕之書見周公之功執書泣過自責之深自責適已天偶反風書家則謂天為周公怒也千秋萬夏不絶雷雨苟謂雷雨為天怒乎是則皇天歲歲怒也正月陽氣發泄雷聲始動秋夏陽至極而雷折苟謂秋夏之雷為天大怒正月之雷天小怒乎雷為天怒雨為恩施使天為周公怒徒當雷不當雨今雷雨俱至天怒且喜乎子於是日也哭則不歌周禮子卯稷食菜羹哀樂不並行哀樂不並行喜怒反并至乎秦始皇帝東封岱嶽雷雨暴至劉媼息大澤雷雨晦冥始皇無道自同前聖治亂自謂太平天怒可也劉媼息大澤夢與神遇是生高祖何怒於生聖人而為雷雨乎堯時大風為害堯繳大風於青丘之野舜入大麓烈風雷雨堯舜世之隆主何過於天天為風雨也大旱春秋雩祭又董仲舒設土龍以類招氣如天應雩龍必為雷雨何則秋夏之雨與雷俱也必從春秋仲舒之術則大雩龍求天怒乎師曠奏白雪之曲雷電下擊鼓清角之音風雨暴至苟為雷雨為天怒天何憎於白雪清角而怒師曠為之乎此雷雨之難也又問之曰成王不以天子禮葬周公天為雷風偃禾拔木成王覺悟執書泣過天乃反風偃禾復起何不為疾反風以立大木必須國人起築之乎應曰天不能曰然則天有所不能乎應曰然難曰孟賁推人人仆接人而起接人立天能拔木不能復起是則天力不如孟賁也秦時三山亡猶謂天所徙也夫木之輕重孰與三山能徙三山不能起大木非天用力宜也如謂三山非天所亡然則雷雨獨天所為乎應曰天子欲令成王以天子之禮葬周公以公有聖德以公有王功經曰王乃得周公所自以為功代武王之說今天動威以彰周公之德也難之曰伊尹相湯伐夏為民興利除害致天下太平湯死復相大甲大甲佚豫放之桐宮攝政三年乃退復位周公曰伊尹格于皇天天所宜彰也伊尹死時天何以不為雷雨應曰以百兩篇曰伊尹死大霧三日大霧三日亂氣矣非天怒之變也東海張霸造百兩篇其言雖未可信且假以問天為雷雨以悟成王成王未開金匱雷雨止乎已開金匱雷雨乃止也應曰未開金匱雷雨止也開匱得書見公之功覺悟泣過決以天子禮葬公出郊觀變天止雨反風禾盡起由此言之成王未覺悟雷雨止矣難曰伊尹死霧三日天何不三日雷雨須成王覺悟乃止乎太戊之時桑榖生朝七日大拱太戊思政桑榖消亡宋景公時熒惑守心出三善言熒惑徙舍使太戊不思政景公無三善言桑榖不消熒惑不徙何則災變所以譴告也所譴告未覺災變不除天之至意也今天怒為雷雨以責成王成王未覺雨雷之息何其早也又問曰禮諸侯之子稱公子諸侯之孫稱公孫皆食采地殊之衆庶何則公子公孫親而又尊得體公稱又食采地名實相副猶文質相稱也天彰周公之功令成王以天子禮葬何不令成王號周公以周王副天子之禮乎應曰王者名之尊號也人臣不得名也難曰人臣猶得名王禮乎武王伐紂下車追王大王王季文王三人者諸侯亦人臣也以王號加之何為獨可於三王不可於周公天意欲彰周公豈能明乎豈以王迹起於三人哉然而王功亦成於周公江起岷山流為濤瀨相濤瀨之流孰與初起之源秬鬯之所為到白雉之所為來三王乎周公也周公功德盛於三王不加王號豈天惡人妄稱之哉周衰六國稱王齊秦更為帝當時天無禁怒之變周公不以天子禮葬天為雷雨以責成王何天之好惡不純一乎又問曰魯季孫賜曾子簀曾子病而寢之童子曰華而睆者大夫之簀而曾子感慚命元易簀蓋禮大夫之簀士不得寢也今周公人臣也以天子禮葬魂而有靈將安之不也應曰成王所為天之所豫何為不安難曰季孫所賜大夫之簀豈曾子之所自制乎何獨不安乎子疾病子路遣門人為臣病間曰久矣哉由之行詐也無臣而為有臣吾誰欺欺天乎孔子罪子路者也己非人君子路使門人為臣非天之心而妄為之是欺天也周公亦非天子也以孔子之心況周公周公必不安也季氏旅於太山孔子曰曾謂泰山不如林放乎以曾子之細猶卻非禮周公至聖豈安天子之葬曾謂周公不如曾子乎由此原之周公不安也大人與天地合德周公不安天亦不安何故為雷雨以責成王乎又問曰死生有命富貴在天武王之命何可代乎應曰九齡之夢天奪文王年以益武王克殷二年之時九齡之年未盡武王不豫則請之矣人命不可請獨武王可非世常法故藏於金縢不可復為故掩而不見難曰九齡之夢武王已得文王之年未應曰已得之矣難曰已得文王之年命當自延克殷二年雖病猶將不死周公何為請而代之應曰人君爵人以官議定未之即與曹下案目然後可諾天雖奪文王年以益武王猶須周公請乃能得之命數精微非一臥之夢所能得也應曰九齡之夢能得也難曰九齡之夢文王夢與武王九齡武王夢帝豫其九齡其天已豫之矣武王已得之矣何須復請人且得官先夢得爵其後莫舉猶自得官何則兆象先見其驗必至也古者謂年為齡已得九齡猶人夢得爵也周公因必效之夢請之於天功安能大乎又問曰功無大小德無多少人須仰恃賴之者則為美矣使周公不代武王武王病死周公與成王而致天下太平乎應曰成事周公輔成王而天下不亂使武王不見代遂病至死周公致太平何疑乎難曰若是武王之生無益其死無損須周公功乃成也周衰諸侯背畔管仲九合諸侯一匡天下孔子曰微管仲吾其被髮左衽矣使無管仲不合諸侯夷狄交侵中國絶滅此無管仲有所傷也程量有益管仲之功偶於周公管仲死桓公不以諸侯禮葬以周公況之天亦宜怒微雷薄雨不至何哉豈以周公聖而管仲不賢乎夫管仲為反坫有三歸孔子譏之以為不賢反坫三歸諸侯之禮天子禮葬王者之制皆以人臣俱不得為大人與天地合德孔子大人也譏管仲之僭禮皇天欲周公之侵制非合德之驗書家之說未可然也以見鳥跡而知為書見蜚蓬而知為車天非以鳥跡命倉頡以蜚蓬使奚仲也奚仲感蜚蓬而倉頡起鳥跡也晉文反國命徹麋墨舅犯心感辭位歸家夫文公之徹麋墨非欲去舅犯舅犯感慚自同於麋墨也宋華臣弱其宗使家賊六人以鈹殺華吳於宋合左師之後左師懼曰老夫無罪其後左師怨咎華臣華臣備之國人逐瘈狗瘈狗入華臣之門華臣以為左師來攻己也踰墻而走夫華臣自殺華吳而左師懼國人自逐瘈狗而華臣自走成王之畏懼猶此類也心疑於不以天子禮葬公卒遭雷雨之至則懼而畏過矣夫雷雨之至天未必責成王也雷雨至成王懼以自責也夫感則蒼頡奚仲之心懼則左師華臣之意也懷嫌疑之計遭暴至之氣以類之驗見到天怒之效成矣見類驗於寂漠猶感動而畏懼況雷雨揚軯䡷之聲成王庶幾能不怵惕乎迅雷風烈孔子必變禮君子聞雷雖夜衣冠而坐所以敬雷懼激氣也聖人君子於道無嫌然猶順天變動況成王有周公之疑聞雷雨之變安能不振懼乎然則雷雨之至也殆且自天氣成王畏懼殆且感物類也夫天道無為如天以雷雨責怒人則亦能以雷雨殺無道古無道者多可以雷雨誅殺其身必命聖人興師動軍頓兵傷士難以一雷行誅輕以三軍剋敵何天之不憚煩也或曰紂父帝乙射天毆地游河渭之間雷電擊而殺之斯天以雷電誅無道也帝乙之惡孰與桀紂鄒伯奇論桀紂惡不如亡秦亡秦不如王莽然而桀紂秦莽之死不以雷電孔子作春秋采毫毛之善貶纖介之惡采善不踰其美貶惡不溢其過責小以大夫人無之成王小疑天大雷雨如定以臣葬公其變何以過此洪範稽疑不悟災變者人之才不能盡曉天不以疑責備於人也成王心疑未決天以大雷雨責之殆非皇天之意書家之說恐失其實也
