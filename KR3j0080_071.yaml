body:
  text: 卜筮篇俗信卜筮謂卜者問天筮者問地蓍神龜靈兆數報應故捨人議而就卜筮違可否而信吉凶其意謂天地審告報蓍龜真神靈也如實論之卜筮不問天地蓍龜未必神靈有神靈問天地俗儒所言也何以明之子路問孔子曰豬肩羊膊可以得兆雚葦藁芼可以得數何必以蓍龜孔子曰不然蓋取其名也夫蓍之為言耆也龜之為言舊也明狐疑之事當問耆舊也由此言之蓍不神龜不靈蓋取其名未必有實也無其實則知其無神靈無神靈則知不問天地也且天地口耳何在而得問之天與人同道欲知天以人事相問不自對見其人親問其意意不可知欲問天天高耳與人相遠如天無耳非形體也非形體則氣也氣若雲霧何能告人蓍以問地地有形體與人無異問人不近耳則人不聞人不聞則口不告人夫言問天則天為氣不能為兆問地則地耳遠不聞人言信謂天地告報人者何據見哉人在天地之間猶蟣虱之著人身也如蟣虱欲知人意鳴人耳傍人猶不聞何則小大不均音語不通也今以微小之人問巨大天地安能通其聲音天地安能知其旨意或曰人懷天地之氣天地之氣在形體之中神明是矣人將卜筮告令蓍龜則神以耳聞口言若己思念神明從胸腹之中聞知其旨故鑽龜揲蓍兆見數著夫人用神思慮思慮不決故問蓍龜蓍龜兆數與意相應則是神可謂明告之矣時或意以為可兆數不吉或兆數則吉意以為凶夫思慮者己之神也為兆數者亦己之神也一身之神在胸中為思慮在胸外為兆數猶人入戶而坐出門而行也行坐不異意出入不易情如神明為兆數不宜與思慮異天地有體故能搖動搖動者生之類也生則與人同矣問生人者須以生人乃能相報如使死人問生人則必不能相答今天地生而蓍龜死以死問生安能得報枯龜之骨死蓍之莖問生之天地世人謂之天地報應誤矣如蓍龜為若版牘兆數為若書字象類人君出教令乎則天地口耳何在而有教令孔子曰天何言哉四時行焉百物生焉天不言則亦不聽人之言天道稱自然無為今人問天地天地報應是自然之有為以應人也案易之文觀揲蓍之法二分以象天地四揲以象四時歸奇於扐以象閏月以象類相法以立卦數耳豈云天地告報人哉人道相問則對不問不應無求空扣人之門無問虛辨人之前則主人笑而不應或怒而不對試使卜筮之人空鑽龜而卜虛揲蓍而筮戲弄天地亦得兆數天地妄應乎又試使人罵天而卜驅地而筮無道至甚亦得兆數苟謂兆數天地之神何不滅其火灼其手振其指而亂其數使之身體疾痛血氣湊涌而猶為之見兆出數何天地之不憚勞用心不惡也由此言之卜筮不問天地兆數非天地之報明矣然則卜筮亦必有吉凶論者或謂隨人善惡之行也猶瑞應應善而至災異隨惡而到治之善惡善惡所致也疑非天地故應之也吉人鑽龜輒從善兆凶人揲蓍輒得逆數何以明之紂至惡之君也當時災異繁多七十卜而皆凶故祖伊曰格人元龜罔敢知吉賢者不舉大龜不兆災變亟至周武受命高祖龍興天人並佑奇怪既多豐沛子弟卜之又吉故吉人之體所致無不良凶人之起所招無不醜衛石駘卒無適子有庶子六人卜所以為後者曰沐浴佩玉則兆五人皆沐浴佩玉石祁子曰焉有執親之喪而沐浴佩玉不沐浴佩玉石祁子兆衛人卜以龜為有知也龜非有知石祁子自知也祁子行善政有嘉言言嘉政善故有明瑞使時不卜謀之於衆亦猶稱善何則人心神意同吉凶也此言若然然非卜筮之實也夫鑽龜揲蓍自有兆數兆數之見自有吉凶而吉凶之人適與相逢吉人與善兆合凶人與惡數遇猶吉人行道逢吉事顧睨見祥物非吉事祥物為吉人瑞應也凶人遭遇凶惡於道亦如之夫見善惡非天應答適與善惡相逢遇也鑽龜揲蓍有吉凶之兆者逢吉遭凶之類也何以明之周武王不豫周公卜三龜公曰乃逢是吉魯卿莊叔生子穆叔以周易筮之遇明夷之謙夫卜曰逢筮曰遇實遭遇所得非善惡所致也善則逢吉惡則遇凶天道自然非為人也推此以論人君治有吉凶之應亦猶此也君德遭賢時適當平嘉物奇瑞偶至不肖之君亦反此焉世人言卜筮者多得實誠者寡論者或謂蓍龜可以參事不可純用夫鑽龜揲蓍兆數輒見見無常占占者生意吉兆而占謂之凶凶數而占謂之吉吉凶不效則謂卜筮不可信周武王伐紂卜筮之逆占曰大凶太公推蓍蹈龜而曰枯骨死草何知而凶夫卜筮兆數非吉凶誤也占之不審吉凶吉凶變亂變亂故太公黜之夫蓍筮龜卜猶聖王治世卜筮兆數猶王治瑞應瑞應無常兆數詭異詭異則占者惑無常則議者疑疑則謂平未治惑則謂吉不良何以明之夫吉兆數吉人可遭也治遇符瑞聖德之驗也周王伐紂遇烏魚之瑞其卜曷為逢不吉之兆使武王不當起出不宜逢瑞使武王命當興卜不宜得凶由此言之武王之卜不得凶占謂之凶者失其實也魯將伐越筮之得鼎折足子貢占之以為凶何則鼎而折足行用足故謂之凶孔子占之以為吉曰越人水居行用舟不用足故謂之吉魯伐越果克之夫子貢占鼎折足以為凶猶周之占卜者謂之逆矣逆中必有吉猶折鼎足之占宜以伐越矣周多子貢直占之知寡若孔子詭論之材故覩非常之兆不能審也世因武王卜無非而得凶故謂卜筮不可純用略以助政示有鬼神明己不得專著書記者採掇行事若韓非飾邪之篇明已效之驗毀卜訾筮非世信用夫卜筮非不可用卜筮之人占之誤也洪範稽疑卜筮之變必問天子卿士或時審是夫不能審占兆數不驗則謂卜筮不可信用晉文公與楚子戰夢與成王搏成王在上而盬其腦占曰凶咎犯曰吉君得天楚伏其罪盬君之腦者柔之也以戰果勝如咎犯占夫占夢與占龜同晉占夢者不見象指猶周占龜者不見兆者為也象無不然兆無不審人之知暗論之失實也傳或言武王伐紂卜之而龜𠒮占者曰凶太公曰龜𠒮以祭則凶以戰則勝武王從之卒克紂焉審若此傳亦復孔子論卦咎犯占夢之類也蓋兆數無不然而吉凶失實者占不巧工也
