body:
  text: 程材篇論者多謂儒生不及彼文吏見文吏利便而儒生陸落則詆訾儒生以為淺短稱譽文吏謂之深長是不知儒生亦不知文吏也儒生文吏皆有材智非文吏材高而儒生智下也文吏更事儒生不習也謂文吏更事儒生不習可也謂文吏深長儒生淺短知妄矣世俗共短儒生儒生之徒亦自相少何則並好仕學宦用吏為繩表也儒生有闕俗共短之文吏有過俗不敢訾歸非於儒生付是於文吏也夫儒生材非下於文吏又非所習之業非所當為也然世俗共短之者見將不好用也將之不好用之者事多己不能理須文吏以領之也夫論善謀材施用纍能期於有益文吏理煩身役於職職判功立將尊其能儒生栗栗不能當劇將有煩疑不能效力力無益於時則官不及其身也將以官課材材以官為驗是故世俗常高文吏賤下儒生儒生之下文吏之高本由不能之將世俗之論緣將好惡今世之將材高知深通達衆凡舉綱持領事無不定其置文吏也備數滿員足以輔己志志在修德務在立化則夫文吏瓦石儒生珠玉也夫文吏能破堅理煩不能守身不能守身則亦不能輔將儒生不習於職長於匡救將相傾側諫難不懼案世間能建蹇蹇之節成三諫之議令將檢身自勑不敢邪曲者率多儒生阿意苟取容幸將欲放失低默不言者率多文吏文吏以事勝以忠負儒生以節優以職劣二者長短各有所宜世之將相各有所取取儒生者必軌德立化者也取文吏者必優事理亂者也材不自能則須助須助則待徑官之立佐為力不足也吏之取能為材不及也日之照幽不須燈燭賁育當敵不待輔佐使將相之力若日之照幽賁育之難敵則文吏之能無所用也病作而醫用禍起而巫使如自能案方和藥入室求祟則醫不售而巫不進矣橋梁之設也足不能越溝也車馬之用也走不能追遠也足能越溝走能追遠則橋梁不設車馬不用矣天地事物人所重敬皆力劣知極須仰以給足者也今世之將相不責己之不能而賤儒生之不習不原文吏之所得得用而尊其材謂之善吏非文吏憂不除非文吏患不救是以選舉取常故案吏取無害儒生無閥閲所能不能任劇故陋於選舉佚於朝廷聰慧捷疾者隨時變化學知吏事則踵文吏之後未得良善之名守古循志案禮修義輒為將相所不任文吏所毗戲不見任則執欲息退見毗戲則意不得臨職不勸察事不精遂為不能斥落不習有俗材而無雅度者學知吏事亂於文吏觀將所知適時所急轉志易務晝夜學問無所羞恥期於成能名文而已其高志妙操之人恥降意損崇以稱媚取進深疾才能之儒洎入文吏之科堅守高志不肯下學亦時或精暗不及意疏不密臨事不識對向謬誤拜起不便進退失度奏記言事蒙薦士解過援引古義割切將欲直言一指觸諱犯忌封蒙約縛簡繩檢署事不如法文辭卓詭辟刺離實曲不應義故世俗輕之文吏薄之將相賤之是以世俗學問者不肯竟經明學深知古今急欲成一家章句義理略具同超趨學史書讀律諷令治作情請奏習對向滑習跪拜家成室就召署輒能徇今不顧古趨讎不存志競進不案禮廢經不念學是以古經廢而不修舊學暗而不明儒者寂於空室文吏譁於朝堂材能之士隨世驅馳節操之人守隘屏竄驅馳日以巧屏竄日以拙非材頓知不及也希見闕為不狎習也蓋足未嘗行堯禹問曲折目未嘗見孔墨問形象齊郡世刺繡恆女無不能者襄邑俗織錦鈍婦無不巧者目見之日為之手狎也使材士未嘗見巧女未嘗為異事詭手暫為卒睹顯露易為者猶憒憒焉方今論事不謂希更而曰材不敏不曰未嘗為而曰知不達失其實也儒生材無不能敏業無不能達志不有肯為今俗見不習謂之不能睹不為謂之不達科用纍能故文吏在前儒生在後是從朝廷謂之也如從儒堂訂之則儒生在上文吏在下矣從農論田田夫勝從商講賈賈人賢今從朝廷謂之文吏朝廷之人也幼為幹吏以朝廷為田畝以刀筆為耒耜以文書為農桑猶家人子弟生長宅中其知曲折愈於賓客也賓客暫至雖孔墨之材不能分別儒生猶賓客文吏猶子弟也以子弟論之則文吏曉於儒生儒生暗於文吏今世之將相知子弟以文吏久為慧不能知文吏以狎為能知賓客以暫為固不知儒生以希為拙惑蔽暗昧不知類也一縣佐史之材任郡掾史一郡修行之能堪州從事然而郡不召佐史州不取修行者巧習無害文少德高也五曹自有條品簿書自有故事勤功玩弄成為巧吏安足多矣賢明之將程吏取材不求習論高存志不顧文也稱良吏曰忠忠之所以為效非簿書也夫事可學而知禮可習而善忠節公行不可立也文吏儒生皆有所志然而儒生務忠良文吏趨理事苟有忠良之業疏拙於事無損於高論者以儒生不曉簿書置之於下第法令比例吏斷決也文吏治事必問法家縣官事務莫大法令必以吏職程高是則法令之家宜最為上或曰固然法令漢家之經吏議決焉事定於法誠為明矣曰夫五經亦漢家之所立儒生善政大義皆出其中董仲舒表春秋之義稽合於律無乖異者然則春秋漢之經孔子制作垂遺於漢論者徒尊法家不高春秋是暗蔽也春秋五經義相關穿既是春秋不大五經是不通也五經以道為務事不如道道行事立無道不成然則儒生所學者道也文吏所學者事也假使材同當以道學如比於文吏洗汙泥者以水燔腥生者用火水火道也用之者事也事末於道儒生治本文吏理末道本與事末比定尊卑之高下可得程矣堯以俊德致黎民雍孔子曰孝悌之至通於神明張釋之曰秦任刀筆小吏陵遲至於二世天下土崩張湯趙禹漢之惠吏太史公序纍置於酷部而致土崩孰與通於神明令人填膺也將相知經學至道而不尊經學之生彼見經學之生能不及治事之吏也牛刀可以割雞雞刀難以屠牛刺繡之師能縫帷裳納縷之工不能織錦儒生能為文吏之事文吏不能立儒生之學文吏之能誠劣不及儒生之不習實優而不為禹決江河不秉钁鍤周公築雒不把築杖夫筆墨簿書钁鍤築杖之類也而欲合令志大道者躬親為之是使將軍戰而大匠斫也說一經之生治一曹之事旬月能之典一曹之吏學一經之業一歲不能立也何則吏事易知而經學難見也儒生籀經窮竟聖意文吏搖筆考跡民事夫能知大聖之意曉細民之情孰者為難以立難之材含懷章句十萬以上行有餘力博學覽古今計胸中之穎出溢十萬文吏所知不過辨解簿書富纍千金孰與資直百十也京廩如丘孰與委聚如坻也世名材為名器器大者盈物多然則儒生所懷可謂多矣蓬生麻間不扶自直白紗入緇不染自黑此言所習善惡變易質性也儒生之性非能皆善也被服聖教日夜諷詠得聖人之操矣文吏幼則筆墨手習而行無篇章之誦不聞仁義之語長大成吏舞文巧法徇私為己勉赴權利考事則受賂臨民則采漁處右則弄權幸上則賣將一旦在位則鮮冠利劍一歲典職則田宅并兼性非皆惡所習為者違聖教也故習善儒路歸化慕義志操則勵變從高明將見之顯用儒生東海相宗叔犀庠廣召幽隱春秋會饗設置三科以第補吏一府員吏儒生什九陳留太守陳子瑀開廣儒路列曹掾史皆能教授簿書之吏什置一二兩將知道事之理曉多少之量故世稱褒其名書記紀纍其行也
