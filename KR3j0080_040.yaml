body:
  text: 狀留篇論賢儒之才既超程矣世人怪其仕宦不進官爵卑細以賢才退在俗吏之後信不怪也夫如是而適足以見賢不肖之分睹高下多少之實也龜生三百歲大如錢遊於蓮葉之上三千歲青邊緣巨尺二寸蓍生七十歲生一莖七百歲生十莖神靈之物也故生遲留歷歲長久故能明審實賢儒之在世也猶靈蓍神龜也計學問之日固已盡年之半矣鋭意於道遂無貪仕之心及其仕也純特方正無員鋭之操故世人遲取進難也針錐所穿無不暢達使針錐末方穿物無一分之深矣賢儒方節而行無針錐之鋭固安能自穿取暢達之功乎且驥一日行千里者無所服也使服任車與駑馬同昔驥曾以引鹽車矣垂頭落汗行不能進伯樂顧之王良御之空身輕馳故有千里之名今賢儒懷古今之學負荷禮義之重內纍於胸中之知外劬於禮義之操不敢妄進苟取故有稽留之難無伯樂之友不遭王良之將安得馳於清明之朝立千里之迹乎且夫含血氣物之生也行則背在上而腹在下其病若死則背在下而腹在上何則背肉厚而重腹肉薄而輕也賢儒俗吏並在當世有似於此將明道行則俗吏載賢儒賢儒乘俗吏將暗道廢則俗吏乘賢儒賢儒處下位猶物遇害腹在上而背在下也且背法天而腹法地生行得其正故腹背得其位病死失其宜故腹反而在背上非唯腹也凡物仆僵者足又在上賢儒不遇仆廢於世躁足之吏皆在其上東方朔曰目不在面而在於足救眯不給能何見乎汲黯謂武帝曰陛下用吏如積薪矣後來者居上原汲黯之言察東方朔之語獨以非俗吏之得地賢儒之失職哉故夫仕宦失地難以觀德得地難以察不肖名生於高官而毀起於卑位卑位固常賢儒之所在也遵禮蹈繩修身守節在下不汲汲故有沉滯之留沉滯在能自濟故有不拔之扼其積學於身也多故用心也固俗吏無以自修身雖拔進利心搖動則有下道侵漁之操矣楓桐之樹生而速長故其皮肌不能堅剛樹檀以五月生葉後彼春榮之木其材強徑車以為軸殷之桑榖七日大拱長速大暴故為變怪大器晚成寶貨難售者不崇一朝輒成賈者菜果之物也是故湍瀨之流沙石轉而大石不移何者大石重而沙石輕也沙石轉積於大石之上大石沒而不見賢儒俗吏並在世俗有似於此遇暗長吏轉移俗吏超在賢儒之上賢儒處下受馳走之使至或巖居穴處沒身不見咎在長吏不能知賢而賢者道大力劣不能拔舉之故也夫手指之物器也度力不能舉則不敢動賢儒之道非徒物器之重也是故金鐵在地猋不能動毛芥在其間飛揚千里夫賢儒所懷其猶水中大石在地金鐵也其進不若俗吏速者長吏力劣不能用也毛芥在鐵石間也一口之氣能吹毛芥非必猋風俗吏之易遷猶毛芥之易吹也故夫轉沙石者湍瀨也飛毛芥者猋風也恬水沙石不轉洋風毛芥不動無道理之將用心暴猥察吏不詳遭以好遷妄授官爵猛水之轉沙石猋風之飛毛芥也是故毛芥因異風而飛沙石遭猛流而轉俗吏遇悖將而遷且圓物投之於地東西南北無之不可策杖叩動才微輒停方物集地一投而止及其移徙須人動舉賢儒世之方物也其難轉移者其動須人也鳥輕便於人趨遠人不如鳥然而天地之性人為貴蝗蟲之飛能至萬里麒麟須獻乃達闕下然而蝗蟲為災麒麟為瑞麟有四足尚不能自致人有兩足安能自達故曰燕飛輕於鳳皇兔走疾於麒麟蛙躍躁於靈龜蛇騰便於神龍呂望之徒白首乃顯百里奚之知明於黃髮深為國謀因為王輔皆夫沉重難進之人也輕躁早成禍害暴疾故曰其進鋭者退速陽溫陰寒歷月乃至災變之氣一朝成怪故夫河冰結合非一日之寒積土成山非斯須之作干將之劍久在爐炭銛鋒利刃百熟煉厲久銷乃見作留成遲故能割斷肉暴長者曰腫泉暴出者曰涌酒暴熟者易酸醯暴酸者易臭由此言之賢儒遲留皆有狀故狀故云何學多道重為身纍也草木之生者濕濕者重死者枯枯者輕枯而輕者易舉濕而重者難移也然能元氣所在在生不在枯是故車行於陸船行於溝其滿而重者行遲空而輕者行疾先王之道載在胸腹之內其重不徒船車之任也任重其取進疾速難矣竊人之物其得非不速疾也然而非其有得之非己之力也世人早得高官非不有光榮也而尸祿素餐之謗誼譁甚矣且賢儒之不進將相長吏不開通也農夫載穀奔都賈人齎貨赴遠皆欲得其願也如門郭閉而不通津梁絶而不過雖有勉力趨時之勢奚由早至以得盈利哉長吏妬賢不能容善不被鉗赭之刑幸矣焉敢望官位升舉道理之早成也
