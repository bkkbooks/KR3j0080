body:
  text: 定賢篇聖人難知賢者比於聖人為易知世人且不能知賢安能知聖乎世人雖言知賢此言妄也知賢何用知之如何以仕宦得高官身富貴為賢乎則富貴者天命也命富貴不為賢命貧賤不為不肖必以富貴效賢不肖是則仕宦以才不以命也以事君調合寡過為賢乎夫順阿之臣佞倖之徒是也准主而說適時而行無廷逆之郄則無斥退之患或骨體嫺麗面色稱媚上不憎而善生恩澤洋溢過度未可謂賢以朝廷選舉皆歸善為賢乎則夫著見而人所知者舉多幽隱人所不識者薦少虞舜是也堯求則咨於鯀共工則嶽已不得由此言之選舉多少未可以知實或德高而舉之少或才下而薦之多明君求善察惡於多少之間時得善惡之實矣且廣交多徒求索眾心者人愛而稱之清直不容鄉黨志潔不交非徒失眾心者人憎而毀之故名多生於知謝毀多失於眾意齊威王以毀封即墨大夫以譽烹阿大夫即墨有功而無譽阿無效而有名也子貢問曰鄉人皆好之何如孔子曰未可也鄉人皆惡之何如曰未可也不若鄉人之善者好之其不善者惡之夫如是稱譽多而小大皆言善者非賢也善人稱之惡人毀之毀譽者半乃可有賢以善人所稱惡人所毀可以知賢乎夫如是孔子之言可以知賢不知譽此人者賢也毀此人者惡也或時稱者惡而毀者善也人眩惑無別也以人眾所歸附賓客雲合者為賢乎則夫人眾所附歸者或亦廣交多徒之人也眾愛而稱之則蟻附而歸之矣或尊貴而為利或好士下客折節俟賢信陵孟嘗平原春申食客數千稱為賢君大將軍衛青及霍去病門無一客稱為名將故賓客之會在好下之君利害之賢或不好士不能為輕重則眾不歸而士不附也以居位治人得民心歌詠之為賢乎則夫得民心者與彼得士意者無以異也為虛恩拊循其民民之欲得即喜樂矣何以效之齊田成子越王句踐是也成子欲專齊政以大斗貸小斗收而民悅句踐欲雪會稽之恥拊循其民弔死問病而民喜二者皆自有所欲為於他而偽誘屬其民誠心不加而民亦說孟嘗君夜出秦關雞未鳴而關不闓下坐賤客鼓臂為雞鳴而雞皆和之關即闓而孟嘗得出夫雞可以姦聲感則人亦可以偽恩動也人可以偽恩動則天亦可巧詐應也動致天氣宜以精神而人用陽燧取火於天消鍊五石五月盛夏鑄以為器乃能得火今又但取刀劍恆銅鉤之屬切磨以嚮日亦得火焉夫陽燧刀劍鉤能取火於日恆非賢聖亦能動氣於天若董仲舒信土龍之能致雲雨蓋亦有以也夫如是應天之治尚未可謂賢況徒得人心即謂之賢如何以居職有成功見效為賢乎夫居職何以為功效以人民附之則人民可以偽恩說也陰陽和百姓安者時也時和不肖遭其安不和雖聖逢其危如以陰陽和而效賢不肖則堯以洪水得黜湯以大旱為殿下矣如功效謂事也身為之者功著可見以道為計者效沒不章鼓無當於五音五音非鼓不和師無當於五服五服非師不親水無當於五采五采非水不章道為功本功為道效據功謂之賢是則道人之不肖也高祖得天下賞群臣之功蕭何為賞首何則高祖論功比獵者之縱狗也狗身獲禽功歸於人群臣手戰其猶狗也蕭何持重其猶人也必據成功謂之賢是則蕭何無功功賞不可以效賢一也夫聖賢之治世也有術得其術則功成失其術則事廢譬猶醫之治病也有方篤劇猶治無方毚微不愈夫方猶術病猶亂醫猶吏藥猶教也方施而藥行術設而教從教從而亂止藥行而病愈治病之醫未必惠於不為醫者然而治國之吏未必賢於不能治國者偶得其方遭曉其術也治國須術以立功亦有時當自亂雖用術功終不立者亦有時當自安雖無術功猶成者故夫治國之人或得時而功成或失時而無效術人能因時以立功不能逆時以致安良醫能治未當死之人命如命窮壽盡方用無驗矣故時當亂也堯舜用術不能立功命當死矣扁鵲行方不能愈病射御巧技百工之人皆以法術然后功成事立效驗可見觀治國百工之類也功立猶事成也謂有功者賢是謂百工皆賢人也趙人吾丘壽王武帝時待詔上使從董仲舒受春秋高才通明於事後為東郡都尉上以壽王之賢不置太守時軍發民騷動歲惡盜賊不息上賜壽王書曰子在朕前時輻湊並至以為天下無雙海內寡二至連十餘城之勢任四千石之重而盜賊浮舩行攻取於庫兵甚不稱在前時何也壽王謝言難禁復召為光祿大夫常居左右論事說議無不是者才高智深通明多見然其為東郡都尉歲惡盜賊不息人民騷動不能禁止不知壽王不得治東郡之術邪亡將東郡適當復亂而壽王之治偶逢其時也夫以壽王之賢治東郡不能立功必以功觀賢則壽王棄而不選也恐必世多如壽王之類而論者以無功不察其賢燕有谷氣寒不生五穀鄒衍吹律致氣既寒更為溫燕以種黍黍生豐熟到今名之曰黍谷夫和陰陽當以道德至誠然而鄒衍吹律寒谷更溫黍穀育生推此以況諸有成功之類有若鄒衍吹律之法故得其術也不肖無不能失其數也賢聖有不治此功不可以效賢二也人之舉事或意至而功不成事不立而勢貫山荊軻醫夏無且是矣荊軻入秦之計本欲劫秦王生致於燕邂逅不偶為秦所擒當荊軻之逐秦王秦王環柱而走醫夏無且以藥囊提荊軻既而天下名軻為烈士秦王賜無且金二百鎰夫為秦所擒生致之功不立藥囊提刺客無益於救主然猶稱賞者意至勢盛也天下之士不以荊軻功不成不稱其義秦王不以無且無見效不賞其志志善不效成功義至不謀就事義有餘效不足志巨大而功細小智者賞之愚者罰之必謀功不察志論陽效不存陰計是則豫讓拔劍斬襄子之衣不足識也伍子胥鞭笞平王尸不足載也張良椎始皇誤中副車不足記也三者道地不便計畫不得有其勢而無其功懷其計而不得為其事是功不可以效賢三也以孝於父弟於兄為賢乎則夫孝弟之人有父兄者也父兄不慈孝弟乃章舜有瞽瞍參有曾晳孝立名成眾人稱之如無父兄父兄慈良無章顯之效孝弟之名無所見矣忠於君者亦與此同龍逢比干忠著夏殷桀紂惡也稷契皋陶忠闇唐虞堯舜賢也故螢火之明掩於日月之光忠臣之聲蔽於賢君之名死君之難出命捐身與此同臣遭其時死其難故立其義而獲其名大賢之涉世也翔而後集色斯而舉亂君之患不累其身危國之禍不及其家安得逢其禍而死其患乎齊侯問於晏子曰忠臣之事其君也若何對曰有難不死出亡不送齊侯曰列地而予之踈爵而貴之君有難不死出亡不送可謂忠乎對曰言而見用終身無難臣奚死焉諫而見從終身不亡臣奚送焉若言不見用有難而死是妄死也諫而不見從出亡而送是詐偽也故忠臣也者能盡善於君不能與陷於難案晏子之對以求賢於世死君之難立忠節者不應科矣是故大賢寡可名之節小賢多可稱之行可得算者小而可得量者少也惡至大算弗能數至多升斛弗能有小少易名之行又發於衰亂易見之世故節行顯而名聲聞也浮於海者迷於東西大也行於溝咸識舟楫之跡小也小而易見衰亂亦易察故世不危亂奇行不見主不悖惑忠節不立鴻卓之義發於顛沛之朝清高之行顯於衰亂之世以全身免害不被刑戮若南容懼白圭者為賢乎則夫免於害者幸而命祿吉也非才智所能禁推行所能卻也神蛇能斷而復屬不能使人弗斷聖賢能困而復通不能使人弗害南容能自免於刑戮公冶以非罪在縲絏伯玉可懷於無道之國文王拘羑里孔子厄陳蔡非行所致之難掩己而至則有不得自免之患累己而滯矣夫不能自免於患者猶不能延命於世也命窮賢不能自續時厄聖不能自免以委國去位棄富貴就貧賤為賢乎則夫委國者有所迫也若伯夷之徒昆弟相讓以國恥有分爭之名及大王亶甫重戰其故民皆委國及去位者道不行而志不得也如道行志得亦不去位故委國去位皆有以也謂之為賢無以者可謂不肖乎且有國位者故得委而去之無國位者何委夫割財用及讓下受分與此同實無財何割口飢何讓倉廩實民知禮節衣食足民知榮辱讓生於有餘爭生於不足人或割財助用袁將軍再與兄子分家財多有以為恩義崑山之下以玉為石彭蠡之濱以魚食犬豕使推讓之人財若崑山之玉彭蠡之魚家財再分不足為也韓信寄食於南昌亭長何財之割顏淵簞食瓢飲何財之讓管仲分財取多無廉讓之節貧乏不足志義廢也以避世離俗清身潔行為賢乎是則委國去位之類也富貴人情所貪高官大位人之所欲樂去之而隱生不遭遇志氣不得也長沮桀溺避世隱居伯夷於陵去貴取賤非其志也以恬憺無欲志不在於仕苟欲全身養性為賢乎是則老聃之徒也道人與賢殊科者憂世濟民於難是以孔子棲棲墨子遑遑不進與孔墨合務而還與黃老同操非賢也以舉義千里師將朋友無廢禮為賢乎則夫家富財饒䈥力勁彊者能堪之匱乏無以舉禮羸弱不能奔遠不能任也是故百金之家境外無絕交千乘之國同盟無廢贈財多故也使穀食如水火雖貪恡之人越境而布施矣故財少則正禮不能舉一有餘則妄施能於千家貧無斗筲之儲者難責以交施矣舉檐千里之人材筴越疆之士手足胼胝面目驪黑無傷感不任之疾筋力皮革必有與人異者矣推此以況為君要證之吏身被疾痛而口無一辭者亦肌肉骨節堅彊之故也堅彊則能隱事而立義軟弱則誣時而毀節豫讓自賊妻不能識貫高被箠身無完肉實體有不與人同者則其節行有不與人鈞者矣以經明帶徒聚眾為賢乎則夫經明儒者是也儒者學之所為也儒者學學儒矣傳先師之業習口說以教無胸中之造思定然否之論郵人之過書門者之傳教也封完書不遺教審令不遺誤者則為善矣儒者傳學不妄一言先師古語到今具存雖帶徒百人以上位博士文學郵人門者之類也以通覽古今祕隱傳記無所不記為賢乎是則儒者之次也才高好事勤學不舍若專成之苗裔有世祖遺文得成其篇業觀覽諷誦若典官文書若太史公及劉子政之徒有主領書記之職則有博覽通達之名矣以權詐卓譎能將兵御眾為賢乎是則韓信之徒也戰國獲其功稱為名將世平能無所施還入禍門矣高鳥死良弓藏狡免得良犬烹權詐之臣高鳥之弓狡免之犬也安平身無宜則弓藏而犬烹安平之主非棄臣而賤士世所用助上者非其宜也向令韓信用權變之才為若叔孫通之事安得謀反誅死之禍哉有功彊之權無守平之智曉將兵之計不見已定之義居平安之時為反逆之謀此其所以功滅國絕不得名為賢也以辯於口言甘辭巧為賢乎則夫子貢之徒是也子貢之辯勝顏淵孔子序置於下實才不能高口辯機利人決能稱之夫自文帝尚多虎圈嗇夫少上林尉張釋之稱周勃張相如文帝乃悟夫辯於口虎圈嗇夫之徒也難以觀賢以敏於筆文墨雨集為賢乎夫筆之與口一實也口出以為言筆書以為文口辯才未必高然則筆敏知未必多也且筆用何為敏以敏於官曹事事之難者莫過於獄獄疑則有請讞蓋世優者莫過張湯張湯文深在漢之朝不稱為賢太史公序累以湯為酷酷非賢者之行魯林中哭婦虎食其夫又食其子不能去者善政不苛吏不暴也夫酷苛暴之黨也難以為賢以敏於賦頌為弘麗之文為賢乎則夫司馬長卿楊子雲是也文麗而務巨言眇而趨深然而不能處定是非辯然否之實雖文如錦繡深如河漢民不覺知是非之分無益於彌為崇實之化以清節自守不降志辱身為賢乎是則避世離俗長沮桀溺之類也雖不離俗節與離世者鈞清其身而不輔其主守其節而不勞其民大賢之在世也時行則行時止則止銓可否之宜以制清濁之行子貢讓而止善子路受而勸德夫讓廉也受則貪也貪有益廉有損推行之節不得常清眇也伯夷無可孔子謂之非操違於聖難以為賢矣或問於孔子曰顏淵何如人也曰仁人也丘不如也子貢何如人也曰辯人也丘弗如也子路何如人也曰勇人也丘弗如也客曰三子者皆賢於夫子而為夫子服役何也孔子曰丘能仁且忍辯且詘勇且怯以三子之能易丘之道弗為也孔子知所設施之矣有高才潔行無知明以設施之則與愚而無操者同一實也夫如是皆有非也無一非者可以為賢乎是則鄉原之人也孟子曰非之無舉也刺之無刺也同於流俗合於污世居之似忠信行之似廉潔眾皆說之自以為是而不可與入堯舜之道故孔子曰鄉原德之賊也似之而非者孔子惡之夫如是何以知實賢知賢竟何用世人之檢苟見才高能茂有成功見效則謂之賢若此甚易知賢何難書曰知人則哲惟帝難之據才高卓異者則謂之賢耳何難之有然而難之獨有難者之故也夫虞舜不易知人而世人自謂能知賢誤也然則賢者竟不可知乎曰易知也而稱難者不見所以知之則雖聖人不易知也及見所以知之中才而察之譬猶工匠之作器也曉之則無難不曉則無易賢者易知於作器世無別故真賢集於俗士之間俗士以辯惠之能據官爵之尊望顯盛之寵遂專為賢之名賢者還在閭巷之間貧賤終老被無驗之謗若此何時可知乎然而必欲知之觀善心也夫賢者才能未必高也而心明智力未必多而舉是何以觀心必以言有善心則有善言以言而察行有善言則有善行矣言行無非治家親戚有倫治國則尊卑有序無善心者白黑不分善惡同倫政治錯亂法度失平故心善無不善也心不善無能善心善則能辯然否然否之義定心善之效明雖貧賤困窮功不成而效不立猶為賢矣故治不謀功要所用者是行不責效期所為者正正是審明則言不須繁事不須多故曰言不務多務審所謂行不務遠務審所由言得道理之心口雖訥不辯辯在胸臆之內矣故人欲心辯不欲口辯心辯則言醜而不違口辯則辭好而無成孔子稱少正卯之惡曰言非而博順非而澤內非而外以才能飾之眾不能見則以為賢夫內非外飾是世以為賢則夫內是外無以自表者眾亦以為不肖矣是非亂而不治聖人獨知之人言行多若少正卯之類賢者獨識之世有是非錯繆之言亦有審誤紛亂之事決錯繆之言定紛亂之事唯賢聖之人為能任之聖心明而不闇賢心理而不亂用明察非非無不見用理銓疑疑無不定與世殊指雖言正是眾不曉見何則沉溺俗言之日久不能自還以從實也是故正是之言為眾所非離俗之禮為世所譏管子曰君子言堂滿堂言室滿室怪此之言何以得滿如正是之言出堂之人皆有正是之知然后乃滿如非正是人之乖剌異安得為滿夫歌曲妙者和者則寡言得實者然者則鮮和歌與聽言同一實也曲妙人不能盡和言是人不能皆信魯文公逆祀去者三人定公順祀畔者五人貫於俗者則謂禮為非曉禮者寡則知是者希君子言之堂室安能滿夫人不謂之滿世則不得見口談之實語筆墨之餘跡陳在簡筴之上乃可得知故孔子不王作春秋以明意案春秋虛文業以知孔子能王之德孔子聖人也有若孔子之業者雖非孔子之才斯亦賢者之實驗也夫賢與聖同軌而殊名賢可得定則聖可得論也問周道不弊孔子不作春秋春秋之作起周道弊也如周道不弊孔子不作者未必無孔子之才無所起也夫如是孔子之作春秋未可以觀聖有若孔子之業者未可知賢也曰周道弊孔子起而作之文義褒貶是非得道理之實無非僻之誤以故見孔子之賢實也夫無言則察之以文無文則察之以言設孔子不作猶有遺言言必有起猶文之必有為也觀文之是非不顧作之所起世間為文者眾矣是非不分然否不定桓君山論之可謂得實矣論文以察實則君山漢之賢人也陳平未仕割肉閭里分均若一能為丞相之驗也夫割肉與割文同一實也如君山得執漢平用心與為論不殊指矣孔子不王素王之業在於春秋然則桓君山不相素丞相之跡存於新論者也
