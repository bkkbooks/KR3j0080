body:
  text: 知實篇凡論事者違實不引效驗則雖甘義繁說衆不見信論聖人不能神而先知先知之間不能獨見非徒空說虛言直以才智准況之工也事有證驗以效實然何以明之孔子問公叔文子於公明賈曰信乎夫子不言不笑不取有諸對曰以告者過也夫子時然后言人不厭其言樂然后笑人不厭其笑義然后取人不厭其取孔子曰豈其然乎豈其然乎天下之人有如伯夷之廉不取一芥於人未有不言不笑者也孔子既不能如心揣度以決然否心怪不信又不能達視遙見以審其實問公明賈乃知其情孔子不能先知一也陳子禽問子貢曰夫子至於是邦也必聞其政求之與抑與之與子貢曰夫子溫良恭儉讓以得之溫良恭儉讓尊行也有尊行於人人親附之人親附之則人告語之矣然則孔子聞政以人言不神而自知之也齊景公問子貢曰夫子賢乎子貢對曰夫子乃聖豈徒賢哉景公不知孔子聖子貢正其名子禽亦不知孔子所以聞政子貢定其實對景公云夫子聖豈徒賢哉則其對子禽亦當云神而自知之不聞人言以子貢對子禽言之聖人不能先知二也顏淵炊飯塵落甑中欲置之則不清投地則棄飯掇而食之孔子望見以為竊食聖人不能先知三也塗有狂夫投刃而候澤有猛虎厲牙而望知見之者不敢前進如不知見則遭狂夫之刃犯猛虎之牙矣匡人之圍孔子孔子如審先知當早易道以違其害不知而觸之故遇其患以孔子圍言之聖人不能先知四也子畏於匡顏淵後孔子曰吾以汝為死矣如孔子先知當知顏淵必不觸害匡人必不加悖見顏淵之來乃知不死未來之時謂以為死聖人不能先知五也陽貨欲見孔子孔子不見饋孔子豚孔子時其亡也而往拜之遇諸塗孔子不欲見既往候時其亡是勢必不欲見也反遇於路以孔子遇陽虎言之聖人不能先知六也長沮桀溺耦而耕孔子過之使子路問津焉如孔子知津不當更問論者曰欲觀隱者之操則孔子先知當自知之無為觀也如不知而問之是不能先知七也孔子母死不知其父墓殯於五甫之衢人見之者以為葬也蓋以無所合葬殯之謹故人以為葬也鄰人鄒曼甫之母告之然后得合葬於防有塋自在防殯於衢路聖人不能先知八也既得合葬孔子反門人後雨甚至孔子問曰何遲也曰防墓崩孔子不應三孔子泫然流涕曰吾聞之古不修墓如孔子先知當先知防墓崩比門人至宜流涕以俟之人至乃知之聖人不能先知九也子入太廟每事問不知故問為人法也孔子未嘗入廟廟中禮器衆多非一孔子雖聖何能知之論者曰以嘗見實已知而復問為人法孔子曰疑思問疑乃當問邪實已知當復問為人法孔子知五經門人從之學當復行問以為人法何故專口授弟子乎不以已知五經復問為人法獨以已知太廟復問為人法聖人用心何其不一也以孔子入太廟言之聖人不能先知十也主人請賓飲食若呼賓頓若舍賓如聞其家有輕子泊孫必教親徹饌退膳不得飲食閉館關舍不得頓賓之執計則必不往何則知請呼無喜空行勞辱也如往無喜勞辱復還不知其家不曉其實人實難知吉凶難圖如孔子先知宜知諸侯惑於讒臣必不能用空勞辱己聘召之到宜寢不往君子不為無益之事不履辱身之行無為周流應聘以取削跡之辱空說非主以犯絶糧之厄由此言之近不能知論者曰孔子自知不用聖思閔道不行民在塗炭之中庶幾欲佐諸侯行道濟民故應聘周流不避患恥為道不為己故逢患而不惡為民不為名故蒙謗而不避曰此非實也孔子曰吾自衛反魯然後樂正雅頌各得其所是謂孔子自知時也何以自知魯衛天下最賢之國也魯衛不能用己則天下莫能用己也故退作春秋刪定詩書以自衛反魯言之知行應聘時未自知也何則無兆象效驗聖人無以定也魯衛不能用自知極也魯人獲麟自知絶也道極命絶兆象著明心懷望沮退而幽思夫周流不休猶病未死禱卜使痊也死兆未見冀得活也然則應聘未見絶證冀得用也死兆見舍卜還醫絶攬筆定書以應聘周流言之聖人不能先知十一也孔子曰游者可為綸走者可為矰至於龍吾不知其乘雲風上升今日見老子其猶龍邪聖人知物知事老子與龍人物也所從上下事也何故不知如老子神龍亦神聖人亦神神者同道精氣交連何故不知以孔子不知龍與老子言之聖人不能先知十二也孔子曰孝哉閔子騫人不間於其父母昆弟之言虞舜大聖隱藏骨肉之過宜愈子騫瞽叟與象使舜治廩浚井意欲殺舜當見殺己之情早諫豫止既無如何宜避不行若病不為何故使父與弟得成殺己之惡使人聞非父弟萬世不滅以虞舜不豫見聖人不能先知十三也武王不豫周公請命壇墠既設策祝已畢不知天之許己與不乃卜三龜三龜皆吉如聖人先知周公當知天已許之無為頓復卜三龜知聖人不以獨見立法則更請命祕藏不見天意難知故卜而合兆兆決心定乃以從事聖人不能先知十四也晏子聘於魯堂上不趨晏子趨授玉不跪晏子跪門人怪而問於孔子孔子不知問於晏子晏子解之孔子乃曉聖人不能先知十五也陳賈問於孟子曰周公何人也曰聖人使管叔監殷管叔畔也二者有諸曰然周公知其畔而使不知而使之與曰不知也然則聖人且有過與曰周公弟也管叔兄也周公之過也不亦宜乎孟子實事之人也言周公之聖處其下不能知管叔之畔聖人不能先知十六也孔子曰賜不受命而貨殖焉億則屢中罪子貢善居積意貴賤之期數得其時故貨殖多富比陶朱然則聖人先知也子貢億數中之類也聖人據象兆原物類意而得之其見變名物博學而識之巧商而善意廣見而多記由微見較若揆之今睹千載所謂智如淵海孔子見竅睹微思慮洞達材智兼倍彊力不倦超踰倫等耳目非有達視之明知人所不知之狀也使聖人達視遠見洞聽潛聞與天地談與鬼神言知天上地下之事乃可謂神而先知與人卓異今耳目聞見與人無別遭事睹物與人無異差賢一等爾何以謂神而卓絶夫聖猶賢也人之殊者謂之聖則聖賢差小大之稱非絶殊之名也何以明之齊桓公與管仲謀伐莒謀未發而聞於國桓公怪之問管仲曰與仲甫謀伐莒未發聞於國其故何也管仲曰國必有聖人也少頃當東郭牙至管仲曰此必是已乃令賓者延而上之分級而立管仲曰子邪言伐莒者對曰然管仲曰我不言伐莒子何故言伐莒對曰臣聞君子善謀小人善意臣竊意之也管仲曰我不言伐莒子何以意之對曰臣聞君子有三色歡然喜樂者鍾鼓之色愁然清淨者衰絰之色怫然充滿手足矜者兵革之色君口垂不噞所言莒也君舉臂而指所當又莒也臣竊虞國小諸侯不服者其唯莒乎臣故言之夫管仲上智之人也其別物審事矣云國必有聖人者至誠謂國必有也東郭牙至云此必是已謂東郭牙聖也如賢與聖絶輩管仲知時無十二聖之黨當云國必有賢者無為言聖也謀未發而聞於國管仲謂國必有聖人是謂聖人先知也及見東郭牙云此必是已謂賢者聖也東郭牙知之審是與聖人同也客有見淳于髡於梁惠王者再見之終無言也惠王怪之以讓客曰子之稱淳于生言管晏不及及見寡人寡人未有得也寡人未足為言邪客以謂髡髡曰固也吾前見王志在遠後見王志在音吾是以默然客具報王大駭曰嗟乎淳于生誠聖人也前淳于生之來人有獻龍馬者寡人未及視會生至後來人有獻謳者未及試亦會生至寡人雖屏左右私心在彼夫髡之見惠王在遠與音也雖湯禹之察不能過也志在胸臆之中藏匿不見髡能知之以髡等為聖則髡聖人也如以髡等非聖則聖人之知何以過髡之知惠王也觀色以窺心皆有因緣以准的之楚靈王會諸侯鄭子産曰魯邾宋衛不來及諸侯會四國果不至趙堯為符璽御史趙人方與公謂御史大夫周昌曰君之史趙堯且代君位其後堯果為御史大夫然則四國不至子産原其理也趙堯之為御史大夫方與公睹其狀也原理睹狀處著方來有以審之也魯人公孫臣孝文皇帝時上書言漢土德其符黃龍當見後黃龍見成紀然則公孫臣知黃龍將出案律歷以處之也賢聖之知事宜驗矣賢聖之才皆能先知其先知也任術用數或善商而巧意非聖人空知神怪與聖賢殊道異路也聖賢知不踰故用思相出入遭事無神怪故名號相貿易故夫賢聖者道德智能之號神者眇茫恍惚無形之實實異質不得同實鈞效不得殊聖神號不等故謂聖者不神神者不聖東郭牙善意以知國情子貢善意以得貨利聖人之先知子貢東郭牙之徒也與子貢東郭同則子貢東郭之徒亦聖也夫如是聖賢之實同而名號殊未必才相懸絶智相兼倍也太宰問於子貢曰夫子聖者歟何其多能也子貢曰故天縱之將聖又多能也將者且也不言已聖言且聖者以為孔子聖未就也夫聖若為賢矣治行厲操操行未立則謂且賢今言且聖聖可為之故也孔子曰吾十有五而志于學三十而立四十而不惑五十而知天命六十而耳順從知天命至耳順學就知明成聖之驗也未五十六十之時未能知天命至耳順也則謂之且矣當子貢答太宰時殆三十四十之時也魏昭王問於田詘曰寡人在東宮之時聞先生之議曰為聖易有之乎田詘對曰臣之所學也昭王曰然則先生聖乎田詘曰未有功而知其聖者堯之知舜也待其有功而後知其聖者市人之知舜也今詘未有功而王問詘曰若聖乎敢問王亦其堯乎夫聖可學為故田詘謂之易如卓與人殊稟天性而自然焉可學而為之安能成田詘之言為易聖未必能成田詘之言為易未必能是言臣之所學蓋其實也賢可學為勞佚殊故賢聖之號仁智共之子貢問於孔子夫子聖矣乎孔子曰聖則吾不能我學不饜而教不倦子貢曰學不饜者智也教不倦者仁也仁且智夫子既聖矣由此言之仁智之人可謂聖矣孟子曰子夏子游子張得聖人之一體冉牛閔子騫顏淵具體而微六子在其世皆有聖人之才或頗有而不具或備有而不明然皆稱聖人聖人可勉成也孟子又曰非其君不事非其民不使治則進亂則退伯夷也何事非君何使非民治亦進亂亦進伊尹也可以仕則仕可以已則已可以久則久可以速則速孔子也皆古之聖人也又曰聖人百世之師也伯夷柳下惠是也故聞伯夷之風者頑夫廉懦夫有立志聞柳下惠之風者薄夫敦鄙夫寬奮乎百世之上百世之下聞之者莫不興起非聖而若是乎而況親炙之乎夫伊尹伯夷柳下惠不及孔子而孟子皆曰聖人者賢聖同類可以共一稱也宰豫曰以豫觀夫子賢於堯舜遠矣孔子聖宜言聖於堯舜而言賢者聖賢相出入故其名稱相貿易也
