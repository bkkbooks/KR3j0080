body:
  text: 龍虛篇盛夏之時雷電擊折破樹木發壞室屋俗謂天取龍謂龍藏於樹木之中匿於屋室之間也雷電擊折樹木發壞屋室則龍見於外龍見雷取以升天世無愚智賢不肖皆謂之然如考實之虛妄言也夫天之取龍何意邪如以龍神為天使猶賢臣為君使也反報有時無為取也如以龍遁逃不還非神之行天亦無用為也如龍之性當在天在天上者固當生子無為復在地如龍有升降降龍生子於地子長大天取之則世名雷電為天怒取龍之子無為怒也且龍之所居常在水澤之中不在木中屋間何以知之叔向之母曰深山大澤實生龍蛇傳曰山致其高雲雨起焉水致其深蛟龍生焉傳又言禹渡於江黃龍負船荊次非渡淮兩龍繞舟東海之上有丘欣勇而有力出過神淵使御者飲馬馬飲因沒欣怒拔劍入淵追馬見兩蛟方食其馬手劍擊殺兩蛟由是言之蛟與龍常在淵水之中不在木中屋間明矣在淵水之中則魚鱉之類魚鱉之類何為上天天之取龍何用為哉如以天神乘龍而行神恍惚無形出入無門無為乘龍也如仙人騎龍天為仙者取龍則仙人含天精氣形輕飛騰若鴻鵠之狀無為騎龍也世稱黃帝騎龍升天此言蓋虛猶今謂天取龍也且世謂龍升天者必謂龍神不神不升天升天神之效也天地之性人為貴則龍賤矣貴者不神賤者反神乎如龍之性有神與不神神者升天不神者不能龜蛇亦有神與不神神龜神蛇復升天乎且龍稟何氣而獨神天有倉龍白虎朱鳥玄武之象也地亦有龍虎鳥龜之物四星之精降生四獸虎鳥與龜不神龍何故獨神也人為倮蟲之長龍為鱗蟲之長俱為物長謂龍升天人復升天乎龍與人同獨謂龍升天者謂龍神也世或謂聖人神而先知猶謂神龍能升天也因謂聖人先知之明論龍之才謂龍升天故其宜也天地之間恍惚無形寒暑風雨之氣乃為神今龍有形有形則行行則食食則物之性也天地之性有形體之類能行食之物不得為神何以言之龍有體也傳言鱗蟲三百龍為之長龍為鱗蟲之長安得無體何以言之龍行食也孔子曰龍食於清游於清龜食於清游於濁魚食於濁游於清丘上不及龍下不為魚中止其龜與山海經言四海之外有乘龍蛇之人世俗畫龍之象馬首蛇尾由此言之馬蛇之類也慎子曰蜚龍乘雲騰蛇游霧雲罷霧霽與蚓蟻同矣韓子曰龍之為蟲也鳴可狎而騎也然其喉下有逆鱗尺餘人或嬰之必殺人矣比之為蚓蟻又言蟲可狎而騎蛇馬之類明矣傳曰紂作象箸而箕子泣泣之者痛其極也夫有象箸必有玉杯玉杯所盈象箸所挾則必龍肝豹胎夫龍肝可食其龍難得難得則愁下愁下則禍生故從而痛之如龍神其身不可得殺其肝何可得食禽獸肝胎非一稱龍肝豹胎者人得食而知其味美也春秋之時龍見于絳郊魏獻子問於蔡墨曰吾聞之蟲莫智於龍以其不生得也謂之智信乎對曰人實不知非龍實智古者畜龍故國有豢龍氏有御龍氏獻子曰是二者吾亦聞之而不知其故是何謂也對曰昔有飂叔安有裔子曰董父實甚好龍能求其嗜欲以飲食之龍多歸之乃擾畜龍以服事舜而錫之姓曰董氏曰豢龍封諸鬷川鬷夷氏是其後也故帝舜氏世有畜龍及有夏孔甲擾于帝帝賜之乘龍河漢各二各有雌雄孔甲不能食也而未獲豢龍氏有陶唐氏既衰其後有劉纍學擾龍于豢龍氏以事孔甲能飲食龍夏后嘉之賜氏曰御龍以更豕韋之後龍一雌死潛醢以食夏后夏后享之既而使求之懼而不得遷于魯縣范氏其後也獻子曰今何故無之對曰夫物物有其官官修其方朝夕思之一日失職則死及之失官不食官宿其業其物乃至若泯棄之物乃低伏鬱湮不育由此言之龍可畜又可食也可食之物不能神矣世無其官又無董父后劉之人故潛藏伏匿出見希疏出又乘雲與人殊路人謂之神如存其官而有其人則龍牛之類也何神之有以山海經言之以慎子韓子證之以俗世之畫驗之以箕子之泣訂之以蔡墨之對論之知龍不能神不能升天天不以雷電取龍明矣世俗言龍神而升天者妄矣世俗之言亦有緣也短書言龍無尺木無以升天又曰升天又言尺木謂龍從木中升天也彼短書之家世俗之人也見雷電發時龍隨而起當雷電樹木擊之時龍適與雷電俱在樹木之側雷電去龍隨而上故謂從樹木之中升天也實者雷龍同類感氣相致故易曰雲從龍風從虎又言虎嘯谷風至龍興景雲起龍與雲相招虎與風相致故董仲舒雩祭之法設土龍以為感也夫盛夏太陽用事雲雨干之太陽火也雲雨水也水火激薄則鳴而為雷龍聞雷聲則起起而雲至雲至而龍乘之雲雨感龍龍亦起雲而升天天極雷高雲消復降人見其乘雲則謂升天見天為雷電則為天取龍世儒讀易文見傳言皆知龍者雲之類拘俗人之議不能通其說又見短書為證故遂謂天取龍天不取龍龍不升天當丘欣之殺兩蛟也手把其尾拽而出之至淵之外雷電擊之蛟則龍之類也蛟龍見而雲雨至雲雨至則雷電擊如以天實取龍龍為天用何以死蛟為取之且魚在水中亦隨雲雨蜚而乘雲雨非升天也龍魚之類也其乘雷電猶魚之飛也魚隨雲雨不謂之神龍乘雷電獨謂之神世俗之言失其實也物在世間各有所乘魚乘水蛇乘霧龍乘雲鳥乘風見龍乘雲獨謂之神失龍之實誣龍之能也然則龍之所以為神者以能屈伸其體存亡其形屈伸其體存亡其形未足以為神也豫讓吞炭漆身為厲人不識其形子貢滅鬚為婦人人不知其狀龍變體自匿人亦不能覺變化藏匿者巧也物性亦有自然狌狌知往乾鵲知來鸚鵡能言三怪比龍性變化也如以巧為神豫讓子貢神也孔子曰游者可為網飛者可為矰至於龍也吾不知其乘風雲上升今日見老子其猶龍乎夫龍乘雲而上雲消而下物類可察上下可知而云孔子不知以孔子之聖尚不知龍況俗人智淺有好奇之性無實可之心謂之龍神而升天不足怪也
