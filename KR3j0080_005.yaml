body:
  text: 幸偶篇凡人操行有賢有愚及遭禍福有幸有不幸舉事有是有非及觸賞罰有偶有不偶並時遭兵隱者不中同日被霜蔽者不傷中傷未必惡隱蔽未必善隱蔽幸中傷不幸俱欲納忠或賞或罰並欲有益或信或疑賞而信者未必真罰而疑者未必僞賞信者偶罰疑不偶也孔子門徒七十有餘顏回蚤夭孔子曰不幸短命死矣短命稱不幸則知長命者幸也短命者不幸也服聖賢之道講仁義之業宜蒙福祐伯牛有疾亦復顏回之類俱不幸也螻蟻行於地人舉足而涉之足所履螻蟻笮死足所不蹈全活不傷火燔野草車轢所致火所不燔俗或喜之名曰幸草夫足所不蹈火所不及未必善也舉火行道適然也由是以論癰疽之發亦一實也氣結閼積聚為癰潰為疽創流血出膿豈癰疽所發身之善穴哉營衛之行遇不通也蜘蛛結網蜚蟲過之或脫或獲獵者或羅百獸群擾或得或失漁者罾江湖之魚或存或亡或姦盜大辟而不知或罰贖小罪而發覺災氣加人亦此類也不幸遭觸而死幸者免脫而生不幸者不徼幸也孔子曰人之生也直罔之生也幸則夫順道而觸者為不幸矣立巖墻之下為壞所壓蹈坼岸之上為崩所墜輕遇無端故為不幸魯城門久朽欲頓孔子過之趨而疾行左右曰久矣孔子曰惡其久也孔子戒慎已甚如過遭壞可謂不幸也故孔子曰君子有不幸而無有幸小人有幸而無不幸又曰君子處易以俟命小人行險以徼幸佞幸之徒閎藉孺之輩無德薄才以色稱媚不宜愛而受寵不當親而得附非道理之宜故太史公為之作傳邪人反道而受恩寵與此同科故合其名謂之佞幸無德受恩無過遇禍同一實也俱稟元氣或獨為人或為禽獸並為人或貴或賤或貧或富富或纍金貧或乞食貴至封侯賤至奴僕非天稟施有左右也人物受性有厚薄也俱行道德禍福不均並為仁義利害不同晉文修文德徐偃行仁義文公以賞賜偃王以破滅魯人為父報仇安行不走追者捨之牛缺為盜所奪和意不恐盜還殺之文德與仁義同不走與不恐等然文公魯人得福偃王牛缺得禍者文公魯人幸而偃王牛缺不幸也韓昭侯醉臥而寒典冠加之以衣覺而問之知典冠愛己也以越職之故加之以罪衛之驂乘者見御者之過從後呼車有救危之義不被其罪夫驂乘之呼車典冠之加衣同一意也加衣恐主之寒呼車恐君之危仁惠之情俱發於心然而於韓有罪於衛為忠驂乘偶典冠不偶也非唯人行物亦有之長數仞之竹大連抱之木工技之人裁而用之或成器而見舉持或遺材而遭廢棄非工伎之人有愛憎也刀斧之加有偶然也蒸穀為飯釀飯為酒酒之成也甘苦異味飯之熟也剛柔殊和非庖廚酒人有意異也手指之調有偶適也調飯也殊筐而居甘酒也異器而處蟲墯一器酒棄不飲鼠涉一筐飯捐不食夫百草之類皆有補益遭醫人采掇成為良藥或遺枯澤為火所燎等之金也或為劍戟或為鋒銛同之木也或梁於宮或柱於橋俱之火也或爍脂燭或燔枯草均之土也或基殿堂或塗軒戶皆之水也或溉鼎釜或澡腐臭物善惡同遭為人用其不幸偶猶可傷痛況含精氣之徒乎虞舜聖人也在世宜蒙全安之福父頑母嚚弟象敖狂無過見憎不惡而得罪不幸甚矣孔子舜之次也生無尺土周流應聘削迹絶糧俱以聖才並不幸偶舜尚遭堯受禪孔子已死於闕里以聖人之才猶不幸偶庸人之中被不幸偶禍必衆多矣
