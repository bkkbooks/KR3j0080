body:
  text: 雷虛篇盛夏之時雷電迅疾擊折樹木壞敗室屋時犯殺人世俗以為擊折樹木壞敗室屋者天取龍其犯殺人也謂之有陰過飲食人以不潔淨天怒擊而殺之隆隆之聲天怒之音也若人之詬吁矣世無愚智莫謂不然推人道以論之虛妄之言也夫雷之發動一氣一聲也折木壞屋亦犯殺人犯殺人時亦折木壞屋獨謂折木壞屋者天取龍犯殺人罰陰過與取龍吉凶不同並時共聲非實道也論者以為隆隆者天怒詬吁之聲也此便於罰過不宜於取龍罰過天怒可也取龍龍何過而怒之如龍神天取之不宜怒如龍有過與人同罪殺龍而已何為取也殺人怒可也取龍龍何過而怒之殺人不取殺龍取之人龍之罪何別而其殺之何異然則取龍之説既不可聽罰過之言復不可從何以效之案雷之聲迅疾之時人仆死於地隆隆之聲臨人首上故得殺人審隆隆者天怒乎怒用口口之怒氣殺人也口之怒氣安能殺人人為雷所殺詢其身體若燔灼之狀也如天用口怒口怒生火乎且口著乎體口之動與體俱當擊折之時聲著于地其衰也聲著于天夫如是聲著地之時口至地體亦宜然當雷聲迅疾之時仰視天不見天之下不見天之下則夫隆隆之聲者非天怒也天之怒與人無異人怒身近人則聲疾遠人則聲微今天聲近其體遠非怒之實也且雷聲迅疾之時聲東西或南北如天怒體動口東西南北仰視天亦宜東西南北或曰天已東西南北矣雲雨冥晦人不能見耳夫千里不同風百里不共雷易曰震驚百里雷電之地雷雨晦冥百里之外無雨之處宜見天之東西南北也口著於天天宜隨口口一移普天皆移非獨雷雨之地天隨口動也且所謂怒者誰也天神邪蒼蒼之天也如謂天神神怒無聲如謂蒼蒼之天天者體不怒怒用口且天地相與夫婦也其即民父母也子有過父怒笞之致死而母不哭乎今天怒殺人地宜哭之獨聞天之怒不聞地之哭如地不能哭則天亦不能怒且有怒則有喜人有陰過亦有陰善有陰過天怒殺之如有陰善天亦宜喜以賞之隆隆之聲謂天之怒亦如天之喜哂然而笑人有喜怒故謂天喜怒推人以知天知天本於人如人不怒則亦無緣謂天怒也緣人以知天宜盡人之性人性怒則詬吁喜則歌笑比聞天之怒希聞天之喜比見天之罰希見天之賞豈天怒不喜希貪於罰於賞哉何怒罰有效喜賞無驗也且雷之擊也折木壞屋時犯殺人以為天怒時或徒雷無所折敗亦不殺人天空怒乎人君不空喜怒喜怒必有賞罰無所罰而空怒是天妄也妄則失威非天行也政事之家以寒溫之氣為喜怒之候人君喜即天溫怒則天寒雷電之日天必寒也高祖之先劉媼曾息大澤之陂夢與神遇此時雷電晦冥天方施氣宜喜之時也何怒而雷如用擊折者為怒不擊折者為喜則夫隆隆之聲不宜同音人怒喜異聲天怒喜同音與人乖異則人何緣謂之天怒且飲食人以不潔淨小過也以至尊之身親罰小過非尊者之宜也尊不親罰過故王不親誅罪天尊於王親罰小過是天德劣於王也且天之用心猶人之用意人君罪惡初聞之時怒以非之及其誅之哀以憐之故論語曰如得其情則哀憐而勿喜紂至惡也武王將誅哀而憐之故尚書曰豫惟率夷憐爾人君誅惡憐而殺之天之罰過怒而擊之是天少恩而人多惠也説雨者以為天施氣天施氣氣渥為雨故雨潤萬物名曰澍人不喜不施恩天不説不降雨謂雷天怒雨者天喜也雷起常與雨俱如論者之言天怒且喜也人君賞罰不同日天之怒喜不殊時天人相違賞罰乖也且怒喜具形亂也惡人為亂怒罰其過罰之以亂非天行也冬雷人謂之陽氣泄春雷謂之陽氣發夏雷不謂陽氣盛謂之天怒竟虛言也人在天地之間物也物亦物也物之飲食天不能知人之飲食天獨知之萬物於天皆子也父母於子恩德一也豈為貴賢加意賤愚不察乎何其察人之明省物之暗也犬豕食人以腐臭食之天不殺也如以人貴而獨禁之則鼠汙人飲食人不知誤而食之天不殺也如天能原鼠則亦能原人人誤以不潔淨飲食人人不知而食之耳豈故舉腐臭以豫之哉如故豫之人亦不肯食呂后斷戚夫人手去其眼置於廁中以為人豕呼人示之人皆傷心惠帝見之疾臥不起呂后故為天不罰也人誤不知天輒殺之不能原誤反而貰故天治悖也夫人食不淨之物口不知人其汙也如食己知之名曰腸汙戚夫人入廁身體辱之與汙何以別腸之與體何以異為腸不為體傷汙不病辱非天意也且人聞人食不清之物心平如故觀戚夫人者莫不傷心人傷天意悲矣夫悲戚夫人則怨呂后案呂后之崩未必遇雷也道士劉春熒惑楚王英使食不清春死未必遇雷也建初四年夏六月雷擊殺會稽鄞專日食羊五頭皆死夫羊有何陰過而雷殺之舟人汙溪上流人飲下流舟人不雷死天神之處天猶王者之居也王者居重關之內則天之神宜在隱匿之中王者居宮室之內則天亦有太微紫宮軒轅文昌之坐王者與人相遠不知人之陰惡天神在四宮之內何能見人暗過王者聞人過以人知天知人惡亦宜因鬼使天問過於鬼神則其誅之宜使鬼神如使鬼神則天怒鬼神也非天也且王斷刑以秋天之殺用夏此王者用刑違天時奉天而行其誅殺也宜法象上天天殺用夏王誅以秋天人相違非奉天之義也或論曰飲食人不潔淨天之大惡也殺大惡不須時王者大惡謀反大逆無道也天之大惡飲食人不潔清天之所惡小大不均等也如小大同王者宜法天制飲食人不潔清之法為死刑也聖王有天下制刑不備此法聖王闕略有遺失也或論曰鬼神治陰王者治陽陰過暗昧人不能覺故使鬼神主之曰陰過非一也何不盡殺案一過非治陰之義也天怒不旋日人怨不旋踵人有陰過或時有用冬未必專用夏也以冬過誤不輒擊殺遠至於夏非不旋日之意也圖畫之工圖雷之狀纍纍如連鼓之形又圖一人若力士之容謂之雷公使之左手引連鼓右手推之若擊之狀其意以為雷聲隆隆者連鼓相扣擊之音也其魄然若敝裂者椎所擊之聲也其殺人也引連鼓相椎并擊之矣世人信之莫謂不然如復原之虛妄之象也夫雷非聲則氣也聲與氣安可推引而為連鼓之形乎如審可推引則是物也相扣而音鳴者非鼓即鍾也夫隆隆之聲鼓與鍾邪如審是也鍾鼓而不空懸須有筍虡然後能安然后能鳴今鍾鼓無所懸著雷公之足無所蹈履安得而為雷或曰如此固為神如必有所懸著足有所履然後而為雷是與人等也何以為神曰神者恍惚無形出入無門上下無垠故謂之神今雷公有形雷聲有器安得為神如無形不得為之圖象如有形不得謂之神謂之神龍升天實事者謂之不然以人時或見龍之形也以其形見故圖畫升龍之形也以其可畫故有不神之實難曰人亦見鬼之形鬼復神乎曰人時見鬼有見雷公者乎鬼名曰神其行蹈地與人相似雷公頭不懸於天足不蹈於地安能為雷公飛者皆有翼物無翼而飛謂仙人畫仙人之形為之作翼如雷公與仙人同宜復著翼使雷公不飛圖雷家言其飛非也使實飛不為著翼又非也夫如是圖雷之家畫雷之狀皆虛妄也且説雷之家謂雷天怒詬吁也圖雷之家謂之雷公怒引連鼓也審如説雷之家則圖雷之家非審如圖雷之家則説雷之家誤二家相違也并而是之無是非之分無是非之分故無是非之實無以定疑論故虛妄之論勝也禮曰刻尊為雷之形一出一入一屈一伸為相校軫則鳴校軫之狀鬱律嵔壘之類也此象類之矣氣相校軫分裂則隆隆之聲校軫之音也魄然若襒裂者氣射之聲也氣射中人人則死矣實説雷者太陽之激氣也何以明之正月陽動故正月始雷五月陽盛故五月雷迅秋冬陽衰故秋冬雷潛盛夏之時太陽用事陰氣乘之陰陽分爭則相校軫校軫則激射激射為毒中人輒死中木木折中屋屋壞人在木下屋間偶中而死矣何以驗之試以一斗水灌冶鑄之火氣激襒裂若雷之音矣或近之必灼人體天地為爐大矣陽氣為火猛矣雲雨為水多矣分爭激射安得不迅中傷人身安得不死當冶工之消鐵也以土為形燥則鐵下不則躍溢而射射中人身則皮膚灼剝陽氣之熱非直消鐵之烈也陰氣激之非直土泥之濕也激氣中人非直灼剝之痛也夫雷火也火氣剡人人不得無迹如炙處狀似文字人見之謂天記書其過以示百姓是復虛妄也使人盡有過天用雷殺人殺人當彰其惡以懲其後明著其文字不當暗昧圖出於河書出於洛河圖洛書天地所為人讀知之今雷死之書亦天所為也何故難知如以一人皮不可書魯惠公夫人仲子宋武公女也生而有文在掌曰為魯夫人文明可知故仲子歸魯雷書不著故難以懲後夫如是火剡之迹非天所刻畫也或頗有而增其語或無有而空生其言虛妄之俗好造怪奇何以驗之雷者火也以人中雷而死即詢其身中頭則鬚髮燒燋中身則皮膚灼燌臨其尸上聞火氣一驗也道術之家以為雷燒石色赤投於井中石燋井寒激聲大鳴若雷之狀二驗也人傷於寒寒氣入腹腹中素溫溫寒分爭激氣雷鳴三驗也當雷之時電光時見大火若人之耀四驗也當雷之擊時或燔人室屋及地草木五驗也夫論雷之為火有五驗言雷為天怒無一效然則雷為天怒虛妄之言雖難曰論語云迅雷風烈必變禮記曰有疾風迅雷甚雨則必變雖夜必興衣服冠而坐懼天怒畏罰及己也如雷不為天怒其擊不為罰過則君子何為為雷變動朝服而正坐子乎曰天之與人猶父子有父為之變子安能忽故天變己亦宜變順天時示己不違也人聞犬聲於外莫不驚駭竦身側耳以審聽之況聞天變異常之聲軒軯迅疾之音乎論語所指禮記所謂皆君子也君子重慎自知無過如日月之蝕無陰暗食人以不潔清之事內省不懼何畏於雷如審不畏雷則其變動不足以效天怒何則不為己也如審畏雷亦不足以效罰陰過何則雷之所擊多無過之人君子恐偶遇之故恐懼變動夫如是君子變動不能明雷為天怒而反著雷之妄擊也妄擊不罰過故人畏之如審罰過有過之人乃當懼耳君子之人無為恐也宋王問唐鞅曰寡人所殺戮者衆矣而群臣愈不畏其故何也唐鞅曰王之所罪盡不善者也罰不善善者胡為畏王欲群臣之畏也不若毋辨其善與不善而時罪之若此斯群臣畏矣宋王行其言群臣畏懼宋國大恐夫宋王妄刑故宋國大恐懼雷電妄擊故君子變動君子變動宋國大恐之類也
