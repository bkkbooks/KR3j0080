body:
  text: 異虛篇殷高宗之時桑榖俱生於朝七日而大拱高宗召其相而問之相曰吾雖知之弗能言也問祖己祖己曰夫桑榖者野草也而生於朝意朝亡乎高宗恐駭側身而行道思索先王之政明養老之義興滅國繼絶世舉佚民桑榖亡三年之後諸侯以譯來朝者六國遂享百年之福高宗賢君也而感桑榖生而問祖己行祖己之言修政改行桑榖之妖亡諸侯朝而年長久修善之義篤故瑞應之福渥此虛言也祖己之言朝當亡哉夫朝之當亡猶人當死人欲死怪出國欲亡期盡人死命終死不復生亡不復存祖己之言政何益於不亡高宗之修行何益於除禍夫家人見凶修善不能得吉高宗見妖改政安能除禍除禍且不能況能招致六國延期至百年乎故人之死生在於命之夭壽不在行之善惡國之存亡在期之長短不在於政之得失案祖己之占桑榖為亡之妖亡象已見雖修孝行其何益哉何以效之魯昭公之時鸜鵒來巢師己採文成之世童謠之語有鸜鵒之言見今有來巢之驗則占謂之凶其後昭公為季氏所逐出於齊國果空虛都有虛驗故野鳥來巢師己處之禍竟如占使昭公聞師己之言修行改政為善居高宗之操終不能消何則鸜鵒之謠已兆出奔之禍已成也鸜鵒之兆已出於文成之世矣根生葉安得不茂源發流安得不廣此尚為近未足以言之夏將衰也二龍戰於庭吐漦而去夏王櫝而藏之夏亡傳於殷殷亡傳於周皆莫之發至幽王之時發而視之漦流于庭化為玄黿走入後宮與婦人交遂生褒姒褒姒歸周厲王惑亂國遂滅亡幽厲王之去夏世以為千數歲二龍戰時幽厲褒姒等未為人也周亡之妖已出久矣妖出禍安得不就瑞見福安得不至若二龍戰時言曰余褒之二君也是則褒姒當生之驗也龍稱褒褒姒不得不生生則厲王不得不惡惡則國不得不亡亡徵已見雖五聖十賢相與卻之終不能消善惡同實善祥出國必興惡祥見朝必亡謂惡異可以善行除是謂善瑞可以惡政滅也河源出於崑崙其流播於九河使堯禹卻以善政終不能還者水勢當然人事不能禁也河源不可禁二龍不可除則桑榖不可卻也王命之當興也猶春氣之當為夏也其當亡也猶秋氣之當為冬也見春之微葉知夏有莖葉覩秋之零實知冬之枯萃桑榖之生其猶春葉秋實也必然猶驗之今詳修政改行何能除之夫以周亡之祥見於夏時又何以知桑榖之生不為紂亡出乎或時祖己言之信野草之占失遠近之實高宗問祖己之後側身行道六國諸侯偶朝而至高宗之命自長未終則謂起桑榖之問改政修行享百年之福矣夫桑榖之生殆為紂出亦或時吉而不凶故殷朝不亡高宗壽長祖己信野草之占謂之當亡之徵漢孝武皇帝之時獲白麟戴兩角而共抵使謁者終軍議之軍曰夫野獸而共一角象天下合同為一也麒麟野獸也桑榖野草也俱為野物獸草何別終軍謂野獸為吉祖己謂野草為凶高宗祭成湯之廟有蜚雉升鼎耳而雊祖己以為遠人將有來者說尚書家謂雉凶議駮不同且從祖己之言雉來吉也雉伏於野草之中草覆野鳥之形若民人處草廬之中可謂其人吉而廬凶乎民人入都不謂之凶野草生朝何故不吉雉則民人之類如謂含血者吉長狄來至是吉也何故謂之凶如以從夷狄來者不吉介葛盧來朝是凶也如以草木者為凶朱草蓂莢出是不吉也朱草蓂莢皆草也宜生於野而生於朝是為不吉何故謂之瑞一野之物來至或出吉凶異議朱草蓂莢善草故為吉則是以善惡為吉凶不以都野為好醜也周時天下太平越嘗獻雉於周公高宗得之而吉雉亦草野之物何以為吉如以雉耿介有似於士則麇亦仍有似君子公孫述得白鹿占何以凶然則雉之吉凶未可知則夫桑榖之善惡未可驗也桑榖或善物象遠方之士將皆立於高宗之朝故高宗獲吉福享長久也說災異之家以為天有災異者所以譴告王者信也夫王者有過異見於國不改災見草木不改災見於五穀不改災至身左氏春秋傳曰國之將亡鮮不五稔災見於五穀五穀安得熟不熟將亡之徵災亦有且亡五穀不熟之應天不熟或為災或為福禍福之實未可知桑榖之言安可審論說之家著於書記者皆云天雨穀者凶書傳曰蒼頡作書天雨穀鬼夜哭此方凶惡之應和者天何用成穀之道從天降而和且猶謂之善況所成之穀從雨下乎極論訂之何以為凶夫陰陽和則穀稼成不則被災害陰陽和者穀之道也何以謂之凶絲成帛縷成布賜人絲縷猶為重厚況遺人以成帛與織布乎夫絲縷猶陰陽帛布猶成穀也賜人帛不謂之惡天與之穀何故謂之凶夫雨穀吉凶未可定桑榖之言未可知也使暢草生於周之時天下太平倭人來獻暢草暢草亦草野之物也與彼桑榖何異如以夷狄獻之則為吉使暢草生於周家肯謂之不善乎夫暢草可以熾釀芬香暢達者將祭灌暢降神設自生於周朝與嘉禾朱草蓂莢之類不殊矣然則桑亦食蠶蠶為絲絲為帛帛為衣衣以入宗廟為朝服與暢無異何以謂之凶衛獻公太子至靈臺蛇繞左輪御者曰太子下拜吾聞國君之子蛇繞車輪左者速得國太子遂不行反乎舍御人見太子太子曰吾聞為人子者盡和順於君不行私欲共嚴承令不逆君安今吾得國是君失安也見國之利而忘君安非子道也得國而拜其非君欲廢子道者不孝逆君欲則不忠而欲我行之殆吾欲吾國之危明也拔劍將死其御止之不能禁遂伏劍而死夫蛇繞左輪審為太子速得國太子宜不死獻公宜疾薨今獻公不死太子伏劍御者之占俗之虛言也或時蛇為太子將死之妖御者信俗之占故失吉凶之實夫桑榖之生與蛇繞左輪相似類也蛇至實凶御者以為吉桑榖實吉祖己以為凶禹南濟於江有黃龍負舟舟中之人五色無主禹乃嘻笑而稱曰我受命於天竭力以勞萬民生寄也死歸也死歸也何足以滑和視龍猶蝘蜓也龍去而亡患案古今龍至皆為吉而禹獨謂黃龍凶者見其負舟舟中之人恐也夫以桑榖比於龍吉凶雖反蓋相似野草生於朝尚為不吉殆有若黃龍負舟之異故為吉而殷朝不亡晉文公將與楚成王戰於城濮彗星出楚楚操其柄以問咎犯咎犯對曰以彗鬭倒之者勝文公夢與成王搏成王在上盬其腦問咎犯咎犯曰君得天而成王伏其罪戰必大勝文公從之大破楚師嚮令文公問庸臣必曰不勝何則彗星無吉搏在上無凶也夫桑榖之占占為凶猶晉當彗末搏在下為不吉也然而吉者殆有若對彗見天之詭故高宗長久殷朝不亡使文公不問咎犯咎犯不明其吉戰以大勝世人將曰文公以至賢之德破楚之無道天雖見妖臥有凶夢猶滅妖消凶以獲福殷無咎犯之異知而有祖己信常之占故桑榖之文傳世不絶轉禍為福之言到今不實
