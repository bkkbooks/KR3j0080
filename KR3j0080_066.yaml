body:
  text: 言毒篇或問曰天地之間萬物之性含血之蟲有蝮虵蜂蠆咸懷毒螫犯中人身渭濩疾痛當時不救流徧一身草木之中有巴豆野葛食之湊懣頗多殺人不知此物稟何氣於天萬物之生皆稟元氣元氣之中有毒螫乎曰夫毒太陽之熱氣也中人人毒人食湊懣者其不堪任也不堪任則謂之毒矣太陽火氣常為毒螫氣熱也太陽之地人民促急促急之人口舌為毒故楚越之人促急捷疾與人談言口唾射人則人脤脹腫而為創南郡極熱之地其人祝樹樹枯唾鳥鳥墜巫咸能以祝延人之疾愈人之禍者生於江南含烈氣也夫毒陽氣也故其中人若火灼人或為蝮所中割肉置地焦沸火氣之驗也四方極皆為維邊唯東南隅有溫烈氣溫烈氣發常以春夏春夏陽起東南隅陽位也他物之氣入人鼻目不能疾痛火煙入鼻鼻疾入目目痛火氣有烈也物為靡屑者多唯一火最烈火氣所燥也食甘旨之食無傷於人食蜜少多則令人毒蜜為蜂液蜂則陽物也人行無所觸犯體無故痛痛處若箠杖之跡人腓腓謂鬼敺之鬼者太陽之妖也微者疾謂之邊其治用蜜與丹蜜丹陽物以類治之也夫治風用風治熱用熱治邊用蜜丹則知邊者陽氣所為流毒所加也天地之間毒氣流行人當其衝則面腫疾世人謂之火流所刺也人見鬼者言其色赤太陽妖氣自如其色也鬼為烈毒犯人輒死故杜伯射周宣立崩鬼所齎物陽火之類杜伯弓矢其色皆赤南道名毒曰短狐杜伯之象執弓而射陽氣困而激激而射故其中人象弓矢之形火困而氣熱血毒盛故食走馬之肝殺人氣困為熱也盛夏暴行暑暍而死熱極為毒也人疾行汗出對鑪汗出嚮日亦汗出疾溫病者亦汗出四者異事而皆汗出困同熱等火日之變也天下萬物含太陽氣而生者皆有毒螫毒螫渥者在蟲則為蝮蛇蜂蠆在草則為巴豆冶葛在魚則為鮭與𩶰䱙故人食鮭肝而死為𩶰䱙螫有毒魚與鳥同類故鳥蜚魚亦蜚鳥卵魚亦卵蝮蛇蜂蠆皆卵同性類也其在人也為小人故小人之口為禍天下小人皆懷毒氣陽地小人毒尤酷烈故南越之人祝誓輒效諺曰眾口爍金口者火也五行二曰火五事二曰言言與火直故云爍金道口舌之爍不言拔木焰火必云爍金金制於火火口同類也藥生非一地太伯辭之吳鑄多非一工世稱楚棠溪溫氣天下有路畏入南海鴆鳥生於南人飲鴆死辰為龍巳為蛇辰巳之位在東南龍有毒蛇有螫故蝮有利牙龍有逆鱗木生火火為毒故蒼龍之獸含火星冶葛巴豆皆有毒螫故冶在東南巴在西南土地有燥濕故毒物有多少生出有處地故毒有烈不烈蝮虵與魚比故生於草澤蜂蠆與鳥同故產於屋樹江北地燥故多蜂蠆江南地濕故多蝮虵生高燥比陽陽物懸垂故蜂蠆以尾刺生下濕比陰陰物柔伸故蝮虵以口齰毒或藏於首尾故螫齰有毒或藏於體膚故食之輒懣或附於脣吻故舌鼓為禍毒螫之生皆同一氣發動雖異內為一類故人夢見火占為口舌夢見蝮蛇亦口舌火為口舌之象口舌見於蝮虵同類共本所稟一氣也故火為言言為小人小人為妖由口舌口舌之徵由人感天故五事二曰言言之咎徵僭恆陽若僭者奢麗故蝮蛇多文文起於陽故若致文陽若則言從故時有詩妖妖氣生美好故美好之人多邪惡叔虎之母美叔向之母妬之不使視寢叔向諫其母其母曰深山大澤實生龍虵彼美吾懼其生龍虵以禍汝汝弊族也國多大寵不仁之人間之不亦難乎余何愛焉使往視寢生叔虎美有勇力嬖於欒懷子及范宣子逐懷子殺叔虎禍及叔向夫深山大澤龍虵所生也比之叔虎之母者美色之人懷毒螫也生子叔虎美有勇力勇力所生生於美色禍難所發由於勇力火有光耀木有容貌龍虵東方木含火精故美色貌麗膽附於肝故生勇力火氣猛故多勇木剛強故多力也生妖怪者常由好色為禍難者常發勇力為毒害者皆在好色美酒為毒酒難多飲蜂液為蜜蜜難益食勇夫強國勇夫難近好女說心好女難畜辯士快意辯士難信故美味腐腹好色惑心勇夫招禍辯口致殃四者世之毒也辯口之毒為害尤酷何以明之孔子見陽虎卻行白汗交流陽虎辯有口舌口舌之毒中人病也人中諸毒一身死之中於口舌一國潰亂詩曰讒言罔極交亂四國四國猶亂況一人乎故君子不畏虎獨畏讒夫之口讒夫之口為毒大矣
