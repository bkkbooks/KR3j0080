body:
  text: 驗符篇永平十一年廬江皖侯國民際有湖皖民小男曰陳爵陳挺年皆十歲以上相與釣於湖涯挺先釣爵後往爵問挺曰釣寧得乎挺曰得爵即歸取竿綸去挺四十步所見湖涯有酒樽色正黃沒水中爵以為銅也涉水取之滑重不能舉挺望見號曰何取爵曰是有銅不能舉也挺往助之涉水未持樽頓衍更為盟盤動行入深淵中復不見挺爵留顧見如錢等正黃數百千枚即共掇摝各得滿手走歸示其家爵父國故免吏字君賢驚曰安所得此爵言其狀君賢曰此黃金也即馳與爵俱往到金處水中尚多賢自涉水掇取爵挺鄰伍並聞俱競採之合得十餘斤賢自言於相相言太守太守遣吏收取遣門下掾程躬奉獻具言得金狀詔書曰如章則可不如章有正法躬奉詔書歸示太守太守以下思省詔書以為疑隱言之不實苟飾美也即復因卻上得黃金實狀如前章事寢十二年賢等上書曰賢等得金湖水中郡牧獻訖今不得直詔書下廬江上不畀賢等金直狀郡上賢等所採金自官湖水非賢等私瀆故不與直十二年詔書曰視時金價畀賢等金直漢瑞非一金出奇怪故獨紀之金玉神寶故出詭異金物色先為酒樽後為盟盤動行入淵豈不怪哉夏之方盛遠方圖物貢金九牧禹謂之瑞鑄以為鼎周之九鼎遠方之金也人來貢之自出於淵者其實一也皆起盛德為聖王瑞金玉之世故有金玉之應文帝之時玉棓見金之與玉瑞之最也金聲玉色人之奇也永昌郡中亦有金焉纖靡大如黍粟在水涯沙中民採得日重五銖之金一色正黃土生金土色黃漢土德也故金化出金有三品黃比見者黃為瑞也圯橋老父遺張良書化為黃石黃石之精出為符也夫石金之類也質異色鈞皆土瑞也建初三年零陵泉陵女子傅寧宅土中忽生芝草五本長者尺四五寸短者七八寸莖葉紫色蓋紫芝也太守沈酆遣門下掾衍盛奉獻皇帝悅懌賜錢衣食詔會公卿郡國上計吏民皆在以芝告示天下天下並聞吏民歡喜咸知漢德豐雍瑞應出也四年甘露下泉陵零陵洮陽始安冷道五縣榆柏梅李葉皆洽溥威委流漉民嗽吮之甘如飴蜜五年芝草復生泉陵男子周服宅上六本色狀如三年芝并前凡十一本湘水去泉陵城七里水上聚石曰燕室丘臨水有俠山其下巖吟水深不測二黃龍見長出十六丈身大於馬舉頭顧望狀如圖中畫龍燕室丘民皆觀見之去龍可數十步又見狀如駒馬小大凡六出水遨戲陵上蓋二龍之子也并二龍為八出移一時乃入宣帝時鳳皇下彭城彭城以聞宣帝詔侍中宋翁一翁一曰鳳皇當下京師集於天子之郊乃遠下彭城不可收與無下等宣帝曰方今天下合為一家下彭城與京師等耳何令可與無下等乎令左右通經者語難翁一翁一窮免冠叩頭謝宣帝之時與今無異鳳皇之集黃龍之出鈞也彭城零陵遠近同也帝宅長遠四表為界零陵在內猶為近矣魯人公孫臣孝文時言漢土德其符黃龍當見其後黃龍見于成紀成紀之遠猶零陵也孝武孝宣時黃龍皆出黃龍比出於茲為四漢竟土德也賈誼創議於文帝之朝云漢色當尚黃數以五為名賈誼智囊之臣云色黃數五土德審矣芝生於土土氣和故芝生土土爰稼穡稼穡作甘故甘露集龍見往世不雙唯夏盛時二龍在庭今龍雙出應夏之數治諧偶也龍出往世其子希出今小龍六頭並出遨戲象乾坤六子嗣後多也唐虞之時百獸率舞今亦八龍遨戲良久芝草延年仙者所食往世生出不過一二今并前後凡十一本多獲壽考之徵生育松喬之糧也甘露之降往世一所今流五縣應土之數德布濩也皇瑞比見其出不空必有象為隨德是應孔子曰知者樂仁者壽皇帝聖仁故芝草壽徵生黃為土色位在中央故軒轅德優以黃為號皇帝寬惠德侔黃帝故龍色黃示德不異東方曰仁龍東方之獸也皇帝聖仁故仁瑞見甘者養育之味也皇帝仁惠愛黎民故甘露降龍潛藏之物也陽見於外皇帝聖明招拔巖穴也瑞出必由嘉士祐至必依吉人也天道自然厥應偶合聖主獲瑞亦出群賢君明臣良庶事以康文武受命力亦周邵也
