body:
  text: 效力篇程才量知之篇徒言知學未言才力也人有知學則有力矣文吏以理事為力而儒生以學問為力或問楊子雲曰力能扛鴻鼎揭華旗知德亦有之乎答曰百人矣夫知德百人者與彼扛鴻鼎揭華旗者為料敵也夫壯士力多者扛鼎揭旗儒生力多者博達疏通故博達疏通儒生之力也舉重拔堅壯士之力也梓材曰強人有王開賢厥率化民此言賢人亦壯強於禮義故能開賢其率化民化民須禮義禮義須文章行有餘力則以學文能學文有力之驗也問曰説一經之儒可謂有力者曰非有力者也陳留龐少都每薦諸生之吏常曰王甲某子才能百人太守非其能不答少都更曰言之尚少王甲某子才能百萬人太守怒曰親吏妄言少都曰文吏不通經一文不調師一言諸生能説百萬章句非才知百萬人乎太守無以應夫少都之言實也然猶未也何則諸生能傳百萬言不能覽古今守信師法雖辭説多終不為博殷周以前頗載六經儒生所能説也秦漢之事儒生不見力劣不能覽也周監二代漢監周秦周秦以來儒生不知漢欲觀覽儒生無力使儒生博觀覽則為文儒文儒者力多於儒生如少都之言文儒才能千萬人矣曾子曰士不可以不弘毅任重而道遠仁以為己任不亦重乎死而後已不亦遠乎由此言之儒者所懷獨已重矣志所欲至獨已遠矣身載重任至於終死不倦不衰力獨多矣夫曾子載於仁而儒生載於學所載不同輕重均也夫一石之重一人挈之十石以上二人不能舉也世多挈一石之任寡有舉十石之力儒生所載非徒十石之重也地力盛者草木暢茂一畝之收當中田五畝之分苗田人知出穀多者地力盛不知出文多者才知茂失事理之實矣夫文儒之力過於儒生況文吏乎能舉賢薦士世謂之多力也然能舉賢薦士上書白記也能上書白記者文儒也文儒非必諸生也賢達用文則是矣谷子雲唐子高章奏百上筆有餘力極言不諱文不折乏非夫才知之人不能為也孔子周世多力之人也作春秋刪五經祕書微文無所不定山大者雲多泰山不崇朝辨雨天下然則賢者有雲雨之知故其吐文萬牒以上可謂多力矣世稱力者常褒烏獲然則董仲舒楊子雲文之烏獲也秦武王與孟説舉鼎不任絶脈而死少文之人與董仲舒等涌胸中之思必將不任有絶脈之變王莽之時省五經章句皆為二十萬博士弟子郭路夜定舊説死於燭下精思不任絶脈氣滅也顏氏之子已曾馳過孔子於塗矣劣倦罷極髮白齒落夫以庶幾之材猶有仆頓之禍孔子力優顏淵不任也才力不相如則其知惠不相及也勉自什伯鬲中嘔血失魂狂亂遂至氣絶書五行之牘書十奏之記其才劣者筆墨之力尤難況乃連句結章篇至十百哉力獨多矣江河之水馳涌滑漏席地長遠無枯竭之流本源盛矣知江河之流遠地中之源盛不知萬牒之人胸中之才茂迷惑者也故望見驥足不異於衆馬之蹄躡平陸而馳騁千里之迹斯須可見夫馬足人手同一實也稱驥之足不薦文人之手不知類也夫能論筋力以見比類者則能取文力之人立之朝廷故夫文力之人因有力之將乃能以力為功有力無助以力為禍何以驗之長巨之物強力之人乃能舉之重任之車強力之牛乃能挽之是任車上阪強牛引前力人推後乃能升踰如牛羸人罷任車退卻還墮坑谷有破覆之敗矣文儒懷先王之道含百家之言其難推引非徒任車之重也薦致之者罷羸無力遂卻退竄於巖穴矣河發崑崙江起岷山水力盛多滂沛之流浸下益盛不得廣岸低地不能通流入乎東海如岸狹地仰溝洫決泆散在丘墟矣文儒之知有似於此文章滂沛不遭有力之將援引薦舉亦將棄遺於衡門之下固安得升陟聖主之庭論説政事之務乎火之光也不舉不明有人於斯其知如京其德如山力重不能自稱須人乃舉而莫之助抱其盛高之力竄於閭巷之深何時得達奡育古之多力者身能負荷千鈞手能決角伸鉤使之自舉不能離地智能滿胸之人宜在王闕須三寸之舌一尺之筆然後自動不能自進進之又不能自安須人能動待人能安道重知大位地難適也小石附於山山力能得持之在沙丘之間小石輕微亦能自安至於大石沙土不覆山不能持處危峭之際則必崩墜於坑谷之間矣大智之重遭小才之將無左右沙土之助雖在顯位將不能持則有大石崩墜之難也或伐薪於山輕小之木合能束之至於大木十圍以上引之不能動推之不能移則委之於山林收所束之小木而歸由斯以論知能之大者其猶十圍以上木也人力不能舉薦其猶薪者不能推引大木也孔子周流無所留止非聖才不明道大難行人不能用也故夫孔子山中巨木之類也桓公九合諸侯一匡天下管仲之力管仲有力桓公能舉之可謂壯強矣吳不能用子胥楚不能用屈原二子力重兩主不能舉也舉物不勝委地而去可也時或恚怒斧斫破敗此則子胥屈原所取害也淵中之魚遞相吞食度口所能容然後咽之口不能受哽咽不能下故夫商鞅三説孝公後説者用前二難用後一易行也觀管仲之明法察商鞅之耕戰固非弱劣之主所能用也六國之時賢才之臣入楚楚重出齊齊輕為趙趙完畔魏魏傷韓用申不害行其三符兵不侵境蓋十五年不能用之又不察其書兵挫軍破國并於秦殷周之世亂迹相屬亡禍比肩豈其心不欲為治乎力弱智劣不能納至言也是故碓重一人之迹不能蹈也磑大一人之掌不能推也賢臣有徑強之優愚主有不堪之劣以此相求禽魚相與遊也干將之刃人不推頓苽瓠不能傷篠簬之箭機不能動發魯縞不能穿非無干將篠簬之才也無推頓發動之主苽瓠魯縞不穿傷焉望斬旗穿革之功乎故引弓之力不能引強弩弩力五石引以三石筋絶骨折不能舉也故力不任強引則有變惡折脊之禍知不能用賢則有傷德毀名之敗論事者不曰才大道重上不能用而曰不肖不能自達自達者帶絶不抗自衒者賈賤不讎案諸為人用之物須人用之功力乃立鑿所以入木者槌叩之也鍤所以能撅地者跖蹈之也諸有鋒刃之器所以能斷斬割削者手能把持之也力能推引之也韓信去楚入漢項羽不能安高祖能持之也能用其善能安其身則能量其力能別其功矣樊酈有攻城野戰之功高祖行封先及蕭何則比蕭何於獵人同樊酈於獵犬也夫蕭何安坐樊酈馳走封不及馳走而先安坐者蕭何以知為力而樊酈以力為功也蕭何所以能使樊酈者以入秦收斂文書也衆將拾金何獨掇書坐知秦之形勢是以能圖其利害衆將馳走者何驅之也故叔孫通定儀而高祖以尊蕭何造律而漢室以寧案儀律之功重於野戰斬首之力不及尊主故夫墾草殖穀農夫之力也勇猛攻戰士卒之力也構架斫削工匠之力也治書定簿佐史之力也論道議政賢儒之力也人生莫不有力所以為力者或尊或卑孔子能舉北門之關不以力自章知夫筋骨之力不如仁義之力榮也
