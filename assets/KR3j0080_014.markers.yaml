  - {type: variant, offset: 108, length: 0, content: '', SBCK: 然百里用刑千里皆寒殆非其驗齊魯接境賞罰同時設齊賞魯罰所致宜殊當時可齊國温魯地寒乎案前世用刑者蚩尤亡秦甚矣蚩尤之民湎湎紛紛亡秦之路赤衣比肩當時天下未必常寒也帝都之市屠殺牛羊日以百數刑人殺牲皆有賊心帝都之市氣不能寒或曰人貴於物唯人動氣夫用刑者動氣乎用受刑者爲變也如用刑者刑人殺禽同一心也如用受刑者人禽皆物也俱爲萬物百賤不能當一貴乎或曰唯人君動氣衆庶不能夫氣感必湏人君世何稱於鄒衍鄒衍匹夫一人感氣世又然之刑一人而氣輙寒生一人而氣輙温乎赦令四下萬刑並除當時歲月之氣不温徃年萬户失火煙焱參天河決千里四望無垠火與温氣同水與寒氣類失火河決之時不寒不温然則寒温之至殆非政治所致然而寒温之至遭與賞罰同時變復之家因縁名之矣春温夏暑秋凉冬寒人君無事四時自然夫四時非政所爲而謂寒温獨應政治正月之始正月之後立春之際百刑皆斷囹圄空虚然而一寒一温當其寒也何刑所斷當其温也何賞所施由此言之寒温天地節氣非人所爲明矣人有寒温之病非操行之所及也遭風逢氣身生寒温變操易行寒温不除夫身近而猶不能變除其疾國邑逺矣安能調和其氣人中於寒飲藥行解所苦稍衰轉爲温疾吞發汗之丸而應愈燕有寒谷不生五榖鄒衍吹律寒谷可種燕人種􅁰其中號曰黍谷如審有之寒温之災復以吹律之事調和其氣變政易行何能滅除是故寒温之疾非藥不愈黍谷之氣非律不調堯遭洪水使禹治之寒温與堯之洪水同}
