  - {type: variant, offset: 384, length: 0, content: '', krp: 夫天道自然自然無爲二令參偶遭適逢㑹人事始作天氣已有故曰道也使應政事是有非自然也易京氏布六十四卦於一歲中六日七分一卦用事卦有隂陽氣有升降陽升則温隂升則寒由此言之寒温隨卦而至不應政治也案易無妄之應水旱之至自有期節百災萬變殆同一曲變復之家疑且失實何以爲疑夫大人與天地合德先天而天不違後天而奉天時洪範曰急恒寒若舒恒燠若}
  - {type: variant, offset: 385, length: 0, content: '', SBCK: 洪範之言}
  - {type: variant, offset: 385, length: 0, content: '', WYG: 洪範之言}
  - {type: variant, offset: 385, length: 0, content: '', krp: 洪範之言}
  - {type: variant, offset: 386, length: 0, content: '', SBCK: 氣隨人易徙當先天而天不違耳何}
  - {type: variant, offset: 386, length: 0, content: '', WYG: 氣隨人易徙當先天而天不違耳何}
  - {type: page-break, offset: 386, content: '', id: KR3j0080_WYG_014-10b, image: WYG0862/WYG0862-0176b.png}
  - {type: variant, offset: 386, length: 0, content: '', krp: 氣隨人易徙當先天而天不違耳何}
  - {type: variant, offset: 387, length: 0, content: '', SBCK: 復言後天而奉天時乎後者天已寒温於前而人賞罰於後也由此言之人言與尚書不合一疑也京氏占寒温以隂陽升降變復之家以刑賞喜怒兩家乖迹二疑也民間占寒温今日寒而明日温朝有繁霜夕有列光旦雨氣温旦暘氣寒夫雨者隂暘者陽也寒者隂而温者陽也雨旦暘反寒暘旦雨反温不以類相應三疑也三疑不定自然之説亦未立也譴告篇論災異謂古之人君爲政失道天用災異譴告之也災異非一復以寒温爲之效人君用刑非時則寒施賞違節則温天神譴告人君猶人君責怒臣下也故楚嚴王曰天不下災異天其忘予乎災異爲譴告故嚴王懼而思之也曰此疑也夫國之有災異也猶家人之有變怪也有災異謂天譴人君有變怪天復譴告家人乎家人既明人之身中亦將可以喻身中病猶天有災異也血脉不調人}
  - {type: page-break, offset: 387, content: '', id: KR3j0080_SBCK_014-9a}
  - {type: page-break, offset: 387, content: '', id: KR3j0080_SBCK_014-9b}
