  - {type: variant, offset: 11, length: 0, content: '', SBCK: 遲留曆歲長久故能明審實賢儒之在世也猶靈蓍神􅀛也計學問之日固已盡年之半矣鋭意於道遂無貪仕之心及其仕也純特方正無貟鋭之操故世}
  - {type: page-break, offset: 11, content: '', id: KR3j0080_SBCK_014-1b}
  - {type: variant, offset: 11, length: 0, content: '', WYG: 遲留歴歲長久故能明審實賢儒之在世也猶靈蓍神龜也計學問之日固已盡年之半矣鋭意於道遂無貪仕之心及其仕也純持方正無貟鋭之操故世}
  - {type: variant, offset: 11, length: 0, content: '', krp: 遲留曆歲長久故能明審實賢儒之在世也猶靈蓍神龜也計學問之日固已盡年之半矣鋭意於道遂無貪仕之心及其仕也純特方正無貟鋭之操故世}
