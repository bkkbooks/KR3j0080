  - {type: variant, offset: 400, length: 0, content: '', SBCK: 負豕二言之於除臰洿也孰是孰非非有不易少有以益夫用寒温非刑賞也能易之乎西門豹急佩韋以自寛董安于緩帶絃以自促二賢知佩帶變己之物而以攻身之短夫至明矣人君失政不以他氣譴告變易反隨其誤就起其氣此則皇天用意不若二賢審也楚荘王好獵樊􅁎爲之不食鳥獸之肉秦繆公好􅁋樂華陽后爲之不聼鄭衛之音二􅁎非兩主拂其欲而不順其行皇天非賞罰而順其操而渥其氣此蓋皇天之德不若婦人賢也故諌之爲言間也持善間惡必謂之一亂周繆王任刑甫刑篇曰報虐用威威虐皆惡也用惡報惡亂莫甚焉今刑失賞寛惡也夫復爲惡以應之此則皇天之操與繆王同也故以善駮惡以惡懼善告人之理勸厲爲善之道也舜戒禹曰毋若丹朱敖周公勑成王曰毋若殷王紂毋者禁之也丹朱殷紂至惡故曰毋以禁之夫言毋若孰與言必若哉故毋必二辭聖人審之况肯譴非爲非順人之過以増其惡哉天人同道大人與天合德聖賢以善反惡皇天以惡隨非豈道同之效合德之驗哉孝武皇帝好仙司馬長卿獻大人賦上乃僊僊飄飄字冝讀爲有凌雲之氣孝成皇帝好廣宫室楊子雲上甘泉頌妙稱神怪若曰非人力所能爲鬼神力乃可成皇帝不覺爲之不止長卿之賦如言仙無實效子雲之頌言奢有害孝武豈有僊僊之氣者孝成豈有不覺之惑哉然即天之不爲他氣以譴告人君反順人心以非應之猶二子爲賦頌令兩帝惑而不悟也竇嬰灌夫疾時爲邪}
