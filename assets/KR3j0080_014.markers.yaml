  - {type: variant, offset: 19, length: 1, content: 合, SBCK: 焱風不能動毛芥在其間飛楊千里夫賢儒所懷其猶水中大石在地金鐡也其進不若俗吏速者長吏力劣不能用也毛芥在鐡石間也一口之}
  - {type: page-break, offset: 19, content: '', id: KR3j0080_SBCK_014-3b}
  - {type: variant, offset: 19, length: 1, content: 合, WYG: 飆風不能動毛芥在其間飛揚千里夫賢儒所懷其猶水中大石在地金鐡也其進不若俗吏速者長吏力劣不能用也毛芥在鐡石間也一口之}
