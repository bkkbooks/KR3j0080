  - {type: 'tls:seg', offset: 390, content: '', id: KR3j0080_tls_014-5a.13}
  - {type: variant, offset: 390, length: 1, content: 當, SBCK: 事之喻足以審天使嚴王知如孔子則其言可信衰世覇者之才猶夫變復之家也言未必信故疑之夫天道自然也無爲如譴告人是有爲非自然也黄老之家論説天道得其實矣且天審能譴告人君冝變易其氣以覺悟之用刑非時刑氣寒而天冝爲温施賞違節賞氣温而天冝爲寒變其政而易其氣故君得以覺悟知是非今乃隨寒從温爲寒爲温以譴告之意欲令變更之且大王亶父以王季之可立故易名爲歴歴者適也太伯覺悟之吳越採藥以避王季使大王不易季名而復字之季太伯豈覺悟以避之哉今刑賞失法天欲改易其政冝爲異氣若太王之易季名今乃重爲同氣以譴告之人君何時將能覺悟以見刑賞之誤哉鼓瑟者誤於張􅁌設柱宫啇易聲其師知之易其􅁌而復移其柱夫天之見刑賞之誤猶瑟師之睹􅁌柱之非也不更變氣以悟人君反増其氣以渥其惡則天無心意茍隨人君爲誤非也紂爲長夜之飲文王朝夕曰祀兹酒齊奢於祀晏子祭廟豚不掩爼何則非疾之者宜有以改易之也子弟傲慢父兄教以謹敬吏民横悖長吏示以和順是故康叔伯禽失子弟之道見於周公拜起驕悖三見三笞徃見商子商子令觀橋梓之樹二子見橋梓心感覺悟以知父子之禮周公可隨爲驕商子可順爲慢必湏加之捶杖教觀於物者兾二人之見異以竒自覺悟也夫人君之失政猶二子失道也天不告以政道}
