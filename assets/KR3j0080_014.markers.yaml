  - {type: variant, offset: 804, length: 106, content: 子鼠也酉雞也卯兔也水勝火鼠何不逐馬金勝木雞何不啄兔亥豕也未羊也丑牛也土勝水牛羊何不殺豕巳虵也申猴也火勝金虵何不食獼猴獼猴者畏鼠也囓獼猴者犬也鼠水獼猴金也水不勝金獮猴何故畏鼠也戌土也申猴也土不勝金猴何故畏犬東方木也, SBCK: 及}
