  - {type: variant, offset: 17, length: 1, content: 天, SBCK: 手指之物器也度力不能舉則不敢動賢儒之道非徒物器之重也是故金鐡在}
  - {type: variant, offset: 17, length: 1, content: 天, WYG: 手指之物器也度力不能舉則不敢動賢儒之道非徒物器之重也是故金鐡在}
