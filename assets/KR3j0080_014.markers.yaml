  - {type: variant, offset: 627, length: 7, content: 內五行氣俱如論, SBCK: 房心之間則知地且動也使子雲見鉤星則將復曰天以鉤星譴告政治不改將有地動之變矣然則子雲之願貫械待時猶子韋之願伏陛下以俟熒惑徙處必然之驗故譴告之言信也予之譴告何傷於義損皇天之德使自然無為轉爲人事故難聽之也稱天之譴告譽天之聰察也反以聰察傷損於天德何以知其聾也以其聽之聰也何以知其盲也以其視之明也何以知其狂也以其言之當也夫言當視聽聰明而道家謂之狂而盲聾今言天之譴告是謂天狂而盲聾也易曰大人與天地合其德故太伯曰天不言殖其道於賢者之心夫大人之德則天德也賢}
