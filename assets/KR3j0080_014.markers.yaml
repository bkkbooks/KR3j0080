  front:
  - {type: variant, offset: 0, length: 0, content: '', SBCK: 論衡卷第十四王充狀留篇寒温篇譴告篇狀留篇論賢儒之才既超程矣世人怪其仕宦不進官爵卑細以賢才退在俗吏之後信不怪也夫如是而適足以見賢不肖之分睹髙下多少之實也􅀛生三百歲大如錢游於蓮葉之上三千歲青邊緣巨尺二寸蓍生七十歲生一莖七百歲生十莖神靈之}
