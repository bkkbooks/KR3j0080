  - {type: 'tls:seg', offset: 12, content: '', id: KR3j0080_tls_014-1a.5}
  - {type: variant, offset: 12, length: 0, content: '', SBCK: 遲取進難也針錐所穿無不暢達使針錐末方穿物無一分之深矣賢儒方節而行無針錐之鋭固安能自穿取暢達之功乎且􅂹一日行千里者無所服也使服任車輿駑馬同音􅂹曾以引鹽車矣垂頭落汗行不能進伯樂顧之王良御之空身輕馳故有千里之名今賢儒懷古今之學負荷禮義之重内累於胷中之知外劬於禮義之操不敢妄進茍取故有稽留之難無伯樂之友不遭王良之將安得馳於清明之朝立千里之迹乎且夫含血氣物之生也行則背在上而腹在下其病若死則背在下而腹在上何則背肉厚而重腹肉薄而輕也賢儒俗吏並在當世有似於}
  - {type: page-break, offset: 12, content: '', id: KR3j0080_SBCK_014-2a}
  - {type: variant, offset: 12, length: 0, content: '', WYG: 遲取進難也針錐所穿無不暢達使針錐末方穿物無一分之深矣賢儒方節而行無針錐之鋭固安能自穿取暢達之功乎且驥一日行千里者無所服也使服任車輿駑馬同音驥曾以引鹽車矣垂頭落汗行不能進伯樂顧之王良御之空身輕馳故有千里之名今賢儒懷古今之學負荷禮義之重内累於胸中之知外劬於禮義之操不敢妄進茍取故有稽留之難無伯樂之友不遭王良之將安得馳於清明之朝立千里之迹乎且夫含血氣物之生也行則背在上而腹在下其病若死則背在下而腹在上何則背肉厚而重腹肉薄而輕也賢儒俗吏並在當世有似於}
