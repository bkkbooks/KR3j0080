  - {type: variant, offset: 106, length: 0, content: '', SBCK: 性人爲貴蝗蟲之飛能至萬里麒麟湏獻乃逹闕下然而蝗蟲爲災麒麟爲瑞麟有四足尚不能自致人有兩足安能自達故曰鷰飛輕於鳳皇兎走疾於麒麟鼃躍躁於靈􅀛虵騰便於神龍吕望之徒白首乃顯百里奚之知明於黄髪深爲國謀因爲王輔皆夫沉重難進之人也輕躁早成禍害暴疾故曰其進鋭者退速陽温隂寒歴月乃至災變之氣一朝成怪故夫河冰結合非一日之寒積土成山非斯湏之作干將之劒久在鑪炭銛鋒利刅百熟煉厲久銷乃見作留成遲故能割斷肉暴長者曰腫泉暴出者曰涌酒暴熟者易酸醢暴酸者易臭由此言之賢儒遲留皆有狀故狀故云何學多道重爲身累也草木之生者濕濕者重死者枯枯而輕者易舉濕而重者難移也然能字一有元氣所在在生不在枯是故車行於陸舩行於溝其滿而重者行遲空而輕者行疾先王之道載在胷腹之内其重不徒舩車之任也任重其取進疾速難矣竊人之物其得非不速疾也然而非其有得之非己之力也世人早得髙官非不有光榮也而尸禄素飡之謗諠譁甚矣且賢儒之不進將相長吏不開通也農夫載榖奔都賈人齎貨赴逺皆欲得其願也如門郭閉而不通津梁絶而不過雖有勉力趨時之勢奚由早至以得盈利哉長吏妬賢不能容善不被鉗赭之刑幸矣焉敢望官位升舉道理之早成也寒温篇説寒温者曰人君喜則温怒則寒何則喜怒發於胷中然後行出於外外成賞罰賞罰喜怒之效故寒温渥盛凋物傷人夫寒温之代至也在數日之}
