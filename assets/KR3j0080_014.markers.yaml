  - {type: variant, offset: 396, length: 0, content: '', SBCK: 下譴告之宜也凡物能相割截者必異性者也能相奉成者必同氣者也是故離下兊上曰革革更也火金殊氣故能相革如俱火而皆金安能相成屈原疾楚之臰洿故稱香潔之辭漁父議以}
