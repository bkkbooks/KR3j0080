  - {type: variant, offset: 384, length: 0, content: '', SBCK: 夫天道自然自然無爲二令參偶遭適逢㑹人事始作天氣已有故曰道也使應政事是有非自然也易京氏布六十四卦於一歲中六日七分一卦用事卦有隂陽氣有升降陽升則温隂升則寒由此言之寒温隨卦而至不應政治也案易無妄之應水旱之至自有期節百災萬變殆同一曲變復之家疑且失實何以爲疑夫大人與天地合德先天而天不違後天而奉天時洪範曰急恒寒若舒恒燠若}
  - {type: page-break, offset: 384, content: '', id: KR3j0080_SBCK_014-8b}
