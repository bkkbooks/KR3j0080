  - {type: variant, offset: 388, length: 1, content: 萬, SBCK: 疾病風氣不和歲生災異災異謂天譴告國政疾病天復譴告人乎醸酒於罌烹肉於鼎皆欲其氣味調得也時或鹹苦酸淡不應口者猶人勺藥失其和也夫政治之有災異也猶烹釀之有惡味也茍謂災異爲天譴告是其烹釀之誤得見譴告也占大以小明}
