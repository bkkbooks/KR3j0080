  - {type: 'tls:seg', offset: 21, content: '', id: KR3j0080_tls_014-2a.3}
  - {type: variant, offset: 21, length: 0, content: '', SBCK: 能吹毛芥非必焱風俗吏之易遷猶毛芥之易吹也故夫轉沙石者湍瀬也飛毛芥者焱風也活水洋風毛芥不動無道理之將用心暴猥察吏不詳遭以好遷妄授官爵猛水之轉沙石焱風之飛毛芥也是故毛芥因異風而飛沙石遭猛流而轉俗吏遇悖將而遷且圓物投之於地東西南北無之不可䇿杖叩動纔微輙停方物集地壹投而止及其移徙湏}
  - {type: variant, offset: 21, length: 0, content: '', WYG: 能吹毛芥非必飆風俗吏之易遷猶毛芥之易吹也故夫轉沙石者湍瀬也飛毛芥者飆風也活水洋風毛芥不動無道理之將用心暴猥察吏不詳遭以好遷妄授官爵猛水之轉沙石飆風之飛毛芥也是故毛芥因異風而飛沙石遭猛流而轉俗吏遇悖將而遷且圓物投之於地東西南北無之不可䇿杖叩動纔微輙停方物集地壹投而止及其移徙須}
