  - {type: variant, offset: 653, length: 134, content: 身胸懷五藏自相賊也一人之操行義之心自相害也且五行之氣相賊害含血之蟲相勝服其驗何在曰寅木也其禽虎也戌土也其禽犬也丑未亦土也丑禽牛未禽羊也木勝土故犬與牛羊為虎所服也亥水也其禽豕也巳火也其禽虵也子亦水也其禽鼠也午亦火也其禽馬也水勝火故豕食虵火為水所害故馬食鼠屎而腹脹曰審如論, SBCK: 語動言天者欲化無道懼愚}
