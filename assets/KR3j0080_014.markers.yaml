  - {type: variant, offset: 401, length: 2, content: 賊害, SBCK: 與日引繩以糾纆之心疾之甚安肯從其欲太伯教吳冠帶孰與隨從其俗與之俱倮也故吳之知禮義也太伯改其俗也蘇武入匈奴終不左祍趙他入南越箕踞椎髻漢朝稱蘇武而毁趙他之性習越土氣畔冠帶之制陸賈説之夏服雅禮風告以義趙他覺悟運心嚮内如陸賈復越服夷談從其亂俗安能令之覺悟自變從漢制哉三教之相違文質之相反政失不相反襲也譴告人君誤不變其失而襲其非欲行譴告之教不從如何管蔡簒畔周公告教之至于再三其所以告教之者豈云當簒畔哉人道善善惡惡施善以賞加惡以罪天道宜然刑賞失實惡也爲惡氣以應之惡惡之義安所施哉漢正首匿之罪制亡從之法惡其隨非而與惡人爲羣黨也如束罪人以詣吏離惡人與異居首匿亡從之法除矣狄牙之調味也酸則沃之以水淡則加之以鹹水火相變易故膳無鹹淡之失也今刑罰失實不爲異氣以變其過而又爲寒於寒爲温於温温字一有寒此猶憎酸而沃之以鹹惡淡而灌之以水也由斯言之譴告之言疑乎必信也今熯薪燃釡火猛則湯熱火微則湯冷夫政猶火寒温猶熱冷也顧可言人君爲政賞罰失中也逆亂隂陽使氣不和乃言天爲人君爲寒爲温以譴告之乎儒者之説又言人君失政天爲異不改災其人民不改乃災其身也先異後災先教後誅之義也曰此復疑也以夏樹物物枯不生以秋収榖榖棄不藏夫爲政教猶樹物收榖也顧可言政治失時氣物爲災乃言天爲異以譴告之不改爲災以誅伐之乎儒者之説俗人言也盛夏陽氣熾烈隂氣千之激射􅗓裂中殺人物謂天罰隂過外一聞若是内實不然夫謂災異爲譴告誅伐猶爲雷殺人罰隂過也非謂之言不然之説}
