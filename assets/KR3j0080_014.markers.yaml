  - {type: variant, offset: 13, length: 0, content: '', SBCK: 將明道行則俗吏載賢儒賢儒乗俗吏將闇道廢則俗吏乗賢儒賢儒處下位猶物遇害腹在上而背在下也且背法天而腹法地生行得其正故腹背得其位病死失其宜故腹反而在背上非唯腹也凡物仆僵者足又在上賢儒不遇仆廢於世踝足之吏皆在其上東方朔曰目不在面而在於足救昧不給能何見乎汲黯謂武帝曰陛下用吏如積薪矣後來者居上原汲黯之}
  - {type: page-break, offset: 13, content: '', id: KR3j0080_SBCK_014-2b}
  - {type: variant, offset: 13, length: 0, content: '', WYG: 將明道行則俗吏載賢儒賢儒乗俗吏將闇道廢則俗吏乗賢儒賢儒處下位猶物遇害腹在上而背在下也且背法天而腹法地生行得其正故腹背得其位病死失其宜故腹反而在背上非唯腹也凡物仆僵者足又在上賢儒不遇仆廢於世踝足之吏皆在其上東方朔曰目不在面而在於足救昧不給能何見乎汲黯謂武帝曰陛下用吏如積薪矣後來者居上原汲黯之}
  - {type: variant, offset: 13, length: 0, content: '', krp: 將明道行則俗吏載賢儒賢儒乗俗吏將闇道廢則俗吏乗賢儒賢儒處下位猶物遇害腹在上而背在下也且背法天而腹法地生行得其正故腹背得其位病死失其宜故腹反而在背上非唯腹也凡物仆僵者足又在上賢儒不遇仆廢於世踝足之吏皆在其上東方朔曰目不在面而在於足救昧不給能何見乎汲黯謂武帝曰陛下用吏如積薪矣後來者居上原汲黯之}
  - {type: variant, offset: 14, length: 1, content: 妄, SBCK: 察東方朔之語獨以非俗吏之得地賢儒之失職哉故夫仕宦失地難以觀德得地難以察不肖名生於髙官而毁起於卑位卑位固常賢儒之所在也遵禮蹈繩脩身守節在下不汲汲故有沉滯之留沉滯在能自濟故有不拔之扼其積學於身也多故用心也固俗吏無以自修身雖拔進利心揺動則有下道侵漁之操矣楓桐之樹生而速長故其皮肌不能堅剛樹檀以五月生葉後彼春榮之木其材彊勁車以爲軸殷之桑榖七日大拱長速大暴故爲變怪大器晚成寳貨難售者不崇一朝輙成賈者菜果之物也是故湍瀬之流沙石轉而大石不移何者大石重而沙石輕也沙石轉積於大石之上大石没而不見賢儒俗吏並在世俗有似於此遇闇長吏轉移俗吏超在賢儒之上賢儒處下受馳走之使至或巖居穴處没身不見咎在長吏不能知賢而賢者道大力劣不能拔舉之故}
  - {type: page-break, offset: 14, content: '', id: KR3j0080_SBCK_014-3a}
  - {type: variant, offset: 14, length: 1, content: 妄, WYG: 察東方朔之語獨非以俗吏之得地賢儒之失職哉故夫仕宦失地難以觀德得地難以察不肖名生於髙官而毁起於卑位卑位固常賢儒之所在也遵禮蹈繩脩身守節在下不汲汲故有沈滯之留沈滯在能自濟故有不拔之扼其積學於身也多故用心也固俗吏無以自修身雖拔進利心揺動則有下道侵漁之操矣楓桐之樹生而速長故其皮肌不能堅剛樹檀以五月生葉後彼春榮之木其材彊勁車以爲軸殷之桑榖七日大拱長速大暴故爲變怪大器晚成寳貨難售者不崇一朝輙成賈者菜果之物也是故湍瀨之流沙石轉而大石不移何者大石重而沙石輕也沙石轉積於大石之上大石没而不見賢儒俗吏並在世俗有似於此遇闇長吏轉移俗吏超在賢儒之上賢儒處下受馳走之使至或巖居穴處没身不見咎在長吏不能知賢而賢者道大力劣不能拔舉之故}
