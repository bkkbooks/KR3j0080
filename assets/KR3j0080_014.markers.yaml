  - {type: variant, offset: 107, length: 0, content: '', SBCK: 人君未必有喜怒之氣發胷中然後渥盛於外見外寒温則知胷中之氣也當人君喜怒之時胷中之氣未必更寒温也胷中之氣何以異於境内之氣胷中之氣不爲喜怒變境内寒温何所生起六國之時秦漢之際諸侯相伐兵革滿道國有相攻之怒將有相勝之志夫有相殺之氣當時天下未必常寒也太平之世唐虞之時政得民安人君常喜絃歌鼓舞比屋而有當時天下未必常温也豈喜怒之氣爲小發不爲大動邪何其不與行事相中得也夫近水則寒近火則温逺之漸微何則氣之所加逺近有差也成事火位在南水位在北北邊則寒南極則熱火之在鑪水之在溝氣之在軀其實一也當人君喜怒之時寒温之氣閨門宜甚境外宜微今案寒温外内均等殆非人君喜怒之所致世儒説稱妄處之也王者之變在天下諸侯之變在境内卿大夫之變在其位庶人之變在其家夫家人之能致變則喜怒亦能致氣父子相怒夫妻相督若當怒反喜縱過飾非一室之中宜有寒温由此言之變非喜怒所生明矣或曰以類相招致也喜者和温和温賞賜陽道施予陽氣温故温氣應之怒者愠恚愠恚誅殺隂道肅殺隂氣寒故寒氣應之虎嘯而谷風至龍興而景雲起同氣共類動相招致故曰以形逐影以龍致雨雨應龍而來影應形而去天地之性自然之道也秋冬斷刑小獄微原大辟盛寒寒隨刑至相招審矣夫比寒温於風雲齊喜怒於龍虎同氣共類動相招致可矣虎嘯之時風從谷中起龍興之時雲起百里内他谷異境無有風雲今寒温之變並時}
