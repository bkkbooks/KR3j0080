  - {type: variant, offset: 415, length: 139, content: 萬物含五行之氣五行之氣更相賊害曰天自當以一行之氣生萬物令之相親愛不當令五行之氣反使相賊害也或曰欲為之用故令相賊害賊害相成也故天用五行之氣生萬物人用萬物作萬事不能相制不能相使不相賊害不成為用金不賊木木不成用火不爍金金不成器故諸物相賊相利含血之蟲相勝服相齧噬相啖食者皆五行之氣使之然, SBCK: 示改}
