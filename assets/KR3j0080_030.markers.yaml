  - {type: variant, offset: 333, length: 0, content: '', SBCK: 者故蘇秦精􅀃於趙而李兊不􅀃商鞅以王􅀃秦而孝公不用夫不得心意所欲雖盡堯舜之言猶飲牛以酒啖馬以脯也故鴻麗深懿之言關於大而不通於小不得已而強聽入胷者少孔子失馬於野野人閉不與子貢妙稱而怒馬圄諧􅀃而懿俗曉露之言勉以深鴻之文猶和神仙之藥以治齀欬制貂狐之表以取薪菜也且禮有所不㣥事有所不湏㫁決知辜不必臯陶調和葵韮不俟狄牙閭巷之樂不用韶武里母之祀不待太牢既有不湏而又不}
  - {type: page-break, offset: 333, content: '', id: KR3j0080_SBCK_030-4b}
  - {type: variant, offset: 333, length: 0, content: '', krp: 者故蘇秦精說於趙而李兊不說商鞅以王說秦而孝公不用夫不得心意所欲雖盡堯舜之言猶飲牛以酒啖馬以脯也故鴻麗深懿之言關於大而不通於小不得已而強聽入胷者少孔子失馬於野野人閉不與子貢妙稱而怒馬圄諧說而懿俗曉露之言勉以深鴻之文猶和神仙之藥以治齀欬制貂狐之表以取薪菜也且禮有所不㣥事有所不湏㫁決知辜不必臯陶調和葵韮不俟狄牙閭巷之樂不用韶武里母之祀不待太牢既有不湏而又不}
  - {type: variant, offset: 334, length: 0, content: '', SBCK: 牛刀割雞舒㦸采葵鈇􅃏裁箸盆盎酌巵大小失宜善之者希何以為辯喻深以淺何以為智喻難以易賢聖銓材之所宜故文能為深淺之差充既疾俗情作譏俗之書又閔人君之政徒欲治人不得其宜不曉其務愁精苦思不睹所趨故作政務之書又傷偽書俗文多不實誠故為論衡之書夫賢聖歿而大義分蹉􅋸殊趨各自開門通人觀覽不能釘銓遥聞傳授筆冩耳取在百歲之前歴日彌乆以為昔古之事所言近是信之入骨不可自解故作實論其文盛其辯争浮華虛偽之語莫不澄定没華虚之文存敦厖之朴撥流失之風反宓戯之俗充書形露易觀或曰口辯者其言深筆敏者其文沉案經藝之文賢聖之言鴻重優雅難卒曉睹世讀之者訓古乃下盖賢聖之材鴻故其文語與俗不通玉隠石間珠匿魚腹非玉工珠師莫能采得寳物以隠閉不見實語亦宜深沉難測譏俗之書欲悟俗人故形露其指為分别之文論衡之書何為復然豈材有淺極不能為覆何文之察與彼經藝殊軌轍也荅曰玉隠石間珠匿魚腹故為深覆及玉色剖於石心珠光出於魚腹其隠乎猶吾文未集於簡札之上藏於胷臆之中猶玉隠珠匿也及出荴露猶玉剖珠出乎爛若天文之照順若地理之曉嫌疑隠㣲盡可名處且名白事自定也論衡者論之平也口則務在明言筆則務在露文髙士之文雅言無不可曉指無不可睹觀讀之者曉然若盲之開目聆然若聾之通耳三年盲子卒見父母不察察相識安肯說喜道畔巨樹塹邊長溝所居昭察人莫不知使樹不巨而隠溝不長而匿以斯示人堯舜猶惑人靣色部七十有餘頰肌明潔五色分别隠微憂喜皆可得察占射之者十不失一使面黝而黑醜垢重襲而覆部占射之者十而失九夫文由語也或淺露分别或深迃優雅孰為辯者故口言以明志言恐滅遺故著之文字文字與言同趨何為猶}
