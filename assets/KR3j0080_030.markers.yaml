  - {type: variant, offset: 2100, length: 269, content: 事而食可乎孟子曰不通功易事以羨補不足則農有餘粟女有餘布子如通之則梓匠輪輿皆得食於子於此有人焉入則孝出則悌守先王之道以待後世之學者而不得食於子子何尊梓匠輪輿而輕為仁義者哉曰梓匠輪輿其志將以求食也君子之為道也其志亦將以求食與孟子曰子何以其志為哉其有功於子可食而食之矣且子食志乎食功乎曰食志曰有人於此毀瓦畫墁其志將以求食也則子食之乎曰否曰然則子非食志食功也夫孟子引毀瓦畫墁者欲以詰彭更之言也知毀瓦畫墁無功而有志彭更必不食也雖然引毀瓦畫墁非所以詰彭更也何則諸志欲求食者毀瓦畫墁者不在其中不在其中則難以詰人矣夫人無故毀瓦畫墁此不癡狂則遨戲也癡狂之人, SBCK: 供養}
