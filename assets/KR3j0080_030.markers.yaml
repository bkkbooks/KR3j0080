  - {type: variant, offset: 1859, length: 240, content: 二百歲矣設或王者生失時矣又言時可何謂也云五百年必有王者興又言其間必有名世與王者同乎異也如同何為再言之如異名世者謂何等也謂孔子之徒孟子之輩教授後生覺悟頑愚乎已有孔子己又以生矣如謂聖臣乎當與聖王同時聖王出聖臣見矣言五百年而已何為言其間如不謂五百年時謂其中間乎是謂二三百年之時也聖人不與五百年時聖王相得夫如是孟子言其間必有名世者竟謂誰也夫天未欲平治天下也如欲治天下舍予而誰也言若此者不自謂當為王者有王者若為王臣矣為王者臣皆天也己命不當平治天下不浩然安之於齊懷恨有不豫之色失之矣彭更問曰士, SBCK: 邁儔倫彌索鮮所恃賴貧}
