  - {type: variant, offset: 1058, length: 440, content: 之孟子所去之王豈前所不朝之王哉而是何其前輕之疾而後重之甚也如非是前王前不去而於後去之是後王不肖甚於前而去三日宿於前不甚不朝而宿於景丑氏何孟子之操前後不同所以為王終始不一也且孟子在魯魯平公欲見之嬖人臧倉毀孟子止平公樂正子以告曰行或使之止或尼之行止非人所能也予之不遇魯侯天也前不遇於魯後不遇於齊無以異也前歸之天今則歸之於王孟子論稱竟何定哉夫不行於齊王不用則若臧倉之徒毀讒之也此亦止或尼之也皆天命不遇非人所能也去何以不徑行而留三宿乎天命不當遇於齊王不用其言天豈為三日之間易命使之遇乎在魯則歸之於天絕意無冀在齊則歸之於王庶幾有望夫如是不遇之議一在人也或曰初去未可以定天命也冀三日之間王復追之天命或時在三日之間故可也夫言如是齊王初使之去者非天命乎如使天命在三日之間魯平公比三日亦或時棄臧倉之議更用樂正子之言往見孟子孟子歸之於天何其早乎如三日之間公見孟子孟子奈前言何乎孟子去齊充虞塗問曰夫子若不豫色然前日虞聞諸夫子曰君子不怨天不尤人曰彼一時也此一時也五百年必有王者興其間必有名世者矣由周以來七, SBCK: 近董仲舒傳作書篇}
