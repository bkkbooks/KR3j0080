  - {type: variant, offset: 338, length: 4, content: 乎陳臻問, SBCK: 桃與黍孔子先食黍而啖桃可謂得食序矣然左右皆掩口而笑貫俗之日乆也今吾實猶孔子之序食也俗人違之猶左右之掩口也善雅歌於鄭為人悲禮舞於趙為不好堯舜之典伍伯不肯觀孔墨之籍季孟不肯讀寧危之計黜於閭巷撥世之言訾於品俗有美味於斯俗人不嗜狄牙甘食有寳玉於是俗人投之卞和佩服孰是孰非可信者誰禮俗相背何世不然魯文逆祀畔者五人盖猶是之語髙士不舍俗夫不好惑衆之書賢者欣頌愚者逃頓充書不能純美或}
