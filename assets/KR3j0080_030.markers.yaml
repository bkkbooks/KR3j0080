  - {type: variant, offset: 2378, length: 0, content: '', krp: 蟲物生死一時年歴但記孰使留之猶入黄泉消為土灰上自黄唐下臻秦漢而來折衷以聖道㭊理於通材如衡之平如鑑之開幼老生死古今罔}
  - {type: variant, offset: 2379, length: 1158, content: 求食求食者皆多人所共得利之事以所作鬻賣於市得賈以歸乃得食焉今毀瓦畫墁無利於人何志之有有知之人知其無利固不為也無知之人與癡狂比固無其志夫毀瓦畫墁猶比童子擊壤於塗何以異哉擊壤於塗者其志亦欲求食乎此尚童子未有志也巨人博戲亦畫墁之類也博戲之人其志復求食乎博戲者尚有相奪錢財錢財眾多己亦得食或時有志夫投石超距亦畫墁之類也投石超距之人其志有求食者乎然則孟子之詰彭更也未為盡之也如彭更以孟子之言可謂禦人以口給矣匡章子曰陳仲子豈不誠廉士乎居於於陵三日不食耳無聞目無見也井上有李螬食實者過半扶服往將食之三咽然後耳有聞目有見也孟子曰於齊國之士吾必以仲子為巨擘焉雖然仲子惡能廉充仲子之操則蚓而後可者也夫蚓上食槁壤下飲黃泉仲子所居之室伯夷之所築與抑亦盜跖之所築與所食之粟伯夷之所樹與抑亦盜跖之所樹與是未可知也曰是何傷哉彼身織屨妻辟纑以易之也曰仲子齊之世家兄戴蓋祿萬鍾以兄之祿為不義之祿而不食也以兄之室為不義之室而弗居也辟兄離母處於於陵他日歸則有饋其兄生鵝者也己頻蹙曰惡用是鶂鶂者為哉他日其母殺是鵝也與之食之其兄自外來至曰是鶂鶂之肉也出而吐之以母則不食以妻則食之以兄之室則不居以於陵則居之是尚能為充其類也乎若仲子者蚓而後充其操者也夫孟子之非仲子也不得仲子之短矣仲子之怪鵝如吐之者豈為在母則不食乎乃先譴鵝曰惡用鶂鶂者為哉他日其母殺以食之其兄曰是鶂鶂之肉仲子恥負前言即吐而出之而兄不告則不吐不吐則是食於母也謂之在母則不食失其意矣使仲子執不食於母鵝膳至不當食也今既食之知其為鵝怪而吐之故仲子之吐鵝也恥食不合己志之物也非負親親之恩而欲勿母食也又言仲子惡能廉充仲子之操則蚓而後可者也夫蚓上食槁壤下飲黃泉是謂蚓為至廉也仲子如蚓乃為廉潔耳今所居之宅伯夷之所築所食之粟伯夷之所樹仲子居而食之於廉潔可也或時食盜跖之所樹粟居盜跖之所築室汙廉潔之行矣用此非仲子亦復失之室因人故粟以屨纑易之正使盜之所樹築己不聞知今兄之不義有其操矣操見於眾昭晳議論故避於陵不處其宅織屨辟纑不食其祿也而欲使仲子處於陵之地避若兄之宅吐若兄之祿耳聞目見昭晳不疑仲子不處不食明矣今於陵之宅不見築者為誰粟不知樹者為誰何得成室而居之何得成粟而食之孟子非之是為太備矣仲子所居或時盜之所築仲子不知而居之謂之不充其操唯蚓然後可者也夫盜室之地中亦有蚓焉食盜宅中之槁壤飲盜宅中之黃泉蚓惡能為可乎充仲子之操滿孟子之議魚然後乃可夫魚處江海之中食江海之土海非盜所鑿土非盜所聚也然則仲子有大非孟子非之不能得也夫仲子之去母辟兄與妻獨處於陵以兄之宅為不義之宅以兄之祿為不義之祿故不處不食廉潔之至也然則其從於陵歸候母也宜自齎食而行鵝膳之進也必與飯俱母之所為飯者兄之祿也母不自有私粟以食仲子明矣仲子食兄祿也伯夷不食周粟餓死於首陽之下豈一食周粟而以汙其潔行哉仲子之操近不若伯夷而孟子謂之若蚓乃可失仲子之操所當比矣孟子曰莫非天, SBCK: 詳該}
