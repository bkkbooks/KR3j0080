  - {type: variant, offset: 3, length: 0, content: '', SBCK: 自紀篇王充者㑹稽上虞人也字仲任其先本魏郡元城一姓孫一幾世嘗從軍有功封㑹稽陽亭一歲倉卒國絶因家焉以農桑為業世祖勇任氣卒咸不揆於人歲凶横道傷殺怨讎衆多㑹世擾亂恐為怨讎所擒祖父汎舉家檐載就安㑹稽留錢唐縣以賈販為事生子二人長曰􅀩少曰誦誦即充父祖世任氣至􅀩誦滋甚故􅀩誦在錢唐勇勢凌人末復與豪家丁伯等結怨舉家徙處上虞建武三年充生為小兒與儕倫遨戯不好狎侮儕倫好掩雀捕蟬戯錢林熈充獨不肯誦竒之六歲教書恭愿仁順禮敬具備矜莊寂寥有巨人之志父未嘗笞母未嘗非閭里未嘗讓八歲出於書館書館小僮百人以上皆以過失袒謫或以書醜得鞭充書日進又無過失手書既成辭師受論語尚書日諷千字經明徳就謝師而專門援筆而衆竒所讀文書亦日博多才髙而不尚茍作口辯而不好談對非其人終日不言其論說始若詭於衆極聽其終衆乃是之以筆著文亦如此焉操行事上亦如此焉在縣位至掾功曹在都尉府位亦掾功曹在太守為列掾五官功曹行事入州為從事不好徼名於世不為利害見將常言人長希言人短專薦未達解已進者過及所不善亦弗譽有過不解亦弗復䧟能釋人之大過亦悲夫人之細非好自周不肯自彰勉以行操為基耻以材能為名衆㑹乎坐不問不言賜見君將不及不對在鄉里慕蘧伯玉之節在朝廷貪史子魚之行見汗傷不肯自明位不進亦不懐恨貧無一畆庇身志佚於王公賤無斗石之秩意若食萬鍾得官不欣失位不恨處逸樂而欲不放居貧苦而志不倦淫讀古文甘聞異言世書俗說多所不安幽處獨居考論實虚充為人清重遊必擇友不好茍交所友位雖微卑年雖幼稚行茍離俗必與之友好傑友雅徒不汜結俗材俗材因其微過蜚條䧟之然終不自明亦不非怨其人或曰有良材竒文無罪見䧟胡不自陳羊勝之徒摩口膏舌鄒陽自明入獄復出茍有全完之行不宜為人所缺既耐勉自伸冝不為人所屈荅曰不清不見塵不髙不見危不廣不見削不盈不見虧士兹多口為人所䧟盖亦其宜好進故自明憎退故自陳吾無好憎故黙無言羊勝為讒或使之也鄒陽得免或抜之也孔子稱命}
