  - {type: variant, offset: 1506, length: 0, content: '', SBCK: 不耦而徒著書自紀或虧曰所貴鴻材者仕宦耦合身容說納事得功立故為髙也今吾子涉世落魄仕數黜斥材未練於事力未盡於職故徒幽思屬文著記美言何補於身衆多欲以何趨乎荅曰材鴻莫過孔子孔子才不容斥逐伐樹接浙見圍削迹困餓陳蔡門徒菜色今吾材不逮孔子不偶之厄未與之等偏可輕乎且達者未必知竆者未必愚遇者}
