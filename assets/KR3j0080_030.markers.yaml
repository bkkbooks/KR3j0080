  - {type: variant, offset: 44, length: 261, content: 利有安吉之利惠王曰何以利吾國何以知不欲安吉之利而孟子徑難以貨財之利也易曰利見大人利涉大川乾元亨利貞尚書曰黎民亦尚有利哉皆安吉之利也行仁義得安吉之利孟子必且詰問惠王何謂利吾國惠王言貨財之利乃可荅若設今惠王之問未知何趣孟子徑荅以貨財之利如惠王實問貨財孟子無以驗效也如問安吉之利而孟子荅以貨財之利失對上之指違道理之實也齊王問時子我欲中國而授孟子室養弟子以萬鍾使諸大夫國人皆有所矜式子盍為我言之時子因陳子而以告孟子孟子曰夫時子惡知其不可也如使予欲富辭十萬而受萬是為欲富乎夫孟子辭十萬失謙讓之理也夫富貴者人之所欲也不以其道得之不居也, SBCK: ''}
