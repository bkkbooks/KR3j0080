  - {type: variant, offset: 344, length: 1, content: 齊, SBCK: 耳則事味於心文察於目則篇留於手故辯言無不聽麗文無不冩今新書既在論譬說俗爲戾又不美好於觀不快盖師曠調音曲無不悲狄牙和膳肴無澹味然則通人造書文無瑕穢吕氏淮南懸於市門觀讀之者無訾一言今無二書之美文雖衆盛猶多譴毁荅曰夫養實者不育華調行者不餙辭豐草多華英茂林多枯枝爲文欲顯白其爲安能令文而無譴毁救火拯溺義不得好辯論是非言不得巧入澤隨􅀛不暇調足深淵捕蛟不暇定手言姦辭簡指趨妙遠語甘文峭務意淺小稻􅂖千鍾糠皮太半閱錢滿億穿決出萬大羮必有澹味至寳必有瑕穢大簡必有大好良工必有不巧然則辯言必有所屈通文猶有所黜言金由貴家起文糞自賤室出淮南吕氏之無累害所由出者家冨官貴也夫貴故得懸於市冨故有千金副觀讀之者惶恐畏忌雖見乖不合焉敢譴一字充書旣成或稽合於古不類前人或曰謂之飾文偶辭或徑或迃或屈或舒謂之論道實事委璅文給甘酸諧於經不驗集於傳不合稽之子長不當内之子雲不入文不與前相似安得名佳好稱工巧荅曰飾貌以彊類者失形調辭以務似者失情百夫之子不同父母殊類而生不必相似各以所禀自為佳好文必有與合然后稱善是則代匠斵不傷手然后稱工巧也文士之務各有所從或調辭以巧文或辯偽以實事必謀慮有合文辭相襲是則五帝不異事三}
