  - {type: variant, offset: 327, length: 0, content: '', krp: 為上所知拔擢越次不慕髙官不為上所知貶黜抑屈不恚下位比為縣吏無所擇避或曰心難而行易好犮同志仕不擇地濁操傷行世何效放荅曰可效放者莫過孔子孔子}
  - {type: variant, offset: 328, length: 0, content: '', SBCK: 仕無所避矣為乗曰委吏無於邑之心為司空相國無說豫之色舜耕歴山若終不免及受堯禪若卒自得憂徳之不豐不患爵之不尊耻名之不白不惡位之不遷垂棘與瓦同櫝明月與礫同囊茍有二寳之質不害為世所同世能知善雖賤猶顯不能别白雖尊猶辱處卑與尊齊操位賤與貴比徳斯可矣俗性貪進忽退收成棄敗充升擢在位之時衆人蟻附廢退窮居舊}
