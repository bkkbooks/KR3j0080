  - {type: variant, offset: 712, length: 169, content: 而私與之子之爵祿夫士也亦無王命而私受之於子則可乎何以異於是齊人伐燕或問曰勸齊伐燕有諸曰未也沈同曰燕可伐與吾應之曰可彼然而伐之彼如曰孰可以伐之則應之曰為天吏則可以伐之今有殺人者或問之曰人可殺與則將應之曰可彼如曰孰可以殺之則應之曰為士師則可以殺之今以燕伐燕何為勸之也夫或問孟子勸王伐燕不誠是乎沈同問燕可伐與此挾私意欲自伐之也知其意慊於是宜曰燕, SBCK: 市肩磨書}
