  - {type: variant, offset: 335, length: 1, content: 受, SBCK: 隠閉指意獄當嫌辜卿決疑事渾沌難曉與彼分明可知孰為良吏夫口論以分明為公筆辯以荴露為通吏文以昭察為良深覆典雅指意難覩唯賦頌耳經傳}
  - {type: variant, offset: 335, length: 1, content: 受, krp: 隠閉指意獄當嫌辜卿決疑事渾沌難曉與彼分明可知孰為良吏夫口論以分明為公筆辯以荴露為通吏文以昭察為良深覆典雅指意難覩唯賦頌耳經傳}
  - {type: variant, offset: 337, length: 0, content: '', SBCK: 文賢聖之語古今言殊四方談異也當言事時非務難知使指閉隠也後人不曉世相離逺此名曰語異不名曰材鴻淺文讀之難曉名曰不巧不名曰知明秦始皇讀韓非之書嘆曰猶獨不得此人同時其文可曉故其事可思如深鴻優雅湏師乃學投之於地何嘆之有夫筆著者欲其易曉而難為不貴難知而易造口論務解分而可聽不務深迃而難睹孟子相賢以眸子明瞭者察文以義可曉充書違詭於俗或難曰文貴夫順合衆心不違人意百人讀之莫譴千人聞之莫怪故管子曰言室滿室言堂滿堂今殆說不與世同故文刺於俗不合於衆荅曰論貴是而不務華事尚然而不髙合論說辯然否安得不譎常心逆俗耳衆心非而不從故喪黜其偽而存定其真如當從衆順人心者循舊守雅諷習而已何辯之有孔子侍坐於魯哀公公}
  - {type: page-break, offset: 337, content: '', id: KR3j0080_SBCK_030-6b}
  - {type: page-break, offset: 337, content: '', id: KR3j0080_SBCK_030-7a}
