  - {type: variant, offset: 16, length: 2, content: 幸有, SBCK: 分度一舎十度或増或減言日反三舎乃三十度也日日行一度一麾之間反三十日時所在度也如謂舎為度三度亦三日行也一麾之間令日却三日也宋景公推誠出三善言熒惑徙三舎實論者猶謂之虛襄公爭鬭惡日之暮以此一戈麾無誠心善言日為之反殆非其意哉且日火也聖人麾火終}
