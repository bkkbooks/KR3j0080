  - {type: variant, offset: 1075, length: 0, content: '', SBCK: 層臺之上人從層臺下叩頭求請臺上之物臺上之人聞其言則憐而與之如不聞其言雖至誠區區終無得也夫天去人非徒層臺之高也湯雖自責天安能聞知而與之雨乎夫旱火變也湛水異也堯遭洪水可謂湛矣堯不自責以身禱祈必舜禹治之知水變必須治也除湛不以禱祈除旱亦宜如之由此言之湯之禱祈不能得雨或時旱乆時當自雨湯以旱乆亦適自責}
