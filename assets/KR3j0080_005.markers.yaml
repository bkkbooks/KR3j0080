  - {type: variant, offset: 811, length: 260, content: 發於心然而於韓有罪於衛為忠驂乘偶典冠不偶也非唯人行物亦有之長數仞之竹大連抱之木工技之人裁而用之或成器而見舉持或遺材而遭廢棄非工伎之人有愛憎也刀斧之加有偶然也蒸穀為飯釀飯為酒酒之成也甘苦異味飯之熟也剛柔殊和非庖廚酒人有意異也手指之調有偶適也調飯也殊筐而居甘酒也異器而處蟲墯一器酒棄不飲鼠涉一筐飯捐不食夫百草之類皆有補益遭醫人采掇成為良藥或遺枯澤為火所燎等之金也或為劍戟或為鋒銛同之木也或梁於宮或柱於橋俱之火也或爍脂燭或燔枯草均之土也或基殿堂或塗軒戶皆之水也或溉鼎釜或澡腐臭物善惡同遭為人用其不幸偶猶可傷痛況含精氣之徒乎虞舜, SBCK: ''}
