  - {type: variant, offset: 530, length: 0, content: '', krp: 曰世稱太子丹之令天雨粟馬生角大抵皆虛言也太史公書漢世實事之人而云虛言近非實也傳書言杞梁氏之妻嚮城而哭城}
  - {type: variant, offset: 532, length: 1, content: 作, SBCK: 崩此言杞梁從軍不還其妻痛之嚮城而哭至誠悲痛精氣動城故城爲之崩也夫言嚮城而哭者實也城為之崩者虚也夫人哭悲莫過雍門子雍門子哭對孟嘗君孟嘗君爲之於邑蓋哭之精誠故對嚮之者悽愴感慟也夫雍門子能動孟嘗之心不能感孟嘗衣者衣不知惻怛不以人心相關通也今城土也土猶衣也無心腹之藏安能爲悲哭感慟而崩使至誠之聲能動城土則其對林木哭能折草破木乎嚮水火而泣能涌水滅火乎夫草木水火與土無異然杞梁之妻不能崩城明矣或時城適自崩杞梁妻適哭下世好虚不原其實故崩城之名至今不滅}
