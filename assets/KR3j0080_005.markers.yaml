  - {type: variant, offset: 2, length: 0, content: '', WYG: 朝而至高宗之命自長未終則謂起桑穀之問改政修行享百年之福矣夫桑穀之生殆為紂出亦或時吉而不凶故殷朝不亡高宗壽長祖己信野草之占謂之當亡之徴漢孝武皇帝之時獲白麟戴兩角而共觝使謁者終軍議之軍曰夫野獸而共一角象天下合同為一也麒麟野獸也桑穀野草也俱爲野物獸草何别終軍謂獸為吉祖己謂野草爲凶高宗祭成湯之廟有蜚雉升鼎而雊祖己以為逺人將有來者說尚書家謂雉凶議駮不同且從祖己之言雉來吉也雉伏於野草之中草覆野鳥之形若民人處草廬之中可謂其人吉而廬凶乎民人入都不謂之凶野草生朝何故不吉雉則民人之類如謂含血者吉長狄來至是吉也何故謂之凶如以從夷狄來者不吉介葛盧來朝是凶也如以草木者為凶朱草蓂莢出是不吉也朱草蓂莢皆草也宜生於野而生於朝是為不吉何故謂之瑞一野之物來至或出吉凶異議朱草蓂莢善草故為吉則是以善惡為吉凶不以都野為好醜也周時天下太平越裳獻雉於周公高宗得之而吉雉亦草野之物何以為吉如以雉所分有似於士則麏亦仍有似君子公孫述得白鹿占何以凶然則雉之吉凶未可知則夫桑穀之善惡未可驗也桑穀或善物象逺方之士將皆立於高宗之朝故高宗獲吉福享長乆也説災異之家以為天有災異者所以譴告王者信也夫王者有過異見於國不改災見草木不改災見於五穀不改災至身左氏春秋傳曰國之將亡鮮不五稔災見於五穀五穀安得熟不熟将亡之徴災亦有且亡五穀不熟之應天不熟或爲災或爲福禍福之實未可知桑穀之言安可審論説之家著於書記者皆云天雨穀者凶書傳曰蒼頡作書天雨穀鬼夜哭此方凶惡之應和者天何用成穀之道從天降而和且猶謂之善况所成之穀從雨下乎極論訂之何以為凶夫隂陽和則穀稼成不則被災害隂陽和者穀之道也何以謂之凶絲成帛縷成布賜人絲縷猶為重厚况遺人以成帛與織布乎夫絲縷猶隂陽帛布猶成穀也賜人帛不謂之惡天與之穀何故謂之凶夫雨穀吉凶未可定桑穀之言未可知也使暢草生於周之時天下太平人來獻暢草暢草亦草野之物也與彼桑穀何異如以夷狄獻之則為吉使暢草生於周家肯謂之善乎夫暢草可以熾釀芬香暢達者將祭灌暢降神設自生於周朝與嘉禾朱草蓂莢之類不殊矣然則桑亦食蠶蠶爲絲絲為帛帛為衣衣以入宗廟為朝服與暢無異何以謂之凶衛獻公太子至靈臺虵遶左輪御者曰太子下拜吾聞國君之子虵遶車輪左者速得國太子遂不下反乎舎御人見太子太子曰吾聞為人子者盡和順於君不行私欲共嚴承令不逆君安今吾得國是君失安也見國之利而忘君安非子道也得國而拜其非君欲廢子道者不孝逆君欲則不忠而欲我行之殆吾欲國之危明也投殿將死其御止之不能禁遂伏劒而死夫虵繞左輪審為太子速得國太子宜不死獻公宜疾薨今獻公不死太子伏劒御者之占俗之虚言也或時虵為太子將死之妖御者信俗之占故失吉凶之實夫桑穀之生與虵遶左輪相似類也虵至實凶御者以為吉桑穀實吉祖己以為凶禹南濟於江有黄龍負舟舟中之人五色無主禹乃嘻笑而稱曰我受命於天竭力以勞萬民生寄也死歸也死歸也何足以滑和視龍猶蝘蜓也龍去而亡案古今龍至皆為吉而禹獨謂黄龍凶者見其負舟舟中之人恐也夫以桑穀比於龍吉凶雖反葢相似野草生於朝尚為不吉殆有若黄龍負舟之異故為吉而殷朝不亡晉文公將與楚成王戰於城濮彗星出楚楚操其柄以問咎犯咎犯對曰以彗鬭倒之者勝文公夢與成王搏成王在上盬其腦問咎犯咎犯曰君得天而成王伏其罪戰必大勝文公從之大破楚師嚮令文公問庸臣必曰不勝何則彗星無吉搏在上無凶也夫桑穀之占占為凶猶晉當彗末搏在下為不吉也然而吉者殆有若對彗見天之詭故高宗長乆殷朝不亡使文公不問咎犯咎犯不明其吉戰以大勝世人將曰文公以至賢之徳破楚之無道天雖見妖臥有凶夢猶滅妖消凶以獲福殷無咎犯之異知而有祖己信常之占故桑穀之文傳世不絶轉禍為福之言到今不實感虚}
