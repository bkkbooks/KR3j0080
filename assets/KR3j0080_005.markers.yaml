  - {type: variant, offset: 581, length: 0, content: '', SBCK: 觀見遂以為實實者樂聲不能致此何以驗之風雨暴至是隂陽亂也樂能亂隂陽則亦能調隂陽也王者何須修身正行擴施善政使皷調隂陽之曲和氣自至太平自立矣傳書言湯遭七年旱以身禱於桑林自責以六過天乃雨}
