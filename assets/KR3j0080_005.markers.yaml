  - {type: variant, offset: 3, length: 1, content: 凡, krp: 儒者傳書言堯之時十日並出萬物燋枯堯上射十日九日去一日常出此言虛也夫}
  - {type: variant, offset: 5, length: 0, content: '', SBCK: 之射也不過百歩矢力盡矣日之行也行天星度天之去人以萬里數堯上射之安能得日使堯之時天地相近不過百歩則堯射日矢能及之過百步不能得也假使堯時天地相近堯射得之猶不能傷日傷日何肯去何則日火也使在地之火附一把炬人從旁射之雖中安能滅之地火不爲見射而滅天火何爲見射而去此欲言堯以精誠射之精誠所加金石爲虧蓋誠無堅則亦無逺矣夫水與火各一性也能射火而滅之則當射水而除之洪水之時流濫中國爲民大害堯何不推精誠射而除之堯能射日使火不爲害不能射河使水不爲害夫射水不能卻水則知射日之語虚非實也或曰日氣也射雖不及精誠滅之夫天亦逺使其為氣則與日月同使其為體則與金石等以堯之精誠滅日虧金石上射日則能穿天乎世稱桀紂之惡射天而毆地譽高宗之徳政消桑穀今堯不能以徳滅十日而必射之是徳不若高宗惡與桀紂同也安能以精誠獲天之應也傳書言武王伐紂渡孟津陽侯之波逆流而擊疾風晦冥人馬不見於是武王左}
