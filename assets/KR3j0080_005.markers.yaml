  - {type: variant, offset: 1109, length: 0, content: '', SBCK: 夏日則雨水冬日天寒則雨凝而為雪皆由雲氣發於丘山不從天上降集於地明矣夫穀之雨猶復雲布之亦從地起因與疾風俱飄參於天集於地人見其從天落也則謂之天雨穀建武三十一年中陳留雨穀穀下蔽地案視穀形若茨而黑有似於稗實也此或時夷狄之地}
  - {type: variant, offset: 1109, length: 0, content: '', WYG: 夏日則雨水冬日天寒則雨凝而為雪皆由雲氣發於丘山不從天上降集於地明矣夫穀之雨猶復雲布之亦從地起因與疾風俱飄參於天集於地人見其從天落也則謂之天雨穀建武三十一年中陳留雨穀穀下蔽地案視穀形若茨而黑有似於稗實也此或時夷狄之地}
