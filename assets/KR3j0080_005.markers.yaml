  - {type: variant, offset: 1113, length: 1, content: 周, SBCK: 以爲田鑿地以為井井出水以救渇田出穀以拯饑天地鬼神所欲爲也龍何故登􅀇雲神何故棲崑崙夫龍之登􅀇雲古今有之非始益作井而乃登也方今盛夏雷雨時至龍多登雲雲興字一有風龍相應龍乗雲雨而行物類相致非有爲也堯時五十之民擊壤於塗觀者曰大哉堯之徳也擊壤者曰吾日出而作日入而息鑿井而飲耕田而食堯何等力堯時已有井矣唐虞之時豢龍御龍龍常在朝夏末政衰龍乃隱伏非益鑿井龍登雲也所謂神者何神也百神皆是百神何故惡人爲井使神與人同則亦冝有飲之欲有飲之欲憎井而去非其實也夫益殆不鑿井龍不為鑿井登雲神不棲於崑崙傳書意妄造生之也傳書言梁山崩壅河三日不}
