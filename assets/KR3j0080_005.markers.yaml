  - {type: variant, offset: 1110, length: 0, content: '', SBCK: 出此穀夷狄不粒食此穀生於草野之中成熟垂委於地遭疾風暴起吹揚與之俱飛風衰穀集墜於中國中國見之謂之雨穀何以效之野火燔山澤山澤之中草木皆燒其葉爲􅁅疾風暴起吹揚之參天而飛風衰葉下集於道路夫天雨穀者草木葉燒飛而集之類也而世以爲雨穀作傳書者以變怪天主施氣地主産物有葉實可啄食者皆地所生非天所爲也今穀非氣所生須土以成雖云怪變怪變因類生地之物更從天集生天之物可從地出乎地之有萬物猶天之有列星也星不更生於地穀何獨生於天乎傳書又言伯益作井龍登玄雲神棲崑崙言龍井有害故龍神爲變也夫言龍登􅀇雲實也言神棲崑崙又言為作井之故龍登神去虚也夫作井而飲耕田而食同一實也伯益作井致有變動始為耕耘者何故}
