  - {type: variant, offset: 1149, length: 3, content: 幸偶庸, SBCK: 通也治癰腫者可復以素服哭泣之聲治乎堯之時洪水滔天懷山襄陵帝堯吁嗟博求賢者水變甚於河壅堯憂深於景公不聞以素縞哭泣之聲能厭勝之堯無賢}
