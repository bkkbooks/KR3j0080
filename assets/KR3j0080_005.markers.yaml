  - {type: variant, offset: 545, length: 2, content: 科故, SBCK: 吟歌與歎等曾子伯竒不能致寒鄒衍何人獨能雨霜被逐之寃尚未足言申生伏劒子胥刎頸實孝而賜死誠忠而被誅且臨死時皆有聲辭聲辭出口與仰天歎無異天不爲二子感動獨爲鄒衍動豈天痛見拘不悲流血哉伯竒寃痛相似而感動不同也夫熯一炬火爨一鑊水終日不能熱也倚一尺冰置庖厨中終夜不能寒也何則微小之感不能動大巨也今鄒衍之歎不過如一炬尺冰而皇天巨大不徒鑊水庖厨之醜類也一仰天歎天爲隕霜何天之易感霜之易降也夫哀與樂同喜與怒均􅄛興怨痛使天下霜使衍蒙非望之賞仰天而笑能以冬時使天熱乎變復之家曰人君秋賞則温夏罰則寒寒不累時則霜不降温不兼日則冰不釋一夫寃而一歎天輒下霜何氣之易變時之易轉也寒温自有時不}
