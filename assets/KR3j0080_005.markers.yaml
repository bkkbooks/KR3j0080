  - {type: variant, offset: 368, length: 0, content: '', SBCK: 害氣能相動乎曰不能預讓欲害趙襄子襄子心動貫高欲簒高祖高祖亦心動二子懐精故兩主振感曰禍變且至身自有怪非適人所能動也何以驗之時或遭狂人於途以刃加己狂人未必念害己身也然而己身先時已有妖怪矣由此言之妖怪之至禍變自凶之象非欲害己者之所爲也且凶之人卜得惡兆筮得凶卦出門見不吉占危睹禍氣禍氣見於面猶白虹太白見於天也變見於天妖出於人上下適然自相應也傳書言燕太子丹朝於秦不得去從秦王求歸秦王執留之與之誓曰使日再中天雨粟令烏白頭馬}
