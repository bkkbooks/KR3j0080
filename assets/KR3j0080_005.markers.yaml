  - {type: variant, offset: 105, length: 260, content: 偶也孔子門徒七十有餘顏回蚤夭孔子曰不幸短命死矣短命稱不幸則知長命者幸也短命者不幸也服聖賢之道講仁義之業宜蒙福祐伯牛有疾亦復顏回之類俱不幸也螻蟻行於地人舉足而涉之足所履螻蟻笮死足所不蹈全活不傷火燔野草車轢所致火所不燔俗或喜之名曰幸草夫足所不蹈火所不及未必善也舉火行道適然也由是以論癰疽之發亦一實也氣結閼積聚為癰潰為疽創流血出膿豈癰疽所發身之善穴哉營衛之行遇不通也蜘蛛結網蜚蟲過之或脫或獲獵者或羅百獸群擾或得或失漁者罾江湖之魚或存或亡或姦盜大辟而不知或罰贖小罪而發覺災氣加人亦此類也不幸遭觸而死幸者免脫而生不幸者不徼幸也孔子, SBCK: 動天反動乎問}
