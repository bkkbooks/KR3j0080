  - {type: variant, offset: 1093, length: 1, content: 憎, SBCK: 故其妖變致天雨粟鬼夜哭也夫言天雨粟鬼夜哭實也言其應倉頡作書虚也夫河出圖洛出書聖帝明王之瑞應也圖書文章與倉頡所作字畫何以異天地為圖書倉頡作文字業與天地同指與鬼神合何非何惡而致雨粟神哭之怪使天地鬼神惡人有書則其出圖書非也天}
