  - {type: variant, offset: 548, length: 0, content: '', SBCK: 變復之家且從變復之說或時燕王好用刑寒氣應至而衍囚拘而歎歎時霜適自下世見適歎而霜下則謂鄒衍歎之致也傳書言師曠奏白雪之曲而神物下降風雨暴至平公因之癃病晉國赤地或言師曠清角之曲一奏之有雲從西北起再奏之大風至大雨隨之裂帷幕破俎豆墮廊瓦坐者散走平公恐懼伏乎廊室晉國大旱赤地三年平公癃病夫白雪與清角或同曲而異名}
