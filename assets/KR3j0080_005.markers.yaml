  - {type: variant, offset: 1153, length: 0, content: '', WYG: 若輦者之術乎将洪水變大不可以聲服除也如素縞而哭悔過自責也堯禹之治水以力役不自責梁山堯時山也所壅之河堯時河也山崩河壅天雨水踊二者之變無以殊也堯禹治洪水以力役輦者治壅河用自責變同而治異人均而應殊殆非賢聖變復之實也凢變復之道所以能相感動者以物類也有寒則復之以温温復解之以寒故以龍致雨以刑逐暑皆縁五行之氣用相感勝之山崩壅河素縞哭之於道何意乎此或時河壅之時山初崩土積聚水未盛三日之後水盛土散稍壞沮矣壞沮水流竟注東去遭伯宗得輦者之言因素縞而哭哭之因流流時謂之河變起此而復其實非也何以驗之使山恒自崩乎素縞哭無益也使其天變應之冝改政治素縞而哭何政所改而天變復乎傳書言曾子之孝與母同氣曾子出薪於野有客至而欲去曾母曰願留參方到即以右手搤其左臂曾子左臂立痛即馳至問母臂何故痛母曰今日客來欲去吾搤臂以呼汝耳蓋以至孝與父母同氣體有疾病精神輒感曰此虚也夫孝悌之至通於神明乃謂徳化至天地俗人縁此而說言孝悌之至精氣相動如曾母臂痛曾子臂亦輒痛曾母病乎曾子亦病曾母死曾子輒死乎攷事曾母先死曾子不死矣此精氣能小相動不能大相感也世稱申喜夜聞其母歌心動開關問歌者為誰果其母蓋聞母聲聲音相感心悲意動開關而問蓋其實也今曾母在家曾子在野不聞號呼之聲母小搤臂安能動子疑世人頌成聞曾子之孝天下少雙則為空生母搤臂之說也世稱南陽卓公為緱氏令蝗不入界蓋以賢明至誠災蟲不入其縣也此又虛也夫賢明至誠之化通於同類能相知心然後慕服蝗蟲閩虻之類也何知何見而能知卓公之化使賢者處深野}
