  - {type: variant, offset: 1074, length: 0, content: '', SBCK: 皆素禱之日乆孔子不使子路禱以治病湯何能以禱得雨孔子素禱身猶疾病湯亦素禱嵗猶大旱然則天地之有水旱猶人之有疾病也疾病不可以自責除水旱不可以禱謝去明矣湯之致旱以過乎是不與天地同徳也令不以過致旱乎自責禱謝亦無益也人形長七尺形中有五常有癉瘴一作熱之病深自尅責猶不能愈況以廣大之天自有水旱之變湯用七尺之形形中之誠自責禱謝安能得雨邪人}
  - {type: page-break, offset: 1074, content: '', id: KR3j0080_SBCK_005-15a}
