  - {type: variant, offset: 0, length: 1, content: 幸, SBCK: 論衡卷第五王充異虛篇感虛篇異虚篇殷高宗之時桑穀俱生於朝七日而大拱高宗召其相而問之相曰吾雖知之弗能言也問祖己祖己曰夫桑糓者野草也而生於朝意朝亡乎高宗恐駭側身而行道思索先王之政明養老之義興滅國繼絶世舉佚民桑穀亡三年之後諸侯以譯來朝者六國遂享百年之福高宗賢君也而感桑穀生而問祖己行祖己之言修政改行桑穀之妖亡諸侯朝而年長乆修善之義篤故瑞應之福渥此虛言也祖己之言朝當亡哉夫朝之當亡猶人當死人欲死怪出國欲亡期盡人死命終死不復生亡不復存祖己之言政何益於不亡高宗之修行何益於除禍夫家人見凶修善不能得吉高宗見妖改政安能除禍除禍且不能况能招致六國延期至百年乎故人之死生在於命之夭夀不在行之善惡國之存亡在期之長短不在於政之得失案祖巳之占桑穀為亡之妖亡象已見雖修孝行其何益哉何以效之魯昭公之時鸜鵒來巢師巳採文成之世童謡之語有鸜鵒之言見今有來巢之驗則占謂之凶其後昭公為季氏所逐出於齊國果空虚都有虚驗故野鳥來巢師巳處之禍意如占使昭公聞師巳之言修行改政為善居高宗之操終不能消何則鸜鵒之謠已兆出奔之禍已成也鸜鵒之兆已出於文成之世矣根生葉安得不茂源發流安得不廣此尚為近未足以言之夏將衰也二龍戰於庭吐漦而去夏王櫝而藏之夏亡傳於殷殷亡傳於周皆莫之發至幽王之時發而視之漦流于庭化為􅀇黿走入後宫與婦人交遂生褒姒褒姒歸周厲王惑亂國遂滅亡幽厲王之去夏世以為千數歲二龍戰時幽厲褒姒等未為人也周亡之妖已出乆矣妖出禍安得不就瑞見福安得不至若二龍戰時言曰余褒之二君也是則褒姒當生之驗也龍稱褒褒姒不得不生生則厲王不得不惡惡則國不得不亡徴已見雖五聖十賢相與卻之終不能消善惡同實善祥出國必興惡祥見朝必亡謂惡異可以善行除是謂善瑞可以惡政滅也河源出於崑崙其流播於九河使堯禹卻以善政終不能還者水勢當然人事不能禁也河源不可禁二龍不可除則桑穀不可卻也王命之當興也猶春氣之當爲夏也其當亡也猶秋氣之當爲冬也見春之微葉知夏有莖葉覩秋之零實知冬之枯萃桑穀之生其猶春葉秋實也必然猶驗之今詳修政改行何能除之夫以周亡之祥見於夏時又何以知桑穀之生不爲紂亡出乎或時祖已言之信野草之占失遠近之實高宗問祖巳之後側身行道六國諸侯}
