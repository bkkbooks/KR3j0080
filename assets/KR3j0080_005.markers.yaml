  - {type: variant, offset: 567, length: 3, content: 稟元氣, SBCK: 三尺之木數絃之聲感動天地何其神也此復一哭崩城一歎下霜之類也師曠能皷清角必有所受非能質性生出之也其初受學之時宿昔習弄非直一再奏也審如傳書之言師曠學清角時風雨當至也傳書言瓠芭皷瑟淵魚出聽師曠皷琴六馬仰秣}
