  - {type: variant, offset: 5, length: 0, content: '', krp: 之射也不過百歩矢力盡矣日之行也行天星度天之去人以萬里數堯上射之安能得日使堯之時天地相近不過百歩則堯射日矢能及之過百步不能得也假使堯時天地相近堯射得之猶不能傷日傷日何肯去何則日火也使在地之火附一把炬人從旁射之雖中安能滅之地火不爲見射而滅天火何爲見射而去此欲言堯以精誠射之精誠所加金石爲虧蓋誠無堅則亦無逺矣夫水與火各一性也能射火而滅之則當射水而除之洪水之時流濫中國爲民大害堯何不推精誠射而除之堯能射日使火不爲害不能射河使水不爲害夫射水不能卻水則知射日之語虚非實也或曰日氣也射雖不及精誠滅之夫天亦逺使其為氣則與日月同使其為體則與金石等以堯之精誠滅日虧金石上射日則能穿天乎世稱桀紂之惡射天而毆地譽高宗之徳政消桑穀今堯不能以徳滅十日而必射之是徳不若高宗惡與桀紂同也安能以精誠獲天之應也傳書言武王伐紂渡孟津陽侯之波逆流而擊疾風晦冥人馬不見於是武王左}
  - {type: variant, offset: 6, length: 0, content: '', SBCK: 黄􅃏右執白旄瞋目而麾之曰余在天下誰敢害吾意者於是風霽波罷此言虚也武王渡孟津時士衆喜樂前歌後舞天人同應人喜天怒非實宜也前歌後舞未必其實麾風而止之迹近為虛夫風者氣也論者以爲天地之號令也武王誅紂是乎天當安静以祐之如誅紂非乎而天風者怒也武王不奉天令求索已過瞋目言曰余在天下誰敢害吾者重天怒増已之惡也風何肯止父母怒子不改過瞋目大言父母肯貰之乎如風天所為楇氣自然是亦無知不為瞋目麾之故止夫風猶雨也使武王瞋目以旄麾雨而止之乎武王不能止雨則亦不能止風或時武王適麾之風偶自止世褒武王之徳則謂武王能止風矣傳書言魯襄公與韓戰戰酣日暮公援戈而麾之日為之反三舎此言虚也凢人能以精誠感動天專心一意委務積神精通于天天為變動然尚未可謂然襄公志在戰為日暮一麾安能令日反使聖人麾日日終不反襄公何人而使日反乎鴻範曰星有好風星有好雨日月之行則有冬有夏月之從星則有風雨夫星與日月同精日月不從星星輙復變明日月}
