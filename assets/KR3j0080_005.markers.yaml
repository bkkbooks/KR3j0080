  - {type: variant, offset: 571, length: 2, content: 獨為, SBCK: 言師曠皷清角一奏之有􅀇鶴二八自南方來集於廊門之危再奏之而列三奏之延頸而鳴舒翼而舞音中宫商之聲聲吁于天平公大說坐者皆喜尚書曰擊石拊石百獸率舞此雖竒怪然尚可信何則鳥獸好悲聲耳與}
