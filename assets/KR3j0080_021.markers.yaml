  - {type: variant, offset: 898, length: 3, content: 蒙恬絕, SBCK: 信黄熊鯀之神矣髙皇帝以趙王如意為似我而欲立之吕后恚恨後酖殺趙王其後吕后出見蒼犬噬其左腋怪而卜之趙王如意為祟遂病腋傷不愈而死蓋以如意精神為蒼犬見變以報其仇也曰勇士忿怒交刃而戰負者被創仆}
