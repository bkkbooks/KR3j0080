  - {type: variant, offset: 1577, length: 203, content: 以上萬人以下計一聚之中生者百一死者十九可謂無道至痛甚矣皆得陽達富厚安樂天不責其無仁義之心道相并殺非其無力作而倉卒以人為食加以渥禍使之夭命章其陰罪明示世人使知不可為非之驗何哉王朔之言未必審然傳書李斯妬同才幽殺韓非於秦後被車裂之罪商鞅欺舊交擒魏公子卬後受誅死之禍彼欲言其賊賢欺交故受患禍之報也夫韓非何過而為李斯所幽公子卬何罪而為商鞅所擒車裂誅死賊賢欺交幽死見擒何以致之如韓非公子卬有惡天使李斯商鞅報之則李斯商鞅, SBCK: 貴}
