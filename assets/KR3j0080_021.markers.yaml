  - {type: variant, offset: 873, length: 0, content: '', SBCK: 伯有殺駟帶公孫段不失日期神審之驗也子産立其後而止知鬼神之操也知其操則知其實矣實有不空故對問不疑子産智人也知物審矣如死者無知}
