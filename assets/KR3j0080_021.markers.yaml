  - {type: variant, offset: 2, length: 6, content: 篇世謂受福祐, SBCK: 偽類真故杜伯莊子義之語徃徃而存晉惠公改葬太子申生秋其僕狐突適下國遇太子太子趨登僕車而告之曰夷吾無禮余得請於帝矣將以晉畀秦秦將祀余狐突對曰臣聞之神不歆非類民不祀非族君祀無乃殄乎且民何罪失刑乏祀君其圖之子太曰諾吾將復請七日新城西偏將有巫}
