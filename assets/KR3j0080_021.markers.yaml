  - {type: variant, offset: 881, length: 2, content: 蒙恬, SBCK: 故使欒水見之於是出而為之張朝而百姓皆見之三日而後更葬文王聖人也知道事之實見王季棺見知其精神欲見百姓故出而見之曰古今帝王死葬諸地中有以千萬數無欲復出見百姓者王季何為獨然河泗之濵立家非一水湍崩壤棺椁露見不可勝數皆欲復見百姓者乎欒水擊滑山之尾猶河泗之流湍濵圻也文王見棺和露惻然悲恨當先君欲復出乎慈孝者之心幸兾之意賢聖惻怛不暇思論推生况死故復改葬世俗信賢聖}
