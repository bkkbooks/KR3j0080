  - {type: variant, offset: 824, length: 0, content: '', SBCK: 人死皆不瞑也且死者精魂消索不復聞人之言不能聞人之言是謂死也離形更自爲􅀑立於人傍雖人之言已與形絶安能復入身中瞑目闓口乎能入身中以尸示恨則能不免與形相守案世人論死謂其精神有若能更以精魂立形見面使尸若生人者誤矣楚成王廢太子商臣欲立王子職商臣聞之以宫甲圍王王請食熊蹯而死弗聽王縊而死謚之曰靈不瞑曰成乃瞑夫為靈不暝為成乃瞑成王有知之效也謚之曰靈}
