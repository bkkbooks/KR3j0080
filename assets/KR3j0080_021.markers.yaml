markers:
  front:
  - {type: variant, offset: 0, length: 1, content: 禍, SBCK: 論衡卷第二十一王充死偽篇死偽篇傳曰周宣王殺其臣杜伯而不辜宣王將田於囿杜伯起於道左執彤弓而射宣王宣王伏韔而死趙簡公殺其臣莊子義而不辜簡公將入於桓門莊子義起於道左執彤杖而捶之斃於車下二者死人為鬼之驗鬼之有知能害人之效也無之奈何曰人生萬物之中物死不能為鬼人死何故獨能為鬼如以人貴能為鬼則死者皆當為鬼杜伯莊子義何獨為鬼也如以被非辜者能為鬼世間臣子被非辜者多矣比干子胥之輩不為鬼夫杜伯莊子義無道忿恨報殺其君罪莫大於弑君則夫死為鬼之尊者當復誅之非杜伯莊子義所敢為也凡人相傷憎其生惡見其身故殺而亡之見殺之家詣吏訟其仇仇人亦惡見之生死異路人鬼殊處如杜伯莊子義怨宣王簡公不宜殺也當復為鬼與已合㑹人君之威固嚴本一壓作人臣營衛卒使固多衆兩臣殺二君二君之死亦當報之非有知之深計憎惡之所為也如兩臣神宜知二君死當報已如不知也則亦不神不神胡能害人世多似是而非}
