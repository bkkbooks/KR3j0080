  - {type: variant, offset: 891, length: 0, content: '', krp: 牛哀病化為虎在故可實也今鯀遠殛於羽山人不與之處何能知之且文曰其神為熊是死也死而魂神為黄熊}
  - {type: variant, offset: 892, length: 0, content: '', SBCK: 人所得知也人死世謂鬼鬼象生人之形見之與人無異然猶非死人之神況熊非人之形不與人相似乎審鯀死其神爲黄熊則熊之死其神亦或時爲人人夢見之何以知非死禽獸之神也信黄熊謂之鯀神又信所見之鬼以爲死人精也此人物之精未可定黄熊爲鯀之神未可審也且夢象也吉凶且至神明示象熊羆之占自有所爲使鯀死其神審爲黄熊夢見黄熊必鯀之神乎諸侯祭山川設晉侯夢見山川何復不以祀山川山川自見乎人病多或夢見先祖死人來立其側可復謂先祖死人求食故來見形乎人夢所見更爲他占未必以所見為實也何以驗之夢見生人明日所夢見之人不與已相見夫所夢見之人不與已相見則知鯀之黄熊不入寢門不入則鯀不求食不求食則晉侯之疾非廢夏郊之禍非廢夏郊之禍則晉侯有間非祀夏郊之福也無福之實則無有知之驗矣亦猶淮南王劉安坐謀反而死世傳以為仙而升天本傳之虛子産聞}
