  - {type: variant, offset: 885, length: 1, content: 既, SBCK: 則謂王季欲見百姓者也齊景公將伐宋師過太山公夢二丈人立而怒甚盛公告晏子晏子曰是宋之先湯與伊尹也公疑以為㤗山神晏子曰公疑之則嬰請言湯伊尹之狀湯晳以長頥以髯銳上而豐下据身而揚聲公曰然是已伊尹黒而短蓬而髯豐上而銳下僂身而下聲公曰然是已今奈何晏子曰夫湯太甲武丁祖巳天下之盛君也不冝無後今唯宋耳而公伐之故湯伊尹怒請散師和於宋公不用終伐宋軍果敗夫湯伊尹有知惡景公之伐宋故見夢盛怒以禁止之景公不止軍果不吉曰夫景公亦曾夢見彗星其時彗星不出果不吉曰夫然而夢見之者見彗星其實}
