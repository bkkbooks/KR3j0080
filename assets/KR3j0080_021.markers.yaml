  - {type: variant, offset: 825, length: 0, content: '', SBCK: 恨故目不瞑更謚曰成人字一有心喜乃瞑精神聞人之議見人變易其謚故喜目瞑本不病目人不撫慰目自翕張非神而何曰此復荀偃類也雖不病目亦不空張成王於時縊死氣尚盛新絶目尚開因謚曰靈少久氣衰目適欲瞑連更曰成目之視瞑與謚之為靈偶應也時人見其應成乃瞑則謂成王之魂有所知則宜終不瞑也何則太子殺已大惡也加謚為靈小過也不為大惡懷忿反為小過有恨非有神之效見示告人之驗也夫惡謚非靈則厲也紀於竹帛為靈厲者多矣其尸}
