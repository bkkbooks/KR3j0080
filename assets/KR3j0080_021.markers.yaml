  - {type: variant, offset: 9, length: 1, content: 既, SBCK: 而見我焉許之遂不見及期狐突之新城西偏巫者之舍復與申生相見申生告之曰帝許罸有罪矣斃之於韓其後四年惠公與秦穆公戰於韓地為穆公所獲竟如其言非神而何曰此亦杜伯莊子義之類何以明之夫改葬私怨也上帝公神也以私怨爭於公神何肯聽之帝許以晉畀秦狐突}
