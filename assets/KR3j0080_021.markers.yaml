  - {type: variant, offset: 875, length: 0, content: '', krp: 段如不能為鬼子産何以不疑曰與伯有為怨者子晳也子晳攻之伯有犇駟帶}
  - {type: variant, offset: 876, length: 0, content: '', SBCK: 率國人遂伐伯有公孫段隨駟帶不造本辯其惡㣲小殺駟帶不報子晳公孫段惡㣲與帶俱死是則伯有之魂無知為鬼報仇輕重失宜也且子産言曰彊死者能為鬼何謂彊死謂伯有命未當死而人殺之邪將謂伯有無}
  - {type: page-break, offset: 876, content: '', id: KR3j0080_SBCK_021-7a}
  - {type: variant, offset: 876, length: 0, content: '', WYG: 率國人遂伐伯有公孫段隨駟帶不造本辯其惡㣲小殺駟帶不報子晳公孫段惡㣲與帶俱死是則伯有之魂無知為鬼報仇輕重失宜也且子産言曰彊死者能為鬼何謂彊死謂伯有命未當死而人殺之邪將謂伯有無}
  - {type: variant, offset: 876, length: 0, content: '', krp: 率國人遂伐伯有公孫段隨駟帶不造本辯其惡㣲小殺駟帶不報子晳公孫段惡㣲與帶俱死是則伯有之魂無知為鬼報仇輕重失宜也且子産言曰彊死者能為鬼何謂彊死謂伯有命未當死而人殺之邪將謂伯有無}
  - {type: variant, offset: 877, length: 2, content: 地脈, SBCK: 而人寃之也如謂命未當死而人殺之未當死而死者多如謂無罪人寃之被寃者亦非一伯有彊死能為鬼比干子胥不為鬼春秋之時弑君三十六君為所弑可謂彊死矣典長一國用物之精可謂多矣繼體有土非直三世也貴為人君非與卿位同也始封之祖必有穆公子良之類也以至尊之國君受亂臣之弑禍其魂魄為鬼必明於伯有報仇殺讎禍繁於帶段三十六君無為鬼者三十六臣無見報者如以伯有無道其神有知世間無道莫如桀紂桀紂誅死魄不能為鬼然則子産之説因成事者也見伯有彊死則謂彊死之人能為鬼如有不彊死為鬼者則將云不彊死之人能為鬼子晳在鄭與伯有何異死與伯有何殊俱以無道為國所殺伯有能為鬼子晳不能彊死之説通於伯有塞於子晳然則伯有之說杜伯之語也杜伯未可然伯有亦未可是也秦桓公伐晉次于輔氏晉侯治兵于稷以略翟土立黎侯而還及魏顆敗秦師于輔氏獲杜回杜回秦之力人也初魏武子有嬖妾無子武子疾命顆曰必嫁是妾病困則更曰必以是為殉及武子卒顆不殉妾人或難之顆曰疾病則亂吾從其治也及輔氏之役魏顆見老人結草以亢杜回杜回躓而顚故獲之夜夢見老父曰余是所嫁婦人之父也爾用先人之治命是以報汝夫嬖妾之父知魏顆之徳故見體為鬼結草助戰神曉有知之效驗也曰夫婦人之父能知魏顆之徳為鬼見形以助其戰必能報其生時所善殺其生時所惡矣凡人交遊必有厚薄厚薄當報猶婦人之當謝也今不能報其生時所厚獨能報其死後所善非有知之驗能為鬼之效也張良行泗水上老父授書光武困厄河北老人教誨命貴時吉當遇福喜之應驗也魏顆當獲杜回戰當有功故老人妖象結草於路人者也王季葬於滑山之尾欒水擊其墓見棺之前和文王曰嘻先君必欲一見羣臣百姓}
