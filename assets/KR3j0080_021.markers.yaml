  - {type: variant, offset: 26, length: 0, content: '', SBCK: 為也驪姬譛殺其身惠公改葬其改尸葬之惡㣲於殺人惠公之罪輕於驪姬請罰惠公不請殺驪姬是則申生憎改葬不怨見殺也秦始皇用李斯之議燔燒詩書後又坑儒博士之怨不下申生坑儒之惡痛於改葬然則秦之死儒不請於帝見形為鬼諸生㑹告}
