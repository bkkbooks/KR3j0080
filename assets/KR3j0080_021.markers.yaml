  - {type: variant, offset: 888, length: 2, content: 太史, SBCK: 是之秦并天下絶伊尹之後遂至於今湯伊尹不祀何以不怒乎鄭子産聘於􅀳􅀳侯有疾韓宣子逆客私焉曰寡君寢疾於今三月矣並走羣望有加而無瘳今夢黄熊入於寢門其何厲鬼也對曰以君之明子為大政其何厲之有昔堯殛鯀于羽山其神為黄熊以入于羽淵實為夏郊三代祀之晉為盟主其或者未之祀乎韓子祀夏郊晉侯有間黄熊鯀之精神晉侯不祀故入寢門晉知而祀之故疾有間非死人有知之驗乎夫鯀殛於羽山人知也神為黄熊入于羽淵人何以得知之使若魯}
  - {type: page-break, offset: 888, content: '', id: KR3j0080_SBCK_021-10a}
