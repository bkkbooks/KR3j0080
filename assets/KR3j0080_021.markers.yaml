  - {type: variant, offset: 1814, length: 207, content: 者說曰韓非公子卬有陰惡伏罪人不聞見天獨知之故受戮殃夫諸有罪之人非賊賢則逆道如賊賢則被所賊者何負如逆道則被所逆之道何非凡人窮達禍福之至大之則命小之則時太公窮賤遭周文而得封甯戚隱阨逢齊桓而見官非窮賤隱阨有非而得封見官有是也窮達有時遭遇有命也太公甯戚賢者也尚可謂有非聖人純道者也虞舜為父弟所害幾死再三有遇唐堯堯禪舜不為帝嘗見害未有非立為帝未有是前時未到後則命時至也案古人君臣困窮後得達通未必初有惡天禍其前卒有善神祐其後也, SBCK: 衡卷第二十}
