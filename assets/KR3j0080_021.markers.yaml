  - {type: variant, offset: 1028, length: 209, content: 非者矣己無非則其非蒙恬非也作伯夷之傳則列善惡之行云七十子之徒仲尼獨薦顏淵好學然回也屢空糟糠不厭卒夭死天之報施善人如何哉盜跖日殺不辜肝人之肉暴戾恣睢聚黨數千橫行天下竟以壽終是獨遵何哉若此言之顏回不當早夭盜跖不當全活也不怪顏淵不當夭而獨謂蒙恬當死過矣漢將李廣與望氣王朔燕語曰自漢擊匈奴而廣未常不在其中而諸校尉以下才能不及中然以胡軍功取侯者數十人而廣不為後人然終無尺寸之功以得封邑者何也豈吾相不當侯且固命也朔曰將軍自念豈常有, SBCK: 知}
