  - {type: variant, offset: 1201, length: 3, content: 兵彊威, SBCK: 孳矣作純厚純誠一或曰聖人作賢者述以賢而作者非也論衡政務可謂作者非曰作也亦非述也論也論者述之次也五經之興可謂作矣太史公書劉子政序班叔皮傳可謂述矣桓山君新論鄒伯竒檢論可謂論矣今觀論衡政務桓鄒之二論也非所謂作也造端更為前始末有若倉頡作書奚仲作車是也易言伏羲作八卦前是未有八卦伏羲造之故曰作也文王圗八自演為六十四故曰衍謂論衡之成猶六十四卦而又非也六十四卦以狀衍增益其卦溢其數多今論衡就世俗之書訂其真偽辯其實虚非造始更為}
