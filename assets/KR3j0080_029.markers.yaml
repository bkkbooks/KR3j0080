  - {type: variant, offset: 2436, length: 1315, content: 任刑治政亂而無功甫侯諫之穆王存德享國久長功傳於世夫穆王之治初亂終治非知昏於前才妙於後也前任蚩尤之刑後用甫侯之言也夫治人不能捨恩治國不能廢德治物不能去春韓子欲獨任刑用誅如何魯繆公問於子思曰吾聞龐𢵧是子不孝不孝其行奚如子思對曰君子尊賢以崇德舉善以勸民若夫過行是細人之所識也臣不知也子思出子服厲伯見君問龐𢵧是子子服厲伯對以其過皆君之所未曾聞自是之後君貴子思而賤子服厲伯韓子聞之以非繆公以為明君求姦而誅之子思不以姦聞而厲伯以姦對厲伯宜貴子思宜賤今繆公貴子思賤厲伯失貴賤之宜故非之也夫韓子所尚者法度也人為善法度賞之惡法度罰之雖不聞善惡於外善惡有所制矣夫聞惡不可以行罰猶聞善不可以行賞也非人不舉姦者非韓子之術也使韓子聞善必將試之試之有功乃肯賞之夫聞善不輒加賞虛言未必可信也若此聞善與不聞無以異也夫聞善不輒賞則聞惡不輒罰矣聞善必試之聞惡必考之試有功乃加賞考有驗乃加罰虛聞空見實試未立賞罰未加賞罰未加善惡未定未定之事須術乃立則欲耳聞之非也鄭子產晨出過東匠之宮聞婦人之哭也撫其僕之手而聽之有間使吏執而問之手殺其夫者也翼日其僕問曰夫子何以知之子產曰其聲懼凡人於其所親愛也知病而憂臨死而懼已死而哀今哭夫已死不哀而懼是以知其有姦也韓子聞而非之曰子產不亦多事乎姦必待耳目之所及而后知之則鄭國之得姦者寡矣不任典城之吏察參伍之正不明度量待盡聰明勞知慮而以知姦不亦無術乎韓子之非子產是也其非繆公非也夫婦人之不哀猶龐𢵧是子不孝也非子產待耳目以知姦獨欲繆公須問以定邪子產不任典城之吏而以耳聞定實繆公亦不任吏而以口問立誠夫耳聞口問一實也俱不任吏皆不參伍厲伯之對不可以立實猶婦人之哭不可以定誠矣不可以定誠使吏執而問之不可以立實不使吏考獨信厲伯口以罪不考之姦如何韓子曰子思不以過聞繆公貴之子服厲伯以姦聞繆公賤之人情皆喜貴而惡賤故季氏之亂成而不上聞此魯君之所以劫也夫魯君所以劫者以不明法度邪以不早聞姦也夫法度明雖不聞姦姦無由生法度不明雖日求姦決其源鄣之以掌也御者無銜見馬且犇無以制也使王良持轡馬無欲犇之心御之有數也今不言魯君無術而曰不聞姦不言審法度而曰不通下情韓子之非繆公也與術意而相違矣龐𢵧是子不孝子思不言繆公貴之韓子非之以為明君求善而賞之求姦而誅之夫不孝之人下愚之才也下愚無禮順情從欲與鳥獸同謂之惡可也謂姦非也姦人外善內惡色厲內荏作為操止像類賢行以取升進容媚於上安肯作不孝著身為惡以取棄殉之咎乎龐𢵧是子可謂不孝不可謂姦韓子謂之姦失姦之實矣韓子曰布帛尋常庸人不擇爍金百鎰盜跖不搏以此言之法明民不敢犯也設明法於邦有盜賊之心不敢犯矣不測之者不敢發矣姦心藏於胸中不敢以犯罪法罪法恐之也明法恐之則不須考姦求邪於下矣使法峻民無姦者使法不峻民多為姦而不言明王之嚴刑峻法而云求姦而誅之言求姦是法不峻民或犯之也世不專意於明法而專心求姦韓子之言與法相違人之釋溝渠也知其必溺身不塞溝渠而繕船楫者知水之性不可閼其勢必溺人也臣子之性欲姦君父猶水之性溺人也不教所以防姦而非其不聞知是猶不備水之具而徒欲早知水之溺人也溺於水不責水而咎己者己失防備也然則人君劫於臣己失法也備溺不閼水源防劫不求臣姦韓子所宜用教己也水之性勝火如裹之以釜水煎而不得勝必矣夫君猶火也臣猶水也法度釜也火不求水之姦君亦不宜求臣之罪也, SBCK: 論衡卷第二十九}
