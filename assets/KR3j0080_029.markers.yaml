  - {type: variant, offset: 1160, length: 1, content: 畏, SBCK: 壊廢則韓非之書不為髙祖不辨得天下馬上之計未轉則陸賈之語不奏衆事不失實凡論不壊亂則桓譚之論不起故夫賢聖之興文也起事不空為因因不妄作作有益於化化有補於正故漢立蘭臺之官校審其書以考其言董仲舒作道術之書頗言災異政治所失書成文具表在漢室主父偃嫉之誣奏其書天子下仲舒於吏當謂之下愚仲舒當死天子赦之夫仲舒言災異之事孝武}
