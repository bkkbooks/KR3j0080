  - {type: variant, offset: 611, length: 482, content: 職功雖不立此禮義為業者也國之所以存者禮義也民無禮義傾國危主今儒者之操重禮愛義率無禮之士激無義之人人民為善愛其主上此亦有益也聞伯夷風者貪夫廉懦夫有立志聞柳下惠風者薄夫敦鄙夫寬此上化也非人所見段干木闔門不出魏文敬之表式其閭秦軍聞之卒不攻魏使魏無干木秦兵入境境土危亡秦彊國也兵無不勝兵加於魏魏國必破三軍兵頓流血千里今魏文式闔門之士卻彊秦之兵全魏國之境濟三軍之眾功莫大焉賞莫先焉齊有高節之士曰狂譎華士二人昆弟也義不降志不仕非其主太公封於齊以此二子解沮齊眾開不為上用之路同時誅之韓子善之以為二子無益而有損也夫狂譎華士段干木之類也太公誅之無所卻到魏文侯式之卻彊秦而全魏功孰大者使韓子善干木闔門高節魏文式之是也狂譎華士之操干木之節也善太公誅之非也使韓子非干木之行下魏文之式則干木以此行而有益魏文用式之道為有功是韓子不賞功尊有益也論者或曰魏文式段干木之閭秦兵為之不至非法度之功一功特然不可常行雖全國有益非所貴也夫法度之功者謂何等也養三軍之士明賞罰之命嚴刑峻法富國彊兵此法度也案秦之彊肯為此乎六國之亡皆滅於秦兵六國之兵非不銳士眾之力非不勁也然而不勝至於破亡者彊弱不敵眾寡不同雖明法度, SBCK: 龍}
