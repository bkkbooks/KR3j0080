  - {type: variant, offset: 1699, length: 0, content: '', SBCK: 夫作書者上書奏記之文也記謂之造作上書上書奏記是作也晉之乗而楚之檮杌魯之春秋人事各不同也易之乾坤春秋之元楊氏之􅀇卜氣號不均也由此言之唐林之奏谷永之章論衡政務同一趨也漢家極筆墨之林書論之造漢家尤多陽成子張作樂楊子雲造􅀇二經發於臺下讀於闕掖卓絶驚耳不述而作材疑聖人而漢朝不譏況論衡細說微論解釋世俗之疑辯照是非之理使後進曉見然否之分恐其廢失著之簡牘祖經章句之說先師竒說之類也其言伸繩彈割俗傳俗傳蔽惑偽書放流賢通之人疾之無已孔子曰詩人疾之不能黙丘疾之不能伏是以論也玉亂於石人不能别或若楚之王尹以玉為石卒使卞和受刖足之誅是反為非虚轉為實安能不言俗傳既過俗書又偽若夫鄒衍謂今天下為一州四海之外有若天下者九州淮南書言共工與顓頊争為天子不勝怒而觸不周之山使天柱折地維絶堯時十日並出堯上射九日魯陽戰而日暮援戈麾日日為郤還世間書傳多若等類浮妄虚偽没奪正是心濆涌筆手擾安能不論論則考之以心效之以事浮虚之事輒立證驗若}
