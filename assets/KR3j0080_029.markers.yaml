  - {type: variant, offset: 1169, length: 1, content: 避, SBCK: 罪而尊其身況所論無觸忌之言核道實之事收故實之語乎故夫賢人之在世也進則盡忠宣化以明朝廷退則稱論貶說以覺失俗俗也不知還則立道輕為非論者不追救則迷亂不覺悟是故論衡之造也起衆書並失實虛妄之言勝真美也故虚妄之語不黜則華文不見息華文放流則實事不見用故論衡者所以銓輕重之言立真僞之平非茍調文飾辭爲竒偉之觀}
