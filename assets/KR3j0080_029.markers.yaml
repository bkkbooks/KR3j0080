  - {type: variant, offset: 24, length: 0, content: '', SBCK: 天作殷本紀言契母簡狄浴於川遇􅀇鳥墜􅆑吞之遂生契焉及周本紀言后稷之母姜嫄野出見大人跡履之則姙身生后稷焉夫觀世表則契與后稷黄帝之子孫也讀殷周本紀則􅀇鳥大人之精氣也二者不可兩傳而太史公兼紀不别案帝王之妃不宜野出浴於川水今言浴於川吞􅀇鳥之卵出於野履大人之跡違尊貴之節誤是非之言也新語陸賈所造盖董仲舒相被服焉皆言君臣政}
