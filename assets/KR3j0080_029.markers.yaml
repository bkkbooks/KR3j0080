  - {type: variant, offset: 150, length: 114, content: 服相違行與術相反吾是以非其言而不用其法也煩勞人體無益於人身莫過跪拜使韓子逢人不拜見君父不跪未必有賊於身體也然須拜跪以尊親者禮義至重不可失也故禮義在身身未必肥而禮義去身身未必瘠而化衰以謂有益禮義不如飲食使韓子賜食君父之前不拜而用肯, SBCK: 晉同禍}
