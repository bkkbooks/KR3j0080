  - {type: variant, offset: 1961, length: 419, content: 法而去故齊有陳氏劫殺之患太公之術致劫殺之法也韓子善之是韓子之術亦危亡也周公聞太公誅二子非而不是然而身執贄以下白屋之士白屋之士二子之類也周公禮之太公誅之二子之操孰為是者宋人有御馬者不進拔劍剄而棄之於溝中又駕一馬馬又不進又剄而棄之於溝若是者三以此威馬至矣然非王良之法也王良登車馬無罷駑堯舜治世民無狂悖王良馴馬之心堯舜順民之意人同性馬殊類也王良能調殊類之馬太公不能率同性之士然則周公之所下白屋王良之馴馬也太公之誅二子宋人之剄馬也舉王良之法與宋人之操使韓子平之韓子必是王良而非宋人矣王良全馬宋人賊馬也馬之賊則不若其全然則民之死不若其生使韓子非王良自同於宋人賊善人矣如非宋人宋人之術與太公同非宋人是太公韓子好惡無定矣治國猶治身也治一身省恩德之行多傷害之操則交黨踈絕恥辱至身推治身以況治國治國之道當任德也韓子任刑獨以治世是則治身之人任傷害也韓子豈不知任德之為善哉以為世衰事變民心靡薄故作法術專意於刑也夫世不乏於德猶歲不絕於春也謂世衰難以德治可謂歲亂不, SBCK: ''}
