  - {type: variant, offset: 1132, length: 4, content: 脩禮盡敬, SBCK: 作春秋周民􅁦也故采求毫毛之善貶纎介之惡撥亂世反諸正人道浹王道備所以檢押靡薄之俗者悉具宻致夫防决不備有水溢之害網解不結有獸失之患是故周道不􅁦則民不文薄民不文薄春秋不作楊墨之學不亂傳義則}
