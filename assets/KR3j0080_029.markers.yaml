  - {type: page-break, offset: 4, content: '', id: KR3j0080_SBCK_029-1b}
  - {type: variant, offset: 6, length: 1, content: 術, SBCK: 法事鬼求福福罕至而禍常來也以一況百而墨家為法皆若此類也廢而不傳盖有以也春秋左氏傳者盖出孔子壁中孝武皇帝時魯共王壊孔子教授堂以為宫得佚春秋三十篇左氏傳也公羊髙榖梁寘胡母氏皆傳春秋各門異戸獨左氏傅為近得實何以驗之禮記造於孔子之堂太史公漢之通人也左氏之言與二書合公羊髙糓梁寘胡母氏不相合又諸家去孔子逺逺不如近聞不如見劉子政玩弄左氏童僕妻子皆呻吟之光武皇帝之時陳元范叔上書連屬條事是非左氏遂立范叔尋因罪罷元叔天下極才講論是非有餘力矣陳元言訥范叔章詘左氏得實}
  - {type: page-break, offset: 6, content: '', id: KR3j0080_SBCK_029-2a}
