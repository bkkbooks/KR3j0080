  - {type: variant, offset: 1, length: 3, content: 韓篇韓, SBCK: 死人之精也右之未可知今墨家謂鬼審人之精也厚其精而薄其屍此於其神厚而於其體薄也薄厚不相勝華實不相副則怒而降禍雖有其鬼終以死恨人情欲厚惡薄神心猶然用墨}
