  - {type: variant, offset: 266, length: 200, content: 乎夫拜跪禮義之效非益身之實也然而韓子終不失者不廢禮義以苟益也夫儒生禮義也耕戰飲食也貴耕戰而賤儒生是棄禮義求飲食也使禮義廢綱紀敗上下亂而陰陽繆水旱失時五穀不登萬民饑死農不得耕士不得戰也子貢去告朔之餼羊孔子曰賜也爾愛其羊我愛其禮子貢惡費羊孔子重廢禮也故以舊防為無益而去之必有水災以舊禮為無補而去之必有亂患儒者之在世禮義之舊防也有之無益無之有損庠序之設自古有之重本尊始故立官置吏官不可廢道不可棄儒生道官之吏, SBCK: 再}
