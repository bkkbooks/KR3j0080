  - {type: variant, offset: 1126, length: 0, content: '', SBCK: 才有髙下言有是非不論善惡而徒貴古是謂古人賢今人也案東畨鄒伯竒臨淮袁太伯袁文術㑹稽吳君髙周長生之軰位雖不至公卿誠能知之囊槖文雅之英雄也觀伯竒之元思太伯之易章句文術之箴銘君髙之越紐録長生之洞歴劉子政揚子雲不能過也善才有淺深無有古今文有偽真無有故新廣陵陳子迴顔方今尚書郎班固蘭臺令楊終􅀓毅之徒雖無篇章賦頌記奏文辭斐炳賦象屈原賈生奏象唐林谷永並比以觀好其美一也當今未顯使在百世之後則子政子雲之黨也韓非著書李斯采以言事楊子雲作太􅀇侯鋪子隨而宣之非􅀻同門雲鋪共朝覩竒見益不為古今變心易意實事貪善不逺為術併肩以迹相輕好竒無已故竒名無窮楊子雲反離騷之經非能盡反一篇文往往見非反而奪之六畧之錄萬三千篇雖不盡見指趣可知略借不合義者案而論之對作篇或問曰賢聖不空生必有以用其心上自孔墨之黨下至荀}
