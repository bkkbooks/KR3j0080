markers:
  front:
  - {type: variant, offset: 0, length: 0, content: '', SBCK: 論衡卷第二十九王充案書篇對作篇案書篇儒家之宗孔子也墨家之祖墨翟也且案儒道傳而墨法廢者儒之道義可為而墨之法議難從也何以驗之墨家薄葬右鬼道乖相反違其實宜以難從也乖違如何使鬼}
  - {type: page-break, offset: 0, content: '', id: KR3j0080_SBCK_029-1a}
  - {type: variant, offset: 0, length: 0, content: '', WYG: 欽定四庫全書論衡卷二十九漢王充撰案書篇對作篇案書篇儒家之宗孔子也墨家之祖墨翟也且案儒道傳而墨法廢者儒之道義可為而墨之法議難從也何以驗之墨家薄葬右鬼道乖相反違其實宜以難從也乖違如何使鬼}
  - {type: page-break, offset: 0, content: '', id: KR3j0080_WYG_029-1a, image: WYG0862/WYG0862-0333a.png}
