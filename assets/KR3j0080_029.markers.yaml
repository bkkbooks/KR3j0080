  - {type: variant, offset: 1189, length: 2, content: 力少, SBCK: 論說者閔世憂俗與衛驂乗者同一心矣愁精神而幽魂魄動胷中之静氣賊年損夀無益於性禍重於顔回違負黄老之教非人所貪不得已故為論衡文露而㫖直辭姦而情實其政務言治民之道論衡諸篇實俗間之凢人所能見與彼作者無以異也若夫九虚三増論死訂鬼世俗所乆惑人所不能覺也人君遭弊改教於上人臣愚惑作論於下實得}
