  - {type: variant, offset: 1111, length: 0, content: '', WYG: 言也讀之者或為亂我書者煩亂孔子之書也或以為亂者理也理孔子之書也共一亂字理之與亂相去甚逺然而讀者用心不同不省本實故說誤也夫言煩亂孔子之書才髙之語也其言理孔子之書亦知竒之言也出入聖人之門亂理孔子之書子長子雲無此言焉世俗用心不實省事失情二語不定轉側不安案仲舒之書不違儒家不及孔子其言煩亂孔子之書者非也孔子之書不亂其言理孔子之書者亦非也孔子曰師摯之始闗雎之亂洋洋乎盈耳哉亂者於孔子言也孔子生周始其本仲舒在漢終其末班叔皮續太史公書盖其義也賦頌篇下其有亂曰章盖其類也孔子終論定於仲舒之言其修雩治龍必將有義未可怪也顔淵曰舜何人也予何人也五帝三王顔淵獨慕舜者知巳步騶有同也知徳所慕黙識所追同一實也仲舒之言道徳政治可嘉美也質定世事論說世疑桓君山莫上也故仲舒之文可及而君山之論難追也驥與衆馬絶跡或蹈驥哉有馬於此足行千里終不名驥者與驥毛色異也有人於此文偶仲舒論次君山終不同於二子者姓名殊也故馬效千里不必􅂹騄人期賢知不必孔墨何以驗之君山之論難追也兩刄相割利鈍乃知二論相訂是非乃見是故韓非之四難桓寛之鹽鐵君山新論之類也世人或疑言非是偽論者實之故難為也卿决疑訟獄定嫌罪是非不决曲直不立世人必謂卿獄之吏才不任職至於論不務全疑兩傳并紀不宜明處孰與剖破渾沌解决亂絲言無不可知文無不可曉哉案孔子作春秋采毫毛之善貶纎介之惡可褒則義以明其行善可貶則明其惡以譏其}
