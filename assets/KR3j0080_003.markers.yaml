  - {type: variant, offset: 434, length: 1, content: 貴, SBCK: 實也夫告子之言亦有縁也詩曰彼姝之子何以與之其傳曰譬猶練絲染之藍則青染之朱則赤夫決水使之東西猶染絲令之青赤也丹朱商均巳染於唐虞之化矣然而丹朱慠而商均虐者至惡之質不受藍朱變也孫卿有反孟子作性惡之篇以爲人性惡其善者僞也性惡者以爲人生皆得惡性也僞者長大之後勉使爲善也若孫卿之言人㓜小無有善也稷爲兒以種樹爲戯孔子能行以俎豆爲弄石生而堅蘭生而香禀善氣長大就成故種樹之戯爲唐司馬俎豆之弄爲周聖師禀蘭石之性故有堅香之驗夫孫卿之言未爲得實然而性惡之言有縁也一歳嬰兒無推讓之心見食號欲食之睹好啼欲玩之長大之後禁情割欲勉厲爲善矣劉子政非之曰如此則天無氣也隂陽善惡不相當則人之爲善安從生陸賈曰天地生人也以禮義之性人能察己所以受命則順順之謂道夫陸賈知人禮義爲性人亦能察己所以受命性善者不待察而自善性惡者雖能察之猶背禮畔義義挹於善不能爲也故貪者能言亷亂者能言治盗跖非人之竊也莊蹻刺人之濫也明能察己口能論賢性惡不爲何益於善陸賈之言未能得實董仲舒覽孫孟之書作情性之􅀃曰天之大經一隂一陽人之大經一情一性性生於陽情生於隂隂氣鄙陽氣仁曰性善者是見其陽也謂惡者是見其隂者也若仲舒之言謂孟子見其陽孫卿見其隂也處二家各有見可也不處人情性情性有善有惡未也夫人情性同生於隂陽其生於隂陽有渥有泊玉生於石有純有駮情性於隂陽安能純善仲舒之言未能得實劉子政曰性生而然者也在於身而不發情接於物而然者也出形於外形外則謂之陽不發者則謂之隂夫子政之言謂性在身而不發情接於物形出於外故謂之陽性不發不與物接故謂之隂夫如子政之言乃謂情爲陽性爲隂也不據本所生起茍以形出與不發見定隂陽也必以形出爲陽性亦與物接造次必於是顛沛必於是惻隱不忍不忍仁之氣也卑謙辭讓性之發也有與接㑹故惻隱卑謙形出於外謂性在内不與物接恐非其實不論性之善惡徒議外内隂陽理難以知且從子政之言以性爲隂情爲陽夫人禀情竟有善惡不也自孟子以下至劉子政鴻儒博生聞見多矣然而論情性竟無定是唯世碩儒公孫尼子之徒頗得其正由此言之事易知道難論也酆文茂記繁如榮華恢諧劇談甘如飴蜜未必得實實者人性有善有惡猶人才有高有下也高}
