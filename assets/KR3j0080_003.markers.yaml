  - {type: variant, offset: 238, length: 0, content: '', SBCK: 效矣文王得赤雀武王得白魚赤烏儒者論之以爲雀則文王受命魚烏則武王受命文武受命於天天用雀}
  - {type: variant, offset: 238, length: 0, content: '', WYG: 效矣文王得赤雀武王得白魚赤烏儒者論之以爲雀則文王受命魚烏則武王受命文武受命於天天用雀}
  - {type: variant, offset: 238, length: 0, content: '', krp: 效矣文王得赤雀武王得白魚赤烏儒者論之以爲雀則文王受命魚烏則武王受命文武受命於天天用雀}
  - {type: variant, offset: 239, length: 0, content: '', SBCK: 魚烏命授之也天用赤雀命文王文王不受天復用魚烏命武王也若此者謂夲無命於天脩已行善善行聞天天乃授以帝王之命也故雀與魚烏天使爲王之命也王所奉以行誅者也如實論之非命也命謂初所稟得而生也人生受性則受命矣性命俱稟同時並得非先禀性後乃受命也何以明之棄事堯爲司馬居稷官故爲后稷曽孫公劉居邰後徙居邠後孫古公亶甫三子太伯仲雍季歷季歷生文王昌昌在襁褓之中聖瑞見矣故古公曰我世當有興者其在昌乎於是太伯知之乃辭之呉文身斷髪以讓王季文王受命謂此}
  - {type: page-break, offset: 239, content: '', id: KR3j0080_SBCK_003-11b}
