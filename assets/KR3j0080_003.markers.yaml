  - {type: variant, offset: 906, length: 0, content: '', SBCK: 未必面青也鷹之擊鳩雀鴞之啄鵠鴈未必鷹鴞生於南方而鳩雀鵠鴈産於西方也自是䈥力勇怯相勝服也一堂之上必有論者一郷之中必有訟者訟必有曲直論必有是非非而曲者爲􅀒是而直者爲勝亦或辯口利舌辭喻横出爲勝或詘弱綴跲蹥蹇不比者爲􅀒以舌論訟猶是劔㦸􅋐也利劔長㦸手足健疾者勝頓刀短矛手足緩留者負天物之相勝或以䈥力或以氣勢或以巧便小有氣勢口足有便則能以小而制大大無骨力角翼不勁則以大而服小鵲食蝟皮博勞食虵蝟虵不便也蚊虻之力不如牛馬牛馬困於蚊虻蚊虻乃有勢也鹿之角足以觸犬獼猴之手足以搏䑕然而鹿制於犬獼猴服於䑕角爪不利也故十年之牛爲牧竪所驅長仞之象爲越僮所鉤無便故也故夫得其便也則以小能勝大無其便也則以彊服於羸也竒怪篇儒者稱}
