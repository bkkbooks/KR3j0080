  - {type: variant, offset: 643, length: 2, content: 毀於, SBCK: 模範爲形故作之也燃炭生火必調和鑪竈故爲之也及銅爍不能皆成器燔不能盡善不能故生也夫天不能故生人則其生萬物亦不能故也天地合氣物偶自生矣夫耕耘播種故爲之也及其成與不熟偶自然也何以驗之如天故生萬物當令其相親愛不當令之相賊害也或曰五}
