  - {type: variant, offset: 431, length: 2, content: 籌筴, SBCK: 語上也告子之以決水喻者徒謂中人不指極善極惡也孔子曰性相近也習相遠也夫中人之性在所習焉習善而爲善習惡而爲惡也至於極善極惡非復在習故孔子曰惟上智與下愚不移性有善不善聖化賢教不能復移易也孔子道德之祖諸子之中最卓者也而曰上智下愚不移故知告子之言未}
