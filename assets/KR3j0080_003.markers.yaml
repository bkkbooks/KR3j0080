  - {type: variant, offset: 249, length: 0, content: '', SBCK: 善也微子曰我舊云孩子王子不出紂爲孩子之時微子睹其不善之性性惡不出衆庶長大爲亂不變故云也羊舌食我初生之時叔姬視之及堂聞其啼聲而還曰其聲豺狼之聲也野心無親非是莫滅羊舌氏遂不肯見及長與字一有祁勝爲亂食我與焉國人殺食我羊舌氏由是滅矣紂之惡在孩子之時食我之亂見始生之聲孩子始生未與物接誰令悖者丹朱土於唐宫商均生於虞室唐虞之時}
  - {type: page-break, offset: 249, content: '', id: KR3j0080_SBCK_003-15b}
  - {type: variant, offset: 249, length: 0, content: '', WYG: 善也㣲子曰我舊云孩子王子不出紂爲孩子之時㣲子睹其不善之性性惡不出衆庻長大爲亂不變故云也羊舌食我初生之時叔姬視之及堂聞其啼聲而還曰其聲豺狼之聲也野心無親非是莫滅羊舌氏遂不肯見及長一有與字祁勝爲亂食我與焉國人殺食我羊舌氏由是滅矣紂之惡在孩子之時食我之亂見始生之聲孩子始生未與物接誰令悖者丹朱生於唐宫商均生於虞室唐虞之時}
