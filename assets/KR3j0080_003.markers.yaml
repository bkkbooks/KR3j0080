  - {type: variant, offset: 30, length: 191, content: 自王公逮庶人聖賢及下愚凡有首目之類含血之屬莫不有命命當貧賤雖富貴之猶涉禍患失其富貴矣命當富貴雖貧賤之猶逢福善離其貧賤矣故命貴從賤地自達命賤從富位自危故夫富貴若有神助貧賤若有鬼禍命貴之人俱學獨達並仕獨遷命富之人俱求獨得並為獨成貧賤反此難達難遷難得難成獲過受罪疾病亡遺失其富貴貧賤矣是故才高行厚未必保其必富貴智寡德薄未可信其必貧賤或時才高行厚命惡廢而不進知寡德薄命善興而超踰故夫臨事知愚, SBCK: 也}
