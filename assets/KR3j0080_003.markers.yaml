  - {type: variant, offset: 257, length: 0, content: '', SBCK: 不同氣也非㓜小之時瞭長大與人接乃更眊也性本自然善惡有質孟子之言情性未爲實也然而性善之論亦有所縁或仁或義性術乖也動作趨翔性識詭也面色或白或黑身形或長或短至老極死不可變易天性然也皆知水土物器形性不同而莫知善惡禀之異也子曰字一有告一歳嬰兒無爭奪之心長大之後或漸利色狂心悖行由此生也告子與孟子同時其論性無善惡之分譬之湍水決之東則東決之西則西夫水無分於東西猶人無分於善惡也夫告子之言謂人之性與水同也使性若水可以水喻性猶金之爲金木之爲木也人善因善惡亦因惡初禀天然之姿受純壹之質}
