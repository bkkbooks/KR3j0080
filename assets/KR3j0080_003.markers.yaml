  - {type: variant, offset: 642, length: 0, content: '', SBCK: 喻人稟氣不能純一若爍銅之下形燔器之得火也非謂天地生人與陶冶同也興喻人皆引人事人事有體不可斷絶以目視頭頭不得不動以手相足足不得不揺目與頭同形手與足同體今夫陶冶者初埏埴作器}
