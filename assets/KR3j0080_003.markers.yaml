  - {type: variant, offset: 1507, length: 2, content: 不求, SBCK: 龍爲吉物遭加其上吉祥之瑞受命之證也光武皇帝産於濟陽宫鳯凰集於地嘉禾生於屋聖人之生竒鳥吉物之爲瑞應必以竒吉之物見而子生謂之物之子是則光武皇帝嘉禾之精鳳凰之氣歟案帝繫之篇及三代世表禹鮌之子也卨稷皆帝嚳之子其母皆帝嚳之妃也及堯亦嚳之子帝王之妃何爲適草野古時雖質禮已設制帝王之妃何爲浴於水夫如是言聖人更稟氣於天母有感吞者虚妄之言也實者聖人}
