  - {type: variant, offset: 655, length: 4, content: 曰是必乏, SBCK: 言含血之蟲亦有不相勝之効午馬也子䑕也酉雞也卯兎也水勝火䑕何不逐馬金勝木雞何不啄兎亥豕也未羊也丑牛也土勝水牛羊何不殺豕巳虵也申猴也火勝金虵何不食獼猴獼猴者畏䑕也囓獼猴者犬也䑕水獼猴金也水不勝金獼猴何故畏䑕也戌土也申猴也土不勝金猴何故畏犬東方木也其星倉龍也西方金也其星白虎也南方火也其星朱鳥也北方水也其星􅀇武也天有四星之精降生四獸之體含血之蟲以四獸爲長四獸含五行之氣最較著案龍虎交不相賊鳥􅀛㑹不相害以四獸驗之以十二辰之禽效之五行之蟲以氣性相刻則尤不相應凢萬物相刻賊含血之蟲則相服至}
