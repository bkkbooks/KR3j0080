  - {type: variant, offset: 245, length: 1, content: 勉, SBCK: 謂合於自然也夲性篇情性者人治之夲禮樂所由生也故原情性之極禮爲之防樂爲之節性有卑謙辭讓故制禮以適其冝情有好惡喜怒哀樂故作樂以通其敬禮所以制樂所爲作者情與性也昔儒舊生著作篇章莫不論􅀃莫能實定周人世碩以爲人性有善有惡舉人之善性養而致之則善長固字一有無性惡養而致之則惡長如此則情字一有性各有隂陽善惡在所養焉故世子作養書一篇宻子賤漆雕開公孫尼子之徒亦論情性與世子相出入皆言性有善有惡孟子作性善之篇以爲人性皆善及其不善物亂之也謂人生於天地皆禀善性長大與物交接者欲字一有放縱悖亂不善日以生矣若孟子之言人㓜小之}
  - {type: page-break, offset: 245, content: '', id: KR3j0080_SBCK_003-15a}
