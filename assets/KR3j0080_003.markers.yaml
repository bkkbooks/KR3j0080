  - {type: variant, offset: 229, length: 2, content: 仕宦, SBCK: 然見我常身自下我誠使秦王須得志天下皆爲虜矣不可與交游乃亡去故范蠡尉繚見性行之證而以定處來事之實實有其效如其法相由此言之性命繋於形體明矣以尺書所載世所共見准況古今不聞者必衆多非一皆有其實稟氣於天立形於地察在地之形以知在天之命莫不得其實也有傳孔子相澹臺子羽唐舉占蔡澤不驗之文此失之不審何隱匿微妙之表也相或在内或在外或在形體或在聲氣察外者遺其内在形體者亡其聲氣孔子適鄭與弟子相失孔子獨立鄭東門鄭人或問子貢曰東門有人其頭似堯其項若臯陶肩類子産然自腰以下不及禹三寸傫傫若喪家之狗子貢以告孔子孔子欣然􅀏曰形狀未也如喪家狗然哉然哉夫孔子之相鄭人失其實鄭人不明法術淺也孔子之失子羽唐舉惑於蔡澤猶鄭人相孔子不能具見形狀之實也以貌取人失於子羽以言取人失於宰予也初稟篇人生性命當冨}
