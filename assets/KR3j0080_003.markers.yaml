  - {type: variant, offset: 227, length: 1, content: 才, SBCK: 共患難不可與共榮樂子何不去大夫種不能去稱病不朝賜劔而死大梁人尉繚說秦始皇以并天下之計始皇從其􅉺與之亢禮衣服飲食與之齊同繚曰秦王爲人隆凖長目鷙膺豺聲少恩虎視狼心居約易以下人得志亦輕視人我布衣}
