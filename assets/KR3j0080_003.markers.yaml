  - {type: variant, offset: 242, length: 0, content: '', krp: 在人本矣太王古公見之早也此猶爲未文王在母身之中已受命也王者一受命内以爲性外以爲體體者面輔骨法生而稟之吏秩百石以上王侯以下郎將大夫以至元士外及刺史太守居禄秩之吏禀冨貴之命生而有表見於面故許負姑布子卿輙見其驗仕者隨秩遷轉遷轉之人或至公卿命禄尊貴位望髙大王者尊貴之率髙大之最也生有髙大之命其時身有尊貴之竒古公知之見四乳之怪也夫四乳聖人證也在母身中禀天聖命豈長大之後脩行道德四乳乃生以四乳論望羊亦知爲胎之時巳受之矣劉媪息於大澤夢與神遇遂生髙祖此時巳受命也光武生於濟陽宫夜半無火内中光明軍下卒蘇永謂公曹史充蘭曰此吉事也毋多言此時巳受命獨謂文王武王得赤雀魚烏乃受命非也上天壹命王者乃興不復更命也得冨貴大命自起王矣何以驗之冨家之翁貲累千金生有冨骨治生積貨至於年老成爲冨翁矣夫王者天下之翁也禀命定於身中猶鳥之別雄雌於卵殻之中也卵殻孕而雌雄生日月至而骨節彊彊}
  - {type: variant, offset: 243, length: 0, content: '', SBCK: 雄自率將雌雄非生長之後或教使爲雄然後乃敢將雌此氣性剛彊自爲之矣夫王者天下之雄也其命當王王命定於懐姙猶冨貴骨生有鳥雄卵成也非唯人鳥也萬物皆然草木生於實核出土爲栽蘖稍生莖葉成爲長短巨細皆由實核王者長巨之最也朱草之莖如鍼紫芝之栽如豆成爲瑞矣王者禀氣而生亦猶此也或曰王者生禀天命及其將王天復命之猶公卿以下詔書封拜乃敢即位赤雀魚烏上天封拜之命也天道人事有相命使之義自然無爲天之道也命文以赤雀武以白魚是有爲也管仲與鮑叔分財取多鮑叔}
