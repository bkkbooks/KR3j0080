  - {type: variant, offset: 22, length: 0, content: '', SBCK: 偶自不長二偶三合似若有之其實自然非他爲也夏殷之朝適竆桀紂之惡適稔商周之數適起湯武之德適豐􅀜龍逢殺箕子比干囚死當桀紂惡盛之時亦二子命訖之期也任伊尹之言納吕望之議湯武且興之㑹亦二臣當用之際也人臣命有吉凶賢不肖之主與之相逢文王時當昌吕望命當貴髙宗治當平傅說徳當遂非文王髙宗爲二臣生吕望傅説爲兩君出也君明臣賢光曜相察上脩下治度數相得顔淵死子曰天喪予子路死子曰天祝予孔子自傷之辭非實然之道也孔子命不王二子壽不長也不王不長所稟不同度數並放適相應也二龍之祅當效周厲適闓櫝褒姒當䘮周國幽王稟性偶惡非二龍使厲王發孽褒姒令幽王愚惑也遭逢㑹遇自相得也僮謡之語當驗闘雞之變適生鸜鵒之占當應魯昭之惡適成非僮謡致鬬競鸜鵒招君惡也期數自至人行偶合也堯命當禪舜丹朱爲無道虞統當傳夏商均行不軌非舜禹當得天下能使二子惡也美惡是非適相逢也火星與昴星出入昴星低時火星出昴星見時火星伏非火之性厭服昴也時偶不並度轉乖也正月建寅斗魁破申非寅建使申破也轉運之衡偶自應也父殁而子嗣姑死而婦代非子婦代代使父姑終殁也老少年次自相承也世謂秋氣擊殺榖草榖草不任凋傷而死此言失實夫物以春生夏長秋而熟老適自枯死隂氣適盛與之㑹遇何以驗之物有秋不死者生性未極也人生百嵗而終物生一嵗而死死謂隂氣殺之人終觸何氣而亡論者猶或謂􅀑喪之夫人終􅀑來物死寒至皆適遭也人終見􅀑或見􅀑而不死物死觸寒或觸寒而不枯壊屋所􅎹崩崖所墜非屋精崖氣殺此人也屋老崖沮命凶之人遭㞐適履月毁於天螺消於淵風從虎雲從龍同類通氣性相感動若夫物事相遭吉凶同時偶適相遇非氣感也殺人者罪至大辟殺者當罪重死者命當盡也故害氣下降囚命先中聖王德施厚禄先逢是故德令降於殿堂命長之囚出於牢中天非爲囚未當死使聖王出德令也聖王適下赦拘囚適當免死猶人以夜臥晝起矣夜月光盡不可以作人力亦倦欲壹休息晝日光明人卧亦覺力亦復足非天以日作之以夜息之也作與日相應息與夜相得也鴈鵠集於㑹稽去避碣石之寒來遭民田之畢蹈履民田喙食草糧糧盡食索春雨適作避熱北去復之碣石象耕靈陵亦如此焉傳曰舜葬蒼梧象爲之耕禹葬㑹稽鳥爲之佃失事之實虚妄之言也丈夫有短壽之相娶必得早寡之妻早寡之妻嫁亦遇夭折之夫也世曰男女早死者夫賊妻妻害夫非相賊害命自然也使火燃以水沃之可謂水賊火火適自滅水適自覆兩名各自敗不爲相賊今男女之早夭非水沃火之比適自滅覆之類也賊父之子妨兄之弟與此同召同宅而處氣相加凌羸瘠消單至於死亡何謂相賊或客死千里之外兵燒厭溺氣不相犯相賊如何王莽姑姊正君許嫁二夫二夫死當適趙而王薨氣未相加遥賊三家何其痛也黄公取鄰巫之女卜謂女相貴故次公位至丞相其實不然次公當貴行與女㑹女亦自尊故入次公門偶適然自相遭遇時也無禄之人商而無盈農而無播非其性賊貨而命妨䅽也命貧居無利之貨禄惡殖不滋之䅽也世謂宅有吉凶徙有歳月實事則不然天道難知假令有命凶之人當衰之家治宅遭得不吉之地移徙適觸歳月之忌一家犯忌口以十數坐而死者必禄衰命泊之人也推此以論仕宦進退遷徙可復見也時適當退君用讒口時適當起賢人薦已故仕且得官也君子輔善且失位也小人毁竒公伯寮愬子路於季孫孔子稱命魯人臧倉讒孟子平於公孟子言天道未當行與讒相遇天未與已惡人用口故孔子稱命不怨公伯寮孟子言天不尤臧倉誠知時命當自然也推此以論人君治道功化可復言也命當貴時適平期當亂禄遭衰治亂成敗之時與人興衰吉凶適相遭遇因此論聖賢迭起猶此類也聖主龍興於倉卒良輔超㧞於際㑹世謂韓信張良輔助漢王故秦滅漢興髙祖得王夫髙祖命當自王信良之輩時當自興兩相遭遇若故相求是故髙祖起於豐沛豐沛子弟相多冨貴非天以子弟助髙祖也命相小大適相應也趙簡子廢太子伯魯立庻子無恤無恤遭賢命亦當君趙也世謂伯魯不肖不如無恤伯魯命當賤知慮多泯亂也韓生仕至太傅世謂頼倪寛實謂不然太傅當貴遭與倪寛遇也趙武藏於袴中終日不啼非或掩其口閼其聲也命時當生睡卧遭出也故軍功之侯必斬兵死之頭冨家之商必奪貧室之財削土免侯罷退令相罪法明曰禄秩適極故厲氣所中必加命短之人凶歳所著必饑虚耗之家矣骨相篇人曰命難知命甚易知知之何用用之骨體人命稟於天則有表候於體察表􅃸以知命猶察斗斛以知容矣表候者骨法之謂也傳言黄帝龍顔顓頊戴午帝嚳駢齒堯眉八采舜目重瞳禹耳三漏湯臂再肘文王四乳武王望陽周公背僂臯陶馬口孔子反羽斯十二聖者皆在帝王之位或輔主憂世世所共聞儒所共說在經傳者較著可信若夫短書俗記竹帛胤文非儒者所見衆多非一蒼頡四目爲黄帝史晉公子重耳仳脇爲諸侯覇蘇秦骨鼻爲六國相張儀仳脇亦相秦魏項羽重瞳云虞舜之後與髙祖分王天下陳平貧而飲食不足貌體佼好而衆人怪之曰平何食而肥及韓信爲􅅬公所鑒免於鈇質亦以面狀有異面狀肥佼亦一相也髙祖隆凖龍顔美􅂡左股有七十二黑子單父吕公善相見髙祖狀貌竒之因以其女妻髙祖吕后是也卒生孝惠王魯元公主髙祖爲泗上亭長當去歸之田與吕后及兩子居田有一老公過請飲因相吕后曰夫人天下貴人也令相兩子見孝惠曰夫人所以貴者乃此男也相魯元曰皆貴老公去髙祖從外來吕后言於髙祖髙祖追及老公止使自相老公曰郷者夫人嬰兒相皆似君君相貴不可言也後髙祖得天下如老公言推此以況一室之人皆有冨貴之相矣類同氣鈞性體法相固自相似異氣殊類亦兩相遇冨貴之男娶得冨貴之妻女亦得冨貴之男夫二相不鈞而相遇則有立死若未相適有豫亡之禍也王莽姑正君許嫁至期當行時夫輙死如此者再乃獻之趙王趙王未取又薨淸河南宫大有與正君父穉君善者遇相君曰貴爲天下母是時宣帝世元帝爲太子穉君乃因魏郡都尉納之太子太子幸之生子君上宣帝崩太子立正君爲皇后君上爲太子元帝崩太子立是爲成帝正君爲皇太后竟爲天下母夫正君之相當爲天下母而前所許二家及趙王爲無天下父之相故未行而二夫死趙王薨是則二夫趙王無帝王大命而正君不當與三家相遇之驗也丞相黄次公故爲陽夏游徼與善相者同車俱行見一婦人年十七八相者指之曰此婦人當大冨貴爲封侯者夫人次公止車審視之相者曰今此婦人不冨貴卜書不用也次公問之乃其旁里人巫家子也即娶以爲妻其後次公果大冨貴位至丞相封爲列侯夫次公冨貴婦人當配之故果相遇遂俱冨貴使次公命賤不得婦人爲偶不冝爲夫婦之時則有二夫趙王之禍夫舉家皆冨貴之命然後乃任冨貴之事骨法形體有不應者則必別離死亡不得乆享介福故冨貴之家役使奴僮育養牛馬必有與衆不同者矣僮奴則有不死亡之相牛馬則有數字乳之性田則有種孳速熟之􅂖商則有居善疾售之貨是故知命之人見冨貴於貧賤暏貧賤於冨貴案骨節之法察皮膚之理以審人之性命無不應者趙簡子使姑布子卿相諸子莫吉至翟婢之子無恤而以爲貴無恤最賢又有貴相簡子後廢太子而立無恤卒爲諸侯襄子是矣相工相黥布當先刑而乃王後竟被刑乃封王衛青父鄭季與陽信公主家僮衛媪通生青在建章宫時鉗徒相之曰貴至封侯青曰人奴之道得不笞罵足矣安敢望封侯其後青爲軍吏戰數有功超封増官遂爲大將軍封爲萬户侯周亞夫未封侯之時許􅀒相之曰君後三歳而入將相持重字一有國秉貴重矣於人臣無兩其後九歳而君餓死亞夫笑曰臣之兄已代侯矣有如父卒子當代亞夫何說侯乎然既已貴如􅀒言又何說餓死指示我許􅀒指其口有縱理入口曰此餓死法也居三歳其兄絳侯勝有罪文帝擇絳侯子賢者推亞夫廼封條侯續絳侯後文帝之後六年匈奴入邊乃以亞夫爲將軍至景帝之時亞夫爲丞相後以疾免其子爲亞夫買工官尚方甲盾五百被可以爲葬者取庸苦之不與錢庸知其盗買官器怨而上告其子景帝下吏責問因不食五日嘔血而死當鄧通之幸文帝也貴在公卿之上賞賜億萬與上齊體相工相之曰當貧賤餓死文帝崩景帝立通有盗鑄錢之罪景帝考驗通亡􅀉死人家不名一錢韓太傅爲諸生時之丙字一有日借相工五十錢與之俱入璧雍之中相璧雍弟子誰當貴者相工指倪寛曰彼生當貴秩至三公韓生謝遣相工通刺倪寛結膠漆之交盡䈥力之敬徙舍從寛深自附納之寛甞甚病韓生養視如僕狀恩深踰於骨肉後名聞於天下倪寛位至御史大夫州郡承㫖召請擢用舉在夲朝遂至太傅夫鉗徒許􅀒及相鄧通倪寛之工可謂知命之工矣故知命之工察骨體之證睹冨貴貧賤猶人見盤盂之器知所設用也善器必用貴人惡器必施賤者尊鼎不在陪厠之側匏􅀲不在堂殿之上明矣冨貴之骨不遇貧賤之苦貧賤之相不遭冨貴之樂亦猶此也器之盛物有斗石之量猶人爵有髙下之差也器過其量物溢棄遺爵過其差死亡不存論命者如比之於器以察骨體之法則命在於身形定矣非徒冨貴貧賤有骨體也而操行清濁}
