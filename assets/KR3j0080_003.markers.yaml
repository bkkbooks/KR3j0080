  - {type: variant, offset: 243, length: 0, content: '', krp: 雄自率將雌雄非生長之後或教使爲雄然後乃敢將雌此氣性剛彊自爲之矣夫王者天下之雄也其命當王王命定於懐姙猶冨貴骨生有鳥雄卵成也非唯人鳥也萬物皆然草木生於實核出土爲栽蘖稍生莖葉成爲長短巨細皆由實核王者長巨之最也朱草之莖如鍼紫芝之栽如豆成爲瑞矣王者禀氣而生亦猶此也或曰王者生禀天命及其將王天復命之猶公卿以下詔書封拜乃敢即位赤雀魚烏上天封拜之命也天道人事有相命使之義自然無爲天之道也命文以赤雀武以白魚是有爲也管仲與鮑叔分財取多鮑叔}
  - {type: variant, offset: 244, length: 0, content: '', SBCK: 與管仲不求内有以相知視彼猶我取之不疑聖人起王猶管之取財也朋友彼我無有授與之義上天自然有命使之驗是則天道有爲朋友自然也當漢祖斬大虵之時誰使斬者豈有天道先至而乃敢斬之哉勇氣奮發性自然也夫斬大虵誅秦殺項同一實也周之文武受命伐殷亦一義也髙祖不受命使之將獨謂文武受雀魚之命誤矣難曰康王之誥曰冐聞于上帝帝休天乃大命文王如無命史經何爲言天乃大命文王所謂大命者非天乃命文王也聖人動作天命之意也與天合同若天使之矣書方激勸康叔勉使爲善故言文王行道上聞於天天乃大命之也詩曰乃眷西顧此惟予度與此同義天無頭面眷顧如何人有顧睨以人傚天事易見故曰眷顧天乃大命文王眷顧之義實天不命也何以驗之夫大人與天地合其德與日月合其明與四時合其序與􅀑神合其吉凶先天而夫不違後天而奉天時如必須天有命乃以從事安得先天而後天乎以其不待天命直以心發故有先天後天之勤言合天時故有不違奉天之文論語曰大哉堯之爲君唯天爲大唯堯則之王者則天不違奉天之義也推自然之性與天合同是則所謂大命文王也自文王意文王自爲非天驅赤雀使告文王云當爲王乃敢起也然則文王赤雀及武王白魚非天之命昌熾祐也吉人舉事無不利者人徒不召而至瑞物不招而來黯然諧合若或使之出門聞告顧睨見善自然道也文王當興赤雀適來魚躍烏飛武王偶見非天使雀至白魚來也吉物動飛而聖遇也白魚入于王舟王陽曰偶適也光禄大夫劉琨前爲􅀪農太守虎渡河光武皇帝曰偶適自然非或使之也故夫王陽之言適光武之曰偶}
