  - {type: variant, offset: 646, length: 0, content: '', SBCK: 之氣天生萬物以萬物含五行之氣五行之氣更相賊害曰天自當以一行之氣生萬物令之相親愛不當令五行之氣反使相賊害也或曰欲爲之用故令相賊害賊害相成也故天用五行之氣生萬物人用萬物作萬事不能相制不能相使不相賊害不成爲用金不賊木木不成用火不爍金金不成器故諸物相賊相利含血之蟲相勝服相齧噬相啖食者皆五行氣使之然也曰天生萬物欲令相爲用不得不相賊害也則生虎狼蝮虵及蜂蠆之蟲皆賊害人天又欲使人爲之用邪且一人之身含五行之氣故一人之行有五常之操五常五常之道也五藏在内五行氣俱如論者之言含血之蟲懐五行之氣輙相賊害一人之身胷懐五藏自相賊也一人之}
