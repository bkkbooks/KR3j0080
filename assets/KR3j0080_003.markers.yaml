  - {type: variant, offset: 1503, length: 1, content: 富, krp: 頭足故人信其說明事以驗證故人然其文䜟書又言堯母慶都野出赤龍感已遂生堯髙祖本紀言劉媪甞息大澤之陂夢與神遇是時雷電晦冥太公徃視見蛟龍於上已而有身遂生髙祖其言神驗文又明著世儒學者莫謂不然如實論之虚妄言也彼詩言不坼不副言其不感動母體可也言其闓母背而出妄也夫蟬之生復育也闓背而出天之生聖子與復育同道乎兔吮毫而懐子及其子生從口而出案禹母吞薏苡卨母嚥鷰卵與兎吮毫同實也禹卨之母生冝皆從口不當闓背夫如是闓背之說竟虚妄也世間血刃死者多未必其先祖初爲人者生時逆也秦失天下閻樂斬胡亥項羽誅子嬰秦之先祖伯翳豈逆生乎如是爲順逆之說以驗三家之祖誤矣且夫薏苡草也燕卵鳥也大人跡土也三者皆形非氣也安能生人說聖者以爲稟天精微之氣故其爲有殊絶之知今三家之生以草以鳥以土可謂精微乎天地之性唯人爲貴則物賤矣今貴人之氣更稟賤物之精安能精微乎夫令䧱雀施氣於鴈鵠終不成子者何也鳩雀之身小鴈鵠之形大也今燕之身不過五寸薏苡之莖不過數尺二女吞其卵實安能成七尺之形乎爍一鼎之銅以灌一錢之形不能成一鼎明矣今謂大人天神故其跡巨巨跡之人一鼎之爍銅也姜原之身一錢之形也使大人施氣於姜原姜原之身小安能盡得其精不能盡得其精則后稷不能成人堯髙祖審龍之子子性類父龍能乗雲堯與髙祖亦冝能焉萬物生於土各似本種不類土者生不出於土土徒養育之也母之懐子猶土之育物也堯髙祖之母受龍之施猶土受物之播也物生自類本種夫二帝冝似龍也且夫含血之類相與爲牝牡牝牡之會皆見同類之物精感欲動乃能授施若夫牡馬見雌牛雀見雄牝雞不相與合者異類故也今龍與人異類何能感於人而施氣或曰夏之衰二龍鬪於庭吐漦於地龍亡漦在櫝而藏之至周幽王發出龍漦化爲玄黿入于後宫與處女交遂生褒姒玄黿與人異類何以感於處女而施氣乎夫玄黿所交非正故褒姒爲禍周國以亡以非類妄交則有非道妄亂之子今堯髙祖之母不以道接㑹何故二帝賢聖與褒姒異乎或曰趙簡子病五日不知人覺言我之帝所有熊來帝命我射之中熊死有羆來我又射之中羆羆死後問當道之鬼鬼曰熊羆晉二卿之先祖也熊羆物也與人異類何以施類於人而爲二卿祖夫簡子所射熊羆二卿祖當亡簡子當昌之秋也簡子見之若寑夢矣空虚之象不必有實假令有之或時熊羆先化爲人乃生二卿魯公牛哀病化爲虎人化爲獸亦如獸爲人玄黿入後宫殆先化爲人天地之間異類之物相與交接未之有也天人同道好惡均心人不好異類則天亦不與通人雖生於天猶蟣虱生於人也人不好蟣虱天無故欲生於人何則異類殊性情欲不相得也天地夫婦也天施氣於地以生物人轉相生精微爲聖皆因父氣不更稟取如更稟者爲聖卨后稷不聖如聖人皆當更稟十二聖不皆然也黄帝帝嚳帝顓頊帝舜之母何所受氣文王武王周公孔子之母何所感吞此或時見三家之姓曰姒氏子氏姬氏則因依放空生怪說猶見鼎湖之地而著黄帝升天之說矣失道之意還反其字蒼頡作書與事相連姜原履大人跡跡者基也姓當爲其下土乃爲女旁巨非基跡之字不合本事疑非實也以周姬況夏殷亦知子之與姒非燕子薏苡也或時禹契后稷之母適欲懐姙遭吞薏苡燕卵履大人跡也世好竒怪古今同情不見竒怪謂德不異故因以爲姓世間誠信因以爲然聖人重疑因不復定世士淺論因不復辨儒生是古因生其說彼詩言不坼不副者言后稷之生不感動母身也儒生穿鑿因造禹契逆生之說感於龍夢與神遇猶此率也堯髙祖之母適欲懐姙遭逢雷龍載雲雨而行人見其形遂謂之然夢與神遇得聖子之象也夢見鬼合之非夢與神遇乎安得其實野出感龍及蛟龍居上或堯髙祖受冨}
