  - {type: variant, offset: 944, length: 388, content: 在智賈生曰天不可與期道不可與謀遲速有命焉識其時高祖擊黥布為流矢所中疾甚呂后迎良醫醫曰可治高祖罵之曰吾以布衣提三尺劍取天下此非天命乎命乃在天雖扁鵲何益韓信與帝論兵謂高祖曰陛下所謂天授非智力所得揚子雲曰遇不遇命也太史公曰富貴不違貧賤貧賤不違富貴是謂從富貴為貧賤從貧賤為富貴也夫富貴不欲為貧賤貧賤自至貧賤不求為富貴富貴自得也春夏囚死秋冬王相非能為之也日朝出而暮入非能求之也天道自然代王自代入為文帝周亞夫以庶子為條侯此時代王非太子亞夫非適嗣逢時遇會卓然卒至命貧以力勤致富富至而死命賤以才能取貴貴至而免才力而致富貴命祿不能奉持猶器之盈量手之持重也器受一升以一升則平受之如過一升則滿溢也手舉一鈞以一鈞則平舉之過一鈞則躓仆矣前世明是非歸之於命也命審然也信命者則可幽居俟時不須勞精苦形求索之也猶珠玉之在山澤不求貴價於人人自貴之天命難知人不耐審雖有厚命猶不自信故必求之也如自知雖逃富避貴終不得離, SBCK: 感動母體}
