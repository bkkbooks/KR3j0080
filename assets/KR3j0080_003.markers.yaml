  - {type: variant, offset: 242, length: 0, content: '', WYG: 在人本矣太王古公見之早也此猶爲末文王在母身之中已受命也王者一受命内以爲性外以爲體體者面輔骨法生而稟之吏秩百石以上王侯以下郎將大夫以至元士外及刺史太守居禄秩之吏稟富貴之命生而有表見於面故許負姑布子卿輙見其驗仕者隨秩遷轉遷轉之人或至公卿命禄尊貴位望髙大王者尊貴之率髙大之最也生有髙大之命其時身有尊貴之竒古公知之見四乳之怪也夫四乳聖人證也在母身中稟天聖命豈長大之後脩行道德四乳乃生以四乳論望羊亦知爲胎之時已受之矣劉媪息於大澤夢與神遇遂生髙祖此時已受命也光武生於濟陽宫夜半無火内中光明軍下卒蘇永謂公曹史充蘭曰此吉事也毋多言此時已受命獨謂文王武王得赤雀魚烏乃受命非也上天壹命王者乃興不復更命也得冨貴大命自起王矣何以驗之冨貴之翁貲累千金生有冨骨治生積貨至於年老成爲冨翁矣夫王者天下之翁也稟命定於身中猶鳥之别雄雌於卵殻之中也卵殻孕而雌雄生日月至而骨節彊彊}
