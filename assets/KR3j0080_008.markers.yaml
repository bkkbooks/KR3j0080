  - {type: variant, offset: 339, length: 0, content: '', SBCK: 有年五十擊壤於路者觀者曰大哉堯德乎擊壤者曰吾日出而作日入而息鑿井而飲耕田而食堯何等力此言蕩蕩無能名之效也言蕩蕩可也乃欲言民無能名增之也四海之大萬民之衆無能名堯之德者殆不實也夫擊壤者曰堯何等力欲言民無能名也觀者曰大哉堯之德乎此何等民者猶能知之實有知之者云無竟增之儒書又言}
