  - {type: variant, offset: 544, length: 324, content: 漸漬磨礪闓導牖進猛氣消損驕節屈折卒能政事序在四科斯蓋變性使惡為善之明效也夫肥沃墝埆土地之本性也肥而沃者性美樹稼豐茂墝而埆者性惡深耕細鋤厚加糞壤勉致人功以助地力其樹稼與彼肥沃者相似類也地之高下亦如此焉以钁鍤鑿地以埤增下則其下與高者齊如復增钁鍤則夫下者不徒齊者也反更為高而其高者反為下使人之性有善有惡彼地有高有下勉致其教令之善則將善者同之矣善以化渥釀其教令變更為善善則且更宜反過於往善猶下地增加钁鍤更崇於高地也賜不受命而貨殖焉賜本不受天之富命所加貨財積聚為世富人者得貨殖之術也夫得其術雖不受命猶自益饒富性惡之人亦不稟天善性得聖人之教志行變化世稱利劍有千金之價棠谿魚腸之屬龍泉太阿之輩其本鋌山中之恆鐵也冶工鍛鍊成為銛利豈利劍之鍛與鍊乃異質哉工良師巧鍊一數, SBCK: 文遂傳}
