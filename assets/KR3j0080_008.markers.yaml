  - {type: variant, offset: 207, length: 2, content: 性善, SBCK: 口馳閭巷之間其猶是也諸子之文筆墨之疏人賢所著妙思所集宜如其實猶或增之儻經藝之言如其實乎言審莫過聖人經藝萬世不易猶或出溢增過其實增過其實皆有事為不妄亂誤以少為多也然而必論之者方言經藝之增與傳語異也經增非一略舉較著令怳惑之人觀覽采擇得以開心通意曉解覺悟尚書協和萬國是美堯德致太平之化化諸夏并及夷狄也言協和方外}
  - {type: page-break, offset: 207, content: '', id: KR3j0080_SBCK_008-11a}
