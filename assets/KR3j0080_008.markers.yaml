  - {type: variant, offset: 11, length: 1, content: 惡, SBCK: 夫九鼎無能辟除傳言能辟神姦是則書增其文也世俗傳言周鼎不爨自沸不投物物自出此則世俗增其言也儒書增其文也是使九鼎以無怪空為神也且夫謂周之鼎神者何用審之周鼎之金逺方所貢禹得鑄以為鼎也其為鼎也有百物之象如為遠方貢之為神乎遠方之物安能神如以為禹鑄之為神乎禹聖不能神聖人身不能神鑄器安能神如以金之物為神乎則夫金者石之類也石不能神金安能神以有百物之象爲神乎夫百物之象猶雷罇也雷罇刻畫雲雷之形雲雷在天神於百物雲雷之象不能神百物之象安能神也傳言秦滅周周之九鼎入于秦案本事周赧王之時秦昭王使将軍摎攻王􅎼王􅎼惶懼犇秦頓首受罪盡獻其邑三十六口三萬秦受其獻還王􅎼王􅎼卒秦王取九鼎寳器矣若此者九鼎在秦也始皇二十八年北遊至琅邪還過彭城齊戒禱祠欲出周鼎使千人没泗水之中求弗能得案時昭王之後三世得始皇帝秦無危亂之禍鼎冝不亡亡時殆在周傳言王赧犇秦秦取九鼎或時誤也傳又言宋太丘社亡鼎沒水中彭城下其後二十九年秦并天下若此者鼎未入秦也其亡從周去矣未為神也春秋之時五石隕于宋五石者星也星之去天猶鼎之亡於地也星去天不為神鼎亡於地何能神春秋之時三山亡猶太丘社之去宋五星之去天三山亡五石隕太丘社去皆自有為然鼎亡亡亦有應也未可以亡之故乃謂之神如鼎與秦三山同乎亡不能神如有知欲辟危亂之禍乎則更桀紂之時矣衰亂無道莫過桀紂桀紂之時鼎不亡去周之衰亂未若桀紂留無道之桀紂去衰末之周非止去之冝神有知之驗也或時周亡之時將軍摎人衆見鼎盜取姦人鑄爍以爲他器始皇求不得也後因言有神名則空生没於泗水之語矣孝文皇帝之時趙人新垣平上言周鼎亡在泗水中今河溢通於泗水臣望東北汾隂直有金氣意周鼎出乎兆見弗迎則不至於是文帝使使治廟汾隂南臨河欲祠出周鼎人有上書告新垣平所言神器事皆詐也於是下平事於吏吏治誅新垣平夫言鼎在泗水中猶新垣平詐言鼎有神氣見也藝增篇世俗所患患言事增其實著文垂辭辭出溢其眞稱美過}
