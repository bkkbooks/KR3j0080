  - {type: variant, offset: 869, length: 202, content: 也試取東下直一金之劍更熟鍛鍊足其火齊其銛猶千金之劍也夫鐵石天然尚為鍛鍊者變易故質況人含五常之性賢聖未之熟鍛鍊耳奚患性之不善哉古貴良醫者能知篤劇之病所從生起而以針藥治而已之如徒知病之名而坐觀之何以為奇夫人有不善則乃性命之疾也無其教治而欲令變更豈不難哉天道有真偽真者固自與天相應偽者人加知巧亦與真者無以異也何以驗之禹貢曰璆琳琅玕璆玉也琳珠也琅玕珠之類也者此則土地所生真玉珠也然而道人消爍五石作五色之玉比之真玉, SBCK: 今}
