  - {type: 'tls:seg', offset: 208, content: '', id: KR3j0080_tls_008-2a.29}
  - {type: variant, offset: 210, length: 4, content: 變為惡惡, SBCK: 也言萬國增之也夫唐之與周俱治五千里内周時諸侯千七百九十三國荒服戎服要服及四海之外不粒食之民若穿胸儋耳焦僥跂踵之輩并合其數不能三千天之所覆地之所載盡於三千之中矣而尚書云萬國裦增過實以美堯也欲言堯之德大所化者衆諸夏夷狄莫不雍和故曰萬國猶詩言子孫千億矣美周宣王之德能愼順一作天地天地祚之子孫衆多至於千億言子孫衆多}
  - {type: page-break, offset: 210, content: '', id: KR3j0080_SBCK_008-11b}
  - {type: variant, offset: 210, length: 1, content: 變, WYG: 也言萬國增之也夫唐之與周俱治五千里内周時諸侯千七百九十三國荒服戎服要服及四海之外不粒食之民若穿胸儋耳焦僥跂踵之輩并合其數不能三千天之所覆地之所載盡於三千之中矣而尚書云萬國裦增過實以美堯也欲言堯之德大所化者衆諸夏夷狄莫不雍和故曰萬國猶詩言子孫千億矣美周宣王之德能愼一作順天地天地祚之子孫衆多至於千億言子孫衆多可也言千億增之也夫子孫雖衆不能千億詩人頌美增益其實案后稷始受邰封訖於宣王宣王以至外族内屬血脈所連不能千億夫千與萬數之大名也萬言衆多故尚書言萬國詩言千億詩云鶴鳴九臯聲聞于天言鶴鳴九折之澤聲猶聞於天以喻君子修德窮僻名猶達朝廷也其聞髙逺可矣言其聞於天增之也彼言聲聞於天見鶴鳴於雲中從地聽之度其聲鳴於地當復聞於天也夫鶴鳴雲中人聞聲仰而視之目見其形耳目同力耳聞其聲則目見其形矣然則耳目所聞見不過十里使參天之鳴人不能聞也何則天之去人以萬數逺則目不能見耳不能聞今鶴鳴從下聞之鶴鳴近也以從下聞其聲則謂其鳴於地當復聞於天失其實矣其鶴鳴於雲中人從下聞之如鳴於九臯人無在天上者何以知其聞於天上也無以知意從准況之也詩人或時不知至誠以}
  - {type: page-break, offset: 210, content: '', id: KR3j0080_WYG_008-13b, image: WYG0862/WYG0862-0105b.png}
  - {type: page-break, offset: 210, content: '', id: KR3j0080_WYG_008-14a, image: WYG0862/WYG0862-0105c.png}
  - {type: page-break, offset: 210, content: '', id: KR3j0080_WYG_008-14b, image: WYG0862/WYG0862-0105d.png}
  - {type: variant, offset: 210, length: 4, content: 變為惡惡, krp: 也言萬國增之也夫唐之與周俱治五千里内周時諸侯千七百九十三國荒服戎服要服及四海之外不粒食之民若穿胸儋耳焦僥跂踵之輩并合其數不能三千天之所覆地之所載盡於三千之中矣而尚書云萬國裦增過實以美堯也欲言堯之德大所化者衆諸夏夷狄莫不雍和故曰萬國猶詩言子孫千億矣美周宣王之德能愼順一作天地天地祚之子孫衆多至於千億言子孫衆多}
  - {type: variant, offset: 212, length: 2, content: 惡惡, WYG: 然或時知而欲以喻事故增而甚之詩曰周餘黎民靡有孑遺是謂周宣王之時遭大旱之災也詩人傷旱之甚民被其害言無有孑遺一人不愁痛者夫旱甚則有之矣言無孑遺一人增之也夫周之民猶今之民也使今之民也遭大旱之災貧羸無蓄積扣心思雨若其富人穀食饒足者廪囷不空口腹不飢何愁之有天之旱也山林之間不枯猶地之水丘陵之上不湛也山林之間富貴之人必有遺脱者矣而言靡有孑遺增益其文欲言旱甚也易曰豐其屋蔀其家窺其戸閴其無人也非其無人也無賢人也尚書曰毋曠庻官曠空庻衆也毋空衆官寘非其人與空無異故言空也夫不肖者皆懷五常才劣不逮不成純賢非狂妄頑嚚身中無一知也德有大小材有髙下居官治職皆欲勉效在官尚書之官易之戸中猶能有益如何謂之空而無人詩曰濟濟多士文王以寜此言文王得賢者多而不肖者少也今易宜言閴其少人尚書宜言無少衆官以少言之}
  - {type: page-break, offset: 212, content: '', id: KR3j0080_WYG_008-15a, image: WYG0862/WYG0862-0106a.png}
  - {type: page-break, offset: 212, content: '', id: KR3j0080_WYG_008-15b, image: WYG0862/WYG0862-0106b.png}
