  - {type: variant, offset: 1318, length: 186, content: 為亂比獸之角可以為城舉尾可以為旌奮心盛氣阻戰為彊夫禽獸與人殊形猶可命戰況人同類乎推此以論百獸率舞潭魚出聽六馬仰秣不復疑矣異類以殊為同同類以鈞為異所由不在於物在於人也凡含血氣者教之所以異化也三苗之民或賢或不肖堯舜齊之恩教加也楚越之人處莊嶽之間經歷歲月變為舒緩風俗侈也故曰齊舒緩秦慢易楚促急燕戇投以莊嶽言之四國之民更相出入久居單處性必變易夫性惡者心比木石木石猶為人用況非木石在, SBCK: ''}
