  - {type: variant, offset: 219, length: 0, content: '', krp: 聞於天以喻君子修德窮僻名猶達朝廷也其聞髙逺可矣言其聞於天增之也彼言聲聞於天見鶴鳴於雲中從地聽之度其聲鳴於地當復聞於天也夫鶴鳴雲中人聞聲仰而視之目見其形耳目同力耳聞其聲則目見其形矣然則耳目所聞見不過十里使參天之鳴人不能聞也何則天之去人以萬數逺則目不能見耳不能聞今鶴鳴從下聞之鶴鳴近也以從下聞其聲則謂其鳴於地當復聞於天失其實矣其鶴鳴於雲中人從下聞之如鳴於九臯人無在天上者何以知其聞於天上也無以知意從准況之也詩人或時不知至誠以爲然或時知而欲以喻事故增而甚之詩曰維餘黎民靡有孑遺是謂周宣王之時遭大旱之災也詩人傷旱之甚民被其害言無有孑遺一人不愁痛者夫旱甚則有之矣言無孑遺一人增之也夫周之民猶今之民也使今之民也遭大旱之災貧羸無蓄積扣心思雨若其富人穀食饒足者廪囷不空口腹不飢何愁之有天之旱也山林之間不枯猶地之水丘陵之上不湛也山林之間富貴之人必有遺脱者矣而言靡有孑遺增益其文欲言旱甚也易曰豐其屋蔀其家窺其戸閴其無人也非其無人也無賢人也尚書曰毋曠庻官曠空庻衆也毋空衆官寘非其人與空無異故言空也夫不肖者皆懷五常才劣不逮不成純賢非狂妄頑嚚身中無一知也德有大小材有髙下居官治職皆欲勉效在官尚書之官易之戸中猶能有益如何謂之空而無人詩曰濟濟多士文王以寜}
  - {type: variant, offset: 220, length: 0, content: '', SBCK: 言文王得賢者多而不肖者少也今易冝言閴其少人尚書冝言無少衆官以少言之可也言空而無人亦尤甚焉五穀之於人也食之皆飽稻粱之味甘而多􅃾豆麥雖糲亦能愈飢食豆麥者皆謂糲而不甘莫謂腹空無所食竹木之杖皆能扶病竹杖之力弱劣不及木或操竹杖皆謂不勁莫謂手空無把持夫不肖之臣豆麥竹杖之}
  - {type: variant, offset: 220, length: 0, content: '', krp: 言文王得賢者多而不肖者少也今易冝言閴其少人尚書冝言無少衆官以少言之可也言空而無人亦尤甚焉五穀之於人也食之皆飽稻粱之味甘而多腴豆麥雖糲亦能愈飢食豆麥者皆謂糲而不甘莫謂腹空無所食竹木之杖皆能扶病竹杖之力弱劣不及木或操竹杖皆謂不勁莫謂手空無把持夫不肖之臣豆麥竹杖之}
