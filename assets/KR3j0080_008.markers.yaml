  - {type: variant, offset: 215, length: 3, content: 變為善, SBCK: 也言千億增之也夫子孫雖衆不能千億詩人頌美增益其實案后稷始受邰封訖於宣王宣王以至外族内屬血脉所連不能千億夫千與萬數之大名也萬言衆多故尚書言萬國詩言千億詩云鶴鳴九臯聲聞于天言鶴鳴九折之澤聲}
  - {type: variant, offset: 215, length: 5, content: 變為善猶此, WYG: 也言空而無人亦尤甚焉五穀之於人也食之皆飽稻粱之味甘而多腴豆麥雖糲亦能愈飢食豆麥者皆謂糲而不甘莫謂腹空無所食竹木之杖皆能扶病竹杖之力弱劣不及木或操竹杖皆謂不勁莫謂手空無把持夫不肖之臣豆麥竹杖之}
