  - {type: variant, offset: 3, length: 0, content: '', SBCK: 藝增篇儒增篇儒書稱堯舜之德至優至大天下太平一人不刑又言文武之隆遺在成康刑錯不用四十餘年是欲稱堯舜褒文武也夫為言不益則羙不足稱為文不渥則事不足褒堯舜雖優不能使一人不刑文武雖盛不能使刑不用言其犯刑者少用刑希疏可也言其一人不刑刑錯不用增之也夫能使一人不刑則能使一國不伐能使刑錯不用則能使兵寝不施案堯伐丹水舜征有苗四子服罪刑兵設用成王之時四國􅆲畔淮夷徐戎並爲患害夫刑人用刀伐人用兵罪人用法誅人用武武法不殊兵刀不異巧}
