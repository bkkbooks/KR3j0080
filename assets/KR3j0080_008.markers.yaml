  - {type: variant, offset: 1554, length: 668, content: 是故王法不廢學校之官不除獄理之吏欲令凡眾見禮義之教學校勉其前法禁防其後使丹朱之志亦將可勉何以驗之三軍之士非能制也勇將率勉視死如歸且闔廬嘗試其士於五湖之側皆加刃於肩血流至地句踐亦試其士於寢宮之庭赴火死者不可勝數火夫刃非人性之所貪也二主激率念不顧生是故軍之法輕刺血孟賁勇也聞軍令懼是故叔孫通制定禮儀拔劍爭功之臣奉禮拜伏初驕倨而後遜順聖教威德變易性也不患性惡患其不服聖教自遇而以生禍也豆麥之種與稻粱殊然食能去飢小人君子稟性異類乎譬諸五穀皆為用實不異而效殊者稟氣有厚泊故性有善惡也殘則受不仁之氣泊而怒則稟勇渥也仁泊則戾而少慈勇渥則猛而無義而又和氣不足喜怒失時計慮輕愚妄行之人罪故為惡人受五常含五臟皆具於身稟之泊少故其操行不及善人猶酒或厚或泊也非厚與泊殊其釀也麴糵多少使之然也是故酒之泊厚同一麴糵人之善惡共一元氣氣有少多故性有賢愚西門豹急佩韋以自緩董安于緩帶弦以自促急之與緩俱失中和然而韋弦附身成為完具之人能納韋弦之教補接不足則豹安于之名可得參也貧劣宅屋不具墻壁宇達人指訾之如財貨富愈起屋築墻以自蔽鄣為之具宅人弗復非魏之行田百畝鄴獨二百西門豹灌以漳水成為膏腴則畝收一鍾夫人之質猶鄴田道教猶漳水也患不能化不患人性之難率也雒陽城中之道無水水工激上雒中之水日夜馳流水工之功也由此言之迫近君子而仁義之道數加於身孟母之徙宅蓋得其驗人間之水污濁在野外者清潔俱為一水源從天涯或濁或清所在之勢使之然也南越王趙他本漢賢人也化南夷之俗背畔王制椎髻箕坐好之若性陸賈說以漢德懼以聖威蹶然起坐心覺改悔奉制稱蕃其於椎髻箕坐也惡之若性前則若彼後則若此由此言之亦在於教不獨在性也, SBCK: 論衡卷第八}
