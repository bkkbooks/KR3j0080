  - {type: variant, offset: 6, length: 0, content: '', WYG: 頭著之於頸奈何獨能先出其腹實乃内哀公之肝腹實出輒死則手不能復把矣如先内哀公之肝乃出其腹實則文當言内哀公之肝出其腹實今先言盡出其腹實内哀公之肝又言盡增其實也儒書言楚熊渠子出見寢石以為伏虎將弓射之矢沒其衛或曰養由基見寢石以為兕也射之矢飲羽或言李廣便是熊渠養由基李廣主名不審無實也或以為虎或以為兕兕虎俱猛一實也或言没衛或言飲羽羽即衛言不同耳要取以寢石似虎兕畏懼加精射之入深也夫言以寢石為虎射之矢入可也言其没衞增之也夫見似虎者意以爲是張弓射之盛精加意則其見眞虎與是無異射似虎之石矢入没衛若射眞虎之身矢洞度乎石之質難射肉易射也以射難没衞言之則其射易者洞不疑矣善射者能射逺中微不失毫釐安能使弓弩更多力乎養由基從軍射晉侯中其目夫以匹夫射萬乗之主其加精倍力必與射寝石等當中晉侯之目也可復洞達於項乎如洞達於項晉侯宜死車張十石之弩恐不能入一寸矢摧為三况以一人之力引微弱之弓雖加精誠安能没衞人之精乃氣也氣乃力也有水火之難惶惑恐懼舉徙器物精誠至矣素舉一石者倍舉二石然則見伏石射之精誠倍故不過入一寸如何謂之没衞乎如有好用劔者見寢石懼而斫之可復謂能斷石乎以勇夫空拳而暴虎者卒然見寢石以手椎之能令石有跡乎巧人之精與拙人等古人之誠與今人同使當今射工射禽獸於野其欲得之不餘精力乎及其中獸不過數寸跌誤中石不能内鋒箭摧折矣夫如是儒書之言楚熊渠子養由基李廣射寝石矢没衛飲羽者皆增之也儒書稱魯般墨子之巧刻木為鳶飛之三日而不集夫言其以木為鳶飛之可也言其三日不集增之也夫刻木為鳶以象鳶形安能飛而不集乎旣能飛翔安能至於三日如審有機闗一飛遂翔不可復下則當言遂飛不當言三日猶世傳言曰魯般巧亡其母也言巧工為母作木車馬木人御者機闗備具載母其上一驅不還遂失其母如木鳶機闗備具與木車馬等則遂飛不集機闗為須㬰間不能逺過三日則木車等亦宜三日止於道路無為徑去以失其母二者必失實者矣書説孔子不能容於世周流游説七十餘國未嘗得安夫言周流不遇可也言干七十國增之也案論語之篇諸子之書孔子自衞反魯在陳絶糧削迹於衞忘味於齊伐樹於宋并費與頓牟至不能十國傳言七十國非其實也或時干十數國也七十之説文書傳之因言干七十國矣論語曰孔子問公叔文子於公明賈曰信乎夫子不言不笑不取乎公明賈對曰以告者過也夫子時然後言人不厭其言也樂然後笑人不厭其笑也義然後取人不厭其取也子曰豈其然乎豈其然乎夫公叔文子實時言時笑義取人傳説稱之言其不言不笑不取也俗言竟增之也書言秦繆公伐鄭過晉不假途晉襄公率羌戎要擊於崤塞之下匹馬隻輪無反者時秦遣三大夫孟明視西乞術白乙丙皆得復還夫三大夫復還車馬必有歸者文言匹馬隻輪無反者增其實也書稱齊之孟嘗魏之信陵趙之平原楚之春申君待士下客招㑹四方各三千人欲言下士之至趨之者衆也夫言士多可也言其三千增之也四君雖好士士至雖衆不過各千餘人書則言三千矣夫言衆必言千數言少則言無一世俗之情言事之失也傳記言髙子羔之喪親泣血三年未嘗見齒君子以為難難為故也夫不以為非實而以為難君子之言誤矣髙子泣血殆必有之何則荆和獻寳於楚楚刖其足痛寶不進已情不達泣涕涕盡因續以血今髙子痛親哀極涕竭血隨而出實也而云三年未嘗見齒是增之也言未嘗見齒欲言其不言不笑也孝子喪親不笑可也安得不言言安得不見齒孔子曰言不文或時不言傳則言其不見齒或時傳則言其不見齒三年矣髙宗諒隂三年不言尊為天子不言而其文言不言猶疑於增況髙子位賤而曰未嘗見齒是必增益之也儒書言禽息薦百里奚繆公未聽禽息出當門仆頭碎首而死繆公痛之乃用百里奚此言賢者薦善不愛其死仆頭碎首而死以達其友也世士相激文書傳稱之莫謂不然夫仆頭以薦善古今有之禽息仆頭盖其實也言碎首而死是增之也夫人之扣頭痛者血流雖忿恨惶恐無碎首者非首不可碎人力不能自碎也執刄刎頸樹鋒刺胷鋒刄之助故手足得成勢也言禽息舉椎自擊首碎不足怪也仆頭碎首力不能自將也有扣頭而死者未有使頭破首碎者也此時或扣頭薦百里奚世空言其死若或扣頭而死世空言其首碎也儒書言荆軻為燕太子刺秦王操匕首之劒刺之不得秦王拔劒擊之軻以匕首擿秦王不中中銅柱入尺欲言也首之利荆軻勢盛投鋭利之刄陷堅强之柱稱荆軻之勇故増益其事也夫言入銅柱實也言其入尺增之也夫銅雖不若匕首堅剛入之不過數寸殆不能入尺以入尺言之設中秦王匕首洞過乎車張十石之弩射垣木之表尚不能入尺以荆軻之手力投輕小之匕首身被龍淵之劒刄入堅剛之銅柱是荆軻之力勁於十石之弩銅柱之堅不若木表之剛也世稱荆軻之勇不言其多力多力之人莫若孟賁使孟賁擿銅柱能一有過字深入一尺乎此亦或時匕首利若干将莫邪所刺無前所擊無下故有入尺之效夫稱干將莫邪亦過其實刺擊無前下亦入銅柱尺之類也儒書言董仲舒讀春秋專精一思志不在他三年不窺園菜夫言不窺園菜實也言三年增之也仲舒雖精亦時解休解休之間猶宜游於門庭之側則能至門庭何嫌不窺園菜聞用精者察物不見存道以亡身不聞不至門庭坐思三年不及窺園也尚書毋佚曰君子所其毋逸先知稼穡之艱難乃佚者也一有解字人之筋骨非木非石不能不解故張而不㢮文王不為㢮而不張文王不行一㢮一張文王以為常聖人材優尚有㢮張之時仲舒材力劣於聖安能用精三年不休儒書言夏之方盛也遠方圖物貢金九牧鑄鼎象物而為之備故入山澤不逢惡物用辟神姦故能協于上下以承天休夫金之}
