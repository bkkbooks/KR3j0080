  - {type: variant, offset: 3, length: 0, content: '', krp: 藝增篇儒增篇儒書稱堯舜之德至優至大天下太平一人不刑又言文武之隆遺在成康刑錯不用四十餘年是欲稱堯舜褒文武也夫為言不益則羙不足稱為文不渥則事不足褒堯舜雖優不能使一人不刑文武雖盛不能使刑不用言其犯刑者少用刑希疏可也言其一人不刑刑錯不用增之也夫能使一人不刑則能使一國不伐能使刑錯不用則能使兵寝不施案堯伐丹水舜征有苗四子服罪刑兵設用成王之時四國篡畔淮夷徐戎並爲患害夫刑人用刀伐人用兵罪人用法誅人用武武法不殊兵刀不異巧}
  - {type: variant, offset: 4, length: 0, content: '', SBCK: 之人不能别也夫德爲字一有劣故用兵犯法故施刑刑與兵猶足與翼也走用足飛用翼形體雖異其行身同刑之與兵全衆禁邪其實一也稱兵之不用言刑之不施是猶人耳缺目完以目完稱人體全不可從也人桀於刺虎怯於擊人而以刺虎稱謂之勇不可聼也身無敗缺勇無不進乃為全耳今稱一人不刑不言一兵不用褒刑錯不用不言一人不畔未得為優未可謂盛也儒書稱楚養由基善射射一楊葉百發能百中之是稱其巧於射也夫言其時射一楊葉中之可也言其百發而百中增之也夫一楊葉射而中之中之一再行敗穿不可復射矣如就葉懸於樹而射之雖不欲射葉楊葉繁茂自中之矣是必使上取楊葉一一更置地而射之也射之數十行足以見巧觀其射之者亦皆知射工亦必不至於百明矣言事者好增巧美數十中之則言其百中矣百與千數之大者也實欲言十則言百百則言千矣是與書言協和萬邦詩曰子孫千億同一意也儒書言衛有忠臣􅀪演為衛哀公使未還狄人攻哀公而殺之盡食其肉獨捨其肝􅀪演使還致命於肝痛哀公之死身肉盡肝無所附引刀自刳其腹盡出其腹實乃内哀公之肝而死言此者欲稱其忠矣言其自刳内哀公之肝而死可也言盡出其腹實乃内哀公之肝增之也人以刃相刺中五藏輒死何則五藏氣之主也猶頭脉之湊也頭一斷手不能取他}
