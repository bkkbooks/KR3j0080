  - {type: variant, offset: 7, length: 1, content: 定, SBCK: 物也用逺方貢之為美鑄以為鼎用象百物之奇安能入山澤不逢惡物辟除神姦乎周時天下太平越裳獻白雉倭人貢鬯草食白雉服鬯草不能除凶金鼎之器安能辟姦且九鼎之來德盛之瑞也服瑞應之物不能致福男子服玉女子服珠珠玉於人無能辟除寶奇之物使為蘭服作牙身或言}
