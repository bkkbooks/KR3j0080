  - {type: variant, offset: 1215, length: 2, content: 假令, SBCK: 其為鵝怪而吐之故仲子之吐鵝也耻食不合己志之物也非負親親之恩而欲勿母食也又仲子惡能㢘充仲子之性則蚓而後可者也夫蚓上食槁壤下飲黄泉是謂蚓為至㢘也仲子如蚓乃為㢘㓗耳今所居之宅伯夷之所築所食之粟伯夷之所樹仲子居而食之於㢘㓗可也或時食盜跖之所樹粟居盜跖之所築室汙㢘㓗之行矣用此非仲子亦復失之室因人故粟以屨纑易之正使盜之所樹築已不聞知今兄之不義}
