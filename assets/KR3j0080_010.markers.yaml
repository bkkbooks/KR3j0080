  - {type: variant, offset: 94, length: 1, content: 偶, SBCK: 子見誅之故不清其身使無二子之類雖養之終無其化堯不誅許由唐民不皆樔處武王不誅伯夷周民不皆隱餓魏文侯式段干木之閭魏國不皆闔門由此言之太公不誅二子齊國亦不皆不仕何則清㢘之行人所不能為也夫人所不能為養使為之不能使勸人所能為誅以禁之不能使止然則太公誅二子無益於化空殺無辜之民賞無功殺無辜韓子所非也太公殺無辜韓子是之以韓子之術殺無辜也夫執不仕者未必有正罪也太公誅之如出仕未有功太公肯賞之乎賞湏功而加罰待罪而施使太公不賞出仕未有功之人則其誅不仕未有罪之民非也而韓子是之失誤之言也且不仕之民性㢘寡欲好仕之民性貪多利利欲不存於心則視爵禄猶糞土矣㢘則約省無極貪則奢泰不止奢泰不止則其所欲不避其主案古簒畔之臣希清白㢘㓗之人貪故能立功憍故能輕生積功以取大賞奢泰以貪主位太公遺此法而去故齊有陳氏刼殺之患太公之術致刼殺之法也韓子善之是韓子之術亦危亡也周公聞太公誅二子非而不是然而身執贄以下白屋之士白屋之士二子之類也周公禮之太公誅之二子之操孰為是者宋人有御馬者不進拔劒剄而棄之於溝中又駕一馬馬又不進又剄而棄之於溝若是者}
