  - {type: variant, offset: 585, length: 0, content: '', SBCK: 冀三日之間王復追之天命或時在三日之間故可也夫言如是齊王初使之去者非天命乎如使天命在三日之間魯平公比三日亦時棄臧倉之議更用樂正子之言徃見孟子孟子歸之於天何其早乎如三日之間公見孟子孟子奈前言何乎孟子去齊充虞塗問曰夫子若不豫色然前日虞聞諸夫子曰君子不怨天不尤}
