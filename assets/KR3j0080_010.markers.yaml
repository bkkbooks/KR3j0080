  - {type: variant, offset: 291, length: 258, content: 王不長所稟不同度數並放適相應也二龍之祅當效周厲適闓櫝褒姒當喪周國幽王稟性偶惡非二龍使厲王發孽褒姒令幽王愚惑也遭逢會遇自相得也僮謠之語當驗鬭雞之變適生鸜鵒之占當應魯昭之惡適成非僮謠致鬭競鸜鵒招君惡也期數自至人行偶合也堯命當禪舜丹朱為無道虞統當傳夏商均行不軌非舜禹當得天下能使二子惡也美惡是非適相逢也火星與昴星出入昴星低時火星出昴星見時火星伏非火之性厭服昴也時偶不並度轉乖也正月建寅斗魁破申非寅建使申破也轉運之衡偶自應也父歿而子嗣姑死而婦代非子婦代使父姑終歿也老少年次自相承也世謂秋氣擊殺穀草穀草不任凋傷而死此言失實夫物, SBCK: 可}
