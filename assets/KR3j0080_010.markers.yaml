  - {type: variant, offset: 7, length: 0, content: '', WYG: 術明法尚功賢無益於國不加賞不肖無害於治不施罰責功重賞任刑用誅故其論儒也謂之不耕而食比之於一蠧論有益與無益也比之於鹿馬馬之似鹿者千金天下有千金之馬無千金之鹿鹿無益馬有用也儒者猶鹿有用之吏猶馬也夫韓子知以鹿馬喻不知以冠履譬使韓子不冠徒履而朝吾將聽其言也加冠於首而立於朝受無益之服增無益之仕言與服相違行與術相反吾是以非其言而不用其法也煩勞人體無益於人身莫過跪拜使韓子逢人不拜見君父不謁未必有賊於身體也然須拜謁以尊親者禮義至重不可失也故禮義在身身未必肥而禮義去身身未必瘠而化衰以謂有益禮義不如飲食使韓子賜食君父之前不拜而用肯為之乎夫拜謁禮義之效非益身之實也然而韓子終不失者不廢禮義以苟益也夫儒生禮義也耕戰飲食也貴耕戰而賤儒生是棄禮義求飲食也使禮義廢綱紀敗上下亂而隂陽繆水旱失時五穀不登萬民飢死農不得耕士不得戰也子貢去告朔之餼羊孔子曰賜也爾愛其羊我愛其禮子貢惡費羊孔子重廢禮也故以舊防為無益而去之必有水災以舊禮為無補而去之必有亂患儒者之在世禮義之舊防也有之無益無之有損庠序之設自古有之重本尊始故立官置吏官不可廢道不可棄儒生道官之吏也以為無益而廢之是棄道也夫道無成效於人成效者須道而成如足蹈路而行所蹈之路須不蹈者身須手足而動待不動者故事或無益而益者須之無效而效者待之儒生耕戰所須待也棄而不存如何也韓子非儒謂之無益有損蓋謂俗儒無行操舉措不重禮以儒名而俗行以實學而偽説貪官尊榮故不足貴夫志㓗行顯不徇爵祿去卿相之位若脱躧者居位治職功雖不立此禮義為業者也國之所以存者禮義也民無禮義傾國危}
