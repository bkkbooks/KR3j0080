  - {type: variant, offset: 31, length: 0, content: '', SBCK: 事或可以德懷或可以力摧外以德自立内以力自備慕德者不戰而服犯德者畏兵而郤徐偃王脩行仁義陸地朝者三十二國彊楚聞之舉兵而滅之此有德守無力備者也夫德不可獨任以治國力不可直任以御敵也韓子之術不養德偃王之操不任力二者偏駮各有不足偃王有無力之禍知韓子必有無德之患凡人禀性也清濁貪㢘各有操行猶草木異質不可復變易也狂譎華士不仕於齊猶段干木不仕於魏矣性行清㢘不貪富貴非時疾}
