  - {type: variant, offset: 1031, length: 1, content: 妨, SBCK: 之詰彭更也未為盡之也如彭更以孟子之言可謂禦人以口矣給匡章子曰陳仲子豈不誠㢘士乎居於於陵三日不食耳無聞目無見也井上有李螬食實者過半扶服徃将食之三咽然後耳有聞目有見也孟子曰於齊國之士吾必以仲子為巨擘焉雖然仲子惡能㢘充仲子之操則蚓而後可者也夫蚓上食槁壤下飲黄泉仲子之所居室伯夷之所築與抑亦盜跖之所築與所食之粟伯夷之所樹與抑亦盜跖之所樹與是未可知也曰是何傷哉彼身織屨妻辟纑以易之也曰仲子齊之世家兄戴蓋祿萬鍾以}
