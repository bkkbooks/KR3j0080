  - {type: variant, offset: 19, length: 1, content: 他, WYG: 益非所貴也夫法度之功者謂何等也養三軍之士明賞罰之命嚴刑峻法富國彊兵此法度也案秦之彊肯為此乎六國之亡皆滅於秦兵六國之兵非不鋭士衆之力非不勁也然而不勝至於破亡者彊弱不敵衆寡不同雖明法度其何益哉使童子變孟賁之意孟賁怒之童子操刄與孟賁戰童子必不勝力不如也孟賁怒而童子脩禮盡敬孟賁不忍犯也秦之與魏孟賁之與童子也魏有法度秦必不畏猶童子操刄孟賁不避也其尊士式賢者之閭非徒童子脩禮盡敬也夫力少則脩德兵彊則奮威秦以兵彊威無不勝卻軍還衆不犯魏境者賢干木之操髙魏文之禮也夫敬賢弱國之法度力少之彊助也謂之非法度之功如何髙皇帝議欲廢太子吕后患之即召張子房而取䇿子房教以敬迎四皓而厚禮之髙祖見之心消意沮太子遂安使韓子為吕后議進不過彊諫退不過勁力以此自安取誅之道也豈徒易哉夫太子敬厚四皓以消髙帝之議猶魏文式段干木之閭卻彊秦之兵也治國之道所養有二一曰養德二曰養力養德者養名髙之人以示能敬賢養力者養}
