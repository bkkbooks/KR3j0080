  - {type: variant, offset: 552, length: 1, content: 夏, SBCK: 乎人君治一國猶天地生萬物天地不為亂歲去春人君不以衰世屏德孔子曰斯民也三代所以直道而行也周穆王之世可謂衰矣任刑治政亂而無功甫侯諫之穆王存德享國久}
