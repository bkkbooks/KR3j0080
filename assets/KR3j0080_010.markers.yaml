  - {type: variant, offset: 586, length: 1, content: 生, SBCK: 曰彼一時也此一時也五百年必有王者興其間必有名世者矣由周以來七百有餘歲矣以其數則過矣以其時考之則可矣夫天未欲平治天下乎如欲平治天下當今之世舎我而誰也吾何爲不豫哉夫孟子言五百年有王者興何以見乎帝嚳王者而堯又王天下堯傳於舜舜又王天下舜傳於禹禹又王天下四聖之王天下也繼踵而興禹至湯且千歲湯至周亦然始於文王而卒傳於武王武王崩成王周公共治天下由周至孟子之時又七}
