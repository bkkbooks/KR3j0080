  - {type: variant, offset: 580, length: 2, content: 生性, SBCK: 也又知言之所起之禍其極所致之福見彼之問則知其措辭所欲之矣知其所之則知其極所當害矣孟子有云民舉安王庶幾改諸予日望之孟子所去之王豈前所不朝之王哉而是何其前輕之疾而後重之甚也如非是前王則不去而於後去之是後王不肖甚於前而去三日宿於前不甚不朝而宿於景丑氏何孟子之操前後不同所以為王終始不一也且孟子在魯魯平公欲見之嬖人臧倉毁孟子止平公樂正子以告曰行或使之止或尼之行止非人所能也予之不遇魯侯天也前不遇於魯後不遇於齊無以異也前歸之天今則歸之於王孟子論稱竟何定哉夫不行於齊王不用則若臧倉之徒毁讒之也此亦止或尼之也皆天命不遇非人所能也去何以不徑行而留三宿乎天命不當遇於齊王不用其言天豈為三日之間易命使之遇乎在魯則歸之於天絶意無冀在齊則歸之於王庻幾有望夫如是不遇之議一在人也或曰初去}
