  - {type: variant, offset: 562, length: 4, content: 陰氣適盛, krp: 而懼已死而哀今哭夫巳死不哀而懼是以知其有姦也韓子聞而非之曰子産不亦多事乎姦必待耳目之所及而后知之則鄭國之得姦寡矣不任典城之吏察參伍之正不明度量待盡聦明勞知慮而以知姦不亦無術乎韓子之非子産是也其非繆公非也夫婦人之不哀猶龐捫子不孝也非子産持耳目以知姦獨欲繆公須問以定邪子産不任典城之吏而以耳定實繆公亦不任吏而以口問立誠夫耳聞口問一實也俱不任吏皆不參伍厲伯之對不可以立實猶婦人之哭不可以定誠矣不可定誠使吏執而問之不可以立實不使吏考獨信厲伯口以罪不考之姦如何韓子曰子思不以過聞繆公貴之子服厲伯以姦聞繆公賤之人情皆喜貴而惡賤故季氏之亂成而不上聞此魯君之所以刼也夫魯君所以刼者以不明法度邪以不早聞姦也夫法度明雖不聞姦姦無由生法度不明雖日求姦決其源障之以掌也御者無銜見馬且犇無以制也使王良持轡馬無欲犇之心御之有數也今不言魯君無術而曰不聞姦不言審法度而曰不通下情韓子之非繆公也與術意而相違矣龐捫氏子不孝子思不言繆公貴之韓子非之以為明君求善而賞之求姦而誅之夫不孝之人下愚之才也下愚無禮順情從欲與鳥獸同謂之惡可也謂姦非也姦人外善内惡色厲内荏作為操止像類賢行以取升進容媚於上安肯作不孝著身為惡以取棄殉之咎乎龐捫是子可謂不孝不可謂姦韓子謂之姦失姦之實矣韓子曰布帛尋常庸人不擇爍金百鎰盜跖不搏以此言之法明民不敢犯也設明法於邦有盜賊之心不敢犯矣不測之者不敢發矣姦心藏於胷中不敢以犯罪法罪法恐之也明法恐之則不湏考姦求邪於下矣使法峻民無姦者使法不峻民多為姦而不言明王之嚴刑峻法而云求姦而誅之言求姦是法不峻民或犯之也世不專意於明法而專心求姦韓子之言與法相違人之釋溝渠也知者必溺身不塞溝渠而繕船檝者知水之性不可閼其勢必溺人也臣子之性欲姦君父猶水之性溺人也不敎所以防姦而非其不聞知是猶不備水之具而徒欲早知水之溺人也溺於水不責水而咎己者巳失防備也然則人君刼於臣已失法也備溺不閼水源防刼不求臣姦韓子所宜用教巳也水之性勝火如裹之以釡水煎而不得勝必矣夫君猶火也臣猶水也法度釡也火不求水之姦君亦不宜求臣之罪也刺孟篇孟子見梁惠王王曰叟不遠千里而來將何以利吾國乎孟子曰仁義而已何必曰利夫利有二有貨財之利有安吉之利惠王曰何以利吾國何以知不欲安吉之利而孟子徑難以貨財之利也易曰利見大人利涉大川乾元亨利貞尚書曰黎民亦尚有利哉皆安吉之利也行仁義得安吉之利孟子不且語問惠王何謂利吾國惠王言貨財之利乃可答若設令惠王之問未知何趣孟子徑答以貨財之利如惠王實問貨財孟子無以驗效也如問安吉之利而孟子答以貨財之利失對上之指違道理之實也齊王問時子我欲中國而授孟子室養弟子以萬鍾使諸大夫國人皆有所矜式子盍為我言之時子因陳子而以告孟子孟子曰夫時子惡知其不可也如使予欲富辭十萬而受萬是為欲富乎夫孟子辭十萬失謙讓之理也夫富貴者人之所欲也不以其道得之不居也故君子之於爵祿也有所辭有所不辭豈以巳不貪富貴之故而以距逆宜當受之賜乎陳臻問曰於齊王餽兼金一百鎰而不受於宋歸七十鎰而受於薛歸五十鎰而受取前日之不受是則今受之非也今日之受是則前日之不受非也夫君子必居一於此矣孟子曰皆是也當在宋也予將有逺行行者必以賮辭曰歸賮予何為不受當在薛也予有戒心辭曰聞戒故為兵戒歸之備乎予何為不受若於齊則未有處也無處而歸之是貨之也焉有君子而可以貨取乎夫金歸或受或不受皆有故非受之時巳貪當不受之時巳不貪也金有受不受之義而室亦宜有受不受之理今不曰巳無功若巳致仕受室非理而曰巳不貪富引前辭十萬以況後萬前當受十萬之多安得辭之彭更問曰後車數十乗從者數百人以傳食於諸侯不亦泰乎孟子曰非其道則一簞食而不可受於人如其道則舜受堯之天下不以為泰受堯天下孰與十萬舜不辭天下者是其道也今不曰受十萬非其道而曰巳不貪富貴失謙讓也安可以為戒乎沈同以其私問曰燕可伐與孟子曰可子噲不得與人燕子之不得受燕於子噲有士於此而子悦之不告於王而私}
