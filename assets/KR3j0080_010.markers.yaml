  - {type: variant, offset: 1235, length: 1, content: 移, SBCK: 避若兄之宅吐若兄之祿耳聞目見昭晳不疑仲子不處不食明矣今於陵之宅不見築者爲誰粟不知樹者爲誰何得成室而居之得成粟而食之孟子非之是爲太備矣仲子所居或時盜之所築仲子不知而居之謂之不充其操唯蚓然後可者也夫盜室之地中亦有蚓焉食盜宅中之槁壤飲盜宅中之黄泉蚓惡能為可乎在仲子之操滿孟子之議魚然後乃可夫魚處江海之中食江海之土海非盜所鑿土非盜所聚也然則仲子有大非孟子非之不能得也夫仲子之去母辟兄與妻獨處於陵以兄之宅為不義之宅以兄之祿為不義之祿故不處不食㢘㓗之至也然則其}
