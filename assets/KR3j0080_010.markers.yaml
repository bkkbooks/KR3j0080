  - {type: variant, offset: 590, length: 2, content: 終物, SBCK: 云王者五百歲必有王者之驗在何世乎云五百歲必有王者誰所言乎論不實事考驗信浮淫之語不遇去齊有不豫之色非孟子之賢效與俗儒無殊之驗也五百年者以爲天出聖期也又言以天未欲平治天下也其意以為天欲平治天下當以五百年之間}
