  - {type: variant, offset: 9, length: 2, content: 自然, SBCK: 聞伯夷風者貪夫㢘懦夫有立志聞栁下惠風者薄夫敦鄙夫寛此上化也非人所見段干木闔門不出魏文敬之表式其閭秦軍聞之卒不攻魏使魏無干木秦兵入境境土危亡秦彊國也兵無不勝兵加於魏魏國必破三軍兵頓流血千里今魏文式闔門之士卻彊秦之兵全魏國之境濟三軍之衆功莫大焉賞莫先焉齊有髙節之士曰狂譎華士二人昆弟也義不降志不仕非其主太公封於齊以此二子解沮齊衆開不為上用之路同時誅之韓子善之以為二子無益而有損也夫狂譎華士段干木之類也太公誅之無所卻到魏文侯式之卻彊秦而全魏功孰大者使韓子善干木闔門髙節魏文式之是也狂譎華士之操干木之節也善太公誅之非也使韓子非干木之行下魏文之式則干木以此行而有益魏文用式}
