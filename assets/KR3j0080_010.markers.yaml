  - {type: variant, offset: 552, length: 1, content: 夏, krp: 乎人君治一國猶天地生萬物天地不為亂歲去春人君不以衰世屏德孔子曰斯民也三代所以直道而行也周穆王之世可謂衰矣任刑治政亂而無功甫侯諫之穆王存德享國久}
  - {type: punctuation, offset: 554, content: ，, id: KR3j0080_tls_010-bkkpn121}
  - {type: 'tls:seg', offset: 554, content: '', id: KR3j0080_tls_010-11a.6}
  - {type: variant, offset: 554, length: 1, content: 秋, SBCK: 功傳於世夫穆王之治初亂終治非知昏於前才妙於後也前任蚩尤之刑後用甫侯之言也夫治人不能捨恩治國不能廢德治物不能去春韓子欲獨任刑用誅如何魯繆公問於子思曰吾聞龐􅏌氏子不孝不孝其行奚如子思對曰君子尊賢以崇德舉善以勸民若夫過行是細人之所識也臣不知也子思出子服厲伯見君問龐􅏌氏子子服厲伯對以其過皆君子所未曾聞自是之後君貴子思}
  - {type: page-break, offset: 554, content: '', id: KR3j0080_SBCK_010-7b}
  - {type: variant, offset: 554, length: 1, content: 秋, WYG: 功傳於世夫穆王之治初亂終治非知昏於前才妙於後也前任蚩尤之刑後用甫侯之言也夫治人不能捨恩治國不能廢德治物不能去春韓子欲獨任刑用誅如何魯繆公問於子思曰吾聞龐􅏌氏子不孝不孝其行奚如子思對曰君子尊賢以崇德舉善以勸民若夫過行是細人之所識也臣不知也子思出子服厲伯見君問龐􅏌氏子子服厲伯對以其過皆君子所未曾聞自是之後君貴子思}
  - {type: page-break, offset: 554, content: '', id: KR3j0080_WYG_010-9a, image: WYG0862/WYG0862-0123c.png}
  - {type: variant, offset: 554, length: 1, content: 秋, krp: 功傳於世夫穆王之治初亂終治非知昏於前才妙於後也前任蚩尤之刑後用甫侯之言也夫治人不能捨恩治國不能廢德治物不能去春韓子欲獨任刑用誅如何魯繆公問於子思曰吾聞龐􅏌氏子不孝不孝其行奚如子思對曰君子尊賢以崇德舉善以勸民若夫過行是細人之所識也臣不知也子思出子服厲伯見君問龐􅏌氏子子服厲伯對以其過皆君子所未曾聞自是之後君貴子思}
  - {type: variant, offset: 556, length: 5, content: 熟老適自枯, SBCK: 賤子服厲伯韓子聞之以非繆公以為明君求姦而誅之子思不以姦聞而厲伯以姦對厲伯宜貴子思宜賤今繆公貴子思賤厲伯失貴賤之宜故非之也夫韓子所尚者法度也人為善法度賞之惡法度罰之雖不聞善惡於外善惡有所制矣夫聞惡不可以行罰猶聞善不可以行賞也非人不舉姦者非韓子之術也使韓子聞善必将試之試之有功乃肯賞之夫聞善不輒加賞虛言未必可信也若此聞善與不聞無以異也夫聞善不輒賞則聞惡不輒罰矣聞善必試之聞惡必考之試有功乃加賞考有驗乃加罰虛聞空見實試未立賞罰未加賞罰未加善惡未定未定之事須術乃立則欲耳聞之非也鄭子産晨出過東匠之宫聞婦人之哭也撫其僕之手而聽之有間使吏執而問之手殺其夫者也翼日其僕問曰夫子何以知之子産曰其聲不慟凡人於其所親愛也知病而憂臨}
