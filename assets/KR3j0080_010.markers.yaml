  - {type: variant, offset: 1210, length: 4, content: 然天道難, SBCK: 食以妻則食之以兄之室則不居以於陵則居之是尚能為充其類也乎若仲子者蚓而後充其操者也夫孟子之非仲子也不得仲子之短矣仲子之怪鵝如吐之者豈為在母不食乎乃先譴鵝曰惡用鶂鶂者為哉他日其母殺以食之其兄曰是鶂鶂之肉仲子耻負前言即吐而出之而兄不告則不吐不吐則是食於母也謂之在母則不食失其意矣使仲子執不食於母鵝膳至不當食也今既食之}
