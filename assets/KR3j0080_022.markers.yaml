  - {type: variant, offset: 38, length: 12, content: 雷電擊折樹木發壞屋室則龍, SBCK: 居二日半簡子悟告大夫曰我之帝所甚樂與百神游于鈞天靡樂九奏萬舞不類三代之樂其聲動人心有一熊欲授我帝命我射之中熊熊死有羆來我又射之中羆羆死帝甚喜賜我一笥皆有副吾見兒在帝側帝属我一翟犬曰及而子之長也以賜之帝告我晉國且襄十世而亡嬴姓將大敗周人於范魁之西而亦不能有也今余將思虞舜之勲適余將以其胄女孟姚配而七世之孫董安于受言而書藏之以扁鵲言告簡子簡子賜扁鵲田四萬畒他日簡子出有人當道辟之不去從者將拘之當道者曰吾欲有謁於主君從者以聞簡子召之曰嘻吾有所見子遊也當道者曰屏左右願有謁簡子屏人當道者曰日者主君之病臣在帝側簡子曰然有之子見我何為當道者曰帝令主君射熊與羆皆死簡子曰是何也當道者曰晉國且有大難主君首之帝令主君滅二卿夫熊羆皆其祖也簡子曰帝賜我二笥皆有副何也當道者曰主君之子將剋二國於翟皆子姓也簡子曰吾見兒在帝側帝属我一翟犬曰及而子之長以賜之夫兒何說以賜翟犬當道者曰兒主君之子也翟犬代之先也主君之子且必有代及主君之後嗣且有革政而胡服并二國翟簡子問其姓而延之以官當道者曰臣野人致帝命遂不見是何謂也曰是皆妖也其占皆如當道者言所}
