  - {type: variant, offset: 58, length: 0, content: '', SBCK: 為賢乃廢太子而立之簡子死無恤代是為襄子襄子既立誘殺代王而并其地又并知氏之地後取空同戎自簡子後七世至武靈王呉廣入其母姓羸子孟姚其後武靈王遂取中山并胡地武靈王之十九年更為胡服國人化之皆如其言無不然者蓋妖祥見於兆審矣皆非實事吉凶之漸若天告之何以知天不實告之也以當道之人在帝側也夫在天帝之側皆貴神也致帝之命是天使者也人君之使車騎備具天帝之使單身當道非其狀也天官百二十與地之王者無以異也地之王者官属備具法象天官禀取制度天地之官同則其使者亦宜鈞官同人異者未可然也何以知簡子所見帝非實帝也以夢占知之樓臺山陵官位之象也人夢上樓臺升山陵輙得官位實樓臺山陵非官位也則知簡子所夢見帝者非天帝也人臣夢見人君人君必不見又必不賜以人臣夢占之知帝賜二笥翟犬者非天帝也非天帝則其言與百鬼游于鈞天非天也魯叔孫穆子夢天壓已者審然是天下至地也至地則有樓臺之抗不得及己及己則樓臺冝壞樓臺不壞是天不至地不至地則不得壓己不得壓己則壓己者非天也則天之象也叔孫穆子所夢壓己之天非天則知趙簡子所游之天非天也或曰人亦有直夢見甲明日則見甲矣夢見君明日則見君矣曰然人有直夢直夢皆象也其象直耳何以明之直夢者夢見甲夢見君明日見甲與君此直也如問甲與君甲與君則不見也甲與君不見所夢見甲與君者象類之也乃甲與君象類之則知簡子所見帝者象類帝也且人之夢也占者謂之魂行夢見帝是魂之上天也上天猶上山也夢上山足登山手引木然後能升}
