  - {type: variant, offset: 200, length: 0, content: '', SBCK: 神也曰大山地之體猶人有骨節骨節安得神如大山有神冝象大山之形何則人謂􅀑者死人之精其象如生人之形今大山廣長不與人同而其精神不異於人不異於人則鬼之類人鬼之類人則妖祥之氣也秦始皇帝三十六年熒惑守心有星墜下至地為石刻其石曰始皇死而地分始皇聞之令御史逐問莫服盡取石旁家人誅之因燔其石妖使者從闗東夜過華隂平野或有人持璧遮使者曰為我遺鎬池君因言曰今年祖龍死使者問之因忽不見置其璧去使者奉璧具以言聞始皇帝黙然良久曰山鬼不過知一歲事乃言曰祖龍者人之先也使御府視璧乃二十八年行渡江所沉璧也明三十七年夢與海神戰如人狀是何謂也曰皆始皇且死之妖也始皇夢與海神戰恚怒入海候神射大魚自琅邪至勞成山不見至之罘山還見巨魚射殺一魚遂旁海西至平原津而病到沙丘而崩當星墜之時熒惑為妖故石旁家人刻書其石若或為之文曰始皇死或教之也猶世間童謡非童所為氣導之也凡妖之發或象人為鬼或為人象鬼而使其實一也晉公子重耳失國乏食於道從耕者乞飯耕者奉塊土以賜公子公子怒咎犯曰此吉祥天賜土地也其後公子得國復土如咎犯之言齊田單保即墨之城欲詐燕軍云天神下助我有一人前曰我可以為神乎田單却走再拜事之竟以神下之言聞於燕軍燕軍信其有神又見牛若五采之文遂信畏懼軍破兵北田單卒勝復獲侵地此人象鬼之妖也使者過華隂人持璧遮道委璧而去妖鬼象人之形也夫沈璧於江欲求福也今還璧示不受物福不可得也璧者象前所沉之璧其實非也何以明之以鬼象人而見非實人也人見鬼象生存之人定問生存之人不與已相見妖氣象類人也妖氣象人之形則其所賫持之物非真物矣祖龍死謂始皇也祖人之本龍人君之象也人物類則其言禍亦放矣漢高皇帝以秦始皇崩之歲為泗上亭長送徒至驪山徒多道亡因縱所將徒遂行不還被酒夜徑澤中令一人居前前者還報曰前有大虵當道願還髙祖醉曰壯士行何畏乃前抜劒擊斬虵虵遂分兩徑開行數里醉困臥髙祖後人至虵所有一老嫗夜哭之人曰嫗何為哭嫗曰人殺吾子人曰嫗子為何見殺嫗曰吾子白帝子化為虵當徑今者赤帝子斬之故哭人以嫗為妖言因欲笞之嫗因忽不見何謂也曰是高祖初起威勝之祥也何以明之以嫗忽然不見也不見非人非人則鬼妖矣夫以嫗非人則知所斬之虵非虵也云白帝子何故為虵夜而當道謂虵白帝子高祖赤帝子白帝子為虵赤帝子為人五帝皆天之神也子或為虵或為人人與虵異物而其為帝同神非天道也且虵為白帝子則嫗為白帝后乎帝者之后前後冝備帝者之子官属宜盛今一虵死於徑一嫗哭於道云白帝子非實明矣夫非實則象象則妖也妖則所見之物皆非物也非物則氣也高祖所殺之虵非虵也則夫鄭厲公將入鄭之時邑中之虵與邑外之虵鬭者非虵也厲公將入鄭妖氣象虵而鬭也鄭國門虵非虵則知夏庭二龍為龍象為龍象則知鄭子産之時龍戰非龍也天道難知使非妖也使是亦妖也留侯張良椎秦始皇誤中副車始皇大怒索求張良張良變姓名亡匿下邳常閑從容步游下邳泗上有一老父衣褐至良所直墮其履泗下顧謂張良孺子下取履良愕然欲敺之以其老為彊忍下取履因跪進履父以足受履笑去良大驚父去里所復還曰孺子可教矣後五日平明與我期此良怪之因跪曰諾五日平明良徃父已先在怒曰與老人期後何也去後五日早㑹五日雞鳴復徃父又已先在復怒曰後何也去後五日復早來五日良夜未半往有頃父來喜曰當如是矣出一篇書曰讀是則為帝者師後十三年子見我濟北榖城山下黄石即我也遂去無他言弗復見旦日視其書乃太公兵法也良因異之習讀之是何謂也曰是高祖將起張良為輔之祥也良居下邳任俠十年陳涉等起沛公略地下邳良從遂為師將封為留侯後十三年從高祖過濟北界得糓成山下黄石取而葆祠之及留侯死并葬黄石盖吉凶之象神矣天地之化巧矣使老父象黄石黄石象老父何其神邪問曰黄石審老父老父審黄石耶曰石不能為老父老父不能為黄石妖祥之氣見故驗也何以明之晉平公之時石言魏榆平公問於師曠曰石何故言對曰石不能言或慿依也不然民聽偏也夫石不能人言則亦不能人形矣石言與始皇時石墜東郡民刻之無異也刻為文言為辭辭之與文一實也民刻文氣發言民之與氣一性也夫石不能自刻則亦不能言不能言則亦不能為人矣太公兵法氣象之也何以知非實也以老父非人知書亦非太公之書也氣象生人之形則亦能象太公之書問曰氣無刀筆何以為文曰魯惠公夫人仲子生而有文在其掌曰為魯夫人晉唐}
