  - {type: variant, offset: 1118, length: 237, content: 而未獲豢龍氏有陶唐氏既衰其後有劉累學擾龍于豢龍氏以事孔甲能飲食龍夏后嘉之賜氏曰御龍以更豕韋之後龍一雌死潛醢以食夏后夏后享之既而使求之懼而不得遷于魯縣范氏其後也獻子曰今何故無之對曰夫物物有其官官脩其方朝夕思之一日失職則死及之失官不食官宿其業其物乃至若泯棄之物乃低伏鬱湮不育由此言之龍可畜又可食也可食之物不能神矣世無其官又無董父后劉之人故潛藏伏匿出見希䟽出又乘雲與人殊路人謂之神如存其官而有其人則龍牛之類也何神之有以山海經言之以慎子韓子證之以俗世之畫驗之以箕子之泣訂之以蔡墨之對, SBCK: ''}
