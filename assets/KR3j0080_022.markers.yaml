  - {type: variant, offset: 136, length: 0, content: '', SBCK: 未終下也若人夢行至雒陽覺因從雒陽悟矣魂神蜚馳何疾也疾則必非其狀必非其狀則其上天非實事也非實事則為妖祥矣夫當道之人簡子病見於帝側後見當道象人而言與相見帝側之時無以異也由此言之卧夢為隂候覺為陽占審矣趙襄子既立知伯益驕請地韓魏韓魏予之請地於趙趙不予知伯益怒遂率韓魏攻趙襄子襄子懼乃犇保晉陽原過從後至於託平驛見三人自帶以上可見自帶以下不可見予原過竹二節莫通曰為我以是遺趙無恤既至以告襄子襄子齊三日親自割竹有赤書曰趙無恤余霍大山陽侯天子三月丙戍余將使汝滅知氏汝亦祀我百邑余將賜汝林胡之地襄子再拜受神之命是何謂也曰是盖襄子且勝之祥也三國攻􅀳陽歲餘引汾水灌其城城不浸}
