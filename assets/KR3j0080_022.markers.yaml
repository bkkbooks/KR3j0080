  - {type: variant, offset: 1, length: 4, content: 虛篇盛夏, SBCK: 畢方並轄蚩尤居前風伯進掃雨師灑道虎狼在前鬼神在後蟲虵伏地白雲覆上大合鬼神乃作為清角今主君徳薄不足以聽}
