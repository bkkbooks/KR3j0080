  - {type: variant, offset: 861, length: 155, content: 極也夫有象箸必有玉杯玉杯所盈象箸所挾則必龍肝豹胎夫龍肝可食其龍難得難得則愁下愁下則禍生故從而痛之如龍神其身不可得殺其肝何可得食禽獸肝胎非一稱龍肝豹胎者人得食而知其味美也春秋之時龍見于絳郊魏獻子問於蔡墨曰吾聞之蟲莫智於龍以其不生得也謂之智信乎對曰人實不知非龍實智古者畜龍故國有豢龍氏有御龍氏獻子曰是二者吾亦聞之而, SBCK: 言}
