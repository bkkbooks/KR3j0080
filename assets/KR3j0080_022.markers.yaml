  - {type: variant, offset: 36, length: 0, content: '', SBCK: 側乎趙簡子病五日不知人大夫皆懼於是召進扁鵲扁鵲入視病出董安于問扁鵲扁鵲曰血脉治也而怪昔秦繆公甞如此矣七日悟悟之日告公孫支與子輿曰我之帝所甚樂吾所以久者適有學也帝告我晉國且大亂五世不安其復將霸未老而死霸者之子且令而國男女無别公孫支書而藏之于篋於是晉獻公之亂文公之霸襄公敗秦師於崤而歸縱滛此之所謂今主君之病與之同不出三日病必}
