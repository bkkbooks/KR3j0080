  - {type: variant, offset: 55, length: 1, content: 雷, SBCK: 當道之人妖人也其後晉二卿范氏中行氏作亂簡子攻之中行昭子范文子敗出犇齊始簡子使姑布子卿相諸子莫吉至翟婦之子無恤以為貴簡子與語賢之簡子募乃告一本作諸子曰吾藏寳符於常山之上先得者賞諸子皆上山無所得無恤還曰已得符矣簡子問之無恤曰從常山上臨代代可}
