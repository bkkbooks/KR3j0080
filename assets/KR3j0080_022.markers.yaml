  - {type: variant, offset: 6, length: 0, content: '', SBCK: 聽之將恐有敗平公曰寡人老矣所好者音也願遂聽之師曠不得已而鼓之一奏之有雲從西北起再奏之風至大雨隨之裂帷幕破俎豆墮廊瓦坐者散走平公恐懼伏于廊室晉國大旱赤地三年平公之身遂癃病何謂也曰是非衛靈公國且削則晉平公且病若國且旱亡妖也師曠曰先聞此聲者國削二國先聞之矣何知新聲非師延所鼓也曰師延自投濮水形體腐於水中精氣消於泥塗安能復鼓琴屈原自沉於江屈原善著文師延善鼔琴如師延能鼓琴則屈原能復書矣楊子雲弔屈原屈原何不報屈原生}
