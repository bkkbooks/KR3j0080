  - {type: variant, offset: 438, length: 0, content: '', SBCK: 何以驗之以狂者見鬼也狂癡獨語不與善人相得者病困精亂也夫病且死之時亦與狂等卧病及狂三者皆精衰倦目光反照故皆獨見人物之象焉一曰鬼者人所見得病之氣也氣不和者中人中人為鬼其氣象人形而見故病篤者氣盛氣盛則象人而至至則病者見其象矣假令得病山林之中其見鬼則見山林之精人或病越地者病見越人坐其側由此言之灌夫竇嬰之徒或時氣之形象也凡天地之間氣皆純於天天文垂象於上其氣降而生物氣和者養生不和者傷害本有象於天則其降下有形於地矣故鬼之見也象氣為之也衆星之體為人與鳥獸故其病人則見人與鳥獸之形一曰鬼者老物精也夫物之老者其精為人亦有未老性能變化象人之形人之受氣有與物同精者則其物與之交及病精氣衰劣也則來犯陵之矣何以效之成事俗間與物交者見鬼之來也夫病者所見之鬼與彼病物何以異人病見鬼來象其墓中死人來迎呼之者宅中之六畜也及見他鬼非是所素知者他家若草野之中物為之也一曰鬼者本生於人時不成人變化而去}
