  - {type: variant, offset: 444, length: 1, content: 貴, SBCK: 疫鬼一居江水是為虐鬼一居若水是為魍魎鬼一居人宫室區隅漚庫善驚人小兒前顓頊之世生子必多若顓頊之鬼神以百數也諸鬼神有形體法能立樹與人相見者皆生於善人得善人之氣故能似類善人之形能與善人相害隂陽浮游之類若雲煙之氣不能為也一曰鬼者甲乙之神也甲乙者天之别作剛一本氣也其形象人人病且死甲乙之神至矣假令甲乙之日病則死見庚辛之神矣何則甲乙鬼庚辛報甲乙故病人且死殺鬼之至者庚辛之神也何以效之以甲乙日病者其死生之期常在庚辛之日此非論者所以為實也天道難知鬼神闇昧故具載列令世察之也一曰鬼者物也與人無異天地之間有鬼之物常在四􅁁之外時徃來中國與人雜則凶惡之類也故人病且死者乃見之天地生物也有人如鳥獸及其生凶物亦有似人象鳥獸者故凶禍之家或見蜚尸或見走凶或見人形三者皆鬼也或謂之鬼或謂之凶或謂之魅或謂之魑皆生存實有非虚無象類之也何以明之成事俗間家人且㐫見流光集其室或見其形若鳥之狀時流人堂室察其不謂若鳥獸矣夫物有形則能食能食則便利便利有驗則形體有實矣左氏春秋曰投之四裔以禦魑魅山海經曰北方有鬼國說魑者謂之龍物也而魅與龍相連魅}
