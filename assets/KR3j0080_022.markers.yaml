  - {type: variant, offset: 1356, length: 663, content: 之知龍不能神不能升天天不以雷電取龍明矣世俗言龍神而升天者妄矣世俗之言亦有緣也短書言龍無尺木無以升天又曰升天又言尺木謂龍從木中升天也彼短書之家世俗之人也見雷電發時龍隨而起當雷電樹木擊之時龍適與雷電俱在樹木之側雷電去龍隨而上故謂從樹木之中升天也實者雷龍同類感氣相致故易曰雲從龍風從虎又言虎嘯谷風至龍興景雲起龍與雲相招虎與風相致故董仲舒雩祭之法設土龍以為感也夫盛夏太陽用事雲雨干之太陽火也雲雨水也水火激薄則鳴而為雷龍聞雷聲則起起而雲至雲至而龍乘之雲雨感龍龍亦起雲而升天天極雷高雲消復降人見其乘雲則謂升天見天為雷電則為天取龍世儒讀易文見傳言皆知龍者雲之類拘俗人之議不能通其說又見短書為證故遂謂天取龍天不取龍龍不升天當丘訢之殺兩蛟也手把其尾拽而出之至淵之外雷電擊之蛟則龍之類也蛟龍見而雲雨至雲雨至則雷電擊如以天實取龍龍為天用何以死蛟為取之且魚在水中亦隨雲雨蜚而乘雲雨非升天也龍魚之類也其乘雷電猶魚之飛也魚隨雲雨不謂之神龍乘雷電獨謂之神世俗之言失其實也物在世間各有所乘魚乘水虵乘霧龍乘雲鳥乘風見龍乘雲獨謂之神失龍之實誣龍之能也然則龍之所以為神者以能屈伸其體存亡其形屈伸其體存亡其形未足以為神也豫讓吞炭漆身為厲人不識其形子貢滅鬚為婦人人不知其狀龍變體自匿人亦不能覺變化藏匿者巧也物性亦有自然狌狌知往乾鵲知來鸚鵡能言三怪比龍性變化也如以巧為神豫讓子貢神也孔子曰游者可為網飛者可為矰至於龍也吾不知其乘風雲上升今日見老子其猶龍乎夫龍乘雲而上雲消而下物類可察上下可知而云孔子不知以孔子之聖尚不知龍況俗人智淺有好奇之性無實可之心謂之龍神而升天不足怪也, SBCK: 衡卷第二十二}
