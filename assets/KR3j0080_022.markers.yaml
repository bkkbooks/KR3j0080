  front:
  - {type: variant, offset: 0, length: 0, content: '', SBCK: 論衡卷第二十二紀妖篇紀妖篇衛靈公將之晉至濮水之上夜聞鼓新聲者說之使人問之左右皆報弗聞召師㳙而告之曰有鼓新聲者使人問左右盡報弗聞其狀似鬼子為我聽而冩之師㳙曰諾因靜坐撫琴而冩之明日報曰臣得之矣然而未習請更宿而習之靈公曰諾因復宿明日已習遂去之晉晉平公觴之施夷之臺酒酣靈公起曰有新聲願請奏以示公公曰善乃召師㳙令坐師曠之旁援琴鼓之未終曠撫而止之曰此亡國之聲不可遂也平公曰此何道出師曠曰此師延所作淫聲與紂爲靡靡之樂也武王誅紂懸之白旄師延東走至濮水而自投故聞此聲者必於濮水之上先聞此聲者其國削不可遂也平公曰寡人好者音也子其使遂之師㳙鼔究之平公曰此所謂何聲也師曠曰此所謂清商公曰清商固最悲乎師曠曰不如清徴公曰清徴可得聞乎師曠曰不可古之得聽清徴者皆有徳義之君也今吾君徳薄不足以聽之公曰寡人所好者音也願試聽之師曠不得已援琴鼓之一奏有玄鶴二八從南方來集於郭門之上危再奏而列三奏延頸而鳴舒翼而舞音中宫商之聲聲徹于天平公大恱坐者皆喜平公提觴而起為師曠壽反坐而問曰樂莫悲于清徴乎師曠曰不如清角平公曰清角可得聞乎師曠曰不可昔者黄帝合鬼神於西大山之上駕象輿六􅀇}
