  - {type: variant, offset: 1674, length: 621, content: 然則桑亦食蠶蠶為絲絲為帛帛為衣衣以入宗廟為朝服與暢無異何以謂之凶衛獻公太子至靈臺虵遶左輪御者曰太子下拜吾聞國君之子虵遶車輪左者速得國太子遂不行反乎舍御人見太子太子曰吾聞為人子者盡和順於君不行私欲共嚴承令不逆君安今吾得國是君失安也見國之利而忘君安非子道也得國而拜其非君欲廢子道者不孝逆君欲則不忠而欲我行之殆吾欲吾國之危明也拔劍將死其御止之不能禁遂伏劍而死夫虵遶左輪審為太子速得國太子宜不死獻公宜疾薨今獻公不死太子伏劍御者之占俗之虛言也或時虵為太子將死之妖御者信俗之占故失吉凶之實夫桑榖之生與虵遶左輪相似類也虵至實凶御者以為吉桑榖實吉祖己以為凶禹南濟於江有黃龍負舟舟中之人五色無主禹乃嘻笑而稱曰我受命於天竭力以勞萬民生寄也死歸也死歸也何足以滑和視龍猶蝘蜓也龍去而亡患案古今龍至皆為吉而禹獨謂黃龍凶者見其負舟舟中之人恐也夫以桑榖比於龍吉凶雖反蓋相似野草生於朝尚為不吉殆有若黃龍負舟之異故為吉而殷朝不亡晉文公將與楚成王戰於城濮彗星出楚楚操其柄以問咎犯咎犯對曰以彗鬭倒之者勝文公夢與成王搏成王在上盬其腦問咎犯咎犯曰君得天而成王伏其罪戰必大勝文公從之大破楚師嚮令文公問庸臣必曰不勝何則彗星無吉搏在上無凶也夫桑榖之占占為凶猶晉當彗末搏在下為不吉也然而吉者殆有若對彗見天之詭故高宗長久殷朝不亡使文公不問咎犯咎犯不明其吉戰以大勝世人將曰文公以至賢之德破楚之無道天雖見妖臥有凶夢猶滅妖消凶以獲福殷無咎犯之異知而有祖己信常之占故桑榖之文傳世不絕轉禍為福之言到今不實, SBCK: ''}
