  - {type: variant, offset: 1155, length: 518, content: 生於朝是為不吉何故謂之瑞一野之物來至或出吉凶異議朱草蓂莢善草故為吉則是以善惡為吉凶不以都野為好醜也周時天下太平越嘗獻雉於周公高宗得之而吉雉亦草野之物何以為吉如以雉耿介有似於士則麇亦仍有似君子公孫述得白鹿占何以凶然則雉之吉凶未可知則夫桑榖之善惡未可驗也桑榖或善物象遠方之士將皆立於高宗之朝故高宗獲吉福享長久也說災異之家以為天有災異者所以譴告王者信也夫王者有過異見於國不改災見草木不改災見於五穀不改災至身左氏春秋傳曰國之將亡鮮不五稔災見於五穀五穀安得熟不熟將亡之徵災亦有且亡五穀不熟之應天不熟或為災或為福禍福之實未可知桑榖之言安可審論說之家著於書記者皆云天雨穀者凶書傳曰蒼頡作書天雨穀鬼夜哭此方凶惡之應和者天何用成穀之道從天降而和且猶謂之善況所成之穀從雨下乎極論訂之何以為凶夫陰陽和則穀稼成不則被災害陰陽和者穀之道也何以謂之凶絲成帛縷成布賜人絲縷猶為重厚況遺人以成帛與織布乎夫絲縷猶陰陽帛布猶成穀也賜人帛不謂之惡天與之穀何故謂之凶夫雨穀吉凶未可定桑榖之言未可知也使暢草生於周之時天下太平倭人來獻暢草暢草亦草野之物也與彼桑榖何異如以夷狄獻之則為吉使暢草生於周家肯謂之不善乎夫暢草可以熾釀芬香暢達者將祭灌暢降神設自生於周朝與嘉禾朱草蓂莢之類不殊, SBCK: 化薄}
