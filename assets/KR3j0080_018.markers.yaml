  - {type: variant, offset: 3, length: 3, content: 殷高宗, SBCK: 隂陽不和災變發起或時先世遺咎或時氣自然賢聖感類慊懼自思災變惡徵何爲至乎引過自責恐有罪畏愼恐懼之意未必有其實事也何以明之以湯遭旱自責以五過也聖人純完行無缺失矣何自責有五過然如書曰湯自責天應以雨湯本無過以五過自責天何故雨以無過致旱亦知自責不能得雨也由此言之旱不爲湯至雨不應自責然而前旱後雨之字一有者自然之氣也此言書之語也難之曰春秋大雩董仲舒設土龍皆爲一時間也一時不雨恐懼雩祭求隂請福憂念百姓也湯遭旱七年以五過自責謂何時也夫遭旱一時輙自責乎旱至七年乃自責也謂一時輒自責也字一有七年乃雨天應之誠何其留也始謂七年乃自責憂念百姓何其遲也不合雩祭之法不厭憂民之義書之言未可信也由此論之周成王之雷風發亦此類也金縢曰秋大熟未穫天大雷電以風禾盡偃大木斯拔邦人大恐當此之時周公死儒者說之以為成王狐疑於周公欲以天子禮􅁙公公人臣也欲以人臣禮􅁙公公有王功狐疑於􅁙周公之間天大雷雨動怒示變以彰聖功古文家以武王崩周公居攝管蔡流言王意狐疑周公周公奔楚故天雷雨以悟成王夫一雷一雨之變或以為􅁙疑或以為信讒二家未可審且訂葬疑之說秋夏之際陽氣尚盛未嘗無雷雨也顧其拔木偃禾頗為狀耳當雷雨時成王感懼開金縢之書見周公之功執書泣過自責之深自責適巳天偶反風書家則謂天為周公怒也千秋萬夏不絶雷雨茍謂雷雨為天怒乎是則皇天嵗嵗怒也正月陽氣發泄雷聲始動秋夏陽至極而雷折茍謂秋夏之雷至極字一有陽為天大怒正月之雷天小怒乎雷為天怒雨為恩施使天為周公怒徒當雷不當雨今雨俱至天怒且喜乎子於是日也哭則不歌周禮子夘稷食菜羮哀樂不並行哀樂不並行喜怒反并至乎秦始皇帝東封岱嶽雷雨暴至劉媪息大澤雷雨晦冥始皇無道自同前聖治亂自謂太平天怒可也劉媪息大澤夢與神遇是生髙祖何怒於生聖人而為雷雨乎堯時大風為害堯激大風於青丘之野舜入大麓烈風雷雨堯舜世之隆主何過於天天為風雨也大旱春秋雩祭又董仲舒設土龍以類招氣如天應雩龍必為雷雨何則秋夏之雨與雷俱也必從春秋仲舒之術則大雩龍求怒天乎師曠奏白雪之曲雷電下擊鼓清角之音風雨暴至茍為雷雨為天怒天何憎於白雪清角而怒師曠為之乎此雷雨之難也又問之曰成王不以天子禮葬周公天為雷風偃禾拔木成王覺悟執書泣過天乃反風偃禾復起何不為疾反風以立大木必須國人起築之乎應曰天不能曰然則天有所不能乎應曰然難曰孟賁推人人仆接人而起接人立天能拔木不能復起是則天力不如孟賁也秦時三山亡猶謂天所徙也夫木之輕重孰與三山能徙三山不能起大木非天用力宜也如謂三山非天所亡然則雷雨獨天所為乎問曰天之欲令成王以天子之禮􅁙周公以公有聖德以公有王功經曰王乃得周公死自以為功代武王之說今天動威以彰周公之德也難之曰伊尹相湯伐夏為民興利除害致天下太平湯死復相大甲大甲佚豫放之桐宫攝政三年乃退復位周公曰伊尹格于皇天天所宜彰也伊尹死時天何以不為雷雨應曰以百兩篇曰伊尹死大霧三日大霧三日亂氣矣非天怒之變也東海張霸造百兩篇其言雖未可信且假以問天為雷雨以悟成王成王未開金匱雷止乎巳開金匱雷雨乃止也應曰未開金匱雷止也開匱得書見公之功覺悟泣過決以天子禮葬公出郊觀變天止雨反風禾盡起由此言之成王未覺悟雷雨止矣難曰伊尹霧三日天何不三日雷雨須成王覺悟乃止乎太戊}
