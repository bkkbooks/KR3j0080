  - {type: variant, offset: 27, length: 1, content: 相, SBCK: 畏懼猶此類也心疑於不以天子禮葬公卒遭雷雨之至則懼而畏過矣夫雷雨之至天未必責成王也雷雨至成王懼以自責也夫感則倉頡奚仲之心懼則左師華臣之意也懐嫌疑之計遭暴至之氣以類之驗見則天怒之效成矣見類驗於寂漠猶感動而畏懼況雷雨揚軒䡷之聲成王庶幾能不怵惕乎迅雷風烈孔子必變禮君子聞雷雖夜衣冠而坐所以敬雷懼激氣也聖人君子於道無嫌然猶順天變動況成王有周公之疑聞雷雨之變安能不振懼乎然則雷雨之至也殆且自天氣成王畏懼殆且感物類也夫天道無為如天以雷雨責怒人則亦能以雷雨殺無道古無道者多可以雷雨誅殺其身必命聖人興師動軍頓兵傷士難以一雷行誅輕以三軍尅敵何天之不憚煩也或}
  - {type: page-break, offset: 27, content: '', id: KR3j0080_SBCK_018-15b}
