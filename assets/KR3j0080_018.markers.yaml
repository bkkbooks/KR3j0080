  - {type: variant, offset: 19, length: 1, content: 高, SBCK: 太戊思政桑穀消亡宋景公時熒守心出三善言熒惑徙舍使太戊不思政景公無三善言桑穀不消熒惑不徙何則災變所以譴告也所譴告未覺災變不除天之至意也今天怒為雷雨以責成王成王未覺雨雷之息何其早也又問曰禮諸侯之子稱公子諸侯之孫稱公孫皆食采地殊之衆庶何則公子公孫親而又尊得體公稱又食采地名實相副猶文質相稱也天彰周公之功令成王以天子禮􅁙何不令成王號周公以周王副天子之禮乎應曰王者名之尊號也人臣不得名也難曰人臣猶得名王禮乎武王伐紂下車追王大王王季文王三人者諸侯亦人臣也以王號加之何為獨可於三王不可周於公天意欲彰周公豈能明乎豈以王迹起於三人哉然而王功亦成於周公江起岷山流為濤瀨相濤瀨之流孰與初起之源秬鬯之所為到白雉之所為來三王乎周公乎字一有也周公功德盛於三王不加王號豈天惡人妄稱之哉周衰六國稱王齊秦更為帝當時天無禁怒之變周公不以天子禮􅁙天為雷雨以責成王何天之好惡不純一乎又問曰魯季孫賜曾子簀曽子病而寢之童子曰華而睆者大夫之簀而曽子感慙命元易簀蓋禮大夫之簀士不得寢也今周公人臣也以天子禮葬魂而有靈將安之不也應曰成王所為天之所予何為不安難曰季孫所賜大夫之簀豈曾子之所自制乎何獨不安乎子疾病子路遣門人為臣病間曰久矣哉由之行詐也無臣而為有臣吾誰欺欺天乎孔子罪子路者也巳非人君也字一有子路使門人為臣非天之心而妄為之是欺天也周公亦非天子也以孔子之心況周公周公必不安也季氏旅於太山孔子曰曽謂泰山不如林放乎以曽子之細猶却非禮周公至聖豈安天子之葬曽謂周公不如曽子乎由此原之周公不安也大人與天地合德周公不安天亦不安何故為雷雨以責成王乎又問曰死生有命富貴在天武王之命何可代乎應曰九齡之夢天奪文王年以益武王克殷二年之時九齡之年未盡武王不豫則請之矣人命不可請獨武王可非世常法故藏於金縢不可復為故掩而不見難曰九齡之夢武王巳得文王之年未應曰巳得之矣難曰巳得文王之年命當自延克殷二年雖病猶將不死周公何爲請而代之應曰人君爵人以官議定未之即與曹下案目然後可諾天雖奪文王年以益武王猶湏周公請乃能得之命數精微非一臥之夢所能得也應曰九齡之夢能得也難曰九齡之夢文王夢與武王九齡武王夢帝予其九齡其天已予之矣武王已得之矣何湏復請人且得官先夢得爵其後莫舉猶自得官何則兆象先見其驗必至也古者謂年爲齡巳得九齡猶人夢得爵也周公因必效之夢請之於天功安能大乎又問曰功無大小德無多少人須仰恃賴之者則為美矣使周公不代武王武王病死周公與成王而致天下太平乎應曰成事周公輔成王而天下不亂使武王不見代遂病至死周公致太平何疑乎難曰若是武王之生無益其死無損須周公功乃成也周衰諸侯背畔管仲九合諸侯一匡天下孔子曰㣲管仲吾其被髪左衽矣使無管仲不合諸侯夷狄交侵中國絶滅此無管仲有所傷也程量有益管仲之功偶於周公管仲死桓公不以諸侯禮葬以周公況之天亦宜怒㣲雷薄雨不至何哉豈以周公聖而管仲不賢乎夫管仲為反坫有三歸孔子譏之以為不賢反坫三歸諸侯之禮天子禮葬王者之制皆以人臣俱不得為大人與天地合德孔子大人也譏管仲之僣禮皇天欲周公之侵制非合德之驗書家之說未可然也以見鳥跡而知為書見蜚蓬而知為車天非以鳥跡命倉頡以蜚蓬使奚仲也奚仲感蜚蓬而倉頡起鳥跡也晉文反國命徹麋墨舅犯心感辭位歸家夫文公之徹麋墨非欲去舅犯舅犯感慙自同於麋墨也宋華臣弱其}
