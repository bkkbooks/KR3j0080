  - {type: variant, offset: 316, length: 3, content: 魯昭公, SBCK: 以今不奉行也禮樂之制存見於今今之人民肯行之乎今人不肯行古人亦不肯舉以今之人民知古之人民也物亦物也人生一世夀至一百嵗生為十嵗兒時所見地上之物生死改易者多至於百嵗臨且死時所見諸物與年十嵗時所見無以異也使上世下世民人無有異則百嵗之間足以卜筮六畜長短五穀大小昆蟲草木金石珠玉蜎蜚蠕動跂行喙息無有異者此形不異也古之水火今之水火也今氣為水火也使氣有異則古之水清火熱而今水濁火寒乎人生長六七尺大三四圍面有五色夀至於百萬世不異如以上世人民侗長佼好堅彊老夀下世反此則天地初立始爲人時長可如防風之君色如宋朝壽如彭祖乎從當今至千世之後人可長如莢英色如嫫母壽如朝生乎王莽}
