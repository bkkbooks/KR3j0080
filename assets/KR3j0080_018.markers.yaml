  - {type: variant, offset: 602, length: 1, content: 龍, krp: 故夫宓犧之前人民至質朴卧者居居坐者于于羣居聚處知其母不識其父至宓犧時人民頗文知欲詐愚勇欲恐怯彊欲凌弱衆欲暴寡故宓犧作八卦以治之至周之時人民文薄八卦難復因襲故文王衍為六十四首極其變使民不倦至周之時人民久薄故孔子作春秋采毫毛之善貶纖介之惡}
  - {type: variant, offset: 604, length: 3, content: 褒褒姒, SBCK: 曰周監於二代郁郁乎文哉吾從周孔子知世浸弊文薄難治故加宻致之罔設纖㣲之禁檢柙守持備具悉極此言妄也上世之人所懐五常也下世之人亦所懐五常也俱懐五常之道共禀一氣而生上世何以質朴下世何以文薄彼見上世之民飲血茹毛無五穀之食後世穿地為井耕土種穀飲井食粟有水火之調又見上古巖居穴處衣禽獸之皮後世易以宫室有布帛之飾則謂上世質朴下世文薄矣夫器業變易性行不異然而有質朴文薄之語者世有盛衰衰極久有弊也譬猶衣食之於人也初成鮮完始熟香潔少久穿敗連日臭茹矣文質之法古今所共一質一文一衰一盛古而有之非獨今也何以效之傳曰夏后氏之王教以忠上教以忠君子忠其失也小人野救野莫如敬殷王之教以敬上教用敬君子敬其失也小人鬼救鬼莫如文故周之王教以文上教以文君子文其失也小人薄救薄莫如忠承周而王者當教以忠夏所承唐虞之教薄故教以忠唐虞以文教則其所承有鬼失矣世人見當今之文薄也狎侮非之則謂上世朴質下世文薄猶家人子弟不謹則謂他家子弟謹良矣語稱上世之人重義輕身遭忠義之事得巳所當赴死之分明也則必赴湯趨鋒死不顧恨故􅀪演之節陳不占之義行事比類書籍所載亡命捐身衆多非一今世趨利茍生棄義妄得不相勉以義不相激以行義廢身不以為累行隳事不以相畏此言妄也夫上世之士今世之士也俱含仁義之性則其遭事並有奮身之節古有無義之人今有建節之士善惡雜厠何世無有述事者好髙古而下今貴所聞而賤所見辨士則談其久者文人則著其逺者近有竒而辨不稱今有異而筆不記若夫琅邪兒子明嵗敗之時兄為飢人所食自縛叩頭代兄為食餓人美其義兩舍不食兄死收養其孤愛不異於己之子嵗敗穀盡不能兩活餓殺其子活兄之子臨淮許君叔亦養兄孤子嵗倉卒之時餓其親子活兄之子與子明同義會稽孟章父英為郡決曹掾郡將撾殺非辜事至覆考英引罪自予卒代將死章後復為郡功曹從役攻賊兵卒北敗為賊所射以身代將卒死不去此􅀪演之節陳不占之義何以異當今著文書者肯引以為比喻乎比喻之證上則求虞夏下則索殷周秦漢之際功竒行殊猶以為後又況當今在百代下言事者目親見之乎畫工好畫上代之人秦漢之士功行譎竒不肯圖今世之士者尊古卑今也貴鵠賤雞鵠逺而雞近也使當今說道深於孔墨名}
