  - {type: variant, offset: 618, length: 0, content: '', krp: 損於前人好事者肯舍久逺之書而垂意觀讀之乎揚子雲作太玄造法言張伯松不肯壹觀與之併肩故賤其言使子雲在伯松前伯松以為金匱矣語稱上世之時聖人德優而功治有竒故孔子曰大哉堯之為君也唯天為大唯堯則之蕩蕩乎民無能名焉巍巍乎其有成功也煥乎其有文章也舜承堯不墮洪業禹襲舜不虧大功其後至湯舉兵伐桀武王把鉞討紂無巍巍蕩蕩之文而有動兵討伐之言蓋其德劣而兵試武用而化薄化薄不能相逮之明驗也及至秦漢兵革雲擾戰力角勢秦以得天下旣得天下無嘉瑞之美若叶和萬國鳯皇來儀之類非德劣不及功薄不若之徴乎此言妄也夫天地氣和即生聖人聖人之治即立大功和氣不獨在古先則聖人何故獨優世俗之性好襃古而毁今少所見而多所聞又見經傳增賢聖之美孔子尤大堯舜之功又聞堯禹禪而相讓湯武伐而相奪則謂古聖優於今功化渥於後矣夫經有襃增之文世有空加之言讀經覽書者所共見也孔子曰紂之不善不若是之甚也是以君子}
