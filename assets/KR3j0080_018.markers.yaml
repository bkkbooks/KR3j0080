  - {type: variant, offset: 1054, length: 175, content: 民人處草廬之中可謂其人吉而廬凶乎民人入都不謂之凶野草生朝何故不吉雉則民人之類如謂含血者吉長狄來至是吉也何故謂之凶如以從夷狄來者不吉介葛盧來朝是凶也如以草木者為凶朱草蓂莢出是不吉也朱草蓂莢皆草也宜生於野而生於朝是為不吉何故謂之瑞一野之物來至或出吉凶異議朱草蓂莢善草故為吉則是以善惡為吉凶不以都野為好醜也周時天下太平越嘗獻雉於周公高宗得之而吉雉亦草野之物, WYG: 拾遺}
