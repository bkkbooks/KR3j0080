  - {type: 'tls:seg', offset: 0, content: '', id: KR3j0080_tls_018-1a.1}
  - {type: xml-element, offset: 0, content: '', id: KR3j0080_tls_018-bkkxmlele1}
  - {type: punctuation, offset: 0, content: 《, id: KR3j0080_tls_018-bkkpn1}
  - {type: variant, offset: 1, length: 1, content: 虛, SBCK: 之功不聽趙良之議以取車裂之患德薄多欲君臣相憎怨也道家德厚下當其上上安其下純􅀩無為何復譴告故曰政之適也君臣相忘於治魚相忘於水獸相忘於林人相忘於世故曰天也孔子謂顔淵曰吾服汝忘也汝之服於我亦忘也以孔子為君顔淵為臣尚不能譴告況以老子為君文子為臣乎老子文子似天地者也淳酒味甘飲之者醉不相知薄酒酸苦賔主嚬蹙夫相譴告道薄之驗也謂天譴告曾謂天德不若淳酒乎禮者忠信之薄亂之首也相譏以禮故相譴告三皇之時坐者于于行者居居乍自以為馬乍自以為牛純徳行而民瞳矇曉惠之心未形生也當時亦無災異如有災異不名曰譴告何則時人愚惷不知相繩責也末世衰㣲上下相非災異時至則造譴告之言矣夫今之天古之天也非古之天厚而今之天薄也譴告之言生於今者人以心准況之也誥誓不及五帝要盟不及三王交質子不及五伯德彌薄者信彌衰心險而行詖則犯約而負教教約不行則相譴告譴告不改舉兵相滅由此言之譴告之言衰亂之語也而謂之上天為之斯蓋所以疑也且凡言譴告者以人道驗之也人道君譴告臣上天譴告君也謂災異為譴告夫人道臣亦有諫君以災異為譴告而王者亦當時有諫上天之義其效何在茍謂天德優人不能諌優德亦宜􅀇黙不當譴告萬石君子有過不言對案不食至優之驗也夫人之優者猶能不言皇天德大而乃謂之譴告乎夫天無為故不言災變時至氣自為之夫天地不能為亦不能知也腹中有寒腹中疾痛人不使也氣自為之夫天地之間猶人背腹之中也謂天為災變凡諸怪異之類無小大薄厚皆天所為乎牛生馬桃生李如論者之言天神入牛腹中為馬把李實提桃間乎牢曰子云吾不試故藝又曰吾少也賤故多能鄙事人之賤不用於大者類多伎能天尊貴髙大安能撰為災變以譴告人且吉凶蜚色見於面人不能為色自發也天地猶人身氣變猶蜚色人不能為蜚色天地安能為氣變然則氣變之見殆自然也變自見色自發占􅀱之家因以言也夫寒温譴告變動招致四疑皆已論矣譴告於天道尤詭故重論之論之所以難别也說合於人事不入於道意從道不隨事雖違儒家之說合黄老之義也感類}
