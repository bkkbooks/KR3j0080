  - {type: variant, offset: 0, length: 0, content: '', krp: 論衡卷第十八王充自然篇感類篇齊世篇自然篇天地合氣萬物自生猶夫婦合氣子自生矣萬物之生含血之類知飢知寒見五穀可食取而食之見絲麻可衣取而衣之或說以為天生五穀以食人生絲麻以衣人此謂天為人作農夫桑女之徒也不合自然故其義疑未可從也試依道家論之天者普施氣萬物之中穀愈飢而絲麻救寒故人食穀衣絲麻也夫天之不故生五穀絲麻以衣食人由其有災變不欲以譴告人也物自生而人衣食之氣自變而人畏懼之以若說論之厭於人心矣如天瑞爲故自然焉在無爲何居何以天之自然也以天無口目也案有爲者口目之類也口欲食而目欲視有嗜欲於内發之於外口目求之得以爲利欲之爲也今無口目之欲於物無所求索夫何爲乎何以知天無口目也以地知之地以土爲體土本無口目天地夫婦也地體無口目亦知天無口目也使天體乎宜與地同使天平氣氣若雲煙雲煙之屬安得口目或曰凡動行之類皆本無有為有欲故動動則有為今天動行與人相似安得無為曰天之動行也施氣也體動氣乃出物乃生矣由人動氣也體動氣乃出子亦生也夫人之施氣也非欲以生子氣施而子自生矣天動不欲以生物而物自生此則自然也施氣不欲為物而物自為此則無為也謂天自然無為者何氣也恬澹無欲無為無事者也老耼得以夀矣老耼禀之於天使天無此氣老耼安所禀受此性師無其說而弟子獨言者未之有也或復於桓公公曰以告仲父左右曰一則仲父二則仲父為君乃易乎桓公曰吾未得仲父故難巳得仲父何為不易夫桓公得仲父任之以事委之以政不復與知皇天以至優之德與王政而譴告人則天德不若桓公而覇君之操過上帝也或曰桓公知管仲賢故委任之如非管仲亦將譴告之矣使天遭堯舜必無譴告之變曰天能譴告人君則亦能故命聖君擇才若堯舜受以王命委以王事勿復與知今則不然生庸庸之君失道廢德隨譴告之何天不憚勞也曹參為漢相縱酒歌樂不聽政治其子諫之笞之二百當時天下無擾亂之變淮陽鑄偽錢吏不能禁汲黯為太守不壊一鑪不刑一人髙枕安卧而淮陽政清夫曹參為相若不為相汲黯為太守若郡無人然而漢朝無事淮陽刑錯者參德優而黯威重也計天之威德孰與曹參汲黯而謂天與王政隨而譴告之是謂天德不若曹參厚而威不若汲黯重也蘧伯玉治衛子貢使人問之何以治衛對曰以不治治之夫不治之治無為之道也或曰太平之應河出圖洛出書不畫不就不為不成天地出之有為之驗也張良遊泗水之上遇黄石公授太公書蓋天佐漢誅秦故命令神石為鬼書授人復為有為之效也曰此皆自然也夫天安得以筆墨而為圖書乎天道自然故圖書自成晉唐叔虞生字一有魯成季友生文在其手故叔曰虞季曰友宋仲子生有文在其手曰為魯夫人三者在母之時文字成矣而謂天為文字在母之時天使神持錐筆墨刻其身乎自然之化固疑難知外若有為内實自然是以太史公紀黄石事疑而不能實也趙簡子夢上天見一男子在帝之側後出見人當道則前所夢見在帝側者也論之以為趙國且昌之狀也黄石授書亦漢且興之象也妖氣為鬼鬼象人形自然之道非或為之也草木之生華葉青葱皆有曲折象類文章謂天為文字復為華葉乎宋人或刻木為楮作約一本葉者三年乃成孔子曰使地三年乃成一葉則萬物之有葉者寡矣如孔子之言萬物之葉自為生也自為生也故能並成如天為之其遲當若宋人刻楮葉矣觀鳥獸之毛羽毛羽之采色通可為乎鳥獸未能盡實春觀萬物之生秋觀其成天地為之乎物自然也如謂天地為之為之宜用手天地安得萬萬千千手並為萬萬千千物乎諸物在天地之間也猶子在母腹中也母懐子氣十月而生鼻口耳目髪膚毛理血脉脂腴骨節爪齒自然成腹中乎母為之也偶人千萬不名為人者何也鼻口耳目非性自然也武帝幸王夫人王夫人死思見其形道士以方術作夫人形形成出入宫門武帝大驚立而迎之忽不復見蓋非自然之真方士巧妄之偽故一見恍忽消散滅亡有為之化其不可久行猶王夫人形不可久見也道家論自然不知引物事以驗其言行故自然之說未見信也然雖自然亦須有為輔助耒耜耕耘因春播種者人為之也及穀入地日夜長夫人不能為也或為之者敗之道也宋人有閔其苗之不長者就而揠之明日枯死夫欲為自然者宋人之徒也問曰人生於天地天地無為人禀天性者亦當無為而有為何也曰至德純渥之人禀天氣多故能則天自然無為禀氣薄少不遵道德不似天地故曰不肖不肖者不似也不似天地不類聖賢故有為也天地為鑪造化為工禀氣不一安能皆賢賢之純者黄老是也黄者黄帝也老者老子也黄老之操身中恬澹其治無為正身共巳而隂陽自和無心於為而物自化無意於生而物自成易曰黄帝堯舜垂衣裳而天下治垂衣裳者垂拱無為也孔子曰大哉堯之為君也惟天為大惟堯則之又曰巍巍乎舜禹之有天下也而不與焉周公曰上帝引佚上帝謂舜禹也舜禹承安繼治任賢使能恭巳無為而天下治舜禹承堯之安堯則天而行不作功邀名無為之化自成故曰蕩蕩乎民無能名焉年五十者擊壤於塗不能知堯之德蓋自然之化也易曰大人與天地合其德黄帝堯舜大人也其德與天地合故知無為也天道無為故春不為生而夏不為長秋不為成冬不為藏陽氣自出物自生長隂氣自起物自成藏汲井決陂灌溉園田物亦生長霈然而雨物之莖葉根垓莫不洽濡程量澍澤孰與汲井決陂哉故無為之為大矣本不求功故其功立本不求名故其名成沛然之雨功名大矣而天地不為也氣和而雨自集儒家說夫婦之道取法於天地知夫婦法天地不知推夫婦之道以論天地之性可謂惑矣夫天覆於上地偃於下下氣烝上上氣降下萬物自生其中間矣當其生也天不須復與也由子在母懐中父不能知也物自生子自成天地父母何與知哉及其生也人道有教訓之義天道無為聽恣其性故放魚於川縱獸於山從其性命之欲也不驅魚令上陵不逐獸令入淵者何哉拂詭其性失其所宜也夫百姓魚獸之類也上德治之若烹小鮮與天地同操也商鞅變秦法欲為殊}
