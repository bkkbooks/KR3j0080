  - {type: variant, offset: 602, length: 1, content: 龍, SBCK: 故夫宓犧之前人民至質朴卧者居居坐者于于羣居聚處知其母不識其父至宓犧時人民頗文知欲詐愚勇欲恐怯彊欲凌弱衆欲暴寡故宓犧作八卦以治之至周之時人民文薄八卦難復因襲故文王衍為六十四首極其變使民不倦至周之時人民久薄故孔子作春秋采毫毛之善貶纖介之惡}
