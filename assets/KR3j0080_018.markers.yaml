  - {type: variant, offset: 621, length: 0, content: '', SBCK: 舉紂桀孔子曰紂之不善不若是之甚也則知堯舜之徳不若是其盛也堯舜之禪湯武之誅皆有天命非優劣所能為人事所能成也使湯武在唐虞亦禪而不伐堯舜在殷周亦誅而不讓蓋有天命之實而世空生優劣之語經言叶和萬}
