  - {type: variant, offset: 3286, length: 2, content: 倫理, SBCK: 孔子父也見伯魚不知孔子之子也張湯之父五尺湯長八尺湯孫長六尺孝宣鳳皇高五尺所從生鳥或時高二尺後所生之鳥或時高一尺安得常種種類無常故曽晢生參氣性不世顔路出回古今卓絶馬有千里不必騏驎之駒鳥有仁聖不必鳳皇之鶵山頂之溪不通江湖然而有魚水精自為之也廢庭壞殿基上草生地氣自出之也按溪水之魚殿基上之草無類而出瑞應之自至天地未必有種類也夫瑞應猶災變也瑞以應善災以應惡善惡雖反其應一也災變無種瑞應亦無類也陰陽之氣天地之氣也遭善而為和遇惡而為變豈天地為善惡之政更生和變之氣乎然則瑞應之出殆無種類因善而起氣和而生亦或時政平氣和衆物變化猶春則鷹變爲鳩秋則鳩化爲鷹蛇䑕之類輒爲魚鼈蝦蟇爲鶉雀爲蜄蛤物隨氣變不可謂無黃石爲老父授張良書去復爲石也儒知之或時太平氣和麞爲騏驎鵠爲鳯皇是故氣性隨時變化豈必有常類哉襃姒玄黿之子二龍漦也􅀳之二卿熊羆之裔也吞燕子薏苡履大跡之語世之人然之獨謂瑞有常類哉以物無種計之以人無類議之以體變化論之鳯皇騏驎生無常類則形色何爲當同}
