  - {type: variant, offset: 774, length: 769, content: 則世宜稱亞聖不宜言離朱人目之視也物大者易察小者難審使顏淵處昌門之外望太山之形終不能見況從太山之上察白馬之色色不能見明矣非顏淵不能見孔子亦不能見也何以驗之耳目之用均也目不能見百里則耳亦不能聞也陸賈曰離婁之明不能察帷薄之內師曠之聰不能聞百里之外昌門之與太山非直帷薄之內百里之外也秦武王與孟說舉鼎不任絕脈而死舉鼎用力力由䈥脈䈥脈不堪絕傷而死道理宜也今顏淵用目望遠望遠目睛不任宜盲眇髮白齒落非其致也髮白齒落用精於學勤力不休氣力竭盡故至於死伯奇放流首髮早白詩云惟憂用老伯奇用憂而顏淵用睛蹔望倉卒安能致此儒書言舜葬於蒼梧禹葬於會稽者巡狩年老道死邊土聖人以天下為家不別遠近不殊內外故遂止葬夫言舜禹實也言其巡狩虛也舜之與堯俱帝者也共五千里之境同四海之內二帝之道相因不殊堯典之篇舜巡狩東至岱宗南至霍山西至太華北至恆山以為四嶽者四方之中諸侯之來並會嶽下幽深遠近無不見者聖人舉事求其宜適也禹王如舜事無所改巡狩所至以復如舜舜至蒼梧禹到會稽非其實也實者舜禹之時鴻水未治堯傳於舜舜受為帝與禹分部行治鴻水堯崩之後舜老亦以傳於禹舜南治水死於蒼梧禹東治水死於會稽賢聖家天下故因葬焉吳君高說會稽本山名夏禹巡守會計於此山因以名郡故曰會稽夫言因山名郡可也言禹巡狩會計於此山虛也巡狩本不至會稽安得會計於此山宜聽君高之說誠為會稽會計禹到南方何所會計如禹始東死於會稽舜亦巡狩至於蒼梧安所會計百王治定則出巡巡則輒會計是則四方之山皆會計也百王太平升封太山太山之上封可見者七十有二紛綸湮滅者不可勝數如審帝王巡狩則輒會計會計之地如太山封者四方宜多夫郡國成名猶萬物之名不可說也獨為會稽立歟周時舊名吳越也為吳越立名從何往哉六國立名狀當如何天下郡國且百餘縣邑出萬鄉亭聚里皆有號名賢聖之才莫能說君高能說會稽不能辨定方名會計之說未可從也巡狩考正法度禹時吳為裸國斷髮文身考之無用會計如何傳書言舜葬於蒼梧象, SBCK: ''}
