  - {type: variant, offset: 2862, length: 0, content: '', SBCK: 臯陶孔子人之聖也十二聖相各不同而欲以麞戴角則謂之騏驎相與鳳皇象合者謂之鳳皇如何夫聖鳥獸色毛不同猶十二聖骨體不均也戴角之相猶戴午也顓頊戴午堯舜必未然今魯所獲麟戴角即後所見麟未必戴角也如用魯所獲麟求知世間之麟則必不能知也何則毛羽骨角不合同也假令不同或時似類未必真是虞舜重瞳王莽亦重瞳晉文駢脅張儀亦駢脅如以骨體毛色比則王莽虞舜而張儀晉文也有若在魯最似孔子孔子死弟子共坐有若問以道事有若不能對者何也體狀似類實性非也今五色之鳥一角之獸或時似類鳳皇騏驎其實非真而說者欲以骨體毛色定鳳皇騏驎誤矣是故顔淵庶㡬不似孔子有若恒庸反類聖人由是言之或時真鳳皇騏驎骨體不似􅁪庸鳥獸毛色類真知之如何儒者自謂見鳳皇騏驎輒而知之則是自謂見聖人輒而知之也臯陶馬口孔子反宇設後輒有知而絶殊馬口反宇尚未可謂聖何則十二聖相不同前聖之相難以照後聖也骨法不同姓名不等身形殊狀生出異土雖復有聖何如知之桓君山謂楊子雲曰如後世復有聖人徒知其才能之勝已多不能知其聖與非聖人也子雲曰誠然夫聖人難知知能之美若桓揚者尚復不能知世儒懷庸庸之知齎}
