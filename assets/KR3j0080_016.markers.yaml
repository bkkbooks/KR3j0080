  - {type: variant, offset: 731, length: 0, content: '', SBCK: 吏未必皆伏罪也夫蟲食穀自有止期猶蠶食桑自有足時也生出有日死極有月期盡變化不常為蟲使人君不罪其吏蟲猶自亡夫蟲風氣所生蒼頡知之故凢蟲為風之字取氣於風故八日而化生春夏之物或食五穀或食衆草食五穀吏受錢穀也其食他草受人何物倮蟲三}
