  - {type: variant, offset: 3289, length: 2, content: 桓公, SBCK: 禮記瑞命篇云雄曰鳳雌曰皇雄鳴曰即即雌鳴足足詩云梧桐生矣于彼高岡鳳皇鳴矣于彼朝陽菶菶萋萋噰噰喈喈瑞命與詩俱言鳳皇之鳴瑞命之言即即足足詩云雍雍喈喈此聲異也使聲審則形不同也使審同詩與禮異世傳鳳皇之鳴故將疑焉案魯之獲麟云有麞而角言有麞者色如麞也麞色有常若鳥色有常矣武王之時火流為烏云其色赤赤非烏之色故言其色赤如似麞而色異亦當言其色白若黒今成事色同故言有麞麞無角有異於故故言而角也夫如是魯之所得驎者若麞之狀也武帝之時西巡狩得白驎一角而五趾角或時同言五趾者足不同矣魯所得麟云有麞不言色者麞無異色也武帝云得白驎色白不類麞故言有麞正言白驎色不同也孝宣之時}
