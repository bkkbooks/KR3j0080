  - {type: variant, offset: 3384, length: 459, content: 親戚實論者謂夫桀紂惡微於亡秦亡秦過泊於王莽無淫亂之言桓公妻姑姊妺七人是惡浮於桀紂而過重於秦莽也春秋采毫毛之美貶纖芥之惡桓公惡大不貶何哉魯文姜齊襄公之妹也襄公通焉春秋經曰莊二年冬夫人姜氏會齊侯于郜春秋何尤於襄公而書其奸何宥於桓公隱而不譏如經失之傳家左丘明公羊穀梁何諱不言案桓公之過多內寵內嬖如夫人者六有五公子爭立齊亂公薨三月乃訃世聞內嬖六人嫡庶無別則言亂於姑姊妹七人矣傳書言齊桓公負婦人而朝諸侯此言桓公之淫亂無禮甚也夫桓公大朝之時負婦人於背其游宴之時何以加此方脩士禮崇厲肅敬負婦人於背何以能率諸侯朝事王室葵丘之會桓公驕矜當時諸侯畔者九國睚眥不得九國畔去況負婦人淫亂之行何以肯留或曰管仲告諸侯曰吾君背有疽創不得婦人瘡不衰愈諸侯信管仲故無畔者夫十室之邑必有忠信若孔子當時諸侯千人以上必知方術治疽不用婦人管仲為君諱也諸侯知仲為君諱而欺己必恚怒而畔去何以能久統會諸侯成功於霸或曰桓公實無道任賢相管仲故能霸天下夫無道之人與狂無異信讒遠賢反害仁義安能任管仲能養人令之成事桀殺關龍逢紂殺王子比干無道之君莫能用賢使管仲賢桓公不能用用管仲, SBCK: 章和甘露常降}
  - {type: variant, offset: 3384, length: 150, content: 親戚實論者謂夫桀紂惡微於亡秦亡秦過泊於王莽無淫亂之言桓公妻姑姊妺七人是惡浮於桀紂而過重於秦莽也春秋采毫毛之美貶纖芥之惡桓公惡大不貶何哉魯文姜齊襄公之妹也襄公通焉春秋經曰莊二年冬夫人姜氏會齊侯于郜春秋何尤於襄公而書其奸何宥於桓公隱而不譏如經失之傳家左丘明公羊穀梁何諱不言案桓公之過多內寵內嬖如夫人者六有, WYG: ''}
