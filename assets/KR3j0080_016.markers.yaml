  - {type: variant, offset: 669, length: 0, content: '', krp: 長吏且危則虎入邑行於民間何則長吏光氣已消都邑之地與野均也推}
  - {type: variant, offset: 670, length: 0, content: '', SBCK: 以論虎所食人亦命時也命訖時衰光氣去身視肉猶尸也故虎食之天道偶㑹虎適食人長吏遭惡故謂為變應上天矣古今凶驗非唯虎也野物皆然楚王英宫樓未成鹿走上堦其後果薨魯昭公且出鸜鵒來巢其後季氏逐昭公昭公奔齊遂死不還賈􅁩為長沙王傅鵩鳥集舎發書占之曰主人將去其後遷為梁王傅懷王好騎墜馬而薨賈誼傷之亦病而死昌邑王時夷鴣鳥集宫殿下王射殺之以問郎中令龔遂龔遂對曰夷鴣野鳥入宫亡之應也其後昌邑王竟亡盧奴令田光與公孫􅀪等謀反其且覺時狐鳴光舎屋上光心惡之其後事覺坐誅會稽東部都尉禮文伯時羊伏㕔下其後遷為東萊太守都尉王子鳳時麕入府中其後遷丹陽太守夫吉凶同占遷免一驗俱象空亡精氣消去也故人且亡也野鳥入宅城且空也草蟲入邑等類衆多行事比肩略舉較著以定實驗也商蟲篇變復之家謂蟲食穀者部吏所致也貪則侵漁故蟲食穀身黑頭赤則謂武官頭黒身赤則謂文官使加罰於蟲所象類之吏則蟲滅息不復見矣夫頭赤則謂武吏頭黑則謂文吏所致也時或頭赤身白頭黑身黄或頭身皆黄或頭身皆青或皆白若魚肉之蟲應何官吏時或白布豪民猾吏被刑乞貸者威勝於官取多於吏其蟲形象何如狀哉蟲之滅也皆因風雨案蟲滅之時則吏未必伏罰也陸田之中時有䑕水田之中時有魚蝦蟹之類皆為穀害或時希出而暫為害或常有而為災等類衆多應何官吏魯宣公履畒而稅應時而有蝝生者或}
