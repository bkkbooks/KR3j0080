  - {type: variant, offset: 4492, length: 320, content: 二年列侯卒與聶政殺俠累相去十七年而言聶政刺殺韓王短書小傳竟虛不可信也傳書又言燕太子丹使刺客荊軻刺秦王不得誅死後高漸麗復以擊筑見秦王秦王說之知燕太子之客乃冒其眼使之擊筑漸麗乃置鉛於筑中以為重當擊筑秦王膝進不能自禁漸麗以筑擊秦王顙秦王病傷三月而死夫言高漸麗以筑擊秦王實也言中秦王病傷三月而死虛也夫秦王者秦始皇帝也始皇二十年燕太子丹使荊軻刺始皇始皇殺軻明矣二十一年使將軍王翦攻燕得太子首二十五年遂伐燕而虜燕王喜後不審何年高漸麗以筑擊始皇不中誅漸麗當三十七年游天下到會稽至琅邪北至勞盛山並海西至平原津而病到沙丘平臺始皇崩夫讖書言始皇還到沙丘而亡傳書又言病筑瘡三月而死於秦一始皇之身世或言死於沙丘或言死於秦其死言恆病瘡傳書之言多失其實世俗之人不能定也, SBCK: 六}
