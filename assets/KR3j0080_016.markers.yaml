  - {type: variant, offset: 54, length: 0, content: '', SBCK: 見實驗魯般墨子刻木為鳶蜚之三日而不集為之巧也使作土龍者若魯般墨子則亦將有木鳶蜚不集之類夫蜚鳶之氣雲雨之氣也氣而蜚木鳶何獨不能從土龍十也夫雲雨之氣也知於蜚鳶之氣未}
