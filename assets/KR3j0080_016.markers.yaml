  - {type: variant, offset: 3283, length: 1, content: 亂, WYG: 為瑞矣故夫鳳皇之至也猶赤烏之集也謂鳳皇有種赤烏復有類乎嘉禾醴泉甘露嘉禾生於禾中與禾中異穗謂之嘉禾醴泉甘露出而甘美也皆泉露之所生出非天上有甘露之種地下有醴泉之類聖治公平而乃沾下産出也蓂莢朱草亦生在地集於衆草無常本根暫時産出旬月枯折故謂之瑞夫鳳皇麒麟亦瑞也何以有種類案周太平越裳獻白雉白雉生短而白色耳非有白雉之種也魯人得戴角之麞謂之麒麟亦或時生於麞非有麒麟之類由此言之鳳皇亦或時生於鵠鵲毛竒羽殊出異衆鳥則謂之鳳皇耳安得與衆鳥殊種類也有若曰麒麟之於走獸鳳皇之於飛鳥太山之於丘垤河海之於行潦類也然則鳳皇麒麟都與鳥獸同一類體色詭耳安得異種同類而有竒竒為不世不世難審識之如何堯生丹朱舜生商均商均丹朱堯舜之類也骨性詭耳鯀生禹瞽瞍生舜舜禹鯀瞽瞍之種也知德殊矣試種嘉禾之實不能得嘉禾恒見粢梁之粟莖穗怪竒人見叔梁紇}
