  - {type: variant, offset: 8, length: 1, content: 書, SBCK: 雩設土龍以招雨其意以雲龍相致易曰雲從龍風從虎以類求之故設土龍陰陽從類雲雨自至儒者或問曰夫易言雲從龍者謂真龍也豈謂土哉楚葉公好龍墻壁槃盂皆畫龍必以象類為若真是則葉公之國常有雨也易又曰風從虎謂虎嘯而谷風至也風之與虎亦同氣類設為土虎置之谷中風能至乎夫土虎不能而致風土龍安能而致雨古者畜龍乗車駕龍故有豢龍氏御龍氏夏后之庭二龍常在季年夏衰二龍低伏真龍在地猶無雲雨况偽象乎禮畫雷樽象雷之形雷樽不聞能致雷土龍安能而動雨頓牟掇芥礠石引針皆以其真是不假他類他類肖似不能掇取者何也氣性異殊不能相感動也劉子駿掌雩祭典士龍事桓君山亦難以頓牟礠石不能真是何能掇針取芥子駿窮無以應子駿漢朝智囊筆墨淵海竆無以應者是事非議誤不得道理實也曰夫以非真難是也不以象類說非也夫東風至感字一有酒湛溢鯨魚死彗星出天道自然非人事也事與彼雲龍相從同一實也日火也月水也水火感動常以真氣今伎道之家鑄陽燧取飛火於日作方諸取水於月非自然也而天然之也土龍亦非真何為不能感天一也陽燧取火於天五月丙午日中之時消煉五石鑄}
