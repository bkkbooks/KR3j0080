  - {type: variant, offset: 3122, length: 3, content: 向擊鳩, SBCK: 以其衆鳥之長聖神有異故羣鳥附從如見大鳥來集羣鳥附之則是鳯皇鳯皇審則定矣夫鳯皇與騏驎同性鳯皇見羣鳥從騏驎見衆獸亦冝隨案春秋之麟不言衆獸隨之宣帝武帝皆得騏驎無衆獸附從之文如以騏驎爲人所􅀗附從者散鳯皇人不􅀗自來}
  - {type: variant, offset: 3122, length: 3, content: 向擊鳩, WYG: 以其衆鳥之長聖神有異故羣鳥附從如見大鳥來集羣鳥附之則是鳳皇鳳皇審則定矣夫鳳皇與麒麟同性鳳皇見羣鳥從麒麟見衆獸亦冝隨案春秋之麟不言衆獸隨之宣帝武帝皆得麒麟無衆獸附從之文如以麒麟為人所獲附從者散鳳皇人不獲自來}
  - {type: variant, offset: 3122, length: 3, content: 向擊鳩, krp: 以其衆鳥之長聖神有異故羣鳥附從如見大鳥來集羣鳥附之則是鳯皇鳯皇審則定矣夫鳯皇與騏驎同性鳯皇見羣鳥從騏驎見衆獸亦冝隨案春秋之麟不言衆獸隨之宣帝武帝皆得騏驎無衆獸附從之文如以騏驎爲人所獲附從者散鳯皇人不獲自來}
  - {type: variant, offset: 3126, length: 0, content: '', SBCK: 翔附從可見書曰簫韶九成鳯皇來儀大傳曰鳯皇在列樹不言羣鳥從也豈宣帝所致者異哉或曰記事者失之唐虞之君鳳皇實有附從上世久遠記事遺失經書之文未足以實也夫實有而記事者失之亦有實無而記事者生之夫如是儒書之文難以實事案附從以知鳳皇未得實也且人有佞猾而聚者鳥亦有佼黠而從羣者當唐虞之時鳳慤愿宣帝之時佼黠乎何其俱有聖人之德行動作之操不均同也無鳥附從或時是鳳皇羣鳥附從或時非也君子在世清節自守不廣結從出入動作人不附從豪猾之人任使用氣徃來進退士衆雲合夫鳳皇君子也必以隨多者効鳳皇是豪黠為君子也歌曲彌妙和者彌寡行操益清交者益鮮鳥獸亦然必以附從效鳳皇是用和多為妙曲也龍與鳳皇為比類宣帝之時黄龍出于新豐羣蛇不隨神雀鸞鳥皆衆鳥之長也其仁聖雖不及鳳皇然其從羣鳥亦冝數十信陵孟甞食客三千稱為賢君漢將軍衞青及將軍霍}
  - {type: page-break, offset: 3126, content: '', id: KR3j0080_SBCK_016-16a}
