  - {type: variant, offset: 17, length: 0, content: '', SBCK: 如禹之德則亦將有雲雨之驗五也頓牟掇芥礠石鉤象之石非頓牟也}
  - {type: variant, offset: 17, length: 0, content: '', WYG: 如禹之德則亦將有雲雨之驗五也頓牟掇芥礠石鉤象之石非頓牟也}
  - {type: variant, offset: 17, length: 0, content: '', krp: 如禹之德則亦將有雲雨之驗五也頓牟掇芥礠石鉤象之石非頓牟也}
  - {type: variant, offset: 18, length: 4, content: 賢聖所傳, SBCK: 能掇芥土龍亦非真當與礠石鉤象為類六也楚葉公好龍墻壁盂樽皆􅀞龍象眞龍聞而下之夫龍與雲雨同氣故能感動以類相從葉公以爲􅀞致眞龍今獨何以不能致雲雨七也神靈示人以象不以實故寢臥夢悟見事之象將吉吉象來將凶凶象至神靈之氣雲雨之類八也神靈以象見實土龍何獨不能以僞致眞也上古之人有神荼鬱壘者昆弟二人性能執􅀑居東海度朔山上立桃樹下簡閱百􅀑􅀑}
