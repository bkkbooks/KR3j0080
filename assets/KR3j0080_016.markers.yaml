  - {type: variant, offset: 653, length: 0, content: '', krp: 變魯公牛哀病化為虎搏食其兄同變化者不以為怪入山林草澤見害於虎怪之非也蝮蛇悍猛亦能害人行止澤中於蝮蛇應何官吏蜂蠆害人入毒氣害人入水火害人人為蜂蠆所螫為毒氣所中為火所燔為水所溺又誰致之者茍諸禽獸乃應吏政行山林中麋鹿野猪牛象熊羆豺狼蜼蠼皆復殺人茍謂食人乃應爲變䗢􅺃閩䖟皆食人人身彊大故不至死倉卒之世榖食之貴百姓飢餓自相啖食厥變甚於虎變復之家不處苛政且虎所食非獨人也含血之禽有形之獸虎皆食之人謂應功曹之姦食他禽獸應何官吏夫虎毛蟲人倮蟲毛蟲飢食倮蟲何變之有四夷之外大人食小人虎之與蠻夷氣性一也平陸廣都虎所不由也山林草澤虎所生出也必以虎食人應功曹之姦是則平陸廣都之縣功曹常爲賢山林草澤之邑功曹常伏誅也夫虎食人於野應功曹之姦虎時入邑行於民間功曹游於閭巷之中乎實說虎害人於野不應政其行都邑乃為怪夫虎山林之獸不狎之物也常在草野之中不為馴畜猶人家之有䑕也伏匿希出非可常見也命吉居安䑕不擾亂禄衰居危䑕為殃變夫虎亦}
