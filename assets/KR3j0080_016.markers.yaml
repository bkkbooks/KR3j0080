  - {type: variant, offset: 23, length: 0, content: '', SBCK: 道理妄爲人禍荼與鬱壘縳以盧索執以食虎故今縣官斬桃爲人立之戸側畫虎之形著之門闌夫桃人非荼鬱壘也畫虎非食􅀑之虎也刻畫效象兾以禦凶今土龍亦非致雨之龍獨信桃人畫虎}
  - {type: page-break, offset: 23, content: '', id: KR3j0080_SBCK_016-3b}
