  - {type: variant, offset: 1545, length: 178, content: 耕禹葬會稽鳥為之田蓋以聖德所致天使鳥獸報祐之也世莫不然如考實之殆虛言也夫舜禹之德不能過堯堯葬於冀州或言葬於崇山冀州鳥獸不耕而鳥獸獨為舜禹耕何天恩之偏駮也或曰舜禹治水不得寧處故舜死於蒼梧禹死於會稽勤苦有功故天報之遠離中國故天痛之夫天報舜禹使鳥田象耕何益舜禹天欲報舜禹宜使蒼梧會稽常祭祀之使鳥獸田耕不能使人祭祭加舜禹之墓田施人民之家天之報祐聖人何其拙也且無益哉, SBCK: 長}
