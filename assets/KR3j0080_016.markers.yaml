  - {type: variant, offset: 3296, length: 0, content: '', SBCK: 角不同矣春秋之麟如麞宣帝之驎言如鹿鹿與麞小大相倍體不同也夫三王之時驎毛色角趾身體高大不相似類推此准後世驎出必不與前同明矣夫騏驎鳳皇之類騏驎前後體色不同而欲以宣帝之時所見鳳皇高五尺文章五色準前況後當復出鳳皇謂與之同誤矣後當復出見之鳳皇騏驎必已不與前世見出者相似類而世儒自謂見而輒知之柰何案魯人得驎不敢}
