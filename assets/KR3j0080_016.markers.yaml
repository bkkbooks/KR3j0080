  - {type: variant, offset: 108, length: 6, content: 奇造異作驚目, SBCK: 春東耕為土象人男女各二人秉耒把鋤或立土牛未必能耕也順氣應時示率下也今設土龍雖知不能致雨亦當夏時以類應變與立土人土牛同一義也禮宗廟}
