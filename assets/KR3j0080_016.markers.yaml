  - {type: variant, offset: 1797, length: 2, content: 世俗, SBCK: 方煑馬屎以汁漬種者令禾不蟲如或以馬屎漬種其郷部吏鮑焦陳仲子也是故后稷神農之術用則其郷吏何免為姦何則蟲無從生上無以察也蟲食他草平事不怪食五穀葉乃謂之災桂有蠧桑有蝎桂中藥而桑給蠶其用亦急與穀無異蠧蝎不為怪獨謂蟲為災不通物類之實闇於災變之情也穀蟲曰蠱蠱若蛾矣粟米饐熱生蠱夫蠱食粟米不謂之災蟲食苖葉歸之於政如說蟲之家謂粟輕苖重也蟲之種類衆多非一魚肉腐臭有蟲醯醬不閉有蟲飯温濕有蟲書巻不舒有蟲衣襞不懸有蟲蝸疽螥螻􆃃蝦有蟲或白或黒或長或短大小鴻殺不相似類皆風氣所生并連以死生不擇日若生日短促見而輒滅變復之家見其希出出又食物}
  - {type: page-break, offset: 1797, content: '', id: KR3j0080_SBCK_016-11a}
  - {type: variant, offset: 1797, length: 2, content: 世俗, WYG: 方煑馬屎以汁漬種者令禾不蟲如或以馬屎漬種其郷部吏鮑焦陳仲子也是故后稷神農之術用則其郷吏何免為姦何則蟲無從生上無以察也蟲食他草平事不怪食五穀葉乃謂之災桂有蠧桑有蝎桂中藥而桑給蠶其用亦急與穀無異蠧蝎不為怪獨謂蟲為災不通物類之實闇於災變之情也穀蟲曰蠱蠱若蛾矣粟米饐熱生蠱夫蠱食粟米不謂之災蟲食苖葉歸之於政如說蟲之家謂粟輕苖重也蟲之種類衆多非一魚肉腐臭有蟲醯醬不閉有蟲飯温濕有蟲書巻不舒有蟲衣襞不懸有蟲蝸疽螥螻􆃃蝦有蟲或白或黒或長或短大小鴻殺不相似類皆風氣所生并連以死生不擇日若生日短促見而輒滅變復之家見其希出出又食物}
