  - {type: variant, offset: 3297, length: 0, content: '', SBCK: 名驎曰有麞而角者時誠無以知也武帝使謁者終軍議之終軍曰野禽并角明下天同本也不正名驎而言野禽者終軍亦疑無以審也當今世儒之知不能過魯人與終軍其見鳳皇騏驎必從而疑之非恒之鳥獸耳何能審其鳳皇騏驎乎以體色言之未必等以鳥獸隨從多者未必善以希見言之有鸜鵒來以相竒言之聖人有竒骨體賢者亦有竒骨聖賢俱竒人無以别由賢聖言之聖鳥聖獸亦與恒鳥庸獸俱有竒怪聖人賢者亦有知而絶殊骨無異者聖賢鳥獸亦有仁善亷清體無竒者世或有冨貴不聖身有骨為富貴表不為聖賢驗然則鳥亦有五采獸有角而無仁聖者夫如是上世所見鳳皇騏驎何知其非恒鳥獸今之所見鵲麞之屬安知非鳳皇騏驎也方今聖世堯舜之主流布道化仁聖之物何為不生或時以有鳳皇騏驎亂於鵠鵲麞鹿世人不知美玉隠在石中楚王令尹不能知故有抱玉泣血之痛今或時鳳皇騏驎以仁聖之性隠於恒毛庸羽無一角五色表之世人不之知猶玉在石中也何用審之為此論草於永平之初時未有瑞其孝明宣惠衆瑞並至至元和章和之際孝章耀德}
