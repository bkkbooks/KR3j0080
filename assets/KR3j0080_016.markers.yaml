  - {type: variant, offset: 3851, length: 495, content: 有賢明之君故有貞良之臣臣賢君明之驗奈何謂之有亂難曰衛靈公無道之君時知賢臣管仲為輔何明桓公不為亂也夫靈公無道任用三臣僅以不喪非有功行也桓公尊九九之人拔甯戚於車下責苞茅不貢運兵攻楚九合諸侯一匡天下千世一出之主也而云負婦人於背虛矣說尚書者曰周公居攝帶天子之綬戴天子之冠負扆南面而朝諸侯戶牖之間曰扆南面之坐位也負扆南面鄉坐扆在後也桓公朝諸侯之時或南面坐婦人立於後也世俗傳云則曰負婦人於背矣此則夔一足宋丁公鑿井得一人之語也唐虞時夔為大夫性知音樂調聲悲善當時人曰調樂如夔一足矣世俗傳言夔一足案秩宗官缺帝舜博求眾稱伯夷伯夷稽首讓于夔龍秩宗卿官漢之宗正也斷足足非其理也且一足之人何用行也夏后孔甲田于東陽萯山天雨晦冥入于民家主人方乳或曰后來之子必貴或曰不勝之子必賤孔甲曰為余子孰能賤之遂載以歸析橑斧斬其足卒為守者孔甲之欲貴之子有餘力矣斷足無宜故為守者今夔一足無因趨步坐調音樂可也秩宗之官不宜一足猶守者斷足不可貴也孔甲不得貴之子伯夷不得讓於夔焉宋丁公者宋人也未鑿井時常有寄汲計之日去一人作自鑿井後不復寄汲計之日得一人之作故曰宋丁公鑿井得一人俗傳言曰丁公鑿井得一人於井中夫人生於人非生於土也穿土鑿井無為得人推此以, SBCK: ''}
