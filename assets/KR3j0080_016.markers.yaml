  - {type: variant, offset: 3323, length: 0, content: '', WYG: 耳何能審其鳳皇麒麟乎以體色言之未必等以鳥獸隨從多者未必善以希見言之有鸜鵒來以相竒言之聖人有竒骨體賢者亦有竒骨聖賢俱竒人無以别由賢聖言之聖鳥聖獸亦與恒鳥庸獸俱有竒怪聖人賢者亦有知而絶殊骨無異者聖賢鳥獸亦有仁善亷清體無竒者世或有富貴不聖身有骨為富貴表不為聖賢驗然則鳥亦有五采獸有角而無仁聖者夫如是上世所見鳳皇麒麟何知其非恒鳥獸今之所見鵲麞之屬安知非鳳皇麒麟也方今聖世堯舜之主流布道化仁聖之物何為不生或時以有鳳皇麒麟亂於鵠鵲麞鹿世人不知美玉隠在石中楚王令尹不能知故有抱玉泣血之痛今或時鳳皇麒麟以仁聖}
