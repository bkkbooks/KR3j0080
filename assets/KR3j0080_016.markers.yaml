  - {type: variant, offset: 119, length: 1, content: 俗, SBCK: 清廉之士百不能一居功曹之官皆有姦心私舊故可以倖苞苴賂遺小大皆有必謂虎應功曹是野中之虎常害人也夫虎出有時猶龍見有期也隂物以冬見陽蟲以夏出出應其氣氣動其類參伐以冬出心尾以夏見參伐則虎星心尾則龍象象出而物見氣至而類動天地之性也動於林澤之中遭虎搏噬之時稟性狂勃貪叨飢餓觸自來}
