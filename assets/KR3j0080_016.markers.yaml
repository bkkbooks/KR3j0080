  - {type: variant, offset: 3176, length: 2, content: 能悔, SBCK: 時來至者春秋之時騏驎嘗嫌於王孔子而至光武皇帝生於濟陽鳳皇來集夫光武始生之時成哀之際也時未太平而鳳皇至如以是為光武有聖德而來是則為聖王始生之瑞不為太平應也嘉瑞或應太平或為始生其實難知獨以太平之際驗之如何或曰鳳皇騏驎生有種類若􅀛龍有種類矣􅀛故生􅀛龍故生龍形色小大不異於前者也見之父察其子孫何為不可知夫恒物有種類瑞物無種適生故曰德應􅀛龍然也人見神􅀛靈龍而别之乎宋元王之時漁者網得神􅀛焉漁父不知其神也方今}
