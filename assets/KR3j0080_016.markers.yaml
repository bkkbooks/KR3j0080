  - {type: variant, offset: 590, length: 2, content: 門外, SBCK: 弟子識諸苛政暴吏甚於虎也夫虎害人古有之矣政不苛吏不暴德化之足以却虎然而二歳比食二人林中獸不應善也為廉不應姦吏亦不應矣或曰虎應功曹之姦所謂不苛政者非功曹也婦人廉吏之部也雖有善政安耐化虎夫魯無功曹之官功曹之官相國是也魯相者殆非孔墨必三家也為相必無賢操以不賢居權位其惡必不廉也必以相國為姦令虎食人是則魯野之虎常食人也水中之毒不及陵上陵上之氣不入水中各以所近罹殃取禍是故漁者不死於山獵者不溺於淵好入山林竆幽測深涉虎窟寢虎搏噬之}
