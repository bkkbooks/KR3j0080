  - {type: variant, offset: 2512, length: 261, content: 大江浩洋曲江有濤竟以隘狹也吳殺其身為濤廣陵子胥之神竟無知也溪谷之深流者安洋淺多沙石激揚為瀨夫濤瀨一也謂子胥為濤誰居溪谷為瀨者乎案濤入三江江岸沸踊中央無聲必以子胥為濤子胥之身聚岸涯也濤之起也隨月盛衰小大滿損不齊同如子胥為濤子胥之怒以月為節也三江時風揚侯之波亦溺殺人子胥之神復為風也秦始皇渡湘水遭風問湘山何祠左右對曰堯之女舜之妻也始皇大怒使刑徒三千人斬湘山之樹而履之夫謂子胥之神為濤猶謂二女之精為風也傳書言孔子當泗水而葬泗水為之卻流此言孔子之德能使水卻不湍其墓也世人信之是故儒者稱論皆言孔子之後當封以泗水卻流為證如原省之殆虛言, SBCK: 古今則鳳麟可得審}
