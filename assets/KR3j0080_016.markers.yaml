  - {type: variant, offset: 198, length: 350, content: 吾當夏五月披裘而薪豈取金者哉季子謝之請問姓字薪者曰子皮相之士也何足語姓名遂去不顧世以為然殆虛言也夫季子恥吳之亂吳欲共立以為主終不肯受去之延陵終身不還廉讓之行終始若一許由讓天下不嫌貪封侯伯夷委國饑死不嫌貪刀鉤廉讓之行大可以況小小難以況大季子能讓吳位何嫌貪地遺金季子使於上國道過徐徐君好其寶劍未之即予還而徐君死解劍帶冢樹而去廉讓之心恥負其前志也季子不負死者棄其寶劍何嫌一叱生人取金於地季子未去吳乎公子也已去吳乎延陵君也公子與君出有前後車有附從不能空行於塗明矣既不恥取金何難使左右而煩披裘者世稱柳下惠之行言其能以幽冥自脩潔也賢者同操故千歲交志置季子於冥昧之處尚不取金況以白日前後備具取金於路非季子之操也或時季子實見遺金憐披裘薪者欲以益之或時言取彼地金欲以予薪者不自取也世俗傳言則言季子取遺金也傳書或言顏淵與, SBCK: ''}
