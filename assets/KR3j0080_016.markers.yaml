  - {type: variant, offset: 1801, length: 12, content: 為舜禹田海陵麋田若象耕狀, SBCK: 之災災出當有所罪則依所似類之吏順而說之人腹中有三蟲下地之澤其蟲曰蛭蛭食人足三蟲食膓順說之家將謂三蟲}
  - {type: variant, offset: 1801, length: 0, content: '', WYG: 之災災出當有所罪則依所似類之吏順而說之人腹中有三蟲下地之澤其蟲曰蛭蛭食人足三蟲食膓順說之家將謂三蟲何似類乎凡天地之間陰陽所生蛟蟯之類蜫蠕之屬含氣而生開口而食食有甘不同心等欲彊大食細弱知慧反頓愚他物小大連相齧噬不謂之災獨謂蟲食穀物}
