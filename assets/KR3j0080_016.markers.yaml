  - {type: variant, offset: 104, length: 3, content: 語多欲, SBCK: 座弟子知有若非孔子也猶共坐而尊事之雲雨之知使若諸弟子之知雖知土龍非真然猶感動思類而至十四也有若孔子弟子疑其體象則謂相似孝武皇帝幸李夫人夫人死思見其形道士以術為李夫人夫人步入殿門武帝望見知其非也然猶感動喜樂近之使雲雨之氣如武帝之心雖知土龍非真然猶愛好感起而來十五也既效驗有十五又亦有義四焉}
