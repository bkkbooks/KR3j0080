  - {type: variant, offset: 58, length: 2, content: 幽冥, SBCK: 丹木非真魚也魚含血而有知猶為象至雲雨之知不能過魚見土龍之象何能疑之十一也此尚魚也知不如人匈奴敬畏郅都之威刻木象都之狀交弓射之莫能一中不知都之精神在形象邪亡也將匈奴敬鬼精神在木也如都之精神在形象天龍之神亦在土龍如匈奴精在於木人則雩祭者之精亦在土龍十二也金翁叔休屠王之太子也與父俱來降漢父道死與母俱來拜為騎都尉母死武帝圖其母於甘泉殿上署曰休屠王焉提翁叔從上上甘泉拜謁起立向之泣涕沾襟久乃去夫圖畫非母}
