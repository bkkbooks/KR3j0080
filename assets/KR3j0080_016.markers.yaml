  - {type: variant, offset: 13, length: 2, content: 竹帛, SBCK: 陽燧當與刀劒偃月鉤為比二也齊孟常君夜出秦闗闗未開客為鷄鳴而真鷄鳴和之夫雞可以姦聲感則雨亦可以偽象致三也李子長為政欲知囚情以梧桐為人象囚之形鑿地為埳以盧為槨臥木囚其中囚罪正則木囚不動囚寃侵奪木囚動出不知囚之精神着木人乎將精神之氣動木囚也夫精神感動木囚何為獨不應從土龍四也舜以聖德入大麓之野虎狼不犯蟲蛇不害禹鑄金鼎象百物以入山林亦辟凶殃論者以為非實然而}
