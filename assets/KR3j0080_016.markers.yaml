  - {type: variant, offset: 1802, length: 426, content: 舜禹田海陵麋田若象耕狀何嘗帝王葬海陵者邪傳書言吳王夫差殺伍子胥煮之於鑊乃以鴟夷橐投之於江子胥恚恨驅水為濤以溺殺人今時會稽丹徒大江錢唐浙江皆立子胥之廟蓋欲慰其恨心止其猛濤也夫言吳王殺子胥投之於江實也言其恨恚驅水為濤者虛也屈原懷恨自投湘江湘江不為濤申徒狄蹈河而死河水不為濤世人必曰屈原申徒狄不能勇猛力怒不如子胥夫衛葅子路而漢烹彭越子胥勇猛不過子路彭越然二士不能發怒於鼎鑊之中以烹湯葅汁瀋漎旁人子胥亦然自先入鼎鑊後乃入江在鑊中之時其神安居豈怯於鑊湯而勇於江水哉何其怒氣前後不相副也且投於江中何江也有丹徒大江有錢唐浙江有吳通陵江或言投於丹徒大江無濤欲言投於錢唐浙江浙江山陰江上虞江皆有濤三江有濤豈分橐中之體散置三江中乎人若恨恚也仇讎未死子孫遺在可也今吳國已滅夫差無類吳為會稽立置太守子胥之神復何怨苦為濤不止欲何求索吳越在時分會稽郡越治山陰吳都今吳餘暨以南屬越錢唐以北屬吳錢唐之江兩國界也山陰上虞在越界中子胥入吳之江為濤當自止吳界中何為入越之地怨恚吳王發怒越江違, WYG: 應政事}
