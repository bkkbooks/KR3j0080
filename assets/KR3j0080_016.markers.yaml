  - {type: variant, offset: 2258, length: 0, content: '', SBCK: 也必依温濕温濕之氣常在春夏秋冬之氣寒而乾燥蟲未曾生若以蟲生罪郷部吏是則郷部吏貪於春夏廉於秋冬雖盜跖之吏以秋冬署􅀩伯夷之舉矣夫春夏非一而蟲時生者温濕甚也甚則隂陽}
