  - {type: variant, offset: 115, length: 0, content: '', SBCK: 主以木為之長尺二寸以象先祖孝子入廟主心事之雖知木主非親亦當盡敬有所主事土龍與木主同雖知非真示當感動立意於象二也塗車芻靈聖人知其無用示象生存不敢無也夫設土龍知其不能動雨也示若塗車芻靈而有致三也天子射熊諸侯射麋卿大夫射虎豹士射鹿豕示服猛也名布為侯示射無道諸侯也夫畫布為熊麋之象名布為侯禮貴意象示義取名也土龍亦夫熊麋布侯之類四也夫以象類有十五驗以禮示意有四義仲舒覽見深鴻立事不妄設土龍之象果有狀也龍蹔出水雲雨乃至古者畜龍御龍常存無雲雨猶舊交相闊遠卒然相見歡欣歌笑或至悲泣涕偃伏少久則示行各恍忽矣易曰雲從龍非言龍從雲也雲樽刻雷雲之象龍安肯來夫如是傳之者何可解則桓君山之難可說也則劉子駿不能對劣也劣則董仲舒之龍說不終也}
  - {type: page-break, offset: 115, content: '', id: KR3j0080_SBCK_016-5b}
