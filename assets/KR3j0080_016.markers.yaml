  - {type: variant, offset: 3299, length: 0, content: '', SBCK: 和洽嘉瑞竒物同時俱應鳳皇騏驎連出重見盛於五帝之時此篇巳成故不得載或問曰講瑞謂鳳皇騏驎難知世瑞不能别今孝章之所致鳳皇騏驎不可得知乎曰五鳥之記四方中央皆有大鳥其出衆鳥皆從小大毛也類鳳皇實難知也故夫世瑞不能别别之如何以政治時王之德不及唐虞之時其鳳皇騏驎目不親見然而唐虞之瑞必真是者堯之徳明也孝宣比堯舜天下太平萬里慕化仁}
