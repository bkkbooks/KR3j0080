  - {type: variant, offset: 1694, length: 0, content: '', WYG: 累害篇凡人仕宦有稽留不進行節有毁傷不全罪過有累積不除聲名有闇昧不明才非下行非悖也又知非昬策非昧也逢遭外禍累害之也非唯人行凡物皆然生動之類咸被累害累害自外不由其内夫不本累害所從生起而徒歸責於被累害者智不明闇塞於理者也物以春生人保之以秋成人必不能保之卒然牛馬踐根刀鎌割莖生者不育至秋不成不成之類遇害不遂不得生也夫鼠涉飯中捐而不食捐飯之味與彼不汚者鈞以鼠為害棄而不御君子之累害與彼不育之物不御之飯同一實也俱由外來故為累害脩身正行不能來福戰栗戒慎不能避禍禍福之至幸不幸也故曰得非己力故謂之福來不由我故謂之禍不由我者謂之何由由鄉里與朝廷也夫鄉里有三累朝廷有三害累生於鄉里害發於朝廷古今才洪行淑之人遇此多矣何謂三累三害凡人操行不能慎擇友友同心恩篤異心疎薄疎薄怨恨毁傷其行一累也人才髙下不能鈞同同時並進髙者得榮下者慙恚毁傷其行二累也人之交遊不能常歡歡則相親忿則疎逺疎逺怨恨毁傷其行三累也位少人衆仕者爭進進者争位見將相毁増加傅致將昧不明然納其言一害也將吏異好清濁殊操清吏増郁郁之白舉涓涓之言濁吏懐恚恨徐求其過因纎微之謗被以罪罰二害也將或幸佐吏之身納信其言佐吏非清節必拔人越次迕失其意毁之過度清正之仕抗行伸志遂為所憎毁傷於將三害也夫未進也身被三累已用也身蒙三害雖孔丘墨翟不能自免顔回曽參不能全身也動百行作萬事嫉妬之人隨而雲起枳棘鈎掛容體蠭䘍之黨啄螫懐操豈徒六哉六者章章世曽不見夫不原士之操行有三累仕宦有三害身完全者謂之潔被毁謗者謂之辱官升進者謂之善位廢退者謂之惡完全升進幸也而稱之毁謗廢退不遇也而訾之用心若此必為三累三害也論者既不知累害者行賢潔也以塗傅泥以黒㸃繒孰有知之清受塵白取垢青蠅所汙常在練素處顛者危勢豐者虧頺墜之類常在懸垂屈平潔白邑犬羣吠吠所怪也非俊疑傑固庸態也偉士坐以俊傑之才坐讀為生招致羣犬之聲夫如是豈宜更勉奴下循不肖哉不肖奴下非所勉也豈宜更偶俗全身以弭謗哉偶俗全身則鄉原也鄉原之人行全無闕非之無舉刺之無刺也此又孔子之所罪孟軻之所愆也古賢美極無以衞身故循性行以俟累害者果賢潔之人也極累害之謗而賢潔之實見焉立賢潔之跡毁謗之塵安得不生絃者思折伯牙之指御者願摧王良之手何則欲專良善之名惡彼之勝己也是故魏女色艶鄭袖劓之朝呉忠貞無忌逐之戚施彌妬蘧除多佞是故濕堂不灑塵卑屋不蔽風風衝之物不得育水湍之岸不得峭如是羑里陳蔡可得知而沈江蹈河也以軼才取容媚於俗求全功名於將不遭鄧析之禍取子胥之誅幸矣孟賁之尸人不刃者氣絶也死灰百斛人不沃者光滅也動身章智顯光氣於世奮志敖黨立卓異於俗固常通人所讒嫉也以方心偶俗之累求益反損盖孔子所以憂心孟軻所以惆悵也徳鴻者招謗為士者多口以休熾之聲彌口舌之患求無危傾之害逺矣臧倉之毁未嘗絶也公伯寮之愬未嘗滅也垤成丘山汙為江河毫髪之善小人不得有也以玷汚言之清受塵而白取垢以毁謗言之貞良見妬髙竒見噪以遇罪言之忠言招患髙行招恥以不純言之玉有瑕而珠有毁焦陳留君兄名稱兗州行完跡潔無纎芥之毁及其當為從事刺史焦康絀而不用夫未進也被三累已用也蒙三害雖孔丘墨翟不能自免顔回曽參不能全身也何則衆好純譽之人非真賢也公侯已下玉石雜糅賢士之行善惡相苞夫采玉者破石拔玉選士者棄惡取善夫如是累害之人負世以行指擊之者從何往哉命禄篇凡人遇偶及遭累害皆由命也有死生壽夭之命亦有貴賤貧富之命自王公逮庶人聖賢及下愚凡有首目之類含血之屬莫不有命命當貧賤雖富貴之猶涉禍患矣命當富貴雖貧賤之猶逢福善矣故命貴從賤地自達命賤從富位自危故夫富貴若有神助貧賤若有鬼禍命貴之人俱學獨達並仕獨遷命富之人俱求獨得並為獨成貧賤反此難達難遷難成獲過受罪疾病亡遺失其富貴貧賤矣是故才髙行厚未必保其必富貴智寡徳薄未可信其必貧賤或時才髙行厚命惡廢而不進知寡徳薄命善興而超踰故夫臨事知愚操行清濁性與才也仕宦貴賤治産貧富命與時也命則不可勉時則不可力知者歸之於天故坦蕩恬忽雖其貧賤使富貴若鑿溝伐薪加勉力之趨致彊健之勢鑿不休則溝深斧不止則薪多無命之人皆得所願安得貧賤凶危之患哉然則或時溝未通而遇湛薪未多而遇虎仕宦不貴治産不富鑿溝遇湛伐薪逢虎之類也有才不得施有智不得行或施而功不立或行而事不成雖才智如孔子猶無成立之功世俗見人節行髙則曰賢哲如此何不貴見人謀慮深則曰辯慧如此何不富貴富有命福禄不在賢哲與辯慧故曰富不可以籌筴得貴不可以才能成智慮深而無財才能髙而無官懐銀䊸紫未必稷契之才積金累玉未必陶朱之智或時下愚而千金頑魯而典城故官御同才其貴殊命治生鈞知其富異禄禄命有貧富知不能豐殺性命有貴賤才不能進退成王之才不如周公桓公之知不若管仲然成桓受尊命而周管禀卑秩也案古人君希有不學於人臣知博希有不為父師然而人君猶以無能處主位人臣猶以鴻才為厮役故貴賤在命不在智愚貧富在禄不在頑慧世之論事者以才髙當為將相能下者宜為農商見智能之士官位不至怪而訾之曰是必毁於行操行操之士亦怪毁之曰是必乏於才知殊不知才知行操雖髙官位富禄有命才智之人以吉盛時舉事而福至人謂才智明審凶衰禍來謂愚闇不知吉凶之命盛衰之禄也白圭子貢轉貨致富積累金玉人謂術善學明主父偃辱賤於齊排擯不用赴闕舉疏遂用於漢官至齊相趙人徐樂亦上書與偃章㑹上善其言徵拜為郎人謂偃之才樂之慧非也儒者明説一經習之京師明如匡穉圭深如趙子都初階甲乙之科遷轉至郎博士人謂經明才髙所得非也而説若范雎之于秦昭封為應侯蔡澤之説范雎拜為客卿人謂雎澤美善所致非也皆命禄貴富善至之時也孔子曰死生有命富貴在天魯平公欲見孟子嬖人臧倉毁孟子而止孟子曰天也孔子聖人孟子賢者誨人安道不失是非稱言命者有命審也淮南書曰仁鄙在時不在行利害在命不在智賈生曰天不可與期道不可與謀遲速有命焉識其時髙祖擊黥布為流矢所中疾甚吕后迎良醫醫曰可治髙祖罵之曰吾以布衣提三尺劍取天下此非天命乎命乃在天雖扁鵲何益韓信與帝論兵謂髙祖曰陛下所謂天授非智力所得揚子雲曰遇不遇命也太史公曰富貴不違貧賤貧賤不違富貴是謂從富貴為貧賤從貧賤為富貴也夫富貴不欲為貧賤貧賤自至貧賤不求為富貴富貴自得也春夏囚死秋冬王相非能為之也日朝出而暮入非求之也天道自然代王自代入為文帝周亞夫以庶子為條侯此時代王非太子亞夫非適嗣逢時遇㑹卓然卒至命貧以力勤致富富至而死命賤以才能取貴貴至而免才力而致富貴命禄不能奉持猶器之盈量手之持重也器受一升以一升則平受之如過一升則滿溢也手舉一鈞以一鈞則平舉之過一鈞則躓仆矣前世明是非歸之於命也命審然也信命者則可幽居俟時不須勞精苦形求索之也猶珠玉之在山澤天命難知人不耐審雖有厚命猶不自信故必求之也如自知雖逃富避貴終不得離故曰力勝貧慎勝禍勉力勤事以致富砥才明操以取貴廢時失務欲望富貴不可得也雖云有命當須索之如信命不求謂當自至可不假而自得不作而自成不行而自至夫命富之人筋力自彊命貴之人才智自髙若千里之馬頭目蹄足自相副也有求而不得者矣未必不求而得之者也精學不求貴貴自至矣力作不求富富自到矣富貴之福不可求致貧賤之禍不可茍除也由此言之有富貴之命不求自得信命者曰自知吉不待求也天命吉厚不求自得天命凶厚求之無益夫物不求而自生則人亦有不求貴而貴者矣人情有不教而自善者有教而終不善者矣天性猶命也越王翳逃山中至誠不願自冀得代越人燻其穴遂不得免彊立為君而天命當然雖逃避之終不得離故夫不求自得之貴歟氣夀篇凡人禀命有二品一曰所當觸值之命二曰彊弱夀夭之命所當觸值謂兵燒壓溺也彊夀弱夭謂禀氣渥薄也兵燒壓溺遭以所禀為命未必有審期也若夫彊弱夭夀以百為數不至百者氣自不足也夫禀氣渥則其體彊體彊則其命長氣薄則其體弱體弱則命短命短則多病夀短始生而死未産而傷稟之薄弱也渥彊之人不卒其夀若夫無所遭遇虛居困劣短氣而死此禀之薄用之竭也此與始生而死未産而傷一命也皆由稟氣不足不自致於百也人之禀氣或充實而堅强或虛劣而軟弱充實堅强其年夀虛劣軟弱失棄其身天地生物物有不遂父母生子子有不就物有為實枯死而墮人有為兒夭命而傷使實不枯亦至滿嵗使兒不傷亦至百年然為實兒而死枯者禀氣薄則雖形體完其虛劣氣少不能充也兒生號啼之聲鴻朗髙暢者夀嘶喝濕下者夭何則禀夀夭之命以氣多少為主性也婦人疏字者子活數乳者子死何則疏而氣渥子堅彊數而氣薄子軟弱也懐子而前已産子死則謂所懐不活名之曰懐其意以為已産之子死故感傷之子失其性矣所産子死所懐子凶者字乳亟數氣薄不能成也雖成人形體則易感傷獨先疾病病獨不治百嵗之命是其正也不能滿百者雖非正猶為命也譬猶人形一丈正形也名男子為丈夫尊公嫗為丈人不滿丈者失其正也雖失其正猶乃為形也夫形不可以不滿丈之故謂之非形猶命不可以不滿百之故謂之非命也非天有長短之命而人各有禀受也由此言之人受氣命於天卒與不卒同也語曰圖王不成其弊可以霸霸者王之弊也霸本當至於王猶夀當至於百也不能成王退而為霸不能至百消而為夭王霸同一業優劣異名夀夭或一氣長短殊數何以知不滿百為夭者百嵗之命也以其形體小大長短同一等也百嵗之身五十之體無以異也身體不異血氣不殊鳥獸與人異形故其年壽與人殊數何以明人年以百為壽也世間有矣儒者説曰太平之時人民侗長百嵗左右氣和之所生也堯典曰朕在位七十載求禪得舜舜徵三十嵗在位堯退而老八嵗而終至殂落九十八嵗未在位之時必已成人今計數百有餘矣又曰舜生三十徵庸三十在位五十載陟方乃死過百嵗矣文王謂武王曰我百爾九十吾與爾三焉文王九十七而薨武王九十三而崩周公武王之弟也兄弟相差不過十年武王崩周公居攝七年復政退老出入百嵗矣邵公周公之兄也至康王之時尚為太保出入百有餘嵗矣聖人禀和氣故年命得正數氣和為治平故太平之世多長壽人百嵗之壽盖人年之正數也猶物至秋而死物命之正期也物先秋後秋則亦如人死或増百嵗或減百也先秋後秋為期増百減百為數物或出地而死猶人始生而夭也物或踰秋不死亦如人年多度百至於三百也傳稱老子二百餘嵗邵公百八十髙宗享國百年周穆王享國百年并未享國之時皆出百三十四十嵗矣論衡卷一}
