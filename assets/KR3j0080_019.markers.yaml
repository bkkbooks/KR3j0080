  - {type: variant, offset: 5215, length: 0, content: '', krp: 黃帝有涿鹿之戰堯有丹水之師舜時有苗不服夏啓有扈叛逆髙宗伐鬼方三年剋之周成王管蔡悖亂周公東征前代皆然漢不聞此高祖之時陳狶反彭越叛治始安也孝景之時呉楚興兵怨鼂錯也匈奴時擾正朔不及天荒之地王功不加兵今皆内附貢獻牛馬此則漢之威盛莫敢犯也紂爲至惡天下叛之武王舉兵皆願就戰八百諸侯不期俱至項羽惡微號而用兵與高祖俱起威力輕重未有所定則項羽力勁折鐡難於摧木高祖誅項羽折鐡武王伐紂摧木然則漢力勝周多矣凡克敵一則易二則難湯武伐桀紂一敵也高祖誅秦殺項兼勝二家力倍湯武武王爲殷西伯臣事於紂以臣伐周夷齊耻之扣馬而諫武王不聽不食周粟餓死首陽高祖不爲秦臣光武不仕王莽誅惡伐無道伯無夷之譏可謂順於周矣丘山易以起高淵洿易以爲深起於微賤無所因階者難襲爵乘位尊祖統業者易堯以唐侯入嗣帝位舜以司徒因堯授襌禹以司空緣功代舜湯由七十里文王百里武王爲西伯襲文王位三郊五代之起皆有因緣力易爲也高祖從亭長提三尺劒取天下光武由白水奮威武海内無尺土所因一位所乘直奉天命推自然此則起高於淵洿爲深於丘山也比方五代孰者爲優傳書或稱武王伐紂太公隂謀食小兒以丹令身純赤長大教言殷亡殷民見兒身赤以爲天神及言殷亡皆謂商滅兵至牧野晨舉脂燭姦謀惑民權掩不備周之所諱也世謂之虚漢取天下無此虚言武成之篇言周伐紂血流浮杵以武成言之食兒以丹晨舉脂燭殆且然矣漢伐亡新光武將五千人王莽遣二公將三萬人戰于昆陽雷雨晦冥前後不相見漢兵出昆陽城擊二公軍一而當十二公兵散天下以雷雨助漢威敵孰與舉脂燭以人事譎取殷哉或云武王伐紂紂赴火死武王就斬以鉞懸其首於大白之旌齊宣王憐釁鍾之牛睹其色之觳觫也楚莊王赦鄭伯之罪見其肉袒而形暴也君子惡不惡其身紂屍赴於火中所見悽愴非徒色之觳觫袒之暴形也就斬以鉞懸乎其首何其忍哉高祖入咸陽閻樂誅二世項羽殺子嬰高祖雍容入秦不戮二屍光武入長安劉聖公巳誅王莽乗兵即害不刃王莽之死}
  - {type: variant, offset: 5216, length: 1, content: 蝗, SBCK: 斬赴火之首與貰被刃者之身德虐孰大也豈以羑里之恨哉以人君拘人臣其逆孰與秦奪周國莽酖平帝也鄒伯奇論桀紂之惡不若亡秦亡秦不若王莽然則紂惡微而周誅之痛秦莽罪重而漢伐之輕寛狹誰也高祖母姙之時蛟龍在上夢與神遇好酒貫飲酒舍負讎及醉留臥其上常有神怪夜行斬虵虵嫗悲哭與吕后俱之田廬時自隱匿光氣暢見吕后輙知始皇望見東南有天子氣及起五星聚於東井楚望漢軍雲氣五色光武且生鳯皇集於城嘉禾滋於屋皇妣之身夜半無燭空中光明初者蘇伯阿望舂陵氣鬱鬱葱葱光武起過舊廬見氣憧憧上屬於天五帝三王初生始起不聞此怪堯母感於赤龍及起不聞奇祐禹母吞薏苡將生得􅀇圭契母咽鷰子湯起白狼銜鉤后稷母履大人之跡文王起得赤雀武王得魚烏皆不及漢太平之瑞黄帝堯舜鳯皇一至凡諸衆瑞重至者希漢文帝黄龍玉棓武帝黄龍麒麟連木宣帝鳯皇五至麒麟神雀甘露醴泉黄龍神光平帝白雉黒雉孝明麒麟神雀甘露醴泉白雉黒雉芝草連木嘉禾與宣帝同竒有神鼎黃金之怪一代之瑞累仍不絶此則漢德豐茂故瑞祐多也孝明天崩今上嗣位元二之間嘉德布流三年零陵生芝草五本四年甘露降五縣五年芝復生六年黃龍見大小凡八前世龍見不􅀟芝生無二甘露一降而今八龍並出十一芝累生甘露流五縣德惠盛熾故瑞繁夥也自古帝王孰能致斯儒者論曰王者推行道德受命於天論衡初秉以爲王者生禀天命性命難審且兩論之酒食之賜一則爲薄再則爲厚如儒者之言五代皆一受命唯漢獨再此則天命於漢厚也如審論衡之言生禀自然此亦漢家所禀厚也絶而復屬死而復生世有死而復生之人人必謂之神漢統絶而復屬光武存亡可謂優矣武王伐紂庸蜀之夷佐戰牧野成王之時越常獻雉倭人貢暢幽厲衰微戎狄攻周平王東走以避其難至漢四夷朝貢孝平元始元年越常重譯獻白雉一黑雉二夫以成王之賢輔以周公越常獻一平帝得三後至四年金城塞外羗良橋橋種良願等獻其魚鹽之地願内屬漢遂得西王母石室因爲西海郡周時戎狄攻王至漢内屬獻其寶地西王母國在絶極之外而漢屬之德孰大壤孰廣方今哀牢鄯善諾降附歸德匈奴時擾遣將攘討獲虜生口千萬數夏禹倮入吳國太伯採藥斷髪文身唐虞國界吳爲荒服越在九夷􅄢衣關頭今皆夏服褒衣履舄巴蜀越嶲鬱林日南遼東樂浪周時被髪椎髻今戴皮弁周時重譯今吟詩書春秋之義君親無將將而必誅廣陵王荆迷於㜸巫楚王英惑於狹客事情列見孝明三宥二王吞藥周誅管蔡違斯逺矣楚外家許氏與楚王謀議孝明曰許民有屬於王欲王尊貴人情也聖心原之不繩於法隱彊侯傳懸書市里誹謗聖政今上海思犯奪爵土惡其人者憎其胥餘二立王之子安楚廣陵彊弟員嗣祀隂氏二王帝族也位爲王侯與管蔡同管蔡滅嗣二王立後恩巳褒矣隱彊異姓也尊重父祖復存其祀立武庚之義繼禄父之恩方斯羸矣何則並爲帝王舉兵相征貪天下之大絶成湯之統非聖君之義失承天之意也隱彊臣子也漢統自在絶滅隂氏無損於義而猶存之惠滂沛也故夫雨露之施内則注於骨肉外則布於他族唐之晏晏舜之烝烝豈能踰此驩兜之行靖言庸囘共工私之稱薦於堯三苗巧佞之人或言有罪之國鯀不能治水知力極盡罪皆在身不加於上唐虞放流死於不毛怨惡謀上懷挾叛逆考事失實誤國殺將罪惡重於四子孝明加恩則論徙邊今上寛惠還歸州里開闢以來恩莫斯大晏子曰鉤星在房心之間地其動乎夫地動天時非政所致皇帝振畏猶歸於治廣徵賢良訪求過闕高宗之側身周成之開匱勵能逮此榖登歲平庸主因緣以建德政顚沛危殆聖哲優者乃立功化是故微病􅁪醫皆巧篤劇扁鵲乃良建初孟年無妄氣至歲之疾疫也比旱不雨牛死民流可謂劇矣皇帝敦徳俊乂在官第五司空股肱國維轉糓振贍民不乏餓天下慕德雖危不亂民饑於榖飽於道德身流在道心囘鄉内以故道路無盜賊之跡深幽逈絶無刼奪之姦以危爲寧以困爲通五帝三王孰能堪斯哉驗符篇永平十一年廬江皖侯國民際有湖皖民小男曰陳爵陳挺年皆十歲以上相與釣於湖涯挺先釣爵後徃爵問挺曰釣寧得乎挺曰得爵即歸取竿綸去挺四十步所見湖涯有酒罇色正黄没水中爵以爲銅也渉水取之滑重不能舉挺望見號曰何取爵曰是有銅不能舉也挺徃助之涉水未持罇頓衍更爲盟盤動行入深淵中復不見挺爵留顧見如錢等正黄數百千枝即共掇摝各得滿手走歸示其家爵父國故免吏字君賢驚曰安所得此爵言其狀君賢曰此黄金也即馳與爵俱徃到金處水中尚多賢自渉水掇取爵挺鄰伍並聞俱競採之合得十餘斤賢自言於相相言太守太守遣吏収取遣門下掾程躬奉獻具言得金狀詔書曰如章則可不如章有正法躬奉詔書歸示太守太守以下思省詔書以爲疑隱言之不實茍飾美也即復因却上得黄金實狀如前章事寢十二年賢等上書曰賢等得金湖水中郡牧獻訖今不得直詔書下廬江上不畀賢等金直狀郡上賢等所採金自官湖水非賢等私瀆故不與直十二年詔書曰視時金價畀賢等金直漢瑞非一金出奇怪故獨紀之金玉神寶故出詭異金物色先爲酒罇後爲盟盤動行入淵豈不怪哉夏之方盛遠方圖物貢金九牧禹謂之瑞鑄以爲鼎周之九鼎逺方之金也人來貢之自出於淵者其實一也皆起盛德爲聖王瑞金玉之世故有金玉之應文帝之時玉稖見金之與玉瑞之最也金聲玉色人之奇也永昌郡中亦有金焉纎靡大如黍粟在水涯沙中民採得日重五銖之金一色正黄土生金土色黄漢土德也故金化出金有三品黄比見者黄爲瑞也圯橋老父遺張良書化爲黄石黄石之精出爲符也夫石金之類也質異色鈞皆土瑞也建初三年零陵泉陵女子傅寧宅土中忽生芝草五本長者尺四五寸短者七八寸莖葉紫色蓋紫芝也太守沈酆遣門下掾衍盛奉獻皇帝恱懌賜錢衣食詔㑹公卿郡國上計吏民皆在以芝告示天下天下並聞吏民歡喜咸知漢德豐雍瑞應出也四年甘露下泉陵零陵洮陽始安冷道五縣榆栢梅李葉皆洽溥威委流漉民􅎳吮之甘如飴蜜五年芝草復生泉陵男子周服宅上六本色狀如三年芝并前凡十一本湘水去泉陵城七里水上聚石曰燕室丘臨水有俠山其下巖淦水深不測二黄龍見長出十六丈身大於馬舉頭顧望狀如圖中畫龍燕室丘民皆觀見之去龍可數十步又見狀如駒馬小大凡六出水遨戯陵上蓋二龍之子也并二龍爲八出移一時乃入宣帝時鳯皇下彭城彭城以聞宣帝詔侍中宋翁一翁一曰鳯皇當下京師集於天子之郊乃遠下彭城不可收與無下等宣帝曰方今天下合爲一家下彭城與京師等耳何令可與無下等乎令左右通經者語難翁一翁一竆免冠叩頭謝宣帝之時與今無異鳯皇}
