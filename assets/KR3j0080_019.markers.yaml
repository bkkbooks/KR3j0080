  - {type: variant, offset: 602, length: 589, content: 瞋目以旄麾雨而止之乎武王不能止雨則亦不能止風或時武王適麾之風偶自止世褒武王之德則謂武王能止風矣傳書言魯陽公與韓戰戰酣日暮公援戈而麾之日為之反三舍此言虛也凡人能以精誠感動天者專心一意委務積神精通于天天為變動然尚未可謂然魯陽公志在於戰為日暮一麾安能令日反使聖人麾日日終不反魯陽公何人而使日反乎鴻範曰星有好風星有好雨日月之行則有冬有夏月之從星則有風雨夫星與日月同精日月不從星星輒復變明日月行有常度不得從星之好惡也安得從魯陽公之所欲星之在天也為日月舍猶地有郵亭為長吏廨也二十八舍有分度一舍十度或增或減言日反三舍乃三十度也日日行一度一麾之間反三十日時所在度也如謂舍為度三度亦三日行也一麾之間令日卻三日也宋景公推誠出三善言熒惑徙三舍實論者猶謂之虛魯陽公爭鬭惡日之暮以此一戈麾無誠心善言日為之反殆非其實哉且日火也聖人麾火終不能卻魯陽公麾日安能使反或時戰時日正卯戰迷謂日之暮麾之轉左曲道日若卻世好神怪因謂之反不道所謂也傳書言荊軻為燕太子謀刺秦王白虹貫日衛先生為秦畫長平之事太白蝕昴此言精誠感天天為變動也夫言白虹貫日太白蝕昴實也言荊軻之謀衛先生之畫感動皇天故白虹貫日太白蝕昴者虛也夫以筯撞鍾以筭擊鼓不能鳴者所用撞擊之者小也今人之形不過七尺以七尺形中精神欲有所為雖積銳意猶筯撞鍾筭擊鼓也安能動天精非不誠所用動者小也且所欲害者人也人不動天反動乎問曰人之害氣能相動乎曰不能豫讓欲害趙襄子襄子心動貫高欲篡, SBCK: 至}
