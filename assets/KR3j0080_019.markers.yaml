  - {type: variant, offset: 3298, length: 1912, content: 人從層臺下叩頭求請臺上之物臺上之人聞其言則憐而與之如不聞其言雖至誠區區終無得也夫天去人非徒層臺之高也湯雖自責天安能聞知而與之雨乎夫旱火變也湛水異也堯遭洪水可謂湛矣堯不自責以身禱祈必舜禹治之知水變必須治也除湛不以禱祈除旱亦宜如之由此言之湯之禱祈不能得雨或時旱久時當自雨湯以旱久亦適自責世人見雨之下隨湯自責而至則謂湯以禱祈得雨矣傳書言倉頡作書天雨粟鬼夜哭此言文章興而亂漸見故其妖變致天雨粟鬼夜哭也夫言天雨粟鬼夜哭實也言其應倉頡作書虛也夫河出圖洛出書聖帝明王之瑞應也圖書文章與倉頡所作書何以異天地為圖書倉頡作文字業與天地同指與鬼神合何非何惡而致雨粟神哭之怪哉使天地鬼神惡人有書則其出圖書非也天不惡人有書作書何非而致此怪或時倉頡適作書天適雨粟鬼偶夜哭而雨粟鬼神哭自有所為世見應書而至則謂作書生亂敗之象應事而動也天雨穀論者謂之從天而下應變而生如以雲雨論之雨穀之變不足怪也何以驗之夫雲雨出於丘山降散則為雨矣人見其從上而墜則謂之天雨水也夏日則雨水冬日天寒則雨凝而為雪皆由雲氣發於丘山不從天上降集於地明矣夫穀之雨猶復雲布之亦從地起因與疾風俱飄參於天集於地人見其從天落也則謂之天雨穀建武三十一年中陳留雨穀穀下蔽地案視穀形若茨而黑有似於稗實也此或時夷狄之地生出此穀夷狄不粒食此穀生於草野之中成熟垂委於地遭疾風暴起吹揚與之俱飛風衰穀集墜於中國中國見之謂之天雨穀何以效之野火燔山澤山澤之中草木皆燒其葉為灰疾風暴起吹揚之參天而飛風衰葉下集於道路夫天雨穀者草木葉燒飛而集之類也而世以為雨穀作傳書者以為變怪天主施氣地主產物有葉實可啄食者皆地所生非天所為也今穀非氣所生須土以成雖云怪變怪變因類生地之物更從天集生天之物可從地出乎地之有萬物猶天之有列星也星不更生於地穀何獨生於天乎傳書又言伯益作井龍登玄雲神棲崑崙言龍井有害故龍神為變也夫言龍登玄雲實也言神棲崑崙又言為作井之故龍登神去虛也夫作井而飲耕田而食同一實也伯益作井致有變動始為耕耘者何故無變神農之橈木為耒教民耕耨民始食穀穀始播種耕土以為田鑿地以為井井出水以救渴田出穀以拯饑天地鬼神所欲為也龍何故登玄雲神何故棲崑崙夫龍之登玄雲古今有之非始益作井而乃登也方今盛夏雷雨時至龍多登雲雲雨與龍相應龍乘雲雨而行物類相致非有為也堯時天下大和百姓無事有五十之民擊壤於塗觀者曰大哉堯之德也擊壤者曰吾日出而作日入而息鑿井而飲耕田而食堯何等力堯時已有井矣唐虞之時豢龍御龍龍常在朝夏末政衰龍乃隱伏非益鑿井龍登雲也所謂神者何神也百神皆是百神何故惡人為井使神與人同則亦宜有飲之欲有飲之欲憎井而去非其實也夫益殆不鑿井龍不為鑿井登雲神不棲於崑崙傳書意妄造生之也傳書言梁山崩壅河三日不流晉君憂之晉伯宗以輦者之言令景公素縞而哭之河水為之流通此虛言也夫山崩壅河猶人之有癰腫血脈不通也治癰腫者可復以素服哭泣之聲治乎堯之時洪水滔天懷山襄陵帝堯吁嗟博求賢者水變甚於河壅堯憂深於景公不聞以素縞哭泣之聲能厭勝之堯無賢人若輦者之術乎將洪水變大不可以聲服除也如素縞而哭悔過自責也堯禹之治水以力役不自責梁山堯時山也所壅之河堯時河也山崩河壅天雨水踊二者之變無以殊也堯禹治洪水以力役輦者治壅河用自責變同而治異人鈞而應殊殆非賢聖變復之實也凡變復之道所以能相感動者以物類也有寒則復之以溫溫復解之以寒故以龍致雨以刑逐暑皆緣五行之氣用相感勝之山崩壅河素縞哭之於道何意乎此或時河壅之時山初崩土積聚水未盛三日之後水盛土散稍壞沮矣壞沮水流竟注東去遭伯宗得輦者之言因素縞而哭哭之因流流時謂之河變起此而復其實非也何以驗之使山恆自崩乎素縞哭無益也使其天變應之宜改政治素縞而哭何政所改而天變復乎傳書言曾子之孝與母同氣曾子出薪於野有客至而欲去曾母曰願留參方到即以右手搤其左臂曾子左臂立痛即馳至問母曰臂何故痛母曰今者客來欲去吾搤臂以呼汝耳蓋以至孝與父母同氣體有疾病精神輒感曰此虛也夫孝悌之至通於神明乃謂德化至天地俗人緣此而說言孝悌之至精氣相動如曾母臂痛曾子臂亦輒痛曾母病曾子亦輒病乎曾母死曾子亦輒死乎攷事曾母先死曾子不死矣此精氣能小相動不能大相感也世稱申喜夜聞其母歌心動開關問歌者為誰果其母蓋聞母聲聲音相感心悲意動開關而問蓋其實也今曾母在家曾子在野不聞號呼之聲母小搤臂安能動子疑世人頌成聞曾子之孝天下少雙則為空生母搤臂之說也世稱南陽卓公為緱氏令蝗不入界蓋以賢明至誠災蟲不入其縣也此又虛也夫賢明至誠之化通於同類能相知心然後慕服蝗蟲閩虻之類也何知何見而能知卓公之化使賢者處深野之中閩虻能不入其舍乎閩虻不能避賢者之舍蝗蟲何能不入卓公之縣如謂蝗蟲變與閩虻異夫寒溫亦災變也使一郡皆寒賢者長一縣一縣之界能獨溫乎夫寒溫不能避賢者之縣蝗蟲何能不入卓公之界夫如是蝗蟲適不入界卓公賢名偶稱於世世則謂之能卻蝗蟲, SBCK: 審}
