  - {type: variant, offset: 1278, length: 412, content: 所為也且凶之人卜得惡兆筮得凶卦出門見不吉占危睹禍氣禍氣見於面猶白虹太白見於天也變見於天妖出於人上下適然自相應也傳書言燕太子丹朝於秦不得去從秦王求歸秦王執留之與之誓曰使日再中天雨粟令烏白頭馬生角廚門木象生肉足乃得歸當此之時天地祐之日為再中天雨粟烏白頭馬生角廚門木象生肉足秦王以為聖乃歸之此言虛也燕太子丹何人而能動天聖人之拘不能動天太子丹賢者也何能致此夫天能祐太子生諸瑞以免其身則能和秦王之意以解其難見拘一事而易生瑞五事而難舍一事之易為五事之難何天之不憚勞也湯困夏臺文王拘羑里孔子厄陳蔡三聖之困天不能祐使拘之者睹祐知聖出而尊厚之或曰拘三聖者不與三誓三聖心不願故祐聖之瑞無因而至天之祐人猶借人以物器矣人不求索則弗與也曰太子願天下瑞之時豈有語言乎心願而已然湯閉於夏臺文王拘於羑里時心亦願出孔子厄陳蔡心願食天何不令夏臺羑里關鑰毀敗湯文涉出雨粟陳蔡孔子食飽乎太史公曰世稱太子丹之令天雨粟馬生角大抵皆虛言也太史公書漢世實事之人而云虛言近非, WYG: ''}
