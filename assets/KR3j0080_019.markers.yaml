  - {type: variant, offset: 37, length: 0, content: '', SBCK: 冨殖物不同也或積米榖或藏布帛或畜牛馬或長田宅夫樂米榖不愛布帛歡牛馬不美田宅則謂米榖愈布帛牛馬勝田宅矣今百姓安矣符瑞至矣終謂古瑞河圖鳯皇不至謂}
