  - {type: variant, offset: 5215, length: 0, content: '', SBCK: 黃帝有􅃰鹿之戰堯有丹水之師舜時有苗不服夏啓有扈叛逆髙宗伐􅀑方三年剋之周成王管蔡悖亂周公東征前代皆然漢不聞此高祖之時陳狶反彭越叛治始安也孝景之時呉楚興兵怨鼂錯也匈奴時擾正朔不及天荒之地王功不加兵今皆内附貢獻牛馬此則漢之威盛莫敢犯也紂爲至惡天下叛之武王舉兵皆願就戰八百諸侯不期俱至項羽惡微號而用兵與高祖俱起威力輕重未有所定則項羽力勁折鐡難於摧木高祖誅項羽折鐡武王伐紂摧木然則漢力勝周多矣凡克敵一則易二則難湯武伐桀紂一敵也高祖誅秦殺項兼勝二家力倍湯武武王爲殷西伯臣事於紂以臣伐周夷齊耻之扣馬而諫武王不聽不食周粟餓死首陽高祖不爲秦臣光武不仕王莽誅惡伐無道伯無夷之譏可謂順於周矣丘山易以起高淵洿易以爲深起於微賤無所因階者難襲爵乘位尊祖統業者易堯以唐侯入嗣帝位舜以司徒因堯授襌禹以司空緣功代舜湯由七十里文王百里武王爲西伯襲文王位三郊五代之起皆有因緣力易爲也高祖從亭長提三尺劒取天下光武由白水奮威武海内無尺土所因一位所乘直奉天命推自然此則起高於淵洿爲深於丘山也比方五代孰者爲優傳書或稱武王伐紂太公隂謀食小兒以丹令身純赤長大教言殷亡殷民見兒身赤以爲天神及言殷亡皆謂商滅兵至牧野晨舉脂燭姦謀惑民權掩不備周之所諱也世謂之虚漢取天下無此虚言武成之篇言周伐紂血流浮杵以武成言之食兒以丹晨舉脂燭殆且然矣漢伐亡新光武將五千人王莽遣二公將三萬人戰于昆陽雷雨晦冥前後不相見漢兵出昆陽城擊二公軍一而當十二公兵散天下以雷雨助漢威敵孰與舉脂燭以人事譎取殷哉或云武王伐紂紂赴火死武王就斬以鉞懸其首於大白之旌齊宣王憐釁鍾之牛睹其色之觳觫也楚莊王赦鄭伯之罪見其肉袒而形暴也君子惡不惡其身紂屍赴於火中所見悽愴非徒色之觳觫袒之暴形也就斬以鉞懸乎其首何其忍哉高祖入咸陽閻樂誅二世項羽殺子嬰高祖雍容入秦不戮二屍光武入長安劉聖公巳誅王莽乗兵即害不刃王莽之死}
