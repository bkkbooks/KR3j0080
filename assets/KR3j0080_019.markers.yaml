  - {type: variant, offset: 488, length: 2, content: 以為, SBCK: 猶疑孝宣皇帝元康二年鳯皇集於太山後又集于新平四年神雀集於長樂宫或集于上林九真獻麟神雀二年鳯皇甘露降集京師四年鳯皇下杜陵及上林五鳯三年帝祭南郊神光並見或興子谷燭燿齋宫十有餘日明年祭后土靈光復至至如南郊之時甘露神雀降集延壽萬歲宫其年三月鸞鳯集長樂宫東門中樹上甘露元年黄龍至見于新豐醴泉滂流彼鳯皇雖五六至或時一鳥而數來或時異鳥而各至麒麟神雀黄龍鸞鳥甘露醴泉祭后土}
