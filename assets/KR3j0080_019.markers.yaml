  - {type: variant, offset: 498, length: 2, content: 誅紂, SBCK: 周公並時猥出漢亦一代也何以當少於周周之聖王何以當多於漢漢之高祖光武周之文武也文帝武帝宣帝孝明今上過周之成康宣王非以身生漢世可褒增頌歎以求媚稱也核事理之情定說者之實也俗好褒遠稱古講瑞上世爲美論治則古王爲賢睹奇於今終不信然使堯舜更生恐無聖名獵者獲禽觀者樂獵不見漁者之心不顧也}
