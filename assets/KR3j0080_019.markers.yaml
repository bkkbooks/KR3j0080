  - {type: variant, offset: 2696, length: 600, content: 獸率舞此雖奇怪然尚可信何則鳥獸好悲聲耳與人耳同也禽獸見人欲食亦欲食之聞人之樂何為不樂然而魚聽仰秣玄鶴延頸百獸率舞蓋且其實風雨之至晉國大旱赤地三年平公癃病殆虛言也或時奏清角時天偶風雨風雨之後晉國適旱平公好樂喜笑過度偶發癃病傳書之家信以為然世人觀見遂以為實實者樂聲不能致此何以驗之風雨暴至是陰陽亂也樂能亂陰陽則亦能調陰陽也王者何須脩身正行擴施善政使鼓調陰陽之曲和氣自至太平自立矣傳書言湯遭七年旱以身禱於桑林自責以六過天乃雨或言五年禱辭曰余一人有罪無及萬夫萬夫有罪在余一人天無以一人之不敏使上帝鬼神傷民之命於是剪其髮麗其手自以為牲用祈福於上帝上帝甚說時雨乃至言湯以身禱於桑林自責若言剪髮麗手自以為牲用祈福於上帝者實也言雨至為湯自責以身禱之故殆虛言也孔子疾病子路請禱孔子曰有諸子路曰有之誄曰禱爾于上下神祇孔子曰丘之禱久矣聖人脩身正行素禱之日久天地鬼神知其無罪故曰禱久矣易曰大人與天地合其德與日月合其明與四時合其敘與鬼神合其吉凶此言聖人與天地鬼神同德行也即須禱以得福是不同也湯與孔子俱聖人也皆素禱之日久孔子不使子路禱以治病湯何能以禱得雨孔子素禱身猶疾病湯亦素禱歲猶大旱然則天地之有水旱猶人之有疾病也疾病不可以自責除水旱不可以禱謝去明矣湯之致旱以過乎是不與天地同德也今不以過致旱乎自責禱謝亦無益也人形長七尺形中有五常有癉熱之病深自剋責猶不能愈況以廣大之天自有水旱之變湯用七尺之形形中之誠自責禱謝安能得雨邪人在層臺, SBCK: 代}
