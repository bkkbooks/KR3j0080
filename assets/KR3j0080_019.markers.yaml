  - {type: variant, offset: 2650, length: 180, content: 廊門之危再奏之而列三奏之延頸而鳴舒翼而舞音中宮商之聲聲吁于天平公大悅坐者皆喜尚書曰擊石拊石百獸率舞此雖奇怪然尚可信何則鳥獸好悲聲耳與人耳同也禽獸見人欲食亦欲食之聞人之樂何為不樂然而魚聽仰秣玄鶴延頸百獸率舞蓋且其實風雨之至晉國大旱赤地三年平公癃病殆虛言也或時奏清角時天偶風雨風雨之後晉國適旱平公好樂喜笑過度偶發癃病傳書之家信以為然世人觀見遂以為實實者樂聲不能致此, WYG: 漢漢}
