  - {type: variant, offset: 1817, length: 0, content: '', WYG: 若亦觀獵不見漁游齊楚不願宋魯也使漢有𢎞文之人經傳漢事則尚書春秋也儒者宗之學者習之將襲舊六爲七今上上王至高祖皆爲聖帝矣觀杜撫班固等所上漢頌頌功德符瑞汪濊深廣滂沛無量踰唐虞入皇域三代隘辟厥深洿沮也殷監不逺在夏后之世且舎唐虞夏殷近與周家斷量功德實商優劣周不如漢何}
