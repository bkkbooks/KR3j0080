  - {type: variant, offset: 182, length: 189, content: 堅則亦無遠矣夫水與火各一性也能射火而滅之則當射水而除之洪水之時氾濫中國為民大害堯何不推精誠射而除之堯能射日使火不為害不能射河使水不為害夫射水不能卻水則知射日之語虛非實也或曰日氣也射雖不及精誠滅之夫天亦遠使其為氣則與日月同使其為體則與金石等以堯之精誠滅日虧金石上射日則能穿天乎世稱桀紂之惡射天而毆地譽高宗之德政消桑榖今堯不能以德滅十日而必射之是德不若高宗惡與桀紂同也安能以精誠獲天, SBCK: 雲太平}
