  - {type: variant, offset: 2169, length: 480, content: 微小之感不能動大巨也今鄒衍之歎不過如一炬尺冰而皇天巨大不徒鑊水庖廚之醜類也一仰天歎天為隕霜何天之易感霜之易降也夫哀與樂同喜與怒均衍興怨痛使天下霜使衍蒙非望之賞仰天而笑能以冬時使天熱乎變復之家曰人君秋賞則溫夏罰則寒寒不累時則霜不降溫不兼日則冰不釋一夫冤而一歎天輒下霜何氣之易變時之易轉也寒溫自有時不合變復之家且從變復之說或時燕王好用刑寒氣應至而衍囚拘而歎歎時霜適自下世見適歎而霜下則謂鄒衍歎之致也傳書言師曠奏白雪之曲而神物為之下降風雨暴至平公因之癃病晉國赤地或言師曠清角之曲一奏之有雲從西北起再奏之大風至大雨隨之裂帷幕破俎豆墮廊瓦坐者散走平公恐懼伏乎廊室晉國大旱赤地三年平公癃病夫白雪與清角或同曲而異名其禍敗同一實也傳書之家載以為是世俗觀見信以為然原省其實殆虛言也夫清角何音之聲而能致此曰清角木音也故致風而雨如木為風雨與風俱三尺之木數絃之聲感動天地何其神也此復一哭崩城一歎下霜之類也師曠能鼓清角必有所受非能質性生出之也其初受學之時宿昔習弄非直一再奏也審如傳書之言師曠學清角時風雨當至也傳書言瓠芭鼓瑟淵魚出聽師曠鼓琴六馬仰秣或言師曠鼓清角一奏之有玄鶴二八自南方來集, WYG: 周狹}
