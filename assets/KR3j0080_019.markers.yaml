  - {type: variant, offset: 8, length: 0, content: '', krp: 鳳鳥不至河不出圖吾己矣夫方今無鳳鳥河圖瑞頗未至悉具故謂未太平此言妄也夫太平以治定爲效百姓以安樂爲符孔子曰脩己以安百姓}
  - {type: variant, offset: 9, length: 0, content: '', SBCK: 舜其猶病諸百姓安者太平之驗也夫治人以人爲主百姓安而隂陽和隂陽和則萬物育萬物育則奇瑞出視今天下安乎危乎安則平矣瑞雖未具無害於平故夫王道定事以驗立實以效效驗不彰實誠不見時或實然證驗不具是故王道立事以實不必具驗聖主治世期於平安不須符瑞且夫太平之瑞猶聖主之相也聖王骨法未必同太平之瑞何爲當等彼聞堯舜}
