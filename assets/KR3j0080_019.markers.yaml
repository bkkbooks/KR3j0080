  - {type: variant, offset: 1679, length: 715, content: 世實事之人而云虛言近非實也傳書言杞梁氏之妻嚮城而哭城為之崩此言杞梁從軍不還其妻痛之嚮城而哭至誠悲痛精氣動城故城為之崩也夫言嚮城而哭者實也言城為之崩者虛也夫人哭悲莫過雍門子雍門子哭對孟嘗君孟嘗君為之於邑蓋哭之精誠故對嚮之者悽愴感慟也夫雍門子能動孟嘗之心不能感孟嘗衣者衣不知惻怛不以人心相關通也今城土也土猶衣也無心腹之藏安能為悲哭感慟而崩使至誠之聲能動城土則其對林木而哭能折草破木乎嚮水火而泣能涌水滅火乎夫草木水火與土無異然杞梁之妻不能崩城明矣或時城適自崩杞梁妻適哭下世好虛不原其實故崩城之名至今不滅傳書言鄒衍無罪見拘於燕當夏五月仰天而歎天為隕霜此與杞梁之妻哭而崩城無以異也言其無罪見拘當夏仰天而歎實也言天為之雨霜虛也夫萬人舉口並解吁嗟猶未能感天鄒衍一人冤而壹歎安能下霜鄒衍之冤不過曾子伯奇曾子見疑而吟伯奇被逐而歌疑逐與拘同吟歌與歎等曾子伯奇不能致寒鄒衍何人獨能雨霜被逐之冤尚未足言申生伏劍子胥刎頸實孝而賜死誠忠而被誅且臨死時皆有聲辭聲辭出口與仰天歎無異天不為二子感動獨為鄒衍動豈天痛見拘不悲流血哉伯奇冤痛相似而感動不同也夫熯一炬火爨一鑊水終日不能熱也倚一尺冰置庖廚中終夜不能寒也何則微小之感不能動大巨也今鄒衍之歎不過如一炬尺冰而皇天巨大不徒鑊水庖廚之醜類也一仰天歎天為隕霜何天之易感霜之易降也夫哀與樂同喜與怒均衍興怨痛使天下霜使衍蒙非望之賞仰天而笑能以冬時使天熱乎變復之家曰人君秋賞則溫夏罰則寒寒不累時則霜不降溫不兼日則冰不釋一夫冤而一歎天輒下霜何氣之易變時之易轉也寒溫自有時不合變復之家且從變復之說或時燕王好用刑寒氣應至而衍囚拘而歎歎時霜適自下世見適歎而霜下則謂鄒衍歎之致也傳書言師曠奏白雪之曲而神物為之下降風雨暴至平公因之癃病晉, SBCK: ''}
