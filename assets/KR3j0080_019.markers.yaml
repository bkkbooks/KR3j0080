  - {type: variant, offset: 40, length: 0, content: '', WYG: 實者天下已太平矣未有聖人何以致之未見鳯皇何以效實問世儒}
  - {type: variant, offset: 40, length: 0, content: '', krp: 實者天下已太平矣未有聖人何以致之未見鳯皇何以效實問世儒知}
  - {type: variant, offset: 41, length: 1, content: 過, SBCK: 聖何以知今無聖人也世人見鳯皇何以知之旣無以知之何以知今無鳯皇也委不能知有聖與無又不能别鳯皇是鳯與非則必不能定今太平與未平也孔子曰如有王者必世然後仁三十年而天下平漢興至文帝時二十餘年賈誼創議以爲天下洽和當改正朔服色制度定官名興禮樂文帝初即位謙讓未遑夫如賈生之議文帝時己太平矣漢興二十餘年應孔子之言必世然後仁也漢一代之年數巳滿太平立矣賈生知之況至今且三}
