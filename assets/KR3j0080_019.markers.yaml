  - {type: variant, offset: 1536, length: 142, content: 而尊厚之或曰拘三聖者不與三誓三聖心不願故祐聖之瑞無因而至天之祐人猶借人以物器矣人不求索則弗與也曰太子願天下瑞之時豈有語言乎心願而已然湯閉於夏臺文王拘於羑里時心亦願出孔子厄陳蔡心願食天何不令夏臺羑里關鑰毀敗湯文涉出雨粟陳蔡孔子食飽乎太史公曰世稱太子丹之令天雨粟馬生角大抵皆虛言也太史公書, SBCK: 恢論}
