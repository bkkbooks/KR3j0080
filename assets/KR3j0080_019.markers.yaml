  - {type: variant, offset: 36, length: 0, content: '', SBCK: 帝王聖相前後不同則得瑞古今不等而今王無鳳鳥河圖爲未太平妄矣孔子言鳯皇河圖者假前瑞以爲語也未必謂世當復有鳯皇與河圖也夫帝王之瑞衆多非一或以鳳鳥麒驎或以河圖洛書或以甘露醴泉或以隂陽和調或以百姓乂安今瑞未必同於古古應未必合於今遭以所得未必相襲何以明之以帝王興起命祜不同也周則烏魚漢斬大虵推論唐虞猶周漢也初興始起事效物氣無相襲者太平瑞應何故當鈞以巳至之瑞效方來之應猶守株待兎之蹊藏身破置之路也天下太平瑞應各異猶家}
  - {type: page-break, offset: 36, content: '', id: KR3j0080_SBCK_019-2b}
