  - {type: variant, offset: 3049, length: 244, content: 禱久矣聖人脩身正行素禱之日久天地鬼神知其無罪故曰禱久矣易曰大人與天地合其德與日月合其明與四時合其敘與鬼神合其吉凶此言聖人與天地鬼神同德行也即須禱以得福是不同也湯與孔子俱聖人也皆素禱之日久孔子不使子路禱以治病湯何能以禱得雨孔子素禱身猶疾病湯亦素禱歲猶大旱然則天地之有水旱猶人之有疾病也疾病不可以自責除水旱不可以禱謝去明矣湯之致旱以過乎是不與天地同德也今不以過致旱乎自責禱謝亦無益也人形長七尺形中有五常有癉熱之病深自剋責猶不能愈況以廣大之天自有水旱之變湯用七尺之形形中之誠自責禱謝安能得雨邪人, WYG: 彌見漢奇夫經熟講者要妙乃見國極論者恢奇彌出恢論漢國}
