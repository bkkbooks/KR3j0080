  - {type: variant, offset: 3478, length: 0, content: '', WYG: 時上書言漢土徳其符黄龍當見後黄龍見成紀然則公孫臣知黄龍將出案律歴以處之也賢聖之知事宜驗矣賢聖之才皆能先知其先知也任術用數或善商而巧意非聖人空知神怪與聖賢殊道異路也聖賢知不踰故用思相出入遭事無神怪故名號相貿易故夫賢聖者道徳智能之號神者眇茫恍惚無形之實實異質不得同實鈞效不得殊聖神號不等故謂聖者不神神者不聖東郭牙善億以知國情子貢善億以得貨利聖人之先知子貢東郭牙之徒也與子貢東郭同則子貢東郭之徒亦聖也夫如是聖賢之實同而名號殊未必才相懸絶智相兼倍也太宰問於子貢曰夫子聖者與何其多能也子貢曰固天縱之將聖又多能也將者且也不言已聖言且聖者以為孔子聖未就也夫聖若為賢矣治行厲操操行未立則謂且賢今言且聖聖可為之故也孔子曰吾十有五而志于學三十而立四十而不惑五十而知天命六十而耳順從知天命至耳順學就知明成聖之驗也未五十六十}
