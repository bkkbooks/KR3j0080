  - {type: variant, offset: 16, length: 0, content: '', SBCK: 號始皇巡狩至魯觀孔子宅乃至沙丘道病而崩又曰董仲舒亂我書其後江都相董仲舒論思春秋造著傳記又書曰亡秦者胡也其後二世胡亥竟亡天下用三者論之聖人後知萬世之效也孔子生不知其父若母匿之吹律自知殷宋大夫子氏之世也不案圗書不聞人言吹律精思自知其世聖人前知千歲之驗也曰此皆虛也案神怪之言皆在䜟記所表皆效圖書亡秦者胡河圖之文也孔子條暢增益以表神怪或後人詐記以明效驗髙皇帝封吴王送之拊其背曰漢後五十年東南有反者豈汝邪到景帝時濞與七國通謀反漢建此言者或時觀氣見象處其有反不知主名髙祖見濞之勇則謂之是原此以論孔子見始皇仲舒或時但言將有觀我之宅亂我之書者後人見始皇入其宅仲舒讀其書則増益其辭著其主名如孔子神而空見始皇仲舒則其自為殷後子氏之世亦當黙而知之無為吹律以自定也孔子不吹律不能立其姓及其見始皇睹仲舒亦復以吹律之類矣案始皇本事始皇不至魯安得上孔子之堂踞孔子之牀顛倒孔子之衣裳乎始皇三十七年十月癸丑出游至雲夢望祀虞舜於九嶷浮江下觀藉柯度梅渚過丹陽至錢唐臨浙江濤惡乃西百二十里從陜中度上㑹稽祭大禹立石刋頌望于南海還過吳江乘旁海上北至琅邪自琅邪北至勞成山因至之罘遂並海西至平原津而病崩於沙丘平臺既不至魯䜟記何見而云始皇至魯至魯未可知其言孔子曰不知何一男子之言亦未可用不知何一男子之言不可用則言董仲舒亂我書亦復不可信也行事文記譎常人言耳非天地之書則皆緣前因古有所據狀如無聞見則無所狀凡聖人見禍福也亦揆端推類原始見終從閭巷論朝堂由昭昭察冥冥䜟書祕文逺見未然空虚闇昧豫睹未有達聞暫見卓譎怪神若非庸口所能言放象事類以見禍推原往驗以處來事者亦能非獨聖也周公治魯}
