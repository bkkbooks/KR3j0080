  - {type: variant, offset: 137, length: 1, content: 兵, SBCK: 聖空坐先知雨也性能一事知逺道孔竅不普未足以論也所論先知性達者盡知萬物之性畢睹千道之要也如知一不通二達左不見右偏駮不純踦校不具非所謂聖也如必謂之聖是明聖人無以竒也詹何之徒聖孔子之黨亦稱聖是聖無以異於賢賢無以乏於聖也賢聖皆能何以稱聖竒於賢乎如俱任用術數賢何以不及聖實者聖賢不能知性須任耳目以定情實其任耳目也可知之事思之輒決不可知之事待問乃解天下之事世間之物可思而愚夫能開精不可思而知上聖不能省孔子曰吾嘗終日不食終夜不}
