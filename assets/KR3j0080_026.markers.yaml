  - {type: variant, offset: 1984, length: 0, content: '', SBCK: 乘雲風上升今日見老子其猶龍邪聖人知物知事老子與龍人物也所從上下事也何故不知如老子神龍亦神聖人亦神神者同道精氣交連何故不知以孔子不知龍與老子言之聖人不能先知十二也孔子曰孝哉閔子騫人不間於其父母昆弟之言虞舜大聖隠藏骨肉之過宜愈子騫瞽叟與象使舜治廩浚井意欲殺舜當見殺巳之情早諫豫止既無如何冝避不行若病不為何故使父與弟得成殺己之惡使人聞非父弟萬世不滅以虞舜不豫見聖人不能先知十三也武王不豫周公請命壇墠既設筴祝已畢不知天之許已與不乃卜三􅀛三􅀛皆吉如聖人先知周公當知天已許之無為頓復卜三􅀛知聖人不以獨見立法則更請命祕藏}
