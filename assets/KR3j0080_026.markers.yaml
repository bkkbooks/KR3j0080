  - {type: variant, offset: 17, length: 0, content: '', SBCK: 公知其後世當有削弱之患太公治齊周公睹其後世當有劫弑之禍見法術之極睹禍亂之前矣紂作象箸而箕子譏魯以偶人葬而孔子嘆緣象箸見龍干之患偶人睹殉葬之禍也太公周公俱見未然箕子孔子並睹未有所由見方來者賢聖同也魯侯老太子弱漆室之女倚柱而嘯由老弱之徴見敗亂之兆也婦人之知尚能推類以見方來況聖人君子才髙智明者乎秦始皇十年嚴襄王母夏太后夢孝文王后曰華陽后與文王􅁙夀陵夏太后嚴襄王􅁙於范陵故夏太后别􅁙杜陵曰東望吾子西望吾夫後百年旁當有萬家邑其後皆如其言必以推類見方來為聖漆室夏太后聖也秦昭王十年樗里子卒􅁙于渭南章臺之東曰後百年當有天子宫挾我墓至漢興長樂宫在其東未央宫在其西武庫正值其墓竟如其言先知之效見方來之驗也如以此效聖樗里子聖人也如非聖人先知見方來不足以明聖然則樗里子見天子宫挾其墓也亦猶辛有知伊川之當戎昔辛有過伊川見被髮而祭者曰不及百年此其戎乎其後百年晉遷陸渾之戎於伊川焉竟如辛有之知當戎見被髮之兆也樗里子之見天子挾其墓亦見博}
