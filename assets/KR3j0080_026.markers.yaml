  - {type: variant, offset: 1973, length: 1, content: 言, krp: 孔子先知當自知之無為觀也如不知而問之是不能先知七也孔子母死不知其父墓殯於五甫之衢人見之者以為葬也蓋以無所合葬殯之謹故人以為葬也鄰人鄒曼甫之母告之然后得合葬於防有塋自在防殯於衢路聖人不能先知八也既得合葬孔子反門人後雨甚至孔子問曰何遲也曰防墓崩孔子不應三孔子泫然流涕曰吾聞之古不脩墓如孔子先知當先知防墓崩比門人至冝流涕以俟之人至乃知之聖人不能先知九也子入太廟每事問不知故問為人法也孔子未嘗入廟廟中禮器衆多非一孔子雖聖何能知之以嘗見實已知而復問為人法孔子曰疑思問疑乃當問邪實已知當復問為人法孔子知五經問字一有門人從之學當復行問以為人法何故專口授弟子乎不以已知五經復問為人法獨以已知太廟復問為人法聖人用心何}
  - {type: variant, offset: 1976, length: 0, content: '', SBCK: 一也以孔子入太廟言之聖人不能先知十也主人請賓飲食若呼賓頓若舍賓如聞其家有輕子洎孫必教親徹饌退膳不得飲食閉館闗舍不得頓賓之執計則必不往何則知請呼無喜空行勞辱也如往無喜勞辱復還不知其家不曉其實人實難知吉凶難圖如孔子先知宜知諸侯惑於讒臣必不能用空勞辱已聘召之到宜寢不往君子不為無益之事不履辱身之行無為周流應聘以取削跡之辱空說非主以犯絶糧之厄由此言之近不能知論者曰孔子自知不用聖思閔道不行民在塗炭之中庶幾欲佐諸侯行道濟民故應聘周流不避患恥為道不為已故逢患而不惡為民不為名故􅀩謗而不避曰此非實也孔子曰吾自衛反魯然後樂正雅頌各得其所是謂孔子自知時也何以自知魯衛天下最賢之國也魯衛不能用已則天下莫能用已也故退作春秋删定詩書以自衛反魯言之知行應聘時未自知也何則無兆象效驗聖人無以定也魯衛不能用自知極也魯人獲麟自知絶也道極命絶兆象著明心懐望沮退而幽思夫周流不休猶病未死禱卜使痊也死兆未}
