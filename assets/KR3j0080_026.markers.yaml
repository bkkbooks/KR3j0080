  - {type: variant, offset: 4, length: 0, content: '', SBCK: 者論聖人以為前知千歲後知萬世有獨見之明獨聽之聰事來則名不學自知不問自曉故稱聖則神矣若蓍􅀛之知吉凶蓍草稱神􅀛稱靈矣賢者才下不能及智劣不能料故謂之賢夫名異則實殊質同則稱鈞以聖名論之知聖人卓絶與賢殊也孔子將死遺䜟}
