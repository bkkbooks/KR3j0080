  - {type: variant, offset: 2275, length: 225, content: 中銅柱入尺欲言匕首之利荊軻勢盛投銳利之刃陷堅彊之柱稱荊軻之勇故增益其事也夫言入銅柱實也言其入尺增之也夫銅雖不若匕首堅剛入之不過數寸殆不能入尺以入尺言之設中秦王匕首洞過乎車張十石之弩射垣木之表尚不能入尺以荊軻之手力投輕小之匕首身被龍淵之劍刃入堅剛之銅柱是荊軻之力勁於十石之弩銅柱之堅不若木表之剛也世稱荊軻之勇不言其多力多力之人莫若孟賁使孟賁擿銅柱能洞過出一尺乎此亦或時匕首利若干將莫邪所刺無前所擊無下故有入尺之效夫稱干將莫邪亦過其實刺擊無前下亦入銅柱尺, SBCK: ''}
