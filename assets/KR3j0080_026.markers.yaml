  - {type: variant, offset: 364, length: 1034, content: 是稱其巧於射也夫言其時射一楊葉中之可也言其百發而百中增之也夫一楊葉射而中之中之一再行敗穿不可復射矣如就葉懸於樹而射之雖不欲射葉楊葉繁茂自中之矣是必使上取楊葉一一更置地而射之也射之數十行足以見巧觀其射之者亦皆知射工亦必不至於百明矣言事者好增巧美數十中之則言其百中矣百與千數之大者也實欲言十則言百百則言千矣是與書言協和萬邦詩曰子孫千億同一意也儒書言衛有忠臣弘演為衛哀公使未還狄人攻哀公而殺之盡食其肉獨捨其肝弘演使還致命於肝痛哀公之死身肉盡肝無所附引刀自刳其腹盡出其腹實乃內哀公之肝而死言此者欲稱其忠矣言其自刳內哀公之肝而死可也言盡出其腹實乃內哀公之肝增之也人以刃相刺中五藏輒死何則五藏氣之主也猶頭脈之湊也頭一斷手不能取他人之頭著之於頸奈何獨能先出其腹實乃內哀公之肝腹實出輒死則手不能復把矣如先內哀公之肝乃出其腹實則文當言內哀公之肝出其腹實今先言盡出其腹實內哀公之肝又言盡增其實也儒書言楚熊渠子出見寢石以為伏虎將弓射之矢沒其衛或曰養由基見寢石以為兕也射之矢飲羽或言李廣便是熊渠養由基李廣主名不審無害也或以為虎或以為兕兕虎俱猛一實也或言沒衛或言飲羽羽則衛言不同耳要取以寢石似虎兕畏懼加精射之入深也夫言以寢石為虎射之矢入可也言其沒衛增之也夫見似虎者意以為是張弓射之盛精加意則其見真虎與是無異射似虎之石矢入沒衛若射真虎之身矢洞度乎石之質難射肉易射也以射難沒衛言之則其射易者洞不疑矣善射者能射遠中微不失毫釐安能使弓弩更多力乎養由基從軍射晉侯中其目夫以匹夫射萬乘之主其加精倍力必與射寢石等當中晉侯之目也可復洞達於項乎如洞達於項晉侯宜死車張十石之弩恐不能入一寸矢摧為三況以一人之力引微弱之弓雖加精誠安能沒衛人之精乃氣也氣乃力也有水火之難惶惑恐懼舉徙器物精誠至矣素舉一石者倍舉二石然則見伏石射之精誠倍故不過入一寸如何謂之沒衛乎如有好用劍者見寢石懼而斫之可復謂能斷石乎以勇夫空拳而暴虎者卒然見寢石以手椎之能令石有跡乎巧人之精與拙人等古人之誠與今人同使當今射工射禽獸於野其欲得之不餘精力乎及其中獸不過數寸跌誤中石不能內鋒箭摧折矣夫如是儒書之言楚熊渠子養由基李廣射寢石矢沒衛飲羽者皆增之也儒書稱魯般墨子之巧刻木為鳶飛之三日而不集夫言其以木為鳶飛之可也言其三日不集增之也夫刻木為鳶以象鳶形安能飛而不集乎既能飛翔安能至於三日如審有機關一飛遂翔不可復下則當言遂飛不當言三日猶世傳言曰魯般巧亡其母也言其巧工為母作木車馬木人御者機關備具載母其上一驅不還遂失其母如木鳶機關備具與木車馬等則遂飛不集機關為須臾, SBCK: ''}
