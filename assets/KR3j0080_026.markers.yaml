  - {type: variant, offset: 3480, length: 1, content: 趙, krp: 未能知天命至耳順也則謂之且矣當子貢荅太宰時殆三十四十之時也魏昭王問於田詘曰寡}
  - {type: variant, offset: 3482, length: 4, content: 新垣平上, SBCK: 在東宫之時聞先生之議曰為聖易有之乎田詘對曰臣之所學也昭王曰然則先生聖乎田詘曰未有功而知其聖者堯之知舜也待其有功而後知其聖者市人之知舜也今詘未有功而王問詘曰若聖乎敢問王亦其堯乎夫聖可學為故田詘謂之易如卓與人殊禀天性而自然焉可學而為之安能成田詘之}
