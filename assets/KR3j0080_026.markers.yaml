  - {type: variant, offset: 136, length: 0, content: '', SBCK: 言帝嚳生而自言其名未有聞見於外生輒能言稱其名非神靈之效生知之驗乎曰黄帝生而言然而母懐之二十月生計其月數亦已二嵗在母身中矣帝嚳能自言其名然不能言他人之名雖有一能未能徧通所謂神而生知者豈謂生而能言其名乎乃謂不受而能知之未得能見之也黄帝帝嚳雖有神靈之驗亦皆早成之才也人才早成亦有晚就雖未就師家問室學人見其幼成早就稱之過度云項託七嵗是必十嵗云教孔子是必孔子問之云黄帝帝嚳生而能言是亦數月云尹方年二十一是亦且三十云無所師友有不學書是亦遊學家習世俗褒稱過實毁敗踰惡世俗傳顔淵年十八嵗升太山望見呉昌門外有繋白馬定考實顔淵年三十不升太山不望吳昌門項託之稱尹方之譽顔淵之類也人才有髙下知物由學學之乃知不問不識子貢曰夫子焉不學而亦何常師之有孔子曰吾十有五而志乎學五帝三王皆有所師曰是欲為人法也曰精思亦可為人法何必以學者事難空知賢聖之才能立也所謂神者不學而知所謂聖者須學以聖以聖人學知其非聖天地之間含血之類無性知者狌狌知往鳱鵲知來禀天之性自然者也如以聖人為若狌狌乎則夫狌狌之類鳥獸也僮謡不學而知可謂神而先知矣如以聖人為若僮謡乎則夫僮謡者妖也世間聖神以為巫與鬼神用巫之口告人如以聖人為若巫乎則夫為巫者亦妖也與妖同氣則與聖異類矣巫與聖異則聖不能神矣不能神則賢之黨也同黨則所知者無以異也及其有異以入道也聖人疾賢者遅賢者才多聖人智多所知同業多少異量所道一途步騶相過事有難知易曉賢聖所共闗思也若夫文質之復三教之重正朔相緣損益相因賢聖所共知也古之水火今之水火也今之聲色後世之聲色也鳥獸草木人民好惡以今而見古以此而知來千嵗之前萬世之後無以異也追觀上古探察來世文質之類水火之軰賢聖共之見兆聞象圗畫禍福賢聖共之見怪名物無所疑惑賢聖共之事可知者賢聖所共知也不可知者聖人亦不能知也何以明之}
