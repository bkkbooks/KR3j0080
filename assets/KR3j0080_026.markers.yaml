  - {type: variant, offset: 2503, length: 2, content: 儒書, SBCK: 聖人據象兆原物類億而得之其見變名物博學而識之巧商而善億廣見而多記由㣲見較若揆之今睹千載所謂智如淵海孔子見竅睹㣲思慮洞達材智兼倍彊力不倦超踰倫等耳目非有達視之明知人所不知之狀也使聖人達視逺見洞聽潜聞與天地談與􅀑神}
