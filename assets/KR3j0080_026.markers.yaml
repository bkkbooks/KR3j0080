  - {type: variant, offset: 2988, length: 486, content: 身不能神鑄器安能神如以金之物為神乎則夫金者石之類也石不能神金安能神以有百物之象為神乎夫百物之象猶雷罇也雷罇刻畫雲雷之形雲雷在天神於百物雲雷之象不能神百物之象安能神也傳言秦滅周周之九鼎入于秦案本事周赧王之時秦昭王使將軍摎攻王赧王赧惶懼犇秦頓首受罪盡獻其邑三十六口三萬秦受其獻還王赧王赧卒秦王取九鼎寶器矣若此者九鼎在秦也始皇二十八年北遊至琅邪還過彭城齊戒禱祠欲出周鼎使千人沒泗水之中求弗能得案時昭王之後三世得始皇帝秦無危亂之禍鼎宜不亡亡時殆在周傳言王赧犇秦秦取九鼎或時誤也傳又言宋太丘社亡鼎沒水中彭城下其後二十九年秦并天下若此者鼎未入秦也其亡從周去矣未為神也春秋之時五石隕于宋五石者星也星之去天猶鼎之亡於地也星去天不為神鼎亡於地何能神秦秋之時三山亡猶太丘社之去宋五星之去天三山亡五石隕太丘社去皆自有為然鼎亡亡亦有應也未可以亡之故乃謂之神如鼎與秦三山同乎亡不能神如有知欲辟危亂之禍乎則更桀紂之時矣衰亂無道莫過桀紂桀紂之時鼎不亡去周之衰亂未若桀紂留無道之桀紂去衰末之周非亡去之宜有神知之驗也或時周亡之時將軍摎人眾見鼎盜取姦人鑄爍以為他器始皇求不得也後因言有神名則空生沒於泗水之語矣, SBCK: 公孫臣}
