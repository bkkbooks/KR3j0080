  - {type: variant, offset: 2628, length: 3, content: 木非石, SBCK: 絶殊之名也何以明之齊桓公與管仲謀伐莒謀未發而聞於國桓公怪之問管仲曰與仲甫謀伐莒未發聞於國其故何也管仲曰國必有聖人也少頃當東郭牙至管仲曰此必是已乃令賔延而上之分級而立管曰子邪言伐莒對曰然管仲曰我不伐莒子何故言伐莒對曰臣聞君子善謀小人善意臣竊意之管仲曰我不言伐莒子何以億之對曰臣聞君子有三色驩然喜樂者鍾皷之色愁然清浄者衰絰之色怫然充滿手足者兵革之色君口垂不噞所言莒也君舉臂而指所當又莒也臣竊虞國小諸侯不服者其唯莒乎臣故言之夫管仲上智之人也其别物審事矣云國必有聖人者至誠謂國必有也東郭牙至云此必是已謂東郭牙聖也如賢與聖絶輩管仲知時無十二聖之黨當云國必有賢者無為言聖也謀未發而聞於國管仲謂國必有聖人是謂聖人先知也及見東郭牙云此必是已謂賢者聖也東郭牙知之審是與聖人同也客有見淳于髠於梁惠王者再見之終無言也惠王怪之以讓客曰子之稱淳于生言管晏不及及見寡人寡人未有得也寡人未足為言邪客謂髠曰曰固也吾前見王志在逺後見王志在音吾是以黙然客具報王大駭曰嗟乎淳于生誠聖人也前淳于生之來人有獻龍馬者寡人未及視㑹生至後來人有獻謳者未及試亦㑹生至寡人雖屏左右私心在彼夫髠之見惠王在逺與音也雖湯禹之察}
