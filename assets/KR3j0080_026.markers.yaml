  - {type: variant, offset: 1976, length: 0, content: '', krp: 一也以孔子入太廟言之聖人不能先知十也主人請賓飲食若呼賓頓若舍賓如聞其家有輕子洎孫必教親徹饌退膳不得飲食閉館闗舍不得頓賓之執計則必不往何則知請呼無喜空行勞辱也如往無喜勞辱復還不知其家不曉其實人實難知吉凶難圖如孔子先知宜知諸侯惑於讒臣必不能用空勞辱已聘召之到宜寢不往君子不為無益之事不履辱身之行無為周流應聘以取削跡之辱空說非主以犯絶糧之厄由此言之近不能知論者曰孔子自知不用聖思閔道不行民在塗炭之中庶幾欲佐諸侯行道濟民故應聘周流不避患恥為道不為已故逢患而不惡為民不為名故蒙謗而不避曰此非實也孔子曰吾自衛反魯然後樂正雅頌各得其所是謂孔子自知時也何以自知魯衛天下最賢之國也魯衛不能用已則天下莫能用已也故退作春秋删定詩書以自衛反魯言之知行應聘時未自知也何則無兆象效驗聖人無以定也魯衛不能用自知極也魯人獲麟自知絶也道極命絶兆象著明心懐望沮退而幽思夫周流不休猶病未死禱卜使痊也死兆未}
