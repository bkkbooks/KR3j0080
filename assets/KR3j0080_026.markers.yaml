  - {type: variant, offset: 1964, length: 0, content: '', SBCK: 吾以汝為死矣如孔子先知當知顔淵必不觸害匡人必不加悖見顔淵之來乃知不死未來之時謂以為死聖人不能先知五也陽貨欲見孔子孔子不見饋孔子豚孔子時其亡也而往拜之遇諸塗孔子不欲見既往􅀱時其亡是勢必不欲見也反遇於路以孔子遇陽虎}
