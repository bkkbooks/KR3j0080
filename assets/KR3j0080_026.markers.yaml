  - {type: variant, offset: 50, length: 1, content: 為, SBCK: 可知之事惟精思之雖大無難不可知之事厲心學問雖小無易故智能之士不學不成不問不知難曰夫項託年七嵗教孔子案七嵗未入小學而教孔子性自知也孔子曰生而知之上也學而知之其次也夫}
  - {type: variant, offset: 50, length: 0, content: '', WYG: 可知之事惟精思之雖大無難不可知之事厲心學問雖小無易故智能之士不學不成不問不知難曰夫項託年七嵗教孔子案七嵗未入小學而教孔子性自知也孔子曰生而知之上也學而知之其次也夫言生而知之不言學問謂若項託之類也王莽之時勃海尹方年二十一無所師友性智開敏明達六藝魏都牧淳于倉奏方不學得文能讀誦論義引五經文文說議事厭合人之心帝徴方使射蜚蟲筴射無非知者天下謂之聖人夫無所師友明達六藝本不學書得文能讀此聖人也不學自能無師自達非神而何曰雖無師友亦已有所問受矣不學書已弄筆墨矣兒始生産耳目始開雖有聖性安能有知項託七嵗其三四嵗時而受納人言矣尹方年二十一其十四五時多聞見矣性敏才茂獨思無所據不睹兆象不見類驗却念百世之後有馬生牛牛生驢桃生李李生梅聖人能知之乎臣弑君子弑父仁如顔淵孝如曾參勇如賁育辯如賜予聖人能見之乎孔子曰其或繼周者雖百世可知也又曰後生可畏焉知來者之不如今也論損益言可知稱後生言焉知後生難處損益易明也此尚}
