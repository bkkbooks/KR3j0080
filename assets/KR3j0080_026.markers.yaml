  - {type: variant, offset: 1973, length: 1, content: 言, SBCK: 孔子先知當自知之無為觀也如不知而問之是不能先知七也孔子母死不知其父墓殯於五甫之衢人見之者以為􅁙也蓋以無所合葬殯之謹故人以為葬也鄰人鄒曼甫之母告之然后得合葬於防有塋自在防殯於衢路聖人不能先知八也既得合葬孔子反門人後雨甚至孔子問曰何遲也曰防墓崩孔子不應三孔子􅊄然流涕曰吾聞之古不脩墓如孔子先知當先知防墓崩比門人至冝流涕以俟之人至乃知之聖人不能先知九也子入太廟每事問不知故問為人法也孔子未嘗入廟廟中禮器衆多非一孔子雖聖何能知之以嘗見實已知而復問為人法孔子曰疑思問疑乃當問邪實已知當復問為人法孔子知五經問字一有門人從之學當復行問以為人法何故專口授弟子乎不以已知五經復問為人法獨以已知太廟復問為人法聖人用心何}
  - {type: page-break, offset: 1973, content: '', id: KR3j0080_SBCK_026-12a}
  - {type: variant, offset: 1973, length: 1, content: 言, WYG: 孔子先知當自知之無為觀也如不知而問之是不能先知七也孔子母死不知其父墓殯於五甫之衢人見之者以為𦵏也盖以無所合葬殯之謹故人以為葬也鄰人鄒曼甫之母告之然后得合葬於防有塋自在防殯於衢路聖人不能先知八也既得合葬孔子反門人後雨甚至孔子問曰何遲也曰防墓崩孔子不應三孔子泫然流涕曰吾聞之古不脩墓如孔子先知當先知防墓崩比門人至冝流涕以俟之人至乃知之聖人不能先知九也子入太廟每事問不知故問為人法也孔子未嘗入廟廟中禮器衆多非一孔子雖聖何能知之以嘗見實已知而復問為人法孔子曰疑思問疑乃當問邪實已知當復問為人法孔子知五經一有問字門人從之學當復行問以為人法何故專口授弟子乎不以已知五經復問為人法獨以已知太廟復問為人法聖人用心何}
