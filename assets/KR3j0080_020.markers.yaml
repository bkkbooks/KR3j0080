  - {type: variant, offset: 1892, length: 2, content: 何哉, SBCK: 精神依倚形體故能變化與人交通巳死形體壞爛精神散亡無所復依不能變化夫人之精神猶物之精神也物生精神爲病其死精神消亡人與物同死而精神亦滅安能爲害禍設謂人貴精神有異成事物能變化人則不能是反人精神不若物物精奇於人也水火燒溺凡能害人者皆五行之物金傷人木􅇌人土壓人水溺人火燒人使人死精神爲五行之物乎害人不爲乎不能害人不爲物則爲氣矣氣之害人者太陽之氣爲毒者也使人死其氣爲毒乎害人不爲乎不能害人夫論死不爲鬼無知不能害人則夫所見鬼者非死人之精其害人者非其精}
