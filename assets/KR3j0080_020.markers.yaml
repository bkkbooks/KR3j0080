  - {type: variant, offset: 1774, length: 1, content: 誤, SBCK: 人謂死人之精神如審鬼者死人之精神則人見之宜徒見祼袒之形無爲見衣帶被服也何則衣服無精神人死與形體俱朽何以得貫穿之乎精神本以血氣爲主血氣常附形體形體雖朽精神尚在能爲鬼可也今衣服絲絮布帛也生時血氣不附着而亦自無血氣敗朽遂己與形體等安能自若爲衣服之形由此言之見鬼衣服象之則形體亦象之矣象之則知非死人之精神也夫死人不能爲鬼則亦無所知矣何以驗之以未生之時無所知也人未生在元氣之中既死復歸元氣元氣荒忽人氣在其中人未生無所知其死歸無知之本何能有知乎人之所以聰明智惠者以含五常之氣也五常之氣所以在人者以五藏在形中也五藏不傷則人智惠五藏有病則人荒忽荒忽則愚癡矣人死五藏腐朽腐朽則五常無所託矣所用藏智者巳敗矣所用爲智者巳去矣形須氣而成氣須形而知天下無獨燃之火世間安得有無體獨知之精人之死也其猶夢也夢者殄之次也殄者死之比也人殄不悟則死矣案人殄復悟死從來者與夢相似然則夢殄死一實也人夢不能知覺時所作猶死不能識生時所爲矣人言談有所作於臥人之旁臥人不能知猶對死人之棺爲善惡之事死人不能復知也夫臥精氣尚在形體尚全猶無所知況死人精神消亡形體朽敗乎人爲人所敺傷詣吏告苦以語人有知之故也或爲人所殺則不知何人殺也或家不知其尸所在使死人有知必恚人之殺已也當能言於吏旁告以賊主名若能歸語其家告以尸之所在今則不能無知之效也世間死者今生人殄而用其言及巫叩元絃下死人魂因巫口談皆誇誕之言也如不誇誕物之精神爲之象也或曰不能言也夫不能言則亦不能知矣知用氣言亦用氣焉人之未死也智惠精神定矣病則惽亂精神擾也夫死病之甚者也病死之微猶惽亂況其甚乎精神擾自無所知況其散也人之死猶火之滅也火滅而燿不照人死而知不惠二者宜同一實論者猶謂死有知惑也人病且死與火之且滅何以異火滅光消而燭在人死精亡而形存謂人死有知是謂火滅復有光也隆冬之月寒氣用事水凝爲氷踰春氣温冰釋爲水人生於天地之間其猶冰也隂陽之氣凝而爲人年終壽盡死還爲氣夫春水不能復爲冰死魂安能復爲形妬夫􅎱妻同室而處淫亂失行忿怒􅃲訟夫死妻更嫁妻死夫更娶以有知驗之冝大忿怒今夫妻死者寂寞無聲更嫁娶者平忽無禍無知之驗也孔子葬母於防旣而雨甚至防墓崩孔子聞之泫然流涕曰古者不修墓遂不復修使死有知必恚人不脩也孔子知之冝輙修墓以喜魂神然而不修聖人明審曉其無知也枯骨在野時鳴呼有聲若夜聞哭聲謂之死人之音非也何以驗之生人所以言語吁呼者氣括口喉之中動揺其舌張歙其口故能成言譬猶吹簫笙簫笙折破氣越不括手無所弄則不成音夫簫笙之管猶人之口喉也手弄其孔猶人之動舌也人死口喉腐敗舌不復動何能成言然而枯骨時呻鳴者人骨自有能呻鳴者焉或以爲秋也是與夜鬼哭無以異也秋氣爲呻鳴之變自有所爲依倚死骨之側人則謂之骨尚有知呻鳴於野草澤暴体以千萬數呻鳴之聲冝步屬焉夫有能使不言者言未有言者死能復使之言言者亦不能復使之言猶物生以青爲氣或予之也物死青者去或奪之也予之物青奪之青去去後不能復予之青物亦不能復自青聲色俱通並稟於天青青之色猶梟梟之聲也死物之色不能復青獨爲死人之聲能復自言惑也人之所以能言語者以有氣力也氣力之盛以能飲食也飲食損減則氣力衰衰則聲音嘶困不能食則口不能復言夫死困之甚何能復言或曰死人歆肴食氣故能言夫死人之精生人之精也使生人不飲食而徒以口歆肴食之氣不過三日則餓死矣或曰死人之精神於生人之精故能歆氣爲音夫生人之精在於身中死則在於身外死之與生何以殊身中身外何以異取水實於大盎中盎破水流地地水能異於盎中之水乎地水不異於盎中之水身外之精何故殊於身中之精人死不爲鬼無知不能語言則不能害人矣何以驗之夫人之怒也用氣其害人用力用力須筋骨而彊彊則能害人忿怒之人呴呼於人之旁口氣喘射人之面雖勇如賁育氣不害人使舒手而擊舉足而蹶則所擊蹶無不破折夫死骨朽䈥力絶手足不舉雖精氣尚在猶呴吁之時無嗣助也何以能害人也凡人與物所以能害人者手臂把刃爪牙堅利之故也今人死手臂朽敗不能復持刃爪牙隳落不能復囓噬安能害人兒之始生也手足具成手不能搏足不能蹶蹶字一有者氣適凝成未能堅彊也由此言之精氣不能堅彊審矣氣爲形體形體微弱猶未能害人況死氣去精神絶微弱猶未能害人寒骨謂能害人者邪死人之氣不去邪何能害人鷄卵之未字也澒溶於鷇中潰而視之若水之形良雌傴伏體方就成就成之後能啄蹶之夫人之死猶澒溶之時澒溶之氣安能害人人之所以勇猛能害人者以飲食也飲食飽足則彊壯勇猛彊壯勇猛則能害人矣人病不能飲食則身嬴弱羸弱困甚故至於死病困之時仇在其旁不能咄叱人盜其物不能禁奪羸弱困劣之故也夫死羸弱困劣之甚者也何能害人有雞犬之畜爲人所盜竊雖怯無勢之人莫不忿怒忿怒之極至相賊滅敗}
