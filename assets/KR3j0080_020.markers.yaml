  - {type: variant, offset: 1764, length: 1, content: 迹, SBCK: 謚之美者成宣也惡者靈厲也成湯遭旱周宣亦然然而成湯加成宣王言宣無妄之災不能虧政臣子累謚不夫實也由斯以論堯堯亦美謚也時亦有洪水百姓不安猶言堯者得實考也夫一字之謚尚猶明主況千言之論萬文之頌哉舩車載人孰與其徒多也素車朴舩孰與加漆采畫也然則鴻筆之人國之舩車采畫也農無彊夫􅂖粟不登國無彊文德闇不彰漢德不休亂在百代之間彊筆之儒不著載也高祖以來著書非不講論漢司馬長卿爲封禪書文約不具司馬子長紀黄帝以至孝武揚子雲録宣帝以至哀平陳平仲紀光武班孟堅頌孝明漢家功德頗可觀見今上即命未有褒載論衡之人爲此畢精故有齊世宣漢恢國驗符龍無雲雨不能參天鴻筆之人國之雲雨也載國德於傳書之上宣昭名於萬世之後厥高非徒參天也城墻之土平地之壤也人加築蹈之力樹立臨池國之功德崇於城墻文人之筆勁於築蹈聖主德盛功立莫不褒頌紀載奚得傳馳流去無疆乎人有高行或譽得其實或欲稱之不能言或謂不善不肯陳一斷此三者孰者爲賢五三之際於斯爲盛孝明之時衆瑞並至百官臣子不爲少矣唯班固之徒稱頌國德可謂譽得其實矣頌文譎以奇彰漢德於百代使帝名如日月孰與不能言言之不美善哉秦始皇東南遊升㑹稽山李斯刻石紀頌帝德至瑯琊亦然秦無道之國刻石文世觀讀之者見堯舜之美由此言之須頌明矣當今非無李斯之才也無從升㑹稽歷瑯琊之階也􅃶歌爲妙異之曲坐者不曰善􅃶歌之人必怠不精何則妙異難爲觀者不知善也聖國揚妙異之政衆臣不頌將順其美安得所施哉今方板之書在竹帛無主名所從生出見者忽然不卸服也如題曰甲甲某子之方若言巳驗嘗試人爭刻寫以爲珍祕上書於國記奏於郡譽薦士吏稱述行能章下記出士吏賢妙何則章表其行記明其才也國德溢熾莫有宣褒使聖國大漢有庸庸之名咎在俗儒不實論也古今聖王不絶則其符瑞亦宜累屬符瑞之出不同於前或時巳有世無以知故有講瑞俗儒好長古而短今言瑞則渥前而薄後是應實而定之漢不爲少漢有實事儒者不稱古有虛美誠心然之信久遠之僞忽近今之實斯蓋三增九虚所以成也能聖實聖所以興也儒者稱聖過實稽合於漢漢不能及非不能及儒者之說使難及也實而論之漢更難及􅂖熟歲平聖王因縁以立功化故治期之篇爲漢激發治有期亂有時能以亂爲治者優優者有之建初孟年無妄氣至聖世之期也皇帝執德救備其災故順皷明雩爲漢應變是故災變之至或在聖世時旱禍湛爲漢論災是故春秋爲漢制法論衡爲漢平說從門應庭聽堂室之言什而失九如升堂闚室百不失一論衡之人在古荒流之地其遠非徒門庭也日刻徑重千里人不謂之廣者遠也望夜甚雨月光不暗人不睹曜者隱也聖者垂日月之明處在中州隱於百里遥聞傳授不實形耀不實難論得詔書到計吏至乃聞聖政是以褒功失丘山之積頌德遺膏腴之美使至臺閣之下蹈班賈之跡論功德之實不失毫釐之微武王封比干之墓孔子顯三累之行大漢之德非直比干三累也道立國表路出其下望國表者昭然知路漢德明著莫立邦表之言故浩廣之德未光於世也佚文篇孝武皇帝封弟爲魯恭王恭王壞孔子宅以爲官得佚尚書百篇禮三百春秋三十篇論語二十一篇闓絃歌之聲懼復封塗上言武帝武帝遣吏發取古經論語此時皆出經傳也而有闓絃歌之聲文當興於漢喜樂得闓之祥也當傳於漢寢藏墻壁之中恭王闓之聖王感動絃歌之象此則古文不當掩漢俟以爲符也孝成皇帝讀百篇尚書博士郎吏莫能曉知徵天下能爲尚書者東海張霸通左氏春秋案百篇序以左氏訓詁造作百二篇具成奏上成帝出祕尚書以考校之無一字相應者成帝下霸於吏吏當噐辜大不謹敬成帝奇霸之才赦其辜亦不減其經故百二尚書傳在民間孔子曰才難能推精思作經百篇才高卓遹希有之人也成帝赦之多其文也雖姦非實次序篇句依倚事類有似真是故不燒滅之䟽一櫝相遣以書書十數札奏記長吏文成可觀讀之滿意百不能一張霸推精思至於百篇漢世實類成帝赦之不亦宜乎楊子山爲郡上計吏見三府爲哀牢傳不能成歸郡作上孝明奇之徵在蘭臺夫以三府掾吏叢積成才不能成一篇子山成之上覽其文子山之傳豈必審是傳聞依爲之有狀㑹三府之士終不能爲子山爲之斯須不難成帝赦張霸豈不有以哉孝武之時詔百官對䇿董仲舒䇿文最善王莽時使郎吏上奏劉子駿章尤美美善不空才高知深之驗也易曰聖人之情見於辭文辭美惡足以觀才永平中神雀羣集孝明詔上爵頌百官頌上文皆比瓦石唯班固賈逵傅毅楊終侯諷五頌金玉孝明覽焉夫以百官之衆郎吏非一唯五人文善非奇而何孝武善子虛之賦徵司馬長卿孝成玩弄衆書之多善揚子雲出入遊獵子雲乘從使長卿桓君山子雲作吏書所不能盈牘文所不能成句則武帝何貪成帝何欲故曰玩揚子雲之篇樂於居千石之官挾桓君山之書富於積猗頓之財韓非之書傳在秦庭始皇歎曰獨不得與此人同時陸賈新語每奏一篇高祖左右稱曰萬歲夫嘆思其人與喜稱萬歲豈可空爲哉誠見其美懽氣發於内也候氣變者於天不於地天文明也衣裳在身文着於衣不在於裳衣法天也察掌理者左不觀右左文明也占在右不觀左右文明也易曰大人虎變其文炳君子豹變其文蔚又曰觀乎天文觀乎人文此言天人以文爲觀大人君子以文爲操也高祖在母身之時息於澤陂蛟龍在上龍觩􅋑燿及起楚望漢軍氣成五采將入咸陽五星聚東井星有五色天或者憎秦滅其文章欲漢興之故先受命以文爲瑞也惡人操意前後乖違始皇前歎韓非之書後惑李斯之議燔五經之文設挾書之律五經之儒抱經隱匿伏生之徒竄藏土中殄賢聖之文厥辜深重嗣不及孫李斯創議身伏五刑漢興易亡秦之軌削李斯之跡高祖始令陸賈造書未興五經惠景以至元成經書並修漢朝郁郁厥語所聞孰與亡秦王莽無道漢軍雲起臺閣廢頓文書棄散光武中興修存未詳孝明世好文人並徵蘭臺之官文雄㑹聚今上即令詔求亡失購募以金安得不有好文之聲唐虞既逺所在書散殷周頗近諸子存焉漢興以來傳文未遠以所聞見伍唐虞而什殷周煥炳郁郁莫盛於斯天晏暘者星辰曉爛人性奇者掌文藻炳漢今爲盛故文繁湊也孔子曰文王既殁文不在茲乎文王之文傳在孔子孔子爲漢制文傳在漢也受天之文文人宜遵五經六藝爲文諸子傳書爲文造論著說爲文上書奏記爲文文德之操爲文立五文在世皆當賢也造論著說之文尤宜勞焉何則發胷中之思論世俗之事非徒諷古經續故文也論發胷臆文成手中非說經藝之人所能爲也周秦之際諸子並作皆論他事不頌主上無益於國無補於化造論之人頌上恢國國業傳在千載主德參貳日月非適諸子書傳所能並也上書陳便宜奏記薦吏士一則爲身二則爲人繁文麗辭無上書文德之操治身完行徇利爲私無爲主者夫如是五文之中論者之文多矣則可尊明矣孔子稱周曰唐虞之際於斯爲盛周之德其可謂至德巳矣孔子周之文人也設生漢世亦稱漢之至德矣趙他王南越倍主滅使不從漢制箕踞椎髻沉溺夷俗陸賈說以漢德懼以帝威心覺醒悟蹶然起坐世儒之愚有趙他之惑鴻文人之陳陸賈之說觀見之者將有蹶然起坐趙他之悟漢氏浩爛不有殊卓之聲文人之休國之符也望豐屋知名家睹喬木知舊都鴻文在國聖世之驗也孟子相人以眸子焉心清則眸子瞭瞭者目文瞭也夫候國占人同一實也國君聖而文人聚人心惠而目多采蹂蹈文錦於泥塗之中聞見之者莫不痛心知文錦之可惜不知文人之當尊不通類也天文人文文豈徒調墨弄筆爲美麗之觀哉載人之行傳人之名也善人願載思勉爲善邪人惡載力自禁裁然則文人之筆勸善懲惡也謚法所以章善即以著惡也加一字之謚人猶勸懲聞知之者莫不自勉況極筆墨之力定善惡之實言行畢載文以千數傳流於世成爲丹青故可尊也揚子雲作法言蜀富人賫錢千萬願載於書子雲不聽夫富無仁義之行圈中之鹿欄中之牛也安得妄載班叔皮續太史公書載鄉里人以爲惡戒邪人枉道繩墨所彈安得避諱是故子雲不爲財勸叔皮不爲恩撓文人之筆獨巳公矣賢聖定意於筆筆集成文文具情顯後人觀之見以正邪安宜妄記足蹈於地跡有好醜文集於禮志有善惡故夫占跡以睹足觀文以知情詩三百一言以蔽之曰思無邪論衡篇以十數亦一言也曰疾虚妄論死篇世謂死人爲鬼有知能害人試以物類驗之死人不爲鬼無知不能害人何以驗之驗之以物人物也物亦物也物死不爲鬼人死何故獨能爲鬼世能别人物不能爲鬼則爲鬼不爲鬼尚難分明如不能别則亦無以知其能爲鬼也人之所以生者精氣也死而精氣滅能爲精氣者血脉也人死血脉竭竭而精氣滅滅而形體朽朽而成灰土何用爲鬼人無耳目則無所知故聾盲之人比於草木夫精氣去人豈徒與無耳目同哉朽則消亡荒忽不見故謂之鬼神人見鬼神之形故非死人之精也何則鬼神荒忽不見之名也人死精神升天骸骨歸土故謂之鬼鬼者歸也神者荒忽無形者也或說鬼神隂陽之名也隂氣逆物而歸故謂之鬼陽氣導物而生故謂之神神者伸也申復無已終而復始人用神氣生其死復歸神氣隂陽稱鬼神人死亦稱鬼神氣之生人猶水之爲氷也水凝爲氷氣凝爲人氷釋爲水人死復神其名爲神也猶氷釋更名水也人見名異則謂有知能爲形而害人無據以論之也人見鬼若生人之形以其見若生人之形故知非死人之精也何以效之以囊橐盈粟米米在囊中若粟在橐中滿盈堅彊立樹可見人瞻望之則知其爲粟米囊橐何則囊橐之形若其容可察也如囊穿米出橐敗粟棄則囊橐委辟人瞻望之弗復見矣人之精神藏於形體之内猶粟米在囊橐之中也死而形體朽氣精散猶囊橐穿敗粟米棄出也粟米棄出囊橐無復有形精氣散亡何能復有體而人得見之乎禽獸之死也其肉盡索皮毛尚在制以爲裘人望見之似禽獸之形故世有衣狗裘爲狗盗者人不覺知假狗之皮毛故人不意疑也今人死皮毛朽敗雖精氣尚在神安能復假此形而以行見乎夫死人不能假生人之形以見猶生人不能假死人之䰟以亡矣六畜能變化象人之形者其形尚生精氣尚在也如死其形腐朽雖虎光勇猂不能復化魯公牛哀病化爲虎亦以未死也世有以生形轉爲生類者矣未有以死身化爲生象者也天地開闢人皇以來隨夀而死若中年夭亡以億萬數計今人之數不若死者多如人死輙爲鬼則道路之上一步一鬼也人且死見鬼宜見數百千萬滿堂盈廷填塞巷路不宜徒見一兩人也人之兵死也世言其血爲燐血者}
