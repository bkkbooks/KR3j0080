  - {type: variant, offset: 4, length: 1, content: 論, SBCK: 乃聞問說書者欽明文思以下誰所言也曰篇家也篇家誰也孔子也然則孔子鴻筆之人也自衞反魯然後樂正雅頌各得其所也鴻筆之奮蓋斯時也或說尚書曰尚者上也上所爲下所書也下者誰也曰臣子也然則臣子書上所爲矣問儒者禮言制樂言作何也曰禮者上所制故曰制樂者下所作故曰作天下太平頌聲作方今天下太平矣頌詩樂聲可以作未傳者不知也故曰拘儒衞孔悝之鼎銘周臣勸}
