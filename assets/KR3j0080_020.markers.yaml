  - {type: variant, offset: 1555, length: 0, content: '', SBCK: 臣子當頌明矣儒者謂漢無聖帝治化未太平宣漢之篇論漢已有聖帝治已太平恢國之篇極論漢德非常實然乃在百代之上表德頌功宣褒主上詩之頌言右臣之典也舎其家而觀他人之室忽其父而稱異人之翁未爲德也漢今天下之家也先帝今上民臣之翁也夫曉主德而頌其美識國奇而恢其功孰與疑暗不能也孔子稱大哉堯之爲君也唯天爲大唯堯則之蕩蕩乎民無能名焉或年五十擊壤於塗或曰大哉堯之德也擊壤者曰吾日出而作日入而息鑿井而飲耕田而食堯何等力孔子乃言大哉堯之德者乃知堯者也涉聖世不知聖主是則盲者不能别青黄也知聖主不能頌是則喑者不能言是非也然則方今盲喑之儒與唐擊壤之民同一才矣夫孔子及唐人言大哉者知堯德蓋堯盛也擊壤之民云堯何等力是不知堯德也夜舉燈燭光曜所及可得度也日照天下遠近廣狹難得量也浮於淮濟皆知曲折入東海者不曉南北故夫廣大大字一有廣從橫難數極深揭厲難測漢德酆廣日光海外也知者知之不知者不知漢盛也漢家著書多上及殷周諸子並作皆論他事無褒頌之言論衡有之又詩頌國名周頌與杜撫固所上漢頌相依類也宣帝之時畫圖漢列士或不在於畫上者子孫耻之何則父祖不賢故不畫圖也夫頌言非徒畫文也如千世之後讀經書不}
