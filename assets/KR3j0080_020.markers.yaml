  - {type: variant, offset: 1768, length: 0, content: '', SBCK: 見燐不象人形渾沌積聚若火光之狀燐死人之血也其形不類生人之血也其形不類生人之形精氣去人何故象人之體人見鬼也皆象死人之形則可疑死人爲鬼或反象生人之形病者見鬼云甲來甲時不死氣象甲形如死人爲鬼病者何故見生人之體乎天地之性能更生火不能使滅火復燃能更生人不能令死人復見能使滅灰更爲燃火吾乃頗疑死人能復爲形案火滅不能復燃}
