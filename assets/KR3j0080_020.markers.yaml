  - {type: variant, offset: 1602, length: 156, content: 前埋虵之時多所行矣稟天善性動有賢行賢行之人宜見吉物無為乃見殺人之虵豈叔敖未見虵之時有惡天欲殺之見其埋虵除其過天活之哉石生而堅蘭生而香如謂叔敖之賢在埋虵之時非生而稟之也儒家之徒董無心墨家之役纏子相見講道纏子稱墨家佑鬼神是引秦穆公有明德上帝賜之十九年董子難以堯舜不賜年桀紂不夭死堯舜桀紂猶為尚遠且近難以秦穆公晉文公夫, SBCK: ''}
