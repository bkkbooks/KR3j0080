  - {type: variant, offset: 14, length: 0, content: '', SBCK: 藥囊提荆軻既而天下名軻為烈士秦王賜無且金二百鎰夫為秦所擒生致之功不立藥囊提㓨客益於救主然猶稱賞者意至勢盛也天下之士不以荆軻功不成不稱其義秦王不以無且無見效不賞其志志善不效成功義至不謀就事義有餘效不足志巨大而功細小智者賞之愚者罰之必謀功不察志論陽效不存隂計是則豫讓拔劒斬襄子之衣不足識也伍子胥鞭笞平王尸不足載也張良椎始皇誤中副車不足記也三者道地不便計畫不得有其勢而無其功懐其計而不得為其事是功不可以效賢也三以孝於父弟於兄}
