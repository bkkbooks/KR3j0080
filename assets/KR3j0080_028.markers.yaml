  - {type: 'tls:seg', offset: 5239, content: '', id: KR3j0080_tls_028-57a.16}
  - {type: variant, offset: 5240, length: 0, content: '', SBCK: 之徒也戰國􅀗其功稱爲名將世平能無所施還入禍門矣髙鳥死良弓藏狡兎得良犬烹權詐之臣髙鳥之􅃓狡兎之犬也安平身無冝則􅃓藏而犬烹安平之主非棄臣而賤士世所用助上者非其冝也向令韓信用權變之才為若叔孫通之事}
  - {type: page-break, offset: 5240, content: '', id: KR3j0080_SBCK_028-6a}
  - {type: variant, offset: 5240, length: 0, content: '', WYG: 之徒也戰國獲其功稱為名將世平能無所施還入禍門矣髙鳥死良弓藏狡兎得良犬烹權詐之臣髙鳥之弓狡兎之犬也安平身無宜則弓藏而犬烹安平之主非棄臣而賤士世所用助上者非其宜也向令韓信用權變之才為若叔孫通之事}
  - {type: variant, offset: 5240, length: 0, content: '', krp: 之徒也戰國獲其功稱爲名將世平能無所施還入禍門矣髙鳥死良弓藏狡兎得良犬烹權詐之臣髙鳥之弓狡兎之犬也安平身無冝則弓藏而犬烹安平之主非棄臣而賤士世所用助上者非其冝也向令韓信用權變之才為若叔孫通之事}
  - {type: variant, offset: 5242, length: 0, content: '', SBCK: 謀反誅死之禍哉有功彊之權無守平之智曉將兵之計不見已定之義居平安之時為反逆之謀此其所以功滅國絶不得名為賢也辯於口言甘辭巧為賢乎則夫子貢之徒是也子貢之辯勝顔淵孔子序置於下實才不能髙口辯機利人決能稱之夫自文帝尚多虎圏嗇夫少上林尉張釋之稱周勃張相如文帝乃悟夫辯於口虎圏嗇夫之徒也難以觀賢以敏於筆文墨兩集為賢乎夫筆之與口一實也口出以為言筆書以為文口辯才未必髙然則筆敏知未必多也且筆用何為敏以敏於官曹事事之難者莫過於獄獄疑則有請讞盖世優者莫過張湯張湯文深在漢之朝不稱為賢太史公序累以湯為酷酷非賢者之行魯林中哭婦虎食其夫又食其子不能去者善政不苛吏不暴也夫酷苛暴之黨也難以為賢以敏於賦頌為􅀪麗之文為賢乎則夫司馬長卿楊子雲是也文麗而務巨言眇而趨深然而不能處定是非辯然否之實雖文如錦繡深如河漢民不覺知是非之分無益於彌為崇實之化以清節自守不降志辱身為賢乎是則避世離俗長沮桀溺之類也雖不離俗節與離世者鈞清其身而不輔其主守其節而不勞其民大賢之在世也時行則行時止則止銓可否之宜以制清濁之行子貢讓而止善子路受而觀徳夫讓亷也受則貪也貪有益亷有損推行之節不得常清􅆌也伯夷無可孔子謂之非操違於聖難以為賢矣或問於孔子曰顔淵何人也曰仁人也丘不如也子貢何人也曰辯人也丘弗如也子路何人也曰勇人也丘弗如也客曰三子者皆賢於夫子而為夫子服役何也孔子曰丘能仁且忍辯且詘勇且怯以三子之能易丘之道弗為也孔子知所設施之矣有髙才潔行無知明以設施之則與愚而無操者同一實也夫如是皆有非也無一非者可以為賢乎是則鄉原之人也孟子曰非之無舉也刺之無刺也同於流俗合於汚世居之似忠信行之似亷潔衆皆説之自以為是而不可與入堯舜之道故孔子曰鄉原徳之賊也似之而非者孔子惡之夫如是何以知實賢知賢竟何用世人之檢茍見才髙能茂有}
