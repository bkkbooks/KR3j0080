  - {type: variant, offset: 5635, length: 0, content: '', WYG: 非孔子之心夫春秋實及冬夏不言者亦與不書日月同一實也唐虞夏殷周者土地之名堯以唐侯嗣位舜從虞地得達禹由夏而起湯因殷而興武王階周而伐皆本所興昌之地重本不忘始故以為號若人之有姓矣說尚書謂之有天下之代號唐虞夏殷周者功徳之名盛隆之意也故唐之為言蕩蕩也虞者樂也夏者大也殷者中也周者至也堯則蕩蕩民無能名舜則天下虞樂禹承二帝之業使道尚蕩蕩民無能名殷則道得中周武則功徳無不至其立義美也其褒五家大矣然而違其正實失其初意唐虞夏殷周猶秦之為秦漢之為漢秦起於秦漢興於漢中故曰猶秦漢猶王莽從新都侯起故曰亡新使秦漢在經傳之上說者將復為秦漢作道徳之說矣堯老求禪四嶽舉舜堯曰我其試哉說尚書曰試者用也我其用之為天子也文為天子也文又曰女于時觀厥刑于二女觀者觀爾虞舜於天下不謂堯自觀之也若此者髙大堯舜以為聖人相見已審不須觀試精耀相照曠然相信又曰四門穆穆納于大麓烈風雷雨不迷言大麓三公之位也居一公之位大總錄二公之事衆多並吉若疾風大雨夫聖人才髙未必相知也聖成事舜難知佞使臯陶陳知人之法佞難知聖亦難别堯之才猶舜之知也舜知佞堯知聖堯聞舜賢四嶽舉之心知其竒而未必知其能故言我其試哉試之於職妻以二女觀其夫婦之法職治脩而不廢夫道正而不僻復令人庶之野而觀其聖逢烈風疾雨終不迷惑堯乃知其聖授以天下夫文言觀試觀試其才也說家以為譬喻增飾使事失正是誠而不存曲折失意使偽說傳而不絶造說之傳失之乆矣後生精者茍欲明經不原實而原之者亦校古隨舊重是之文以為說證經之傳不可從五經皆多失實之說尚書春秋行事成文較著可見故頗獨論書解篇或曰士之論髙何必以文荅曰夫人有文質乃成物有華而不實有實而不華者易曰聖人之情見乎辭出口為言集札為文文辭施設實情敷烈夫文徳世服也空書為文實行為徳著之於衣為服故曰徳彌盛者文彌縟徳彌彰者人彌明大人徳擴其文炳小人徳熾其文斑官尊而文繁徳髙而文積華而睆者大夫之簀曽子寢疾命元起易由此言之衣服以品賢賢以文為差愚傑不别須文以立折非唯於人物亦咸然龍鱗有文於蛇為神鳳羽五色於鳥為君虎猛毛蚡蜦龜知背負文四者體不質於物為聖賢且夫山無林則為土山地無毛則為瀉土人無文則為僕人土山無麋鹿瀉土無五糓人無文徳不為聖賢上天多文而后土多理二氣協和聖賢禀受法象本類故多文彩瑞應符命莫非文者晉唐叔虞魯成季友惠公夫人號曰仲子生而怪竒文在其手張良當貴出與神㑹老父授書卒封留侯河神故出圗洛靈故出書竹帛所記怪竒之物不出潢洿物以文為表人以文為基棘子成欲彌文子貢譏之謂文不足竒者子成之徒也著作者為文儒說經者為世儒二儒在世未知何者為優或曰文儒不若世儒世儒說聖人之經解賢者之傳義理廣博無不實見故在官常位位最尊者為博士門徒聚衆招㑹千里身雖死亡學傳於後文儒為華淫之說於世無補故無常官弟子門徒不見一人身死之後莫有紹傳此其所以不如世儒者也荅曰不然夫世儒說聖情共起並驗俱追聖人事殊而務同言異而義鈞何以謂之文儒之說無補於世世儒業易為故世人學之多非事可析第故官廷設其位文儒之業卓絶不循人寡其書業雖不講門雖無人書文竒偉世人亦傳彼虚說此實篇折累二者孰者}
