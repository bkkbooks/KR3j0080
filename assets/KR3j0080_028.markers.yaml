  - {type: 'tls:seg', offset: 5293, content: '', id: KR3j0080_tls_028-57a.28}
  - {type: variant, offset: 5293, length: 0, content: '', SBCK: 之見言詩書則獨謂經謂之書矣傳者或知尚書為秦所燔而謂二十九篇其遺脫不燒者也審若此言尚書二十九篇火之餘也七十一篇為炭灰二十九篇獨遺邪夫伏生年老鼂錯從之學時適得二十餘篇伏生死矣故二十九篇獨見七十一篇遺脫遺脫者七十一篇反謂二十九篇遺脫矣或說尚書二十九篇者法曰斗七宿也四七二十八篇其一曰斗矣故二十九夫尚書滅絶於秦其見在者二十九篇安得法乎宣帝之時得佚尚書及易禮各一篇禮易篇數亦始足焉得有法案百篇之序闕遺者七十一篇獨為二十九篇立法}
