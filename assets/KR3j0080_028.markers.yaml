  - {type: variant, offset: 1961, length: 277, content: 知孔子責人幾微自改矣明文以識之流言以過之以其言示端而己自改自改不在言之輕重在宰予能更與否春秋之義采毫毛之善貶纖介之惡襃毫毛以巨大以巨大貶纖介觀春秋之義肯是之乎不是則宰我不受不受則孔子之言棄矣聖人之言與文相副言出於口文立於策俱發於心其實一也孔子作春秋不貶小以大其非宰予也以大惡細文語相違服人如何子曰始吾於人也聽其言而信其行今吾於人也聽其言而觀其行於予予改是蓋起宰予晝寢更知人之術也問曰人之晝寢安足以毀行毀行之人晝夜不臥安足以成善以晝寢而觀人善惡能得其實乎案宰予在孔子之門序於四科列在賜上如性情怠不可彫琢何以致此使宰我以晝寢自致此才復過人遠矣如未成就自謂已足, SBCK: ''}
