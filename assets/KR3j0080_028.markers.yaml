  - {type: variant, offset: 394, length: 424, content: 及生時也世人解說說人者非必須聖人教告乃敢言也苟有不曉解之問追難孔子何傷於義誠有傳聖業之知伐孔子之說何逆於理謂問孔子之言難其不解之文世間弘才大知生能荅問解難之人必將賢吾世間難問之言是非孟懿子問孝子曰毋違樊遲御子告之曰孟孫問孝於我我對曰毋違樊遲曰何謂也子曰生事之以禮死葬之以禮祭之以禮問曰孔子之言毋違毋違者禮也孝子亦當先意承志不當違親之欲孔子言毋違不言違禮懿子聽孔子之言獨不為嫌於毋違志乎樊遲問何謂孔子乃言生事之以禮死葬之以禮祭之以禮使樊遲不問毋違之說遂不可知也懿子之才不過樊遲故論語篇中不見言行樊遲不曉懿子必能曉哉孟武伯問孝子曰父母唯其疾之憂武伯善憂父母故曰唯其疾之憂武伯憂親懿子違禮攻其短荅武伯云父母唯其疾之憂對懿子亦宜言唯水火之變乃違禮周公告小才勑大材略樊遲大材也孔子告之勑懿子小才也告之反略違周公之志攻懿子之短失道理之宜弟子不難何哉如以懿子權尊不敢極言則其對武伯亦宜但言毋憂而已俱孟氏子也權尊鈞同勑武伯而略懿子未曉其故也使孔子對懿子極言毋違禮何, SBCK: 弗}
