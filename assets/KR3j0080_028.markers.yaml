  - {type: variant, offset: 2754, length: 934, content: 好學今也則亡不遷怒不貳過何也曰并攻哀公之性遷怒貳過故也因其問則并以對之兼以攻上之短不犯其罰問曰康子亦問好學孔子亦對之以顏淵康子亦有短何不并對以攻康子康子非聖人也操行猶有所失成事康子患盜孔子對曰苟子之不欲雖賞之不竊由此言之康子以欲為短也不攻何哉孔子見南子子路不悅子曰予所鄙者天厭之天厭之南子衛靈公夫人也聘孔子子路不說謂孔子淫亂也孔子解之曰我所為鄙陋者天厭殺我至誠自誓不負子路也問曰孔子自解安能解乎使世人有鄙陋之行天曾厭殺之可引以誓子路聞之可信以解今未曾有為天所厭者也曰天厭之子路肯信之乎行事雷擊殺人水火燒溺人墻屋壓填人如曰雷擊殺我水火燒溺我墻屋壓填我子路頗信之今引未曾有之禍以自誓於子路子路安肯解而信之行事適有臥厭不悟者謂此為天所厭邪案諸臥厭不悟者未皆為鄙陋也子路入道雖淺猶知事之實事非實孔子以誓子路必不解矣孔子稱曰死生有命富貴在天若此者人之死生自有長短不在操行善惡也成事顏淵蚤死孔子謂之短命由此知短命夭死之人未必有邪行也子路入道雖淺聞孔子之言知死生之實孔子誓以予所鄙者天厭之獨不為子路言夫子惟命未當死天安得厭殺之乎若此誓子路以天厭之終不見信不見信則孔子自解終不解也尚書曰毋若丹朱敖惟慢游是好謂帝舜勑禹毋予不肖子也重天命恐禹私其子故引丹朱以勑戒之禹曰予娶若時辛壬癸甲開呱呱而泣予弗子陳己行事以往推來以見卜隱效己不敢私不肖子也不曰天厭之者知俗人誓好引天也孔子為子路行所疑不引行事效己不鄙而云天厭之是與俗人解嫌引天祝詛何以異乎孔子曰鳳鳥不至河不出圖吾已矣夫夫子自傷不王也己王致太平太平則鳳鳥至河出圖矣今不得王故瑞應不至悲心自傷故曰吾已矣夫問曰鳳鳥河圖審何據如據始起始起之時鳥圖未至如據太平太平之帝未必常致鳳鳥與河圖也五帝三王皆致太平案其瑞應不皆鳳皇為必然之瑞於太平鳳皇為未必然之應孔子聖人也思未必然以自傷終不應矣或曰孔子不自傷不得王也傷時無明王故己不用也鳳鳥河圖明王之瑞也瑞應不至時無明王明王不存己遂不用矣夫致瑞應何以致之任賢使能治定功成治定功成則瑞應至矣瑞應至後亦不須孔子孔子所望何其末也不思其本而望其末也不相其主而名其物治有未定物有不至以至而效明王必失之矣孝文皇帝可謂明矣案其本紀不見鳳鳥與河圖使孔子在孝文之世猶曰吾已矣夫子欲居九夷或曰陋如之何子曰君子居之何陋之有孔子疾, SBCK: ''}
