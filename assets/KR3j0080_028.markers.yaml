  - {type: variant, offset: 5369, length: 2, content: 信食, SBCK: 三百篇猶二十九篇也謂二十九篇有法是謂三百五篇復有法也或說春秋十二月也春秋十二公猶尚書之百篇百篇無所法十二公安得法說春秋者曰二百四十二年人道浹王道備善善惡惡撥亂世反諸正莫近於春秋若此者人道王道適具足也三軍六師萬二千人足以陵敵伐冦横行天下令行禁止未必有所法也孔子作春秋紀魯十二公猶三軍之有六師也士衆萬二千猶年有二百四十二也六師萬二千人足以成軍十二公二百四十二年足以立義說事者好神道恢義不肖以遭禍是故經傳篇數皆有所法考實根本論其文義}
