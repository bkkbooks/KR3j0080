  - {type: variant, offset: 5243, length: 0, content: '', SBCK: 功見效則謂之賢若此甚易知賢何難書曰知人則哲惟帝難之據才髙卓異者則謂之賢耳何難之有然而難之獨有難者之故也夫虞舜不易知人而世人自謂能知賢誤也然則賢者竟不可知乎曰易知也而稱難者不見所以知之則難聖人不易知也及見所以知之中才而察之譬猶工匠之作器也曉之則無難不曉則無易賢者易知於作器世無别故真賢集於俗士之間俗士以辯惠之能據官爵之尊望顯盛之寵遂專爲賢之名賢者還在閭巷之間貧賤終老被無驗之謗若此何時可知乎然而必欲知之觀善心也夫賢者才能未必髙也而心明智力未必多而舉是何以觀心必以言有善心則有善言以言而察行有善言則有善行矣言行無非治家親戚有倫治國則尊卑有序無善心者白黒不分善惡同倫政治錯亂法度失平故心善無不善也心不善無能善心善則能辯然否然否之義定心善之效明雖貧賤困窮功不成而效不立猶為賢矣故治不謀功要所用者是行不責效期所為者正正是審明則言不湏繁事不湏多故曰言不務多務審所謂行不務逺務審所由言得道理之心口雖訥不辯辯在胷臆之内矣故人欲心辯不欲口辯心辯則言醜而不違口辯則辭好而無成孔子稱少正夘之惡曰言非而博順非而澤内非而外以才能餝之衆不能見則以為賢夫内非外餝是世以為賢則夫内是外無以自表者衆亦以為不肖矣是非亂而不治聖人獨知之人言行多若少正夘之類賢者獨識之世有是非錯繆之言亦有審誤紛亂之事決錯繆之言定紛亂之事唯賢聖之人為能任之聖心明而不闇賢心理而不亂用明察非非無不見用理銓疑疑無不定與世殊指雖言正是衆不曉見何則沉溺俗言之日乆不能自還以從實也是故正是之言為衆所非離俗之禮為世所譏管子曰君子言堂滿堂言室滿室怪此之言何以得滿如正是之言出堂之人皆有正是之知然后乃滿如非正是人之乖㓨異安得爲滿夫歌曲妙者和者則寡言得實者然者則鮮和歌與聽言同一實也曲妙人不能盡和言是人不能皆信魯文公逆祀去者三人定公順祀畔者五人貫於俗者則謂禮爲非曉禮者寡則知是者希君子言之堂室安能滿夫人不謂之滿世則不得見口談之實語筆墨之餘跡陳在簡筴之上乃可得知故孔子不王作春秋以明意案春秋虚文業以知孔子能王之德孔子聖人也有若孔子之業者雖非孔子之才斯亦賢者之實驗也夫賢與聖同軌而殊名賢可得定則聖可得論也問周道不弊孔子不作春秋}
