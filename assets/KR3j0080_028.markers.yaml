  - {type: variant, offset: 5246, length: 0, content: '', WYG: 作起周道弊也如周道不弊孔子不作者未必無孔子之才無所起也夫如是孔子之作春秋未可以觀聖有若孔子之業者未可知賢也曰周道弊孔子起而作之文義褒貶是非得道理之實無非僻之誤以故見孔子之賢實也夫無言則察之以文無文則察之以言設孔子不作猶有遺言言必有起猶文之必有為也觀文之是非不顧作之所起世間為文者衆矣是非不分然否不定桓君山論之可謂得實矣論文以察實則君山漢之賢人也陳平未仕割肉閭里分均若一能為丞相之驗也夫割肉與割文同一實也如君山得執漢平用心與為論不殊指矣孔子不王素王之業在於春秋然則桓君山素丞相之跡存於新論者也論衡卷二十七欽定四庫全書論衡卷二十八漢王充撰正說篇書解篇正說篇儒者說五經多失其實前儒不見本末空生虛說後儒信前師之言隨舊述故滑習辭語茍名一師之學趨為師教授及}
