  - {type: variant, offset: 5634, length: 0, content: '', SBCK: 經可以奉始養終故號為春秋春秋之經何以異尚書尚書者以為上古帝王之書或以為上所為下所書授事相實而爲名不依違作意以見竒說尚書者得經之實說春秋者失聖之意矣春秋左氏傳桓公十有七年冬十月朔日有食之不書日官失之也謂官失之言盖其實也史官記事若今時縣官之書矣其年月尚大難失日者微小易忘也盖紀以善惡爲實不以日月爲意若夫公羊􅂖梁之傳日月不具輒爲意使失平常之事有怪異之􅀃徑直之文有曲折之}
  - {type: page-break, offset: 5634, content: '', id: KR3j0080_SBCK_028-18a}
