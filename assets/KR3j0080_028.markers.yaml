  - {type: variant, offset: 7, length: 3, content: 好信師, SBCK: 以無功不察其賢燕有谷氣寒不生五􅂖鄒衍吹律致氣旣寒更爲温燕以種黍黍生豐熟到今名之曰黍谷夫和隂陽當以道徳至誠然}
  - {type: variant, offset: 7, length: 3, content: 好信師, WYG: 以無功不察其賢燕有谷氣寒不生五糓鄒衍吹律致氣既寒更為温燕以種黍黍生豐熟到今名之曰黍谷夫和隂陽當以道徳至誠然}
  - {type: variant, offset: 7, length: 3, content: 好信師, krp: 以無功不察其賢燕有谷氣寒不生五糓鄒衍吹律致氣旣寒更爲温燕以種黍黍生豐熟到今名之曰黍谷夫和隂陽當以道徳至誠然}
  - {type: variant, offset: 11, length: 0, content: '', SBCK: 鄒衍吹律寒谷更温黍榖育生推此以況諸有成功之類有若鄒衍吹律之法故得其術也不肖無所能失其數也賢聖有不治此功不可以效賢二也人之舉事或意至而功不成事不立而勢貫山荆軻醫夏無且}
