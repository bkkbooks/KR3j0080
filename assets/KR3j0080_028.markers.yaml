  - {type: variant, offset: 5288, length: 4, content: 貢去食存, SBCK: 不讀經則有博戯之心子路使子羔為費宰孔子曰賊夫人之子子路曰有民人焉有社稷焉何必讀書然後為學五經總名為書傳者不知秦燔書所起故不審燔書之實秦始皇二十四年置酒咸陽宫博士七十人前為夀僕射周青臣進頌秦始皇齊人淳于越進諫以為始皇不封子弟卒有田常六卿之難無以救也譏青臣之頌謂之為䛕秦始皇下其議丞相府丞相斯以為越言不可用因此謂諸生之言惑亂黔首乃令史官盡燒五經有敢蔵諸書百家語者刑唯博士官乃得有之五經皆燔非獨諸家之書也傳者}
