  - {type: variant, offset: 226, length: 167, content: 盡解說道陳義不能輒勑不能輒勑宜問以發之不能盡解宜難以極之皋陶陳道帝舜之前淺略未極禹問難之淺言復深略指復分蓋起問難䚹說激而深切觸而著明也孔子笑子游之絃歌子游引前言以距孔子自今案論語之文孔子之言多若笑弦歌之辭弟子寡若子游之難故孔子之言遂結不解以七十子不能難世之儒生不能實道是非也凡學問之法不為無才難於距師核道實義證定是非也問難之道非必對聖, SBCK: 使}
