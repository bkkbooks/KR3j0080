  - {type: variant, offset: 5287, length: 0, content: '', SBCK: 授堂以為殿得百篇尚書於墻壁中武帝使使者取視莫能讀者遂祕於中外不得見至孝成皇帝時徴為古文尚書學東海張霸案百篇之序空造百兩之篇獻之成帝帝出祕百篇以校之皆不相應於是下霸於吏吏白霸罪當至死成帝髙其才而不誅亦惜其文而不滅故百兩之篇傳在世間者傳見之人則謂尚書本有百兩篇矣或言秦燔詩書者燔詩經之書也其經不燔焉夫詩經獨燔其書書五經之總名也傳曰男}
