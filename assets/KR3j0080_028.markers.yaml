  - {type: variant, offset: 5295, length: 0, content: '', SBCK: 或說曰孔子更選二十九篇二十九篇獨有法也盖俗儒之說也未必傳記之明也二十九篇殘而不足有傳之者因不足之數立取法之說失聖人之意違古今之實}
