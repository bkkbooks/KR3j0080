  - {type: variant, offset: 2293, length: 201, content: 棄其言取其言則棄其行今宰予雖無力行有言語用言令行缺有一概矣今孔子起宰予晝寢聽其言觀其行言行相應則謂之賢是孔子備取人也毋求備於一人之義何所施子張問令尹子文三仕為令尹無喜色三已之無慍色舊令尹之政必以告新令尹何如子曰忠矣曰仁矣乎曰未知焉得仁子文曾舉楚子玉代己位而伐宋以百乘敗而喪其眾不知如此安得為仁問曰子文舉子玉不知人也智與仁不相干也有不知之性何妨為仁之行五常之道仁義禮智信也五者各別不相須而成故有智人有仁人, SBCK: 夫委國}
