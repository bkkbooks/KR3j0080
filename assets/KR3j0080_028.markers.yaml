  - {type: variant, offset: 5681, length: 0, content: '', SBCK: 不作休思慮間也周法闊疎不可因也夫禀天地之文發於胷臆豈為間作不暇日哉感偽起妄源流氣烝管仲相桓公致於九合商鞅相孝公為秦開帝業然而二子之書篇章數十長卿子雲二子之倫也俱感故才並才同故業鈞皆士而各著不以思慮間也問事彌多而見彌博官彌劇而識彌泥居不幽則思不至思不至則筆不利嚚頑之人有幽室之思雖無憂不能著一字盖人材有能無有不暇有無材而不能思無有知而不能著有鴻材欲作而無起細知以問而能記盖竒有無所因無有不能言兩有無所睹無不暇造作或曰凡作者精思已極居位不能領職盖人思有所倚着則精有所盡索著作之人書言通竒其材已極其知已罷案古作書者多位布散槃解輔傾寜危非著作之人所能為也夫有所偪有所泥則有所自篇章數百吕不韋作春秋舉家徙蜀淮南王作道書禍至滅族韓非著治術身下秦獄身且不全安能輔國夫有長於彼安能不短於此深於作文安能不淺於政治荅曰人有所優固有所劣人有所工固有所拙非劣也志意不為也非拙也精誠不加也志有所存顧不見泰山思有所至有身不暇徇也稱干將之利刺則不能撃撃則不能刺非刄不利不能一且二也蛢彈雀則失鷜射鵲則失鴈方貟畫不俱成左右視不並見人材有兩為不能成一使干將寡刺而更擊蛢捨鵲而射鴈則下射無失矣人委其篇章專為政治則子産子賤之跡不足侔也古作書者多立功不用也管仲晏嬰功書並作商鞅虞卿篇治俱為髙祖既得天下馬上之計未敗陸賈造新語髙祖粗納采吕氏横逆劉氏將傾非陸賈之䇿帝室不寧盖材知無不能在所遭遇遇亂則知立功有起則以其材著書者也出口為言著文為篇古以言為功者多以文為敗者希吕不韋淮南王以他為過不以書有非使客作書不身自為如不作書猶􅀩此章章之禍人古今違屬未必皆著作材知極也鄒陽舉疏免罪於梁徐樂上書身拜郎中材能以其文為功於人何嫌不能營衛其身韓蚤信公子非國不傾危及}
