  - {type: variant, offset: 5236, length: 3, content: 言去食, SBCK: 具存雖帶徒百人以上位博士文學郵人門者之類也以通覽古今祕隱傳記無所不記爲賢乎是則傳者之次也才髙好事勤學不舍若專成之苗裔有世祖遺文得成其篇業觀覽諷誦若典官文書若太史公及劉子政之徒有主領書記之職則有博覽通逹之名矣以權詐卓譎能將兵御衆爲賢乎是韓}
