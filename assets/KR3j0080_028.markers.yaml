  - {type: variant, offset: 6017, length: 412, content: 或曰權時欲行道也即權時行道子路難之當云行道不當言食有權時以行道無權時以求食吾豈匏瓜也哉焉能繫而不食自比以匏瓜者言人當仕而食祿我非匏瓜繫而不食非子路也孔子之言不解子路之難子路難孔子豈孔子不當仕也哉當擇善國而入之也孔子自比匏瓜孔子欲安食也且孔子之言何其鄙也何徒仕為食哉君子不宜言也匏瓜繫而不食亦繫而不仕等也距子路可云吾豈匏瓜也哉繫而不仕也今言擊而不食孔子之仕不為行道徒求食也人之仕也主貪祿也禮義之言為行道也猶人之娶也主為欲也禮義之言為供親也仕而直言食娶可直言欲乎孔子之言解情而無依違之意不假義理之名是則俗人非君子也儒者說孔子周流應聘不濟閔道不行失孔子情矣公山弗擾以費畔召子欲往子路曰末如也已何必公山氏之之也子曰夫召我者而豈徒哉如用我吾其為東周乎為東周欲行道也公山佛肸俱畔者行道於公山求食於佛肸孔子之言無定趨也言無定趨則行無常務矣周流不用豈獨有以乎陽貨欲見之不見呼之仕不仕何其清也公山佛肸召之欲往何其濁也公山不擾與陽虎俱畔執季桓子, SBCK: 論衡卷第}
