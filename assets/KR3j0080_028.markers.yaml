  - {type: 'tls:seg', offset: 5235, content: '', id: KR3j0080_tls_028-57a.15}
  - {type: variant, offset: 5235, length: 0, content: '', SBCK: 人或割財助用袁將軍再與兄子分家財多有以為恩義崑山之下以玉為石彭蠡之濱以魚食犬豕使推讓之人財若崑山之玉彭蠡之魚家財再分不足為也韓信寄食於南昌亭長何財之割顔淵簞食瓢飲何財之讓管仲分財取多無廉讓之節貧乏不足志義廢也以避世離俗清身潔行為賢乎是則委國去位之類也富貴人情所貪髙官大位人之所欲樂去之而隠生不遭遇志氣不得也長沮桀溺避世隠居伯夷於陵去貴取賤非其志也恬憺無欲志不在於仕茍欲全身養性為賢乎是則老􅅨之徒也道人與賢殊科者憂世濟民於難是以子孔棲棲墨子遑遑不進與孔墨合務而還與黄老同操非賢也以舉義千里師將朋友無廢禮為賢乎則夫家富財饒筋力勁彊者能堪之匱乏無以舉禮羸弱不能奔逺不能任也是故百金之家境外無絶交千乗之國同盟無廢贈財多故也使榖食如水火雖貪恡之人越境而布施矣故財少則正禮不能舉一有餘則妄施能於千家貧無斗筲之儲者難責以交施矣舉檐千里之人杖筴越疆之士手足胼胝面目驪黑無傷感不任之疾筋力皮革必有與人異者矣推此以況為君要證之吏身被疾痛而口無一辭者亦肌􅁏骨節堅彊之故也堅彊則能隠事而立義軟弱則誣時而毁節豫讓自賊妻不能識貫髙被箠身無完肉實體有不與人同者則其節行有不與人鈞者矣以經明帯徒聚衆為賢乎則夫經明儒者是也儒者學之所為也儒者學學儒矣傳先師之業習口說以教無胷中之造思定然否之論郵人之過書門者之傳教也封完書不遺教審令不遺誤者則為善矣傳者傳學不妄一言先師古語到}
