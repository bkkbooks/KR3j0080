  - {type: variant, offset: 5407, length: 0, content: '', SBCK: 殷因於夏禮所損益可知也周因於殷禮所損益可知也由此言之夏殷周各自有禮方今周禮邪夏殷也謂之周禮周禮六典案今禮經不見六典或時殷禮未絶而六典之禮不傳世因謂此為周禮也案周官之法不與今禮相應然則周禮六典是也其不傳猶古文尚書春秋左氏不興矣說論者皆知說文解語而已不知論語本幾何篇但周以八寸為尺不知論語所獨一尺之意}
