  - {type: variant, offset: 16, length: 1, content: 聖, SBCK: 乎則夫孝弟之人有父兄者也父兄不慈孝弟乃章舜有瞽瞍參有曾晳孝立名成衆人稱之如無父兄父兄慈良章無顯之效孝弟之名無}
