  - {type: variant, offset: 819, length: 614, content: 之有專魯莫過季氏譏八佾之舞庭刺太山之旅祭不懼季氏憎邑不隱諱之害獨畏荅懿子極言之罪何哉且問孝者非一皆有御者對懿子言不但心服臆肯故告樊遲孔子曰富與貴是人之所欲也不以其道得之不居也貧與賤是人之所惡也不以其道得之不去也此言人當由道義得不當苟取也當守節安貧不當妄去也夫言不以其道得富貴不居可也不以其道得貧賤如何富貴顧可去去貧賤何之去貧賤得富貴也不得富貴不去貧賤如謂得富貴不以其道則不去貧賤邪則所得富貴不得貧賤也貧賤何故當言得之顧當言貧與賤是人之所惡也不以其道去之則不去也當言去不當言得得者施於得之也今去之安得言得乎獨富貴當言得耳何者得富貴乃去貧賤也是則以道去貧賤如何脩身行道仕得爵祿富貴得爵祿富貴則去貧賤矣不以其道去貧賤如何毒苦貧賤起為姦盜積聚貨財擅相官秩是為不以其道七十子既不問世之學者亦不知難使此言意結不解而文不分是謂孔子不能吐辭也使此言意結文又不解是孔子相示未勑悉也弟子不問世俗不難何哉孔子曰公冶長可妻也雖在縲紲之中非其罪也以其子妻之問曰孔子妻公冶長者何據見哉據年三十可妻邪見其行賢可妻也如據其年三十不宜稱在縲紲如見其行賢亦不宜稱在縲紲何則諸入孔子門者皆有善行故稱備徒役徒役之中無妻則妻之耳不須稱也如徒役之中多無妻公冶長尤賢故獨妻之則其稱之宜列其行不宜言其在縲紲也何則世間彊受非辜者多未必盡賢人也恆人見枉眾多非一必以非辜為孔子所妻則是孔子不妻賢妻冤也案孔子之稱公冶長有非辜之言無行能之文實不賢孔子妻之非也實賢孔子稱之不具亦非也誠似妻, SBCK: ''}
