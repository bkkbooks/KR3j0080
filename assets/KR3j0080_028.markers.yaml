  - {type: variant, offset: 5404, length: 0, content: '', WYG: 紀十二公者以為十二公事適足以見王義邪據三世三世之數適得十二公而足也如據十二公則二百四十二年不為三世見也如據三世取三八之數二百四十年而已何必取二說者又曰欲合隠公之元也不取二年隠公元年不載於經夫春秋自據三世之數而作何用隠公元年之事為始須隠公元年之事為始是竟以備足為義據三世之說不復用矣設隠公享國五十年將盡紀元年以來邪中斷以備三八之數也如盡紀元年以來三八之數則中斷如中斷以備三世之數則隠公之元不合何如且年與月日小大異耳其所紀載同一實也二百四十二年謂之據三世二百四十二年中之日月必有數矣年據三世日月多少何據哉夫春秋之有年也猶尚書之有章章以首義年以紀事謂春秋之年有據是謂尚書之章亦有據也說易者皆謂伏羲作八卦文王演為六十四夫聖王起河出圗洛出書伏羲王河圗從河水中出易卦是也禹之時得洛書書從洛水中出洪範九疇是也故伏羲以卦治天下禹案洪範以治洪水古者黄帝氏之王得河圗夏后因之曰連山烈山氏之王得河圗殷人因之曰歸藏伏羲氏之王得河圖周人因之曰周易其經卦皆六十四文王周公因彖十八章究六爻世之傳說易者言伏羲作八卦不實其本則謂伏羲真作八卦也伏羲得八卦非作之文王得成六十四非演之也演作之言生於俗傳茍信一文使夫真是幾滅不存既不知易之為河圗又不知存於俗何家易也或時連山歸蔵或時周易案禮夏殷周三家相損益之制較著不同如以周家在後論今為周易則禮亦宜為周禮六典不與今禮相應今禮未必為周則亦疑今易未必為周也案左丘明之傳引周家以卦與今易相應殆周易也說禮者皆知禮也為禮何家禮也}
