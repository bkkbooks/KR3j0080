  - {type: variant, offset: 18, length: 8, content: 言皆無非專精講習, SBCK: 見矣忠於君者亦與此同龍逢比干忠著夏殷桀紂惡也稷契臯陶忠闇唐虞堯舜賢也故螢火之明掩於日月之光忠臣之聲蔽於賢君之名死君之難出命捐身與此同臣遭其時死其難故立其義而獲其名大賢之涉世也翔而後集色斯而舉亂君之患}
