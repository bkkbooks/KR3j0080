  - {type: variant, offset: 17, length: 0, content: '', WYG: 一冇曰字其吐文萬牒以上可謂多力矣世稱力者常襃烏獲然則董仲舒揚子雲文之烏獲也秦武王與孟説舉鼎不任絶脈而死少文之人與董仲舒等涌胸中之思必將不任有絶脈之變王莽之時省五經章句皆爲二十萬博士弟子郭路夜定舊説死於燭下精思不任絶脈氣滅也顔氏之子已曾馳過孔子於塗矣劣倦罷極髪白齒落夫以庶幾之材猶有仆頓之禍孔子力優顔淵不任也才力不相如則其知思不相及也勉自什伯鬲中嘔血失䰟狂亂遂至氣絶書五行之牘書十奏之記其才劣者筆墨之力尤難況乃連句結章篇至十百哉力獨多矣江河之水馳涌滑漏席地長逺無枯竭之流本源盛矣知江河之流逺地中之源盛不知萬牒之人胷中之才茂一有無字迷惑者也故望見驥足不異於衆馬之蹄躡平陸而馳騁千里之跡斯須可見夫馬足人手同一實也稱驥之足不薦文人之手不知類也夫能論筋力以見比類者則能取文力之人立之朝廷故夫文力之人助有力之將乃能以力爲功有力無助以力爲禍何以驗之長巨之物彊力之人乃能舉之重任之車彊力之牛乃能輓之是任車上阪彊牛引前人力推後乃能升踰如牛羸人罷任車退却還墮坑谷有破覆之敗矣文儒懷先王之道含百家之言其難推引非徒任車之重也薦致之者罷羸無力遂却退竄於巖穴矣河發崑崙江起岷山水力盛多滂沛之流浸下益盛不得廣岸低地不能通流入乎東海如岸狹地仰溝洫決泆散在丘墟矣文儒之知有似於此文章滂沛不遭有力之將援引薦舉亦將棄遺於衡門之下固安得升陟聖主之庭論説政事之務乎火之光也不舉不明有人於斯其知如京其德如山力重不能自稱須人乃舉而莫之助抱其盛髙之力竄於閭巷之深何時得達奡育古之多力者身能負荷千鈞手能決角伸鉤使之自舉不能離地智能滿胷之人宜在王闕須三寸之舌一尺之筆然後自動不能自進進之又不能自安須人能動待人能安道重知大位地難適也小石附於山山力能得持之在沙丘之間小石輕微亦能自安至於大石沙土不覆山不能持處危峭之際則必崩墜於坑谷之間矣大智之重遭小才之將無左右沙土之助雖在顯位將不能持則有大石崩墜之難也或伐薪於山輕小之木合能束之至於大木十圍以上引之不能動推之不能移則委之於山林收所束之小木而歸由斯以論知能之大者其猶十圍以上木也人力不能舉薦其猶薪者不能推引大木也孔子周流無所留止非聖才不明道大難行人不能用也故夫孔子山中巨木之類也桓公九合諸侯一匡天下管仲之力管仲有力桓公能舉之可謂壯彊矣吳不能用子胥楚不能用屈}
