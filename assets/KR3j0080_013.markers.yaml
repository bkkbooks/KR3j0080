  - {type: variant, offset: 766, length: 2, content: 夫中, SBCK: 竹帛不紀者屈原在其上也㑹稽文才豈獨周長生哉所以末論列者長生尤踰出也九州多山而華岱爲嶽四方多川而江河爲瀆者華岱高而江河大也長生州郡高大者也同姓之伯賢舍而譽他族之孟未爲得也長生説文辭之伯文}
