  - {type: variant, offset: 102, length: 0, content: '', WYG: 不通覽者薄社之類也是故氣不通者彊壯之人死榮華之物枯東海之中可食之物雜糅非一以其大也海水精氣渥盛故其生物也衆多竒異故夫大人之胷懷非一才髙知大故其於道術無所不包學士同門髙業之生衆共宗之何則知經指深曉師言多也夫古今之事百家之言其爲深多也豈徒師門髙業之生哉甘酒醴不酤飴蜜未爲能知味也耕夫多殖嘉榖謂之上農夫其少者謂之下農夫學士之才農夫之力一也能多種榖謂之上農能博學問謂之上儒是稱牛之服重不譽馬速也譽手毁足孰謂之慧矣縣道不通於野野路不達於邑騎馬乗舟者必不由也故血脈不通人以甚病夫不通者惡事也故其禍變致不}
