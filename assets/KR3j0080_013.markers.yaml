  - {type: variant, offset: 25, length: 2, content: 防樂, WYG: 業不知是非其爲閉闇甚矣此則土木之人耳目俱足無聞見也渉淺水者見蝦其頗深者察魚鼈其尤甚者觀蛟龍足行跡殊故所見之物異也入道淺深其猶此也淺者則見傳記諧文深者入聖室觀秘書故入道彌深所見彌大人之遊也必欲入都都多竒觀也入都必欲見市市多異貨也百家之言古今行事其}
