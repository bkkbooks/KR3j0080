  - {type: variant, offset: 21, length: 2, content: 極禮, WYG: 魚遞相吞食度口所能容然後嚥之口不能受哽咽不能下故夫商鞅三説孝公後説者用前二難用後一易行也觀管仲之明法察商鞅之耕戰固非弱劣之主所能用也六國之時賢才之臣入楚楚重出齊齊輕爲趙趙完畔魏魏傷韓用申不害行其三符兵不侵境盖十五年不能用之又不察其書兵挫軍破國并於秦殷周之世亂跡相屬亡禍比肩豈其心不欲爲治乎力弱智劣不能納至言也是故塠重一人之跡不能蹈也礚大一人之掌不能推也賢臣有勁彊之優愚主有不堪之劣以此相求禽魚相與遊也干將之刃人不推頓苽瓠不能傷篠簵之箭機不能動發魯縞不能穿非無干將篠簵之才也無推頓發動之主苽瓠魯縞不穿傷焉望斬旗穿革之功乎故引弓之力不能引彊弩弩力五石引以三石筋絶骨折不能舉也故力不任彊引則有變惡折脊之禍知不能用賢則有傷德毁名之敗論事者不曰才大道重上不能用而曰不肖不能自達自達者𢃄絶不抗自衒者賈賤不讎案諸爲人用之物須人用之功力乃立鑿所以入木者槌叩之也鍤所以能撅地者跖蹈之也諸有鋒刅之器所以能斷斬割削者手能把持之也力能推引之也韓信去楚入漢項羽不能安髙祖能持之也能用其善能安其身則能量其力能别其功矣樊酈有攻城野戰之功髙祖行封先及蕭何則比蕭何於獵人同樊酈於獵犬也夫蕭何安坐樊酈馳走封不及馳走而先安坐者蕭何以知爲力而樊酈以力爲功也蕭何所以能使樊酈者以入秦收斂文書也衆將拾金何獨掇書坐知秦之形勢是以能圖其利害衆將馳走者何驅之也故叔孫通定儀而髙祖以尊蕭何造律而漢室以寜案儀律之功重於野戰斬首之力不及尊主故夫墾草殖榖農夫之力也勇猛攻戰士卒之力也構架斵削工匠之力也治書定簿佐史之力也論道議政賢儒之力也人生莫不有力所以爲力者或尊或卑孔子能舉北門之闗不以力自章知夫筋骨之力不如仁義之力榮也别通篇富人之宅以一丈之地爲内内中所有柙匱所羸縑布絲綿也貧人之宅亦以一丈爲内内中空虛徒四壁立故名曰貧夫通人猶富人不通者猶貧人也俱以七尺爲形通人胷中懷百家之言不通者空腹無一牒之誦貧人之内徒四所壁立也慕料貧富不相如則夫通與不通不相及也世人慕富不榮通羞貧不賤不賢不推類以況之也夫富人可慕者貨財多則饒裕故人慕之夫富人不如儒生儒生不如通人通人積文十篋以上聖人之言賢者之語上自黄帝下至秦漢治國肥家之術刺世譏俗之言備矣使人通明博見其爲可榮非徒縑布絲綿也蕭何入秦收拾文書漢所以能制九州者文書之力也以文書御天下天下之富孰與家人之財人目不見青黄曰盲耳不聞宫商曰聾鼻不知香臭曰癕癕聾與盲不成人者也人不博覽者不聞古今不見事類不知然否猶目盲耳聾鼻癕者也儒生不覽猶}
