  - {type: variant, offset: 32, length: 4, content: 卑謙辭讓, WYG: 鹽井之利乎不與賢聖通業望有髙世之名難哉法令之家不見行事議罪不可審章句之生不覽古今論事不實或以説一經爲是何須博覽夫孔子之門講習五經五經皆習庶幾之才也顔淵曰博我以文才智髙者能爲博矣顔淵之曰博者豈徒一經哉我不能博五經又不能博衆事守信一學不好廣觀無温}
