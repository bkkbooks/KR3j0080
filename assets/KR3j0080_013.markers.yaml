  - {type: variant, offset: 1075, length: 177, content: 一歲嬰兒無推讓之心見食號欲食之睹好啼欲玩之長大之後禁情割欲勉厲為善矣劉子政非之曰如此則天無氣也陰陽善惡不相當則人之為善安從生陸賈曰天地生人也以禮義之性人能察己所以受命則順順之謂道夫陸賈知人禮義為性人亦能察己所以受命性善者不待察而自善性惡者雖能察之猶背禮畔義義挹於善不能為也故貪者能言廉亂者能言治盜跖非人之竊也莊蹻刺人之濫也明能察己口能論賢性惡不為何益於善, SBCK: 高祖讀}
