  - {type: variant, offset: 61, length: 0, content: '', SBCK: 入木者槌叩之也鍤所以能撅地者跖蹈之也諸有鋒刃之器所以能斷斬割削者手能把持之也力能推引之也韓信去楚入漢項羽不能安高祖能持之也能用其善能安其身則能量其力能别其功矣樊酈有攻城野戰之功髙祖行封先及蕭何則比蕭何於獵人同樊酈於獵犬也夫蕭何安坐樊酈馳走封不及馳走而先安坐者蕭何以知爲力而樊酈以力爲功也蕭何所以能使樊酈者以入秦收歛文書也衆將拾金何獨掇書坐知秦之形􅀔是以能圖其利害衆將馳走者何驅之也故叔孫通定儀而高祖以尊蕭何造律而漢室以寧案儀律之功重於野戰斬首之力不及尊主故夫墾草殖榖農夫之力也勇猛攻戰士卒之力也構架斵削工匠之力也治書定簿佐史之力也論道議政賢儒之力也人生莫不有力所以爲力者或尊或卑孔子能舉北門之􅀜不以力自章知夫䈥骨之力不如仁義之力榮也别通篇冨人之宅以一丈之地爲内内中所有柙匱所羸縑布絲綿也貧人之宅亦以一丈爲内内中空虚徒四壁立故名曰貧夫通人猶冨人不通者猶貧人也俱以七尺爲形通人胷中懷百家之言不通者空腹無一牒之誦貧人之内徒四所壁立也慕料貧富不相如則夫通與不通不相及也世人慕富不榮通羞不貧賤不賢不推類以況之也夫富人可慕者貨財多則饒􅁉故人慕之夫富人不如儒生儒生不如通人通人積文十篋以上聖人之言賢者之語上自黄帝下至秦漢治國肥家之術剌世譏俗之言備矣使人通明博見其爲可榮非徒縑布絲綿也蕭何入秦收拾文書漢所以能}
