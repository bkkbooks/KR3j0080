  - {type: variant, offset: 719, length: 0, content: '', SBCK: 之好學也且死不休念在經書不以臨死之故棄忘道藝其爲百世之聖師法祖脩蓋不虚矣自孔子以下至漢之際有才能之稱者非有飽食終日無所用心也不說五經則讀書傳書傳文大難以備之卜卦占射凶吉皆文武之道昔有商瞿能占爻卦末有東方朔翼少君能逹占射覆道雖小亦聖人之術也曾又不知人生禀五常之性好道樂學故辨物於今則不然飽食快飲慮深求卧腹爲飯坑腸爲酒囊是則物也倮蟲三百人爲之長天地之性人爲貴貴其識知也今閉闇脂塞無所好欲與三百倮蟲何以異而謂之爲長而貴之乎諸夏之人所以貴於夷狄者以其通仁義之文知古今之學也如徒作其胸中之知以取衣食經歷年月白首没齒終無曉知夷狄之次也觀夫蜘蛛之經絲以罔飛蟲也人之用作安能過之任胸中之知舞權利之詐以取冨壽之樂無古今之學蜘蛛之類也含血之蟲無餓死之患皆能以知求索飲食也人不通者亦能自供仕官爲吏亦得高官將相長吏猶吾大夫高子也安能别之隨時積功以命得官不曉古今以位爲賢與文之異術安得識别通人俟以不次乎將相長吏不得若右扶風蔡伯偕鬰林太守張孟甞東萊太守李季公之徒心自通明覽逹古今故其敬通人也如見大賔燕昭爲鄒衍擁篲彼獨受何性哉東成令董仲綬知爲儒梟海内稱通故其接人能别竒律是以鍾離産公以編户之民受圭璧之敬知之明也故夫能知之也凡石生光氣不知之也金玉無􅃳色自武帝以至今朝數舉賢良令人射䇿甲乙之科若董仲舒唐子高谷子雲丁伯玉䇿旣中實文說美善博覽膏􅃾之所生也使四子經徒能摘筆徒能記䟽不見古今之書安能建美善於聖王之庭乎孝明之時讀蘇武傳見武官名曰栘中監以問百官百官莫知夫倉頡之章小學之書文字備具至於無能對聖國之問者是皆美命隨牒之人多在官也木旁多文字且不能知其欲及若董仲舒之知重常劉子政之知貳負難哉或曰通人之官蘭臺令史職校書定字比夫太史太柷職在文書無典民之用不可施設是以蘭臺之史班固賈逵楊終􅀓毅之徒名香文美委積不紲大用於世曰此不繼周世通覽之人鄒衍之徒孫卿之輩受時王之寵尊顯於世董仲舒雖無鼎足之位知在公卿之上周監二代漢監周秦然則蘭臺之官國所監得失也以心如丸卵爲體内藏䏬子如豆爲身光明令史雖微典國道藏通人所由進猶博士之官儒生所由興也委積不紲豈聖國微遇之哉殆以書未定而職未畢也超竒篇通書千篇}
