  - {type: variant, offset: 32, length: 4, content: 卑謙辭讓, SBCK: 勁彊之優愚主有不堪之劣以此相求禽魚相與遊也干將之刃人不推頓􅋎瓠不能傷篠簵之箭機不能動發魯縞不能穿非無干將篠簵之才也無推頓發動之主􅋎瓠魯縞不穿傷焉望斬旗穿革之功乎}
