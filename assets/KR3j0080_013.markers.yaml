  - {type: variant, offset: 1327, length: 317, content: 謂孟子見其陽孫卿見其陰也處二家各有見可也不處人情性有善有惡未也夫人情性同生於陰陽其生於陰陽有渥有泊玉生於石有純有駮情生於陰陽安能純善仲舒之言未能得實劉子政曰性生而然者也在於身而不發情接於物而然者也形出於外形外則謂之陽不發者則謂之陰夫子政之言謂性在身而不發情接於物形出於外故謂之陽性不發不與物接故謂之陰夫如子政之言乃謂情為陽性為陰也不據本所生起苟以形出與不發見定陰陽也必以形出為陽性亦與物接造次必於是顛沛必於是惻隱不忍仁之氣也卑謙辭讓性之發也有與接會故惻隱卑謙形出於外謂性在內不與物接恐非其實不論性之善惡徒議外內陰陽理難以知且從子政之言以性為陰情為陽夫人稟情竟有善惡不也自孟子以下至劉子政鴻儒博生聞見多矣然而論情性竟無定是唯世碩公孫尼子, SBCK: ''}
