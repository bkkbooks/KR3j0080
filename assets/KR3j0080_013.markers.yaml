  - {type: variant, offset: 7, length: 1, content: 治, SBCK: 有王開賢厥率化民此言賢人亦壯彊於禮義故能開賢其率化民化民湏禮義禮義須文章行有餘力則以學文能學文有力}
  - {type: variant, offset: 7, length: 1, content: 治, WYG: 有王開賢厥率化民此言賢人亦壯彊於禮義故能開賢其率化民化民須禮義禮義須文章行有餘力則以學文能學文有力}
  - {type: variant, offset: 7, length: 1, content: 治, krp: 有王開賢厥率化民此言賢人亦壯彊於禮義故能開賢其率化民化民湏禮義禮義須文章行有餘力則以學文能學文有力}
  - {type: variant, offset: 9, length: 3, content: 本禮樂, SBCK: 驗也問曰說一經之儒可謂有力者曰非有力者也陳留龐少都每薦諸生之吏常曰王甲某子才能百人太守非其能不荅少都更曰言之尚少王甲某子才能百萬人太守怒曰親吏妄言少都曰文吏不通一經一文不調師一言諸生能說百萬章句非才知百萬人乎太守無以應夫少都之言實也然猶未也何則諸生能傳百萬言不能覽古今守信師法雖辭說多終不爲博殷周以前頗載六經儒生}
  - {type: page-break, offset: 9, content: '', id: KR3j0080_SBCK_013-2a}
