  - {type: variant, offset: 160, length: 2, content: 世子, SBCK: 觀其言行置之空壁形容具存人不激勸者不見言行也古賢之遺文竹帛之所載粲然豈徒墻壁之畫哉空器在厨金銀塗飾其中無物益於饑人不顧也肴膳甘醢土釡之盛入者鄉之古賢文之美善可甘非徒器中之物也讀觀有益非徒膳食有􅀘也故器空無實饑者不顧胸虚無懷朝廷不御也劒􅇊之家􅃲戰必勝者得曲城越女之學也兩敵}
