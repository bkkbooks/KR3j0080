  - {type: variant, offset: 740, length: 0, content: '', SBCK: 楊子雲君山對曰漢興以來未有此人君山差才可謂得高下之實矣采玉者心羡於玉鑚􅀛能知神於􅀛能差衆儒之才累其高下賢於所累又作新論論世間事辯照然否虚妄之言僞飾之辭莫不證定彼子長子雲說論之徒君山爲甲自君山以來皆爲鴻眇之才故有嘉令之文筆能著文則心能謀論文由胸中而出心以文爲表觀見其文竒偉俶儻可謂得論也由此言之繁文之人人之傑也有根株於下有榮葉於上有實核於内有皮殻於外文墨辭說士之榮葉皮殻也實誠在胸臆文墨著竹帛外内表裏自相副稱意奮而筆縱故文見而實露也人之有文也猶禽之有毛也毛有五色皆生於體苟有文無實是則五色之禽毛妄生也選士以射心平體正執弓矢審固然後射中論說之出猶弓矢之發也論之應理猶矢之中的夫射以矢中效巧論以文墨驗竒竒巧俱發於心其實一也文有深指巨略君臣治術身不得行口不能紲表著情心以明已之必能爲之也孔子作春秋以示王意然則孔子之春秋素王之業也諸子之傳書素相之事也觀春秋以見王意讀諸子以睹相指故曰陳平割肉丞相之端見孫叔敖決期思令君之兆著觀讀傳書之文治道政務非徒割肉}
