  - {type: variant, offset: 742, length: 1, content: 喻, SBCK: 之占也足不彊則跡不遠鋒不銛則割不深連結篇章必大才智鴻懿之俊也或曰著書之人博覽多聞學問習熟則能推􅀋興文文由外而興未必實才學文相副也且淺意於華葉之言無根核之深不見大道體要故立功}
