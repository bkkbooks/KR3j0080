  - {type: variant, offset: 155, length: 4, content: 亦論情性, SBCK: 也殷周之地極五千里荒服要服勤能牧之漢氏廓土牧萬里之外要荒之地襃衣博帶夫德不優者不能懷遠才不大者不能博見故多聞博識無頑鄙之訾深知道術無淺闇之毁也人好觀圖畫者圖上所畫古之列人也見列人之面孰}
