  - {type: variant, offset: 29, length: 2, content: 節性, SBCK: 明法察商鞅之耕戰固非弱劣之主所能用也六國之時賢才之臣入楚楚重出齊齊輕爲趙趙完畔魏魏傷韓用申不害行其三符兵不侵境蓋十五年不能用之又不察其書兵挫軍破國并於秦殷周之世亂跡相屬亡禍比肩豈其心不欲爲治乎力弱智劣不能納至言也是故塠重一人之跡不能蹈也礚大一人之掌不能推也賢臣}
  - {type: variant, offset: 29, length: 2, content: 節性, WYG: 際哉大川旱不枯者多所疏也潢汙兼日不雨􅅺輙見者無所通也是故大川相間小川相屬東流歸海故海大也海不通於百川安得巨大之名夫人含百家之言猶海懷百川之流也不謂之大者是謂海小於百川也夫海大於百川也人皆知之通者明於不通莫之能别也潤下作鹹水之滋味也東海水鹹流廣大也西州鹽井源泉深也人或無井而食或穿井不得泉}
