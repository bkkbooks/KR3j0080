  - {type: variant, offset: 1660, length: 257, content: 也酆文茂記繁如榮華恢諧劇談甘如飴密未必得實實者人性有善有惡猶人才有高有下也高不可下下不可高謂性無善惡是謂人才無高下也稟性受命同一實也命有貴賤性有善惡謂性無善惡是謂人命無貴賤也九州田土之性善惡不均故有黃赤黑之別上中下之差水潦不同故有清濁之流東西南北之趨人稟天地之性懷五常之氣或仁或義性術乖也動作趨翔或重或輕性識詭也面色或白或黑身形或長或短至老極死不可變易天性然也皆知水土物器形性不同而莫知善惡稟之異也余固以孟軻言人性善者中人以上者也孫卿言人性惡者中人以下者也楊雄言人性善惡混者中人也若反經合道則可以為教盡性之理則未也, SBCK: 衡卷第十三}
