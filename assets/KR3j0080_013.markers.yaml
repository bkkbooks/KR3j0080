  - {type: 'tls:seg', offset: 10, content: '', id: KR3j0080_tls_013-1a.5}
  - {type: variant, offset: 13, length: 0, content: '', SBCK: 不能說也秦漢之事儒生不見力劣不能覽也周監二代漢監周秦周秦以來儒生不知漢欲觀覽儒生無力使儒生博觀覽則爲文儒文儒者力多於儒生如少都之言文儒才能千萬人矣曾子曰士不可以不弘毅任重而道遠仁以爲巳任不亦重乎死而後巳不亦遠乎}
  - {type: variant, offset: 13, length: 0, content: '', WYG: 不能説也秦漢之事儒生不見力劣不能覽也周監二代漢監周秦周秦以來儒生不知漢欲觀覽儒生無力使儒生博觀覽則爲文儒文儒者力多於儒生如少都之言文儒才能千萬人矣曾子曰士不可以不𢎞毅任重而道逺仁以爲己任不亦重乎死而後已不亦逺乎}
  - {type: page-break, offset: 13, content: '', id: KR3j0080_WYG_013-2b, image: WYG0862/WYG0862-0160b.png}
  - {type: variant, offset: 13, length: 0, content: '', krp: 不能說也秦漢之事儒生不見力劣不能覽也周監二代漢監周秦周秦以來儒生不知漢欲觀覽儒生無力使儒生博觀覽則爲文儒文儒者力多於儒生如少都之言文儒才能千萬人矣曾子曰士不可以不弘毅任重而道遠仁以爲巳任不亦重乎死而後巳不亦遠乎}
  - {type: variant, offset: 14, length: 0, content: '', SBCK: 此言之儒者所懷獨巳重矣志所欲至獨已逺矣身載重任至於終死不倦不衰力獨多矣夫曾子載於仁而儒生載於學所載不同輕重均也夫一石之重一人挈之十石以上二人不能舉也世多挈一石之任寡有舉十石之力儒生所載非徒十石之重也地力盛者草木暢茂一畒之收當中田五畒之分苗田人知出榖多者地力盛不知出文多者才知茂失事理之實矣夫文儒之力過於儒生況文吏乎能舉賢薦士世謂之多力也然能舉賢薦士上書日記也能上書日記者文儒也文儒非必諸}
  - {type: page-break, offset: 14, content: '', id: KR3j0080_SBCK_013-2b}
  - {type: variant, offset: 14, length: 0, content: '', WYG: 此言之儒者所懷獨已重矣志所欲至獨已逺矣身載重任至於終死不倦不衰力獨多矣夫曾子載於仁而儒生載於學所載不同輕重均也夫一石之重一人挈之十石以上二人不能舉也世多挈一石之任寡有舉十石之力儒生所載非徒十石之重也地力盛者草木暢茂一畝之收當中田五畝之分苗田人知出榖多者地力盛不知出文多者才知茂失事理之實矣夫文儒之力過於儒生况文吏乎能舉賢薦士世謂之多力也然能舉賢薦士上書日記也能上書日記者文儒也文儒非必諸}
  - {type: page-break, offset: 14, content: '', id: KR3j0080_WYG_013-3a, image: WYG0862/WYG0862-0160c.png}
  - {type: variant, offset: 14, length: 0, content: '', krp: 此言之儒者所懷獨巳重矣志所欲至獨已逺矣身載重任至於終死不倦不衰力獨多矣夫曾子載於仁而儒生載於學所載不同輕重均也夫一石之重一人挈之十石以上二人不能舉也世多挈一石之任寡有舉十石之力儒生所載非徒十石之重也地力盛者草木暢茂一畒之收當中田五畒之分苗田人知出榖多者地力盛不知出文多者才知茂失事理之實矣夫文儒之力過於儒生況文吏乎能舉賢薦士世謂之多力也然能舉賢薦士上書日記也能上書日記者文儒也文儒非必諸}
  - {type: punctuation, offset: 16, content: 。, id: KR3j0080_tls_013-bkkpn5}
  - {type: 'tls:seg', offset: 16, content: '', id: KR3j0080_tls_013-1a.6}
  - {type: variant, offset: 16, length: 0, content: '', SBCK: 賢逹用文則是矣谷子雲唐子髙章奏百上筆有餘力極言不諱文不折乏非夫才知之人不能爲也孔子周世多力之人也作春秋刪五經祕書微文無所不定山大者雲多泰山不崇朝辦雨雨天下夫然則賢者有雲雨之知}
  - {type: page-break, offset: 16, content: '', id: KR3j0080_SBCK_013-3a}
  - {type: variant, offset: 16, length: 0, content: '', WYG: 賢達用文則是矣谷子雲唐子髙章奏百上筆有餘力極言不諱文不折乏非夫才知之人不能爲也孔子周世多力之人也作春秋刪五經祕書微文無所不定山大者雲多泰山不崇朝而徧雨天下夫然則賢者有雲雨之知}
  - {type: page-break, offset: 16, content: '', id: KR3j0080_WYG_013-3b, image: WYG0862/WYG0862-0160d.png}
  - {type: variant, offset: 16, length: 0, content: '', krp: 賢逹用文則是矣谷子雲唐子髙章奏百上筆有餘力極言不諱文不折乏非夫才知之人不能爲也孔子周世多力之人也作春秋刪五經祕書微文無所不定山大者雲多泰山不崇朝辦雨雨天下夫然則賢者有雲雨之知}
  - {type: variant, offset: 17, length: 0, content: '', SBCK: 曰字一有其吐文萬牒以上可謂多力矣世稱力者常襃烏獲然則董仲舒楊子雲文之烏獲也秦武王與孟說舉鼎不任絶脉而死少文之人與董仲舒等涌胷中之思必將不任有絶脉之變王莽之時省五經章句皆爲二十萬博士弟子郭路夜定舊說死於燭下精思不任絶脉氣滅也顔氏之子已曾馳過孔子於塗矣劣倦罷極髪白齒落夫以庻幾之材猶有仆頓之禍孔子力優顔淵不任也才力不相如則其知思不相及也勉自什伯鬲中嘔血失䰟狂亂遂至氣絶書五行之牘書十奏之記其才劣者筆墨之力尤難況乃連句結章篇至十百哉力獨多矣江河之水馳涌滑漏席地長遠無枯竭之流本源盛矣知江河之流遠地中之源盛不知萬牒之人胷中之才茂有一字無迷惑者也故望見􅂹足不異於衆馬之蹄躡平陸而馳騁千里之跡斯湏可見夫馬足人手同一實也稱􅂹之足不薦文人之手不知類也夫能論䈥力以見比類者則能取文力之人立之朝庭故夫文力之人助有力之將乃能以力爲功有力無助以力爲禍何以驗之長巨之物彊力之人乃能舉之重任之車彊力之牛乃能輓之是任車上阪彊牛引前力人推後乃能升踰如牛羸人罷任車退却還墮坑谷有破覆之敗矣文儒懷先王之道含百家之言其難推引非徒任車之重也薦致之者罷羸無力遂却退竄於巖􅔙矣河發崑崙江起岷山水力盛多滂沛之流浸下益盛不得廣岸低地不能通流入乎東海如岸狹地仰溝洫決泆散在丘墟矣文儒之知有似於此文章滂沛不遭有力之將援引薦舉亦將棄遺於衡門之下固安得升陟聖主之庭論說政事之務乎火之光也不舉不明有人於斯其知如京其德如山力重不能自稱湏人乃舉而莫之助抱其盛髙之力竄於閭巷之深何時得逹奡育古之多力者身能負荷千鈞手能決角伸鉤使之自舉不能離地智能滿胷之人冝在王闕湏三寸之舌一尺之筆然後自動不能自進進之又不能自安湏人能動待人能安道重知大位地難適也小石附於山山力能得持之在沙丘之間小石輕微亦能自安至於大石沙土不覆山不能持處危峭之際則必崩墜於坑谷之間矣大智之重遭小才之將無左右沙土之助雖在顯位將不能持則有大石崩墜之難也或伐薪於山輕小之木合能束之至於大木十圍以上引之不能動推之不能移則委之於山林收所束之小木而歸由斯以論知能之大者其猶十圍以上木也人力不能舉薦其猶薪者不能推引大木也孔子周流無所留止非聖才不明道大難行人不能用也故夫孔子山中巨木之類也􅁊公九合諸侯一匡天下管仲之力管仲有力􅁊公能舉之可謂壯彊矣吳不能用子胥楚不能用屈}
