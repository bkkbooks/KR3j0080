  - {type: variant, offset: 749, length: 5, content: 指極善極惡, SBCK: 與無能建功之驗徒能筆􅀃之效也曰此不然周世著書之人皆權謀之臣漢世直言之士皆通覽之吏豈謂文非華葉之生根核推之也心思爲謀集扎爲文情見於辭意驗於言商鞅相秦致功於覇作耕戰之書虞卿爲趙決計定說行退作春秋之思􅁸城中之議耕戰之書秦堂上之計也陸賈消吕氏之謀與新語同一意􅁊君山易􅏯錯之䇿與新論共一思觀谷永之陳􅀃唐林之冝言劉向之切議以知爲本筆墨之文將而送之豈徒雕文飾辭茍爲華葉之言哉精誠由中故其文語感動人深是故魯速飛書燕將自殺鄒陽上䟽梁孝開牢書䟽文義奪於肝心非徒博覽者所能造習熟者所能爲也夫鴻儒希有而文人比然將相長吏安可不貴豈徒用其才力游文於牒牘哉州郡有憂能治章上奏解理結煩使州郡連事有如唐子高谷子雲之吏出身盡思竭筆牘之力煩憂適有不解者哉古昔之遠四方辟匿文墨之士難得紀録且近自以㑹稽言之周長生者文士之雄也在州爲剌史任安舉奏在郡爲太守孟觀上書事解憂除州郡無事二將以全長生之身不尊顯非其才知少功力薄也二將懷俗人之節不能貴也使遭前世燕昭則長生已􅀩鄒衍之寵矣長生死後州郡遭憂無舉奏之吏以故事結不解徴詣相屬文􅁤不尊筆䟽不續也豈無憂上之吏哉乃其中文筆不足類也長生之才非徒銳於牒牘也作洞歷十篇上自黄帝下至漢朝鋒芒毛髪之事莫不紀載與太史公表紀相似類也上通下逹故曰洞歷然則長生非徒文人所謂鴻儒者也前世有嚴夫子後有吳君商末有周長生白雉貢於越暢草獻於宛雍州出玉荆楊生金珍物産於四遠幽遼之地未可言無竒人}
