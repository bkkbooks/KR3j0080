  - {type: variant, offset: 892, length: 162, content: 決水使之東西猶染絲令之青赤也丹朱商均已染於唐虞之化矣然而丹朱慠而商均虐者至惡之質不受藍朱變也孫卿有反孟子作性惡之篇以為人性惡其善者偽也性惡者以為人生皆得惡性也偽者長大之後勉使為善也若孫卿之言人幼小無有善也后稷為兒以種樹為戲孔子能行以俎豆為弄石生而堅蘭生而香生稟善氣長大就成故種樹之戲為唐司馬俎豆之弄為周聖師稟蘭石之性故有堅香, SBCK: 漢朝明明}
