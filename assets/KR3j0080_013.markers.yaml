  - {type: variant, offset: 331, length: 238, content: 殺食我羊舌氏由是滅矣紂之惡在孩子之時食我之亂見始生之聲孩子始生未與物接誰令悖者丹朱生於唐宮商均生於虞室唐虞之時可比屋而封所與接者必多善矣二帝之旁必多賢也然而丹朱慠商均虐並失帝統歷世為戒且孟子相人以眸子焉心清而眸子瞭心濁而眸子眊人生目輒眊瞭眊瞭稟之於天不同氣也非幼小之時瞭長大與人接乃更眊也性本自然善惡有質孟子之言情性未為實也然而性善之論亦有所緣或仁或義性術乖也動作趨翔性識詭也面色或白或黑身形或長或短至老極死不可變易天性然也皆知水土物器形性不同而莫知善惡稟之異也一歲嬰兒無爭奪, SBCK: ''}
