  - {type: variant, offset: 102, length: 0, content: '', SBCK: 遊也必欲入都都多竒觀也入都必欲見市市多異貨也百家之言古今行事其爲竒異非徒都邑大市也遊於都邑者心厭觀於大市者意飽況遊於道藝之際哉大川旱不枯者多所䟽也潢汙兼日不雨􅅺輙見者無所通也是故大川相間小川相屬東流歸海故海大也海不通於百川安得巨大之名夫人含百家之言猶海懷百川之流也不謂之大者是謂海小於百川也夫海大於百川也人皆知之通者明於不通莫之能别也潤下作鹹水之滋味也東海水鹹流廣大也西州鹽井源泉深也人或無井而食或穿井不得泉有鹽井之利乎不與賢聖通業望有髙世之名難哉法令之家不見行事議罪不可審章句之生不覽古今論事不實或以說一經爲是何湏博覽夫孔子之門講習五經五經皆習庶幾之才也顔淵曰博我以文才智高者能爲博矣顔淵之曰博者豈徒一經哉我不能博五經又不能博衆事守信一學不好廣觀無温故知新之明而有守愚不覽之闇其謂一經是者其冝也開戸內日之光日光不能照幽鑿䆫啓牖以助戸明也夫一經之說猶日明也助以傳書猶䆫牖也百家之言令人曉明非徒䆫牖之開日光之照也是故日光照室内道術明胷中開戸內光坐高堂之上眇升樓臺窺四鄰之廷人之所願也閉戸幽坐向􅁳􅁳之内穿壙􅔙卧造黄泉之際人之所惡也夫閉心塞意不髙瞻覽者死人之徒也哉孝武皇帝時燕王旦在明光宫欲入所卧戸三百盡閉使侍者二十人開戸戸不開其後旦坐謀反自殺夫戸閉燕王旦死之狀也死者凶事也故以閉塞爲占齊慶封不通六國大夫㑹而賦詩慶封不曉其後果有楚靈之禍也夫不開通於學者尸尚能行者也亡國之社屋其上柴其下者示絶於天地春秋薄社周以爲城夫經藝傳書人當覽之猶社當通氣於天地也故人之不通覽者薄社之類也是故氣不通者彊壯之人死榮華之物枯東海之中可食之物集糅非一以其大也夫水精氣渥盛故其生物也衆多竒異故夫大人之胷懷非一才高知大故其於道術無所不包學士同門高業之生衆共宗之何則知經指深曉師言多也夫古今之事百家之言其爲深多也豈徒師門高業之生哉甘酒醴不酤飴􅁡未爲能知味也耕夫多殖嘉榖謂之上農夫其少者謂之下農夫學士之才農夫之力一也能多種榖謂之上農能博學問謂之上儒是稱牛之服重不譽馬速也譽手毁足孰謂之慧矣縣道不通於野野路不逹於邑􅀐馬乗舟者必不由也故血脉不通人以甚病夫不通者惡事也故其禍變致不}
