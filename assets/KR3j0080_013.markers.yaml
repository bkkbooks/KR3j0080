  - {type: variant, offset: 6, length: 0, content: '', SBCK: 與彼扛鴻鼎掲華旗者爲料敵也夫壯士力多者扛鼎掲旗儒生力多者博逹䟽通故博逹䟽通儒生之力也舉重抜堅壯士之力也梓材曰彊}
  - {type: page-break, offset: 6, content: '', id: KR3j0080_SBCK_013-1b}
