  - {type: variant, offset: 3, length: 2, content: 情性, krp: 别通篇超倚篇效力篇程才量知之篇徒言知學未言才力也人有知學則有力矣文吏以理事爲力而儒生以學問爲力或問楊子雲曰力能扛鴻鼎掲華旗知德亦有之乎荅曰百人矣夫知德百人}
