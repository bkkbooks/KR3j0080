  - {type: variant, offset: 736, length: 1, content: 告, SBCK: 以超之竒退與儒生相料文軒之比於敝車錦繡之方於緼􅂁也其相過遠矣如與俗人相料太山之巔墆長狄之項跖不足以喻故夫丘山以土石爲體其有銅鐵山之竒也銅鐡旣竒或出金玉然鴻儒世之金玉也竒而又竒矣竒而又竒才相超乗皆有品差儒生􅀃名於儒門過俗人遠也或不能􅀃一經教誨後生或帶徒聚衆說論洞溢稱爲經明或不能成牘治一說或能陳得失奏便宜言應經傳文如星月其高第若谷子雲唐子高者􅀃書於牘奏之土不能連結篇章或抽列古今紀著行事若司馬子長劉子政之徒累積篇第文以萬數其過子雲子高遠矣然而因成紀前無胸中之造若夫陸賈董仲舒論說世事由意而出不假取於外然而淺露易見觀讀之者猶曰傳記陽成子長作樂經楊子雲作太玄經造於助思極窅冥之深非庻幾之才不能成也孔子作春秋二子作兩經所謂卓爾蹈孔}
