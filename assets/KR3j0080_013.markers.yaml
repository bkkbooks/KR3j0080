  - {type: variant, offset: 730, length: 0, content: '', SBCK: 弘暢雅閑審定文讀而以教授爲人師者通人也抒其義㫖損益其文句而以上書奏記或興論立說結連篇章者文人鴻儒也好學勤力博聞強識世間多有著書表文論說古今萬不耐一然則著書表文博通所能用之者也入山見木長短無所不知入野見草大小無所不識然而不能伐木以作室屋採草以和方藥此知草木所不能用也夫通人覽見廣博不能掇以論說此爲匿生書主人孔子所謂誦詩三百授之以政不逹者也與彼草木不能伐採一實也孔子得史記以作春秋及其立義創意襃貶賞誅不復因史記者眇思自出於􅅐中也凡貴通者貴其能用之也即徒誦讀讀詩諷術雖千篇以上鸚鵡能言之􅀋也衍傳書之意出膏􅃾之辭非俶儻之才不能任也夫通覽者世間比有著文者歷世希然近世劉子政父子楊子雲􅁊君山其猶文武周公並出一時也其餘直有徃徃而然譬珠玉}
