  - {type: variant, offset: 43, length: 1, content: 情, WYG: 也開戸内日之光日光不能照幽鑿䆫啟牖以助戸明也夫一經之説猶日明也助以傳書猶䆫牖也百家之言令人曉明非徒䆫牖之開日光之照也是故日光照室内道術明胷中開戸内光坐髙堂之上眇升樓䑓窺四鄰之庭人之所願也閉戸幽坐向㝠㝠之内穿壙穴臥造黄泉之際人之所惡也夫閉心塞意不髙瞻覽者死人之徒也哉孝武皇帝時燕王旦在明光宫欲入所卧戸三百盡閉使侍者二十人開戸戸不開其後旦坐謀反自殺夫戸閉燕王旦死之狀也死者凶事也故以閉塞爲占齊慶封不通六國大夫㑹而賦詩慶封不曉其後果}
