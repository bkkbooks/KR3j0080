  - {type: 'tls:seg', offset: 3, content: '', id: KR3j0080_tls_013-1a.3}
  - {type: variant, offset: 3, length: 2, content: 情性, SBCK: 别通篇超􅀝篇效力篇程才量知之篇徒言知學未言才力也人有知學則有力矣文吏以理事爲力而儒生以學問爲力或問楊子雲曰力能扛鴻鼎掲華旗知德亦有之乎荅曰百人矣夫知德百人}
  - {type: variant, offset: 3, length: 2, content: 情性, WYG: 别通篇超竒篇效力篇程才量知之篇徒言知學未言才力也人有知學則有力矣文吏以理事爲力而儒生以學問爲力或問揚子雲曰力能扛鴻鼎掲華旗知德亦有之乎荅曰百人矣夫知德百人}
