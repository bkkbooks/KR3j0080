  - {type: variant, offset: 1517, length: 1, content: 國, SBCK: 年諸生在咸陽者多為妖言始皇使御史案問諸生諸生傳相告引者自除犯禁者四百六十七人皆坑之燔詩書起淳于越之諫坑儒士起自諸生為妖言見坑者四百六十七人傳増言坑殺儒士欲絶詩書又言盡坑之此非其實而又增之傳語曰町町若荆軻之閭言荆軻為燕太子丹刺秦王後誅軻九族其後恚恨不已復夷軻之一里一里皆滅故曰町町此言增之也夫秦雖無道無為盡誅荆軻之里始皇幸梁山之宫從山上望見丞相李斯車騎甚盛恚出言非之其後左右以告李斯李斯立損車騎始皇知左右洩其言莫知為誰盡捕諸在旁者皆殺之其後墜星下東郡至地為石民或刻其石曰始皇帝死地分皇帝聞之令御史逐問莫服盡取石旁人誅之夫誅從行於梁山宫及誅石旁人欲得洩言刻石者不能審知故盡誅之荆軻之閭何罪於秦而盡誅之如刺秦王在閭中不知為誰盡誅之可也荆軻已死刺者}
