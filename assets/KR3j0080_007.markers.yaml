  - {type: variant, offset: 873, length: 1, content: 虛, SBCK: 煩苦相踖藉不能甚樂令池在深室之中則三千人宜臨池坐前俛飲池酒仰食肴膳倡樂在前乃為樂耳如審臨池而坐則前飲害於肴膳倡樂之作不得在前夫飲食既不以禮臨池牛飲則其啖肴不復用杯亦宜就魚肉而虎食則知夫酒池牛飲非其實也傳又言紂懸肉以為林令男女倮而相逐其間是為醉樂淫戲無節度也夫肉當内於口口之所食宜潔不辱今言男女倮相逐其間何等潔者如以醉而不計潔辱則當其浴於酒中而倮相逐於肉間何為不肯浴於酒中以不言浴於酒知不倮相逐於肉間傳者之説或言車行酒騎行炙百二十日為一夜夫言用酒為池則言其車行酒非也言其懸肉為林即言騎行炙非也或時紂沈湎覆酒滂沲於地即言以酒為池釀酒糟積聚則言糟為丘懸肉以林則言肉為林林中幽冥人時走戲其中則言倮相逐或時載酒用鹿車則言車行酒騎行炙或時十數夜則言其百二十或時醉不知問日數則言其亡甲子周公封康叔告以紂用酒期於悉極欲以戒之也而不言糟丘酒池懸肉為林長夜之飲亡其甲子聖人不言殆非實}
