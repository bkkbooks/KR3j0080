  - {type: variant, offset: 0, length: 0, content: '', WYG: 欽定四庫全書論衡卷七漢王充撰道虛篇語增篇道虛篇儒書言黄帝採首山銅鑄鼎於荆山下鼎旣成有龍垂胡髯下迎黄帝黄帝上騎龍羣臣後宫從上七十餘人龍乃上去餘小臣不得上乃悉持龍髯龍髯拔墮黄帝之弓百姓仰望黄帝旣上天乃抱其弓與龍胡髯吁號故後世因名其處曰鼎湖其弓曰烏號太史公記誄五帝亦云黄帝封禪已仙去羣臣朝其衣冠因葬埋之曰此虛言也實黄帝者何等也號乎諡也如諡臣子所誄列也誄生時所行為之諡黄帝好道遂以升天臣子誄之宜以仙升不當以黄諡諡法曰静民則法曰黄黄者安民之諡非得道之稱也百王之諡文則曰文武則曰武文武不失實所以勸操行也如黄帝之時質未有諡乎名之為黄帝何世之人也使黄帝之臣子知君使後世之人跡其行黄帝之世號諡有}
