  - {type: variant, offset: 871, length: 1, content: 年, SBCK: 觚大之則爲桀紂小之則爲酒徒用何以立德成化表名垂譽乎世聞德將毋醉之言見聖人有多德之效則虚増文王以爲千鍾空益孔子以百觚矣傳語曰紂沉湎於酒以糟爲丘以酒爲池牛飲者三千人爲長夜之飲亡其甲子夫紂雖􅄝酒亦欲以爲樂令酒池在中庭乎則不當言爲長夜之飲坐在深室之中閉䆫舉燭故曰長夜令坐於室乎每當飲者起之中庭乃復還坐則}
  - {type: variant, offset: 871, length: 1, content: 年, WYG: 觚大之則為桀紂小之則為酒徒用何以立德成化表名垂譽乎世聞德將毋醉之言見聖人有多德之效則虚増文王以為千鍾空益孔子以百觚矣傳語曰紂沈湎於酒以糟為丘以酒為池牛飲者三千人為長夜之飲亡其甲子夫紂雖嗜酒亦欲以為樂令酒池在中庭乎則不當言為長夜之飲坐在深室之中閉牕舉燭故曰長夜令坐於室乎每當飲者起之中庭乃復還坐則}
