  - {type: variant, offset: 4, length: 2, content: 稟元, SBCK: 皆仙仙者非獨黄帝如聖人不仙黄帝何為獨仙世見黄帝好方術方術仙者之業則謂帝仙矣又見鼎湖之名則言黄帝採首山銅鑄鼎而龍垂胡髯迎黄帝矣是與説㑹稽之山無以異也夫山名曰㑹稽即云夏禹巡狩㑹計於此山上故曰㑹稽夫禹至㑹稽治水不巡狩猶黄帝好方伎不升天也無㑹計之事猶無鑄鼎龍垂胡髯之實也里名勝母可謂實有子勝其母乎邑名朝歌可謂民朝起者歌乎儒書言淮南王學道招㑹天下有道之人傾一國之尊下道術之士是以道術之士並㑹淮南奇方異術莫不爭出王遂得道舉家升天畜産皆仙犬吠於天上雞鳴於雲中此言仙藥有餘犬雞食之并隨王而升天也好道學仙之人皆謂之然此虛言也夫人物也雖貴為王侯性不異於物物無不死人安能仙鳥有毛羽能飛不能升天人無毛羽何用飛升使有毛羽不過與鳥同況其無有升天如何案能飛升之物生有毛羽之兆能馳走之物生有蹄足之形馳走不能飛升飛升不能馳走禀性受氣形體殊别也今人禀馳走之性故生無毛羽之兆長大至老終無奇怪好道學仙中生毛羽終以飛升使物性可變金木水火可革更也蝦蟇化為鶉雀入水為蜃蛤禀自然之性非學道所能為也好道之人恐其或若等之類故謂人能生毛羽毛羽備具能升天也且夫物之生長無卒成暴起皆有浸漸為道學仙之人能先生數寸之毛羽從地自奮升樓臺之陛乃可謂升天今無小升之兆卒有大飛之騐何方術之學成無浸漸也毛羽大效難以觀實且以人髯髪物色少老驗之物生也色青其熟也色黄人之少也髮黑其老也髪白黄為物熟驗白為人老效物黄人雖灌溉壅養終不能青髪白雖吞藥養性終不能黑黑青不可復還老衰安可復却黄之與白猶肉腥炙之燋魚鮮煮之熟也燋不可復令腥熟不可復令鮮鮮腥猶少壮燋熟猶衰老也天養物能使物暢至秋不得延之至春吞藥養性能令人無病不能壽之為仙為仙體輕氣彊猶未能升天令見輕彊之驗亦無毛羽之效何用升天天之與地皆體也地無下則天無上矣天無上升之路何如穿天之體人力不能入如天之門在西北升天之人宜從崑崙上淮南之國在地東南如審升天冝舉家先從崑崙乃得其階如鼓翼邪飛趨西北之隅是則淮南王有羽翼也今不言其從之崑崙亦不言其身生羽翼空言升天竟虛非實也案淮南王劉安孝武皇帝之時也父長以罪遷蜀嚴道至雍道死安嗣為王恨父徙死懷反逆之心招㑹術人欲為大事伍被之屬充滿殿堂作道術之書發怪竒之文合景亂首齊首一本作八公之傳欲示神竒若得道之狀道終不成效驗不立乃與伍被謀為反事事覺自殺或言誅死誅死自殺同一實也世見其書深冝竒怪又觀八公之傳似若有效則傳稱淮南王仙而升天失其實也儒書言盧敖㳺乎北海經乎太隂入乎􅀇闗至於􅀩榖之上見一士焉深目􅀇凖鴈頸而戴肩浮上而殺下軒軒然方迎風而舞顧見盧敖樊然下其臂遯逃乎碑下敖乃視之方卷然􅀛背而食合梨作梨一本盧敖仍與之語曰吾子唯以敖為倍俗去羣離黨窮觀於六合之外者非敖而已敖㓜而游至長不倫解周行四極唯北隂之未闚今卒睹夫子於是殆可與敖為友乎若士者悖然而笑曰嘻子中州之民也不冝逺至此此猶光日月而戴列星四時之所行隂陽之所生也此其比夫不名之地猶㟮屼也若我南游乎罔浪之野北息乎沉薶之鄉西窮乎杳冥之黨而東貫澒懞之先此其下無地上無天聽焉無聞而視焉則營此其外猶有狀有狀之餘壹舉而能千萬里吾猶未能之在今子游始至於此乃語窮觀豈不亦逺哉然子處矣吾與汗漫期於九垓之上吾不可久若士者舉臂而縱身遂入雲中盧敖目仰而視之不見乃止喜心不怠悵若有喪曰吾比夫子也猶黄鵠之與壤蟲也終日行而不離咫尺而自以為逺豈不悲哉若盧敖者唯龍無翼者升則乗雲盧敖言若士者有翼言乃可信今不言有翼何以升雲且凡能輕舉入雲中者飲食與人殊之故也龍食與蛇異故其舉措與蛇不同聞為道者服金玉之精食紫芝之英食精身輕故能神仙若士者食合䖽之肉與庸民同食無精輕之驗安能縱體而升天聞食氣者不食物食物者不食氣若士者食物如不食氣則不能輕舉矣或時盧敖學道求仙㳺乎北海離衆遠去無得道之效慙於鄉里負於議論自知以必然之事見責於世則作誇誕之語云見一士其意以為有求仙之未得期數未至也淮南王劉安坐反而死天下並聞當時並見儒書尚有言其得道仙去雞犬升天者況盧敖一人之身獨行絶跡之地空造幽冥之語乎是與河東蒲坂項曼都之語無以異也曼都好道學仙委家亡去三年而返家問其狀曼都曰去時不能自知忽見若卧形有仙人數人將我上天離月數里而止見月上下幽冥幽㝠不知東西居月之旁其寒悽愴口饑欲食仙人輒飲我以流霞一杯每飲一杯數月不饑不知去幾何年月不知以何為過忽然若卧復下至此河東號之曰斥仙實論者聞之乃知不然夫曼都能上天矣何為不仙已三年矣何故復還夫人去民間升皇天之上精氣形體有變於故者矣萬物變化無復還者復育化為蟬羽翼既成不能復化為復育能升之物皆有羽翼升而復降羽翼如故見曼都之身有羽翼乎言乃可信身無羽翼言虛妄也虛則與盧敖同一實也或時聞曼都好道黙委家去周章逺方終無所得力勌望極黙復歸家慙愧無言則言上天其意欲言道可學得審有仙人已殆有過故成而復斥升而復降儒書言齊王疾痟使人之宋迎文摯文摯至視王之疾謂太子曰王之疾必可已也雖然王之疾已則必殺摯也太子曰何故文摯對曰非怒王疾不可治也王怒則摯必死太子頓首強請曰茍已王之疾臣與臣之母以死爭之於王必幸臣之毋願先生之勿患也文摯曰諾請以死為王與太子期将徃不至者三齊王固已怒矣文摯至不解屨登牀履衣問王之疾王怒而不與言文摯因出辭以重王怒王叱而起疾乃遂已王大怒不悦將生烹文摯太子與王后急爭之而不能得果以鼎生烹文摯爨之三日三夜顔色不變文摯曰誠欲殺我則胡不覆之以絶隂陽之氣王使覆之文摯乃死夫文摯道人也入水不濡入火不燋故在鼎三日三夜顔色不變此虛言也夫文摯而烹三日三夜顔色不變為一覆之故絶氣而死非得道之驗也諸生息之物氣絶則死死之物烹之輒爛致生息之物密器之中覆蓋其口漆塗其隙中外氣隔息不得洩有頃死也如置湯鑊之中亦輒爛矣何則體同氣均禀性於天共一類也文摯不息乎與金石同入湯不爛是也令文摯息乎烹之不死非也令文摯言言則以聲聲以呼吸呼吸之動因血氣之發血氣之發附於骨肉骨肉之物烹之輒死今言烹之不死一虛也既能烹煮不死此眞人也與金石同金石雖覆蓋與不覆蓋者無以異也今言文摯覆之則死二虛也置人寒水之中無湯火之熱鼻中口内不通於外斯須之頃氣絶而死矣寒水沉人尚不得生況在沸湯之中有猛火之烈乎言其入湯不死三虛也人沒水中口不見於外言音不揚烹文摯之時身必沒於鼎中沒則口不見口不見則言不揚文摯之言四虛也烹輒死之人三日三夜顔色不變癡愚之人尚知怪之使齊王無知太子羣臣冝見其奇奇怪文摯則請出尊寵敬事從之問道今言三日三夜無臣子請出之言五虛也此或時聞文摯實烹烹而輒死世見文摯為道人也則為虚生不死之語矣猶黄帝實死也傳言升天淮南坐反書言度世世好傳虛故文摯之語傳至於今世無得道之效而有有壽之人世見長壽之人學道為仙踰百不死共謂之仙矣何以明之如武帝之時有李少君以祠竈辟穀却老方見上上尊重之少君匿其年及所生長常自謂七十而能使物却老其㳺以方徧諸侯無妻人聞其能使物及不老更饋遺之常餘錢金衣食人皆以為不治産業饒給又不知其何許人愈争事之少君資好方善爲巧發奇中甞從武安侯飲座中有年九十餘者少君乃言其王父游射處老人爲兒時從父識其處一座盡驚少君見上上有古銅器問少君少君曰此器齊桓公十五年陳於栢寢已而按其刻果齊桓公器一宫盡驚以爲少君數百歲人也乆之少君病死今世所謂得道之人李少君之類也少君死於人中人見其尸故知少君性壽之人也如少君處山林之中入絶跡之野獨病死於巖石之間尸爲虎狼狐狸之食則世復以爲真仙去矣世學道之人無少君之壽年未至百與衆俱死愚夫無知之人尚謂之尸解而去其實不死所謂尸解者何等也謂身死精神去乎謂身不死得免去皮膚也如謂身死精神去乎是與死無異人亦仙人也如謂不死免去皮膚乎諸學道死者骨肉具在與恒死之尸無以異也夫蟬之去復育􅀛之解甲虵之脱皮鹿之墮角殻皮之物解殻皮持骨肉去可謂尸解矣今學道而死者尸與復育相似尚未可謂尸解何則案蟬之去復育無以神於復育況不相似復育謂之尸解蓋復虛妄失其實矣太史公與李少君同世並時少君之死臨尸者雖非太史公足以見其實矣如實不死尸解而去太史公冝紀其狀不冝言死其處座中年九十老父為兒時者少君老壽之效也或少君年十四五老父為兒隨其王父少君年二百歲而死何為不識武帝去桓公鑄銅器且非少君所及見也或時聞宫殿之内有舊銅器或按其刻以告之者故見而知之今時好事之人見舊劔古鉤多能名之可復謂目見其鑄作之時乎世或言東方朔亦道人也姓金氏字曼倩變姓易名游宦漢朝外有仕宦之名内乃度世之人此又虚也夫朔與少君並在武帝之時太史公所及見也少君有敎道祠竈却老之方又名齊桓公所鑄鼎知九十老人王父所游射之驗然尚無得道之實而徒性壽遲死之人也況朔無少君之方術效驗世人何見謂之得道案武帝之時道人文成五利之輩入海求仙人索不死之藥有道術之驗故為上所信朔無入海之使無奇怪之效也如使有奇不過少君之類及文成五利之輩耳況謂之有道此或時偶復若少君矣自匿所生之處當時在朝之人不知其故朔盛稱其年長人見其面狀少性又恬淡不好仕宦善達占卜射覆為怪奇之戲世人則謂之得道之人矣世或以老子之道為可以度世恬淡無欲養精愛氣夫人以精神為壽命精神不傷則壽命長而不死成事老子行之踰百度世為眞人矣夫恬淡少欲孰與鳥獸鳥獸亦老而死鳥獸含情欲有與人相類者矣未足以言草木之生何情欲而春生秋死乎夫草木無欲壽不踰歲人多情欲壽至於百此無情欲者反夭有情欲者壽也夫如是老子之術以恬淡無欲延壽度世者復虛也或時老子李少君之類也行恬淡之道偶其性命亦自壽長世見其命壽又聞其恬淡謂老子以術度世矣世或以辟穀不食為道術之人謂王子喬之輩以不食穀與恒人殊食故與恒人殊壽踰百度世遂為仙人此又虛也夫人之生也禀食飲之性故形上有口齒形下有孔竅口齒以噍食孔竅以注瀉順此性者為得天正道逆此性者為違所禀受失本}
