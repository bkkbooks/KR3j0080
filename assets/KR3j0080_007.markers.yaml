  - {type: variant, offset: 854, length: 1, content: 減, SBCK: 損考察前後效驗自列自列則是非之實有所定矣世稱紂力能索鐵伸鉤又稱武王伐之兵不血刃夫以索鐵伸鉤之力當人則是孟賁夏育之匹也以不血刃之德取人是則三皇五帝之屬也以索鐵之力不宜受服以不血刃之德不宜頓兵今稱紂力則武王德貶譽武王則紂力少索鐵不血刃不得兩立殷周之稱不得二全不得二全則必一非孔子曰紂之不善不若是之甚也是以君子惡居下流天下之惡皆歸焉孟子曰吾於武成取二三策耳以至仁伐不仁如何其血之浮杵也若孔子言殆沮浮杵若孟子之言近不血刃浮杵過其實不血刃亦失其正一聖一賢共論一紂輕重殊稱多少異實紂之惡不若王莽紂殺比干莽鴆平帝紂以嗣立莽盜漢位殺主隆於誅臣嗣立順於盜位士衆所畔宜甚於紂漢誅王莽兵頓昆陽死者萬數軍至漸臺血流没趾而獨謂周取天下兵不血刃非其實也}
