  - {type: variant, offset: 1045, length: 369, content: 人則年壽亦短於人世稱高宗之徒不言其身形變異而徒言其增延年壽故有信矣形之血氣也猶囊之貯粟米也粟米一石囊之高大亦適一石如損益粟米囊亦增減人以氣為壽氣猶粟米形猶囊也增減其壽亦當增減其身形安得如故如以人形與囊異氣與粟米殊更以苞瓜喻之苞瓜之汁猶人之血也其肌猶肉也試令人損益苞瓜之汁令其形如故耐為之乎人不耐損益苞瓜之汁天安耐增減人之年人年不可增減高宗之徒誰益之者而云增加如言高宗之徒形體變易其年亦增乃可信也今言年增不言其體變未可信也何則人稟氣於天氣成而形立則命相須以至終死形不可變化年亦不可增加以何驗之人生能行死則僵仆死則氣滅形消而壞稟氣生人形不可得變其年安可增人生至老身變者髮與膚也人少則髮黑老則髮白白久則黃髮之變形非變也人少則膚白老則膚黑黑久則黯若有垢矣髮黃而膚為垢故禮曰黃耇無疆髮膚變異故人老壽遲死骨肉不可變更壽極則死矣五行之物可變改者唯土也埏, SBCK: 狹輔㓨周青臣}
