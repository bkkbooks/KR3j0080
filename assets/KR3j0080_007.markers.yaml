  - {type: variant, offset: 860, length: 2, content: 桑榖, krp: 法胷腹小大與人均等飲酒用千鍾用肴宜盡百牛百觚則宜用十羊夫以千鍾百牛百觚十羊言}
  - {type: variant, offset: 863, length: 2, content: 異悔, SBCK: 文王之身如防風之君孔子之體如長狄之人乃能堪之案文王孔子之體不能及防風長狄以短小之身飲食衆多是缺文王之廣貶孔子之崇也案酒誥之篇朝夕曰祀兹酒此言文王戒慎酒也朝夕戒愼則民化之外出戒慎之敎内飲酒盡千鍾導民率下何以致化承紂疾惡何以自别且千鍾之效百觚之驗何所用哉使文王孔子因祭用酒乎則受福胙不能厭飽因饗射之用酒乎饗射飲酒自有禮法如私燕賞賜飲酒乎則賞賜飲酒宜與下齊賜尊者之前三觴而退}
