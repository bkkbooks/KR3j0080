  - {type: variant, offset: 790, length: 0, content: '', SBCK: 德劣承衰若孔子栖栖周流應聘身不得容道不得行可骨立跛附僵仆道路乎紂為長夜之飲糟丘酒池沉湎於酒不舎晝夜是必以病病則不甘飲食不甘飲食則肥􅃾不得至尺經曰惟湛樂是從時亦罔有克壽魏公子無忌為長夜之飲困毒而死紂雖未死宜羸臞矣然桀紂同行則宜同病言其腴垂過尺餘非}
