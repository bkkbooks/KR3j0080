  - {type: variant, offset: 789, length: 0, content: '', SBCK: 言堯舜若腊與腒桀紂垂􅃾尺餘增之也齊桓公云寡人未得仲父極難既得仲父甚易桓公不及堯舜仲父不及禹契桓公猶易堯舜反難乎以桓公得管仲易知堯舜得禹契不難夫易則少憂少憂則不愁不愁則身體不臞舜承堯太平堯舜襲德功假荒服堯尚有憂舜安能無事故經曰上帝引逸謂虞舜也舜承安繼治任賢使能恭已無為而天下治故孔子曰巍巍乎舜禹之有天下而不與焉夫不與尚謂之臞若腒}
