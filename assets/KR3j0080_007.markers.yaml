  - {type: variant, offset: 793, length: 1, content: 形, SBCK: 實矣傳語又稱紂力能索鐵伸鉤撫梁易柱言其多力也蜚㢘惡來之徒並幸受寵言好􅇊力之主致􅇊力之士也或言武王伐紂兵不血刃夫以索鐵伸鉤之力輔以蜚㢘惡來之徒與周軍相當武王德雖盛不能奪紂素所厚之心紂雖惡亦不失所與同行之意雖為武王所擒時亦宜殺傷十百人今言不血刃非紂多力之效蜚㢘惡來助紂之驗也案武王之符瑞不過髙祖武王有白魚赤烏之祐髙祖有斷大虵老嫗哭於道之瑞武王有八百諸侯之助髙祖有天下義兵之佐武王之相望羊}
