  - {type: variant, offset: 16, length: 3, content: 立長短, krp: 温膚食以充腹膚温腹飽精神明盛如饑而不飽寒而不温則有凍餓之害矣凍餓之人安能乆壽且人之生也以食為氣猶草木生以土為氣矣拔草木之根使之離土則枯而蚤死閉人之口使之不食則餓而不壽矣道家相誇曰眞人食氣以氣而為食故傳曰食氣者壽而不死雖不穀飽亦以氣盈此又虛也夫氣謂何氣也如謂隂陽之氣隂陽之氣不能飽人人或嚥氣氣滿腹脹不能饜飽如謂百藥之氣人或服藥食一合屑吞數十丸藥力烈盛胷中憒毒不能飽人食氣者必謂吹呴呼吸吐故納新也昔有彭祖嘗行之矣不能乆壽病而死矣道家或以導氣養性度世而不死以為血脈在形體之中不動揺屈伸則閉塞不通不通積聚則爲病而死此又虚也夫人}
