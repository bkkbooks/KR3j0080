  - {type: punctuation, offset: 0, content: 《, id: KR3j0080_tls_007-bkkpn1}
  - {type: variant, offset: 1, length: 0, content: '', SBCK: 雖疑未定黄非升仙之稱明矣龍不升天黄帝騎之乃明黄帝不升天也龍起雲雨因乗而行雲散雨止降復入淵如實黄帝騎龍隨溺於淵也案黄帝葬於橋山猶曰羣臣葬其衣冠審騎龍而升天衣不離}
  - {type: page-break, offset: 1, content: '', id: KR3j0080_SBCK_007-2a}
  - {type: variant, offset: 1, length: 0, content: '', WYG: 雖疑未定黄非升仙之稱明矣龍不升天黄帝騎之乃明黄帝不升天也龍起雲雨因乗而行雲散雨止降復入淵如實黄帝騎龍隨溺於淵也案黄帝葬於橋山猶曰羣臣葬其衣冠審騎龍而升天衣不離}
  - {type: variant, offset: 1, length: 0, content: '', krp: 雖疑未定黄非升仙之稱明矣龍不升天黄帝騎之乃明黄帝不升天也龍起雲雨因乗而行雲散雨止降復入淵如實黄帝騎龍隨溺於淵也案黄帝葬於橋山猶曰羣臣葬其衣冠審騎龍而升天衣不離}
  - {type: variant, offset: 2, length: 1, content: 篇, SBCK: 如封禪已仙去衣冠亦不宜遺黄帝實仙不死而升天臣子百姓所親見也見其升天知其不死必也葬不死之衣冠與實死者無以異非臣子實事之心别生於死之意也載太山之上者七十有二君皆勞情苦思憂念王事然後功成事立致治太平太平則天下和安乃升太山而封禪焉夫修道求仙與憂職勤事不同心思道則忘事憂事則害性世稱堯若腊舜若腒心愁憂苦形體羸癯使黄帝致太平乎則其形體宜如堯舜堯舜不得道黄帝升天非其實也使黄帝廢事修道則心意調和形體肥勁是與堯舜異也異則功不同矣功不同天下未太平而升封又非實也五帝三王皆有聖德之優者黄帝不在上焉如聖}
  - {type: page-break, offset: 2, content: '', id: KR3j0080_SBCK_007-2b}
