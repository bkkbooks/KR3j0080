  - {type: variant, offset: 1148, length: 0, content: '', SBCK: 於䇿俱發於心其實一也孔子作春秋不貶小以大其非宰予也以大惡細文語相違服人如何子曰始吾於人也聴其言而信其行今吾於人也聽其言而觀其行於予予改是蓋起宰予晝寝更知人之術也問曰人之晝寢安足以毁行毁行之人晝夜不卧安足以成善以晝寢而觀人善惡能得其實乎案宰予在孔子之門序於四科列在賜上如性情怠不可雕琢何以致此使宰我以晝寢自致此才復過人遠矣如未成就自謂已足不能自知知不明耳非行惡也曉勑而已無為改術也如自知未足倦極晝寢是精神索也精神索至於死亡豈徒寢哉且論人之法取其行則棄其言取其言則棄其行今宰予雖無力行有言語用言令行缺有一槩矣今孔子起宰予晝寢聽其言觀其行言行相應則謂之賢是孔子備取人也毋求備於一人之義何所施子張問令尹子文三仕為令尹無喜色三已之無愠色舊令尹之政必以告新令尹何如子曰忠矣曰仁矣乎曰未知焉得仁子文曾舉楚子玉代已位而伐宋以百乗敗而喪其衆不知如此安得為仁問曰子文舉子玉不知人也智與仁不相干也有不知之性何妨為仁之行五常之道仁義禮智信也五者各别不相湏而成故有智人有仁人者有禮人有義人者人有信者未必智智者未必仁仁者未必禮禮者未必義子文智蔽於子玉其仁何毁謂仁焉得不可且忠者厚也厚人仁矣孔子曰觀過斯知仁矣子文有仁之實矣孔子謂忠非仁是謂父母非二親配匹非夫婦也哀公問弟子孰謂好學孔子對曰有顔回者不遷怒不貳過不幸短命死矣今也則亡未聞好學者也夫顔淵所以死者審何用哉令自以短命猶伯牛之有疾也人生受命皆全當潔今有惡疾故曰無命人生皆當受天長命今得短命亦宜曰無命如天有短長則亦有善惡矣言顔淵短命則宜言伯牛惡命言伯牛無命則宜言顔淵無命一死一病皆痛云命所稟不異文語不同未曉其故也哀公問孔子孰為好學孔子對曰有顔回者好學今也則亡不遷怒不貳過何也曰并攻哀公之性遷怒貳過故也因其問則并以對之兼以攻上之短不犯其罰問曰康子亦問好學孔子亦對之以顔淵康子亦有短何不并對以攻康子康子非聖人也操行有猶所失成事康子患盜孔子對曰茍子之不欲雖賞之不竊由此言之康子以欲為短也不攻何哉孔子見南子子路不恱子曰予所鄙否一作者天厭之天厭之南子衞靈公夫人也聘孔子子路不説謂孔子淫亂也孔子解之曰我所為鄙陋者天厭殺我至誠自誓不負子路也問曰孔子自解安能解乎使世人有鄙陋之行天曾厭殺之可引以誓子路聞之可信以解今未曾有為天所厭者也曰天厭之子路肯信之乎行事雷擊殺人水火燒溺人牆屋壓填人如曰雷擊殺我水火燒溺我牆屋壓填我子路頗信之今引未曾有之禍以自誓於子路子路安肯曉解而信之行事適有卧厭不悟者謂此為天所厭邪案諸卧厭不悟者未皆為鄙陋也子路入道雖淺猶知事之實事非實孔子以誓子路必不解矣孔子稱曰死生有命富貴在天若此者人之死生自有長短不在操行善惡也成事顔淵蚤死孔子謂之短命由此知短命夭死之人必有邪行也子路入道雖淺聞孔子之言知死生之實孔子誓以予所鄙者天厭之獨不為子路言夫子惟命未當死天安得厭殺之乎若此誓子路以天厭之終不見信不見信則孔子自解終不解也尚書曰毋若丹朱敖惟慢游是好謂帝舜勑禹毋子不肖子也重天命恐禹私其子故引丹朱以勑戒之禹曰予娶若時辛壬癸甲開呱呱而泣予弗子陳巳行事以往推來以見卜隱效巳不敢私不肖子也不曰天厭之者知俗人誓好引天也孔子爲子路行所疑不引行事效巳不鄙而云天厭之是與俗人解嫌引天祝詛何以異乎孔子曰鳳鳥不至河不出圖吾巳矣夫夫子自傷不王也巳王致太平太平則鳯鳥至河出圖矣今不得王故瑞應不至悲心自傷故曰吾巳矣夫問曰鳯鳥河圖審何據始起始起之時鳥圖未至如據太平太平之帝未必常致鳯鳥與河圖也五帝三王皆致太平案其瑞應不皆鳳皇為必然之瑞於太平鳳皇為未必然之應孔子聖人也思未必然以自傷終不應矣或曰孔子不自傷不得王也傷時無明王故已不用也鳳鳥河圖明王之瑞也瑞應不至時無明王明王不存已遂不用矣夫致瑞應何以致之任賢使能治定功成治定功成則瑞應至矣瑞應至後亦不須孔子孔子所望何其末也不思其本而望其末也不相其主而名其物治有未定物有不至以至而效明王必失之矣孝文皇帝可謂明矣案其本紀不見鳳鳥與河圖使孔子在孝文之世猶曰吾已矣夫子欲居九夷或曰陋如之何子曰君子居之何陋之有孔子疾道不行於中國志恨失意故欲之九夷也或人難之曰夷狄之鄙陋無禮義如之何孔子曰君子居之何陋之有言以君子之道居而敎之何為陋乎問之曰孔子欲之九夷者何起乎起道不行於中國故欲之九夷夫中國且不行安能行於夷狄夷狄之有君不若諸夏之亡言夷狄之難諸夏之易也不能行於易能行於難乎且孔子云以君子居之者何謂陋邪謂脩君子之道自容乎謂以君子之道敎之也如脩君子之道茍自容中國亦可何必之夷狄如以君子之道敎之夷狄安可敎乎禹入躶國躶入衣出衣服之制不通於夷狄也禹不能教躶國衣服孔子何能使九夷為君子或孔子實不欲往患道不行故發此言或人難之孔子知其陋然而猶曰何陋之有者欲遂已然距或人之諫也實不欲往志動發言是偽言也君子於言無所茍矣如知其陋茍欲自遂此子路對孔子以子羔也子路使子羔為費宰子曰賊夫人之子子路曰有社稷焉有民人焉何必讀書然後為學子曰是故惡夫佞者子路知其不可苟對自遂孔子惡之比夫佞者孔子亦知其不可苟應或人孔子子路皆以佞也孔子曰賜不受命而貨殖焉億則屢中何謂不受命乎説曰受當富之命自以術知數億中時也夫人富貴在天命乎在人知也如在天命知術求之不能得如在人孔子何為言死生有命富貴在天夫謂富不受命而自知術得之貴亦可不受命而自以努力求之世無不受貴命而自得貴亦知無不受富命而自得富者成事孔子不得富貴矣周流應聘行説諸侯智窮䇿困還定詩書望絶無異稱已矣夫自知無貴命周流無補益也孔子知己不受貴命周流求之不能得而謂賜不受富命而以術知得富言行相違未曉其故或曰欲攻子貢之短也子貢不好道德而徒好貨殖故攻其短欲令窮服而更其行節夫攻子貢之短可言賜不好道德而貨殖焉何必言不受命與前言富貴在天相違反也顔淵死子曰噫天喪予此言人將起天與之輔人將廢天奪其佑孔子有四友欲因而起顔淵早夭故曰天喪予問曰顔淵之死孔子不王天奪之邪不幸短命自為死也如短命不幸不得不死孔子雖王猶不得生輔之於人猶杖之扶疾也人有病湏杖而行如斬杖本得短可謂天使病人不得行乎如能起行杖短能使之長乎夫顔淵之短命猶杖之短度也且孔子言天喪予者以顔淵賢也案賢者在世未必為輔也夫賢者未必為輔猶聖人未必受}
