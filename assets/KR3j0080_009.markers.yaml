  - {type: variant, offset: 279, length: 2, content: 傷卒, SBCK: 吐辭也使此言意結文又不解是孔子相示未形悉也弟子不問世俗不難何哉孔子曰公冶長可妻也雖在縲紲之中非其罪也以其子妻之問曰孔子妻公冶長者何據見哉據年三十可妻邪見其行賢可妻也如據其年三十不宜稱在縲紲如見其行賢亦不宜稱在縲紲何則諸入孔子門者皆有善行故稱備徒役徒役之中無妻則妻之耳不湏稱也如徒役之中多無妻公冶長尤賢故獨妻之則其稱之宜列其行不宜言其在縲絏也何則世間彊}
