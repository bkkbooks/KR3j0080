  - {type: variant, offset: 1144, length: 1, content: 趙, SBCK: 問與不問無能抑揚宰我晝寝子曰朽木不可彫也糞土之牆不可杇也於予予何誅是惡宰予之晝寝問曰晝寝之惡也小惡也朽木糞土敗毁不可復成之物大惡也責小過以大惡安能服人使宰我性不善如朽木糞土不宜得入孔子之門序在四科之列使性善孔子惡之惡之太甚過也人之不仁疾之已甚亂也孔子疾宰予可謂甚矣使下愚之人涉耐罪之獄吏令以大辟之罪必寃而怨邪將服而自咎也使宰我愚則與涉耐罪之人同志使宰我賢知孔子責人幾微自改矣明}
