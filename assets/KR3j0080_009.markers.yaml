  front:
  - {type: variant, offset: 0, length: 1, content: 吉, SBCK: 論衡卷第九王充問孔篇問孔篇世儒學者好信師而是古以為賢聖所言皆無非專精講習不知難問夫賢聖下筆造文用意詳審尚未可謂盡得實況倉卒吐言安能皆是不能皆是時人不知難或是而意沉難見時人不知問案賢聖之言上下多相違其文前後多相伐者世之學者不能知也論者皆云孔門之徒七十子之才勝今之儒此言妄也彼見孔子為師聖人傳道必授異才故謂之殊夫古人之才今人之才也今謂之英傑古以爲聖神故謂七十子歷世希有使當今有孔子之師則斯世學者皆顔閔之徒也使無孔子則七十子之徒今之儒生也何以}
