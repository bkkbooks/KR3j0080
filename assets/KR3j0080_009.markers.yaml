  - {type: variant, offset: 1642, length: 6, content: 夜適免母身母, SBCK: 行道無權時以求食吾豈匏􅀲也哉焉能繫而不食自比以匏􅀲者言人當仕而食祿我非匏􅀲繫而不食非子路也孔子之言不解子路之難子路難孔子豈孔子不當仕也哉當擇善國而入之也孔子自比匏􅀲孔子欲安食也且孔子之言何其鄙也何彼仕為食哉君子不宜言也匏􅀲繫而不食亦繫而不仕等也距子路可云吾豈匏􅀲也哉繫而不仕也今吾繫而不食孔子之仕不為行道徒求食也人之仕也主貪祿也禮義之言為行道也猶人之娶也主為欲也禮義之言為供親也仕而直言食娶可直言欲乎孔子之言解情而無依違之意不假義理之名是則俗人非君子也儒者説孔子周流應聘不濟閔道不行失孔子情矣公山弗擾以費畔召子欲往子路曰末如也已何必公山氏之之也子曰夫召我者而豈徒哉如用我吾其為東周乎為東周欲行道也公山佛􅆄俱畔者行道於公山求食於佛􅆄孔子之言無定趨也言無定趨則行無常務矣周流不用豈獨有以乎陽貨欲}
