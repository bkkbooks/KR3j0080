  - {type: variant, offset: 1162, length: 2, content: 陂夢, SBCK: 意孔子曰鯉也死有棺無槨吾不徒行以為之槨鯉之恩深於顔淵鯉死無槨大夫之儀不可徒行也鯉子也顔淵他姓也子死且不禮況其禮他姓之人乎曰是蓋孔子實恩之效也副情於舊館不稱恩於子豈以前為士後為大夫哉如前為士士乗二馬如為大夫大夫乗三馬大夫不可去車徒行何不截賣兩馬以為槨乗其一乎為士時乗二馬截一以賻舊館今亦何不截其二以副恩乗一以解不徒行乎不脱馬以賻舊館未必亂制葬子有棺無槨廢禮傷法孔子重賻舊人之恩輕廢葬子之禮此禮得於他人制失親子也然則孔子不粥車以爲鯉槨何以解於貪官好仕恐無車而自云君子殺身以成仁何難退位以成禮子貢問政子曰足食足兵民信之矣曰必不得巳而去於斯三者何先曰去兵曰必不得巳而去於斯二者何先曰去食自古皆有死民無信不立信最重也問使治國無食民餓棄禮義禮義棄信安所立傳曰倉廪實知禮節衣食足知榮辱讓生於有餘爭生於不足今言去食信安得成春秋之時戰國饑餓易子而食㭊骸而炊口饑不食不暇顧恩義也夫父子之恩信矣饑餓棄信以子為食孔子教子貢去食存信如何夫去信存食雖不欲信信自生矣去食存信雖欲為信信不立矣子適衛冉子僕子曰庶矣哉曰既庶矣又何加焉曰富之曰旣富矣又何加焉曰教之語冉子先富而后敎之教子貢去食而存信食}
