  - {type: variant, offset: 1160, length: 1, content: 澤, SBCK: 夫不可以徒行也弔舊館脱驂以賻惡涕無從哭顔淵慟請車不與使慟無副豈涕與慟殊馬與車異邪於彼則禮情相副於此則恩義不稱未曉孔子為禮}
