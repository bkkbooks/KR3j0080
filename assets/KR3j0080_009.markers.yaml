  - {type: variant, offset: 269, length: 0, content: '', SBCK: 盡解宜難以極之臯陶陳道帝舜之前淺略未極禹問難之淺言復深略指復分蓋起問難此􅀃激而深切觸而著明也孔子􅀏子游之絃歌子游引前言以距孔子自今案論語之文孔子之言多若􅀏弦歌之辭弟子寡若子游之難故孔子之言遂結不解以七十子不能難世之儒生不能實道是非也凡學問之法不為無才難於距師核道實義證定是非也問難之道非必對聖人及生時也世之解説説人者非必湏聖人敎告乃敢言也苟有不曉解之問迢難孔子何傷於義誠有傳聖業之知伐孔子之説何逆於理謂問孔子之言難其不解之文世間􅀪才大知生能荅問解難之人必將賢吾世間難問之言是非孟懿子問孝子曰毋違樊遲御子告之曰孟孫問孝於我我對曰毋違樊遲曰何謂也子曰生事之以禮死葬之以禮問曰孔子之言毋違毋違者禮也孝子亦當先意承志不當違親之欲孔子言毋違不言違禮懿子聴孔子之言獨不為嫌於無違志乎樊遲問何謂孔子乃言生事之以禮死葬之以禮祭之以禮使樊遲不問毋違之説遂不可知也懿子之才不過樊遲故論語篇中不見言行樊遲不曉懿子必能曉哉孟武伯問孝子曰父母唯其疾之憂武伯善憂父母故曰唯其疾之憂武伯憂親懿子違禮攻其短答武伯云父母唯其疾之憂對懿子亦宜言唯水火之變乃違禮周公告小才勑大材略子游之大材也孔子告之勑懿子小才也告之反略違周公之志攻懿子之短失道理之宜弟子不難何哉如以懿子權尊不敢極言則其對武伯亦宜但言毋憂而已但孟氏子也權尊鈞同形武伯而略懿子未曉其故也使孔子對懿子極言毋違禮何}
