  - {type: variant, offset: 1220, length: 117, content: 手斬大虵一嫗當道而哭云赤帝子殺吾子此驗既著聞矣秦始皇帝常曰東南有天子氣於是東遊以厭當之高祖之起也與呂后隱於芒碭山澤間呂后與人求之見其上常有氣直起往求輒得其處後與項羽約先入秦關者王之高祖先至項羽怨恨范增曰吾令人望其氣氣皆為龍成五采此皆天, SBCK: 牟畔}
