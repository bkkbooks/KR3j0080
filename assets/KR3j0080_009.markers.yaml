  - {type: variant, offset: 271, length: 0, content: '', SBCK: 有專魯莫過季氏譏八佾之舞庭刺太山之旅祭不懼季氏增邑不隱諱之害獨畏荅懿子極言之罪何哉且問孝者非一皆有御者對懿子言不但心服臆肯故告樊遲孔子曰富與貴是人之所欲也不以其道得之不居也貧與賤是人之所惡也不以其道得之不去也此言人當由道義得不當茍取也當守節安貧不當妄去也夫言不以其道得富貴不居可也不以其道得貧賤如何富貴顧可去去貧賤何之去貧賤得富貴也不得富貴不去貧賤如謂得富貴不以其道則不去貧賤邪則所得富貴不得貧賤也貧賤何故當言得之顧當言貧與賤是人之所惡也不以其道去之則不去也當言去不當言得得者施於得之也今去之安得言得乎獨富貴當言得耳何者得富貴乃去貧賤也是則以道去貧賤如何脩身行道仕得爵祿富貴得爵祿富貴則去貧賤矣不以其道去貧賤如何}
