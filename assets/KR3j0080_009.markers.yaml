  - {type: variant, offset: 287, length: 3, content: 祚后稷, SBCK: 所妻則是孔子不妻賢妻寃也案孔子之稱公冶長有非辜之言無行能之文實不賢孔子妻之非也實賢孔子稱之不具亦非也誠似妻南容云國有道不廢國無道免於刑戮具稱之矣子謂子貢曰汝與回也孰愈曰賜也何敢望回回也聞一以知十賜也聞一以知二子曰弗如也吾與汝俱不如也是賢顔淵試以問子貢也問曰孔子所以敎者禮讓也子路為國以禮其言不讓孔子非之使子貢實愈顔淵孔子問之猶曰不如使實不及亦曰不如非失對欺師禮讓之言宜謙卑也今孔子出言欲何趣哉使孔子知顔淵愈子貢則不須問子貢使孔子實不知以問子貢子貢謙讓亦不能知使孔子徒欲表善顔淵稱顔淵賢門人莫及於名多矣何須問於子貢子曰賢哉回也又曰吾與回言終日不違如愚又曰回也其心三月不違仁三章皆直稱不以他人激至是一章獨以子貢激之何哉或曰欲抑子貢也當此}
