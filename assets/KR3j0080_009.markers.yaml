  - {type: variant, offset: 304, length: 190, content: 坐息帝嚳之處而妊身怪而棄之隘巷牛馬不敢踐之寘之冰上鳥以翼覆之慶集其身母知其神怪乃收養之長大佐堯位至司馬烏孫王號昆莫匈奴攻殺其父而昆莫生棄於野烏𠾑肉往食之單于怪之以為神而收長之及壯使將兵數有功單于乃復以其父之民予昆莫命令長守於西域夫后稷不當棄故牛馬不踐鳥以羽翼覆愛其身昆莫不當死故烏𠾑肉就而食之北夷橐離國王侍婢有娠王欲殺之婢對曰有氣大如雞子從天而下我故有娠後產子捐於豬溷中豬以口氣噓, SBCK: ''}
