  - {type: variant, offset: 504, length: 636, content: 使馬藉殺之馬復以口氣噓之不死王疑以為天子令其母收取奴畜之名東明令牧牛馬東明善射王恐奪其國也欲殺之東明走南至掩淲水以弓擊水魚鱉浮為橋東明得渡魚鱉解散追兵不得渡因都王夫餘故北夷有夫餘國焉東明之母初妊時見氣從天下及生棄之豬馬以氣吁之而生之長大王欲殺之以弓擊水魚鱉為橋天命不當死故有豬馬之救命當都王夫餘故有魚鱉為橋之助也伊尹且生之時其母夢人謂己曰臼出水疾東走毋顧明旦視臼出水即東走十里顧其鄉皆為水矣伊尹命不當沒故其母感夢而走推此以論歷陽之都其策命若伊尹之類必有先時感動在他地之效齊襄公之難桓公為公子與子糾爭立管仲輔子糾鮑叔佐桓公管仲與桓公爭引弓射之中其帶鉤夫人身長七尺帶約其要鉤挂於帶在身所掩不過一寸之內既微小難中又滑澤銛靡鋒刃中鉤者莫不蹉跌管仲射之正中其鉤中矢觸因落不跌中旁肉命當富貴有神靈之助故有射鉤不中之驗楚共王有五子子招子圍子干子晳棄疾五人皆有寵共王無適立乃望祭山川請神決之乃與巴姬埋璧於太室之庭令五子齊而入拜康王跨之子圍肘加焉子干子晳皆遠之棄疾弱抱而入再拜皆壓紐故共王死招為康王至子失之圍為靈王及身而弒子干為王十有餘日子晳不立又懼俱誅死皆絕無後棄疾後立竟續楚祀如其神符其王日之長短與拜去璧遠近相應也夫璧在地中五子不知相隨入拜遠近不同壓紐若神將教誋之矣晉屠岸賈作難誅趙盾之子朔死其妻有遺腹子及岸賈聞之索於宮母置兒於袴中祝曰趙氏宗滅乎若當啼即不滅若無聲及索之而終不啼遂脫得活程嬰齎負之匿於山中至景公時韓厥言於景公景公乃與韓厥共立趙孤續趙氏祀是為文子當趙孤之無聲若有掩其口者矣, SBCK: 抑已}
