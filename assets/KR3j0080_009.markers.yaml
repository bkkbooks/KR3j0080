  - {type: variant, offset: 1162, length: 2, content: 陂夢, krp: 意孔子曰鯉也死有棺無槨吾不徒行以為之槨鯉之恩深於顔淵鯉死無槨大夫之儀不可徒行也鯉子也顔淵他姓也子死且不禮況其禮他姓之人乎曰是蓋孔子實恩之效也副情於舊館不稱恩於子豈以前為士後為大夫哉如前為士士乗二馬如為大夫大夫乗三馬大夫不可去車徒行何不截賣兩馬以為槨乗其一乎為士時乗二馬截一以賻舊館今亦何不截其二以副恩乗一以解不徒行乎不脱馬以賻舊館未必亂制葬子有棺無槨廢禮傷法孔子重賻舊人之恩輕廢葬子之禮此禮得於他人制失親子也然則孔子不粥車以爲鯉槨何以解於貪官好仕恐無車而自云君子殺身以成仁何難退位以成禮子貢問政子曰足食足兵民信之矣曰必不得巳而去於斯三者何先曰去兵曰必不得巳而去於斯二者何先曰去食自古皆有死民無信不立信最重也問使治國無食民餓棄禮義禮義棄信安所立傳曰倉廪實知禮節衣食足知榮辱讓生於有餘爭生於不足今言去食信安得成春秋之時戰國饑餓易子而食㭊骸而炊口饑不食不暇顧恩義也夫父子之恩信矣饑餓棄信以子為食孔子教子貢去食存信如何夫去信存食雖不欲信信自生矣去食存信雖欲為信信不立矣子適衛冉子僕子曰庶矣哉曰既庶矣又何加焉曰富之曰旣富矣又何加焉曰教之語冉子先富而后敎之教子貢去食而存信食}
  - {type: punctuation, offset: 1163, content: ，, id: KR3j0080_tls_009-bkkpn256}
  - {type: 'tls:seg', offset: 1163, content: '', id: KR3j0080_tls_009-13a.4}
  - {type: variant, offset: 1165, length: 3, content: 神遇是, SBCK: 富何别信與敎何異二子殊敎所尚不同孔子為國意何定哉蘧伯玉使人於孔子孔子曰夫子何為乎對曰夫子欲寡其過而未能也使者出孔子曰使乎使乎非之也説論語者非曰之者非其代人謙也夫孔子之問使者曰夫子何為問所治為非問操行也如孔子之問也使者宜對曰夫子為某事治某政今反言欲寡其過而未能也何以知其對不失指孔子非之也且實孔子何以非使者非其代人謙之乎其非乎對失指也所非猶有一實不明其過而徒云使乎使乎後世疑惑不知使者所以為過韓子曰書約則弟子辨孔子之言使乎何其約也或曰春秋之義也為賢者諱蘧伯玉賢故諱其使者夫欲知其子視其友欲知其君視其所使伯玉不賢故所使過也春秋之義為賢者諱亦貶纎介之惡今不非而諱貶纎介安所施哉使孔子為伯玉諱宜黙而已揚言曰使乎使乎}
