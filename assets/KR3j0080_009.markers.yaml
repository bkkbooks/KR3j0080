  - {type: variant, offset: 1153, length: 1, content: 母, SBCK: 有不聖為輔有不賢何則祿命骨法與才異也由此言之顔淵生未必為輔其死未必有喪孔子云天喪予何據見哉且天不使孔子王者本意如何本禀性命之時不使之王邪將使之王復中悔之也如本不使之王顔淵死何喪如本使之王復中悔之此王無骨法便宜自在天也且本何善所見而使之王後何惡所聞中悔不命天神論議誤不諦也孔子之衛遇舊館人之喪入而哭之出使子貢脱驂而賻之子貢}
