  - {type: variant, offset: 1155, length: 4, content: 劉媼嘗息, SBCK: 於門人之喪未有所脱驂脱驂於舊館毋乃已重乎孔子曰予鄉者入而哭之遇於一哀而出涕予惡夫涕之無從也小子行之孔子脱驂以賻舊舘者惡情不副禮也副情而行禮情起而恩動禮情相應君子行之顔淵死子哭之慟門人曰子慟矣吾非斯人之慟而誰為夫慟哀之至也哭顔淵慟者殊之衆徒哀痛之甚也死有棺無槨顔路請車以為之槨孔子不予為}
