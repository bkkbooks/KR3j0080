  - {type: variant, offset: 31, length: 235, content: 人物或以禎祥或以光氣傳言黃帝妊二十月而生生而神靈弱而能言長大率諸侯諸侯歸之教熊羆戰以伐炎帝炎帝敗績性與人異故在母之身留多十月命當為帝故能教物物為之使堯體就之如日望之若雲洪水滔天虵龍為害堯使禹治水驅虵龍水治東流虵龍潛處有殊奇之骨故有詭異之驗有神靈之命故有驗物之效天命當貴故從唐侯入嗣帝后之位舜未逢堯鰥在側陋瞽瞍與象謀欲殺之使之完廩火燔其下令之浚井土掩其上舜得下廩不被火災穿井旁出不觸土害堯聞徵用試之於職官治職脩事無廢亂使入大麓之野虎狼不搏蝮虵不噬逢烈風疾雨行不迷惑夫人欲殺, SBCK: 發}
