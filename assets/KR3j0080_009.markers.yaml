之子子路曰有社稷焉有民人焉何必讀書然後為學子曰是故惡夫佞者子路知其不可苟對自遂孔子惡之比夫佞者孔子亦知其不可苟應或人孔子子路皆以佞也孔子曰賜不受命而貨殖焉億則屢中何謂不受命乎説曰受當富之命自以術知數億中時也夫人富貴在天命乎在人知也如在天命知術求之不能得如在人孔子何為言死生有命富貴在天夫謂富不受命而自知術得之貴亦可不受命而自以努力求之世無不受貴命而自得貴亦知無不受富命而自得富者成事孔子不得富貴矣周流應聘行説諸侯智窮䇿困還定詩書望絶無異稱已矣夫自知無貴命周流無補益也孔子知己不受貴命周流求之不能得而謂賜不受富命而以術知得富言行相違未曉其故或曰欲攻子貢之短也子貢不好道德而徒好貨殖故攻其短欲令窮服而更其行節夫攻子貢之短可言賜不好道德而貨殖焉何必言不受命與前言富貴在天相違反也顔淵死子曰噫天喪予此言人將起天與之輔人將廢天奪其佑孔子有四友欲因而起顔淵早夭故曰天喪予問曰顔淵之死孔子不王天奪之邪不幸短命自為死也如短命不幸不得不死孔子雖王猶不得生輔之於人猶杖之扶疾也人有病湏杖而行如斬杖本得短可謂天使病人不得行乎如能起行杖短能使之長乎夫顔淵之短命猶杖之短度也且孔子言天喪予者以顔淵賢也案賢者在世未必為輔也夫賢者未必為輔猶聖人未必受}
