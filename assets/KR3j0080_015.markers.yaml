  - {type: 'tls:seg', offset: 1184, content: '', id: KR3j0080_tls_015-11a.1}
  - {type: variant, offset: 1184, length: 0, content: '', SBCK: 事地母之黨類為害可攻母以救之乎以政令失道陰陽繆盭者人君也不自攻以復之反逆節以犯尊天地安肯濟使湛水害傷天不以地害天攻之可也今湛水所傷物也萬物於地卑也害犯至尊之體於道違逆論春秋者曾不知難案雨出於山流入於川湛水之類山川是矣大水之災不攻山川社土也五行之性水土不同以水為害而攻土上勝水攻社之義母乃如今世工匠之用椎鑿也以椎擊鑿令鑿穿木今儻攻土令厭水乎且夫攻社之義以為攻陰之類也甲為盜賊傷害人民甲在不亡舎甲而攻乙之家耐止甲乎今雨者水也水在不自攻水而乃攻社案天將雨山先出雲雲積為雨雨流為水然則山者父母水者子弟也重罪刑及族屬罪父母子弟乎罪其朋徒也計山水與社俱為雨類也孰爲親者社土也五行異氣相去遠殷太戊桑穀俱生或曰高宗恐駭側身行道思索先王之政興滅國繼絶世舉逸民明養老之義桑穀消亡享國長久此說者春秋所共聞也水災與桑榖之變}
