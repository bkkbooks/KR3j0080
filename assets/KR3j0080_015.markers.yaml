  - {type: variant, offset: 1067, length: 0, content: '', SBCK: 隨行而應人春秋魯大雩旱求雨之祭也旱久不雨禱祭求福若人之疾病祭神解禍矣此變復也詩云月離于畢比滂沲矣書曰月之從星則以風雨然則風雨隨月所離從也房星四表三道日月之行出入三道出北則湛出南則旱或言出北則旱南則湛案月為天下占房為九州候月之南北非獨為魯也孔子出使子路齎雨具有頃天果大雨子路問其故孔子曰昨暮月離于畢後日月復離畢孔子出子路請齎雨具孔子不聽出果無雨子路問其故孔子曰昔日月離其陰故雨昨暮月離其陽故不雨夫如是魯雨自以月離豈以政哉如審以政令月離于畢為雨占天下共之魯雨天下亦冝皆雨六國之時政治不同人君所行賞罰異時必以雨為應政令月離六七畢星然後足也魯繆公之時歳旱繆公問縣子天旱不雨寡人欲暴巫奚如縣子不聽欲徙市奚如對曰天子崩巷市七日諸公薨巷市五日為之徙市不亦可乎案縣子之言徙市得雨也案詩書之文月離星得雨日月之行有常節度肯為徙市故離畢之陰乎夫月畢天下占徙魯之市安耐移月月之行天三十日而周一月之中一過畢星離陽則陽假令徙市之感能令月離畢陽其時徙市而得雨乎夫如縣子言未可用也董仲舒求雨申春秋之義設虛立祀父不食於枝庶天不食於下地諸侯雩禮所祀未知何神如天神也唯王者天乃歆諸侯及今長吏天不享也神不歆享安耐得神如雲雨者氣也雲雨之氣何用歆享觸石而出膚寸而合不崇朝而辨雨天下泰山也泰山雨天下小山雨國邑然則大雩所祭豈祭山乎假令審然而不得也何以效之水異川而居相高分寸不決不流不鑿不合誠令人君禱祭水旁能令高分寸之水流而合乎夫見在之水相差無㡬人君請之終不耐行況雨無形兆深藏高山人君雩祭安耐得之夫雨水在天地之間也猶夫涕泣在人形中也或賫酒食請於惠人之前未出其泣惠人終不為之隕涕夫泣不可請而出雨安可求而得雍門子悲哭孟甞君為之流涕蘇秦張儀悲說坈中鬼谷先生泣下沾襟或者儻可為雍門之聲出蘇張之說以感天乎天又耳目高逺音氣不通杞梁之妻又已悲哭天不雨而城反崩夫如是竟當何以致雨雩祭之家何用感天案月出北道離畢之陰希有不雨由此言之北道畢星之所在也北道星肯為雩祭之故下其雨乎孔子出使子路齎雨具之時魯未必雩祭也不祭沛然自雨不求曠然自暘夫如是天之暘雨自有時也一歳之中暘雨連屬當其雨也誰求之者當其暘也誰止之者人君聽請以安民施恩必非賢也天至賢矣時未當雨僞請求之故妄下其雨人君聽請之類也變復之家不推類驗之空張法術惑人君或未當雨而賢君求之而不得或適當自雨惡君求之遭遇其時是使賢君受空責而惡君䝉虛名也世稱聖人純而賢者駮純則行操無非無非則政治無失然而世之聖君莫有如堯湯堯遭洪水湯遭大旱如謂政治所致堯湯惡君也如非政治是運氣也運氣有時安可請求世之論者猶謂堯湯水旱水旱者時也其小旱湛皆政也假令審然何用致湛審以政致之不脩所以失之而從請求安耐復之世審稱堯湯水旱天之運氣非政所致夫天之運氣時當自然雖雩祭請求終無補益而世又稱湯以五過禱於桑林時立得雨夫言運氣則桑林之說絀稱桑林則運氣之論消世之說稱者竟當何由救水旱之術審當何用夫災變大抵有二有政治之災有無妄之變政治之災湏耐求之求之雖不耐得而惠愍惻隱之恩不得已之意也慈父之於子孝子之於親知病不祀神疾痛不和藥又知病之必不可治治之無益然終不肯安坐待絶猶卜筮求祟召毉和藥者惻痛慇懃兾有驗也既死氣絶不可如何升屋之危以衣招復悲恨思慕兾其悟也雩祭者之用心慈父孝子之用意也無妄之災百民不知必歸於主為政治者慰民之望故亦必雩問政治之災無妄之變何以别之曰德鄷政得災猶至者無妄也德衰政失變應來者政治也夫政治治字一有也則外雩而内改以復其虧無妄則内守舊政外脩雩禮以慰民心故夫無妄之氣歴世時至當固自一不冝改政何以驗之周公為成王陳立政之言曰時則物有間之自一話一言我則末維成徳之彦以乂我受民周公立政可謂得矣知非常之物不賑不至故勑成王自一話一言政事無非毋敢變易然則非常之變無妄之氣間而至也水氣間堯旱氣間湯周宣以賢遭遇久旱建初孟季北州連旱牛死民乏放流就賤聖主寛明於上百官共職於下太平之明時也政無細非旱猶有氣間之也聖主知之不改政行轉穀賑贍損鄷濟耗斯見之審明所以救赴之者得冝也魯文公間歳大旱臧文仲曰脩城郭貶食省用務嗇勸分文仲知非政故徒脩備不改政治變復之家見變輒歸於政不揆政之無非見異懼惑變易操行以不冝改而變秪取災焉何以言必當雩也曰春秋大雩傳家在宣公羊穀梁無譏之文當雩明矣曽晳對孔子言其志曰暮春者春服既成冠者五六人童子六七人浴乎沂風乎舞雩詠而歸孔子曰吾}
