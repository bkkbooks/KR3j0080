  - {type: variant, offset: 1185, length: 0, content: '', SBCK: 以異殷王改政春秋攻社道相違反行之何從周成王之時天下雷雨偃禾㧞木爲害大矣成王開金縢之書求索行事周公之功執書以泣遏雨止風反禾大木復起大雨乆湛其實一也成王改過春秋攻社兩經二義行之如何月令之家蟲食榖稼取蟲}
