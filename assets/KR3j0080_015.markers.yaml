  - {type: variant, offset: 1038, length: 2, content: 異類, WYG: 猶蚤虱之在衣裳之内螻蟻之在宂隙之中蚤虱螻蟻為逆順横從能令衣裳宂隙之間氣變動乎蚤虱螻蟻不能而獨謂人能不達物氣之理也夫風至而樹枝動樹枝不能致風是故夏末蜻􅖹鳴寒螿啼感陰氣也雷動而雉驚發蟄而虵出起陽氣也夜及半而鶴唳晨將旦而雞鳴此雖非變天氣動物物應天氣之驗也顧可言寒温感動人君人君起氣而以賞罰迺言以賞罰感動皇天天為寒温以應政治乎六情風家言風至為盜賊者感應之而起非盜賊之人精氣感天使風至也風至怪不軌之心而盜賊之操發矣何以驗之盜賊之人見物而取睹敵而殺皆在徙倚漏刻之間未必宿日有其思也而天風已以貪狠陰賊之日至矣以風占貴賤者風從王相鄉來則貴從囚死地來則賤夫貴賤多少斗斛故也風至而糴穀之人貴賤其價天氣動怪人物者也故穀價低昻一貴一賤矣天官之書以正月朝占四方之風風從南方來者旱從北方來者湛東方來者為疫西方來者為兵太史公實道言以風占水旱兵疫者人物吉凶統於天也使物生者春也物死者冬也春生而冬殺也天者如或欲春殺冬生物終不死生何也物生統於陽物死繫於陰也故以口氣吹人人不能寒吁人人不能温使見吹吁之人渉冬觸夏將有凍暘之患矣寒温之氣繫於天地而統於陰陽人事國政安能動之且天本而人末也登樹壞其枝不能動其株如伐株萬莖枯矣人事猶樹枝寒温猶根株也生於天含天之氣以天為主猶耳目手足繫於心矣心有所為耳目視聽手足動作謂天應人是謂心為耳目手足使乎旌旗垂旒旒綴於杆杆冝讀為韜杠之杠杆東則旒隨而西茍謂寒温隨刑罰而至是以天氣為綴旒也鉤星在房心之間地且動之占也齊太卜知之謂景公臣能動地景公信之夫謂人君能致寒温猶齊景公信太卜之能動地夫人不能動地而亦不能動天夫寒温天氣也天至高大人至卑小篙或作筳不能鳴鐘而螢火不爨鼎者何也鐘長而篙短鼎大而螢小也以七尺之細形感皇天之大氣其無分銖之驗必也占大將且入國邑氣寒則將且怒温則將喜夫喜怒起事而發未入界未見吏民是非未察喜怒未發而寒温之氣已豫至矣怒喜致寒温怒喜之後氣乃當至是竟寒温之氣使人君怒喜也或曰未至誠也行事至誠若鄒衍之呼天而霜降杞梁妻哭而城崩何天氣之不能動乎夫至誠猶以心意之好惡也有果蓏}
