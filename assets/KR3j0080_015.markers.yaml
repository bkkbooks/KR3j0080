  - {type: variant, offset: 1043, length: 3, content: 與交接, WYG: 掠之被捶流血二子寃屈太史公列記其狀鄒衍見拘雎儀之比也且子長何諱不言案衍列傳不言見拘而使霜降偽書遊言猶太子丹使日再中天雨粟也由此言之衍呼而降霜虛矣則杞梁之妻哭而崩城妄也頓牟叛趙襄子帥師攻之軍到城下頓牟之城崩者十餘丈襄子擊金而退之夫以杞梁妻哭而城崩襄子之軍有哭者乎秦之將滅都門内崩霍光家且敗第墻自壊誰哭於秦宫泣於霍光家者然而門崩墻壞秦霍敗亡之徴也或時杞國且圯而杞梁之妻適哭城下猶燕國適寒而鄒衍偶呼也事以類而時相因聞見之者或而然之又城老墻朽猶有崩壞一婦之哭崩五丈之城是城則一指摧三仞之楹也春秋之時山多變山城一類也哭能崩城復能壞山乎女然素縞而哭河河流通信哭城崩固其冝也案杞梁從軍死不歸其婦迎之魯君弔於途妻不受弔棺歸於家魯君就弔不言哭於城下本從軍死從軍死不在城中妻向城哭非其處也然則杞梁之妻哭而崩城復虛言也因類以及荆軻秦王白虹貫日衞先生為秦畫長平之計太白食昴復妄言也夫豫子謀殺襄子伏於橋下襄子至橋心動貫高欲殺高祖藏人於壁中高祖至柏人亦動心二子欲刺兩主兩主心動實論之尚謂非二子精神所能感也而況荆軻欲刺秦王秦王之心不動而白虹貫日乎然則白虹貫日天變自成非軻之精為虹而貫日也鉤星在房心間地且動之占也地且動鉤星應房心夫太白食􅄧猶鉤星在房心也謂衛先生長平之議令太白食􅄧疑矣歳星害鳥尾周楚惡之綝然之氣見宋衛陳鄭災案時周楚}
