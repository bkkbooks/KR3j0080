  - {type: variant, offset: 1631, length: 0, content: '', SBCK: 周公而求也為之聚歛而附益之孔子曰非吾徒也小子鳴鼓攻之可也攻者責也責讓之也六國兵革相攻不得難此此又非也以卑而責尊為逆矣或據}
