  - {type: variant, offset: 1625, length: 5, content: 聖人更稟氣, SBCK: 董仲舒之議其故何哉夫春秋經但言鼓豈言攻哉說者見有鼓文則言攻矣夫鼓未必為攻說者用意異也季氏富}
