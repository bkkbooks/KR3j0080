  - {type: variant, offset: 1081, length: 0, content: '', krp: 浴乎沂涉沂水也象龍之從水中出也風乎舞雩風歌也詠而饋詠歌饋祭也歌詠而祭也說論之家以為浴者浴沂水中也風乾身也周之四月正歳二月也尚寒安得浴而風乾身由此言之涉水不浴雩祭審矣春秋左氏傳曰啓蟄而雩又曰龍見而雩啓蟄龍見皆二月也春二月雩秋八月亦雩春祈穀雨秋祈穀實當今靈星秋之雩也春雩廢秋雩在故靈星之祀歳雩祭也孔子曰吾與㸃也善㸃之言欲以雩祭調和陰陽故與之也使雩失正㸃欲為之孔子冝非不當與也樊遲從游感雩而問刺魯不能崇徳而徒雩也夫雩古而有之故禮曰雩祭祭水旱也故有雩禮故孔子不譏而仲舒申之夫如是雩祭祀禮也雩祭得禮則大水鼓用牲于社亦古禮也得禮無非當雩一也禮祭也社報生萬物之功土地廣逺難得辨祭故立社為位主心事之為水旱者陰陽之氣也滿六合難得盡祀故脩壇設位敬恭祈求效事社之義復災變之道也推生事死推}
  - {type: variant, offset: 1082, length: 0, content: '', SBCK: 事鬼陰陽精氣儻如生人能飲食乎故共馨香奉進㫖嘉區區惓惓兾見荅享推祭社言之當雩二也歳氣調和災害}
