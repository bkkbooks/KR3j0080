  - {type: variant, offset: 133, length: 652, content: 信其說明事以驗證故人然其文讖書又言堯母慶都野出赤龍感己遂生堯高祖本紀言劉媼嘗息大澤之陂夢與神遇是時雷電晦冥太公往視見蛟龍於上已而有身遂生高祖其言神驗文又明著世儒學者莫謂不然如實論之虛妄言也彼詩言不坼不副言其不感動母體可也言其闓母背而出妄也夫蟬之生於復育也闓背而出天之生聖子與復育同道乎兔舐雄毫而懷子及其子生從口而出案禹母吞薏苡禼母嚥鷰卵與兔吮毫同實也禹禼之母生子宜皆從口不當闓背夫如是闓背之說竟虛妄也世間血刃死者多未必其先祖初為人者生時逆也秦失天下閻樂斬胡亥項羽誅子嬰秦之先祖伯翳豈逆生乎夫如是為順逆之說以驗三家之祖誤矣且夫薏苡草也燕卵鳥也大人跡土也三者皆形非氣也安能生人說聖者以為稟天精微之氣故其為有殊絕之知今三家之生以草以鳥以土可謂精微乎天地之性唯人為貴則物賤矣今貴人之氣更稟賤物之精安能精微乎夫令鳩雀施氣於鴈鵠終不成子者何也鳩雀之身小鴈鵠之形大也今燕之身不過五寸薏苡之莖不過數尺二女吞其卵實安能成七尺之形乎爍一鼎之銅以灌一錢之形不能成一鼎明矣今謂大人天神故其跡巨巨跡之人一鼎之爍銅也姜原之身一錢之形也使大人施氣於姜原姜原之身小安能盡得其精不能盡得其精則后稷不能成人堯高祖審龍之子子性類父龍能乘雲堯與高祖亦宜能焉萬物生於土各似本種不類土者生不出於土土徒養育之也母之懷子猶土之育物也堯高祖之母受龍之施猶土受物之播也物生自類本種夫二帝宜似龍也且夫含血之類相與為牝牡牝牡之會皆見同類之物精感欲動乃能授施若夫牡馬見雌牛雄雀見牝雞不相與合者異類故也今龍與人異類何能感於人而施氣或曰夏之衰二龍鬭於庭吐漦於地龍亡漦, SBCK: ''}
