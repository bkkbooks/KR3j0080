  - {type: variant, offset: 1632, length: 0, content: '', krp: 責之也王者母事地}
  - {type: variant, offset: 1634, length: 0, content: '', SBCK: 過子可據父以責之乎下之於上冝言諫若事臣子之禮也責讓上之禮也乖違禮意行之如何夫禮以鼓助號呼明聲響也古者人君將出撞鍾擊鼓故警戒下也必以伐鼓為攻此社此則鍾聲鼓鳴攻擊上也大水用鼔或時再告社陰之太盛雨湛不霽陰盛陽㣲非道之冝口祝不副以鼓自助與日食鼓用牲于社同一義也俱為告急彰陰盛也事大而急者用鍾鼓小而緩者用鈴􅧛彰事告急助口氣也大道難知大水久湛假令政治所致猶先告急乃斯政行盜賊之發與此同操盜賊亦政所致比求闕失猶先發告鼓用牲于社發覺之也社者衆陰之長故伐鼓使社知之說鼓者以爲攻之故攻毋逆義之難縁此而至今言告以陰盛陽㣲攻尊之難奚從來哉且告冝於用牲用牲不冝於攻告事用牲禮也攻之用牲於禮何見朱絲如繩示在暘也暘氣實㣲故用物㣲也投一寸之鍼布一丸之艾於血脉之蹊篤病有瘳朱絲如一寸之鍼一丸之艾也吳攻破楚昭王亡走申包胥間步赴秦哭泣求救卒得助兵却吳而存楚擊鼓之人伐如何耳使誠若申包胥一人擊得假令一人擊鼓將耐令社與秦王同}
