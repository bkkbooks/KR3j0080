  - {type: variant, offset: 1183, length: 0, content: '', SBCK: 心考仲舒之意孔子既殁仲舒已死世之論者孰當復問唯若孔子之徒仲舒之黨為能說之順鼓篇春秋之義大水鼓用牲于社說者曰鼓者攻之也或曰脅之脅則攻矣陽勝攻社以救之或難曰攻社謂得勝負之義未可得順義之節也人君父事天}
  - {type: variant, offset: 1183, length: 0, content: '', WYG: 心考仲舒之意孔子既殁仲舒已死世之論者孰當復問唯若孔子之徒仲舒之黨為能說之順鼓篇春秋之義大水鼓用牲于社說者曰鼓者攻之也或曰脅之脅則攻矣陽勝攻社以救之或難曰攻社謂得勝負之義未可得順義之節也人君父事天}
