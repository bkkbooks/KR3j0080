  - {type: variant, offset: 1048, length: 0, content: '', SBCK: 害周楚天氣災四國也何知白虹貫日不致刺秦王太白食昴使長平計起也明雩篇變復之家以久雨為湛久暘為旱旱應亢陽湛應沈溺或難曰夫一歳之中十日者一雨五日者一風雨頗留湛之兆也暘頗久旱之漸也湛之時人君未必沈溺也旱之時未必亢陽也人君為政前後若一然而一湛一旱時氣也范蠡計然曰太歳在子水毁金穰木饑火旱夫如是水旱饑穰}
