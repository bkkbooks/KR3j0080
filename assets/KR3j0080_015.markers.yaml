  - {type: variant, offset: 1624, length: 0, content: '', SBCK: 旱則為沈溺之行水則爲亢陽之操何乃攻社攻社不解朱絲縈之亦復未曉說者以爲社陰朱陽也水陰也以陽色縈之助鼓爲救夫大山失火灌以壅水衆知不能救之者何也火盛水少熱不能勝也今國湛水猶大山失火也以若繩之絲縈社爲救猶以壅水灌大山也原天心以人意狀天治以人事人相攻擊氣不相兼兵不相負不能取勝今一國水使真欲攻陽以絶其氣悉發國人操刀把杖以擊之若歳終逐疫然后爲可楚漢之際六國之時兵革戰攻力彊則勝弱劣則負攻社一人擊鼓無兵革之威安能救雨夫一暘一雨猶一晝一夜也其遭若堯湯之水旱猶一冬一夏也如或欲以人事祭祀復塞其變冬求為夏夜求為晝也何以效之久雨不霽試使人君高枕安臥雨猶自止止久至於大旱試使人君高枕安臥旱猶自雨何則暘極反陰陰極反暘故夫天地之有湛也何以知不如人之有水病也其有旱也何以知不如人有癉疾也禱請求福終不能愈變操易行終不能救使醫食藥兾可得愈命盡期至醫藥無效堯遭洪水春秋之大水也聖君知之不禱於神不改乎政使禹治之百川東流夫堯之使禹治水猶病水者之使醫也然則堯之洪水天地之水病也禹之治水洪水之良醫也説者何以易之攻社之義於事不得雨不霽祭女媧於禮何見伏羲女媧俱聖者也舎伏羲而祭女媧春秋不}
