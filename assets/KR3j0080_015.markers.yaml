  - {type: variant, offset: 1042, length: 0, content: '', SBCK: 在人之前去口一尺心欲食之口氣吸之不能取也手掇送口然後得之夫以果蓏之細貟圌易轉去口不遠至誠欲之不能得也況天去人高遠其氣莽蒼無端末乎盛夏之時當風而立隆冬之月嚮日而坐其夏欲得寒而冬欲得温也至誠極矣欲之甚者至或當風鼓箑嚮日燃爐而天終不為冬夏易氣寒暑有節不為人變改也夫正欲得之而猶不能致況自刑賞意思不欲求寒温乎萬人俱歎未能動天一鄒衍之口安能降霜鄒衍之狀孰與屈原見拘之寃孰與沉江離騷楚辭悽愴孰與一歎屈原死時楚國無霜此懷襄之世也厲武之時卞和獻玉刖其兩足奉玉泣出涕盡續之以血夫鄒衍之誠孰與卞和見拘之寃孰與刖足仰天而歎孰與泣血夫歎固不如泣拘固不如刖料計寃情衍不如和當時楚地不見霜李斯趙高讒殺太子扶蘇并及䝉恬䝉驁其時皆吐痛苦之言與歎聲同又禍至死非徒茍徙而其死之地寒氣不生秦坑趙卒於長平之下四十萬衆同時俱陷當時啼號非徒歎也誠雖不及鄒衍四十萬之寃度當一賢臣之痛入坑塪之啼度過拘囚之呼當時長平之下不見隕霜甫刑曰庶僇旁告無辜于天帝此言蚩尤之民被寃旁告無罪于上天也以衆民之叫不能致霜鄒衍之言殆虛妄也南方至熱煎沙爛石父子同水而浴北方至寒凝冰坼土父子同穴而處燕在北邊鄒衍時周之五月正歳三月也中州内正月二月霜雪時降北邊至寒三月下霜未為變也此殆北邊三月尚寒霜適自降而衍適呼與霜逢會傳曰燕有寒谷不生五榖鄒衍吹律寒谷復温則能使氣温亦能使氣復寒何知衍不令時人知巳之寃以天氣表巳之誠竊吹律於燕谷獄令氣寒而因呼天乎即不然者霜何故降范雎為湏賈所讒魏齊僇之折幹摺脅張儀遊於楚楚}
