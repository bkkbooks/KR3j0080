  - {type: variant, offset: 1083, length: 3, content: 好蟣虱, SBCK: 生尚猶而雩今有靈星古昔之禮也況歳氣有變水旱不時人君之懼必痛甚矣雖有靈星之祀猶復雩恐前不備肜繹之義也兾復災變之虧獲鄷穰之報三也禮之心悃愊樂之意歡忻悃愊以玉帛效心歡忻以鍾鼓驗意雩祭請祈人君精誠也精誠在内無以效外故雩祀盡已惶懼闗納精心於雩祀之前玉帛鍾鼓之義四也臣得罪於君子獲過於父比自改更且當謝罪惶懼於旱如政治所致臣子得罪獲過之類也黙改政治潜易操行不彰於外}
