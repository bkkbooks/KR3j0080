  - {type: variant, offset: 770, length: 169, content: 周宣王之時遭大旱之災也詩人傷旱之甚民被其害言無有孑遺一人不愁痛者夫旱甚則有之矣言無孑遺一人增之也夫周之民猶今之民也使今之民也遭大旱之災貧羸無蓄積扣心思雨若其富人穀食饒足者廩囷不空口腹不飢何愁之有天之旱也山林之間不枯猶地之水丘陵之上不湛也山林之間富貴之人必有遺脫者矣而言靡有孑遺增益其文欲言旱甚也易曰豐其屋蔀其家窺其戶闃其無人也非其無人也無, SBCK: 百工皆}
