  - {type: variant, offset: 9, length: 0, content: '', SBCK: 之選舉多少未可以知實或徳髙而舉之少或才下而薦之多明君求善察惡於多少之間時得善惡之實矣且廣交多徒求索衆心者人愛而稱之清直不容鄉黨志潔不交非徒失衆心者人憎而毁之故名多生於知謝毁多失於衆意齊威王以毁封即墨大夫以譽烹阿大夫即墨有功而無譽阿無效而有名也子貢問曰鄉人皆好之何如孔子曰未可也鄉人皆惡之何如曰未可也不若鄉人之善者好之其不善者惡之夫如是稱譽多而小大皆言善者非賢也善人稱之惡人毁之毁譽者半乃可有賢以善人所稱惡人所毁可以知賢乎夫如是孔子之言可以知賢不知譽此人也者賢毁此人者惡也或時稱者惡而毁者善也人􅅭惑無别也以人衆所歸附賓客雲合者為賢乎則夫人衆所附歸者或亦廣交多徒之人也衆愛而稱之則蟻附而歸之矣或尊貴而為利或好士下客折節俟賢信陵孟甞平原春申食客數千稱為賢君大將軍衛青及霍去病門無一客稱為名將故賔客之會在好下之君利害之賢或不好士不能為輕重則衆不歸而士不附也以居位治人得民心歌詠之為賢乎則夫得民心者與彼得士意者無以異也為虚恩拊循其民民之欲得即喜樂矣何以效之齊田成子越王句踐是也成子欲專齊政以大斗貸小斗收而民恱句踐欲雪㑹稽之耻拊循其民弔死問病而民喜二者皆自有所欲為於他而偽誘屬其民誠心不加而民亦說孟嘗君夜出秦闗雞未鳴而闗不闓下坐賤客鼔臂為雞鳴而雞皆和之闗即闓而孟嘗得出又雞可以姦聲感則人亦可以偽恩動也人可以偽恩動則天亦可巧詐應也動致天氣宜以精神而人用陽燧取火於天消鍊五石五月盛夏鑄以為器乃能得火今又但取刀劒恒銅鉤之屬切磨以嚮日亦得火焉夫陽燧刀劒鉤能取火於日恒非賢聖亦能動氣於天若董仲舒信土龍之能致雲雨盖亦有以也夫如是應天之治尚未可謂賢况徒得人心即謂之賢如何以居職有成功見效為賢乎夫居職何以為功效以人民附之則人民可以偽恩說也隂陽和百姓安者時也時和不肖遭其安不和雖聖逢其危如以隂陽和而效賢不肖則堯以洪水得黜湯以大旱為殿下矣如功效謂}
