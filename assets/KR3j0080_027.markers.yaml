  - {type: variant, offset: 1624, length: 621, content: 民臣蒙恩者非一而祖伊增語欲以懼紂也故曰語不益心不惕心不惕行不易增其語欲以懼之冀其警悟也蘇秦說齊王曰臨菑之中車轂擊人肩磨舉袖成幕連衽成帷揮汗成雨齊雖熾盛不能如此蘇秦增語激齊王也祖伊之諫紂猶蘇秦之說齊王也賢聖增文外有所為內未必然何以明之夫武成之篇言武王伐紂血流浮杵助戰者多故至血流如此皆欲紂之亡也土崩瓦解安肯戰乎然祖伊之言民無不欲如蘇秦增語武成言血流浮杵亦太過焉死者血流安能浮杵案武王伐紂於牧之野河北地高壤靡不乾燥兵頓血流輒燥入土安得杵浮且周殷士卒皆齎盛糧或作乾糧無杵臼之事安得杵而浮之言血流杵欲言誅紂惟兵頓士傷故至浮杵春秋莊公七年夏四月辛卯夜中恆星不見星霣如雨公羊傳曰如雨者何非雨也非雨則曷為謂之如雨不脩春秋曰如雨星不及地尺而復君子脩之曰星霣如雨不脩春秋者未脩春秋時魯史記曰雨星不及地尺如復君子者謂孔子也孔子脩之曰星霣如雨如雨者如雨狀也山氣為雲上不及天下而為雲雨星星隕不及地上復在天故曰如雨孔子正言也夫星霣或時至地或時不能尺丈之數難審也史記言尺亦以太甚矣夫地有樓臺山陵安得言尺孔子言如雨得其實矣孔子作春秋故正言如雨如孔子不作不及地尺之文遂傳至今光武皇帝之時郎中汝南賁光上書言孝文皇帝時居明光宮天下斷獄三人頌美文帝陳其效實光武皇帝曰孝文時不居明光宮斷獄不三人積善修德美名流之是以君子惡居下流夫賁光上書於漢漢為今世增益功美猶過其實況上古帝王久遠賢人從後褒述失實離本獨已多矣不遭光武論千世之後孝文之事載在經藝之上人不知其增居明光宮斷獄三人而遂為實事也, SBCK: ''}
