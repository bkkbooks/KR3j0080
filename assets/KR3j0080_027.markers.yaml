  - {type: variant, offset: 1014, length: 485, content: 官尚書之官易之戶中猶能有益如何謂之空而無人詩曰濟濟多士文王以寧此言文王得賢者多而不肖者少也今易宜言闃其少人尚書宜言無少眾官以少言之可也言空而無人亦尤甚焉五穀之於人也食之皆飽稻粱之味甘而多腴豆麥雖糲亦能愈飢食豆麥者皆謂糲而不甘莫謂腹空無所食竹木之杖皆能扶病竹杖之力弱劣不及木或操竹杖皆謂不勁莫謂手空無把持夫不肖之臣豆麥竹杖之類也易持其具臣在戶言無人者惡之甚也尚書眾官亦容小材而云無空者刺之甚也論語曰大哉堯之為君也蕩蕩乎民無能名焉傳曰有年五十擊壤於路者觀者曰大哉堯之德乎擊壤者曰吾日出而作日入而息鑿井而飲耕田而食堯何等力此言蕩蕩無能名之效也言蕩蕩可也乃欲言民無能名增之也四海之大萬民之眾無能名堯之德者殆不實也夫擊壤者曰堯何等力欲言民無能名也觀者曰大哉堯之德乎此何等民者猶能知之實有知之者云無竟增之儒書又言堯舜之民可比屋而封言其家有君子之行可皆官也夫言可封可也言比屋增之也人年五十為人父為人父而不知君何以示子太平之世家為君子人有禮義父不失禮子不廢行夫有行者有知知君莫如臣臣賢能知君能知其君故能治其民今不能知堯何可封官年五十擊壤於路與豎子未成人者為伍何等賢者子路使子羔為郈宰孔子, SBCK: 朕前時輻湊並至}
