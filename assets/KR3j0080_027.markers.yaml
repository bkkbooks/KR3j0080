  - {type: variant, offset: 4, length: 1, content: 俗, SBCK: 人且不能知賢安能知聖乎世人雖言知賢此言妄也知賢何用知之如何以仕宦得髙官身冨貴爲賢乎則冨貴者天命也命冨貴不爲賢命貧賤不爲不肖必以冨貴效賢不肖是則仕宦以才不以命也以事君調合寡過爲賢乎夫順阿之臣佞幸之徒是也准主而􅀃適時而行無廷逆之郄則無斥退之患或骨體􅈺麗面色稱媚上不憎而善生恩澤洋溢過度未可謂賢以朝庭選舉皆歸善為賢乎則夫著見而人}
  - {type: page-break, offset: 4, content: '', id: KR3j0080_SBCK_027-1b}
