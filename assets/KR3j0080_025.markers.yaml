  - {type: variant, offset: 4, length: 1, content: 語, SBCK: 閭居有東西長吏之姓必有宫商諸吏之舍必有徴羽安官遷徙未必角姓門南嚮也失位貶黜未必商姓門北出也或安官遷徙或失位貶黜何姓有五音人之質性亦有五行五音之家商家不冝南嚮門則人禀金之性者可復不冝南嚮坐南行步乎一}
