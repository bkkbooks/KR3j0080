  - {type: variant, offset: 1788, length: 333, content: 紂沉湎覆酒滂沱於地即言以酒為池釀酒糟積聚則言糟為丘懸肉以林則言肉為林林中幽冥人時走戲其中則言倮相逐或時載酒用鹿車則言車行酒騎行炙或時十數夜則言其百二十或時醉不知問日數則言其亡甲子周公封康叔告以紂用酒期於悉極欲以戒之也而不言糟丘酒池懸肉為林長夜之飲亡其甲子聖人不言殆非實也傳言曰紂非時與三千人牛飲於酒池夫夏官百殷二百周三百紂之所與相樂非民必臣也非小臣必大官其數不能滿三千人傳書家欲惡紂故言三千人增其實也傳語曰周公執贄下白屋之士謂候之也夫三公鼎足之臣王者之貞幹也白屋之士閭巷之微賤者也三公傾鼎足之尊執贄候白屋之士非其實也或時待士卑恭不驕白屋人則言其往候白屋或時起白屋之士以璧迎禮之人則言其執贄以候其家也傳語曰堯舜之儉茅茨不剪采椽不斲夫言茅茨采椽可也言不剪不斲增之也經曰弼, SBCK: 生}
