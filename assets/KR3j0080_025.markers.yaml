  - {type: variant, offset: 33, length: 0, content: '', SBCK: 行海内擾亂百禍並起雖日逐疫疫鬼猶來衰世好信鬼愚人好求福周之季世信鬼脩祀以求福助愚主心惑不顧自行功猶不立治猶不定故在人不在鬼在徳不在祀國期有遠近人命有長短如祭祀可以得福解除可以去凶則王者可竭天下之財以興延期之祀冨家翁嫗可求解除之福以取踰世之夀案天下人民夭夀貴賤皆有禄命操行吉凶皆有衰盛祭祀不為福福不由祭祀世信鬼神故好祭祀祭祀無鬼神故通人不務焉祭祀厚事鬼神之道也猶無吉福之驗況盛力用威驅逐鬼神其何利哉祭祀之禮解除之法衆多非一且以一事效其非也夫小祀足以況大祭一鬼足以卜百神世間繕治宅舍鑿地掘土功成作畢解謝土神名曰解土為土偶人以像鬼形令巫祝延以解土神已祭之後心快意喜謂鬼神解謝殃禍除去如討論之乃虛妄也何以驗之夫土地猶人之體也普天之下皆為一體頭足相去以萬里數人民居土上猶蚤虱著人身也蚤蝨食人賊人肌膚猶人鑿地賊地之體也蚤蝨内知有欲觧人之心相與聚㑹解謝於所食之肉旁人能知之乎夫人不能知蚤蝨之音猶地不能曉人民之言也胡越之人耳口相類心意相似對口交耳而談尚不相解況人不與地相似地之耳口與人相達乎今所解者地乎則地之耳遠不能聞也所解一宅之土則一宅之土猶人一分之肉也安能曉之如所解宅神乎則此名曰解宅不名曰解土禮入宗廟無所主意斬尺二寸之木名之曰主主心事之不爲人像今解土之祭爲土偶人像鬼之形何能解乎神荒忽無形出入無門故謂之神今作形像與禮相違失神之實故知其非象似布藉不設鬼形解土之禮立土偶人如祭山可為石形祭門戸可作木人乎晉中行寅將亡召其太祝欲加罪焉曰子為我祀犧牲不肥澤也且齋戒不敬也使吾國亡何也祝簡對曰昔日吾先}
