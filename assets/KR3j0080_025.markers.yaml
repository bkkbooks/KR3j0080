  - {type: variant, offset: 18, length: 4, content: 感動形體, SBCK: 有十二焉青龍白虎列十二位龍虎猛神天之正鬼也飛尸流凶安敢妄集猶主人猛勇姦客不敢闚也有十二神舍之宅主驅逐名為去十二神之客恨十二神之意安能得吉如無十二神則亦無飛尸流凶無神無凶解除何補驅逐何去解逐之法緣古逐疫之禮也昔顓頊氏有子三人生而皆亡一居江水為虐鬼一居若水為魍魎一居歐隅之間主疫病人}
