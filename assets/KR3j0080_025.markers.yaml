  - {type: variant, offset: 34, length: 2, content: 垂腴, SBCK: 中行宻子有車十乗不憂其薄也憂徳義之不足也今主君有革車百乗不憂義之薄也唯患車之不足也夫舩車飭則賦歛厚賦歛厚則民謗詛君茍以祀為有益於國乎詛亦將為亡矣一人祝之一國詛之一祝不勝萬詛國亡不亦冝乎祝其何罪中行子乃慙今世信祭祀中行子之類也不脩其行而豐其祝不敬其上而畏其鬼身死禍至歸之於祟謂祟未得得祟脩祀禍繁不止歸之於祭謂祭未敬夫論解除觧除無益論祭祀祭祀無補論巫祝巫祝無力竟在人不在鬼在徳不在祀明矣哉祀義篇世信祭祀以為祭祀者必有福不祭祀者必有禍是以病作卜祟祟得脩祀祀畢意解意解病已執意以為祭祀之助勉奉不絶謂死人有知鬼神飲食猶相賔客賔客恱喜報主人恩矣其脩祭祀是也信其事之非也實者祭祀之意主人自盡恩懃而已鬼神未必歆享之也何以明之今所祭者報功則縁生人為恩義耳何歆享之有今所祭死人死人無知不能飲食何以審其不能歆享飲食也夫天者體也與地同天有列􅀫地有宅舍宅舍附地之體列宿着天之形形體具則有口乃能食使天地有口能食祭食冝食盡如無口則無體無體則氣也若雲霧耳亦無能食如天地之精神若人之有精神矣以人之精神何冝飲食中人之體七八}
