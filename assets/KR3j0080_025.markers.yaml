  - {type: variant, offset: 525, length: 272, content: 助高祖有天下義兵之佐武王之相望羊而已高祖之相龍顏隆準項紫美鬚髯身有七十二黑子高祖又逃呂后於澤中呂后輒見上有雲氣之驗武王不聞有此夫相多於望羊瑞明於魚烏天下義兵並來會漢助彊於諸侯武王承紂高祖襲秦二世之惡隆盛於紂天下畔秦宜多於殷案高祖伐秦還破項羽戰場流血暴尸萬數失軍亡眾幾死一再然後得天下用兵苦誅亂劇獨云周兵不血刃非其實也言其易可也言不血刃增之也案周取殷之時太公陰謀之書食小兒丹教云殷亡兵到牧野晨舉脂燭察武成之篇牧野之戰血流浮杵赤地千里由此言之周之取殷與漢秦一實也而云取殷易兵不血刃美武王之德增益其實也凡天下之事不可增損考察前後效驗自列自列則是非之實, SBCK: 祭未}
