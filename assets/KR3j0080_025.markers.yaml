  - {type: variant, offset: 965, length: 734, content: 血之浮杵也若孔子言殆沮浮杵若孟子之言近不血刃浮杵過其實不血刃亦失其正一聖一賢共論一紂輕重殊稱多少異實紂之惡不若王莽紂殺比干莽鴆平帝紂以嗣立莽盜漢位殺主隆於誅臣嗣立順於盜位士眾所畔宜甚於紂漢誅王莽兵頓昆陽死者萬數軍至漸臺血流沒趾而獨謂周取天下兵不血刃非其實也傳語曰文王飲酒千鍾孔子百觚欲言聖人德盛能以德將酒也如一坐千鍾百觚此酒徒非聖人也飲酒有法胸腹小大與人均等飲酒用千鍾用肴宜盡百牛百觚則宜用十羊夫以千鍾百牛百觚十羊言之使文王之身如防風之君孔子之體如長狄之人乃能堪之案文王孔子之體不能及防風長狄以短小之身飲食眾多是缺文王之廣貶孔子之崇也案酒誥之篇朝夕曰祀茲酒此言文王戒慎酒也朝夕戒慎則民化之外出戒慎之教內飲酒盡千鍾導民率下何以致化承紂疾惡何以自別且千鍾之效百觚之驗何所用哉使文王孔子因祭用酒乎則受福胙不能厭飽因饗射之用酒乎饗射飲酒自有禮法如私燕賞賜飲酒乎則賞賜飲酒宜與下齊賜尊者之前三觴而退過於三觴醉酗生亂文王孔子率禮之人也賞賚左右至於醉酗亂身自用酒千鍾百觚大之則為桀紂小之則為酒徒用何以立德成化表名垂譽乎世聞德將毋醉之言見聖人有多德之效則虛增文王以為千鍾空益孔子以百觚矣傳語曰紂沉湎於酒以糟為丘以酒為池牛飲者三千人為長夜之飲亡其甲子夫紂雖嗜酒亦欲以為樂令酒池在中庭乎則不當言為長夜之飲坐在深室之中閉窗舉燭故曰長夜令坐於室乎每當飲者起之中庭乃復還坐則是煩苦相踖藉不能甚樂令池在深室之中則三千人宜臨池坐前俛飲池酒後仰食肴膳倡樂在前乃為樂耳如審臨池而坐則前飲害於肴膳倡樂之作不得在前夫飲食既不以禮臨池牛飲則其啖肴不復用杯亦宜就魚肉而虎食則知夫酒池牛飲非其實也傳又言紂懸肉以為林令男女倮而相逐其間是為醉樂淫戲無節度也夫肉當內於口口之所食宜潔不辱今言男女倮相逐其間何等潔者如以醉, SBCK: 難曉}
