  - {type: variant, offset: 37, length: 1, content: 餘, SBCK: 身大四五圍食斗食歠斗羮乃能飽足多者三四斗天地之廣大以萬里數圜丘之上一蠒栗牛粢飴大羮不過數斛以此食天地天地安能飽天地用心猶人用意也人食不飽足則怨主人不報以徳矣必謂天地審能飽食則夫古之郊者負天地山猶人之有骨節也水猶人之有血脉也故人食腸滿則骨節與血脉因以盛矣今祭天地則山川隨天地而飽今别祭山川以爲異神是人食已更食骨節與血脉也社稷報生糓物之功萬民生於天地猶毫毛生於體也祭天地則社稷設其中矣人君重之故復别祭必以爲有神是人之膚肉當復食也五祀初本在地門戸用木與土土木生於地井竈室中霤皆屬於地祭地五祀設其中矣人君重之故復别祭必以爲有神是食已當復食形體也風伯雨師雷公是羣神也風猶人之有吹喣也雨猶人之有精液也雷猶人之有腹鳴也三者附於天地祭天地三者在矣人君重之故别祭必以為有神則人吹喣精液腹鳴當復食也日月猶人之有目星辰猶人之有髪三光附天祭天三光在矣人君重之故復别祭必以為有神則人之食已復食目與髪也宗廟已之先也生存之時謹敬供養死不敢不信故脩祭祀縁生事死示不忘先五帝三王郊宗黄帝帝嚳之屬報功堅力不敢忘徳未必有鬼神審能歆享之也夫不能歆享則不能神不能神則不能為福亦不能為禍禍福之起由於喜怒喜怒之發由於腹腸有腹腸者輙能飲食不能飲食則無腹腸無腹腸則無用喜怒無用喜怒則無用為禍福矣或曰歆氣不能食也夫歆之與飲食一實也用口食之用口歆之無腹腸則無口無口無用食則亦無用歆矣何以驗其不能歆也以人祭祝有過不能即時犯也夫歆不用口則用鼻矣口鼻能歆之則目能見之目能見之則手能擊之今手不能擊則知口鼻不能歆之也或難曰宋公鮑之身有疾祝曰夜姑掌將事於厲者厲鬼杖檝而與之言曰何而粢盛之不膏也何而蒭犧之不肥碩也何而珪璧之不中度量也而罪歟其鮑之罪歟夜姑順色而對曰鮑身尚㓜在襁褓不預知焉審是掌之厲鬼舉檝而掊之斃於壇下此非能言用手之驗乎曰夫夜姑之死未必厲鬼擊之也時命當死也妖象厲鬼象鬼之形則象鬼之言象鬼之言則象鬼而擊矣何以明之夫鬼者神也神則先知先知則冝自見粢盛之不膏珪璧之失度犧牲之臞小則因以責讓夜姑以檝擊之而已無為先問先問不知之效也不知不神之驗也不知不神則不能見體出言以檝擊人也夜姑義臣也引罪自予已故鬼擊之如無義而歸之鮑身則厲鬼將復以檝掊鮑之身矣且祭祀不偹神怒見體以殺掌祀如禮備神喜肯見體以食賜主祭乎人有喜怒鬼亦有喜怒人不為怒者身存不為喜者身亡厲鬼之怒見體而罰宋國之祀必時中禮夫神何不見體以賞之乎夫怒喜不與人同則其賞罸不與人等賞罸不與人等則其掊夜姑不可信也且夫歆者内氣也言者出氣也能歆則能言猶能吸則能呼矣如鬼神能歆則冝言於祭祀之上今不能言知不能歆一也凡能歆者口鼻通也使鼻鼽不通口鉗不開則不能歆矣人之死也口鼻腐朽安能復歆二也禮曰人死也斯惡之矣與人異類故惡之也為尸不動朽敗滅亡其身不與生人同則知不與生人通矣身不同知不通其飲食不與人鈞矣胡越異類飲食殊味死之與生非直胡之與越也由此言之死人不歆三也當人之卧也置食物其旁不能知也覺乃知之知乃能食之夫死長卧不覺者也安能知食不能歆之四也或難曰祭則鬼享之何謂也曰言其脩具謹㓗粢牲肥香人臨見之意飲食之推已意以況鬼神鬼神有知必享此祭故曰鬼享之祀難曰易曰東鄰殺牛不如西鄰之礿祭}
