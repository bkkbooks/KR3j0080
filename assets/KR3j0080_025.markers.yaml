  - {type: variant, offset: 294, length: 228, content: 惟湛樂是從時亦罔有克壽魏公子無忌為長夜之飲困毒而死紂雖未死宜羸臞矣然桀紂同行則宜同病言其腴垂過尺餘非徒增之又失其實矣傳語又稱紂力能索鐵伸鉤撫梁易柱言其多力也蜚廉惡來之徒並幸受寵言好伎力之主致伎力之士也或言武王伐紂兵不血刃夫以索鐵伸鉤之力輔以蜚廉惡來之徒與周軍相當武王德雖盛不能奪紂素所厚之心紂雖惡亦不失所與同行之意雖為武王所擒時亦宜殺傷十百人今言不血刃非紂多力之效蜚廉惡來助紂之驗也案武王之符瑞不過高祖武王有白魚赤烏之祐高祖有斷大虵老嫗哭於道之瑞武王有八百, SBCK: 泰厲曰戸曰竈}
