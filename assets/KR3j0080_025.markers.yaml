  - {type: variant, offset: 2164, length: 0, content: '', SBCK: 官而水死湯以寛治民而除其虐文王以文治武王以武功去民之災凡此功烈施布於民民頼其力故祭報之宗廟先祖已之親也生時有養親之道死亡義不可背故脩祭祀示如生存推人事鬼神緣生事死人有賞功供養之道故有報恩祀祖之義孔子之畜狗死使子贛埋之曰吾聞之也弊帷不棄為埋馬也弊蓋不棄為埋狗也丘也貧無盖於其封窆一本註音也亦與之席毋使其首䧟焉延陵季子過徐徐君好其劒季子以當使於上國未之許與季子使還徐君已死季子解劒帶其􅃁樹御者曰徐君已死尚誰為乎季子曰前已心許之矣可以徐君死故負吾心乎遂帶劒於􅃁樹而去祀為報功者其用意猶孔子之埋畜狗也祭為不背先者其恩猶季之帶劒於冡樹也聖人知其若此祭猶齋戒畏敬若有鬼神脩興弗絶若有禍福重恩尊功慇懃厚恩未必有鬼而享之者何以明之以飲食祭地也人將飲食謙退示當有所先孔子曰雖䟽食菜羮􅀲祭必齋如也禮曰侍食於君君使之祭然後飲食之祭猶禮之諸祀也飲食亦可毋祭禮之諸神亦可毋祀也祭祀之}
