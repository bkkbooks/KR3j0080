  - {type: variant, offset: 10, length: 3, content: 深思勤, SBCK: 信祭祀謂祭祀必有福又然解除謂解除必去凶解除初禮先設祭祀比夫祭祀若生人相賔客矣先為賔客設膳食已驅以刄杖鬼神如有知必恚止戰不肯徑去若懐恨反而為禍如無所知不能為凶解之無益不解無損且人謂鬼神何如狀哉如謂鬼有形象形象生人生人懐恨必將害人如無形象與煙雲同驅逐雲煙亦不能除形既不可知心亦不可圖鬼神集止人宅欲何求乎如勢欲殺人當驅逐之時避人隱匿驅逐之止則復還立故處如不欲殺人􅀉託人家雖不驅逐亦不爲害貴人之出也萬民並觀填街滿巷爭進在前士卒驅之則走而却士卒還去即復其處士卒立守終日不離僅能禁止何則欲在於觀不爲壹驅還也使􅀑神與生人同有欲於宅中猶萬民有欲於觀也士卒驅逐不乆立守則觀者不却也然則驅逐􅀑者不極一歲􅀑神不去今驅逐之終食之間則舍之矣舍之􅀑復還來何以禁之􅁀榖於庭雞雀啄之主人驅彈則走縱之則來不終日立守雞雀不禁使􅀑神乎不爲驅逐去止使􅀑不神乎與雞雀等不常驅逐不能禁也虎狼入都弓弩巡之雖殺虎狼不能除虎狼所為來之患盗賊攻城官軍擊之雖却盗賊不能滅盗賊所為至之禍虎狼之來應政失也盗賊之至起世亂也然則鬼神之集為命絶也殺虎狼却盗賊不能使政得世治然則盛解除驅鬼神不能使凶去而命延病人困篤見鬼之至性猛剛者挺劒操杖與鬼戰鬬戰鬬壹再錯指受服知不服必不終也夫解除所驅逐鬼與病人所見鬼無以殊也其驅逐之與戰鬬無以異也病人戰鬬鬼猶不去宅主解除鬼神必不離由此言之解除宅者何益於}
