  - {type: variant, offset: 3, length: 0, content: '', SBCK: 解除篇祀義篇祭意篇詰術篇圖宅術曰宅有八術以六甲之名數而第之第定名立宫商殊别宅有五音姓有五聲宅不冝其姓姓與宅相賊則疾病死亡犯罪遇禍詰曰夫人之在天地之間也萬物之貴者耳其有宅也猶鳥之有巢獸之有穴也謂宅有甲乙巢穴復有甲乙乎甲乙之神獨在民家不在鳥獸何夫人之有宅猶有田也以田飲食以宅居處人民所重莫食最急先田後宅田重於宅也田間阡陌可以制八術比土為田不字一有可以數甲乙甲乙之術獨施於宅不設於田何也府廷之内吏舍比屬吏舍之形制何殊於宅吏之居處何異於民不以甲乙第舍獨以甲乙數宅何也民間之宅與鄉亭比屋相屬接界相連不并數鄉亭獨第民家甲乙之神何以獨立於民家也數宅之術行市亭數巷街以第甲乙入市門曲折亦有巷街人晝夜居家朝夕坐市其實一也市肆戸何以不第甲乙州郡列居縣邑雜處與街巷民家何以異州郡縣邑何以不數甲乙也天地開闢有甲乙邪後王乃有甲乙如天地開闢本有甲乙則上古之時巢居穴處無屋宅之居街巷之制甲乙之神皆何在數宅旣以甲乙五行之家數日亦當以甲乙甲乙有支干支干有加時支干加時專比者吉相賊者凶當其不舉也未必加憂支辱也事理有曲直罪法有輕重上官平心原其獄狀未有支干吉凶之驗而有事理曲直之效爲支干者何以對此武王以甲子日戰勝紂以甲子日戰􅀒二家俱期兩軍相當旗幟相望俱用一日或存或亡且甲與子專比昧爽時加寅寅與甲乙不相賊武王終以破紂何也日火也在天為日在地為火何以驗之陽燧鄉日火從天來由此言之火日氣也日有甲乙火無甲乙何日十而辰十二日辰相配故甲與子連所謂日十者何等也端端之日有十邪而將一有十名也如端端之日有十甲乙是其名何以不從言甲乙必言子丑何日廷圖甲乙有位子丑亦有處各有部署􅍌布五方若王者營衛常居不動今端端之日行中旦出東方夕入西方行而不已與日廷異何謂甲乙為日之名乎術家更說日甲乙者自天地神也日更用事自用甲乙勝負為吉凶非端端之日名也夫如是於五行之象徒當用甲乙決吉凶而已何為言加時乎案加時者端端之日加也端端之日安得勝負五音之家用口調姓名及字用姓定其名用名正其字口有張歙聲有外内以定五音宫商之實夫人之有姓者用禀於天天得五行之氣為姓邪以口張歙聲外内為姓也如以本所禀於天者為姓若五糓萬物禀氣矣何故用張口歙聲内外定正之乎古者因生以賜姓因其所生賜之姓也若夏吞薏苡而生則姓苡氏商吞燕子而生則姓為子氏周履大人跡則姬氏其立名也以信以義以假以像以類以生名為信若魯公子友生文在其手曰友也以徳名為義若文王為昌武王為發也以類名為像若孔子名丘也取於物為假若宋公名杵曰也取於父為類有似類於父也其立字也展名取同義名賜字子貢名予字子我其立姓則以本所生置名則以信義像假類字則展名取同義不用口張歙外内調宫商之義為五音術何據見而用古者有本姓有氏姓陶氏田氏事之氏姓也上官氏司馬氏吏之氏姓也孟氏仲氏王父字之氏姓也氏姓有三事乎吏乎王父字乎以本姓則用所生以氏姓則用事吏王父字用口張歙調姓之義何居匈奴之俗有名無姓字無與相調諧自以夀命終禍福何在禮買妾不知其姓則卜之不知者不知本姓也夫妾必有父母家姓然而必卜之者父母姓轉易失實禮重取同姓故必卜之姓徒用口調諧姓族則禮買妾何故卜之圖宅術曰商家門不冝南向徴家門不冝北向則商金南方火也徴火北方水也水勝火火賊金五行之氣不相得故五姓之宅門有宜嚮嚮得其冝富貴吉昌嚮失其冝貧賤衰耗夫門之與堂何以異五姓之門各有五姓之堂所向無宜何門之掩地不如堂廡朝夕所處於堂不於門圖吉凶者冝皆以堂如門人所出入則戸亦冝然孔子曰誰能出不由戸言戸不言門五祀之祭門與戸均如當以門正所嚮則戸何以不當與門相應乎且今府廷之内吏舍連屬門嚮有南北長吏舍}
