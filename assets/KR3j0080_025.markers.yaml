  - {type: variant, offset: 2158, length: 5, content: 茅茨采椽非, SBCK: 人所瞻仰水旱人所忌惡四方氣所由來山林川谷民所取材用此鬼神之功也凡祭祀之義有二一曰報功二曰脩先報功以勉力脩先以崇恩力勉恩崇功立化通聖主之務也是故聖王制祭祀也法施於民則祀之以死勤事則祀之以勞定國則祀之能禦大災則祀之能捍大患則祀之帝嚳能序星辰以著衆堯能賞均刑法以義終舜勤民事而野死鯀勤洪水而殛死禹能脩鯀之功黄帝正名百物以明民共財顓頊能脩之契為司徒而民成㝠勤}
  - {type: page-break, offset: 2158, content: '', id: KR3j0080_SBCK_025-17b}
