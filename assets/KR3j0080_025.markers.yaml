  - {type: variant, offset: 8, length: 1, content: 憂, SBCK: 假令商姓口食五人五人中各有五色木人青火人赤水人黑金人白土人黄五色之人俱出南嚮之門或凶或吉夀命或短或長凶而短者未必色白吉而長者未必色黄也五行之家何以為決南嚮之門賊商姓家其實如何南方火也使火氣之禍若火延燔徑從南方來乎則雖為北嚮門猶之凶也火氣之禍若夏日之熱四方洽浹乎則天地之間皆得其氣南嚮門家何以獨凶南方火者火位南方一曰其氣布在四方非必南方獨有火四方無有也猶水位在北方四方猶有水也火滿天下水辨四方火或在人之南或在人之北謂火常在南方是則東方可無金西方可無木乎解除篇}
