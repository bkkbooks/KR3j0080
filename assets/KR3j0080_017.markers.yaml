  - {type: variant, offset: 1044, length: 0, content: '', krp: 孔甲遭雨入民室也孔甲不知其將生子為之故到謂鳯皇諸瑞有知應吉而至誤矣是應篇儒者論太平瑞應皆言氣物卓異朱草醴泉翔鳯甘露景星嘉禾萐脯蓂莢屈軼之屬又言山出車澤出舟男女異路市無二價耕者讓畔行者讓路頒白不提挈關梁不閉道無虜掠風不鳴條雨不破塊五日一風十日一雨其盛茂者致黄龍騏驎鳯皇夫儒者之言有溢美過實瑞應之物或有或無夫言鳯皇騏驎之屬大瑞較然不得増飾其小瑞徵應恐多非是夫風氣雨露本當和適言其鳯翔甘露風不鳴條雨不破塊可也言其五日一風十日一雨襃之也風雨雖適不能五日十日正如其數言男女不相干市價不相欺可也言其異路無二價襃之也太平之時豈更為男女各作道哉不更作道一路而行安得異乎太平之時無商人則可如有必求便利以為業買物安肯不求賤賣貨安肯不求貴有求貴賤之心必有二價之語此皆有其事而襃増過其實也若夫萐脯蓂莢屈軼之屬殆無其物何以驗之說以實者太平無有此物儒者言萐脯生於庖厨者言厨中自生肉脯薄如萐形揺鼓生風寒涼食物使之不臰夫太平之氣雖和不能使厨生肉萐以為寒涼若能如此則能使五穀自生不湏人為之也能使厨自生肉萐何不使飯自蒸於甑火自燃於竈乎凡生萐者欲以風吹食物也何不使食物自不臰何必生萐以風之乎厨中能自生萐則氷室何事而復伐氷以寒物乎人夏月操萐須手揺之然後生風從手握持以當疾風萐不鼓動言萐脯自鼓可也須風乃鼓不風不動從手風來自足以寒厨中之物何須萐脯世言燕太子丹使日再中天雨粟烏白頭馬生角厨門象生肉足論之既虛則萐脯之語五應之類恐無其實儒者又言古者蓂莢夾階而生月朔日一莢生至十五日而十五莢於十六日日一莢落至月晦莢盡來月朔一莢復生王者南面視莢生落則知日數多少不須煩擾案日曆以知之也夫天既能生莢以為日數何不使莢有日名王者視莢之字則知今日名乎徒知日數不知日名猶復案曆然後知之是則王者視日則更煩擾不省蓂莢之生安能為福夫蓂草之實也猶豆之有莢也春夏未生其生必於秋末冬月隆寒霜雪霣零萬物皆枯儒者敢謂蓂莢達冬獨不死乎如與萬物俱生俱死莢成而以秋末是則季秋得察莢春夏冬三時不得案也且月十五日生十五莢於十六日莢落二十一日六莢落落莢棄殞不可得數猶當計未落莢以知日數是勞心苦意非善祐也使莢生於堂上人君坐戸牖間望察莢生以知日數匪謂善矣今云夾階而生生於堂下也王者之堂墨子稱堯舜髙三尺儒家以為卑下假使之然髙三尺之堂蓂莢生於階下王者欲視其莢不能從户牖之間見也須臨堂察之乃知莢數夫起視堂下之莢孰與懸曆日於扆坐傍顧輒見之也天之生瑞欲以娛王者須起察乃知日數是生煩物以累之也且莢草也王者之堂旦夕所坐古者雖質宫室之中草生輒耘安得生莢而人得經月數之乎且凡數日一二者欲以紀識事也古者史官典曆主日王者何事而自數莢堯候四時之中命曦和察四星以占時氣四星至重猶不躬視而自察莢以數日也儒者又言太平之時屈軼生於庭之末若草之狀主指佞人佞人入朝屈軼庭末以指之聖王則知佞人所在夫天能故生此物以指佞人不使聖王性自知之或佞人本不生出必復更生一物以指明之何天之不憚煩也聖王莫過堯舜堯舜之治最爲平矣即屈軼巳自生於庭之末佞人來輒指知之則舜何難於知佞人而使皐陶陳知人之術經曰知人則哲惟帝難之人含五常音氣交通且猶不能相知屈軼草也安能知佞如儒者之言是則太平之時草木踰賢聖也獄訟有是非人情有曲直何不并令屈軼指其非而不直者必苦心聽獄字一有訟三人斷獄乎故夫屈軼之草或時無有而空言生或時實有而虚言能指假令能指或時草性見人而動古者質朴見草之動則言能指能指則言指佞人司南之杓投之於地其柢指南}
  - {type: variant, offset: 1045, length: 1, content: 在, SBCK: 肉之蟲集地北行夫蟲之性然也今草能指亦天性也聖人因草能指宣言曰庭末有屈軼能指佞人百官臣子懐姦心者則各變性易操為忠正之行矣猶今府廷畫臯陶觟􅚞也儒者說云觟􅚞者一角之羊也性知有罪臯陶治獄其罪疑者令羊觸之有罪則觸無罪則不觸斯蓋天生一角聖獸助獄爲驗故臯陶敬羊起坐事之此則神竒瑞應之類也曰夫觟􅚞則復屈軼之語也羊本二角觟􅚞一角體損於群不及衆類何以爲竒鼈三足曰能龜三足曰賁案能與賁不能神於四足之龜鼈一角之羊何能聖於兩角之禽狌狌知徃乾鵲知來鸚鵡能言天性能一不能爲二或時觟􅚞之性徒能觸人未必能知罪人臯陶欲神事助政惡受罪者之不厭服因觟􅚞觸人則罪之欲人畏之不犯受罪之家没齒無怨言也夫物性各自有所知如以觟􅚞能觸謂之為神則狌狌之徒皆為神也巫知吉凶占人禍福無不然者如以觟􅚞謂之巫類則巫何竒而以為善斯皆人欲神事立化也師尚父為周司馬將師伐紂到孟津之上杖鉞把旄號其衆曰倉光倉光者}
