  - {type: variant, offset: 1056, length: 0, content: '', krp: 厯數當然也以堯湯之水旱準百王之災害非德所致非德所致則其福祐非德所為也賢君之治國也}
  - {type: variant, offset: 1057, length: 2, content: 魚鼓, SBCK: 慈父之治家慈父耐平教明令耐使子孫皆為孝善子孫孝善是家興也百姓平安是國昌也昌必有衰興必有廢興昌非德所能成然則衰廢非德所能敗也昌衰興廢皆天時也此善惡之實未言苦樂之效也家安人樂富饒財用足也案富饒者命厚所致非賢惠所獲也人皆知富饒居安樂者命祿厚}
