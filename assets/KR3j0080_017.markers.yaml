  - {type: variant, offset: 3, length: 6, content: 傳書曰宋景公, SBCK: 是應篇治期篇指瑞篇儒者說鳯皇騏驎為聖王來以為鳯皇騏驎仁聖禽也思慮深避害逺中國有道則來無道則隠稱鳯皇騏驎之仁知者欲以襃聖人也非聖人之德不能致鳯皇騏驎此言妄也夫鳯皇騏驎聖聖人亦聖聖人恓恓憂世鳯皇騏驎亦冝率教聖人游於世間鳯皇騏驎亦冝與鳥獸會何故逺去中國處於邊外豈聖人濁鳯皇騏驎清哉何其聖德俱而操不同也如以聖人者當隱乎十二聖宜隱如以聖者當見鳯驎亦冝見如以仁聖之禽思慮深避害遠則文王拘於羑里孔子厄於陳蔡非也文王孔子仁聖之人憂世憫民不圖利害故其有仁聖之知遭拘厄之患凡人操行能脩身正節不能禁人加非於已案人操行莫能過聖人聖人不能自免於厄而鳯驎獨能而字一有自全於世是鳥獸之操賢於聖人也且鳥獸之知不與人通何以能知國有道與無道也人同性類好惡均等尚不相知鳥獸與人異性何能知之人不能知鳥獸鳥獸亦不能知人兩不能相知鳥獸為愚於人何以反能知之儒者咸稱鳯皇之德欲以表明王之治反令人有不及鳥獸論事過情使實不著且鳯驎豈獨為聖王至哉孝宣皇帝}
