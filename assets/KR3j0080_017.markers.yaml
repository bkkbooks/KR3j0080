  - {type: variant, offset: 1048, length: 0, content: '', SBCK: 之獸也善覆人船因神以化欲令急渡不急渡倉光害汝則復觟􅚞之類也河中有此異物時出浮揚一身九頭人畏惡之未必覆人之舟也尚父緣河有此異物因以威衆夫觟􅚞之觸罪人猶倉光之覆舟也蓋有虛名無其實效也人畏怪竒故空褒増又言太平之時有景星尚書中􅀱曰堯時景星見於軫夫景星或時五星也大者嵗星太白也彼或時嵗星太白行於軫度古質不能推步五星不知嵗星太白何如狀見大星則謂景星}
