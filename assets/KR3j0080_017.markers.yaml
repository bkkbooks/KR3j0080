  - {type: variant, offset: 1569, length: 210, content: 以除之子產不聽天道當然人事不能卻也使子產聽梓慎四國能無災乎堯遭鴻水時臣必有梓慎子韋之知矣然而不卻除者堯與子產同心也案子韋之言曰熒惑天使也心宋分野也禍當君審如此言禍不可除星不可卻也若夫寒溫失和風雨不時政事之家謂之失誤所致可以善政賢行變而復也若熒惑守心若必死猶亡禍安可除修政改行安能卻之善政賢行尚不能卻出虛華之三言謂星卻而禍除增壽延年享長久之福誤矣觀子韋之言景公言熒惑之禍非寒暑風雨之類身死命終之祥也國且亡身且死祅氣見於天容, SBCK: 凶}
