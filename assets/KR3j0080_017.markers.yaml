  - {type: variant, offset: 348, length: 1, content: 亦, SBCK: 終軍之言得瑞應之實矣推此以況白魚赤烏猶此類也魚木精白者殷之色也烏者孝鳥赤者周之應氣也先得白魚後得赤烏殷之統絶色移在周矣據魚烏之見以占武王則知周之必得天下也世見武王誅紂出遇魚烏則謂天用魚烏命使武王誅紂事相似類其實非也春秋之時鸜鵒來巢占者以爲凶夫野鳥來巢魯國之都且爲丘墟昭公之身且出奔也後昭公爲季氏所攻出奔於齊死不歸魯賈􅁩爲長沙太傅服鳥集舍發書占之云服鳥入室主人當去其後賈􅁩竟去野鳥雖殊其占不異夫鳯驎之來與野鳥之巢服鳥之集}
