  - {type: variant, offset: 1050, length: 0, content: '', WYG: 味甘若醴故曰醴泉二說相逺實未可知案爾雅釋水章泉一見一否曰瀐檻泉正出正出涌出也沃泉懸出懸出下出也是泉出之異輒有異名使太平之時更有醴泉從地中出當於此章中言之何故反居釋四時章中言甘露為醴泉乎若此儒者之言醴泉從地中出又言甘露其味甚甜未可然也儒曰道至大者日月精明星辰不失其行祥風起甘露降雨濟而隂一者謂之甘雨非謂雨水之味甘也推此以論甘露必謂其降下時適潤養萬物未必露味甘也亦有露甘味如飴蜜者俱太平之應非養萬物之甘露也何以明之案甘露如飴蜜者著於樹木不著五穀彼露味不甘者其下時土地滋潤流濕萬物洽沾濡溥由此言之爾雅且近得實緣爾雅之言驗之於物案味甘之露下著樹木察所著之樹不}
