  - {type: variant, offset: 68, length: 126, content: 祥子韋曰可移於民公曰民死寡人將誰為君也寧獨死耳子韋曰可移於歲公曰民饑必死為人君而欲殺其民以自活也其誰以我為君者乎是寡人之命固盡也子毋復言子韋還走北面再拜曰臣敢賀君天之處高而聽卑君有君人之言三天必三賞君今夕星必徙三舍君延命二十一年公曰奚知之對曰君有三善言, SBCK: 畢見}
