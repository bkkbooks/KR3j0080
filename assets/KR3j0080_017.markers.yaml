  - {type: 'tls:seg', offset: 1049, content: '', id: KR3j0080_tls_017-6a.5}
  - {type: variant, offset: 1049, length: 0, content: '', SBCK: 詩又言東有啓明西有長庚亦或時復嵗星太白也或時昬見於西或時晨出於東詩人不知則名曰啓明長庚矣然則長庚與景星同皆五星也太平之時日月精明五星日月之類也太平更有景星可復更有日月乎詩人俗人也中􅀱之時質世也俱不知星王莽之時太白經天精如半月使不知星者見之則亦復名之曰景星爾雅釋四時章曰春為發生夏為長嬴秋為收成冬為安寧四氣和為景星夫如爾雅之言景星乃四時氣和之名也恐非著天之大星爾雅之書五經之訓故儒者所共觀察也而不信從更謂大星為景星豈爾雅所言景星與儒者之所說異哉爾雅又言甘露時降萬物以嘉謂之醴泉醴泉乃謂甘露也今儒者說之謂泉從地中出}
  - {type: page-break, offset: 1049, content: '', id: KR3j0080_SBCK_017-12a}
