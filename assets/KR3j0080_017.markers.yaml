  - {type: variant, offset: 1054, length: 0, content: '', SBCK: 形體而危亂之變終不減除空憤人君之心使明知之主虛受之責世論傳稱使之然也夫賢君能治當安之民不能化當亂之世良醫能行其針藥使方術驗者遇未死之人得未死之病也如命窮病困則雖扁鵲未如之何夫命窮病困之不可治猶夫亂民之不可安也藥氣之愈病猶教導之安民也皆有命時不可令勉力也公伯寮愬子路於季孫子服景伯以告孔子孔子曰道之將行也與命也道之將廢也與命也由此言之教之行廢國之安危皆在命時非人力也夫世亂民逆國之危殆災害繫於上天賢君之德不能消郤詩道周宣王遭大旱矣詩曰周餘黎民靡有孑遺言無有可遺一人不被害者宣王賢者嫌於德微仁惠盛者莫過堯湯堯遭洪水湯遭大旱水旱災害之甚者也而二聖逢之豈二聖政之所致哉}
  - {type: page-break, offset: 1054, content: '', id: KR3j0080_SBCK_017-14a}
