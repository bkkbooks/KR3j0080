  - {type: variant, offset: 2155, length: 234, content: 齊景公問太卜曰子之道何能對曰能動地晏子往見公公曰寡人問太卜曰子道何能對曰能動地地固可動乎晏子嘿然不對出見太卜曰昔吾見鉤星在房心之間地其動乎太卜曰然晏子出太卜走見公曰臣非能動地地固將自動夫子韋言星徙猶太卜言地動也地固且自動太卜言己能動之星固將自徙子韋言君能徙之使晏子不言鉤星在房心間則太卜之姦對不覺宋無晏子之知臣故子韋之一言遂售其欺耳案子韋書錄序奏亦言子韋曰君出三善言熒惑宜有動於是候之果徙舍不言三或時星當自去子韋以為驗實動離舍世增言三既空增三舍之數又虛生二十一年之壽也, SBCK: ''}
