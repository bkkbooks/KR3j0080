  - {type: variant, offset: 196, length: 20, content: 三賞星必三徙三徙行七星星當一年三七二十一, SBCK: 五鳯神雀甘露黄龍之紀使鳯驎審為聖王見則孝宣皇帝聖人也如孝宣帝非聖則鳯驎為賢來也為賢來則儒者稱鳯皇騏驎失其實也鳯皇騏驎為堯舜來亦為宣帝來矣夫如是為聖且賢也儒者說聖太隆則論鳯驎亦過其實春秋曰西狩獲死驎人以示孔子孔子曰孰為來哉孰為來哉反􅃑拭面泣涕沾襟儒者說之以為天以驎命孔子孔子不王之聖也夫驎為聖王來孔子自以不王而時王魯君無感驎之德怪其來而不知所為}
