  - {type: variant, offset: 1049, length: 0, content: '', krp: 詩又言東有啓明西有長庚亦或時復嵗星太白也或時昬見於西或時晨出於東詩人不知則名曰啓明長庚矣然則長庚與景星同皆五星也太平之時日月精明五星日月之類也太平更有景星可復更有日月乎詩人俗人也中候之時質世也俱不知星王莽之時太白經天精如半月使不知星者見之則亦復名之曰景星爾雅釋四時章曰春為發生夏為長嬴秋為收成冬為安寧四氣和為景星夫如爾雅之言景星乃四時氣和之名也恐非著天之大星爾雅之書五經之訓故儒者所共觀察也而不信從更謂大星為景星豈爾雅所言景星與儒者之所說異哉爾雅又言甘露時降萬物以嘉謂之醴泉醴泉乃謂甘露也今儒者說之謂泉從地中出}
  - {type: variant, offset: 1050, length: 0, content: '', SBCK: 味甘若醴故曰醴泉二說相逺實未可知案爾雅釋水泉章一見一否曰瀐檻泉正出正出涌出也沃泉懸出懸出下出也是泉出之異輒有異名使太平之時更有醴泉從地中出當於此章中言之何故反居釋四時章中言甘露爲醴泉乎若此儒者之言醴泉從地中出又言甘露其味甚甜未可然也儒曰道至大者日月精明星辰不失其行翔風起甘露降雨濟而隂一者謂之甘雨非謂雨水之味甘也推此以論甘露必謂其降下時適潤養萬物未必露味甘也亦有露甘味如飴蜜者俱太平之應非養萬物之甘露也何以明之案甘露如飴蜜者著於樹木不著五穀彼露味不甘者其下時土地潤滋流濕萬物洽沾濡溥由此言之爾雅且近得實緣爾雅之言驗之於物案味甘之露下着樹木察所着之樹不}
