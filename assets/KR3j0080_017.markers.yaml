  - {type: variant, offset: 1053, length: 0, content: '', SBCK: 施行則功成治安人君不肖則道德頓廢頓廢則功敗治亂古今論者莫謂不然何則見堯舜賢聖致太平桀紂無道致亂得誅如實論之命期自然非德化也吏百石以上若升食以下居位治民爲政布教教行與止民治與亂皆有命焉或才髙行潔居位職廢或智淺操洿治民而立上古之黜陟幽明考功據有功而加賞案無功而施罸是考命而長祿非實才而厚能也論者因考功之法據效而定賢則謂民治國安者賢君之所致民亂國危者無道之所為也故危亂之變至論者以責人君歸罪於為政不得其道人君受以自責愁神苦思撼}
  - {type: page-break, offset: 1053, content: '', id: KR3j0080_SBCK_017-13b}
