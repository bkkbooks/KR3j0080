  - {type: variant, offset: 345, length: 1, content: 韋, WYG: 見麟而自泣者據其見得而死也非據其本所為來也然則麟之至也自與獸會聚也其死人殺之也使麟有知為聖王來時無聖王何為來乎思慮深避害逺何故為魯所獲殺乎夫以時無聖王而麟至知不為聖王來也為魯所獲殺知其避害不能逺也聖獸不能自免於難聖人亦不能自免於禍禍難之事聖者所不能避而云鳯麟思慮深避害逺妄也且鳯麟非生外國也中國有聖王乃來至也生於中國長於山林之間性亷見希人不得害也則謂之思慮深避害逺矣生與聖王同時行與治平相遇世間謂之聖王之瑞為聖來矣剝巢破卵鳯皇為之不翔焚林而畋漉池而漁龜龍為之不遊鳯皇龜龍之類也皆生中國與人相近巢剝卵破屏竄不翔林焚池漉伏匿不遊無逺去之文何以知其在外國也龜龍鳯皇同一類也希見不害謂在外國龜龍希見亦在外國矣孝宣皇帝之時鳯皇麒麟黄龍神雀皆至其至同時則其性行相似類則其生出宜同處矣龍不生於外國外國亦有龍鳯麟不生外國外國亦有鳯麟然則中國亦有未必外國之鳯麟也人見鳯麟希見則曰在外國見遇太平則曰為聖王來夫鳯皇麒麟之至也猶醴泉之出朱草之生也謂鳯皇在外國聞有道而來醴泉朱草何知而生於太平之時醴泉朱草和氣所生然則鳯皇麒麟亦和氣所生也和氣生聖人聖人生於衰世物生為瑞人生為聖同時俱然時其長大相逢遇矣衰世亦有和氣和氣時生聖人聖人生於衰世衰世時亦有鳯麟也孔子生於周之末世麒麟見於魯之西澤光武皇帝生於成哀之際鳯皇集於濟陽之地聖人聖物生於盛衰世聖王遭一有出聖物遭字見聖物猶吉命之人逢吉祥之類也其實相遇非相為出也夫鳯麟之來與白魚赤烏之至無以異也魚遭自躍王舟逢之火偶為烏王仰見之非魚聞武王之德而入其舟烏知周家當起集於王屋也謂鳯麟為聖王來是謂魚烏為武王至也王者受富貴之命故其動出見吉祥異物見則謂之瑞瑞有小大各以所見定德薄厚若夫白魚赤烏小物小安之兆也鳯皇麒麟大物太平之象也故孔子曰鳯鳥不至河不出圖吾己矣夫不見太平之象自知不遇太平之時矣且鳯皇麒麟何以為太平之象鳯皇麒麟仁聖之禽也仁聖之物至天下將為仁聖之行矣尚書大傳曰髙宗祭成湯之廟有雉升鼎耳而鳴髙宗問祖巳祖巳曰逺方君子殆有至者祖已見雉有似君子之行今從外來則曰逺方君子將有至者矣夫鳯皇麒麟猶雉也其來之象亦與雉同孝武皇帝西巡狩得白麟一角而五趾又有木枝出復合於本武帝議問羣臣謁者終軍曰野禽并角明同本也衆枝内附示無外也如此瑞者外國宜有降者是若應殆且有解編髪削左袵襲冠帶而蒙化焉其後數月越地有降者匈奴名王亦將數千人來降竟如終軍}
