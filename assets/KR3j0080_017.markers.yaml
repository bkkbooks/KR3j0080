  - {type: variant, offset: 338, length: 2, content: 景公, SBCK: 治平而至為巳道窮而來望絶心感故涕泣沾襟以孔子言孰為來哉知驎為聖王來也曰前孔子之時世儒已傳此說孔子聞此說而希見其物也見驎之至怪所為來實者驎至無所為來常有之物也行邁魯澤之中而魯國見其物遭獲之也孔子見驎之獲獲而又死}
