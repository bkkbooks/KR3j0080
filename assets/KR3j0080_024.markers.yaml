  - {type: variant, offset: 4860, length: 16, content: 效百藥愈病病愈而氣復氣復而身輕矣, SBCK: 腦占曰凶咎犯曰吉君得天楚伏其罪盬君之腦者柔之也以戰果勝如咎犯占夫占夢禍絓法入罪至于死亡殫家滅門皆不重慎犯觸忌諱之所致也如實論之乃妄言也}
