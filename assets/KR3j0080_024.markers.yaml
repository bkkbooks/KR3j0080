  - {type: variant, offset: 5032, length: 1, content: 其, SBCK: 人也或上十二神登明從魁之輩工伎家謂之皆天神也常立子丑之位俱有衝抵之氣神雖不若太嵗冝有微敗移徙者雖避太嵗之凶}
