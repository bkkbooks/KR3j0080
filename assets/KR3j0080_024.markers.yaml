  - {type: variant, offset: 4849, length: 0, content: '', krp: 吉凶之兆者逢吉遭凶之類也何以明之周武王不豫周公卜三龜公曰乃逢是吉魯卿莊叔生子穆叔以周易筮之遇明夷之謙夫卜曰逢筮曰遇實遭遇所得非善惡所致也善則逢吉惡則遇凶天道自然非爲人也推此以論人君治有吉凶之應亦猶此也君德遭賢時適當平嘉物竒瑞至偶不肖之君亦反此焉世人言卜筮者多得實誠者寡論者或謂蓍龜可以叅事不可純用夫鑚龜揲蓍兆數輙見見無常占占者生意吉兆而占謂之凶凶數而占謂之吉吉凶不效則謂卜筮不可信周武王伐紂卜筮之逆占曰大凶太公推蓍蹈龜而曰枯骨死草何知而凶夫卜筮兆數非吉凶誤也占之不審吉凶吉凶變亂變亂故太公黜之夫蓍筮龜卜猶聖王治世卜筮兆數猶王治瑞應瑞應無常兆數詭異詭異則占者惑無常則議者疑疑則謂平未治惑則謂吉不良何以明之夫吉兆數吉人可遭也治遇符瑞聖徳之驗也周王伐紂遇烏魚之瑞}
  - {type: variant, offset: 4850, length: 0, content: '', SBCK: 卜曷爲逢不吉之兆使武王不當起出不冝逢瑞使武王命當興卜不冝得凶由此言之武王之卜不得凶占謂之凶者失其實也魯將伐越筮之得鼎折足子貢占之以爲凶何則鼎而折足行用足故謂之凶孔子占之以爲吉曰越人水居行用舟不用足故謂之吉魯伐越果克之夫子貢占鼎折足以爲凶猶周之占卜者謂之逆矣逆中必有吉猶折鼎足之占冝以伐越矣周多子貢直占之知寡若孔子詭論之材故覩非常之兆不能審也世因武王卜無非而得凶故謂卜筮不可純用略以助政示有􅀑神明已不得專著書記者採掇行事若韓非飾邪之篇明已效之}
  - {type: page-break, offset: 4850, content: '', id: KR3j0080_SBCK_024-10b}
  - {type: variant, offset: 4850, length: 0, content: '', WYG: 卜曷爲逢不吉之兆使武王不當起出不宜逢瑞使武王命當興卜不宜得凶由此言之武王之卜不得凶占謂之凶者失其實也魯將伐越筮之得鼎折足子貢占之以爲凶何則鼎而折足行用足故謂之凶孔子占之以爲吉曰越人水居行用舟不用足故謂之吉魯伐越果克之夫子貢占鼎折足以爲凶猶周之占卜者謂之逆矣逆中必有吉猶折鼎足之占宜以伐越矣周多子貢直占之知寡若孔子詭論之材故覩非常之兆不能審也世因武王卜無非而得凶故謂卜筮不可純用畧以助政示有鬼神明已不得專著書記者採掇行事若韓非飾邪之篇明已效之}
