  - {type: variant, offset: 4878, length: 2, content: 稟性, SBCK: 在世不能不作事作事之後不能不有吉凶見吉則指以爲前時擇日之福見凶則㓨以爲徃者觸忌之禍多或擇日而得禍觸忌而獲福工伎射事者欲遂其術見禍忌而不言聞福匿而不達積禍以驚不慎列福以勉畏時故世人無愚智賢不肖人君布衣皆畏懼信向不敢抵犯歸之乆逺莫能分明以爲天地之書賢聖之術也人君惜其官人民愛其}
