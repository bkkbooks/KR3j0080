  - {type: variant, offset: 3240, length: 3, content: 生長常, SBCK: 諱不均俗人淺知不能實也且衣服不如車馬九錫之禮一曰車馬二曰衣服作車不求良辰裁衣獨求吉日俗人所重失輕重之實也工伎之書起宅蓋屋必擇日夫屋覆人形宅居人體何害於嵗月而必擇之如以障蔽人身者神惡之則夫裝車治舩著盖施㡌亦當擇日如以動地穿土神惡之則夫鑿溝耕園亦冝擇日夫動土擾地神地神能原人無有惡意但欲居身}
