  - {type: variant, offset: 4851, length: 1, content: 若, SBCK: 毁卜訾筮非世信用}
  - {type: variant, offset: 4851, length: 0, content: '', WYG: 毁卜訾筮非世信用夫卜筮非不可用卜筮之人占之誤也洪範稽疑卜筮之變必問天子卿士或時審是夫不能審占兆數不驗則謂卜筮不可信用晉文公與楚子戰夢與成王搏成王在上而盬其腦占曰凶咎犯曰吉君得天楚伏其罪盬君之腦者柔之也以戰果勝如咎犯占夫占夢與占龜同晉占夢者不見象指猶周占龜者不見兆者爲也象無不然兆無不審人之知闇論之失實也傳或言武王伐紂卜之而龜􅂒占者曰凶太公曰龜􅂒以祭則凶以戰則勝武王從之卒克紂焉審}
  - {type: page-break, offset: 4851, content: '', id: KR3j0080_WYG_024-13a, image: WYG0862/WYG0862-0286c.png}
