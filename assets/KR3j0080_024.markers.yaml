  - {type: variant, offset: 3220, length: 0, content: '', krp: 剛日死至葬日己丑剛柔等矣剛柔合善日也不克葬者避雨也如善日不當以雨之故廢而不用也何則雨不便事耳不用剛柔重凶不吉欲便事而犯凶非魯人之意臣子重慎之義也今廢剛柔待庚寅日中以暘爲吉也禮天子七月而葬諸侯五月卿大夫士三月假令天子正月崩七月葬二月崩八月葬諸侯卿大夫士皆然如驗之葬歷則天子諸侯葬月常竒常耦也衰世好信禁不肖君好求福春秋之時可謂衰矣隱哀之間不肖甚矣然而葬埋之日不見所諱無忌之故也周文之世法度備具孔子意宻春秋義纎如廢吉得凶妄舉觸禍宜有微文小義貶譏之辭今不見其義無葬歷法也祭祀之歷亦有吉凶假令血忌月殺之日固凶以殺牲設祭必有患禍夫祭者供食鬼也鬼者死人之精也若非死人之精人未甞見鬼之飲食也推生事死推人事鬼見生人有飲食死爲鬼當能復飲食感物思親故祭祀也及他神百鬼之}
  - {type: variant, offset: 3221, length: 1, content: 竈, SBCK: 雖非死人其事之禮亦與死人同蓋以不見其形但以生人之禮准況之也生人飲食無日鬼神何故有日如鬼神審有知與人無異則祭不冝擇日如無知也不能飲食雖擇日避忌其何補益實者百祀無鬼死人無知百祀報功示不忘德死如事生示不背亡祭之無福不祭無禍祭與不祭尚無禍福况日之吉凶何能損益如以殺牲見血避血忌月殺則生人食六畜亦冝}
