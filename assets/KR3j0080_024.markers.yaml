  - {type: variant, offset: 4821, length: 0, content: '', SBCK: 怒而不對試使卜筮之人空鑚􅀛而卜虚揲蓍而筮戯弄天地亦得兆數天地妄應乎又試使人罵天而卜毆地而筮無道至甚亦得兆數茍謂兆數天地之神何不滅其火灼其手振其指而亂其數使之身體疾痛血氣湊踊而猶爲之見兆出數何天地之不憚勞用心不惡也由此言之卜筮不問天地兆數非天地之報明矣然則卜筮亦必有吉凶論者或謂隨人善惡之行也猶瑞應應隨一作善而至災異隨惡而到治之善惡善惡所致也疑非天地故應之也吉人鑚􅀛輙從善兆凶人揲蓍輙得逆數何}
  - {type: page-break, offset: 4821, content: '', id: KR3j0080_SBCK_024-8b}
  - {type: variant, offset: 4821, length: 0, content: '', WYG: 怒而不對試使卜筮之人空鑚龜而卜虚揲蓍而筮戲弄天地亦得兆數天地妄應乎又試使人罵天而卜毆地而筮無道至甚亦得兆數茍謂兆數天地之神何不滅其火灼其手振其指而亂其數使之身體疾痛血氣湊踊而猶爲之見兆出數何天地之不憚勞用心不惡也由此言之卜筮不問天地兆數非天地之報明矣然則卜筮亦必有吉凶論者或謂隨人善惡之行也猶瑞應應一作隨善而至災異隨惡而到治之善惡善惡所致也疑非天地故應之也吉人鑚龜輒從善兆凶人揲蓍輒得逆數何}
  - {type: page-break, offset: 4821, content: '', id: KR3j0080_WYG_024-10a, image: WYG0862/WYG0862-0285a.png}
