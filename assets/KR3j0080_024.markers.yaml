  - {type: variant, offset: 4865, length: 0, content: '', WYG: 死亡及更患被罪戮辱懽笑皆有所犯起功移徙祭祀喪葬行作入官嫁娶不擇吉日不避嵗月觸鬼逢神忌時相害故發}
