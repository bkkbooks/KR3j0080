  - {type: variant, offset: 5012, length: 1, content: 終, SBCK: 如橋下走出之人矣方今行道路者暴溺仆死何以知非觸遇太嵗之出也爲移徙者又不能處不能處則犯與不犯未可知未可知則其行與不行未可審也且太嵗之神審行乎則冝}
