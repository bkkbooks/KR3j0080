  - {type: variant, offset: 5037, length: 1, content: 凝, krp: 位在北方夏氣熱火也火位在南方案秋冬寒春夏熱者天下普然非獨南北之方水火衝也今太嵗位在子耳天下皆為太嵗非獨子午衝也審以所立者為主則午可為大夏子可為大冬冬夏南北徙者可復凶乎立春艮王震相巽胎离没坤死兊囚乾廢坎休王之衝死相之衝囚王相衝位有死囚之氣乾坤六子天下正道伏羲文王象以治世文為經所載道為聖所信明審於太嵗矣人或以立春東北徙抵艮之下不被凶害太嵗立於子彼東北徙坤卦近於午猶艮以坤徙觸子位何故獨凶正月建於寅破於申從寅申徙相之如者無有凶害太嵗不指午而空曰嵗破午實無凶禍而虛禁南北豈不妄哉十二月為一嵗四時節竟隂陽氣終竟復為一嵗日月積聚之名耳何故有神而謂之立於子位乎積分為日累日為月連月為時紀時為嵗嵗則日月時之類也嵗而有神日月時亦復有神乎千五百三十九為一綂四千六百一十七嵗為一元嵗猶統元也嵗有神綂元復有神乎論之以為無假令有之何故害人神莫過於天地天地不害人人謂百神百神不害人太嵗之氣天地之氣也何憎於人觸}
