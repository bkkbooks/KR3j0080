  - {type: variant, offset: 379, length: 191, content: 見其升天知其不死必也葬不死之衣冠與實死者無以異非臣子實事之心別生於死之意也載太山之上者七十有二君皆勞情苦思憂念王事然後功成事立致治太平太平則天下和安乃升太山而封禪焉夫修道求仙與憂職勤事不同心思道則忘事憂事則害性世稱堯若腊舜若腒心愁憂苦形體羸臞使黃帝致太平乎則其形體宜如堯舜堯舜不得道黃帝升天非其實也使黃帝廢事修道則心意調和形體肥勁是與堯舜異也異則功不同矣功不同天下未太平而升封又非實, SBCK: 棺木}
