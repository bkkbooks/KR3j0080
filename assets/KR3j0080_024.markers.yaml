  - {type: variant, offset: 3335, length: 90, content: 其王父游射處老人為兒時從其王父識其處一座盡驚少君見上上有古銅器問少君少君曰此器齊桓公十五年陳於柏寢已而案其刻果齊桓公器一宮盡驚以為少君神數百歲人也久之少君病死今世所謂得道之人李少君, SBCK: 子夘}
