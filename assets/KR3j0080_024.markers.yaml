  - {type: punctuation, offset: 3224, content: 、, id: KR3j0080_tls_024-bkkpn704}
  - {type: variant, offset: 3226, length: 4, content: 方見上上, SBCK: 使醜如嫫母以子日沭能得愛乎使十五女子以夘日沭能白髮乎且沭者去首垢也洗去足垢盥去手垢浴去身垢皆去一形之垢其實等也洗盥浴不擇日而沭獨有日如以首爲最尊尊則浴亦治面面亦首也如以髮爲最尊則櫛亦宜擇日櫛用木沐用水水與木俱五行也用木不避忌用水獨擇日如以水尊於木則諸用水者冝皆擇日且水不若火尊如必以尊卑則用火者冝皆擇日且使子沐人愛之夘沐其首白者誰也夫子之性水也夘木也水不可愛木色不白子之禽鼠夘之獸兔也鼠不可愛兎毛不白以子日沐誰使可愛夘日沐誰使凝白者夫如是沐之日無吉凶爲沐立日厯者不可用也裁衣有書書有吉凶凶日製衣則有禍吉日則有福夫衣與食俱輔人體食輔其内衣衛其外飲食不擇日製衣避忌日豈以衣爲於其身重哉人道所重莫如食急故八政一曰食二曰貨衣服貨也如以加之於形爲}
