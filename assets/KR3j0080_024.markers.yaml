  - {type: variant, offset: 3223, length: 2, content: 穀卻, SBCK: 之海内屠肆六畜死者日數千頭不擇吉凶早死者未必屠工也天下死罪各月斷囚亦數千人其刑於市不擇吉日受禍者未必獄吏也肉盡殺牲獄具斷囚囚斷牲殺創血之實何以異於祭祀之牲獨爲祭祀設歷不爲屠工獄吏立見世俗用意不實類也祭非其鬼又信非其諱持二非徃求一福不能得也沐書曰子日沭令人愛之夘日沐令人白頭夫人之所愛憎在容貎之好醜頭髮白黑在年嵗之稚}
  - {type: page-break, offset: 3223, content: '', id: KR3j0080_SBCK_024-3b}
