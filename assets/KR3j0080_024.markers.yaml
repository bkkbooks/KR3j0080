  - {type: variant, offset: 5006, length: 1, content: 夫, SBCK: 假令太嵗在甲子天下之人皆不得南北徙起宅嫁娶亦皆避之其移東西若徙四維相之如者皆吉何者不與太嵗相觸亦不抵太嵗之衝也實問避太嵗者何意也令太嵗惡人徙乎則徙者皆}
