  - {type: variant, offset: 4822, length: 12, content: 服食藥物輕身益氣延年度世, SBCK: 明之紂至惡之君也當時災異繁多七十卜而皆凶故祖伊曰格人元􅀛罔敢知吉賢者不舉大􅀛不兆災變亟至周武受命髙祖龍興天人並佑竒怪既多豐沛子弟卜之又吉故吉人之體所致無不良凶人之起所招無不醜衛石駘卒無適子有庶子六人卜所以爲後者曰沐浴佩玉則兆五人皆沐浴佩玉石祁子曰焉有執親之喪而沐浴佩玉不沐浴佩玉石祁子兆衛人卜以􅀛爲有知也􅀛非有知石祁子自知也祁子行善政有嘉言言嘉政善故有明瑞使時不卜謀之於衆亦猶稱善何則人心神意同吉凶也}
