  - {type: variant, offset: 5008, length: 1, content: 始, SBCK: 禍令太嵗不禁人徙惡人抵觸之乎則道上之人南北行者皆有殃太嵗之意猶長吏之心也長吏在塗人行觸車馬干其吏從長吏怒之豈獨抱器載物去宅徙居觸犯之者而乃責之哉昔文帝出過霸陵橋有一人行逢車駕逃於橋下以為文帝之車已過疾走而出驚乗輿馬文帝怒以屬廷尉張釋之釋之當論使太嵗之神行若文帝出乎則人犯之}
