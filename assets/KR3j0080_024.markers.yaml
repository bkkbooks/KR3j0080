  - {type: variant, offset: 4984, length: 2, content: 生故, SBCK: 爲賤者設哉何其性類同而禍患别也刑不上大夫聖王於貴者闊也聖王刑賤不罰貴鬼神禍貴不殃賤非易所謂大人與鬼神合其吉凶也我有所犯抵觸縣官羅麗刑法不曰過所致而曰家有􅀒居處不慎飲食過節不曰失調和而曰徙觸時死者累屬葬棺至十不曰氣相汙而曰葬日凶有事歸之有犯無爲歸之所居居衰宅耗蜚凶流尸集人室居又禱先祖寢禍遺殃疾病不請醫更患不修行動歸於禍名曰犯觸用知淺略原事不實俗人之材也猶繫罪司空作徒未必到吏日惡繫役時凶也使殺人者求吉日出詣吏剬罪推善時入獄繫寧能令事解赦令至哉人不觸禍不被罪不被罪不入獄一旦令至解械徑出未必有解除其凶者也天下千獄獄中萬囚其舉事未必觸忌諱也居位食禄專城長邑以千萬數其遷徙日未必逢吉時也歷陽之都一夕沉而爲湖其民未必皆犯嵗月也髙祖始起豐沛俱復其民未必皆慎時日也項羽攻襄安襄安無噍類未必不禱賽也趙軍為秦所坑於長平之下四十萬衆同時俱死其出家時未必不擇時也辰日不哭哭有重喪戊巳死者復尸有隨一家滅門先死之日未必辰與戊巳也血忌不殺牲屠肆不多禍上朔不㑹衆沽舎不觸殃塗上之暴尸未必出以徃亡室中之殯柩未必還以歸忌由此言之諸占射禍祟者皆不可信用信用之者皆不可是夫使食口十人居一宅之中不動钁錘不更居處祠祀嫁娶皆擇吉日從春至冬不犯忌諱則夫十人比至百年能}
