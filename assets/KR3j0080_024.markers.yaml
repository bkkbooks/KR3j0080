  - {type: variant, offset: 5028, length: 1, content: 死, SBCK: 當言在子其東有丑其西有亥明不專掩北方極東西之廣明矣令正言在子位觸土之中直子午者不得南北徙耳東邉直丑巳之地西邉直亥未之民何為不得南北徙丑與亥地之民使太嵗左右通得南北徙及東西徙可則丑在子東亥在子西丑亥之民東西徙觸嵗之位己未之民東西徙忌嵗所破儒者論天下九州以為東西南北盡地廣長九州之内五千里竟三河土中周公卜宅經曰王來紹上帝自服于土中雒則土之中也鄒衍論之以為九州之内五千里竟合為一州在東東位名曰赤縣州自有九州者九焉九九八十一凡八十一州此言殆虚地形難審假令有之亦一難也使天下九州如儒者之議直雒邑以南對三河以北豫州荆州冀州之部有太歲耳雍梁之間青兖徐楊之地安得有太歲使如鄒衍之論則天下九州在東南位不直子午安得有太歲如太歲不在天地極分散在民間則一家之宅輙有太歲雖不南北徙猶抵觸之假令從東里徙西里西里有太歲從東宅徙西宅西宅有太歲或在}
