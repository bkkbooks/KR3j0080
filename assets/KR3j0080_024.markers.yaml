  - {type: variant, offset: 2348, length: 219, content: 故者矣萬物變化無復還者復育化為蟬羽翼既成不能復化為復育能升之物皆有羽翼升而復降羽翼如故見曼都之身有羽翼乎言乃可信身無羽翼言虛妄也虛則與盧敖同一實也或時曼都好道默委家去周章遠方終無所得力勌望極默復歸家慚愧無言則言上天其意欲言道可學得審有仙人己殆有過故成而復斥升而復降儒書言齊王疾痟使人之宋迎文摯文摯至視王之疾謂太子曰王之疾必可已也雖然王之疾已則必殺摯也太子曰何故文摯對曰非怒王則疾不可治也王怒則摯必死太子頓首強請曰苟已王之疾臣與臣之母以死爭, SBCK: 葬歷驗}
