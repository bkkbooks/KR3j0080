  - {type: variant, offset: 1608, length: 239, content: 臂遯逃乎碑下敖乃視之方卷然龜背而食合梨盧敖仍與之語曰吾子唯以敖為倍俗去群離黨窮觀於六合之外者非敖而已乎敖幼而好游至長不渝解周行四極唯北陰之未闚今卒睹夫子於是殆可與敖為友乎若士者悖然而笑曰嘻子中州之民也不宜遠至此此猶光日月而戴列星四時之所行陰陽之所生也此其比夫不名之地猶㟮屼也若我南游乎罔浪之野北息乎沉薶之鄉西窮乎窅冥之黨而東貫澒濛之先光此其下無地而上無天聽焉無聞而視焉則營此其外猶有狀有狀之餘壹舉而能千萬里吾猶未能之在今子游始至於此乃語窮觀豈不亦遠哉然子處矣吾與汗漫期於九垓之上, SBCK: 事}
