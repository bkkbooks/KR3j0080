  - {type: variant, offset: 2670, length: 536, content: 果以鼎生烹文摯爨之三日三夜顏色不變文摯曰誠欲殺我則胡不覆之以絕陰陽之氣王使覆之文摯乃死夫文摯道人也入水不濡入火不燋故在鼎三日三夜顏色不變此虛言也夫文摯而烹三日三夜顏色不變為一覆之故絕氣而死非得道之驗也諸生息之物氣絕則死死之物烹之輒爛置生息之物密器之中覆蓋其口漆塗其隙中外氣隔息不得洩有頃死也如置湯鑊之中亦輒爛矣何則體同氣均稟性於天共一類也文摯不息乎與金石同入湯不爛是也令文摯息乎烹之不死非也令文摯言言則以聲聲以呼吸呼吸之動因血氣之發血氣之發附於骨肉骨肉之物烹之輒死今言烹之不死一虛也既能烹煮不死此真人也與金石同金石雖覆蓋與不覆蓋者無以異也今言文摯覆之則死二虛也置人寒水之中無湯火之熱鼻中口內不通於外斯須之頃氣絕而死矣寒水沉人尚不得生況在沸湯之中有猛火之烈乎言其入湯不死三虛也人沒水中口不見於外言音不揚烹文摯之時身必沒於鼎中沒則口不見口不見則言不揚文摯之言四虛也烹輒死之人三日三夜顏色不變癡愚之人尚知怪之使齊王無知太子群臣宜見其奇奇怪文摯則請出尊寵敬事從之問道今言三日三夜無臣子請出之言五虛也此或時聞文摯實烹烹而輒死世見文摯為道人也則為虛生不死之語矣猶黃帝實死也傳言升天淮南坐反書言度世世好傳虛故文摯之語傳至於今世無得道之效而有有壽之人世見長壽之人學道為仙踰百不死共謂之仙矣, SBCK: ''}
