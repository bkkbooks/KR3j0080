  - {type: variant, offset: 5031, length: 0, content: '', SBCK: 東西或在人之南北猶行途上東西南北皆逢觸人太歲位數千萬億天下之民徙者皆凶為移徙者何以審之如審立於天地之際猶王者之位在土中也東方之民張弓西射人不謂之射王者以不能至王者之都自止射其處也今徙豈能北至太嵗位哉自止徙百步之内何為謂之傷太嵗乎且移徙之家禁南北徙者以為嵗在子位子者破午南北徙者抵觸其衝故謂之凶夫破者湏有以椎破之也如審有所用則不徙之民皆被破害如無所用何能破之夫雷天氣也盛夏擊折折木破山時暴殺人使太嵗所破若迅雷也則聲音冝疾死者冝暴如不若雷亦無能破如謂衝抵為破衝抵安能相破東西相與為衝而南北相與為抵如必以衝抵爲凶則東西常凶而南北常惡也如以太嵗神其衝獨凶神莫過於天地天地相與爲衝則天地之間無}
