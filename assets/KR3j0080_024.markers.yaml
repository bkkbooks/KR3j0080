  - {type: variant, offset: 3215, length: 3, content: 有李少, krp: 天子諸侯卿大夫死以千百數案其葬日未必合於歷又曰雨不克葬庚寅日中乃葬假令魯小}
  - {type: punctuation, offset: 3219, content: ，, id: KR3j0080_tls_024-bkkpn702}
  - {type: variant, offset: 3220, length: 0, content: '', SBCK: 剛日死至葬日己丑剛柔等矣剛柔合善日也不克葬者避雨也如善日不當以雨之故廢而不用也何則雨不便事耳不用剛柔重凶不吉欲便事而犯凶非魯人之意臣子重慎之義也今廢剛柔待庚寅日中以􅊙爲吉也禮天子七月而葬諸侯五月卿大夫士三月假令天子正月崩七月葬二月崩八月葬諸侯卿大夫士皆然如驗之葬歷則天子諸侯葬月常竒常耦也衰世好信禁不肖君好求福春秋之時可謂衰矣隱哀之間不肖甚矣然而葬埋之日不見所諱無忌之故也周文之世法度備具孔子意宻春秋義纎如廢吉得凶妄舉觸禍宜有微文小義貶譏之辭今不見其義無葬歷法也祭祀之歷亦有吉凶假令血忌月殺之日固凶以殺牲設祭必有患禍夫祭者供食􅀑也􅀑者死人之精也若非死人之精人未甞見􅀑之飲食也推生事死推人事􅀑見生人有飲食死爲鬼當能復飲食感物思親故祭祀也及他神百鬼之}
  - {type: page-break, offset: 3220, content: '', id: KR3j0080_SBCK_024-2b}
  - {type: page-break, offset: 3220, content: '', id: KR3j0080_SBCK_024-3a}
  - {type: variant, offset: 3220, length: 0, content: '', WYG: 剛日死至葬日己丑剛柔等矣剛柔合善日也不克葬者避雨也如善日不當以雨之故廢而不用也何則雨不便事耳不用剛柔重凶不吉欲便事而犯凶非魯人之意臣子重慎之義也今廢剛柔待庚寅日中以𤾉爲吉也禮天子七月而葬諸侯五月卿大夫士三月假令天子正月崩七月葬二月崩八月葬諸侯卿大夫士皆然如驗之葬厯則天子諸侯葬月常竒常耦也衰世好信禁不肖君好求福春秋之時可謂衰矣隱哀之間不肖甚矣然而葬埋之日不見所諱無忌之故也周文之世法度備具孔子意宻春秋義纎如廢吉得凶妄舉觸禍宜有微文小義貶譏之辭今不見其義無葬厯法也祭祀之厯亦有吉凶假令血忌月殺之日固凶以殺牲設祭必有患禍夫祭者供食鬼也鬼者死人之精也若非死人之精人未嘗見鬼之飲食也推生事死推人事鬼見生人有飲食死爲鬼當能復飲食感物思親故祭祀也及他神百鬼之}
