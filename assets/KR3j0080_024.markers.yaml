  - {type: variant, offset: 3440, length: 581, content: 少君性壽之人也如少君處山林之中入絕跡之野獨病死於巖石之間尸為虎狼狐狸之食則世復以為真仙去矣世學道之人無少君之壽年未至百與眾俱死愚夫無知之人尚謂之尸解而去其實不死所謂尸解者何等也謂身死精神去乎謂身不死得免去皮膚也如謂身死精神去乎是與死無異人亦仙人也如謂不死免去皮膚乎諸學道死者骨肉具在與恆死之尸無以異也夫蟬之去復育龜之解甲虵之脫皮鹿之墮角殼皮之物解殼皮持骨肉去可謂尸解矣今學道而死者尸與復育相似尚未可謂尸解何則案蟬之去復育無以神於復育況不相似復育謂之尸解蓋復虛妄失其實矣太史公與李少君同世並時少君之死臨尸者雖非太史公足以見其實矣如實不死尸解而去太史公宜紀其狀不宜言死其處座中年九十老父為兒時者少君老壽之效也或少君年十四五老父為兒隨其王父少君年二百歲而死何為不識武帝去桓公鑄銅器且非少君所及見也或時聞宮殿之內有舊銅器或案其刻以告之者故見而知之今時好事之人見舊劍古鉤多能名之可復謂目見其鑄作之時乎世或言東方朔亦道人也姓金氏字曼倩變姓易名游宦漢朝外有仕宦之名內乃度世之人此又虛也夫朔與少君並在武帝之時太史公所及見也少君有教穀道祠竈卻老之方又名齊桓公所鑄鼎知九十老人王父所游射之驗然尚無得道之實而徒性壽遲死之人也況朔無少君之方術效驗世人何見謂之得道案武帝之時道人文成五利之輩入海求仙人索不死之藥有道術之驗故為上所信朔無入海之使無奇怪之效也如使有奇不過少君之類及文成五利之輩, SBCK: 欲問天天髙}
