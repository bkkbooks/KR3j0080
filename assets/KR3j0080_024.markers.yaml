  - {type: variant, offset: 4849, length: 0, content: '', SBCK: 吉凶之兆者逢吉遭凶之類也何以明之周武王不豫周公卜三􅀛公曰乃逢是吉魯卿莊叔生子穆叔以周易筮之遇明夷之謙夫卜曰逢筮曰遇實遭遇所得非善惡所致也善則逢吉惡則遇凶天道自然非爲人也推此以論人君治有吉凶之應亦猶此也君德遭賢時適當平嘉物竒瑞至偶不肖之君亦反此焉世人言卜筮者多得實誠者寡論者或謂蓍􅀛可以叅事不可純用夫鑚􅀛揲蓍兆數輙見見無常占占者生意吉兆而占謂之凶凶數而占謂之吉吉凶不效則謂卜筮不可信周武王伐紂卜筮之逆占曰大凶太公推蓍蹈􅀛而曰枯骨死草何知而凶夫卜筮兆數非吉凶誤也占之不審吉凶吉凶變亂變亂故太公黜之夫蓍筮􅀛卜猶聖王治世卜筮兆數猶王治瑞應瑞應無常兆數詭異詭異則占者惑無常則議者疑疑則謂平未治惑則謂吉不良何以明之夫吉兆數吉人可遭也治遇符瑞聖徳之驗也周王伐紂遇烏魚之瑞}
  - {type: page-break, offset: 4849, content: '', id: KR3j0080_SBCK_024-9b}
  - {type: page-break, offset: 4849, content: '', id: KR3j0080_SBCK_024-10a}
  - {type: variant, offset: 4849, length: 0, content: '', WYG: 吉凶之兆者逢吉遭凶之類也何以明之周武王不豫周公卜三龜公曰乃逢是吉魯卿莊叔生子穆叔以周易筮之遇明夷之謙夫卜曰逢筮曰遇實遭遇所得非善惡所致也善則逢吉惡則遇凶天道自然非爲人也推此以論人君治有吉凶之應亦猶此也君德遭賢時適當平嘉物竒瑞偶至不肖之君亦反此焉世人言卜筮者多得實誠者寡論者或謂蓍龜可以叅事不可純用夫鑚龜揲蓍兆數輒見見無常占占者生意吉兆而占謂之凶凶數而占謂之吉吉凶不效則謂卜筮不可信周武王伐紂卜筮之逆占曰大凶太公推蓍蹈龜而曰枯骨死草何知而凶夫卜筮兆數非吉凶誤也占之不審吉凶吉凶變亂變亂故太公黜之夫蓍筮龜卜猶聖王治世卜筮兆數猶王治瑞應瑞應無常兆數詭異詭異則占者惑無常則議者疑疑則謂平未治惑則謂吉不良何以明之夫吉兆數吉人可遭也治遇符瑞聖徳之驗也周王伐紂遇烏魚之瑞}
