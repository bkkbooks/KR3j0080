  - {type: variant, offset: 2005, length: 241, content: 蜊之肉與庸民同食無精輕之驗安能縱體而升天聞食氣者不食物食物者不食氣若士者食物如不食氣則不能輕舉矣或時盧敖學道求仙游乎北海離眾遠去無得道之效慚於鄉里負於論議自知以必然之事見責於世則作誇誕之語云見一士其意以為有仙求仙之未得期數未至也淮南王劉安坐反而死天下並聞當時並見儒書尚有言其得道仙去鷄犬升天者況盧敖一人之身獨行絕跡之地空造幽冥之語乎是與河東蒲坂項曼都之語無以異也曼都好道學仙委家亡去三年而返家問其狀曼都曰去時不能自知忽見若臥形有仙人數人將我上天離月數里而止見月上下幽冥幽冥不知東西居, SBCK: 又索}
