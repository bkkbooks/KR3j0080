  - {type: variant, offset: 4881, length: 1, content: 本, SBCK: 相隨信之不復狐疑故人君興事工伎滿閤人民有爲觸傷問時姧書偽文由此滋生巧惠生意作知求利驚惑愚暗漁富偷貧愈非古法度聖人之至意也聖人舉事先定於義義已定立決以卜筮示不專已明與鬼神同意共指欲令衆下信用不疑故書列七卜易載八卦從之未必有福違之未必有禍然而禍福之至時也死生之到命也人命懸於天吉凶存於時命窮操行善天不能續命長操行惡天不能奪天百神主也道德仁義天之道也戰栗恐懼天之心也廢道滅德賤天之道嶮隘恣雎悖天之意世間不行道德莫過桀紂妄行不軌莫過幽厲桀紂不早死幽厲不夭折由此言之逢福獲喜不在擇日避時渉患麗禍不在觸嵗犯月明矣孔子曰死生有命富貴在天茍有時日誠有禍祟聖人何惜不言何畏不說案古圖籍仕者安危千君萬臣其得失吉凶官位髙下位禄降升各有差品家人治産貧富息耗夀命長短各有遠近非髙大尊貴舉事以吉日下小卑賤以凶時也以此論之則亦知禍福死生不在遭逢吉祥觸犯凶忌也然則人之生也精氣育也人之死者命窮絶也人之生未必得吉逢喜其死獨何為謂之犯凶觸忌以孔子證之以死生論之則亦知夫百禍千凶非動作之所致也孔子聖人知府也死生大事也大事道效也孔子云死生有命富貴在天衆文微言不能奪俗人愚夫不能易明矣人之於世禍福有命人之操行亦}
  - {type: page-break, offset: 4881, content: '', id: KR3j0080_SBCK_024-12b}
