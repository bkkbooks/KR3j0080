  - {type: variant, offset: 1292, length: 223, content: 地皆體也地無下則天無上矣天無上上升之路何如穿天之體人力不能入如天之門在西北升天之人宜從崑崙上淮南之國在地東南如審升天宜舉家先從崑崙乃得其階如鼓翼邪飛趨西北之隅是則淮南王有羽翼也今不言其從之崑崙亦不言其身生羽翼空言升天竟虛非實也案淮南王劉安孝武皇帝之時也父長以罪遷蜀嚴道至雍道死安嗣為王恨父徙死懷反逆之心招會術人欲為大事伍被之屬充滿殿堂作道術之書發怪奇之文合景亂首八公之儔欲示神奇若得道之狀道終不成效驗不立乃與伍被謀為反事事覺自殺或言誅死誅死自殺同, SBCK: 棺}
