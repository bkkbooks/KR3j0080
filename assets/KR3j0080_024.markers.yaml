  - {type: variant, offset: 3435, length: 0, content: '', SBCK: 事之可否不問日之吉凶孔子曰卜其宅兆而安厝之春秋祭祀不言卜日禮曰内事以柔日外事以剛日剛柔以慎内外不論吉凶以爲禍福卜筮篇俗信卜筮謂卜者問天筮者問地􅆱神􅀛靈兆數報應故捨人議而就卜筮違可否而信吉凶其意謂天地審告報􅆱􅀛真神靈也如實論之卜筮不問天地􅆱􅀛未必神靈有神靈問天地俗儒所言也何以明之子路問孔子曰猪肩羊膊可以得兆雚葦藁芼可以得數何必以􅆱􅀛孔子曰不然盖取其名也夫􅆱之爲言􅂄也􅀛之爲言舊也明狐疑之事當問􅂄舊也由此言之􅆱不神􅀛不靈盖取其名未必有實也無其實則知其無神靈無神靈則知不問天地也且天地口耳何在而得問之天與人同道欲知天以人事相問不自對}
  - {type: page-break, offset: 3435, content: '', id: KR3j0080_SBCK_024-6a}
  - {type: page-break, offset: 3435, content: '', id: KR3j0080_SBCK_024-6b}
  - {type: variant, offset: 3435, length: 0, content: '', WYG: 事之可否不問日之吉凶孔子曰卜其宅兆而安厝之春秋祭祀不言卜日禮曰内事以柔日外事以剛日剛柔以慎内外不論吉凶以爲禍福卜筮篇俗信卜筮謂卜者問天筮者問地蓍神龜靈兆數報應故捨人議而就卜筮違可否而信吉凶其意謂天地審告報蓍龜真神靈也如實論之卜筮不問天地蓍龜未必神靈有神靈問天地俗儒所言也何以明之子路問孔子曰猪肩羊膊可以得兆雚葦藁芼可以得數何必以蓍龜孔子曰不然蓋取其名也夫蓍之爲言耆也龜之爲言舊也明狐疑之事當問耆舊也由此言之蓍不神龜不靈蓋取其名未必有實也無其實則知其無神靈無神靈則知不問天地也且天地口耳何在而得問之天與人同道欲知天以人事相問不自對}
