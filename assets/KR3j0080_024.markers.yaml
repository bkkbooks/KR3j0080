  - {type: variant, offset: 572, length: 379, content: 帝三王皆有聖德之優者黃帝不在上焉如聖人皆仙仙者非獨黃帝如聖人不仙黃帝何為獨仙世見黃帝好方術方術仙者之業則謂黃帝仙矣又見鼎湖之名則言黃帝採首山銅鑄鼎而龍垂胡髯迎黃帝矣是與說會稽之山無以異也夫山名曰會稽即云夏禹巡狩會計於此山上故曰會稽夫禹至會稽治水不巡狩猶黃帝好方伎不升天也無會計之事猶無鑄鼎龍垂胡髯之實也里名勝母可謂實有子勝其母乎邑名朝歌可謂民朝起者歌乎儒書言淮南王學道招會天下有道之人傾一國之尊下道術之士是以道術之士並會淮南奇方異術莫不爭出王遂得道舉家升天畜產皆仙犬吠於天上雞鳴於雲中此言仙藥有餘犬雞食之并隨王而升天也好道學仙之人皆謂之然此虛言也夫人物也雖貴為王侯性不異於物物無不死人安能仙鳥有毛羽能飛不能升天人無毛羽何用飛升使有毛羽不過與鳥同況其無有升天如何案能飛升之物生有毛羽之兆能馳走之物生有蹄足之形馳走不能飛升飛升不能馳走稟性受氣形體殊別也今人稟馳走, SBCK: 行}
