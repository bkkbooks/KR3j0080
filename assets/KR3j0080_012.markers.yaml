  - {type: variant, offset: 5, length: 0, content: '', WYG: 之不習不原文吏之所得得用而尊其材謂之善吏非文吏憂不除非文吏患不救是以選舉取常故案吏取無害儒生無閥閱所能不能任劇故陋於選舉佚於朝廷聰慧捷疾者隨時變化學知吏事則踵文吏之後未得良善之名守古循志案禮修義輒為將相所不任文吏所毗戲不見任則執欲息退見毗戲則意不得臨職不勸察事不精遂為不能斥落不習有俗材而無雅度者學知吏事亂於文吏觀將所知適時所急轉志易務晝夜學問無所羞恥期於成能名文而已其髙志妙操之人恥降意損崇以稱媚取進深疾才能之儒洎入文吏之科堅守髙志不肯下學亦時或精闇不及意疏不密臨事不識對向謬誤拜起不便進退失度奏記言事蒙士解過援引古義割切將欲直言一指觸諱犯忌封蒙約縳簡繩檢署事不如法文辭卓詭辟刺離實曲不應義故世俗輕之文吏薄之將相賤之是以世俗學問者不肯竟經明學深知古今急欲成一家章句義理略具同超學史書讀律諷令治作情奏習對向滑習跪拜家成室就召署輒能徇今不顧古趨讎不存志競進不案禮廢經不念學是以古經廢而不修舊學闇而不明儒者寂於空室文吏譁於朝堂材能之士隨世驅馳節操之人守隘屏竄驅馳日以巧屏竄日以拙非材頓知不及也希見闕為不狎習也蓋足未嘗行堯禹問曲折目未嘗見孔墨問形象齊部世刺繡恒女無不能襄邑俗織錦鈍婦無不巧日見之日為之手狎也使材士未嘗見巧女未嘗為異事詭手暫為卒睹顯露易為者猶憒憒焉方今論事不謂希更而曰材不敏不曰未嘗為而曰知不達失其實也儒生材無不能敏業無不能達志不有為今俗見不習謂之不能睹不為謂之不達科用累能故文吏在前儒生在後是從朝廷謂之也如從儒堂訂之則儒生在上文吏在下矣從農論田田夫勝從商講賈賈人賢今從朝廷謂之文吏朝廷之人也幼為幹吏以朝廷為田畝以刀筆為耒耜以文書為農業猶家人子弟生長宅中其知曲折愈於賓客也賓客暫至雖孔墨之材不能分别儒生猶賓客文吏猶子弟也以子弟論之則文吏曉於儒生儒生闇於文吏今世之將相知子弟以文吏為慧不能知文吏以狎為能知賓客以暫為固不知儒生以希為拙惑蔽闇昧不知類也一縣佐史之材任郡掾史一郡脩行之能堪州從事然而郡不召佐史州不取脩行者巧習無害文少德髙也五曹自有條品簿書自有故事勤力玩弄成為巧吏安足多矣賢明之將程吏取材不求習論髙存志不顧文也稱良吏曰忠忠之所以為效非簿書也夫事可學而知禮可習而善忠節公行不可立也文吏儒生皆有所志然而儒生務忠良文吏趨理事茍有忠良之業疏拙於事無損於髙論者以儒生不曉簿書置之於下第法令比例吏㫁決也文吏治事必問法家縣官事務莫大法令必以吏職程髙是則法令之家宜最為上或曰固然法令漢家之經吏議決焉事定於法誠為明矣曰夫五經亦漢家之所立儒生善政大義皆出其中董仲舒表春秋之義稽合於律無乖異者然則春秋漢之經孔子制作垂遺於漢論者徒尊法家不髙春秋是闇蔽也春秋五經義相闗穿既是春秋不大五經是不通也五經以道為務事不如道道行事立無道不成然則儒生所學者道也文吏所學者事也假使材同當以道學如比於文吏洗洿泥者以水燔腥生者用火水火道也用之者事也事末於道儒生治本文吏理末道本與事末比定尊卑之髙下可得程矣堯以俊德致黎民雍孔子曰孝悌之至通於神明張釋之曰秦任刀筆小吏陵遲至於二世天下土崩張湯趙禹漢之惠吏太史公序累置於酷部而致土崩孰與通於神明令人填膺也將相知經學至道而不尊經學之生彼見經學之生能不及治事之吏也牛刀可以割雞雞刀難以屠牛刺繡之師能縫帷裳納縷之工不能織錦儒生能為文吏之事文吏不能立儒生之學文吏之能誠劣不及儒生之不習實優而不為禹決江河不秉钁鍤周公築雒不把築杖夫筆墨簿書钁鍤築杖之類也而欲合志大道者躬親為之是使將軍戰而大匠斵也説一經之生治一曹之事旬月能之典一曹之吏學一經之業一歲不能立也何則吏事易知而經學難見也儒生擿經窮竟聖意文吏揺筆考跡民事夫能知大聖之意曉細民之情孰者為難以立難之材含懷章句十萬以上行有餘力博學覽古今計胸中之穎出溢十萬文吏所知不過辨解簿書富累千金孰與貲直百十也京廩如丘孰與委聚如坻也世名材為名器器大者盈物多然則儒生所懷可謂多矣蓬生麻間不扶自直白紗入緇不染自黑此言所習善惡變易質}
