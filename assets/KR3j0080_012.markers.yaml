  - {type: variant, offset: 8, length: 0, content: '', SBCK: 資用侵漁徇身不爲將貪官顯義雖見太山之惡安肯揚舉毛髪之言事理如此何用自解於尸位素飡乎儒生學大義以道事將不可則止有大臣之志以經勉爲公正之操敢言者也位又䟽遠遠而近諌禮謂之謟此則郡縣之府庭所以常廓無人者也或曰文吏筆扎之能而治定簿書考理煩事雖無道學䈥力材能盡於朝庭此亦報上之效驗也曰此有似於貧人􅀒官重責貧無以償則身爲官作責乃畢竟夫官之作非屋廡則墻壁也屋廡則用斧斤墻壁則用築鍤荷斤斧把築鍤與彼握刀持筆何以殊茍謂治文書者報上之效驗此則治屋廡墻壁之人亦報上也俱爲官作刀筆斧斤築鍤鈞也抱布貿絲交易有亡各得所願儒生抱道貿禄文吏無所抱何用貿易農商殊業所畜之貨貨不可同計其精麤量其多少其出溢者名曰}
