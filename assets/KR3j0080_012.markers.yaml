  - {type: variant, offset: 11, length: 0, content: '', SBCK: 乎不入師門無經傳之教以郁樸之實不曉禮義立之朝庭植笮樹表之􅀋也其何益哉山野草茂鉤鐮斬刈乃成道路也士未入道門邪惡未除猶山野草木未斬刈不成路也染練布帛名之曰采貴吉之服也無染練之治名縠麤縠麤不吉䘮人服之人無道學仕宦朝庭其不能招致也猶䘮人服麤不能招吉也能斵削柱梁謂之木匠能穿鑿穴塪謂之土匠能彫􅅣文書謂之史匠夫文吏之學學治文書也當與木土之匠同科安得程於儒生哉御史之遇文書不失分銖有司之陳籩豆不誤行伍其巧習者亦先學之人不貴者也小賤之能非尊大之職也無經藝之本有筆墨之末大道未足而小􅇊過多雖曰吾多學問御史之知有司之惠也飯􅁰梁者饜飡糟糠者飽雖俱曰食爲􅃾不同儒生文吏學俱稱習其於朝庭有益不鈞鄭子皮使尹何爲政子産比於未能操刀使之割也子路使子羔爲費宰孔子曰賊夫人之子皆以未學不見大道也醫無方術云吾能治病問之曰何用治病曰用心意病者必不信也吏無經學曰吾能治民問之曰何用治民曰以材能是醫無方術以心意治病也百姓安肯信嚮而人君任用使之乎手中無錢之市使貨主問曰錢何在對曰無錢貨主必不與也夫胷中不學猶手中無錢也欲人君任使之百姓信嚮之奈何也謝短篇程材量知言儒生文吏之材不能相過以儒生脩大道以文吏曉簿書道勝於事故謂儒生頗愈文吏也此職業外相程相量也其内各有所以爲短未實謝也夫儒生能說一經自謂通大道以驕文吏文吏曉簿書自謂文無害以戯儒生各持滿而自藏非彼而是我不知所爲短不悟於巳未足論者詶之將使然各知所之夫儒生所短不徒以不曉簿書文吏所劣不徒以不通大道也反以閉闇不覽古今不能各自知其所業之事未具足也二家各短不能自知也世之論者而亦不能詶之如何夫儒生之業五經也南面爲師旦夕講授章句滑習義理究備於五經可也五經之後秦漢之事無不能知者短也夫知古不知今謂之陸沉然則儒生所謂陸沉者也五經之前至於天地始開帝王}
