  - {type: variant, offset: 9, length: 0, content: '', WYG: 人富人在世鄉里願之夫先王之道非徒農商之貨也其為長吏立功致化非徒富多出溢之榮也且儒生之業豈徒出溢哉其身簡練知慮光明見是非審尤可竒也蒸所與衆山之材榦同也代以為蒸燻以火烟熱究浹光色澤潤焫之於堂其耀浩廣火竈之效加也繡之未刺錦之未織恒絲庸帛何以異哉加五綵之巧施針縷之飭文章炫耀黼黻華蟲山龍日月學士有文章之學猶絲帛之有五色之巧也本質不能相過學業積聚超踰多矣物實無中核者謂之郁無刀斧之㫁者謂之樸文吏不學世之教無核也郁樸之人孰與程哉骨曰切象曰瑳玉曰琢石曰磨切瑳琢磨乃成寶器人之學問知能成就猶骨象玉石切瑳琢磨也雖欲勿用賢君其舍諸孫武闔廬世之善用兵者也或知學其法者戰必勝不曉什伯之陣不知擊刺之術者彊使之軍軍覆師敗無其法也榖之始熟曰粟舂之於臼簸其粃糠蒸之於甑爨之以火成熟為飯乃甘可食可食而食之味生肌腴成也粟未為米米未成飯氣腥未熟食之傷人夫人之不學猶榖未成粟米未為飯也知心亂少猶食腥榖氣傷人也學士簡練於學成熟於師身之有益猶榖成飯食之生肌腴也銅錫未採在衆石之間工師鑿掘鑪橐鑄鑠乃成器未更鑄橐名曰積石積石與彼路畔之瓦山間之礫一實也故夫榖未舂蒸曰粟銅未鑄鑠曰積石人未學問曰矇矇者竹木之類也夫竹生於山木長於林未知所入截竹為筒破以為牒加筆墨之跡乃成文字大者為經小者為傳記㫁木為槧㭊之為板力加刮削乃成奏牘夫竹木麤苴之物也彫琢刻削乃成為器用况人含天地之性最為}
