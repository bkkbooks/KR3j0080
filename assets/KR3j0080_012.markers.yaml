  - {type: variant, offset: 583, length: 241, content: 驗之富家之翁貲累千金生有富骨治生積貨至於年老成為富翁矣夫王者天下之翁也稟命定於身中猶鳥之別雄雌於卵殼之中也卵殼孕而雌雄生日月至而骨節彊彊則雄自率將雌雄非生長之後或教使為雄然後乃敢將雌此氣性剛彊自為之矣夫王者天下之雄也其命當王王命定於懷妊猶富貴骨生有鳥雄卵成也非唯人鳥也萬物皆然草木生於實核出土為栽蘖稍生莖葉成為長短巨細皆由實核王者長巨之最也朱草之莖如鍼紫芝之栽如豆成為瑞矣王者稟氣而生亦猶此也或曰王者生稟天命及其將王天復命之猶公卿以下詔書封拜乃敢即位赤雀魚烏上天封拜之命也天道人事有, SBCK: ''}
