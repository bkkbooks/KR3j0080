  - {type: variant, offset: 49, length: 0, content: '', SBCK: 演爲六十四孔子作􅂏象繫辭三聖重業易乃具足問之曰易有三家一曰連山二曰歸藏三曰周易伏羲所作文王所造連山乎歸藏周易也秦燔五經易何以得脫漢興幾年而復立宣帝之時河内女子壞老屋得易一篇名爲何易此時易具足未問尚書家曰今旦夕所授二十九篇竒有百二篇又有百篇二十九篇何所起百二篇何所造秦焚諸書之時尚書諸篇皆何在漢興始録尚書者何帝初}
