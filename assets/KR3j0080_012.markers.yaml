  - {type: variant, offset: 242, length: 294, content: 我世當有興者其在昌乎於是太伯知之乃辭之吳文身斷髮以讓王季文王受命謂此時也天命在人本矣太王古公見之早也此猶為未文王在母身之中已受命也王者一受命內以為性外以為體體者面輔骨法生而稟之吏秩百石以上王侯以下郎將大夫以至元士外及刺史太守居祿秩之吏稟富貴之命生而有表見於面故許負姑布子卿輒見其驗仕者隨秩遷轉遷轉之人或至公卿命祿尊貴位望高大王者尊貴之率高大之最也生有高大之命其時身有尊貴之奇古公知之見四乳之怪也夫四乳聖人證也在母身中稟天聖命豈長大之後脩行道德四乳乃生以四乳論望羊亦知為胎之時已受之矣劉媼息於大澤夢與神遇遂生高祖此時已受命也光武生於濟陽宮夜半無火內中光明軍下卒蘇永謂公曹史充蘭曰此吉事也毋多, SBCK: 詩言志歌詠}
