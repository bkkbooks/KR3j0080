  - {type: variant, offset: 8, length: 0, content: '', krp: 資用侵漁徇身不爲將貪官顯義雖見太山之惡安肯揚舉毛髪之言事理如此何用自解於尸位素飡乎儒生學大義以道事將不可則止有大臣之志以經勉爲公正之操敢言者也位又䟽遠遠而近諌禮謂之謟此則郡縣之府庭所以常廓無人者也或曰文吏筆扎之能而治定簿書考理煩事雖無道學䈥力材能盡於朝庭此亦報上之效驗也曰此有似於貧人負官重責貧無以償則身爲官作責乃畢竟夫官之作非屋廡則墻壁也屋廡則用斧斤墻壁則用築鍤荷斤斧把築鍤與彼握刀持筆何以殊茍謂治文書者報上之效驗此則治屋廡墻壁之人亦報上也俱爲官作刀筆斧斤築鍤鈞也抱布貿絲交易有亡各得所願儒生抱道貿禄文吏無所抱何用貿易農商殊業所畜之貨貨不可同計其精麤量其多少其出溢者名曰}
  - {type: variant, offset: 9, length: 0, content: '', SBCK: 人富人在世郷里願之夫先王之道非徒農商之貨也其爲長吏立功致化非徒富多出溢之榮也且儒生之業豈徒出溢哉其身簡練知慮光明見是非審尤可竒也蒸所與衆山之材榦同也代以爲蒸燻以火烟􅀬究浹光色澤潤􅌊之於堂其耀浩廣火竈之效加也繡之未㓨錦之未織􅁪絲庸帛何以異哉加五綵之巧施針縷之餝文章炫耀黼黻華蟲山龍日月學士有文章之學猶絲帛之有五色之巧也本質不能相過學業積聚超踰多矣物實無中核者謂之郁無刀斧之斷者謂之樸文吏不學世之教無核也郁樸之人孰與程哉骨曰切象曰瑳玉曰􅅣石曰磨切瑳􅅣磨乃成寳器人之學問知能成就猶骨象玉石切瑳􅅣磨也雖欲勿用賢君其舎諸孫武闔廬世之善用兵者也或知學其法者戰必勝不曉什伯之陣不知擊剌之術者彊使之軍軍覆師敗無其法也榖之始熟曰粟舂之於􅍫簸其粃糠蒸之於甑爨之以火成熟爲飯乃甘可食可食而食之味生肌􅃾成也粟未爲米米未成飯氣腥未熟食之傷人夫人之不學猶榖未成粟米未爲飯也知心亂少猶食腥榖氣傷人也學士簡練於學成熟於師身之有益猶榖成飯食之生肌􅃾也銅錫未採在衆石之間工師鑿掘鑪橐鑄鑠乃成器未更鑪橐名曰積石積石與彼路畔之瓦山間之礫一實也故夫榖未舂蒸曰粟銅未鑄鑠曰積石人未學問曰矇矇者竹木之類也夫竹生於山木長於林未知所入截竹爲筒破以爲牒加筆墨之跡乃成文字大者爲經小者爲傳記斷木爲槧㭊之爲板力加刮削乃成奏牘夫竹木麤苴之物也彫􅅣刻削乃成爲器用況人含天地之性最爲}
