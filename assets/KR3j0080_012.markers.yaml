  - {type: variant, offset: 30, length: 9, content: 赤雀武王得白魚赤烏, SBCK: 天下難易孰與殷周家人子弟學問歷幾歳人問之曰居宅幾年祖先何爲不能知者愚子弟也然則儒生不能知漢事世之愚蔽人也温故知新可以爲師古今不知稱師如何彼人問曰二尺四寸聖人文語朝夕講習義􅀋所及故可務知漢事未載於經名爲尺藉短書比於小道其能知非}
