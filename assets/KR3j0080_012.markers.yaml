  - {type: variant, offset: 12, length: 1, content: 稟, SBCK: 立者主名爲誰儒生又不知也夫知今不知古謂之盲瞽五經比於上古猶爲今也徒能說經不曉上古然則儒生所謂盲瞽者也儒生猶曰上古乆遠其事闇昧故經不載而師不說也夫三王之事雖近矣經雖不載義所連及五經所當共知儒生所當審說也夏}
