  - {type: variant, offset: 6, length: 1, content: 命, SBCK: 也儒生之性非能皆善也􅀍服聖敎日夜諷詠得聖人之操矣文吏㓜則筆墨手習而行無篇章之誦不聞仁義之語長大成吏舞文巧法徇私爲己勉赴權利考事則受賂臨民則采漁處右則弄權幸上則賣將一旦在位鮮冠利劒一歲典職田宅并兼性非皆惡所習爲者違聖教也故習善儒路歸化慕義志操則勵變從高明將見之顯用儒生東海相宗叔犀犀廣召幽隱春秋㑹饗設置三科以第補吏一府貟吏儒生什九陳留太守陳子瑀開廣儒路列曹􅁺史皆能教授簿書之吏什置一二兩將知道事之理曉多少之量故世稱襃其名書記紀累其行也量知篇程材所論論材能行操未言學知之殊竒也夫儒生之所以過文吏者學問日多簡練其性彫􅅣其材也故夫學者所以反情治性盡材成德也材盡德成其比於文吏亦彫􅅣者程量多矣貧人與冨人俱賫錢百並爲賻禮死哀之家知之者知貧人劣能共百以爲冨人饒羡有竒餘也不知之者見錢俱百以爲財貨貧冨皆若一也文吏儒生皆有似於此皆爲􅁺吏並典一曹將知之者知文吏儒生筆同而儒生胷中之藏尚多竒餘不知之者以爲皆吏深淺多少同一量失實甚矣地性生草山性生木如地種葵韮山樹􅀥栗名曰美園茂林不復與一􅁪地庸山比矣文吏儒生有似於此俱有材能並用筆墨而儒生竒有先王之道先王之道非徒葵韮􅀥栗之謂也􅁪女之手紡績織經如或竒能織錦㓨繡名曰卓殊不復與􅁪女科矣夫儒生與文吏程材而儒生侈有經傳之學猶女工織錦㓨繡之竒也貧人好濫而富人守節者貧人不足而富人饒侈儒生不爲非而文吏好爲姦者文吏少道德而儒生多仁義也貧人富人並爲賔客受賜於主人富人不慙而貧人常媿者富人有以效貧人無以復也儒生文吏俱以長吏爲主人者也儒生受長吏之禄報長吏以道文吏空胷無仁義之學居住食禄終無以效所謂尸位素飡者也素者空也空虚無德飡人之禄故曰素飡無道藝之業不曉政治黙坐朝庭不能言事與尸無異故曰尸位然則文吏所謂尸位素飡者也居右食嘉見將傾邪豈能舉記陳言得失乎一則不能見是非二則畏罰不敢直言禮曰情欲巧其能力言者文醜不好者有骨無􅁏脂􅃾不足犯干將相指遂取間郤爲地戰者不能立功名貪爵禄者不能諌於上文吏貪爵禄一日居位輙欲圖利以}
