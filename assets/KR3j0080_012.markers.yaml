  - {type: variant, offset: 3, length: 0, content: '', SBCK: 量知篇謝短篇程材篇論者多謂儒生不及彼文吏見文吏利便而儒生陸落則詆訾儒生以爲淺短稱譽文吏謂之深長是不知儒生亦不知文吏也儒生文吏皆有材智非文吏材髙而儒生智下也文吏更事儒生不習也謂文吏更事儒生不習可也謂文吏深長儒生淺短知妄矣世俗共短儒生儒生之徒亦自相少何則並好仕學宦用吏爲繩表也儒生有闕俗共短之文吏有過俗不敢訾歸非於儒生付是於文吏也夫儒生材非下於文吏又非所習之業非所當爲也然世俗共短之者見將不好用也將之不好用之者事多巳不能理湏文吏以領之也夫論善謀材施用累能期於有益文吏理煩身役於職職判功立將尊其能儒生栗栗不能當劇將有煩疑不能效力力無益於時則官不及其身也將以官課材材以官爲驗是故世俗常高文吏賤下儒生儒生之下文吏之高本由不能之將世俗之論縁將好惡今世之將材高知深通逹衆凡舉綱持領事無不定其置文吏也備數滿貟足以輔己志志在修德務在立化則夫文吏瓦石儒生珠玉也夫文吏能破堅理煩不能守身身則亦不能輔將儒生不習於職長於匡救將相傾側諫難不懼案世間能建蹇蹇之節成三諫之議令將檢身自勑不敢邪曲者率多儒生阿意茍取容幸將欲放失低嘿不言者率多文吏文吏以事勝以忠負儒生以節優以職劣二者長短各有所宜世之將相各有所取取儒生者必軌德立化者也取文吏者必優事理亂者也材不自能則湏助湏助則待勁官之立佐爲力不足也吏之取能爲材不及也日之照幽不湏燈燭賁育當敵不待輔佐使將相知力若日之照幽賁育之難敵則文吏之能無所用也病作而醫用禍起而巫使如自能案方和藥入室求祟則醫不售而巫不進矣橋梁之設也足不能越溝也車馬之用也走不能追遠也足能越溝走能追遠則橋梁不設車馬不用矣天地事物}
