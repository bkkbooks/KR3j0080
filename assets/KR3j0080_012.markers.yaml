  - {type: variant, offset: 1230, length: 222, content: 語曰大哉堯之為君唯天為大唯堯則之王者則天不違奉天之義也推自然之性與天合同是則所謂大命文王也自文王意文王自為非天驅赤雀使告文王云當為王乃敢起也然則文王赤雀及武王白魚非天之命昌熾祐也吉人舉事無不利者人徒不召而至瑞物不招而來黯然諧合若或使之出門聞吉顧睨見善自然道也文王當興赤雀適來魚躍烏飛武王偶見非天使雀至白魚來也吉物動飛而聖遇也白魚入于王舟王陽曰偶適也光祿大夫劉琨前為弘農太守虎渡河光武皇帝曰偶適自然非或使之也故夫王陽之言適光武之曰偶可謂合於自然也, SBCK: 衡卷第十二}
