  - {type: variant, offset: 29, length: 0, content: '', SBCK: 幾年而至於秦桀亡夏而紂棄殷滅周者何王也周猶爲遠秦則漢之所伐也夏始於禹殷本於湯周祖后稷秦初爲人者誰秦燔五經坑殺儒士五經之家所共聞也秦何起而燔五經何感而坑儒生秦則前代也漢國自儒生之家也從高祖至今朝幾世歷年訖今幾載初受何命復獲何瑞}
