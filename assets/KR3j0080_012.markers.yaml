  - {type: variant, offset: 1023, length: 206, content: 天乃大命文王所謂大命者非天乃命文王也聖人動作天命之意也與天合同若天使之矣書方激勸康叔勉使為善故言文王行道上聞於天天乃大命之也詩曰乃眷西顧此惟予度與此同義天無頭面眷顧如何人有顧睨以人傚天事易見故曰眷顧天乃大命文王眷顧之義實天不命也何以驗之夫大人與天地合其德與日月合其明與四時合其序與鬼神合其吉凶先天而天不違後天而奉天時如必須天有命乃以從事安得先天而後天乎以其不待天命直以心發故有先天後天之勤言合天時故有不違奉天之文, SBCK: ''}
