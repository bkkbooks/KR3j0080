  - {type: variant, offset: 544, length: 0, content: '', SBCK: 無餘禮也問春秋家曰孔子作春秋周何王時也自衛反魯然後樂正春秋作矣自衛反魯哀公時也自衛何君也俟孔子以何禮而孔子反魯作春秋乎孔子録史記以作春秋史記本名春秋乎制作以爲經乃歸春秋也法律之家亦爲儒生問曰九章誰所作也彼聞臯陶作獄必將曰臯陶也詰曰臯陶唐虞時唐虞之刑五刑案今律無五刑之文或曰蕭何也詰曰蕭何高祖時也孝文之時齊太倉令淳于德有罪徴詣長安其女緹縈爲父上書言肉刑壹施不得改悔文帝痛其言乃改肉刑案今九章象刑非􅁏刑也文帝在蕭何後知時􅁏刑也蕭何所造反具􅁏刑也而云九章蕭何所造乎古禮三百威儀三千刑亦正刑三百科條三千出於禮入於刑禮之所去刑之所取故其多少同一數也今禮經十六蕭何律有九章不相應又何五經題篇皆以事義别之至禮與律獨經也題之禮言昏禮律言盗律何夫揔問儒生以古今之義儒生不能知别名以其經事問之又不能曉斯則坐守何言師法不頗博覽之咎也文吏自}
