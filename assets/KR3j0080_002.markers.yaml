  - {type: variant, offset: 94, length: 3, content: 被累害, SBCK: 天五月丙午日中之時消錬五石鑄以爲器磨礪生光仰以嚮日則火來至此眞取火之道也今妄以刀劒之鉤月摩拭朗白仰以嚮日亦得火焉夫鉤月非陽遂也所以耐取火}
