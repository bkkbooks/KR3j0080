  - {type: variant, offset: 19, length: 0, content: '', SBCK: 活不傷火燔野草車轢所致火所不燔俗或喜之名曰幸草夫足所不蹈火所不及未必善也舉火行有適然也由是以論癕疽之發亦一實也氣結閼積聚爲癕潰爲疽創流血出膿豈癕疽所發身之善穴哉營衞之行遇不通也蜘蛛結網蜚蟲過之或脫或獲獵者張羅百獸群擾或得或失漁者罾江湖之魚或存或亡或姧盜大辟而不知或罰贖小}
