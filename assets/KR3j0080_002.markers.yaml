  - {type: variant, offset: 1203, length: 0, content: '', krp: 祚后稷之時履大人跡或言衣帝嚳之服坐息帝嚳之處姙身怪而棄之隘巷牛馬不敢踐之寘之冰上鳥以翼覆之慶集其身母知其神怪乃収養之長大佐堯位至司馬烏孫王號昆莫匈奴攻殺其父而昆莫生棄於野烏㗸肉往食之單于怪之以爲神而収長及壯使兵數有功單于乃復以其父之民予昆莫命令長守於西城夫后稷不當棄故牛馬不踐鳥以羽翼覆愛其身昆莫不當死故烏㘅肉就而食之北夷橐離國王侍婢有娠王欲殺之婢對曰有氣大如雞子從天而下我故有娠後産子捐於猪溷中猪以口氣嘘之不死復徙置馬欄中欲使馬藉殺之馬復以口氣噓之不死王疑以爲天子令其母収取奴畜之名東明令牧牛馬東明善射王恐奪其國也欲殺之東明走南至掩淲水以弓擊水魚鼈浮爲橋東明得渡魚鼈解散追兵不得渡因都王夫餘故北夷有夫餘國焉東明之母初姙時見氣從天下及生棄之猪馬以氣吁之而生之長大王欲殺之以弓擊水魚鼈爲橋天命不當死故有猪馬之救命當都王夫餘故有魚鼈爲橋之助也伊尹且生之時其母夢人謂己曰臼出水疾東走母顧明旦視臼出水即東走}
