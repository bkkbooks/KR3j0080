  - {type: variant, offset: 91, length: 2, content: 歸責, SBCK: 知病之名而坐觀之何以爲竒夫人有不善則乃性命之疾也無其教治而欲令變更豈不難哉天道有真僞真者固自與天相應僞者人加知巧亦與眞者無以異也何以驗之禹貢曰璆琳琅玕者此則土地所生真玉珠也然而道人消爍五石作五色之玉比之眞玉光不殊别兼魚蚌之珠與禹貢璆琳皆眞玉珠也然而隨侯以藥作珠精耀如眞道士之教至知巧之意加也陽遂取火}
