  - {type: variant, offset: 64, length: 0, content: '', krp: 而歷陽之都男女俱没長平之坈老少並䧟萬數之中必有長命未當死之人遭時衰微兵革並起不得終其壽人命有長短時有盛衰衰則疾病被災蒙禍之驗也宋衞陳鄭同日並災四國之民必有禄盛未當衰之人然而俱災國禍陵之也故國命勝人命壽命勝禄命人有壽夭之相亦有貧冨貴賤之法俱見於體故壽命脩短皆禀於天骨法善惡皆見於體命當夭折雖禀異行終不得長禄當貧賤雖有善性終不得遂項羽且死顧謂其徒曰吾敗乃命非用兵之過此言實也實者項羽用兵過於髙祖髙祖之起有天命焉國命繫於衆星列宿吉凶國有福禍衆星推移人有盛衰人之有吉凶猶嵗之有豐耗命有衰盛物有貴賤一嵗之中一貴一賤一壽之間一衰一盛物之貴賤不在豐耗人之衰盛不在賢愚子夏曰死}
  - {type: variant, offset: 65, length: 1, content: 動, SBCK: 有命冨貴在天而不曰死生在天冨貴有命者何則死生者無象在天以性爲主禀得堅彊之性則氣渥厚而體堅彊堅彊則壽命長壽命長則不夭死禀性軟弱者氣少泊而性羸窳羸窳則壽命短短則蚤死故言有命命則性也至於冨貴所禀猶性所禀之氣得衆星之精衆星在天天有其象得冨貴象則冨貴得貧賤象則貧賤故曰在天在天如何天有百官有衆星天施氣而衆星布精天所施氣衆星之氣在其中矣人禀氣而生含氣而長得貴則貴得賤則賤貴或秩有髙下冨或貲有多少皆星位尊卑小大之所授也故天有百官天有衆星地有萬民五帝三王之精天有王梁造父人亦有之禀受其氣故巧於御傳曰說命有三一曰正命二曰隨命三曰遭命正命謂本禀之自得吉也性然骨善故不假操行以求福而吉自至故曰正命隨命者戮力操行而吉福至縱情施欲而凶禍到故曰隨命遭命者行善得惡非所冀望逢遭於外而得凶禍故曰遭命凢人受命在父母施氣之時已得吉凶矣夫性與命異或性善而命凶或性惡而命吉操行善惡者性也禍福吉凶者命也或行善而得禍是性善而命凶或行惡而得福是性惡而命吉也性自有善惡命自有吉凶使命吉之人雖不行善未必無福凶命之人雖勉操行未必無禍孟子曰求之有道得之有命性善乃能求之命善乃能得之性善命凶求之不能得也行惡者禍隨而至而盗跖莊蹻横行天下聚黨數千攻奪人物㫁斬人身無道甚矣冝遇其禍乃以壽終夫如是隨命之說安所驗乎遭命者行善於内遭凶於外也若顔淵伯牛之徒謂乎字一有何如何遭凶顔淵伯牛行善者也當得隨命福祐隨至何故遭凶顔淵困於學以才自殺伯牛空居而遭惡疾及屈平伍貟之徒盡忠輔上竭王臣之節而楚放其身吳烹其尸行善當得隨命之福乃觸遭命之禍何哉言隨命則無遭命言遭命則無隨命儒者三命之􅀃竟何所定且命在初生骨表著見今言隨操行而至此命在末不在本也則冨貴貧賤皆在初禀之時不在長大之後隨操行而至也正命者至百而死隨命者五十而死遭命者初禀氣時遭凶惡也謂姙娠之時遭得惡也或遭雷雨之變長大夭死此謂三命亦有三性有正有隨有遭正者禀五常之性也隨者隨父母之性遭者遭得惡物象之故也故姙婦食兎子生缺脣月令曰是月也雷將發聲有不戒其容者生子不備必有大凶瘖聾跛盲氣遭胎傷故受性狂悖羊舌似我初生之時聲似豺狼長大性惡被禍而死在母身時遭受此性丹朱商均}
