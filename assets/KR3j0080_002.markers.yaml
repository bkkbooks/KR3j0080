  - {type: variant, offset: 1175, length: 3, content: 惡來所, SBCK: 韋􅁌附身成爲完具之人能納韋􅁌之教補接不足則豹安于之名可得參也貧劣宅屋不具墻壁宇達人指訾之如財貨冨愈起屋築墻}
  - {type: variant, offset: 1175, length: 3, content: 惡來所, WYG: 収長及壯使兵數有功單于乃復以其父之民予昆莫命令長守於西城夫后稷不當棄故牛馬不踐鳥以羽翼覆愛其身昆莫不當死故鳥銜肉就而食之北夷橐離國王侍婢有娠王欲殺之婢對曰有氣大如雞子從天而下我故有娠後産子捐於猪溷中猪以口氣嘘之不死復徙置馬欄中欲使馬藉殺之馬復以口氣噓之不死王疑}
  - {type: page-break, offset: 1175, content: '', id: KR3j0080_WYG_002-23b, image: WYG0862/WYG0862-0027d.png}
  - {type: variant, offset: 1175, length: 3, content: 惡來所, krp: 韋弦附身成爲完具之人能納韋弦之教補接不足則豹安于之名可得參也貧劣宅屋不具墻壁宇達人指訾之如財貨冨愈起屋築墻}
  - {type: variant, offset: 1179, length: 3, content: 為金玉, SBCK: 自蔽鄣爲之具宅人弗復非魏之行田百畒鄴獨二百西門豹灌以漳水成爲膏腴則畒收一鍾夫人之質猶鄴田道教猶漳水}
