  - {type: variant, offset: 1266, length: 1, content: 惡, SBCK: 難桓公爲公子與子糾爭立管仲輔子糾鮑叔佐桓公管仲與桓公爭引弓射之中其帶鉤夫人身長七尺帶約其要鉤挂於帶在身所掩不過一寸之内既微小難中又滑澤銛靡鋒刃中鉤者莫不蹉跌管仲射之正中其鉤中矢觸因落不跌中旁肉命當冨貴有神靈之助故有射鉤不中之驗楚共王有五子子招子圉子干子晳棄疾五人皆有寵共王無適立乃望祭山川請神決之乃與巴姬埋璧於太室之庭令五子齊而入拜康王跨之子圉肘加焉子干子晳皆遠之棄疾弱抱而入再拜皆􅎹紐故共王死招爲康王至子失之圉爲靈王及身而弑子干爲王十有餘日子晳不立又俱誅死皆絶無後棄疾後立竟續楚祀如其神符其王日之長短與拜去璧遠近相應也夫璧在地中五子不知相隨入拜遠近不同􅎹紐若神將教跽之矣晉屠岸賈作難誅趙盾之子朔死其妻有遺腹子及岸賈聞之索於宫母置兒於袴中祝曰趙氏宗滅乎若當啼即}
  - {type: page-break, offset: 1266, content: '', id: KR3j0080_SBCK_002-20b}
