  - {type: variant, offset: 1395, length: 319, content: 將不聞惡故顯用之夫如是世俗之所謂賢潔者未必非惡所謂邪污者未必非善也或曰言有招患行有召恥所在常由小人夫小人性患恥者也含邪而生懷偽而遊沐浴累害之中何招召之有故夫火生者不傷濕水居者無溺患火不苦熱水不痛寒氣性自然焉召招之君子也以忠言招患以高行招恥何世不然然而太山之惡君子不得名毛髮之善小人不得有也以玷污言之清受塵而白取垢以毀謗言之貞良見妬高奇見噪以遇罪言之忠言招患高行招恥以不純言之玉有瑕而珠有毀焦陳留君兄名稱兗州行完跡潔無纖芥之毀及其當為從事刺史焦康絀而不用夫未進也被三累已用也蒙三害雖孔丘墨翟不能自免顏回曾參不能全身也何則眾好純譽之人非真賢也公侯已下玉石雜糅賢士之行善惡相苞夫采玉者破石拔玉選士者棄惡取善夫如是累害之人負世以行指擊之者從何往哉, SBCK: 驗乎論衡卷第二}
  - {type: variant, offset: 1395, length: 319, content: 將不聞惡故顯用之夫如是世俗之所謂賢潔者未必非惡所謂邪污者未必非善也或曰言有招患行有召恥所在常由小人夫小人性患恥者也含邪而生懷偽而遊沐浴累害之中何招召之有故夫火生者不傷濕水居者無溺患火不苦熱水不痛寒氣性自然焉召招之君子也以忠言招患以高行招恥何世不然然而太山之惡君子不得名毛髮之善小人不得有也以玷污言之清受塵而白取垢以毀謗言之貞良見妬高奇見噪以遇罪言之忠言招患高行招恥以不純言之玉有瑕而珠有毀焦陳留君兄名稱兗州行完跡潔無纖芥之毀及其當為從事刺史焦康絀而不用夫未進也被三累已用也蒙三害雖孔丘墨翟不能自免顏回曾參不能全身也何則眾好純譽之人非真賢也公侯已下玉石雜糅賢士之行善惡相苞夫采玉者破石拔玉選士者棄惡取善夫如是累害之人負世以行指擊之者從何往哉, WYG: 驗乎論衡卷二}
