  - {type: variant, offset: 1191, length: 6, content: 心知惑蔽蔽惑, WYG: 伊尹且生之時其母夢人謂己曰臼出水疾東走母顧明旦視臼出水即東走十里顧其鄉皆為水矣伊尹命}
