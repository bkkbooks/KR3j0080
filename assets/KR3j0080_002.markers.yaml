  - {type: variant, offset: 1183, length: 14, content: 非紂憎聖而好惡也心知惑蔽蔽惑, SBCK: 患}
  - {type: variant, offset: 1183, length: 4, content: 非紂憎聖, WYG: 欲殺之東明走南至掩淲水以弓擊水魚鼈浮為橋東明得渡魚鼈解散追兵不得渡因都王夫餘故北夷有夫餘國焉東明之母初姙時見氣從天下及生棄之猪馬以氣吁之}
  - {type: variant, offset: 1183, length: 14, content: 非紂憎聖而好惡也心知惑蔽蔽惑, krp: 患}
  - {type: variant, offset: 1188, length: 2, content: 好惡, WYG: 生之長大王欲殺之以弓擊水魚鼈為橋天命不當死故有猪馬之救命當都王夫餘故有魚鼈為橋之助}
