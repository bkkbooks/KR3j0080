  - {type: variant, offset: 1387, length: 1, content: 世, SBCK: 毋多言是嵗有禾生景天備火中三本一莖九穗長於禾一二尺蓋嘉禾也元帝之初有鳳凰下濟陽宫訖字一有故今濟陽宫有鳳凰廬始與李父等俱起到柴界中遇賊兵惶惑走濟陽舊廬比到見光若火正赤在舊廬道南光耀憧憧上屬天有頃}
