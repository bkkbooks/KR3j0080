  - {type: variant, offset: 20, length: 0, content: '', SBCK: 而發覺災氣加人亦此類也不幸遭觸而死幸者免脫而生不幸者不徼幸也孔子曰人之生也直㒺之生也幸則夫順道而觸者爲不幸矣立巖墻之下爲壊所壓蹈􅜌岸之上爲崩所墜輕遇無端故爲不幸魯城門乆朽欲頓孔子}
  - {type: variant, offset: 20, length: 0, content: '', WYG: 而發覺災氣加人亦此類也不幸遭觸而死幸者免脱而生不幸者不徼幸也孔子曰人之生也直㒺之生也幸則夫順道而觸者為不幸矣立巖牆之下為壊所壓蹈􅜌岸之上為崩所墜輕遇無端故為不幸魯城門久朽欲頓孔子}
