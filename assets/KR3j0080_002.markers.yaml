  - {type: variant, offset: 68, length: 1, content: 咸, WYG: 是也性命在本故禮有胎教之法子在身時席不正不坐割不正不食非正色目不視非正聲耳不聽及長置以賢師良傅教君臣父子之道賢不肖在此時矣受氣時母不謹慎心妄慮邪則子長大狂悖不善形體醜惡素女對黄帝陳五女之法非徒傷父母之身乃又賊男女之性人有命有禄有遭遇有幸偶命者貧富貴賤也禄者盛衰興廢也以命當富貴遭當盛之禄常安不危以命當貧賤遇當衰之禄則禍殃乃至常苦不樂遭者遭逢非常之變若成湯囚夏臺文王厄羑里矣以聖明之徳而有囚厄之變可謂遭矣變雖甚大命善禄盛變不為害故稱遭逢之禍晏子所遭可謂大矣直兵指胷白刃加頸蹈死亡之地當劍㦸之鋒執死得生還命善禄盛遭逢之禍不能害也歴陽之都長平之坑其中必有命善禄盛之人一宿同填而死遭逢之禍大命善禄盛不能卻也譬猶水火相更也水盛勝火火盛勝水遇其主而用也雖有善命盛禄不遇知己之主不得效驗幸者謂所遭觸得善惡也獲罪得脱幸也無罪見拘不幸也執拘未久蒙令得出命善禄盛夭災之禍不能傷也偶也謂事君也以道事君君善其言遂用其身偶也行與主乖退而遠不偶也退遠未久上官録召命善禄盛不偶之害不能留也故夫遭遇幸偶或與命禄并或與命離遭遇幸偶遂以成完遭遇不幸偶遂以敗傷是與命并者也中不遂成善轉為惡若是與命禄離者也故人之在世有吉凶之性命有盛衰之禍福重以遭遇幸偶之逢獲從生死而卒其善惡之行得其胷中之志希矣無形篇人禀元氣於天各受夀夭之命以立長短之形猶陶者用土為簋廉冶者用銅為柈杆矣器形已成不可小大人體已定不可減増用氣為性性成命定體氣與形骸相抱生死與期節相須形不可變化命不可減加以陶冶言之人命短長可得論也或難曰陶者用埴為簋廉簋廉壹成遂至毁敗不可復變若夫冶者用銅為柈杅柈杅雖已成器猶可復爍柈可得為尊尊亦可為簋人禀氣於天雖各受壽夭之命立以形體如得善道神藥形可變化命可加増曰冶者變更成器須先以火燔爍乃可大小短長人冀延年欲比於銅器宜有若爐炭之化乃易形形易壽亦可増人何由變易其形便如火爍銅器乎禮曰水潦降不獻魚鼈何則雨水暴下蟲虵變化化為魚鼈離本真暫變之蟲臣子謹慎故不敢獻人願身之變冀若蟲虵之化乎夫蟲虵未化者不若不化者蟲虵未化人不食也化為魚鼈人則食之一有見字食則壽命乃短非所冀也嵗月推移氣變物類蝦蟇為鶉雀為蜄蛤人願身之變冀若鶉與蜄蛤魚鼈之類也人設捕蜄蛤得者食之雖身之不化壽命不得長非所冀也魯人牛哀寢疾七日變而成虎鯀殛羽山化為黄能能音奴來反願身變者冀牛哀之為虎鯀之為能乎則夫虎能之壽不能過人天地之性人最為貴變人之形更為禽獸非所冀也凡可冀者以老翁變為嬰兒其次白髪復黒齒落復生身氣丁彊超乗不衰乃可貴也徒變其形壽命不延其何益哉且物之變隨氣若應政治有所象為非天所欲壽長之故變易其形也又非得神草珍藥食之而變化也人恒服藥固壽能増加本性益其身年也遭時變化非天之正氣人所受之真性也天地不變日月不易星辰不没正也人受正氣故體不變時或男化為女女化為男猶髙岸為谷深谷為陵也應政為變為政變非常性也漢興老父授張良書已化為石是以石之精為漢興之瑞也猶河精為人持璧與秦使者秦亡之徵也蠶食桑老績而為蠒蠒又化而為蛾蛾有兩翼變去蠶形蠐螬化為復育復育轉而為蟬蟬生兩翼不類蠐螬凡諸命蠕蜚之類多變其形易其體至人獨不變者禀得正也生為嬰兒長為丈夫老為父翁從生至死未嘗變更者天性然也天性不變者不可令復變變者不可不變若夫變者之壽不若不變者人欲變其形輒増益其年可也如徒變其形而年不増則蟬之類也何謂人願之龍之為蟲一存一亡一短一長龍之為性也變化斯須輒復非常由此言之人物也受不變之形不可變更年不可增減傳稱髙宗有桑穀之異悔過反政享福百年是虚也傳言宋景公出三善言熒惑卻三舍延年二十一載是又虛也又言秦繆公有明徳上帝賜之十九年是又虛也稱赤松王喬好道為仙度世不死是又虛也假令人生立形謂之甲終老至死常守甲形如好道為仙未有使甲變為乙者也夫形不可變更年不可減増何則形氣性天也形為春氣為夏人以氣為夀形隨氣而動氣性不均則於體不同牛壽半馬馬壽半人然則牛馬之形與人異矣稟牛馬之形當自得牛馬之壽牛馬之不變為人則年壽亦短於人世稱髙宗之徒不言其身形變異而徒言其増延年壽故有信矣形之血氣也猶囊之貯粟米也一石囊之髙大亦適一石如損益粟米囊亦増減人以氣為壽氣猶粟米形猶囊也増減其壽亦當増減其身形安得如故如以人形與囊異氣與粟米殊更以苞瓜喻之苞瓜之汁猶人之血也其肌猶肉也試令人損益苞瓜之汁令其形如故耐為之乎人不耐損益苞瓜之汁天安耐増減人之年人年不可増減髙宗之徒誰益之者而云増加如言髙宗之徒形體變易其年亦増乃可信也今言年増不言其體變未可信也何則人禀氣於天氣成而形立則命相須以至終死形不可變化年亦不可増加以何驗之人生能行死則僵仆死則氣減形消而壊稟生人形不可得變其年安可増人生至老身變者髮與膚也人少則髪黒老則髪白白久則黄髮之變形非變也人少則膚白老則膚黒黒久則黯若有垢矣髮黄而膚為垢故禮曰黄耉無疆髪變異故人老壽遲死骨肉不可變更壽極則死矣五行之物可變改者唯土也埏以為馬變以為人是謂未入陶竈更火者也如使成器入竈更火牢堅不可復變今人以為天地所陶冶矣形已成定何可復更也圖仙人之形體生毛臂變為翼行於雲則年増矣千嵗不死此虛圖也世有虛語亦有虛圖假使之然蟬娥之類非真正人也海外三十五國有毛民羽民羽則翼矣毛羽之民土形所出非言為道身生毛羽也禹益見西王母不言有毛羽不死之民亦在外國不言有毛羽毛羽之民不言不死不死之民不言毛羽毛羽未可以效不死仙人之有翼安足以驗長壽乎率性篇論人之性定有善有惡其善者固自善矣其惡者故可教告率勉使之為善凡人君父審觀臣子之性善則養育勸率無令近惡近惡則輔保禁防令漸於善善漸於惡惡化於善成為性行召公戒成王曰今王初服厥命於戯若生子㒺不在厥初生生子謂十五子初生意於善終以善初生意於惡終以惡詩曰彼姝者子何以與之傳言譬猶練絲染之藍則青染之丹則赤十五之子其猶絲也其有所漸化為善惡猶藍丹之染練絲使之為青赤也青赤一成真色無異是故楊子哭歧道墨子哭練絲也盖傷離本不可復變也人之性善可變為惡惡可變為善猶此類也蓬生麻間不扶自直白紗入緇不練自黒彼蓬之性不直紗之質不黒麻扶緇染使之直黑夫人之性猶蓬紗也在所漸染而善惡變矣王良造父稱為善御不能使不良為良也如徒能御良其不良者不能馴服此則駔工庸師服馴技能何竒而世稱之故曰王良登車馬不罷駑堯舜為政民無狂愚傳曰堯舜之民可比屋而封桀紂之民可比屋而誅斯民也三代所以直道而行也聖主之民如彼惡主之民如此竟在化不在性也聞伯夷之風者貪夫廉而懦夫有立志聞栁下惠之風者薄夫敦而鄙夫寛徒聞風名猶或變節况親接形面相敦告乎孔門弟子七十之徒皆任卿相之用}
