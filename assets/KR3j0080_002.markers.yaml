  - {type: variant, offset: 1201, length: 1, content: 微, SBCK: 若彼後則若此由此言之亦在於敎不獨在性也吉驗篇凢人禀貴命於天必有吉驗見於地見於地故有天命也驗見非一或以人物或以禎祥或以光氣傳言黄帝姙二十月而生生而神靈弱而能言長大率諸侯諸侯歸之教熊羆戰以伐炎帝炎帝敗績性與人異故在母之身留多十月命當爲帝故能教物物爲之使堯體就之如日望之若雲洪水滔天虵龍爲害堯使禹治水驅虵龍水治東流虵龍潜處有殊竒之骨故有詭異之驗有神靈之命故有驗物之效天命當貴故從唐侯入嗣帝后之位舜未逢堯鰥在側陋􅎩瞍與象謀欲殺之使之完廩火燔其下令之浚井土掩其上舜得下廩不被火災穿井旁出不觸土害故字一有堯聞徵用試之於職官治職脩事無廢亂使入大麓之野虎狼不搏蝮虵不噬逢烈風疾雨行不迷惑夫人欲殺之不能害之毒螫之野禽蟲不能傷卒受帝命踐天}
