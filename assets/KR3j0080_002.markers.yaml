  - {type: variant, offset: 18, length: 0, content: '', SBCK: 幸俱欲納忠或賞或罰並欲有益或信或疑賞而信者未必眞罰而疑者未必僞賞信者偶罰疑不偶也孔子門徒七十有餘顔回蚤夭孔子曰不幸短命死矣短命稱不幸則知長命者幸也短命者不幸也服聖賢之道講仁義之業冝蒙福祐伯牛有疾亦復顔回之類俱不幸也螻蟻行於地人舉足而涉之足所履螻蟻苲死足所不蹈}
