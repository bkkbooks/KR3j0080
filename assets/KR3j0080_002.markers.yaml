  - {type: variant, offset: 926, length: 237, content: 佞是故濕堂不灑塵卑屋不蔽風風衝之物不得育水湍之岸不得峭夫如是牖里陳蔡可得知而沉江蹈河可得曉也以軼才取容媚於俗求全功名於將不遭鄧析之禍取子胥之誅幸矣孟賁之尸人不刃者氣絕也死灰百斛人不沃者光滅也動身章彰智顯光氣於世奮志敖黨立卓異於俗固常通人所讒嫉也以方心偶遇俗之累求益反損蓋孔子所以憂心孟軻所以惆悵也德鴻者招謗為士者多口以休熾之聲彌口舌之患求無危傾之害遠矣臧倉之毀未嘗絕也公伯寮之遡未嘗滅也垤成丘山汙為江河矣夫如是市虎之訛投杼之誤不足怪則玉變為石珠化為礫不足詭也何則昧心冥冥之知, SBCK: 少}
