  - {type: variant, offset: 1390, length: 4, content: 短故共稱, SBCK: 王莽時謁者蘇伯阿能望氣使過春陵城郭鬱鬱葱葱及光武到河北與伯阿見問曰卿前過春陵何用知其氣佳也伯阿對曰見其鬱鬱葱葱耳蓋天命當興聖王當出前後氣驗照察明著繼體守文因據前基禀天光氣驗不足言創業龍興由微賤起於顛沛若髙祖光武者曷甞無天人神怪光顯}
