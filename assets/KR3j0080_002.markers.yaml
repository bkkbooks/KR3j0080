  - {type: variant, offset: 739, length: 186, content: 偉士坐以俊傑之才招致群吠之聲夫如是豈宜更勉奴下循不肖哉不肖奴下非所勉也豈宜更偶俗全身以弭謗哉偶俗全身則鄉原也鄉原之人行全無闕非之無舉刺之無刺也此又孔子之所罪孟軻之所愆也古賢美極無以衛身故循性行以俊累害者果賢潔之人也極累害之謗而賢潔之實見焉立賢潔之跡毀謗之塵安得不生絃者思折伯牙之指御者願摧王良之手何則欲專良善之名惡彼之勝己也是故魏女色艷鄭袖劓之朝吳忠貞無忌逐之戚施彌妬蘧除, SBCK: 麴孽}
