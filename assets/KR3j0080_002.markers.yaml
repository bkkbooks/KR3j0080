  - {type: variant, offset: 1269, length: 0, content: '', SBCK: 若無聲及索之而終不啼遂脫得活程嬰齊負之匿於山中至景公時韓厥言於景公景公乃與韓厥共立趙􅀌續趙氏祀是爲文子}
  - {type: variant, offset: 1269, length: 0, content: '', WYG: 若無聲及索之而終不啼遂脱得活程嬰齊負之匿於山中至景公時韓厥言於景公景公乃與韓厥共立趙孤續趙氏祀是為文子}
  - {type: variant, offset: 1269, length: 0, content: '', krp: 若無聲及索之而終不啼遂脫得活程嬰齊負之匿於山中至景公時韓厥言於景公景公乃與韓厥共立趙孤續趙氏祀是爲文子}
  - {type: variant, offset: 1270, length: 1, content: 夏, SBCK: 趙􅀌之無聲若有掩其口者矣由此言之趙文子立命也髙皇帝母曰劉媪甞息大澤之陂夢與神遇是時雷電晦冥蛟龍在上及生而有美質字一有性好用酒甞從王媪武􅀒貰酒飲醉止卧媪􅀒見其身常有神怪毎留飲醉酒售數倍後行澤中手斬大虵一嫗當道而哭云赤帝子殺吾子此驗既著聞矣秦始皇帝常曰東南有天子氣於是東遊以厭當之髙祖之氣也與吕后隱於芒碭山澤間吕后與人求之見其上常有氣直起徃求輒得其處後與項羽約先入秦􅀜王之髙祖先至項羽怨恨范増曰吾令人望其氣氣皆爲龍成五采此皆天子之氣也急擊之髙祖徃謝項羽羽與亞父謀殺髙祖使項莊抜劒起舞項伯知之因與項莊俱起毎劒加髙祖之上項伯輙以身覆髙祖之身劒遂}
