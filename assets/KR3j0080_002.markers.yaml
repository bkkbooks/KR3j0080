  - {type: variant, offset: 183, length: 2, content: 累害, SBCK: 迹庶幾可見有癡狂之疾歌啼於路不曉東西不睹燥濕不覺疾病不知飢飽性已毁傷不可如何前無所觀郤無所畏也是故王法不廢學校之官不除獄理之吏欲令凡衆見禮義之教學校勉其前法禁防其後使丹朱之志亦將可勉何以驗之三軍之士非能制也勇將率勉視死如歸且闔廬甞試其士於五湖之側皆加刃於肩血流至地句踐亦試其士於寢宫之庭赴火死者不可勝數夫刃火非人性之所貪也二主激率念不顧生是故軍之法輕刺血孟賁勇也聞軍令懼是故叔孫通制定禮儀拔劒爭功之臣奉禮拜伏初驕倨而後遜順教威徳變易性也不患性惡患其不服聖教自遇而以生禍也豆麥之種}
  - {type: page-break, offset: 183, content: '', id: KR3j0080_SBCK_002-17a}
