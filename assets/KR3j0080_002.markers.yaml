  - {type: variant, offset: 1167, length: 3, content: 文王所, SBCK: 是故酒之泊厚同一麴孽人之善惡共一元氣氣有少多故性有賢愚西門豹急佩韋}
  - {type: variant, offset: 1167, length: 1, content: 文, WYG: 是故酒之泊厚同一麴糵人之善惡共一元氣氣有少多故性有賢愚西門豹急佩韋以自緩董安于緩帶弦以自促急之與緩俱失中和然而韋弦附身成為完具之人能納韋弦之教補接不足則豹安于之名可得參也貧劣宅屋不具牆壁宇達人指訾之如財貨富愈起屋築牆以自蔽鄣為之具宅人弗復非魏之行田百畆鄴獨二百西門豹灌以漳水成為膏腴則畆収一鍾夫人之質猶鄴田道教猶漳水也患不能化不患人性之難率也雒陽城中之道無水水工激上洛中之水日夜馳流水工之功也由此言之迫近君子而仁義之道數加於身孟母之徙宅盖得其驗人間之水汚濁在野外者清潔俱為一水源從天涯或濁或清所在之勢使之然也南越}
  - {type: page-break, offset: 1167, content: '', id: KR3j0080_WYG_002-21a, image: WYG0862/WYG0862-0026c.png}
  - {type: page-break, offset: 1167, content: '', id: KR3j0080_WYG_002-21b, image: WYG0862/WYG0862-0026d.png}
  - {type: variant, offset: 1167, length: 3, content: 文王所, krp: 是故酒之泊厚同一麴孽人之善惡共一元氣氣有少多故性有賢愚西門豹急佩韋}
  - {type: variant, offset: 1169, length: 1, content: 所, WYG: 趙佗本漢賢人也化南夷之俗背畔王制椎髻箕坐好之若性陸賈説以漢徳懼以聖威蹶然起坐心覺改悔奉制稱藩其於椎髻箕坐也惡之若性前則若彼後則若此由此言之亦在於教不獨在性也吉驗篇凡人禀貴命於天必有吉驗見於地見於地故有天命也驗見非一或以人物或以禎祥或以光氣傳言黄帝姙二十月而生生而神靈弱而能言長大率諸侯諸侯歸之教熊羆戰以伐炎帝炎帝敗績性與人異故在母之身留多十月命當為帝故能教物物為之使堯體就之如日望之若雲洪水滔天虵龍為害堯使禹治水驅虵龍水治東流虵龍潛處有殊竒之骨故有詭異之驗有神靈之命故有驗物之效天命當貴故從唐侯入嗣帝后之位舜未逢堯鰥在側陋瞽瞍與象謀欲殺之使之完廩火燔其下令之浚井土掩其上舜得下廩不被火災穿井旁出不觸土害一有故字堯聞徵用試之於職官治職脩事無廢亂使入大麓之野虎狼不搏蝮虵不噬逢烈風疾雨行不迷惑夫人欲殺之不能害之毒螫之野禽蟲不能傷卒受帝命踐天子祚后稷之母履大人跡或言衣帝嚳之服坐息帝嚳之處姙身怪而棄之隘巷牛馬不敢踐之寘之冰上鳥以翼覆之慶集其身母知其神怪乃収養之長大佐堯位至司馬烏孫王號昆莫匈奴攻殺其父而昆莫生棄於野烏銜肉往食之單于怪之}
  - {type: page-break, offset: 1169, content: '', id: KR3j0080_WYG_002-22a, image: WYG0862/WYG0862-0027a.png}
