  - {type: variant, offset: 64, length: 0, content: '', SBCK: 而歷陽之都男女俱没長平之坈老少並䧟萬數之中必有長命未當死之人遭時衰微兵革並起不得終其壽人命有長短時有盛衰衰則疾病被災蒙禍之驗也宋衞陳鄭同日並災四國之民必有禄盛未當衰之人然而俱災國禍陵之也故國命勝人命壽命勝禄命人有壽夭之相亦有貧冨貴賤之法俱見於體故壽命脩短皆禀於天骨法善惡皆見於體命當夭折雖禀異行終不得長禄當貧賤雖有善性終不得遂項羽且死顧謂其徒曰吾敗乃命非用兵之過此言實也實者項羽用兵過於髙祖髙祖之起有天命焉國命繫於衆星列宿吉凶國有福禍衆星推移人有盛衰人之有吉凶猶嵗之有豐耗命有衰盛物有貴賤一嵗之中一貴一賤一壽之間一衰一盛物之貴賤不在豐耗人之衰盛不在賢愚子夏曰死}
  - {type: page-break, offset: 64, content: '', id: KR3j0080_SBCK_002-5a}
  - {type: variant, offset: 64, length: 0, content: '', WYG: 而歴陽之都男女俱没長平之坑老少並陷萬數之中必有長命未當死之人遭時衰微兵革並起不得終其夀人命有長短時有盛衰衰則疾病被災蒙禍之驗也宋衞陳鄭同日並災四國之民必有禄盛未當衰之人然而俱災國禍陵之也故國命勝人命夀命勝禄命人有夀夭之相亦有貧富貴賤之法俱見於體故夀命脩短皆禀於天骨法善惡皆見於體命當夭折雖禀異行終不得長禄當貧賤雖有善性終不得遂項羽且死顧謂其徒曰吾敗乃命非用兵之過此言實也實者項羽用兵過於髙祖髙祖之起有天命焉國命繫於衆星列宿吉凶國有禍福衆星推移人有盛衰人之有吉凶猶嵗之有豐耗命有衰盛物有貴賤一嵗之中一貴一賤一壽之間一衰一盛物之貴賤不在豐耗人之衰盛不在賢愚子夏曰死}
