  - {type: variant, offset: 22, length: 0, content: '', SBCK: 不幸而無有幸小人有幸而無不幸又曰君子處易以俟命小人行險以徼幸佞幸之徒閎藉孺之輩無徳薄才以色稱媚不冝愛而受寵不當親而得附非道理之宜故太史公爲之作傳邪人反道而受恩寵與此同科故合其名謂之佞幸無徳受恩無過遇禍同一實也俱禀元氣或獨爲人或爲禽獸並爲人或貴或賤或貧或富富或}
