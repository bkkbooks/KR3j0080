  - {type: variant, offset: 2139, length: 0, content: '', SBCK: 依􅀋也日中見斗幽不明也夜中星不見夜光明也事異義同蓋其實也其言與雨俱之集也夫辛卯之夜明故星不見明則不雨之驗也雨氣隂暗安得明明則無雨安得與雨俱夫如是言與雨俱者非實且言夜明不見安得見星與雨俱又僖公十六年正月戊申霣石于宋五左氏傳曰星也夫謂霣石爲星則謂霣爲石矣辛卯之夜星霣爲星則實爲石矣辛卯之夜星霣如是石地有樓臺樓臺崩壞}
  - {type: page-break, offset: 2139, content: '', id: KR3j0080_SBCK_011-18b}
