  - {type: variant, offset: 707, length: 600, content: 曰此婦人當大富貴為封侯者夫人次公止車審視之相者曰令此婦人不富貴卜書不用也次公問之乃其旁里人巫家子也即娶以為妻其後次公果大富貴位至丞相封為列侯夫次公富貴婦人當配之故果相遇遂俱富貴使次公命賤不得婦人為偶不宜為夫婦之時則有二夫趙王之禍夫舉家皆有富貴之命然後乃任富貴之事骨法形體有不應者則必別離死亡不得久享介福故富貴之家役使奴僮育養牛馬必有與眾不同者矣僮奴則有不死亡之相牛馬則有數字乳之性田則有種孳速熟之穀商則有居善疾售之貨是故知命之人見富貴於貧賤睹貧賤於富貴案骨節之法察皮膚之理以審人之性命無不應者趙簡子使姑布子卿相諸子莫吉至翟婢之子無恤而以為貴無恤最賢又有貴相簡子後廢太子而立無恤卒為諸侯襄子是矣相工相黥布當先刑而乃王後竟被刑乃封王衛青父鄭季與楊信公主家僮衛媼通生青在建章宮時鉗徒相之曰貴至封侯青曰人奴之道得不笞罵足矣安敢望封侯其後青為軍吏戰數有功超封增官遂為大將軍封為萬戶侯周亞夫未封侯之時許負相之曰君後三歲而侯侯入歲為將相持國秉貴重矣於人臣無兩其後九歲而君餓死亞夫笑曰臣之兄已代父侯矣有如父卒子當代亞夫何說侯乎然既已貴如負言又何說餓死指示我許負指其口曰有縱理入口曰此餓死法也居三歲其兄絳侯勝之有罪文帝擇絳侯子賢者皆推亞夫迺封條侯續絳侯後文帝之後六年匈奴大入邊乃以亞夫為將軍至景帝之時亞夫為丞相後以疾免其子為亞夫買工官尚方甲盾五百被可以為葬者取庸苦之不與錢庸知其盜買官器怨而上告其子景帝下吏責問因不食五, SBCK: 光}
