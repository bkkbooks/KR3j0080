  - {type: variant, offset: 2154, length: 0, content: '', SBCK: 共事然後危人其危人也非毁之而其害人也非泊之譽而危之故人不知厚而害之故人不疑是故佞人危而不怨害人之敗而不仇隱情匿意爲之功也如毁人人亦毁之衆不親士不附也安能得容世取利於上問曰佞人不毁人於世間毁人於將前乎曰佞人以人欺將不毁人於將然則佞人奈何曰佞人毁人譽之危人安之毁危奈何假令甲有高行竒知名聲顯聞將恐人君召問扶而勝巳欲故癈不言常騰譽之薦之者衆將議欲用問人人必不對曰甲賢而宜召也何則甲意不欲留縣前聞其語矣聲望欲入府在郡則望欲入州志髙則操與人異望遠則意不顧近屈而用之其心不滿不則卧病賤而命之則傷賢不則損威故人君所以}
