  - {type: variant, offset: 2115, length: 1, content: 鄭, SBCK: 天之去地六萬餘里髙遠非直泰山之巓也星著於天人察之失星之實非直望鶴烏之􅀋也數等星之質百里體大光盛故能垂耀人望見之若鳯卵之狀遠失其實也如星霣審者天之星霣而至地}
