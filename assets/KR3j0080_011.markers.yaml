  - {type: variant, offset: 2162, length: 0, content: '', SBCK: 懷貪利之心輕禍重身傾死爲僇矣何名之養義廢德壞操行隨辱何云作髙問曰大佞易知乎小佞易知也曰大佞易知小佞難知何則大佞材高其迹易察小佞知下其效難省何以明之成事小盗難覺大盗易知也攻城襲邑剽刼虜掠發則事覺道路皆知盗也穿鑿垣墻狸歩䑕竊莫知謂誰曰大佞姦深惑亂其人如大盗易知人君何難書曰知人則哲惟帝難之虞舜大聖驩兠大佞大聖難知大佞大佞不憂大聖何易之有是謂下知之上知之上知之大難小易下知之大易小難何則佞人材高論􅀃麗美因麗美之說人主之威人立心並不能責知或不能覺小佞材下對鄉}
  - {type: page-break, offset: 2162, content: '', id: KR3j0080_SBCK_011-26b}
  - {type: variant, offset: 2162, length: 0, content: '', WYG: 懷貪利之心輕禍重身傾死為僇矣何名之養義廢德壞操行隨辱何云作髙問曰大佞易知乎小佞易知也曰大佞易知小佞難知何則大佞材髙其迹易察小佞知下其效難省何以明之成事小盜難覺大盜易知也攻城襲邑剽刦虜掠發則事覺道路皆知盜也穿鑿垣牆狸步鼠竊莫知謂誰曰大佞姦深惑亂其人如大盜易知人君何難書曰知人則哲惟帝難之虞舜大聖驩兠大佞大聖難知大佞大佞不憂大聖何易之有是謂下知之上知之上知之大難小易下知之大易小難何則佞人材髙論説麗美因麗美之説人主之威人立心並不能責知或不能覺小佞材下對鄉}
