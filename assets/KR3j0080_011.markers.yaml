  - {type: variant, offset: 1913, length: 0, content: '', krp: 問曰日火也火在地不行日在天何}
  - {type: variant, offset: 1914, length: 2, content: 尺書, SBCK: 爲行曰附天之氣行附地之氣不行火附地地不行故火不行難曰附地之氣不行水何以行曰水之行也東流入海也西北方髙東南方下水性歸下猶火性趨髙也使地不髙西方則水亦不東流難曰附地之氣不行人附地何以行曰人之行求有爲也人道有爲故行求古者質朴鄰國接境雞犬之聲相聞終身不相徃來焉難曰附天之氣行列星亦何以不行曰列星著天天巳行也隨天而轉是亦行也難曰人道有爲故行天道無爲何行曰天之行也施氣自然也施氣則物自生非故施氣以生物也不動氣不施氣不施物不生與人行異日月五星之行皆施氣焉儒者曰日中有三足烏月中有兎蟾蜍夫日者天之火也與地之火無以異也地火之中無生物天火之中何故有烏火中無生物生物入火中燋爛而死焉烏安得立夫月者水也水中有生物非兎蟾蜍也兎與蟾蜍乆在水中無不死者日月毁於天螺蚌汨於淵同氣審矣}
  - {type: page-break, offset: 1914, content: '', id: KR3j0080_SBCK_011-13b}
