  - {type: variant, offset: 1909, length: 2, content: 形體, WYG: 天各自旋轉難之曰使日月自行不繫於天日行一度月行十三度當日月出時當進而東旋何還始西轉繫於天隨天四時轉行也其喻若蟻行於磑上日月行遲天行疾天持日月轉故日月實東行而反西旋也或問日月天皆行行度不同三者舒疾驗之人物為以何喻曰天日行一周日行一度二千里日晝行千里夜行千里麒麟晝日亦行千里然則日行舒疾與麒麟之步相似類也月行十三度十度二萬里三度六千里月一旦夜行二萬六千里與晨鳬飛相類似也天行三百六十五度積凡七十三萬里也其行甚疾無以為驗當與陶鈞之運弩矢之流相類似乎天行已疾去人髙遠視之若遲蓋望遠物者動若不動行若不行何以驗之乗船江海之中順風而驅近岸則行疾遠岸則行遲船行一實也或疾或遲遠近之視使之然也仰視天之運不若麒麟負日而馳皆暮而日在其前何則麒麟近而日遠也遠則若遲近則若疾六萬里六程難以得運行之實也儒者説曰日行一度天一日一夜行三百六十五度天左行日月右行與天相迎問日月之行也繫著於天也日月附天而行不直行也何以言之易曰日月星辰麗乎天百果草木麗於土麗者附也附天所行若人附地而圓行其取喻若蟻行於磑上焉問曰何知不離天直自行也如日能直自行當自東行無為隨天而西轉也月行與日同亦皆附天何以驗之驗之以雲雲不附天常止於所處使不附天亦當自止其處由此言之日行附天}
