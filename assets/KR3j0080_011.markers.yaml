  - {type: variant, offset: 2155, length: 0, content: '', SBCK: 名損譽者好臣所常臣也自耐下之用之可也自度不能下之用之不便夫用之不兩相益舎之不兩相損人君畏其志信佞人之言遂置不用問曰佞人直以高才洪知考上世人乎將有師學檢也曰人自有知以詐人及其說人主湏術以動上猶上人自有勇威人及其戰􅃲湏兵法以進衆術則從横師則􅀑谷也傳曰蘇秦張儀從横習之􅀑谷先生掘地爲坑曰下􅀃令我泣出則耐分人君之地蘇秦下說􅀑谷先生泣下沾襟張儀不若蘇秦相趙并相六國張儀貧賤徃歸蘇秦座之堂下食以僕妾之食數讓激怒欲令相秦儀忿恨遂西入秦蘇秦使人厚送其後覺知曰此在其術中吾不知也此吾所不及蘇君者知深有術權變鋒出故身尊崇榮顯爲世雄傑深謀明術深淺不能並行明闇不能並知問曰佞人養名作髙有諸曰佞人食利專權不養名作高貪權據凡則高名自立矣稱}
  - {type: page-break, offset: 2155, content: '', id: KR3j0080_SBCK_011-25b}
  - {type: variant, offset: 2155, length: 0, content: '', WYG: 名損譽者好臣所常臣也自耐下之用之可也自度不能下之用之不便夫用之不兩相益舍之不兩相損人君畏其志信佞人之言遂置不用問曰佞人直以髙才洪知考上世人乎將有師學檢也曰人自有知以詐人及其説人主須術以動上猶上人自有勇威人及其戰鬬須兵法以進衆術則從横師則鬼谷也傳曰蘇秦張儀從横習之鬼谷先生掘地為坑曰下説令我泣出則耐分人君之地蘇秦下説鬼谷先生泣下沾襟張儀不若蘇秦相趙并相六國張儀貧賤往歸蘇秦坐之堂下食以僕妾之食數讓激怒欲令相秦儀忿恨遂西入秦蘇秦使人厚送其後覺知曰此在其術中吾不知也此吾所不及蘇君者知深有術權變鋒出故身尊崇榮顯為世雄傑深謀明術深淺不能並行明闇不能並知問曰佞人養名作髙有諸曰佞人食利專權不養名作髙貪權據凡則髙名自立矣稱}
