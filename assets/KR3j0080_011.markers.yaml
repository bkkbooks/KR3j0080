  - {type: variant, offset: 1905, length: 2, content: 性命, WYG: 以隂陽説者失其實矣實者夏時日在東井冬時日在牽牛牽牛去極遠故日道短東井近極故日道長夏北至東井冬南至牽牛故冬夏節極皆謂之至春秋未至故謂之分或曰夏時陽氣盛陽氣在南方故天舉而髙冬時陽氣衰天抑而下髙則日道多故日長下則日道少故日短也日陽氣盛天南方舉而日道長月亦當復長案夏日長之時日出東北而月出東南冬日短之時日出東南月出東北如夏時天舉南方日月當俱出東北冬時天復下日月亦當俱出東南由此言之夏時天不舉南方冬時天不抑下也然則夏日之長也其所出之星在北方也冬日之短也其所出之星在南方也問曰當夏五月日長之時在東井東井近極故日道長今案察五月之時日出於寅入於戌日道長去人遠何以得見其出於寅入於戌乎日東井之時去人極近夫東井近極若極旋轉人常見之矣使東井在極旁側得無夜常為晝乎日晝行十六分人常見之不復出入焉儒者或曰日月有九道故曰日行有近遠晝夜有長短也夫復五月之時晝十一分夜五分六月晝十分夜六分從六月往至十一月月減一分此則日行月從一分道也歲日行天十六道也豈徒九道或曰天髙南方下北方日出髙故見入下故不見天之居若倚蓋矣故極在人之北是其效也極其天下之中今在人北其若倚蓋明矣日明旣以倚蓋喻當若蓋之形也極星在上之北若葢之葆矣其下之南有若蓋之莖者正何所乎夫取蓋倚於地不能運立而樹之然後能轉今天運轉其北際不著地者觸礙何以能行由此言之天不若倚葢之狀日之出入不隨天髙下明矣或曰天北際下地中日隨天而入地地密鄣隠故人不見然天地夫婦也合為一體天在地中地與天合天地并氣故能生物北方隂也合體并氣故居北方天運行於地中乎不則北方之地低下而不平也如審運行地中鑿地一丈轉見水源天行地中出入水中乎如北方低下不平是則九川北注不得盈滿也實者天不在地中日亦不隨天隠天平正與地無異然而日出上日入下者隨天轉運視天若覆盆之狀故視日上下然似若出入地中矣然則日之出近也其入遠不復見故謂之入運見於東方近故謂之出何以驗之繫明月之珠於車蓋之橑轉而旋之明月之珠旋邪人望不過十里天地合矣遠非合也今視日入非入也亦遠也當日入西方之時其下民亦將謂之日中從日入之下東望今之天下或時亦天地合如是方天下在南方也故日出於東方入於北方之地日出北方入於南方各於近者為出遠者為入實者不入遠矣臨大澤之濱望四邊之際與天屬其實不屬遠若屬矣日以遠為入澤以遠為屬其實一也澤際有陸人望而不見陸在察之若亡日亦在視之若入皆遠之故也太山之髙㕘天入雲去之百里不見埵塊夫去百里不見太山况日去人以萬里數乎太山之驗則旣明矣試使一人把大炬火夜行於道平易無險去人不一里火光滅矣非滅也遠也今日西轉不復見者非入也問曰天平正與地無異今仰視天觀日月之行天髙南方下北方何也曰方今天下在東南之上視天若髙日月道在人之南今天下在日月道下故觀日月之行若髙南下北也何以驗之即天髙南方之星亦當髙今視南方之星低下天復低南方乎夫視天之居近者則髙遠則下焉極北方之民以為髙南方為下極東極西亦如此焉皆以近者為髙遠者為下從北塞下近仰視斗極且在人上匈奴之北地之邊陲北上視天天一有下字復髙北下南日月之道亦在其上立太山之上太山髙去下十里太山下夫天之髙下猶人之察太山也平正四方中央髙下皆同今望天之四邊若下者非也遠也非徒下若合矣儒者或以旦暮日出入為近日中為遠或以日中為近日出入為遠其以日出入為近日中為遠者見日出入時大日中時小也察物近則大遠則小故日出入為近日中為遠也其以日出入為遠日中時為近者見日中時温日出入時寒也夫火光近人則温遠人則寒故以日中為近日出入為遠也二論各有所見故是非曲直未有所定如實論之日中近而日出入遠何以驗之以植竿於屋下夫屋髙三丈竿於屋棟之下正而樹之上扣棟下抵地是以屋棟去地三丈如旁邪倚之則竿末旁跌不得扣棟是為去地過三丈也日中時日正在天上猶竿之正樹去地三丈也日出入邪在人旁猶竿之旁跌去地過三丈也夫如是日中為近出入為遠可知明矣試復以屋中堂而坐一人一人行於屋上其行中屋之時正在坐人之上是為屋上之人與屋下坐人相去三丈矣如屋上人在東危若西危上其與屋下坐人相去過三丈矣日中時猶人正在屋上矣其始出與入猶人在東危與西危也日中去人近故温日出入遠故寒然則日中時日小其出入時大者日中光明故小其出入時光暗故大猶晝日察火光小夜察之火光大也旣以火為效又以星為驗晝日星不見者光耀滅之也夜無光耀星乃見夫日月星之類也平旦日入光銷故視大也儒者論日旦出扶桑暮入細栁扶桑東方地細栁西方野也桑栁天地之際日月常所出入之處問曰歲二月八月時日出正東日入正西可謂日出於扶桑入於細栁今夏日長之時日出於東北入於西北冬日短之時日出東南入於西南冬與夏日之出入在於四隅扶桑細栁正在何所乎所論之言猶謂春秋不謂冬與夏也如實論之日不出於扶桑入於細栁何以驗之隨天而轉近則見遠則不見當在扶桑細栁之時從扶桑細栁之民謂之日中之時從扶桑細栁察之或時為日出入若以其上者為中旁則為旦夕安得出於扶桑入細栁儒者論曰天左旋日月之行不}
