  - {type: variant, offset: 28, length: 1, content: 候, SBCK: 三十五國之地鳥獸草木金石水􅁟莫不畢載不言復有九州淮南王劉安召術士伍􅀍左吳之輩充滿宫殿作道術之書論天下之事地形之篇道異類之物外國之怪列三十五國之異不言更有九州鄒子行地不若禹益聞}
  - {type: variant, offset: 28, length: 1, content: 候, WYG: 三十五國之地鳥獸草木金石水土莫不畢載不言復有九州淮南王劉安召術士伍被左吳之輩充滿宫殿作道術之書論天下之事地形之篇道異類之物外國之怪列三十五國之異不言更有九州鄒子行地不若禹益聞}
  - {type: page-break, offset: 28, content: '', id: KR3j0080_WYG_011-4b, image: WYG0862/WYG0862-0134b.png}
  - {type: variant, offset: 28, length: 1, content: 候, krp: 三十五國之地鳥獸草木金石水土莫不畢載不言復有九州淮南王劉安召術士伍𬒳左吳之輩充滿宫殿作道術之書論天下之事地形之篇道異類之物外國之怪列三十五國之異不言更有九州鄒子行地不若禹益聞}
  - {type: variant, offset: 30, length: 0, content: '', SBCK: 不過􅀍吳才非聖人事非天授安得此言案禹之山經淮南之地形以察鄒子之書虚妄之言也太史公曰禹本紀言河出崑崙其髙三千五百餘里日月所}
  - {type: page-break, offset: 30, content: '', id: KR3j0080_SBCK_011-4a}
  - {type: variant, offset: 30, length: 0, content: '', WYG: 不過被吳才非聖人事非天授安得此言案禹之山經淮南之地形以察鄒子之書虛妄之言也太史公曰禹本紀言河出崑崙其髙三千五百餘里日月所}
  - {type: variant, offset: 30, length: 0, content: '', krp: 不過𬒳吳才非聖人事非天授安得此言案禹之山經淮南之地形以察鄒子之書虚妄之言也太史公曰禹本紀言河出崑崙其髙三千五百餘里日月所}
  - {type: variant, offset: 31, length: 14, content: 體察表候以知命猶察斗斛以知容, SBCK: 辟隱爲光明也其上有玉泉華池今自張騫使大夏之後窮河源惡睹本紀所謂崑崙者乎故言九州山川尚書近之}
