  - {type: variant, offset: 1905, length: 2, content: 性命, krp: 以隂陽說者失其實矣實者夏時日在東井冬時日在牽牛牽牛去極遠故日道短東井近極故日道長夏北至東井冬南至牽牛故冬夏節極皆謂之至春秋未至故謂之分或曰夏時陽氣盛陽氣在南方故天舉而髙冬時陽氣衰天抑而下髙則日道多故日長下則日道少故日短也日陽氣盛天南方舉而日道長月亦當復長案夏日長之時日出東北而月出東南冬日短之時日出東南月出東北如夏時天舉南方日月當俱出東北冬時天復下日月亦當俱出東南由此言之夏時天不舉南方冬時天不抑下也然則夏日之長也其所出之星在北方也冬日之短也其所出之星在南方也問曰當夏五月日長之時在東井東井近極故日道長今案察五月之時日出於寅入於戍日道長去人遠何以得見其出於寅入於戍乎日東井之時去人極近夫東井近極若極旋轉人常見之矣使東井在極旁側得無夜常爲晝乎日晝行十六分人常見之不復出入焉儒者或曰日月有九道故曰日行有近遠晝夜有長短也夫復五月之時晝十一分夜五分六月晝十分夜六分從六月往至十一月月減一分此則日行月從一分道也歲日行天十六道也豈徒九道或曰天髙南方下北方日出高故見入下故不見天之居若倚蓋矣故極在人之北是其效也極其天下之中今在人北其若倚蓋明矣日明旣以倚蓋喻當若蓋之形也極星在上之北若蓋之葆矣其下之南有若蓋之莖者正何所乎夫取蓋倚於地不能運立而樹之然后能轉今天運轉其北際不著地者觸礙何以能行由此言之天不若倚葢之狀日之出入不隨天髙下明矣或曰天北際下地中日隨天而入地地宻鄣隱故人不見然天地夫婦也合爲一體天在地中地與天合天地并氣故能生物北方隂也合體并氣故居北方天運行於地中乎不則北方之地低下而不平也如審運行地中鑿地一丈轉見水源天行地中出入水中乎如北方低下不平是則九川北注不得盈滿也實者天不在地中日亦不隨天隱天平正與地無異然而日出上日入下者隨天轉運視天若覆盆之狀故視日上下然似若出入地中矣然則日之出近也其入遠不復見故謂之入運見於東方近故謂之出何以驗之繫明月之珠於車蓋之橑轉而旋之明月之珠旋邪人望不過十里天地合矣遠非合也今視日入非入也亦遠也當日入西方之時其下民亦將謂之日中從日入之下東望今之天下或時亦天地合如是方天下在南方也故日出於東方入於北方之地日出北方入於南方各於近者爲出遠者爲入實者不入遠矣臨大澤之濵望四邊之際與天屬其實不屬遠若屬矣日以遠爲入澤以遠爲屬其實一也澤際有陸人望而不見陸在察之若望日亦在視之若入皆遠之故也太山之髙參天入雲去之百里不見埵塊夫去百里不見太山況日去人以萬里數乎太山之驗則旣明矣試使一人把大炬火夜行於道平易無險去人不一里火光滅矣非滅也遠也今日西轉不復見者非入也問曰天平正與地無異今仰視天觀日月之行天高南方下北方何也曰方今天下在東南之上視天若髙日月道在人之南今天下在日月道下故觀日月之行若髙南下北也何以驗之即天髙南方之星亦當髙今視南方之星低下天復低南方乎夫視天之居近者則高遠則下焉極北方之民以爲高南方爲下極東極西亦如此焉皆以近者爲高遠者爲下從北塞下近仰視斗極且在人上匈奴之北地之邊陲北上視天天下字一有復高北下南日月之道亦在其上立太山之上太山高去下十里太山下夫天之高下猶人之察太山也平正四方中央高下皆同今望天之四邊若下者非也遠也非徒下若合矣儒者或以旦暮日出入爲近日中爲遠或以日中爲近日出入爲遠其以日出入爲近日中爲遠者見日出入時大日中時小也察物近則大遠則小故日出入爲近日中爲遠也其以日出入爲遠日中時爲近者見日中時温日出入時寒也夫火光近人則温遠人則寒故以日中爲近日出入爲遠也二論各有所見故是非曲直未有所定如實論之日中近而日出入遠何以驗之以植竿於屋下夫屋髙三丈竿於屋棟之下正而樹之上扣棟下抵地是以屋棟去地三丈如旁邪倚之則竿末旁跌不得扣棟是爲去地過三丈也日中時日正在天上猶竿之正樹去地三丈也日出入邪在人旁猶竿之旁跌去地過三丈也夫如是日中爲近出入爲遠可知明矣試復以屋中堂而坐一人一人行於屋上其行中屋之時正在坐人之上是爲屋上之人與屋下坐人相去三丈矣如屋上人在東危若西危上其與屋下坐人相去過三丈矣日中時猶人正在屋上矣其始出與入猶人在東危與西危也日中去人近故温日出入遠故寒然則日中時日小其出入時大者日中光明故小其出入時光暗故大猶晝日察火光小夜察之火光大也旣以火爲效又以星爲驗晝日星不見者光耀滅之也夜無光耀星乃見夫日月星之類也平旦日入光銷故視大也儒者論日旦出扶桑暮入細柳扶桑東方地細柳西方野也桑柳天地之際日月常所出入之處問曰歲二月八月時日出正東日入正西可謂日出於扶桑入於細柳今夏日長之時日出於東北入於西北冬日短之時日出東南入於西南冬與夏日之出入在於四隅扶桑細柳正在何所乎所論之言猶謂春秋不謂冬與夏也如實論之日不出於扶桑入於細柳何以驗之隨天而轉近則見遠則不見當在扶桑細柳之時從扶桑細柳之民謂之日中之時從扶桑細柳察之或時爲日出入若以其上者爲中旁則爲旦夕安得出於扶桑入細柳儒者論曰天左旋日月之行不}
  - {type: variant, offset: 1909, length: 2, content: 形體, SBCK: 天各自旋轉難之曰使日月自行不繫於天日行一度月行十三度當日月出時當進而東旋何還始西轉繫於天隨天四時轉行也其喻若蟻行於磑上日月行遲天行疾天持日月轉故日月實東行而反西旋也或問日月天皆行行度不同三者舒疾驗之人物爲以何喻曰天日行一周日行一度二千里日晝行千里夜行千里麒麟晝日亦行千里然則日行舒疾與麒麟之歩相似􅀋也月行十三度十度二萬里三度六千里月一旦夜行二萬六千里與晨鳬飛相􅀋似也天行三百六十五度積凡七十三萬里也其行甚疾無以爲驗當與陶鈞之運弩矢之流相􅀋似乎天行巳疾去人髙遠視之若遲蓋望遠物者動若不動行若不行何以驗之乗船江海之中順風而驅近岸則行疾遠岸則行遲船行一實也或疾或遲遠近之視使之然也仰視天之運不若麒麟負日而馳皆暮而日在其前何則麒麟近而日遠也遠則若遲近則若疾六萬里六程難以得運行之實也儒者說曰日行一度天一日一夜行三百六十五度天左行日月右行與天相迎問日月之行也繫著於天也日月附天而行不直行也何以言之易曰日月星辰麗乎天百果草木麗於土麗者附也附天所行若人附地而圓行其取喻若蟻行於磑上焉間曰何知不離天直自行也如日能直自行當自東行無爲隨天而西轉也月行與日同亦皆附天何以驗之驗之以雲雲不附天常止於所處使不附天亦當自止其處由此言之日行附天}
