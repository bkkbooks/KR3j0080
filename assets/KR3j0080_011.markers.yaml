  - {type: variant, offset: 26, length: 0, content: '', SBCK: 皮革如鐡石刀劒矛㦸不能剌之彊弩利矢不能勝射也察當今天去地甚髙古天與今無異當共工缺天之時天非墜於地也女媧人也人雖長無及天者夫其􅀘天之時何登緣階據而得治之豈古之天若屋廡之形去人不遠故共工得敗之女媧得􅀘之乎如審然者女媧多前齒爲人者人皇最先人皇之時天如蓋乎說易者曰元氣未分渾沌爲一儒書又言溟涬濛澒氣未分之􅀋也及其分離清者爲天濁者爲地如說易之家儒書之言天地始分形體尚小相去近也近則或枕於不周之山共工得折之女媧得􅀘之也含氣之􅀋無}
  - {type: page-break, offset: 26, content: '', id: KR3j0080_SBCK_011-2b}
  - {type: variant, offset: 26, length: 0, content: '', WYG: 皮革如鐵石刀劍矛㦸不能刺之彊弩利矢不能勝射也察當今天去地甚髙古天與今無異當共工缺天之時天非墜於地也女媧人也人雖長無及天者夫其補天之時何登緣階據而得治之豈古之天若屋廡之形去人不遠故共工得敗之女媧得補之乎如審然者女媧以前齒為人者人皇最先人皇之時天如蓋乎説易者曰元氣未分渾沌為一儒書又言溟涬濛澒氣未分之類也及其分離清者為天濁者為地如説易之家儒書之言天地始分形體尚小相去近也近則或枕於不周之山共工得折之女媧得補之也含氣之類無}
  - {type: page-break, offset: 26, content: '', id: KR3j0080_WYG_011-3a, image: WYG0862/WYG0862-0133c.png}
  - {type: variant, offset: 26, length: 0, content: '', krp: 皮革如鐡石刀劒矛㦸不能剌之彊弩利矢不能勝射也察當今天去地甚髙古天與今無異當共工缺天之時天非墜於地也女媧人也人雖長無及天者夫其𥙷天之時何登緣階據而得治之豈古之天若屋廡之形去人不遠故共工得敗之女媧得𥙷之乎如審然者女媧多前齒爲人者人皇最先人皇之時天如蓋乎說易者曰元氣未分渾沌爲一儒書又言溟涬濛澒氣未分之類也及其分離清者爲天濁者爲地如說易之家儒書之言天地始分形體尚小相去近也近則或枕於不周之山共工得折之女媧得𥙷之也含氣之類無}
  - {type: variant, offset: 27, length: 0, content: '', SBCK: 不長天地含氣之自然也從始立以來年歲甚多則天地相去廣狹遠近不可復計儒書之言殆有所見然其言觸不周山而折天柱絶地維消煉五石􅀘蒼天斷鼇之足以立四極猶爲虚也何則山雖動共工之力不能折也豈天地始分之時山小而人反大乎何以能觸而折之以五色石􅀘天尚可謂五石若藥石治病之狀至其斷鼇之足以立四極難論言也從女媧以來乆矣四極之立自若鼇之足乎鄒衍之書言天下有九州禹貢之上所謂九州也禹貢九州所謂一州也若禹貢以上者九焉禹貢九州方今天下九州也在東南隅名曰赤縣神州復更有八州每一州者四海環之名曰裨海九州之外更有瀛海此言詭異聞者驚駭然亦不能實然否相隨觀讀諷述以談故虚實之事並傳世間眞僞不别也世人惑焉是以難論案鄒子之知不過禹禹之治洪水以益爲佐禹主治水益之記物極天之廣窮地之長辨四海之外竟四山之}
  - {type: page-break, offset: 27, content: '', id: KR3j0080_SBCK_011-3a}
  - {type: page-break, offset: 27, content: '', id: KR3j0080_SBCK_011-3b}
  - {type: variant, offset: 27, length: 0, content: '', WYG: 不長天地含氣之自然也從始立以來年歲甚多則天地相去廣狹遠近不可復計儒書之言殆有所見然其言觸不周山而折天柱絶地維消煉五石補蒼天㫁鼇之足以立四極猶為虛也何則山雖動共工之力不能折也豈天地始分之時山小而人反大乎何以能觸而折之以五色石補天尚可謂五石若藥石治病之狀至其㫁鼇之足以立四極難論言也從女媧以來久矣四極之立自若鼇之足乎鄒衍之書言天下有九州禹貢之上所謂九州也禹貢九州所謂一州也若禹貢以上者九焉禹貢九州方今天下九州也在東南隅名曰赤縣神州復更有八州每一州者四海環之名曰裨海九州之外更有瀛海此言詭異聞者驚駭然亦不能實然否相隨觀讀諷述以談故虛實之事並傳世間真偽不别也世人惑焉是以難論案鄒子之知不過禹禹之治洪水以益為佐禹主治水益之記物極天之廣窮地之長辨四海之外竟四山之}
