  - {type: variant, offset: 1934, length: 0, content: '', krp: 日中何爲有烏月中何爲有兎蟾蜍儒者謂日蝕月蝕也彼見日蝕常於晦朔晦朔月與日合故得蝕之夫春秋之時日蝕多矣經曰某月朔日有蝕之日有蝕之者未必月也知月蝕之何諱不言月說日蝕之變陽弱隂彊也人物在世氣力勁彊乃能乗凌案月晦光旣朔則如盡微弱甚矣安得勝日夫日之蝕月蝕也日蝕謂月蝕之月誰蝕之者無蝕月也月自損也以月論日亦如日蝕光自損也大率四十一二月日一食百八十日月一蝕蝕之}
  - {type: variant, offset: 1936, length: 0, content: '', SBCK: 時非時爲變及其爲變氣自然也日時晦朔月復爲之乎夫日當實滿以虧爲變必謂有蝕之者山崩地動蝕者誰也或說日食者月掩之也日在上月在下障於日之形也日月合相襲月在上日在下者不能掩日日在上月在日下障於日月光掩日光故謂之食也障於月也若隂雲蔽日月不見矣其端合者相食是也其合相當如襲辟者日旣是也日月合於晦朔天之常也日食月掩日光非也何以驗之使日月合月掩日光其初食崖當與旦復時易處假令日在東月在西月之行疾東及日掩日崖須􅁷過日而東西崖初掩之處光當復東崖未掩者當復食今察日之食西崖光缺其復也西崖光復過掩東崖復西崖謂之合襲相掩障如何儒者謂日月之體皆至圓彼從下望見其形若斗筐之狀狀如正圓不如望遠光氣氣不圓矣夫日月不圓視若圓者人遠也何以驗之夫日者火之精也月者水之精也在地水火不圓在天水火何故獨圓日月在天猶五星五星猶列星列星不圓光耀若圓去人遠也何以明之春秋之時星霣宋都就而視之石也不圓以星不圓知日月五星亦不圓也儒者􅀃日及工􅇊之家皆以日爲一禹貢山海經言日有十在海外東方有湯谷上有扶桑十日浴沐水中有大木九日居下枝一日居上枝淮南書又言燭十日堯時十日竝出萬物焦枯堯上射十日以故不竝一日見也世俗又名甲乙爲日甲至癸凡十日日之有十猶星之有五也通人談士歸於難知不肯辨明是以文二傳而不定世兩言而無主誠實論之且無十焉何以驗之夫日猶月也日而有十月有十二乎星有五五行之精金木水火土各異光色如日有十其氣必異今觀日光無有異者察其小大前後若一如審氣異光色宜殊如誠同氣冝合爲一無爲十也驗日陽遂火從天來日者大火也察火在地一氣也地無十火天安得十日然則所謂十日者殆更自有他物光質如日之狀居湯谷中水時縁據扶桑禹益見之則紀十日數家度日之光數日之質剌徑千里假令日出是扶桑木上之日扶桑木冝覆萬里乃能受之何則一日徑千里十日冝萬里也天之去人萬里餘也仰察之日光眩耀火光盛明不能堪也便日出是扶桑木上之日禹益見之不能知其爲日也何則仰察一日目猶眩耀況察十日乎當禹益見之若斗筐之狀故名之爲日夫火如斗筐望六萬之形非就見之即察之體也由此言之禹益所見意似日非日也天地之間物氣相􅀋}
