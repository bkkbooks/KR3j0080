  - {type: variant, offset: 2123, length: 0, content: '', SBCK: 何則霣時小大不與在天同也今見星霣如在天時是時星也非星則氣爲之也人見􅀑如死人之狀其實氣象聚非眞死人然則霣星之形其實非星}
