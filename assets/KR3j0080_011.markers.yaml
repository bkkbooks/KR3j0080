  - {type: variant, offset: 2159, length: 2, content: 言取, SBCK: 禍衆不能養其身安能養其名上世列傳棄宗養身違利赴名竹帛所載伯成子髙委國而耕於陵子辭位灌園近世蘭陵王仲子東都昔廬君陽寢位乆病不應上徴可謂養名矣夫不以道進必不以道出身不以義止必不以義立名佞}
