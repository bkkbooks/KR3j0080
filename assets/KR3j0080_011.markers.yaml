  - {type: variant, offset: 2150, length: 0, content: '', SBCK: 故曰刑故無小宥過無大聖君原心省意故誅故貰誤故賊加増過誤減損一獄吏所能定也賢者見之不疑矣問曰言行無功效可謂佞乎蘇秦約六國爲從彊秦不敢窺兵於􅀜外張儀爲横六國不敢同攻於􅀜内六國約從則秦畏而六國彊三秦稱横則秦彊而天下弱功著效明載紀竹帛雖賢何}
  - {type: page-break, offset: 2150, content: '', id: KR3j0080_SBCK_011-22b}
  - {type: variant, offset: 2150, length: 0, content: '', WYG: 故曰刑故無小宥過無大聖君原心省意故誅故貫誤故賊加增過誤減損一獄吏所能定也賢者見之不疑矣問曰言行無功效可謂佞乎蘇秦約六國為從彊秦不敢窺兵於關外張儀為横六國不敢同攻於闗内六國約從則秦畏而六國彊三秦稱横則秦彊而天下弱功著效明載紀竹帛雖賢何}
