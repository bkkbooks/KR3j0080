  - {type: variant, offset: 1934, length: 0, content: '', SBCK: 日中何爲有烏月中何爲有兎蟾蜍儒者謂日蝕月蝕也彼見日蝕常於晦朔晦朔月與日合故得蝕之夫春秋之時日蝕多矣經曰某月朔日有蝕之日有蝕之者未必月也知月蝕之何諱不言月說日蝕之變陽弱隂彊也人物在世氣力勁彊乃能乗凌案月晦光旣朔則如盡微弱甚矣安得勝日夫日之蝕月蝕也日蝕謂月蝕之月誰蝕之者無蝕月也月自損也以月論日亦如日蝕光自損也大率四十一二月日一食百八十日月一蝕蝕之}
