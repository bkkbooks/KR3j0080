  front:
  - {type: variant, offset: 0, length: 0, content: '', SBCK: 論衡卷第十一王充談天篇􅀃日篇荅佞篇談天篇儒書言共工與顓頊爭爲天子不勝怒而觸不周之山使天柱折地維絶女媧銷煉五色石以􅀘蒼天斷鼇足以立四極天不足西北故日月移焉地不足東南故百川注焉此乆遠之文世間是之言也文雅之人怪而無以非若非而無以奪又恐其實然不敢正議以天道人事論之殆虚言也與人爭爲天子不勝怒觸不周之山使天柱折地維絶有力如此天下無敵以此之力與三軍戰則士卒螻蟻也兵革毫芒也安得不勝之恨怒觸不周之山乎且堅重莫如山以萬人之力共推小山不能動也如不周之山大山也使是天柱乎折之固難使非柱乎觸不周山而使天柱折是亦復難信顓頊與之爭舉天下之兵悉海内之衆不能當也何不勝之有且夫天者氣邪體也如氣乎雲煙無異安得柱而折之女媧以石􅀘之是體也如審然天乃玉石之􅀋也石之質重千里一柱不能勝也如五嶽之巔不能上極天乃爲柱如觸不周上極天乎不周爲共工所折當此之時天毁壞也如審毁壞何用舉之斷鼇之足以立四極􅀃者曰鼇古之大獸也四足長大故斷其足以立四極夫不周山也鼇獸也夫天本以山爲柱共工折之代以獸足}
