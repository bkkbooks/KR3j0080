  - {type: variant, offset: 2139, length: 0, content: '', krp: 依類也日中見斗幽不明也夜中星不見夜光明也事異義同蓋其實也其言與雨俱之集也夫辛卯之夜明故星不見明則不雨之驗也雨氣隂暗安得明明則無雨安得與雨俱夫如是言與雨俱者非實且言夜明不見安得見星與雨俱又僖公十六年正月戊申霣石于宋五左氏傳曰星也夫謂霣石爲星則謂霣爲石矣辛卯之夜星霣爲星則實爲石矣辛卯之夜星霣如是石地有樓臺樓臺崩壞}
  - {type: punctuation, offset: 2141, content: ，, id: KR3j0080_tls_011-bkkpn461}
  - {type: 'tls:seg', offset: 2141, content: '', id: KR3j0080_tls_011-22a.36}
  - {type: variant, offset: 2141, length: 0, content: '', SBCK: 雖不合言及地尺雖地必有實數魯史目見不空言者也云與雨俱雨集於地石亦冝然至地而樓不臺壞非星明矣且左丘明謂石爲星何以審之當時石霣輕然何以其從天墜也秦時三山亡亡有不消散有在其集下時必有聲音或時夷狄之山從集於宋宋聞石霣則謂之星也左丘明省則謂之星夫星萬物之精與日月同􅀃五星者謂五行之精之光也五星衆星同光耀獨謂列星爲石恐失其實實者辛卯之夜霣星若雨而非星也與彼湯谷之十日若日而非日也儒者又曰雨從天下謂正從天墜也如當論之雨從地上不從天下見雨從上集則謂從天下矣其實地上也然其出地起於山何以明之春秋傳曰觸石而出膚寸而合不崇朝而徧天下惟太山也太山雨天下小山雨一國各以小大爲近遠差雨之出山或謂雲載而行雲散水墜名爲雨矣夫雲則雨雨則雲矣初出爲雲雲繁爲雨猶甚而泥露濡汚衣服若雨之狀非雲與俱雲載行雨也或曰尚書曰月之從星則以風雨詩曰月麗于畢俾滂沲矣二經咸言所謂爲之非天如何夫雨從山發月經星麗畢之時麗畢之時當雨也時不雨月不麗山不雲天地上下自相應也月麗於上山烝於下氣體偶合自然道也雲霧雨之徴也夏則爲露冬則爲霜温則爲雨寒則爲雪雨露凍凝者皆由地發不從天降也荅佞篇或問曰賢者行道得尊官厚禄矣何必爲佞以取冨貴曰佞人知行道可以得冨貴必以佞取爵禄者}
  - {type: page-break, offset: 2141, content: '', id: KR3j0080_SBCK_011-19a}
