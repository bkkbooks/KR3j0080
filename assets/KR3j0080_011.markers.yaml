  - {type: variant, offset: 2150, length: 0, content: '', krp: 故曰刑故無小宥過無大聖君原心省意故誅故貰誤故賊加増過誤減損一獄吏所能定也賢者見之不疑矣問曰言行無功效可謂佞乎蘇秦約六國爲從彊秦不敢窺兵於關外張儀爲横六國不敢同攻於關内六國約從則秦畏而六國彊三秦稱横則秦彊而天下弱功著效明載紀竹帛雖賢何}
  - {type: variant, offset: 2151, length: 1, content: 貌, SBCK: 加之太史公叙言衆賢儀秦有篇無嫉惡之文功鈞名敵不異於賢夫功之不可以效賢猶名之不可實也儀秦排難之人也處擾攘之世行揣摩之術當此之時稷契不能與之爭計禹臯陶不能與之比效若夫隂陽調和風雨時適五榖豐熟盗賊衰息人舉廉讓家行道德之功命禄貴美術數所致非道德之所成也太史公記功故髙來禩記録成則著效明驗攬載髙卓以儀秦功美故列其狀由此言之佞人亦能以權說立功爲效無效未可爲佞也難曰惡中立功者謂之佞能爲功者材髙知明思慮遠者必傍義依仁亂於大賢故覺佞之篇曰人主好辨佞人言利人主好文佞人辭麗心合意同偶當人主􅀃而不見其非何以知其僞而伺其姧乎曰是謂庸庸之君也材下知昬蔽惑不見后又賢之君察之審明若視俎上之脯指掌中之理數局上之棊摘轅中之馬魚鼈匿淵捕漁者知其源禽獸藏山畋獵者見其脉佞人異行於世世不能見庸庸之主無高材之人也難曰人君好辨佞人言利人主好文佞人辭麗言操合同何以覺之曰文王官人法曰推其徃行以揆其來言聽其來言以省其徃行觀其陽以考其隂察其内以揆其外是故詐善設節者可知飾僞無情者可辨質誠居善者可得含忠守節者可見也人之舊性不辨人君好辨佞人學求合於上也人之故能不文人君好文佞人意欲稱上上奢巳麗服上儉已不􅅚今操與古殊朝行與家别考郷里之迹證朝庭之行察共親之節明事君之操外内不相稱名實不相副際㑹發見姧爲覺露也問曰人操行無􅁪權時制冝信者欺人直者曲撓權變所設前後異操事有所應左右異語儒書所載權變非一今以素故考之毋乃失實乎曰賢者有權佞者有權賢者之有權後有應佞人之有權亦反經後有惡故賢人之權爲事爲國佞人之權爲身爲家觀其所權賢佞可論察其發動邪正可名問曰佞人好毁人有諸曰佞人不毁人如毁人是䜛人也何則佞人求利故不毁人茍利於巳曷爲毁之茍不利己於毁之無益以計求便以數}
