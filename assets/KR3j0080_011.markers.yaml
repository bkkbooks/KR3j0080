  - {type: variant, offset: 2145, length: 0, content: '', SBCK: 斗斛之量多少權衡之縣輕重也然而居國有土之君􅂚爲常有邪佞之臣與常有欺惑之患無患斗斛過所量非其榖不患無銓衡所銓非其物故也在人君位者皆知九德之可以檢行事效可以知情然而惑亂不能見者則明不察之故也人有不能行行無不可檢人有不能考情無不可知問曰行不合於九德效不檢於考功進近非賢非賢則佞夫庸庸之材無髙之知不能及賢賢功不效賢行不應可謂佞乎曰材有不相及行有不相追功有不相襲若知無相襲人材相什百取舍宜同賢佞殊行是是非非實名俱立而效有成敗是非之言俱當功有正邪言合行違名盛行廢佞人問曰行合九德則賢不合則佞世人操行者可盡謂佞乎曰諸非皆惡惡中之逆者謂之無道惡中之巧者謂之佞人聖王刑憲佞在惡中聖王賞勸賢在善中純㓗之賢善中殊髙賢中之聖也善中大佞惡中之雄也故曰觀賢由善察佞由惡善惡定成賢佞}
