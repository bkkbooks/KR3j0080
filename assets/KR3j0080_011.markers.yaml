  - {type: variant, offset: 1936, length: 0, content: '', WYG: 時非時為變及其為變氣自然也日時晦朔月復為之乎夫日當實滿以虧為變必謂有蝕之者山崩地動蝕者誰也或説日食者月掩之也日在上月在下障於日之形也日月合相襲月在上日在下者不能掩日日在上月在日下障於日月光掩日光故謂之食也障於月也若隂雲蔽日月不見矣其端合者相食是也其合相當如襲辟者日既是也日月合於晦朔天之常也日食月掩日光非也何以驗之使日月合月掩日光其初食崖當與旦復時易處假令日在東月在西月之行疾東及日掩日崖須臾過日而東西崖初掩之處光當復東崖未掩者當復食今察日之食西崖光缺其復也西崖光復過掩東崖復西崖謂之合襲相掩障如何儒者謂日月之體皆至圓彼從下望見其形若斗筐之狀狀如正圓不如望遠光氣氣不圓矣夫日月不圓視若圓者人遠也何以驗之夫日者火之精也月者水之精也在地水火不圓在天水火何故獨圓日月在天猶五星五星猶列星列星不圓光耀若圓去人遠也何以明之春秋之時星霣宋都就而視之石也不圓以星不圓知日月五星亦不圓也儒者説日及工伎之家皆以日為一禹貢山海經言日有十在海外東方有湯谷上有扶桑十日沐浴水中有大木九日居下枝一日居上枝淮南書又言燭十日堯時十日並出萬物焦枯堯上射十日以故不並一日見也世俗又名甲乙為日甲至癸凡十日日之有十猶星之有五也通人談士歸於難知不肯辨明是以文二傳而不定世兩言而無主誠實論之且無十焉何以驗之夫日猶月也日而有十月有十二乎星有五五行之精金木水火土各異光色如日有十其氣必異今觀日光無有異者察其小大前後若一如審氣異光色宜殊如誠同氣宜合為一無為十也驗日陽燧火從天來日者大火也察火在地一氣也地無十火天安得十日然則所謂十日者殆更自有他物光質如日之狀居湯谷中水時縁據扶桑禹益見之則紀十日數家度日之光數日之質刺徑千里假令日出是扶桑木上之日扶桑木宜覆萬里乃能受之何則一日徑千里十日宜萬里也天之去人萬里餘也仰察之日光眩耀火光盛明不能堪也使日出是扶桑木上之日禹益見之不能知其為日也何則仰察一日目猶眩耀况察十日乎當禹益見之若斗筐之狀故名之為日夫火如斗筐望六萬之形非就見之即察之體也由此言之禹益所見意似日非日也天地之間物氣相類}
