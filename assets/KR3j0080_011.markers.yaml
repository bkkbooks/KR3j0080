  - {type: variant, offset: 1529, length: 181, content: 人見盤盂之器知所設用也善器必用貴人惡器必施賤者尊鼎不在陪廁之側匏瓜不在殿堂之上明矣富貴之骨不遇貧賤之苦貧賤之相不遭富貴之樂亦猶此也器之盛物有斗石之量猶人爵有高下之差也器過其量物溢棄遺爵過其差死亡不存論命者如比之於器以察骨體之法則命在於身形定矣非徒富貴貧賤有骨體也而操行清濁亦有法理貴賤貧富命也操行清濁性也非徒命有骨法性亦有骨法唯知命有明相莫知性有骨法此見命之表證, SBCK: 隱}
