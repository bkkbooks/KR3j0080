  - {type: variant, offset: 1917, length: 4, content: 載世所共, SBCK: 謂兎蟾蜍者豈反螺與蚌邪且問儒者烏兎蟾蜍死乎生也如死乆在日月燋枯腐朽如生日蝕時旣月晦常盡烏兎蟾蜍皆何在夫烏兎蟾蜍日月氣也若人之腹臓萬物之心膂也月尚可察也人之察日無不眩不能知日審何氣通而}
