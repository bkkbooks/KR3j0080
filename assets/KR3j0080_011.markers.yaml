  - {type: variant, offset: 2141, length: 0, content: '', krp: 雖不合言及地尺雖地必有實數魯史目見不空言者也云與雨俱雨集於地石亦冝然至地而樓不臺壞非星明矣且左丘明謂石爲星何以審之當時石霣輕然何以其從天墜也秦時三山亡亡有不消散有在其集下時必有聲音或時夷狄之山從集於宋宋聞石霣則謂之星也左丘明省則謂之星夫星萬物之精與日月同說五星者謂五行之精之光也五星衆星同光耀獨謂列星爲石恐失其實實者辛卯之夜霣星若雨而非星也與彼湯谷之十日若日而非日也儒者又曰雨從天下謂正從天墜也如當論之雨從地上不從天下見雨從上集則謂從天下矣其實地上也然其出地起於山何以明之春秋傳曰觸石而出膚寸而合不崇朝而徧天下惟太山也太山雨天下小山雨一國各以小大爲近遠差雨之出山或謂雲載而行雲散水墜名爲雨矣夫雲則雨雨則雲矣初出爲雲雲繁爲雨猶甚而泥露濡汚衣服若雨之狀非雲與俱雲載行雨也或曰尚書曰月之從星則以風雨詩曰月麗于畢俾滂沲矣二經咸言所謂爲之非天如何夫雨從山發月經星麗畢之時麗畢之時當雨也時不雨月不麗山不雲天地上下自相應也月麗於上山烝於下氣體偶合自然道也雲霧雨之徴也夏則爲露冬則爲霜温則爲雨寒則爲雪雨露凍凝者皆由地發不從天降也荅佞篇或問曰賢者行道得尊官厚禄矣何必爲佞以取冨貴曰佞人知行道可以得冨貴必以佞取爵禄者}
  - {type: variant, offset: 2143, length: 1, content: 具, SBCK: 禁欲也知力耕可以得榖勉貿可以得貨然而必盗竊情欲不能禁者也以禮進退也人莫不貴然而違禮者衆尊義者希心情貪欲志慮亂溺也夫佞與賢者同材佞以情自敗偷盗與田商同知偷盗以欲自劾也問曰佞與賢者同材材行冝鈞而佞人􅂚爲獨以情自敗曰冨貴皆人所欲也雖有君子之行猶有飢渴之情君子則以禮防情以義割欲故得循道循道則無禍小人縱貪利之欲踰禮犯義故進得茍佞茍佞則有罪夫賢者君子也佞人小人也君子與小人夲殊操異行取捨不同問曰佞與䜛者同道乎有以異乎曰䜛與佞俱小人也同道異材俱以嫉妬爲性而施行發動之異䜛以口害人佞以事危人䜛人以直道不違佞人依違匿端䜛人無詐慮佞人有術數故人君皆能遠䜛親仁莫能知賢别佞難曰人君皆能遠䜛親仁而莫能知賢别佞然則佞人意不可知乎曰佞可知人君不能知庸庸之君不能知賢不能知賢不能知佞唯聖賢之人以九德檢其行以事效考其言行不合於九德言不驗於事效人非賢則佞矣夫知佞以知賢知賢以知佞知佞則賢智自覺知賢則姧佞自得賢佞異行考之一驗情心不同觀之一實問曰九德之法張設乆矣觀讀之者莫不曉}
