  - {type: variant, offset: 536, length: 1, content: 命, SBCK: 不異宋景公出三善言則其先三善言之前必有善行也有善行必有善政政善則嘉瑞臻福祥至熒惑之星無為守心也使景公有失誤之行以致惡政惡政發則妖異見熒之守心桑榖之生朝高宗消桑穀之變以政不以言景公卻熒惑之異亦宜以行景公有惡行故熒惑守心不改政修行坐出三善言安能動天天安肯應何以效之使景公出三惡言能使熒惑守心乎夫三惡言不能使熒惑守心三善言安能使熒惑退徙三舎以三善言獲二十一年如有百善言得千歳之壽乎非天祐善之意應誠為福之實也子韋之言天處髙而聽卑君有君人之言三天必三賞君夫天體也與地無異諸有體者耳咸附於首體與耳殊未之有也天之去人髙數萬里使耳附天聽數萬里之語弗能聞也人坐樓臺之上察地之螻蟻尚不見其體安能聞其聲何則螻蟻之體細不若人形大聲音孔氣不能達也今天之崇高非直樓臺人體比}
