  - {type: variant, offset: 589, length: 0, content: '', SBCK: 一里之外澹然澄靜離之逺也今人操行變氣逺近宜與魚等氣應而變宜與水均以七尺之細形形中之㣲氣不過與一鼎之蒸火同從下地上變皇天何其高也且景公賢者也賢者操行上不及聖下不過惡人世間聖人莫不堯舜惡人莫不桀紂堯舜操行多善無移熒惑之效桀紂之政多惡有反景公脱禍之驗景公出三善言延年二十一歳是則堯舜宜獲千嵗桀紂宜}
