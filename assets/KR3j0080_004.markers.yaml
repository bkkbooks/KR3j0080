  - {type: variant, offset: 594, length: 8, content: 一業優劣異名壽夭, SBCK: 道好惡不殊人道不然則知天無驗矣宋衛陳鄭之俱災也氣變見天梓慎知之請於子産有以除之子産不聽天道當然人事不能郤也使子産聽梓慎四國能無災乎堯遭鴻水時臣必有梓慎子韋之知矣然而不郤除者堯與子産同心也案子韋之言曰熒惑天使也心宋分野也禍當君審如此言禍不可除星不可郤也若夫寒温失和風雨不時政事之家謂之失誤所致可以善政賢行變而復也若熒惑守心若必死猶亡禍安可除修政改行安能卻之善政賢行尚不能卻出虛華之三言謂星卻而禍除增夀延年享長乆之福誤矣觀子韋之言景公言熒惑之禍非寒暑風雨之類身死命終之祥也國且亡身且死祅氣見於天容色見於面面有容色雖善操行不能滅死徴已見也在體之色不可以言行滅在天之妖安可以治除乎人病且死色見於面人}
  - {type: page-break, offset: 594, content: '', id: KR3j0080_SBCK_004-17b}
