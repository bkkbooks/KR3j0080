  - {type: variant, offset: 124, length: 158, content: 薄弱也渥彊之人必卒其壽若夫無所遭遇虛居困劣短氣而死此稟之薄用之竭也此與始生而死未產而傷一命也皆由稟氣不足不自致於百也人之稟氣或充實而堅強或虛劣而軟弱充實堅強其年壽虛劣軟弱失棄其身天地生物物有不遂父母生子子有不就物有為實枯死而墮人有為兒夭命而傷使實不枯亦至滿歲使兒不傷亦至百年然為實兒而死枯者稟氣薄則雖形體完其虛劣氣少, SBCK: 徳}
