  - {type: variant, offset: 590, length: 1, content: 夭, SBCK: 殤子今則不然各隨年夀堯舜桀紂皆近百載是竟子韋之言妄延年之語虛也且子韋之言曰熒惑天使也心宋分野也禍當君若是者天使熒惑加禍於景公也如何可移於將相若歳與國民乎天之有熒惑也猶}
