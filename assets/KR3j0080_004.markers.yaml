  - {type: xml-element, offset: 0, content: '', id: KR3j0080_tls_004-bkkxmlele1}
  - {type: punctuation, offset: 0, content: 《, id: KR3j0080_tls_004-bkkpn1}
  - {type: variant, offset: 1, length: 1, content: 壽, SBCK: 力竭盡故至於死伯竒放流首髪早白詩云惟憂用老伯竒用憂而顔淵用睛蹔望倉卒安能致此儒書言舜葬於蒼梧禹葬於㑹稽者巡狩年老道死邊土聖人以天下為家不别逺近不殊内外故遂止葬夫言舜禹實也言其巡狩虛也舜之與堯俱帝者也共五千里之境同四海之内二帝之道相因不殊堯典之}
  - {type: variant, offset: 1, length: 1, content: 壽, WYG: 力竭盡故至於死伯竒放流首髪蚤白詩云惟憂用老伯竒用憂而顔淵用睛蹔望倉卒安能致此儒書言舜葬於蒼梧禹葬於㑹稽者巡狩年老道死邊土聖人以天下為家不别逺近不殊内外故遂止葬夫言舜禹實也言其巡狩虛也舜之與堯俱帝者也共五千里之境同四海之内二帝之道相因不殊堯典之}
