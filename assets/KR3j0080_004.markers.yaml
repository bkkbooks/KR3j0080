  - {type: variant, offset: 592, length: 1, content: 霸, SBCK: 者之有方伯也諸侯有當死之罪使方伯圍守其國國君問罪於臣臣明罪在君雖然可移於臣子與人民設國君計其言令其臣歸罪於國方伯聞之肯聽其言釋國君之罪更移以付國人乎方伯不聽者自國君之罪非國人之辜也方伯不聽自國君之罪熒惑安肯移禍於國人若此子韋之言妄也曰景公聽乎言庸何能動天使諸侯不聽其臣言引過自予方伯聞其言釋其罪委之去乎方伯不釋諸侯之罪熒惑安肯徙去三舎夫聽與不聽皆無福善星徙之實未可信用天人}
  - {type: page-break, offset: 592, content: '', id: KR3j0080_SBCK_004-17a}
