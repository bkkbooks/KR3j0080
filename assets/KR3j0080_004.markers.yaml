  - {type: variant, offset: 534, length: 0, content: '', krp: 隨種之世俗則謂爲舜禹田海陵麋田若象耕狀何嘗帝王葬海陵者邪傳書言吳王夫差殺伍子胥煑之於鑊乃以鴟夷橐投之於江子胥恚恨驅水為濤以溺殺人今時㑹稽丹徒大江錢唐浙江皆立子胥之廟蓋欲慰其恨心止其猛濤也夫言吳王殺子胥投之於江實也言其恨恚驅水為濤者虛也屈原懐恨自投湘江湘江不為濤申徒狄蹈河而死河水不為濤世人必曰屈原申徒狄不能勇猛力怒不如子胥夫衛葅子路而漢烹彭越子胥勇猛不過子路彭越然二士不能發怒於鼎鑊之中以烹湯葅汁瀋漎旁人子胥亦自先入鑊乃入江在鑊中之時其神安居豈怯於鑊湯勇於江水哉何其怒氣前後不相副也且投於江中何江也有丹徒大江有錢唐浙江有吳通陵江或言投於丹徒大江無濤欲言投於錢唐浙江浙江山隂江上虞江皆有濤三江有濤豈分橐中之體散置三江中乎人若恨恚也仇讎未死子孫遺在可也今吳國已滅夫差無類吳為㑹稽立置太守子胥之神復何怨苦為濤不止欲何求索吳越在時分㑹稽郡越治山隂吳都今呉餘暨以南屬越錢唐以北屬吳錢唐之江兩國界也山隂上虞在越界中子胥入吳之江為濤當自上吳界中何為入越之地怨恚吳王發怒越江違失道理無神之驗也且夫水難驅而人易從也生任䈥力死用精魂子胥之生不能從生人營衛其身自令身死䈥力消絶精魂飛散安能為濤使子胥之類數百千人乘船渡江不能越水一子胥之身煑湯鑊之中骨肉糜爛成為羮葅何能有害也周宣王殺其臣杜伯趙簡子殺其臣莊子義其後杜伯射宣王莊子義害簡子事理似然猶為虛言今子胥不能完體為杜伯子義之事以報吳王而驅水往來豈報讎之義有知之驗哉俗語不實成為丹青丹青之文賢聖惑焉夫地之有百川也猶人之有血脉也血脉流行汎揚動静自有節度百川亦然其朝夕往來猶人之呼吸氣出入也天地之性上古有之經曰江漢朝宗于海唐虞之前也其發海中之時漾馳而已入三江之中殆小淺狹水激沸起故騰為濤廣陵曲江有濤文人賦之大江浩洋曲江有濤竟以隘狹也吳殺其身為濤廣陵子胥之神竟無知也溪谷之深流者安洋淺多沙石激揚爲瀬夫濤瀬一也謂子胥爲濤誰居溪谷爲瀬者乎案濤入三江岸沸踊中央無聲必以子胥爲濤子胥之身聚岸漼也濤之起也隨月盛衰小大滿損不齊同如子胥爲濤子胥之怒以月爲節也三江時風揚疾之波亦溺殺人子胥之神復爲風也秦始皇渡湘水遭風問湘山何祠左右對曰堯之女舜之妻也始皇太怒使刑徒三千人斬湘山之樹而履之夫謂子胥之神爲濤猶謂二女之精爲風也傳書言孔子當泗水之葬泗水爲之却流此言孔子之徳能使水却不湍其墓也世人信之是故儒者稱論皆言孔子之後當封以泗水却流為證如原省之殆虛言也夫孔子死孰與其生生能操行慎道應天死操行絶天祐至徳故五帝三王招致瑞應皆以生存不以死亡孔子生時推排不容故歎曰鳯鳥不至河不出圗吾已矣夫生時無祐死反有報乎孔子之死五帝三王之死也五帝三王無祐孔子之死獨有天報是孔子之魂聖五帝之精不能神也泗水無知為孔子却流天神使之然則孔子生時天神不使人尊敬如泗水却流天欲封孔子之後孔子生時功徳應天天不封其身乃欲封其後乎是蓋水偶自却流江河之流有回復之處百川之行或易道更路與却流無以異則泗水却流不為神怪也傳書稱魏公子之徳仁惠下士兼及鳥獸方與客飲有鸇擊鳩鳩走巡於公子案下鸇追擊殺於公子之前公子耻之即使人多設羅得鸇數十枚責讓以擊鳩之罪擊鳩之鸇低頭不敢仰視公子乃殺之世稱之曰魏公子為鳩報仇此虛言也夫鸇物也情心不同音語不通聖人不能使鳥獸為義理之行公子何人能使鸇低頭自責鳥為鸇者以千萬數向擊鳩蜚去安可復得能低頭自責是聖鳥也曉公子之言則知公子之行矣知公子之行則不擊鳩於其前人猶不能改過鳥與人異謂之能悔世俗之語失物類之實也或時公子實捕鸇鸇得人持其頭變折其頸疾痛低垂不能仰視緣公子恵義之人則因褒稱言鸇服過蓋言語之次空生虛妄之美功名之下常有非實之加傳書言齊桓公妻姑姉妹七人此言虛也夫亂骨肉犯親戚無上下之序者禽獸之性則亂不知倫理案桓公九合諸侯一正天下道之以徳將之以威以故諸侯服従莫敢不率非内亂懐鳥獸之性者所能為也夫率諸侯朝事王室耻上無勢而下無禮也外耻禮之不存内何犯禮而自壞外内不相副則功無成而威不立矣世稱桀紂之惡不言淫於親戚實論者謂夫桀紂惡㣲於亡秦亡秦泊過於王莽無淫亂之言桓公妻姑姉七人惡浮於桀紂而過重於秦莽也春秋采毫毛之美貶纎芥之惡桓公惡大不貶何哉魯文姜齊襄公之妹也襄公通焉春秋經曰莊二年冬夫人姜氏㑹齊侯于郜春秋何尤於襄公而書其姧何宥於桓公隠而不譏如經失之傳家左丘明公羊穀梁何諱不言案桓公之過多内寵内嬖如夫人者六有五公子爭立齊亂公薨三月乃訃世聞内嬖六人嫡庻無别則言亂於姑姊妹七人矣傳書言齊桓公負婦人而朝諸侯此言桓公之淫亂無禮甚也夫桓公大朝之時負婦人於背其游宴之時何以加此方修士禮崇厲肅敬負婦人於背何以能率諸侯朝事王室葵丘之㑹桓公驕矜當時諸侯畔者九國睚眦不得載字一有所九國畔去况負婦人淫亂之行何以肯留或曰管仲告諸侯吾君背有疽創不得婦人瘡不衰愈諸侯信管仲故無畔者夫十室之邑必有忠信若孔子當時諸侯千人以上必知方術治疽不用婦人管仲為君諱也諸侯知仲為君諱而欺已必恚怒而畔去何以能乆統㑹諸侯成功於霸或曰桓公實無道任賢相管仲故能霸天下夫無道之人與狂無異信讒逺賢反害仁義安能任管仲能養人令之成事桀殺關龍逢紂殺王子比干無道之君莫能用賢使管仲賢桓公不能用用管仲故知桓公無亂行也有賢明之君故有貞良之臣臣賢君明之驗奈何謂之有亂難曰衛靈公無道之君時知賢臣管仲為輔何明桓公不為亂也夫靈公無道任用三臣僅以不喪非有功行也桓公尊九九之人拔寗戚於車下責苞茅不貢運兵攻楚九合諸侯一匡天下千世一出之主也而云負婦人於背虛矣説尚書者曰周公居攝帶天子之綬戴天子之冠負扆南面而朝諸侯戸牖之間曰扆南面之坐位也負扆南面郷坐扆在後也桓公朝諸侯之時或南面坐婦人立於後也世俗傳云則曰負婦人於背矣此則䕫一足宋丁公鑿井得一人之語也唐虞時䕫為大夫性知音樂調聲悲善當時人曰調樂如䕫一足矣世俗傳言䕫一足案秩宗官缺帝舜博求衆稱伯夷伯夷稽首讓于夔龍秩宗卿官漢之宗正也斷足足非其理也且一足之人何用行也夏后孔甲田于東蓂莫一作山天雨晦冥入于民家主人方乳或曰后來之子必貴或曰不勝之子必賤孔甲曰為余子孰能賤之遂載以歸析橑斧斬其足卒為守者孔甲之欲貴之子有餘力矣斷足無宜故為守者今䕫一足無因趨步坐調音樂可也秩宗之官不宜一足猶守者斷足不可貴也孔甲不得貴之子伯夷不得讓於䕫焉宋丁公者宋人也未鑿井時常有寄汲計之日去一人作自鑿井後不復寄汲計之日得一人之作故曰宋丁公鑿井得一人俗傳言曰丁公鑿井得一人於井中夫人生於人非生於土也穿土鑿井無為得人推此以論負婦人之語猶此類也負婦人而坐則云婦人在背知婦人在背非道則生管仲以婦人治疽之言矣使桓公用婦人徹胤服婦人於背女氣瘡可去以婦人治疽方朝諸侯桓公重衣婦人襲裳女氣分隔負之何益桓公思士作庭燎而夜坐以思致士反以白日負婦人見諸侯乎傳書言聶政為嚴翁仲刺殺韓王此虛也夫聶政之時韓列侯也列侯之三年聶政刺韓相俠累十二年列侯卒與聶政殺俠累相去十七年而言聶政刺殺韓王短書小傳竟虛不可信也傳書又言燕太子丹使刺客荆軻刺秦王不得誅死後髙漸麗復以擊筑見秦王秦王説之知燕太子之客乃冐其眼使之擊筑漸麗乃置鈆於筑中以爲重當擊筑秦王膝進不能自禁漸麗以筑擊秦王顙秦王病傷三月而死夫言髙漸麗以筑擊秦王實也言中秦王病傷三月而死虛也夫秦王者秦始皇帝也始皇二十年燕太子丹使荆軻刺始皇始皇殺軻明矣二十一年使將軍王翦攻燕得太子首二十五年遂伐燕而虜燕王嘉後不審何年高漸麗以筑擊始皇不中誅漸麗當二十七年游天下到㑹稽至琅邪北至勞盛山並海西至平原津而病到沙丘平臺始皇崩夫䜟書言始皇還到沙丘而亡傳書又言病筑瘡三月而死於秦一始皇之身世或言死於沙丘或言死於秦其死言恒病瘡傳書之言多失其實世俗之人不能定也變虛篇傳書曰宋景公之時熒惑守心公懼召子韋而問之曰熒惑在心何也子韋曰熒惑天罰也心宋分野也禍當君雖然可移於宰相公曰宰相所使治國家也而移死焉不祥子韋曰可移於民公曰民死寡人將誰為也寧獨死耳子韋曰可移於嵗公曰民饑必死為人君而欲殺其民以自活也其誰以我為君者乎是寡人命固盡也子母復言子韋退走北面再拜曰臣敢賀君天之處高而耳卑君有君人之言三天必三賞君今夕星必徙三舎君延命二十一年公曰奚知之對曰君有三善故有三賞星必三徙三徙行七星星當一年三七二十一故君命延二十一歳臣請伏於殿下以伺之星必不徙臣請死耳是夕也火星果徙三舎如子韋之言則延年審得二十一嵗矣星徙審則延命延命明則景公為善天祐之也則夫世間人能為景公之行者則必得景公祐矣此言虛也何則皇天遷怒使熒惑本景公身有惡而守心則雖聽子韋言猶無益也使其不為景公則雖不聽子韋之言亦無損也齊景公時有彗星使人禳之晏子曰無益也秖取誣焉天道不闇不貮其命若之何禳之也且天之有彗以除穢也君無穢徳又何禳焉若徳之穢禳之何益詩曰惟此文王小心翼翼昭事上帝聿懐多福厥徳不回以}
  - {type: variant, offset: 535, length: 0, content: '', SBCK: 方國君無回徳方國將至何患於彗詩曰我無所監夏后及商用亂之故民卒流亡若徳回亂民將流亡祝史之為無能補也公説乃止齊君欲禳彗星之凶猶子韋欲移熒惑之禍也宋君不聽猶晏子不肯從也則齊君為子韋晏子為宋君也同變共禍一事二人天猶賢宋君使熒惑徙三舎延二十一年獨不多爲一作晏子使彗消而増其夀何天祐善偏駮不齊一也人君有善行善行動於心善言出於意同由共本一}
