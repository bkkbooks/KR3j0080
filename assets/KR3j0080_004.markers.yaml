  front:
  - {type: variant, offset: 0, length: 0, content: '', SBCK: 論衡卷第四王充書虛篇變虚篇書虛篇世信虛妄之書以為載於竹帛上者皆賢聖所傳無不然之事故信而是之諷而讀之睹眞是之傳與虛妄之書相違則并謂短書不可信用夫幽冥之實尚可知沈隠之情尚可定顯文露書是非易見籠總并傳非實事用精不専無思於事也夫世間傳書諸子之語多欲立竒造異作驚目之論以駭世俗之人為譎詭之書以著殊異之名傳書言延陵季子出游見路有遺金當夏五月有披裘而薪者季子呼薪者曰取彼地金來薪者投鎌於地瞋目拂手而言曰何子居之高視之下儀貌之壯語言之野也吾當夏五月披裘而薪豈取金者哉季子謝之請問姓字薪者曰子皮相之士也何足語姓名遂去不顧世以爲然殆虛言也夫季子耻吳之亂吳欲共立以爲主終不肯受去之延陵終身不還廉讓之行終始若一許由讓天下不嫌貪封侯伯夷委國饑死不嫌貪刀鉤亷讓之行大可以況小小難以況大季子能讓吳位何嫌貪地遺金季子使於上國道過徐徐君好其寶劒未之即予還而徐君死解劒帶􅃁樹而去廉讓之心耻負其前志也季子不負死者棄其寶劒何嫌一叱生人取金於地季子未去吳乎公子也已去吳乎延陵君也公子與君出有前後車有附從不能空行於塗明矣既不耻取金何難使左右而煩披裘者世稱栁下惠之行言其能以幽冥自修潔也賢者同操故千歳交志置季子於冥昧之處尚不取金況以白日前後備具取金於路非季子之操也或時季子適見遺金憐披裘薪者欲以益之或時言取彼地金欲以予薪者不自取也世俗傳言則言季子取遺金也傳書或言顔淵與孔子俱上魯太山孔子東南望吳閶門外有繫白馬引顔淵指以示之曰若見吳昌門乎顔淵曰見之孔子曰門外何有曰有如繫練之狀孔子撫其目而正之因與俱下下而顔淵髮白齒落遂以病死蓋以精神不能若孔子彊力自極精華竭盡故早夭死世俗聞之人字一有皆以為然如實論之殆虛言也案論語之文不見此言考六經之傳亦無此語夫顔淵能見千里之外與聖人同孔子諸子何諱不言蓋人目之所見不過十里過此不見非所明察遠也傳曰太山之高巍然去之百里不見螺逺也案魯去吳千有餘里使離朱望之終不能見况使顔淵何能審之如才庶㡬者明目異於人則世宜稱亞聖不宜言離朱人目之視也物大者易察小者難審使顔淵處昌門之外望太山之形終不能見况從太山之上察白馬之色色不能見明矣非顔淵不能見孔子亦不能見也何以驗之耳目之用均也目不能見百里則耳亦不能聞也陸賈曰離婁之明不能察帷薄之内師曠之聰不能聞百里之外昌門之與太山非直帷薄之内百里之外也秦武王與孟説舉鼎不任絶脉而死舉鼎用力力由筋脉筋脉不堪絶傷而死道理宜也今顔淵用目望逺望逺目睛不任宜盲眇髮白齒落非其致也髪白齒落用精於學勤力不休}
