  - {type: 'tls:seg', offset: 3, content: '', id: KR3j0080_tls_004-1a.3}
  - {type: variant, offset: 3, length: 1, content: 凡, SBCK: 舜巡狩東至岱宗南至霍山西至太華北至恒山以為四嶽者四方之中諸侯之來並㑹嶽下幽深逺近無不見者聖}
  - {type: page-break, offset: 3, content: '', id: KR3j0080_SBCK_004-4a}
  - {type: variant, offset: 3, length: 1, content: 凡, WYG: 舜巡狩東至岱宗南至霍山西至太華北至恒山以為四嶽者四方之中諸侯之來並㑹嶽下幽深逺近無不見者聖}
  - {type: variant, offset: 3, length: 1, content: 凡, krp: 舜巡狩東至岱宗南至霍山西至太華北至恒山以為四嶽者四方之中諸侯之來並㑹嶽下幽深逺近無不見者聖}
  - {type: variant, offset: 5, length: 2, content: 稟命, SBCK: 舉事求其宜適也禹王如舜事無所改巡狩所至以復如舜舜至蒼梧禹到㑹稽非其實也實舜禹之時鴻水未治堯傳於舜舜受為帝與禹分部行治鴻水堯崩之後舜老亦以傳於禹舜南治水死於蒼梧禹東治水死於㑹稽賢聖家天下故因葬焉吳君高說㑹稽本山名夏禹巡守㑹計於此山因以名郡故曰㑹稽夫言因山名郡可也言禹巡狩㑹計於此山虛也巡狩本不至㑹稽安得㑹計於此山宜聽君高之説誠㑹稽為㑹計禹到南方何所㑹計如禹始東死於㑹稽舜亦巡狩至於蒼梧安所㑹計百王治定則出巡巡則輒㑹計是則四方之山皆㑹計也百王太平升封太山太山之上封可見者七十}
  - {type: page-break, offset: 5, content: '', id: KR3j0080_SBCK_004-4b}
  - {type: variant, offset: 5, length: 2, content: 稟命, WYG: 舉事求其宜適也禹王於舜事無所改巡狩所至亦復如舜舜至蒼梧禹到㑹稽非其實也實舜禹之時鴻水未治堯傳於舜舜受為帝與禹分部行治鴻水堯崩之後舜老亦以傳於禹舜南治水死於蒼梧禹東治水死於㑹稽賢聖家天下故因葬焉吳君高說㑹稽本山名夏禹巡守㑹計於此山因以名郡故曰㑹稽夫言因山名郡可也言禹巡狩㑹計於此山虛也巡狩本不至㑹稽安得㑹計於此山宜聽君高之説誠㑹稽為㑹計禹到南方何所㑹計如禹始東死於㑹稽舜亦巡狩至於蒼梧安所㑹計百王治定則出巡巡則輒㑹計是則四方之山皆㑹計也百王太平升封太山太山之上封可見者七十}
