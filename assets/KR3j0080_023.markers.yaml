  - {type: variant, offset: 23, length: 0, content: '', SBCK: 如謂杜伯爲鬼則夫死者審有知如有知而薄葬之是怒死人也情欲厚而惡薄以薄受死者之責雖右鬼其何益哉如以鬼非死人則其信杜伯非也如以鬼是死人則其薄葬非也術用乖錯首尾相違故以爲非非與是不明皆不可行夫如是}
