  - {type: variant, offset: 2253, length: 175, content: 圖象如有形不得謂之神謂之神龍升天實事者謂之不然以人時或見龍之形也以其形見故圖畫升龍之形也以其可畫故有不神之實難曰人亦見鬼之形鬼復神乎曰人時見鬼有見雷公者乎鬼名曰神其行蹈地與人相似雷公頭不懸於天足不蹈於地安能為雷公飛者皆有翼物無翼而飛謂仙人畫仙人之形為之作翼如雷公與仙人同宜復著翼使雷公不飛圖雷家言其飛非也使實飛不為著翼又非也夫如是圖雷之家畫雷之狀皆虛, SBCK: 虚}
