  - {type: variant, offset: 3, length: 0, content: '', SBCK: 薄葬篇四諱篇譋時篇言毒篇或問曰天地之間萬物之性含血之蟲有蝮虵蜂蠆咸懐毒螫犯中人身謂護疾痛當時不救流徧一身草木之中有巴豆野葛食之湊懣頗多殺人不知此物稟何氣於天萬物之生皆稟元氣元氣之中有毒螫乎曰夫毒太陽之熱氣也中人人毒人食湊懣者其不堪任也不堪任則謂之毒矣太陽火氣常爲毒螫氣熱也太陽之地人民促急促急之人口舌爲毒故楚越之人促急捷疾與人談言口唾射人則人脤胎腫而爲創南郡極熱之地其人祝樹樹枯唾鳥鳥墜巫咸能以祝延人之疾愈人之禍者生於江南含烈氣也夫毒陽氣也故其中人若火灼人或爲蝮所中割肉置地焦沸火氣之騐也四方極皆爲維􅁁唯東南隅有温烈氣温烈氣發常以春夏春夏陽起東南隅陽位也他物之氣入人鼻目不能疾痛火煙入鼻鼻疾入目目痛火氣有烈也物爲靡屑者多唯一火最烈火氣所燥也食甘㫖之食無傷於人食蜜少多則令人毒蜜爲蜂液蜂則陽物也人行無所觸犯體無故痛痛處若箠杖之跡人腓腓謂鬼敺之鬼者太陽之妖也微者疾謂之􅁁其治用蜜與丹蜜丹陽物以類治之也夫治風用風治熱用熱治邊用蜜丹則知􅁁者陽氣所爲流毒所加也天地之間毒氣流行人當其衝則面腫疾世人謂之火流所刺也人見鬼者言其色赤太陽妖氣自如其色也鬼爲烈毒犯人輙死故杜伯射周宣立崩鬼所賫物陽火之類杜伯弓矢其色皆赤南道名毒曰短狐杜伯之象執弓而射陽氣因而激激而射故其中人象弓矢之形火困而氣熱血毒盛故食走馬之肝殺人氣困爲熱也}
