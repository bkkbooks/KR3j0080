  - {type: variant, offset: 2167, length: 0, content: '', SBCK: 鬼神之害凶醜之禍世諱作豆醬惡聞雷一人不食欲使人急作不欲積家踰至春也諱厲刀井上恐刀墮井中也或說以爲刑之字井與刀也厲刀井上井刀相見恐被刑也毋承屋檐而坐恐瓦墮擊人首也毋反懸冠爲似死人服或說惡其反而承塵溜也毋偃寢爲其象屍也毋以箸相受爲其不固也毋相代掃爲脩冡之人兾人求代已也諸言毋者教人重慎勉人爲善禮曰毋􅅮飯毋流歠禮義之禁未必吉凶之言也譋時篇世俗起土興功嵗月有}
