  - {type: variant, offset: 7, length: 9, content: 雷電迅疾擊折樹木壞, WYG: 求卜迎醫兾禍消藥有益也既死之後雖審如巫咸良如扁鵲終不復生何則知死氣絶終無補益治死無益厚葬何差乎倍死恐傷化絶卜拒醫獨不傷義乎親之生也坐之高堂之上其死也葬之黄泉之下黄泉之下非人所居然而葬之不疑者以死絶異處不可同也如當亦如生存恐人倍之宜葬於宅與生同也不明無知爲人倍其親獨明葬黄泉不爲離其先乎親在獄中罪疑未定孝子馳走以救其難如罪定法立終無門户雖曽子子騫坐泣而已何則計動無益空爲煩也今死親之魂定無所知與拘親之罪决不可救何以異不明無知恐人倍其先獨明罪定不爲忽其親乎聖人立義有益於化雖小弗除無補於政雖大弗與今厚死人何益於恩倍之弗事何損於義孔子又謂爲明器不成示意有明俑則偶人象類生人故魯用偶人葬孔子嘆睹用人殉之兆也故嘆以痛之即如生當備物不示如生意悉其教用偶人葬恐後用生殉用明器獨不爲後用善器葬乎絶用人之源不防喪物之路重人不愛用痛人不憂國傳議之所失也救漏防者悉塞其穴則水泄絶穴不悉塞水有所漏漏則水爲患害論死不悉則奢禮不絶不絶則喪物索用用索物喪民貧耗之至危亡之道也蘇秦為燕使齊國之民高大邱冡多藏財物蘇秦身弗以勸勉之財盡民貧國空兵弱燕軍卒至無以自衛國破城亡主出民散今不明死之無知使民自竭以厚葬親與蘇秦奸計同一}
