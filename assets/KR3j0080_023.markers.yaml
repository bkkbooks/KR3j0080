  - {type: variant, offset: 345, length: 273, content: 火乎且口著乎體口之動與體俱當擊折之時聲著于地其衰也聲著于天夫如是聲著地之時口至地體亦宜然當雷聲迅疾之時仰視天不見天之下不見天之下則夫隆隆之聲者非天怒也天之怒與人無異人怒身近人則聲疾遠人則聲微今天聲近其體遠非怒之實也且雷聲迅疾之時聲東西或南北如天怒體動口東西南北仰視天亦宜東西南北或曰天已東西南北矣雲雨冥晦人不能見耳夫千里不同風百里不共雷易曰震驚百里雷電之地雷雨晦冥百里之外無雨之處宜見天之東西南北也口著於天天宜隨口口一移普天皆移非獨雷雨之地天隨口動也且所謂怒者誰也天神邪蒼蒼之天也如謂天神神怒無聲如謂蒼蒼之天天者體不怒怒用口且天地相與夫婦也其即民, SBCK: 精熾熱烈厭勝}
