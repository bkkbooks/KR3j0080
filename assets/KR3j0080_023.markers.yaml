  - {type: variant, offset: 52, length: 0, content: '', SBCK: 所居處三者於人吉凶冝等西益宅不祥西益墓與田不言不祥夫墓死人所居因忽不慎田非人所處不設尊卑宅者長㓜所共加慎致意者何可不之諱義詳於宅略於墓與田也二曰諱被刑爲徒不上丘墓但知不可不能知其不可之意問其禁之者不能知其諱受禁行者亦不要其忌連相放效至或于被刑父母死不送葬若至墓側不敢臨葬甚失至於不行弔傷見佗人之柩夫徒善人也被刑謂之徒丘墓之上二親也死亡謂之先宅與墓何别親與先何異如以徒被刑先人責之則不冝入宅與親相見如徒不得與死人相見則親死在堂不得哭柩如以徒不得升丘墓則徒不得上山陵世俗禁之執據何義實說其意徒不上丘墓有二義義理之諱非凶惡之忌也徒用心以爲先祖全而生之子孫亦當全而歸之故曽子有疾召門弟子曰開予足開予手而今而後吾知免夫小子曽子重慎臨絶效全喜免毁傷之禍也孔子曰身體髪膚受之父母弗敢毁傷孝者怕入刑辟刻畫身體毁傷髪膚少徳泊行不戒慎之所致也愧負刑辱深自刻責故不升墓祀於先古禮廟祭今俗墓祀故不升墓慙負先人一義也墓者鬼神所在祭祀之處祭祀之禮齊戒潔清重之至也今已被刑刑殘之人不宜與祭供侍先人卑謙謹敬退讓自賤之意也緣先祖之意見子孫被刑惻怛憯傷恐其臨祀不忍歆享故不上墓二義也昔太伯見王季有聖子文王知太王意欲立之入吳采藥斷髮文身以隨吳俗太王薨太伯還王季辟主太伯再讓王季不聽三讓曰吾之吳越吳越之俗斷髮文身吾刑餘之人不可爲宗廟社稷之主王季知不可權而受之夫徒不上丘墓太伯不爲主之義也是謂祭祀不可非謂柩當葬身不送也葬死人先祖痛見刑人先祖哀權可哀之身送可痛之屍使先祖有知痛屍哀形何愧之有如使無知丘墓田野也何慙之有慙愧先者謂身體刑殘與人異也古者用刑形毁不全乃不可耳方今象刑象刑重者髠鉗之法也若完城旦以下施刑綵衣系躬冠帶與俗人殊何爲不可世俗信而謂之皆凶其失至於不弔鄉黨屍不升佗人之丘惑也三曰諱婦人乳子以爲不吉將舉吉事入山林逺行度川澤者皆不與之交通乳子之家亦忌惡之丘墓廬道畔踰月乃入惡之甚也暫卒見若爲不吉極原其事何以爲惡夫婦人之乳子也子含元氣而出元氣天地之精微也何凶而惡之人物也子亦物也子生與萬物之生何以異諱人之生謂之惡萬物之生又惡之乎生與胞俱出如以胞爲不吉人之有胞猶木實之有扶也包裹兒身因與俱出若鳥卵之有觳何妨謂之惡如惡以爲不吉則諸生物有扶殻者宜皆惡之萬物廣多難以驗事人生何以異於六畜皆含血氣懐子子生與人無異獨惡人而不憎畜豈以人體大氣血盛乎則夫牛馬體大於人凡可惡之事無與鈞等獨有一物不見比類乃可疑也今六畜與人無異其乳皆同一狀六畜與人無異諱人不諱六畜不曉其故也世能别人之産與六畜之乳吾將聽其諱如不能别則吾謂世俗所諱妄矣且凡人所惡莫如腐臰腐臰之氣敗傷人心故鼻聞臰口食腐心損口惡霍亂嘔吐夫更衣之室可謂臰矣鮑魚之肉可謂腐矣然而有甘之更衣之室不以爲忌肴食腐魚之肉不以爲諱意不存以爲惡故不計其可與不也凡可憎惡者若濺墨漆附著人身今目見􅈹聞一過則已忽亡輒去何故惡之出見負豕於塗腐澌於溝不以爲凶者洿辱自在彼人不著已之身也今婦人乳子自在其身齋戒之人何故忌之江北乳子不出房室知其無惡也至於犬乳置之宅外此復惑也江北諱犬不諱人江南諱人不諱犬謡俗防惡各不同也夫人與犬何以異房室宅外何以殊或惡或不惡或諱或不諱世俗防禁竟無經也月之晦也日月合宿紀爲一月猶八日月中分謂之弦十五日日月相望謂之望三十日日月合宿謂之晦晦與弦望一實也非月晦日月光氣與月朔異也何故踰月謂之吉乎如實凶踰月未可謂吉如實吉雖未踰月猶爲可也實􅀃諱忌産子乳犬者欲使人常自㓗清不欲使人被汚辱也夫自潔清則意精意精則行清行清而貞廉之節立矣四曰諱舉正月五月子以爲正月五月子殺父與母不得已舉之父母禍死則信而謂之真矣夫正月五月子何故殺父與母人之含氣在腹腸之内其生十月而産共一元氣也正與二月何殊五與六月何異而謂之凶也世傳此言乆拘數之人莫敢犯之􅀪識大材實核事理深睹吉凶之分者然後見之昔齊相田嬰賤妾有子名之曰文文以五月生嬰告其母勿舉也其母竊舉生之及長其母因兄弟而見其子文於嬰嬰怒曰吾令女去此子而敢生之何也文頓首因曰君所}
