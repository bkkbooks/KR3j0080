  - {type: variant, offset: 2429, length: 169, content: 也且說雷之家謂雷天怒呴吁也圖雷之家謂之雷公怒引連鼓也審如說雷之家則圖雷之家非審如圖雷之家則說雷之家誤二家相違也并而是之無是非之分無是非之分故無是非之實無以定疑論故虛妄之論勝也禮曰刻尊為雷之形一出一入一屈一伸為相校軫則鳴校軫之狀鬱律嵔壘之類也此象類之矣氣相校軫分裂則隆隆之聲校軫之音也魄然若襒裂者氣射之聲也氣射中人人則死矣實說雷者太陽之激氣, SBCK: 迷}
