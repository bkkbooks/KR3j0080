  - {type: variant, offset: 1202, length: 876, content: 違賞罰乖也且怒喜具形亂也惡人為亂怒罰其過罰之以亂非天行也冬雷人謂之陽氣洩春雷謂之陽氣發夏雷不謂陽氣盛謂之天怒竟虛言也人在天地之間物也物亦物也物之飲食天不能知人之飲食天獨知之萬物於天皆子也父母於子恩德一也豈為貴賢加意賤愚不察乎何其察人之明省物之闇也犬豕食人以腐臭食之天不殺也如以人貴而獨禁之則鼠洿人飲食人不知誤而食之天不殺也如天能原鼠則亦能原人人誤以不潔淨飲食人人不知而食之耳豈故舉腐臭以予之哉如故予之人亦不肯食呂后斷戚夫人手去其眼置於廁中以為人豕呼人示之人皆傷心惠帝見之疾臥不起呂后故為天不罰也人誤不知天輒殺之不能原誤反而貰故天治悖也夫人食不淨之物口不知人其洿也如食己知之名曰腸洿戚夫人入廁身體辱之與洿何以別腸之與體何以異為腸不為體傷洿不病辱非天意也且人聞人食不清之物心平如故觀戚夫人者莫不傷心人傷天意悲矣夫悲戚夫人則怨呂后案呂后之崩未必遇雷也道士劉春熒惑楚王英使食不清春死未必遇雷也建初四年夏六月雷擊殺會稽鄞專日食羊五頭皆死夫羊有何陰過而雷殺之舟人洿溪上流人飲下流舟人不雷死天神之處天猶王者之居也王者居重關之內則天之神宜在隱匿之中王者居宮室之內則天亦有太微紫宮軒轅文昌之坐王者與人相遠不知人之陰惡天神在四宮之內何能見人闇過王者聞人過以人知天知人惡亦宜因鬼使天問過於鬼神則其誅之宜使鬼神如使鬼神則天怒鬼神也非天也且王斷刑以秋天之殺用夏此王者用刑違天時奉天而行其誅殺也宜法象上天天殺用夏王誅以秋天人相違非奉天之義也或論曰飲食人不潔淨天之大惡也殺大惡不須時王者大惡謀反大逆無道也天之大惡飲食人不潔清天之所惡小大不均等也如小大同王者宜法天制飲食人不潔清之法為死刑也聖王有天下制刑不備此法聖王闕略有遺失也或論曰鬼神治陰王者治陽陰過闇昧人不能覺故使鬼神主之曰陰過非一也何不盡殺案一過非治陰之義也天怒不旋日人怨不旋踵人有陰過或時有用冬未必專用夏也以冬過誤不輒擊殺遠至於夏非不旋日之意也圖畫之工圖雷之狀纍纍如連鼓之形又圖一人若力士之容謂之雷公使之左手引連鼓右手推之若擊之狀其意以為雷聲隆隆者連鼓相扣擊之音也其魄然若敝裂者椎所擊之聲也其殺人也引連鼓相椎并擊之矣世人信之, SBCK: 放傚}
