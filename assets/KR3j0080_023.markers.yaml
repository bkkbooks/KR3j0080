  - {type: variant, offset: 157, length: 187, content: 為隆隆者天怒呴吁之聲也此便於罰過不宜於取龍罰過天怒可也取龍龍何過而怒之如龍神天取之不宜怒如龍有過與人同罪殺龍而已何為取也殺人怒可也取龍龍何過而怒之殺人不取殺龍取之人龍之罪何別而其殺之何異然則取龍之說既不可聽罰過之言復不可從何以效之案雷之聲迅疾之時人仆死於地隆隆之聲臨人首上故得殺人審隆隆者天怒乎怒用口口之怒氣殺人也口之怒氣安能殺人人為雷所殺詢其身體若燔灼之狀也如天用口怒口怒, SBCK: ''}
