  - {type: variant, offset: 633, length: 424, content: 哭乎今天怒殺人地宜哭之獨聞天之怒不聞地之哭如地不能哭則天亦不能怒且有怒則有喜人有陰過亦有陰善有陰過天怒殺之如有陰善天亦宜喜以賞之隆隆之聲謂天之怒亦如天之喜哂然而笑人有喜怒故謂天喜怒推人以知天知天本於人如人不怒則亦無緣謂天怒也緣人以知天宜盡人之性人性怒則呴吁喜則歌笑比聞天之怒希聞天之喜比見天之罰希見天之賞豈天怒不喜希貪於罰於賞哉何怒罰有效喜賞無驗也且雷之擊也折木壞屋時犯殺人以為天怒時或徒雷無所折敗亦不殺人天空怒乎人君不空喜怒喜怒必有賞罰無所罰而空怒是天妄也妄則失威非天行也政事之家以寒溫之氣為喜怒之候人君喜即天溫怒則天寒雷電之日天必寒也高祖之先劉媼曾息大澤之陂夢與神遇此時雷電晦冥天方施氣宜喜之時也何怒而雷如用擊折者為怒不擊折者為喜則夫隆隆之聲不宜同音人怒喜異聲天怒喜同音與人乖異則人何緣謂之天怒且飲食人以不潔淨小過也以至尊之身親罰小過非尊者之宜也尊不親罰過故王不親誅罪天尊於王親罰小過是天德劣於王也且天之用心猶人之用意人君罪惡初聞之時怒以非之及, SBCK: 堪將受}
