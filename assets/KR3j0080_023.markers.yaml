  - {type: variant, offset: 3357, length: 1, content: 足, SBCK: 食人天地之間百神所食聖人謂當與人等推生事死推人事鬼故百神之祀皆用衆物無用人者物食人者虎與狼也嵗月之神豈虎狼之精哉倉卒之世榖食乏匱人民饑餓自相啖食豈其啖食死者其精爲嵗月之神哉嵗月有神日亦有神嵗食月食日何不食積日爲月積月爲時積時爲嵗千五百三十九嵗爲一統四千六百一十七嵗爲一元増積相倍之數分餘終竟之名耳安得鬼神之怪禍福之驗乎如嵗月終竟者冝有神則四時有神綂元有神月三日魄八日􅁌十五日望與嵗月終竟何異嵗月有神魄與􅁌復有神也一日之中分爲十二時平旦寅日出夘也十二月建寅夘則十二月時所加寅夘也日加十二辰不食月建十二辰獨食豈日加無神月建獨有哉何故月建獨食日加不食乎如日加無神用時決事非也如加時有神獨不食非也神之口腹與人等也人饑則食飽則止不爲起功乃一食也嵗月之神起功乃食一嵗之中興功者希嵗月之神饑乎倉卒之世人民亡室宅荒廢興功者絶嵗月之神餓乎且田與宅俱人所治興功用力勞佚鈞等宅掘土而立木田鑿溝而起堤堤與木俱立掘與鑿俱爲起宅嵗月食治田獨不食豈起宅時嵗月饑治田時飽乎何事鈞作同飲食不等也􅀃歳月食之家必銓功之小大立遠近之歩數假令起三尺之功食一歩之内起十丈之役食一里之外功有小大禍有近遠􅀩恬爲秦築長城極天下之半則其爲禍冝}
