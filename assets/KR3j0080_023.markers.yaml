  - {type: variant, offset: 40, length: 0, content: '', SBCK: 益宅徒爲煩擾則西益宅祥與不祥未可知也令史質睢以爲西益宅審不祥則史與質雎與今俗人等也夫宅之四面皆地也三面不謂之㐫益西面獨謂不祥何哉西益宅何傷於地體何害於宅神西益不祥損之能善乎西益不祥東益能吉乎夫不祥必有祥者猶不吉必有吉矣宅有形體神有吉凶動徳致福}
