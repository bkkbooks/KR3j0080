  - {type: variant, offset: 2695, length: 305, content: 火氣激襒裂若雷之音矣或近之必灼人體天地為鑪大矣陽氣為火猛矣雲雨為水多矣分爭激射安得不迅中傷人身安得不死當冶工之消鐵也以土為形燥則鐵下不則躍溢而射射中人身則皮膚灼剝陽氣之熱非直消鐵之烈也陰氣激之非直土泥之濕也激氣中人非直灼剝之痛也夫雷火也火氣剡人人不得無迹如炙處狀似文字人見之謂天記書其過以示百姓是復虛妄也使人盡有過天用雷殺人殺人當彰其惡以懲其後明著其文字不當闇昧圖出於河書出於洛河圖洛書天地所為人讀知之今雷死之書亦天所為也何故難知如以一人皮不可書魯惠公夫人仲子宋武公女也生而有文在掌曰為魯夫人文明可知故仲子歸魯雷書不著故難以懲後夫如是火剡之跡非天所刻畫也或頗有而增其語或無有而空生其言虛妄之俗好造怪奇何以驗之雷, SBCK: ''}
