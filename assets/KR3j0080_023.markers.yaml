  - {type: variant, offset: 5, length: 0, content: '', SBCK: 暴行暑暍而死熱極爲毒也人疾行汗出對鑪汗出嚮日亦汗出疾温病者亦汗出四者異事而皆汗出困同熱等火日之變也天下萬物含太陽氣而生者皆有毒螫毒螫渥者在蟲則爲蝮蛇蜂蠆在草則爲巴豆冶野字一作葛在魚則爲鮭與􅯚䱙故人食鮭肝而死爲􅯚䱙螫有毒魚與鳥同類故鳥蜚魚亦蜚鳥卵魚亦卵蝮蛇蜂蠆皆卵同性類也其在人也爲小人故小人之口爲禍天下小人皆懐毒氣陽地小人毒尤酷烈故南越之人祝誓輙效諺曰衆口爍金口者火也五行二曰火五事二曰言言與火直故云爍金道口舌之爍不言㧞木熖火必云爍金金制於火火口同類也藥生非一地太伯辭之吳鑄多非一工世稱楚棠溪温氣天下有路畏入南海鴆鳥生於南人飮鴆死辰爲龍巳爲蛇辰巳之位在東南龍有毒蛇有螫故蝮有利牙龍有逆鱗木生火火爲毒故蒼龍之獸含火星冶葛巴豆皆有毒螫故冶在東南巴在西南土地有燥濕故毒物有多少生出有處地故毒有烈不烈蝮虵與魚比故生於草澤蜂蠆與鳥同故産於屋樹江北地燥故多蜂蠆江南地濕故多蝮虵生高燥比陽陽物懸垂故蜂蠆以尾㓨生下濕比隂隂物柔伸故蝮虵以口齰毒或藏於首尾故螫齰有毒或藏於體膚故食之輒懣或附於脣吻故舌鼓爲禍毒螫之生皆同一氣發動雖異内爲一類故人夢見火占爲口舌夢見蝮蛇亦口舌火爲口舌之象口舌見於蝮虵同類共本所稟一氣也故火爲言言爲小人小人爲妖由口舌口舌之徵由人感天故五事二曰言言之咎徴僣恒暘若僣者奢麗故蝮蛇多文文起於陽故若致文暘若則言從故時有詩妖妖氣生美好故美好之人多邪惡叔虎之母美叔向之母知之不使視寢叔向諫其母曰深山大澤實生龍虵彼美吾懼其生龍虵以禍汝汝弊族也國多大寵不仁之人間之不亦難乎余何愛焉使徃視寢生叔虎美有勇力嬖於欒懐子及范宣子逐懐子殺叔虎禍及叔向夫深山大澤龍虵所生也比之叔虎之母者美色之人懐毒螫也生子叔虎美有勇力勇力所生生於美色禍難所發由於勇力火有光耀木有容貎龍虵東方木含火精故美色貎麗膽附於肝故生勇力火氣猛故多勇木剛强故多力也生妖怪者常由好色爲禍難者常發勇力爲毒害者皆在好色美酒為毒酒難多飲蜂液爲蜜蜜難益食勇夫强國勇夫難近好女說恱一作心好女難畜辯士快意辯士難信故美味腐腹好色惑心勇夫招禍辯口致殃四者世之毒也辯口之毒爲害尤酷何以明之孔子見陽虎却行白汗交流陽虎辯有口舌口舌之毒中人病也人中諸毒一身死之中於口舌一國潰亂詩曰讒言罔極交亂四國四國猶亂况一人乎故君子不畏虎獨畏讒夫之口讒夫之口爲毒大矣薄葬篇聖賢之業皆以薄葬省用爲務然而世尚厚葬有奢泰之失者儒家論不明墨家議之非故也墨家之議右鬼以爲人死輒爲神鬼而有知能形而害人故引杜伯之類以爲效驗儒家不從以爲死人無知不能爲鬼然而賻祭備物者示不負死以觀生也陸賈依儒家而說故其立語不肯明處劉子政舉薄葬之奏務欲省用不能極論是以世俗内持狐疑之議外聞杜伯之類又見病且終者墓中死人來與相見故遂信是謂死如生閔死獨葬魂孤無副丘墓閉藏穀物乏匱故作偶人以侍尸柩多藏食物以歆精魂積浸流至或破家盡業以充死棺殺人以殉葬以快生意非知其内無益而奢侈之心外相慕也以爲死人有知與生人無以異孔子非之而亦無以定實然而陸賈之論兩無所處劉子政奏亦不能明儒家無知之驗墨家有知之故事莫明於有效論莫定於有證空言虚語雖得道心人猶不信是以世俗輕愚信禍福者畏死不懼義重死不顧生竭財以事神空家以送終辯士文人有效驗若墨家之以杜伯爲據則死無知之實可明薄葬省財之教可立也今墨家非儒儒家非墨各有所持故乖不合業難齊同故二家爭論世無祭祀復生之人故死生之義未有所定實者死人闇昧與人殊途其實荒忽難得深知有知無知之情不可定爲鬼之實不可是通人知士雖博覽古今窺渉百家條入葉貫不能審知唯聖心賢意方比物類爲能實之夫論不留精澄意茍以外效立事是非信聞見於外不詮訂於内是用耳目論不以心意議也夫以耳目論則以虚象爲言虚象效則以實事爲非是故是非者不徒耳目必開心意墨議不以心而原物茍信聞見則雖效驗章明猶爲失實失實之議難以教雖得愚民之欲不合知者之心喪物索用無益於世此蓋墨術所以不傳也魯人將以璵璠歛孔子聞之徑庭麗級而諫夫徑庭麗級非禮也孔子爲救患也患之所由常由有所貪璵璠寳物也魯人用歛姦人僴之欲心生矣姦人欲生不畏罪法不畏罪法則丘墓抽矣孔子睹微見著故徑庭麗級以救患直諫夫不明死人無知之義而著丘墓必抽之諫雖盡比干之執人人必不聽何則諸侯財多不憂貧威彊不懼抽死人之議狐疑未定孝子之計從其重者如明死人無知厚葬無益論定議立較著可聞則璵璠之禮不行徑庭之諌不發矣今不明其說而彊其諫此蓋孔子所以不能立其教孔子非不明死生之實其意不分别者亦陸賈之語指也夫言死無知則臣子倍其君父故曰喪祭禮廢則臣子恩泊臣子恩泊則倍死亡先倍死亡先則不孝獄多聖人懼開不孝之源故不明死無知之實異道不相連事生厚化自生雖事死泊何損於化使死者有知倍之非也如無所知倍之何損明其無知未必有倍死之害不明無知成事已有賊生之費孝子之養親病也未死}
