  front:
  - {type: variant, offset: 0, length: 0, content: '', SBCK: 論衡卷第六王充福虚篇禍虚篇龍虚篇雷虛篇福虚篇世論行善者福至爲惡者禍來福禍之應皆天也人爲之天應之陽恩人君賞其行隂惠天地報其徳無貴賤賢愚莫謂不然徒見行事有其文傳又見善人時遇福故遂信之謂之實然斯言或時賢聖欲勸人爲善著必然之語以明德報或福時適遇者以爲然如實論之安得福祐乎楚惠王食寒􅉁而得蛭因遂吞之腹有疾而不能食令尹問王安得此疾也王曰我食寒葅而得蛭念譴之而不行其罪乎是廢法而威不立也非所以使國人聞之也譴而行誅乎則庖厨監食者法皆當死心又不忍也吾恐左右見之也因遂吞之令尹避席再拜而賀曰臣聞天道無親唯徳是輔王有仁徳天之所奉也病不為傷是夕也惠王之後而蛭出及乆患心腹之積皆愈故天之親徳也可謂不察乎曰此虚言也案惠王之吞蛭不肖之主也有不肖之行天不祐也何則惠王不忍譴蛭恐庖厨監食法皆誅也一國之君專擅賞罰而赦人君所爲也惠王通譴葅中何故有蛭庖厨監食皆當伏法然能終不以飲食行誅於人赦而不罪惠莫大焉庖厨罪覺而不誅自新而改後惠王赦細而活微身安不病今則不然强食害己之物使監食之臣不聞其過失御下之威無禦非之心不肖一也使庖厨監食失甘苦之和若塵土落於葅中大如蟣虱非意所能覽非目所能見原心定罪不明其過可謂惠矣今蛭廣有分數長有寸度在寒葅中眇目之人猶將見之臣不畏敬擇濯不謹罪過至重惠王不譴不肖二也葅中不當有蛭不食投地如恐左右之見懷屏隱匿之處足以使蛭不見何必食之如不可食之物誤在葅中可復隱匿而强食之不肖三也有不肖之行而天祐之是天報祐不肖人也不忍譴蛭世謂之賢賢者操行多若吞蛭之類吞蛭天除其病是則賢者常無病也賢者德薄未足以言聖人純道操行少非爲推不忍之行以容人之過必衆多矣然而武王不豫孔子疾病天之祐人何不實也或時惠王吞蛭蛭偶自出食生物者無有不死腹中熱也初吞蛭時未死而腹中熱蛭動作故腹中痛須㬰蛭死腹中痛亦止蛭之性食血恵王心腹之積殆積血也故食血之蟲死而積血之病愈猶狸之性食䑕人有䑕病吞狸自愈物類相勝方藥相使也食蛭蟲而病愈安得怪乎食生物無不死死無不出之後蛭出安得祐乎令尹見􅒟王有不忍之徳知蛭入腹中必當死出臣因再拜賀病不為傷著已知來之徳以喜惠王之心是與子韋之言星徙太卜之言地動無以異也宋人有好善行者三世不解家無故黒牛生白犢以問孔子孔子曰此吉祥也以享鬼神即以犢祭一年其父無故而盲牛又生白犢其父又使其子問孔子孔子曰吉祥也以享鬼神復以犢祭一年其子無故而盲其後楚攻宋圍其城當此之時易子而食之㭊骸而炊之此獨以父子俱盲之故得毋乗城軍罷圍解父子俱視此修善積行神報之效也曰此虛言也夫宋人父子修善如此神報之何必使之先盲後視哉不盲常視不能䕶乎此神不能護不盲之人則亦不能以盲護人矣使宋楚之君合戰頓兵流血僵尸戰夫禽獲死亡不還以盲之故得脫不行可謂神報之矣今宋楚相攻兩軍未合華元子反結言而退二軍之衆並全而歸兵矢之刃無頓用者雖有乗城之役無死亡之患為善人報者為乗城之間乎使時不盲亦猶不死盲與不盲俱得脫免神使之盲何益於善當宋國乏糧之時也盲人之家豈獨冨哉俱與乗城之家易子㭊骸反以窮厄獨盲無見則神報祐人失善惡之實也宋人父子前偶自以風寒發盲圍解之後盲偶自愈世見父子修善又用二白犢祭宋楚相攻獨不乗城圍解之後父子皆視則謂修善之報獲鬼神之祐矣楚相孫叔敖為兒之時見兩頭虵殺而埋之歸對其母泣母問其故對曰我聞見兩頭虵死向者出見兩頭虵恐去母死是以泣也其母曰今虵何在對曰我恐後人見之即殺而埋之其母曰吾聞有隂徳者天必報之汝必不死天必報汝叔敖竟不死遂為楚相埋一虵獲二祐天報善明矣曰此虛言矣夫見兩頭虵輒死者俗言也有隂徳天報之福者俗議也叔敖信俗言而埋虵其母信俗議而必報是謂死生無}
