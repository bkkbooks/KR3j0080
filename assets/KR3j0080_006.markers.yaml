  - {type: variant, offset: 28, length: 1, content: 子, WYG: 害未有非立為帝未有是前時未到後則命時至也案古人君臣困窮後得逹通未必初有惡天禍其前卒有善神祐其後也一身之行一行之操結髪終死前後無異然一成一敗一進一退一窮一通一全一壞遭遇適然命時當也龍虚篇盛}
