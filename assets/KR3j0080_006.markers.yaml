  - {type: variant, offset: 75, length: 0, content: '', SBCK: 之禍彼欲言其賊賢欺交故受患禍之報也夫韓非何過而爲李斯所幽公子卬何罪而為商鞅所擒車裂誅死賊賢欺交幽死見擒何以致之如韓非公子卬有惡天使李斯商鞅報之則李斯商鞅為天奉誅宜䝉其賞不當受其禍如韓非公子卬無惡非天所罰李斯商鞅不得幽擒論者說曰韓非公子卬有隂惡伏罪人不聞見天獨知之故受戮殃夫諸有罪之人非賊賢則逆道如賊賢則被所賊者何負如逆道則被所逆之道何非凢人窮達禍福之至大之則命小之則時太公窮賤遭周文而得封甯戚隱阨逢齊桓而見官非窮賤隱阨有非而得封見官有是也窮達有時遭遇有命也太公􅑔戚賢者也尚可謂有非聖人純道者也虞舜為父弟所害幾死再三有遇唐堯堯禪舜立為帝嘗見害未有非立為帝未有是前時未到後則命時至也案古人君臣困窮後得逹通未必初有惡天禍其前卒有善神祐其後也一身之行一行之操結髪終死前後無異然一成一敗一進一退一窮一通一全一壞遭遇適然命時當也龍虚篇盛夏之時雷電擊折破樹木發壞室屋俗謂天取龍謂龍藏於樹木之中匿於屋室之間也雷電擊折樹木發壞屋室則龍見於外龍見雷取以升天世無愚智賢不肖皆謂之然如考實之虛妄言也夫天之取龍何意邪如以龍神為天使猶賢臣為君使也反報有時無爲取也如以龍遁逃不還非神之行天亦無用為也如龍之性當在天在天上者固當生子無為復在地如龍有升降降龍生子於地子長大天取之則世名雷電為天怒取龍之子無為怒也且龍之所居常在水澤之中不在木中屋間何以知之叔向之母曰深山大澤實生龍虵傳曰山致其高雲雨起焉水致其深蛟龍生焉傳又言禹渡於江黄龍負船荆次非渡淮兩龍繞舟東海之上有􅫱丘訢作魯􅫱或勇而有力出過神淵使御者飲馬馬飲因没訢怒㧞劎入淵追馬見兩蛟方食其馬手劎擊殺兩蛟由是言之蛟與龍常在淵水之中不在木中屋間明矣在淵水之中則魚鼈之類魚鼈之類何為上天天之取龍何用為哉如以天神乗龍而行神恍惚無形出入無間無為乗龍也如仙人騎龍天為仙者取龍則仙人含天精氣形輕飛騰若鴻鵠之狀無為騎龍也世稱黄帝騎龍升天此言蓋虛猶今謂天取龍也且世謂龍升天者必謂神龍不神不升天升天神之效也天地之性人為貴則龍賤矣貴者不神賤者反神乎如龍之性有神與不神神者升天不神者不能􅀛虵亦有神與不神神􅀛神虵復升天乎且龍稟何氣而獨神天有倉龍白虎朱鳥􅀇武之象也地亦有龍虎鳥􅀛之物四星之精降生四獸虎鳥與􅀛不神龍何故獨神也人爲倮蟲之長龍爲鱗蟲之長俱爲物長謂龍升天人復升天乎龍與人同獨謂能升天者謂龍神也世或謂聖人神而先知猶謂神龍能升天也因謂聖人先知之明論龍之才謂龍升天故其宜也天地之間恍惚無形寒暑風雨之氣乃爲神今龍有形有形則行行則食食則物之性也天地之性有形體之類能行食之物不得爲神何以言之龍有體也傳言鱗蟲三百龍爲之長龍爲鱗蟲之長安得無體何以言之孔子曰龍食於清㳺於清􅀛食於清㳺於濁魚食於濁㳺於清丘上不及龍下不為魚中止其􅀛與山海經言四海之外有乗龍虵之人世俗畫龍之象馬首虵尾由此言之馬虵之類也慎子曰蜚龍乗雲騰虵㳺霧雲罷雨霽與螾蟻同矣韓子曰龍之為蟲也鳴可狎而騎也然喉下有逆鱗尺餘人或嬰之必殺人矣比之為螾蟻又言蟲可狎而騎虵馬之類明矣傳曰紂作象箸而箕子泣泣之者痛其極也夫有象箸必有玉杯玉杯所盈象箸所挾則必龍肝豹胎夫龍肝可食其龍難得難得則愁下愁下則禍生故從而痛之如龍神其身不可得殺其肝何可得食禽獸肝胎非一稱龍肝豹胎者人得食而知其味美也}
