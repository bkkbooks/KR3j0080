  - {type: variant, offset: 6, length: 1, content: 論, krp: 役纒子相見講道纒子稱墨家佑鬼神是引秦穆公有明德上帝賜之九十年纒子難以堯舜不賜年桀紂不夭死堯舜桀紂猶為尚逺且近難以秦穆公晉文公夫諡者行之迹也迹生時行}
