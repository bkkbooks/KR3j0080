  - {type: 'tls:seg', offset: 7, content: '', id: KR3j0080_tls_006-1a.4}
  - {type: variant, offset: 7, length: 0, content: '', WYG: 之虛妄言也夫失明猶失聽也失明則盲失聽則聾病聾不謂之有過失明謂之有罪惑也蓋耳目之病猶心腹之有病也耳目失明聴謂之有罪心腹有病可謂有過乎伯牛有疾孔子自牖執其手曰亡之命矣夫斯人也而有斯疾也原孔子言謂伯牛不幸故傷之也如伯牛以過致疾天報以惡與子夏同孔子冝陳其過若曾子謂子夏之狀今乃言命命非過也且天之罸人猶人君罪下也所罸服罪人君赦之子夏服過拜以自悔天徳至明冝愈其盲如非天罪子夏失明亦無三罪且喪明之病孰與被厲之病喪明有三罪被厲有十過乎顔淵早夭子路葅醢早死葅醢極禍也以喪明言之顔淵子路有百罪也由此言之曾子之言誤矣然子夏之喪明喪其子也子者人情所通親者人所力報也喪親民無聞喪子失其明此恩損於親而愛増於子也增則哭泣無數數哭中風目失明矣曾子因俗之議以著子夏三罪子夏亦縁俗議因以失明故拜受其過曾子子夏未離於俗故孔子門叙行未在上第也秦襄王賜白起劎白起伏劎將自刎曰我有何罪於天乎良乆曰我固當死長平之戰趙卒降者數十萬我詐而盡坑之是足以死遂自殺白起知己前罪服更後罰也夫白起知己所以罪不知趙卒所以坑如天審罰有過之人趙降卒何辜於天如用兵妄傷殺則四十萬衆必有不亡不亡之人何故以其善行無罪而竟坑之卒不得以善蒙天之祐白起何故獨以其罪伏天之誅由此言之白起之言過矣秦二世使使者詔殺蒙恬蒙恬喟然嘆曰我何過於天無罪而死良乆徐曰恬罪故當死矣夫起臨洮屬之遼東城徑萬里此其中不能毋絶地脈此乃恬之罪也即吞藥自殺太史公非之曰夫秦初滅諸侯天下心未定夷傷未瘳而恬為名將不以此時彊諌救百姓之急養老矜孤脩衆庶之和阿意興功此其兄弟遇誅不亦冝乎何與乃罪地脈也夫蒙恬之言既非而太史公非之亦未是何則蒙恬絶脈罪至當死地養萬物何過於人而蒙恬絶其脈知己有絶地脈之罪不知地脈所以絶之過自非如此與不自非何以異太史公為非恬之為名將不能以彊諫故致此禍夫當諫不諫故致受死亡之戮身任李陵坐下蠶室如太史公之言所任非其人故殘身之戮天命而至也非蒙恬以不彊諫故致此禍則已下蠶室有非者矣己無非則其非蒙恬非也作伯夷之傳則善惡之行云七十子之徒仲尼獨薦顔淵好學然回也屢空糟糠不厭卒夭死天之報施善人何如哉盗跖日殺不辜肝人之肉暴戾恣睢聚黨數千横行天下竟以壽終是遵何徳哉若此言之顔回不當早夭盗跖不當全活也不怪顔淵不當夭而獨謂蒙恬當死過矣漢将李廣與望氣王朔燕語曰自漢擊匈奴而廣未嘗不在其中而諸校尉以下才能不及中人然以軍功取侯者數十人而廣不為後人然終無尺寸之功以得見封邑者何也豈吾相不當侯且固命也朔曰將軍自念豈常有恨者乎廣曰吾為隴西太守羌常反吾誘而降之八百餘人吾詐而同日殺之至今恨之獨此矣朔曰禍莫大於殺已降此乃将軍所以不得侯者也李廣然之聞者信之夫不侯猶不王者也不侯何恨不王何負乎孔子不王論者不謂之有負李廣不侯王朔謂之有恨然則王朔之言失論之實矣論者}
