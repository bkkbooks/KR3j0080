  - {type: variant, offset: 39, length: 0, content: '', WYG: 在天上者固當生子無為復在地如龍有升降降龍生子於地子長大天取之則世名雷電為天怒取龍之子無為怒也且龍之所居常在水澤之中不在木中屋間何以知之叔向之母曰深山大澤實生龍虵傳曰山致其高雲雨起焉水致其深蛟龍生焉傳又}
  - {type: variant, offset: 40, length: 0, content: '', WYG: 禹渡於江黄龍負船荆次非渡淮兩龍繞舟東海之上有􅫱丘訢􅫱或作魯勇而有力出過神淵使御者飲馬馬飲因没訢怒㧞劎入淵追馬見兩蛟方食其馬手劎擊殺兩蛟由是言之蛟與龍常在淵水之中不在木中屋間明矣在淵水之中則魚鼈之類魚鼈之類何為上天天之取龍何用為哉如以天神乗龍而行神恍惚}
  - {type: page-break, offset: 40, content: '', id: KR3j0080_WYG_006-14a, image: WYG0862/WYG0862-0077c.png}
  - {type: variant, offset: 41, length: 1, content: 命, WYG: 形出入無間無為乗龍也如仙人騎龍天為仙}
