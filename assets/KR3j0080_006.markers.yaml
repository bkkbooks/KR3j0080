  - {type: variant, offset: 72, length: 0, content: '', SBCK: 日殺之至今恨之獨此矣朔曰禍莫大於殺巳降此乃将軍所以不得侯者也李廣然之聞者信之夫不侯猶不王者也不侯何恨不王何負乎孔子不王論者不謂之有負李廣不侯王朔謂之有恨然則王朔之言失論之實矣論者以爲人之封侯自有天命天命之符見於骨體大将軍衛青在建章宫}
  - {type: variant, offset: 72, length: 0, content: '', krp: 日殺之至今恨之獨此矣朔曰禍莫大於殺巳降此乃将軍所以不得侯者也李廣然之聞者信之夫不侯猶不王者也不侯何恨不王何負乎孔子不王論者不謂之有負李廣不侯王朔謂之有恨然則王朔之言失論之實矣論者以爲人之封侯自有天命天命之符見於骨體大将軍衛青在建章宫}
  - {type: variant, offset: 73, length: 0, content: '', SBCK: 鉗徒相之曰貴至封侯後竟以功封萬戶侯衛青未有功而鉗徒見其當封之證由此言之封侯有命非人操行所能得也鉗徒之言實而有效王朔之言虚而無驗也多横恣而不罹禍順道而違福王朔之說白起自非蒙恬自咎之類也倉卒之世以財利相刼殺者衆同車共船千里為商至闊逈之地殺其人而并取其財尸捐不收骨暴不葬在水為魚鼈之食在土為螻蟻之糧惰窳之人不力農勉商以積穀貨遭歲饑饉腹餓不飽椎人若畜割而食之無君子小人並為魚肉人所不能知吏所不能覺千人以上萬人以下計一聚之中生者百一死者十九可謂無道至痛甚矣}
