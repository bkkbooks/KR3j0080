  - {type: variant, offset: 30, length: 0, content: '', WYG: 之時雷電擊折破樹木發壞室屋俗謂天取龍謂龍蔵於樹木之中匿於屋室之間也雷電擊折樹木發壞屋室則龍見於外龍見雷取以升天世無愚智賢不肖皆謂之然如考實之虛妄}
