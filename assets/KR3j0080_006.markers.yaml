  - {type: variant, offset: 70, length: 1, content: 眾, SBCK: 衆必有不亡不亡之人何故以其善行無罪而竟坈之卒不得以善􅀩天之祐白起何故獨以其罪伏天之誅由此言之白起之言過矣秦二世使使者詔殺蒙恬􅀩恬喟然嘆曰我何過於天無罪而死良乆徐曰恬罪故當死矣夫起臨洮屬之遼東城徑萬里此其中不能毋絶地脉此乃恬之罪也即吞藥自殺太史公非之曰夫秦初滅諸侯天下心未定夷傷未瘳而恬為名將不以此時彊諌救百姓之急養老矜孤脩衆庶之和阿意興功此其子弟過誅不亦冝乎何與乃罪地脉也夫􅀩恬之言既非而太史公非之亦未是何則蒙恬絶脉罪至當死地養萬物何過於人而蒙恬絶其脉知己有絶地脉之罪不知地脉所以絶之過自非如此與不自非何以異太史公為非恬之為名將不能以彊諫故致此禍夫當諫不諫故致受死亡之戮身任李陵坐下蠶室如太史公之言所任非其人故殘身之戮天命而至也非蒙恬以不彊諫故致此禍則已下蠶室有非者矣己無非則其非蒙恬非也作伯夷之傳則善惡之行云七十子之徒仲尼獨薦顔淵好學然回也屢空糟糠不厭卒夭死天之報施善人如何哉盗跖日殺不辜肝人之肉暴戾恣睢聚黨數千横行天下竟以壽終是獨遵何哉若此言之顔回不當早夭盗跖不當全活也不怪顔淵不當夭而獨謂蒙恬當死過矣漢将李廣與望氣王朔燕語曰自漢擊匈奴而廣未常不在其中而諸校尉以下才能不及中然以胡軍功取侯者數十人而廣不為侯後人然終無尺土之功以得見封邑者何也豈吾相不當侯且固命也朔曰將軍自念豈常有恨者乎廣曰吾爲隴西太守羗常反吾誘而降之八百餘人吾詐而}
