  - {type: variant, offset: 82, length: 1, content: 軍, SBCK: 隂過飲食人以不㓗淨天怒擊而殺之隆隆之聲天怒之音若人之呴吁矣世無愚智莫謂不然推人道以論之虛妄之言也夫雷之發動一氣一聲也折木壞屋亦犯殺人犯殺人時亦折木壞屋獨謂折木壞屋者天取龍犯殺人罰隂過與取龍吉凶不同並時共聲非道也論者以爲􅂭􅂭者天怒呴吁之聲也此便於罰過不冝於取龍罰過天怒可也取龍龍何過而怒之如龍神天取之不冝怒如龍有過與人同罪龍殺而巳何爲取也殺人怒可也取龍龍何過而怒之殺人不取殺龍取之人龍之罪何别而其殺之何異然則取龍之􅀃既不可聽罰過之言復不可從何以效之案雷之聲迅疾之時人仆}
