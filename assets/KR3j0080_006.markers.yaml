  - {type: variant, offset: 43, length: 3, content: 聞歷陽, WYG: 取龍則仙人含天精氣形輕飛騰若鴻鵠}
  - {type: variant, offset: 47, length: 1, content: 都, WYG: 狀無為騎龍也世稱黄帝騎龍升天此言蓋虛猶今謂天取龍也且世謂龍升天者必謂神龍不神不升天升天神之效也天地之性人為貴則龍賤矣貴者不神賤者反神乎如龍之性有神與不神神者升天不神者不能龜虵亦有神與不神神龜神虵復升天乎且龍稟何氣而獨神天有倉龍白虎朱鳥𤣥武之象也地亦有龍虎鳥龜之物四星之精降生四獸虎鳥與龜不神龍何故獨神也人為倮蟲之長龍為鱗蟲之長俱為物長謂龍升天人復升天乎龍與人同獨謂能升天者謂龍神也世或謂聖人神而先知猶謂神龍能升天也因謂聖人先知之明論龍之才謂龍升天故其宜也天地之間恍惚無形寒暑風雨之氣乃為神今龍有形有形則行行則食食則物之性也天地之性有形體之類能行食之物不得為神何以言之龍有體也傳言鱗蟲三百龍為之長龍為鱗蟲之長安得無體何以言之孔子曰龍食於清㳺於清龜食於清㳺於濁魚食於濁㳺於清丘上不及龍下不為魚中止其龜與山海經言四海之外有乗龍虵之人世俗畫龍之象馬首虵尾由此言之馬虵之類也慎子曰蜚龍乗雲騰虵㳺霧雲罷雨霽與螾蟻同矣韓子曰龍之為蟲也柔可狎而騎也然喉下有逆鱗尺餘人或嬰之必殺人矣比之為螾蟻又言蟲可狎而騎虵馬之類明矣傳曰紂作象箸而箕子泣泣之者痛其極也夫有象箸必有玉杯玉杯所盈象箸所挾則必龍肝豹胎夫龍肝可食其龍難得難得則愁下愁下則禍生故從而痛之如龍神其身不可得殺其肝何可得食禽獸肝胎非}
