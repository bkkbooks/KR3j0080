  - {type: variant, offset: 99, length: 1, content: 溫, SBCK: 士劉春熒惑楚王英使食不清春死未必遇雷也建初四年夏六月雷擊殺㑹稽靳専日食羊五頭皆死夫羊何隂過而雷殺之舟人洿溪上流人飲下流舟人不雷死天神之處天猶王者之居也王者居重關之内則天之神冝在隱匿之中王者居宫室之内則天亦有太微紫宫軒轅文昌之坐王者與人相逺不知人之隂惡天神在四宫之内何能見人闇過王者聞人過以人知天知人惡亦冝因鬼使天問過於鬼神則其誅之冝使鬼神如使鬼神則天怒鬼神也非天也且王㫁刑以秋天之殺用夏此王者用刑違天時奉天而行其誅殺也宜法象上天天殺用夏王誅以秋天人相違非奉天之義也或論曰飲食不潔淨天之大惡也殺大惡不湏時王者大惡謀反大逆無道也天之大惡飲食人不㓗清天之所惡小大不均等也如小大同王者宜法天制飲食人不㓗清之法為死刑也聖王有天下制刑不備此法聖王闕略有遺失也或論曰鬼神治隂王者治陽隂過闇昩人不能覺故使鬼神主之曰隂過非一也何不盡殺案一過非治隂之義也天怒不旋日人怨不旋踵人有隂過或時有用冬未必專用夏也以冬過誤不輒擊殺逺至於夏非不旋日之意也圖畫之工圖雷之狀纍纍如連皷之形又圖一人若力士之容謂之雷公使之左手引連皷右手推椎若擊之狀其意以爲雷聲隆隆者連皷相扣擊之意也其魄然若敝裂者椎所擊之聲也其殺人也引連皷相椎并擊之矣世又信之莫謂不然如復原之虚妄之象也夫雷非聲則}
