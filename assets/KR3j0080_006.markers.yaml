  - {type: 'tls:seg', offset: 1015, content: '', id: KR3j0080_tls_006-5a.43}
  - {type: variant, offset: 1015, length: 2, content: 行善, SBCK: 火也以人中雷而死即詢其身中頭則鬚髪燒燋中身則皮膚灼燌臨其尸上聞火氣一驗也道術之家以為雷燒石色赤投}
  - {type: variant, offset: 1015, length: 2, content: 行善, krp: 火也以人中雷而死即詢其身中頭則鬚髪燒燋中身則皮膚灼燌臨其尸上聞火氣一驗也道術之家以為雷燒石色赤投}
  - {type: variant, offset: 1018, length: 3, content: 內遭凶, SBCK: 井中石燋井寒激聲大鳴若雷之狀二驗也人傷於寒寒氣入腹腹中素温温寒分爭激氣雷鳴三驗也當雷之時電光時見大若火之耀四驗也當雷之擊時或燔人室屋及地草木五驗也夫論雷之為火有五驗言雷為天怒無一效然則雷為天怒虛妄之言雖曰論語云迅雷風烈必變禮記曰有疾風迅雷甚雨則必變雖夜必興衣服冠而坐懼天怒畏罰及巳也如雷不為天怒其擊爲不罰過則君子何為為雷變動朝服而正坐子曰天之與人猶父子有父為之變子安能忽故天變己亦宜變順天時示己不違也人聞犬聲}
