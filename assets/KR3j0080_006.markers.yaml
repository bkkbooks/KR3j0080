  - {type: variant, offset: 1, length: 2, content: 義篇, SBCK: 在一虵之死齊孟嘗君田文以五月五日生其父田嬰讓其母曰何故舉之曰君所以不舉五月子何也嬰曰五月子長與户同殺其父母曰人命在天乎在户乎如在天君何憂也如在户則宜高其户耳誰而及之者後文長與一户同而嬰不死是則五月舉子之忌無效驗也夫惡見兩頭虵猶五月舉子也五月舉子其父不死則知見兩頭虵者無殃禍也由此言之見兩頭虵自不死非埋之故也埋一虵獲二福如埋十虵得幾祐乎埋虵惡人復見叔敖賢也賢者之行豈徒埋虵一事哉前埋虵之時多所行矣禀天善性動有賢行賢行之人冝見吉物無爲乃見殺人之虵豈叔敖未見虵之時有惡天欲殺之見其埋虵除其過天活之哉石生而堅蘭生而香如謂叔敖之賢在埋虵之時非生而禀之也儒家之徒董無心}
