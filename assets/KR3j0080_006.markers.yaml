  - {type: variant, offset: 1007, length: 0, content: '', SBCK: 家畫雷之狀皆虛妄也且説雷之家謂雷天怒呴吁也圖雷之家謂之雷公怒引連皷也審如説雷之家則圖雷之家非審如圖雷之家則}
  - {type: variant, offset: 1007, length: 0, content: '', WYG: 家畫雷之狀皆虛妄也且説雷之家謂雷天怒呴吁也圖雷之家謂之雷公怒引連皷也審如説雷之家則圖雷之家非審如圖雷之家則}
  - {type: page-break, offset: 1007, content: '', id: KR3j0080_WYG_006-26b, image: WYG0862/WYG0862-0083d.png}
  - {type: variant, offset: 1007, length: 0, content: '', krp: 家畫雷之狀皆虛妄也且説雷之家謂雷天怒呴吁也圖雷之家謂之雷公怒引連皷也審如説雷之家則圖雷之家非審如圖雷之家則}
  - {type: punctuation, offset: 1008, content: ，, id: KR3j0080_tls_006-bkkpn235}
  - {type: variant, offset: 1008, length: 0, content: '', SBCK: 雷之家誤二者相違也并而是之無是非之分無是非之分故無是非之實無以定疑論故虚妄之論勝也禮曰刻尊為雷之形一出一入一屈一伸為相校軫則鳴校軫之狀作佼較校軫或鬱律㟪壘之類也此象類之矣氣相校軫分裂則隆隆之聲校軫之音也魄然若􅗓裂者氣射之聲也氣射中人人則死矣實説雷者太陽之激氣也何以明之正月陽動故正月始雷五月陽盛故五月雷迅秋冬陽衰故秋冬雷潜盛夏之時太陽用事隂氣乗之隂陽分事則相校軫校軫則激射激射為毒中人輒死中木木折中屋屋壞人在木下屋間偶中而死矣何以驗之試以一斗水灌冶鑄之火氣激􅗓裂若雷之音矣或近之必灼人體天地為鑪大矣陽氣為火猛矣雲雨為水多矣分爭激射}
  - {type: page-break, offset: 1008, content: '', id: KR3j0080_SBCK_006-22b}
  - {type: page-break, offset: 1008, content: '', id: KR3j0080_SBCK_006-23a}
