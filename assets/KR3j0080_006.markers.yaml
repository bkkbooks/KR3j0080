  - {type: variant, offset: 1352, length: 531, content: 性命在本故禮有胎教之法子在身時席不正不坐割不正不食非正色目不視非正聲耳不聽及長置以賢師良傅教君臣父子之道賢不肖在此時矣受氣時母不謹慎心妄慮邪則子長大狂悖不善形體醜惡素女對黃帝陳五女之法非徒傷父母之身乃又賊男女之性人有命有祿有遭遇有幸偶命者貧富貴賤也祿者盛衰興廢也以命當富貴遭當盛之祿常安不危以命當貧賤遇當衰之祿則禍殃乃至常苦不樂遭者遭逢非常之變若成湯囚夏臺文王厄牖里矣以聖明之德而有囚厄之變可謂遭矣變雖甚大命善祿盛變不為害故稱遭逢之禍晏子所遭可謂大矣直兵指胸曲刃加頸蹈死亡之地當劍戟之鋒執死得生還命善祿盛遭逢之禍不能害也歷陽之都長平之坑其中必有命善祿盛之人一宿同填而死遭逢之禍大命善祿盛不能卻也譬猶水火相更也水盛勝火火盛勝水遇者遇其主而用也雖有善命盛祿不遇知己之主不得效驗幸者謂所遭觸得善惡也獲罪得脫幸也無罪見拘不幸也執拘未久蒙令得出命善祿盛夭災之禍不能傷也偶者謂事君有偶也以道事君君善其言遂用其身偶也行與主乖退而遠不偶也退遠未久上官錄召命善祿盛不偶之害不能留也故夫遭遇幸偶或與命祿并或與命祿離遭遇幸偶遂以成完遭遇不幸偶遂以敗傷是與命祿并者也中不遂成善轉為惡若是與命祿離者也故人之在世有吉凶之性命有盛衰之禍福重以遭遇幸偶之逢獲從生死而卒其善惡之行得其胸中之志希矣, SBCK: 論衡卷第六}
