  - {type: variant, offset: 89, length: 0, content: '', WYG: 口著乎體口之動與體俱當擊折之時聲著於地其衰也聲著於天夫如是聲著地之時口至地體亦冝然當雷迅疾之時仰視天不見天之下不見天之下則夫隆隆之聲者非天怒也天之怒與人無異人怒身近人則聲疾逺人則聲微今天聲近其體逺非怒之實也且雷聲迅疾之時聲東西或南北如天怒體動口東西南北仰視天亦冝東西南北或曰天已東西南北矣雲雨冥晦人不能見耳夫千里不同風百里不共雷易曰震驚百里雷電之地雲雨晦冥百里之外無雨之處冝見天之東西南北也口著於天天冝隨口口一移普天皆移非獨雷雨之地天隨口動也且所謂怒者誰也天神邪蒼蒼之天也如謂天神神怒無聲如謂蒼蒼之天天者體不怒怒用口且天地相與夫婦也其即民父母也子有過父怒笞之致死而母不哭乎今天怒殺人地冝哭之獨聞天之怒不聞地之哭如地不能哭則天亦不能怒且有怒則有喜人有隂過亦有隂善有隂過天怒殺之如有隂善天亦冝以喜賞之隆隆之聲謂天之怒如天之喜亦哂然而笑人有喜怒故謂天喜怒推人以知天知天本於人如人不怒則亦無縁謂天怒也縁人以知天冝盡人之性人性怒則呴吁喜則歌笑比聞天之怒希聞天之喜比見天之罰希見天之賞豈天怒不喜貪於罰希於賞哉何怒罰有效喜賞無驗也且雷之擊也折木壞屋時犯殺人以為天怒時或徒雷無所折敗亦不殺人天空怒乎人君不空喜怒喜怒必有賞罸無所罸而空怒是天妄也妄則失威非天行也政事之家以寒温之氣為喜怒之候一有候守人君喜即天温怒則天寒雷電之日天必寒也高祖之先劉媪曾息大澤之陂夢與神遇此時雷電晦冥天方施氣冝喜之時也何怒而雷如用擊折者為怒不擊折者為喜則夫隆隆之聲不冝同音人怒喜異聲天怒喜同音與人乖異則人何縁謂之天怒且飲食人以不㓗淨小過也以至尊之身親罰小過非尊者之冝也尊不親罰過故王不親誅罪天尊於王親罰小過是天徳劣於王也且天之用心猶人之用意人君罪惡初聞之時怒以非之及其誅之哀以憐之故論語曰如得其情則哀憐而勿喜紂至惡也武王將誅哀而憐之故尚書曰予惟率夷憐爾人君誅惡憐而殺之天之罰過怒而擊之是天少恩而人多恵也說雨者以為天施氣天施氣氣渥為雨故雨潤}
