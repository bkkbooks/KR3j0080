  - {type: variant, offset: 1008, length: 0, content: '', krp: 雷之家誤二者相違也并而是之無是非之分無是非之分故無是非之實無以定疑論故虚妄之論勝也禮曰刻尊為雷之形一出一入一屈一伸為相校軫則鳴校軫之狀作佼較校軫或鬱律㟪壘之類也此象類之矣氣相校軫分裂則隆隆之聲校軫之音也魄然若􅗓裂者氣射之聲也氣射中人人則死矣實説雷者太陽之激氣也何以明之正月陽動故正月始雷五月陽盛故五月雷迅秋冬陽衰故秋冬雷潜盛夏之時太陽用事隂氣乗之隂陽分事則相校軫校軫則激射激射為毒中人輒死中木木折中屋屋壞人在木下屋間偶中而死矣何以驗之試以一斗水灌冶鑄之火氣激􅗓裂若雷之音矣或近之必灼人體天地為鑪大矣陽氣為火猛矣雲雨為水多矣分爭激射}
  - {type: variant, offset: 1009, length: 0, content: '', SBCK: 得不迅中傷人身安得不死當冶工之消鐡也以土為形燥則鐡下不則躍溢而射射中人身則皮膚灼剥陽氣之熱非直消鐡之烈也隂氣激之非直土泥之濕也陽氣中人非直灼剥之痛也夫雷火也氣剡人人不得無迹如炙處狀似文字人見之謂天記書其過以示百姓是復虚妄也使人盡有過天用雷殺人殺人當彰其惡以懲其後明著其文字不當闇昩圖出於河書出於洛河圖洛書天地}
  - {type: page-break, offset: 1009, content: '', id: KR3j0080_SBCK_006-23b}
