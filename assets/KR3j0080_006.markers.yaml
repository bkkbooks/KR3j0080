  - {type: variant, offset: 6, length: 1, content: 論, SBCK: 役纒子相見講道纒子稱墨家佑鬼神是引秦穆公有明德上帝賜之九十年纒子難以堯舜不賜年桀紂不夭死堯舜桀紂猶為尚逺且近難以秦穆公晉文公夫諡者行之迹也迹生時行}
  - {type: page-break, offset: 6, content: '', id: KR3j0080_SBCK_006-5b}
  - {type: variant, offset: 6, length: 0, content: '', WYG: 役纒子相見講道纒子稱墨家佑鬼神是引秦穆公有明徳上帝賜之九十年纒子難以堯舜不賜年桀紂不夭死堯舜桀紂猶為尚逺且近難以秦穆公晉文公夫諡者行之迹也迹生時行以為死諡穆者誤亂之名文者徳惠之表有誤亂之行天賜之年有徳恵之操天奪其命乎案穆公之霸不過晉文晉文之諡美於穆公天不加晉文以命獨賜穆公以年是天報誤亂與穆公同也天下善人寡惡人衆善人順道惡人違天然夫惡人之命不短善人之年不長天不命善人常享一百載之壽惡人為殤子惡死何哉禍虚篇世謂受福祐者既以爲行善所致又謂被禍害者為惡所得以為有沉惡伏過天地罰之鬼神報之天地所罰小大猶發鬼神所報逺近猶至傳曰子夏䘮其子而䘮其明曾子弔之哭子夏曰天乎予之無罪也曾子怒曰商汝何無罪也吾與汝事夫子於洙泗之間退而老於西河之上使西河之民疑汝於夫子爾罪一也喪爾親使民未有異聞爾罪二也喪爾子喪爾明爾罪三也而曰汝何無罪歟子夏投其杖而拜曰吾過矣吾過矣吾離羣而索居亦以乆矣夫子夏䘮其明曾子責以罪子夏投杖拜曾子之言蓋以天實罰過故目失其明已實有之故拜受其過始聞暫見皆以為然熟考}
