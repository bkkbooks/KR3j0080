  - {type: variant, offset: 74, length: 0, content: '', SBCK: 得陽達冨厚安樂天不責其無仁義之心道相并殺非其無力作而倉卒以人為食加以渥禍使之夭命章其隂罪明示世人使知不可為非之驗何哉王朔之言未必審然傳書李斯妬同才幽殺韓非於秦後被車裂之罪商鞅欺舊交擒魏公子卬後受誅}
