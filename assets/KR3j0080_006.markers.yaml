  - {type: 'tls:seg', offset: 79, content: '', id: KR3j0080_tls_006-1a.16}
  - {type: variant, offset: 79, length: 0, content: '', SBCK: 龍見于絳郊魏獻子問於蔡墨曰吾聞之蟲莫智於龍以其不生得也謂之智信乎對曰人實不知非龍實智古者畜龍故國有豢龍氏有御龍氏獻子曰是二者吾亦聞之而不知其故是何謂也對曰昔有飂叔安有裔子曰董父實甚好龍能求其嗜欲以飲食之龍多歸之乃擾畜龍以服事舜而錫之姓曰董氏曰豢龍封諸鬷川鬷夷氏是其後也故帝舜氏世有畜龍及有夏孔甲擾于帝帝賜之乗龍河漢各二各有雌雄孔甲不能食也而未獲豢龍氏有陶唐氏既衰其後有劉累學擾龍于豢龍氏以事孔甲能飲食龍夏后嘉之賜氏曰御龍以更豕韋之後龍一雌死潜醢以食夏后夏后烹之既而使求懼而不得遷于魯縣范氏其後也獻子曰今何故無之對曰夫物有其官官修其方朝夕思之一日失職則死及之失官不食官宿其業其物乃至若冺棄之物乃低伏鬱湮不育由此言之龍可畜又可食也可食之物不能神矣世無其官又無董父后劉之人故潜藏伏匿出見希疏出又乗雲與人殊路人謂之神如存其官而有其人則龍牛之類也何神之有以山海經言之以愼子韓子證之以俗世之畫驗之以箕子之泣訂之以蔡墨之對論之知龍不能神不能升天天不以雷電取龍明矣世俗言龍神而升天者妄矣世俗之言亦有縁也短書言龍無尺木無以升天又曰升天又言尺木謂龍從木中升天也彼短書之家世俗之人也見雷電發時龍隨而起當雷電樹木擊之時龍適與雷電俱在樹木之側雷電去龍隨而上故謂從樹木之中升天也實者雷龍同類感氣相致故易曰雲從龍風從虎又言虎嘯谷風至龍興景雲起龍與雲相招虎與風相致故董仲舒雩祭之法設土龍以為感也夫盛夏太陽用事雲雨干之太陽火也雲雨水也火激薄則鳴而為雷龍聞雷聲則起起而雲至雲至而龍乗之雲雨感龍龍亦起雲而升天天極雷高雲消復降人見其乗雲則謂升天見天為雷電則為天取龍世儒讀易文見傳言皆知龍者雲之類拘俗人之議不能通其說又見短書為證故遂謂天取龍天不取龍龍不升天當􅫱丘訢之殺兩蛟也手把其尾拽而出之至淵之外雷電擊之蛟則龍之類也蛟龍見而雲雨至雲雨至則雷電擊如以天實取龍龍為天用何以死蛟為取之且魚在水中亦隨雲雨蜚而乗雲雨非升天也龍魚之類也其乗雷電猶魚之飛也魚隨雲雨不謂之神龍乗雷電獨謂之神世俗之言失其實也物在世間各有所乗水虵乗霧龍乗雲鳥乗風見龍乗雲獨謂之神失龍之實誣龍之能也然則龍之所以為神者以能屈伸其體存亡其形屈伸其體存亡其形未足以為神也豫讓吞炭漆身為厲人不識其形子貢滅鬚為婦人人不知其狀龍變體自匿人亦不能覺變化藏匿者巧也物性亦有自然狌狌知徃乾鵲知來鸚鵡能言三怪比龍性變化也如以巧為神豫讓子貢神也孔子曰㳺者可為網飛者可為矰至於龍也吾不知其乗風雲上升今日見老子其猶龍乎夫龍乗雲而上雲消而下物類可察上下可知而云孔子不知以孔子之聖尚不知龍况俗人智淺好竒之性無實可之心謂之龍神而升天不足怪也雷虚篇盛夏之時雷電迅疾擊折樹木壞}
