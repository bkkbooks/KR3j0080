  - {type: variant, offset: 23, length: 0, content: '', WYG: 非人操行所能得也鉗徒之}
  - {type: variant, offset: 24, length: 0, content: '', WYG: 實而有效王朔之言虚而無驗也多横恣而不罹禍順道而違福王朔之說白起自非蒙恬自咎之類也倉卒之世以財利相刼殺者衆同車共船千里為商至闊逈之地殺其人而并取其財尸捐不收骨暴不塟在水為魚鼈之食在土為螻蟻之糧惰窳之人不力農勉商以積穀貨遭歲饑饉腹餓不飽椎人若畜割而食之無君子小人並為魚肉人所不能知吏所不能覺千人以上萬人以下計一聚之中生者百一死者十九可謂無道至痛甚矣皆得陽達冨厚安樂天不責其無仁義之心道相并殺非其無力作而倉卒以人為食加以渥禍使之夭命章其隂罪明示世人使知不可為非之驗何哉王朔之言未必審然傳書李斯妬同才幽殺韓非於秦後被車裂之罪商鞅欺舊交擒魏公子卬後受誅死之禍彼欲言其賊賢欺交故受患禍之報也夫韓非何過而爲李斯所幽公子卬何罪而為商鞅所擒車裂誅死賊賢欺交幽死見擒何以致之如韓非公子卬有惡天使李斯商鞅報之則李斯商鞅為天奉誅宜䝉其賞不當受其禍如韓非公子卬無惡非天所罰李斯商鞅不得幽擒論者說曰韓非公子卬有隂惡伏罪人不聞見天獨知之故受戮殃夫諸有罪之人非賊賢則逆道如賊賢則被所賊者何負如逆道則被所逆之道何非凢人窮達禍福之至大之則命小之則時太公窮賤遭周文而得封甯戚隱阨逢齊桓而見官非窮賤隱阨有非而得封見官有是也窮達有時遭遇}
