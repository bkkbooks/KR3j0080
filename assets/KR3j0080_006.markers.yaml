  - {type: variant, offset: 1009, length: 0, content: '', krp: 得不迅中傷人身安得不死當冶工之消鐡也以土為形燥則鐡下不則躍溢而射射中人身則皮膚灼剥陽氣之熱非直消鐡之烈也隂氣激之非直土泥之濕也陽氣中人非直灼剥之痛也夫雷火也氣剡人人不得無迹如炙處狀似文字人見之謂天記書其過以示百姓是復虚妄也使人盡有過天用雷殺人殺人當彰其惡以懲其後明著其文字不當闇昩圖出於河書出於洛河圖洛書天地}
  - {type: variant, offset: 1010, length: 0, content: '', SBCK: 為人讀知之今雷死之書亦天所為也何故難知如以一人皮不可書魯恵公夫人仲子宋武公女也生而有文在掌曰為魯夫人文明可知故仲子歸魯雷書不著故難以懲後夫如是火剡之跡非天所刻畫也或頗有而增其語或無有而空生其言虚妄之俗好造怪竒何以}
  - {type: variant, offset: 1010, length: 0, content: '', WYG: 為人讀知之今雷死之書亦天所為也何故難知如以一人皮不可書魯恵公夫人仲子宋武公女也生而有文在掌曰為魯夫人文明可知故仲子歸魯雷書不著故難以懲後夫如是火剡之跡非天所刻畫也或頗有而增其語或無有而空生其言虚妄之俗好造怪竒何以}
  - {type: page-break, offset: 1010, content: '', id: KR3j0080_WYG_006-28a, image: WYG0862/WYG0862-0084c.png}
  - {type: variant, offset: 1010, length: 0, content: '', krp: 為人讀知之今雷死之書亦天所為也何故難知如以一人皮不可書魯恵公夫人仲子宋武公女也生而有文在掌曰為魯夫人文明可知故仲子歸魯雷書不著故難以懲後夫如是火剡之跡非天所刻畫也或頗有而增其語或無有而空生其言虚妄之俗好造怪竒何以}
  - {type: variant, offset: 1011, length: 3, content: 乎遭命, SBCK: 之雷}
  - {type: variant, offset: 1011, length: 0, content: '', WYG: 之雷者火也以人中雷而死即詢其身中頭則鬚髪燒燋中身則皮膚灼燌臨其尸上聞火氣一驗也道術之家以為雷燒石色赤投於井中石燋井寒激聲大鳴若雷之狀二驗也人傷於寒寒氣入腹腹中素温温寒分爭激氣雷鳴三驗也當雷之時電光時見大若火之耀四驗也當雷之擊時或燔人室屋及地草木五驗也夫論雷之為火有五驗言雷為天怒無一效然則雷為天怒虛妄之言難曰論語云迅雷風烈必變禮記曰有疾風迅雷甚雨則必變雖夜必興衣服冠而坐懼天怒畏罰及巳也如雷不為天怒其擊不為罰過則君子何為為雷變動朝服而正坐}
  - {type: page-break, offset: 1011, content: '', id: KR3j0080_WYG_006-28b, image: WYG0862/WYG0862-0084d.png}
  - {type: variant, offset: 1011, length: 3, content: 乎遭命, krp: 之雷}
  - {type: punctuation, offset: 1012, content: ？, id: KR3j0080_tls_006-bkkpn236}
  - {type: 'tls:seg', offset: 1012, content: '', id: KR3j0080_tls_006-5a.42}
  - {type: variant, offset: 1012, length: 9, content: 遭命者行善於內遭凶, WYG: 曰天之與人猶父子有父為之變子安能忽故天變己亦宜變順天時示己不違也人聞大聲}
