  - {type: variant, offset: 94, length: 2, content: 歲餓, SBCK: 言天怒且喜也人君賞罰不同日天之怒喜不殊時天人相違賞罰乖也且怒喜具形亂也惡人為亂怒罰其過罰之以亂非天行也冬雷人謂之陽氣洩春雷謂之陽氣發夏雷不謂陽氣盛謂之天怒竟虛言也人在天地之間物也物亦物也物之飲食天不能知人之飲食天獨知之萬物於天皆子也父母於子恩徳一也豈為貴賢加意賤愚不察乎何其察人之明省物之闇也犬豕食人腐臭食之天不殺也如以人貴而獨禁之則䑕洿人飲食人不知誤而食之天不殺也如天能原䑕則亦能原人人誤以不㓗淨飲食人人不知而食之耳豈故舉腐臭以予之哉如故予之人亦不肯食吕后㫁戚夫人手去其眼置於厠中以為人豕呼人示之人皆傷心恵帝見之病卧不起吕后故為天不罰也人誤不知天輒殺之不能原誤失而責故天治悖也夫人食不淨之物口不知有其洿也如食已知之名曰膓洿戚夫人入厠身體辱之與洿何以别膓之與體何以異為膓不為體傷洿不病辱非天意也且人聞人食不清之物心平如故觀戚夫人}
