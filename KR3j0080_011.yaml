body:
  text: 骨相篇人曰命難知命甚易知知之何用用之骨體人命稟於天則有表候見於體察表候以知命猶察斗斛以知容矣表候者骨法之謂也傳言黃帝龍顏顓頊戴干帝嚳駢齒堯眉八采舜目重瞳禹耳三漏湯臂再肘文王四乳武王望陽周公背僂皋陶馬口孔子反羽斯十二聖者皆在帝王之位或輔主憂世世所共聞儒所共說在經傳者較著可信若夫短書俗記竹帛胤文非儒者所見眾多非一蒼頡四目為黃帝史晉公子重耳仳脅為諸侯霸蘇秦骨鼻為六國相張儀仳脅亦相秦魏項羽重瞳云虞舜之後與高祖分王天下陳平貧而飲食不足貌體佼好而眾人怪之曰平何食而肥及韓信為滕公所鑒免於鈇質亦以面狀有異面壯肥佼亦一相也高祖隆準龍顏美鬚左股有七十二黑子單父呂公善相見高祖狀貌奇之因以其女妻高祖呂后是也卒生孝惠王魯元公主高祖為泗上亭長嘗告歸之田與呂后及兩子居田有一老公過請飲因相呂后曰夫人天下貴人也令相兩子見孝惠曰夫人所以貴者乃此男也相魯元曰皆貴老公去高祖從外來呂后言於高祖高祖追及老公止使自相老公曰鄉者夫人嬰兒相皆似君君相貴不可言也後高祖得天下如老公言推此以況一室之人皆有富貴之相矣類同氣鈞性體法相固自相似異氣殊類亦兩相遇富貴之男娶得富貴之妻女亦得富貴之男夫二相不鈞而相遇則有立死若未相適有豫亡之禍也王莽姑正君許嫁至期當行時夫輒死如此者再乃獻之趙王趙王未取又薨清河南宮大有與正君父稺君善者遇相正君曰貴為天下母是時宣帝世元帝為太子稺君乃因魏郡都尉納之太子太子幸之生子君上宣帝崩太子立正君為皇后君上為太子元帝崩太子立是為成帝正君為皇太后竟為天下母夫正君之相當為天下母而前所許二家及趙王為無天下父之相故未行而二夫死趙王薨是則二夫趙王無帝王大命而正君不當與三家相遇之驗也丞相黃次公故為陽夏游徼與善相者同車俱行見一婦人年十七八相者指之曰此婦人當大富貴為封侯者夫人次公止車審視之相者曰令此婦人不富貴卜書不用也次公問之乃其旁里人巫家子也即娶以為妻其後次公果大富貴位至丞相封為列侯夫次公富貴婦人當配之故果相遇遂俱富貴使次公命賤不得婦人為偶不宜為夫婦之時則有二夫趙王之禍夫舉家皆有富貴之命然後乃任富貴之事骨法形體有不應者則必別離死亡不得久享介福故富貴之家役使奴僮育養牛馬必有與眾不同者矣僮奴則有不死亡之相牛馬則有數字乳之性田則有種孳速熟之穀商則有居善疾售之貨是故知命之人見富貴於貧賤睹貧賤於富貴案骨節之法察皮膚之理以審人之性命無不應者趙簡子使姑布子卿相諸子莫吉至翟婢之子無恤而以為貴無恤最賢又有貴相簡子後廢太子而立無恤卒為諸侯襄子是矣相工相黥布當先刑而乃王後竟被刑乃封王衛青父鄭季與楊信公主家僮衛媼通生青在建章宮時鉗徒相之曰貴至封侯青曰人奴之道得不笞罵足矣安敢望封侯其後青為軍吏戰數有功超封增官遂為大將軍封為萬戶侯周亞夫未封侯之時許負相之曰君後三歲而侯侯入歲為將相持國秉貴重矣於人臣無兩其後九歲而君餓死亞夫笑曰臣之兄已代父侯矣有如父卒子當代亞夫何說侯乎然既已貴如負言又何說餓死指示我許負指其口曰有縱理入口曰此餓死法也居三歲其兄絳侯勝之有罪文帝擇絳侯子賢者皆推亞夫迺封條侯續絳侯後文帝之後六年匈奴大入邊乃以亞夫為將軍至景帝之時亞夫為丞相後以疾免其子為亞夫買工官尚方甲盾五百被可以為葬者取庸苦之不與錢庸知其盜買官器怨而上告其子景帝下吏責問因不食五日嘔血而死當鄧通之幸文帝也貴在公卿之上賞賜億萬與上齊體相工相之曰當貧賤饑死文帝崩景帝立通有盜鑄錢之罪景帝考驗通亡寄死人家不名一錢韓太傅為諸生時之市借相工五十錢與之俱入璧雍之中相璧雍弟子誰當貴者相工指倪寬曰彼生當貴秩至三公韓生謝遣相工通刺倪寬結膠漆之交盡䈥力之敬徙舍從寬深自附納之寬嘗甚病韓生養視如僕狀恩深踰於骨肉後名聞於天下倪寬位至御史大夫州郡丞旨召請擢用舉在本朝遂至太傅夫鉗徒許負及相鄧通倪寬之工可謂知命之工矣故知命之工察骨體之證睹富貴貧賤猶人見盤盂之器知所設用也善器必用貴人惡器必施賤者尊鼎不在陪廁之側匏瓜不在殿堂之上明矣富貴之骨不遇貧賤之苦貧賤之相不遭富貴之樂亦猶此也器之盛物有斗石之量猶人爵有高下之差也器過其量物溢棄遺爵過其差死亡不存論命者如比之於器以察骨體之法則命在於身形定矣非徒富貴貧賤有骨體也而操行清濁亦有法理貴賤貧富命也操行清濁性也非徒命有骨法性亦有骨法唯知命有明相莫知性有骨法此見命之表證不見性之符驗也范蠡去越自齊遺大夫種書曰飛鳥盡良弓藏狡兔死走犬烹越王為人長頸鳥喙可與共患難不可與共榮樂子何不去大夫種不能去稱病不朝賜劍而死大梁人尉繚說秦始皇以并天下之計始皇從其冊與之亢禮衣服飲食與之齊同繚曰秦王為人隆準長目鷙膺豺聲少恩虎視狼心居約易以下人得志亦輕視人我布衣也然見我常身自下我誠使秦王須得志天下皆為虜矣不可與交游乃亡去故范蠡尉繚見性行之證而以定處來事之實實有其效如其法相由此言之性命繫於形體明矣以尺書所載世所共見准況古今不聞者必眾多非一皆有其實稟氣於天立形於地察在地之形以知在天之命莫不得其實也有傳孔子相澹臺子羽唐舉占蔡澤不驗之文此失之不審何隱匿微妙之表也相或在內或在外或在形體或在聲氣察外者遺其內在形體者亡其聲氣孔子適鄭與弟子相失孔子獨立鄭東門鄭人或問子貢曰東門有人其頭似堯其項若皋陶其肩類子產然自腰以下不及禹三寸傫傫若喪家之狗子貢以告孔子孔子欣然笑曰形狀未也如喪家狗然哉然哉夫孔子之相鄭人失其實鄭人不明法術淺也孔子之失子羽唐舉惑於蔡澤猶鄭人相孔子不能具見形狀之實也以貌取人失於子羽以言取人失於宰予也
