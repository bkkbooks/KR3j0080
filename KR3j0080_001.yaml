body:
  text: 逢遇篇操行有常賢仕宦無常遇賢不賢才也遇不遇時也才高行潔不可保以必尊貴能薄操濁不可保以必卑賤或高才潔行不遇退在下流薄能濁操遇在衆上世各自有以取士士亦各自得以進進在遇退在不遇處尊居顯未必賢遇也位卑在下未必愚不遇也故遇或抱汙行尊於桀之朝不遇或持潔節卑於堯之廷所以遇不遇非一也或時賢而輔惡或以大才從於小才或俱大才道有清濁或無道德而以技合或無技能而以色幸伍員帛喜俱事夫差帛喜尊重伍員誅死此異操而同主也或操同而主異亦有遇不遇伊尹箕子是也伊尹箕子才俱也伊尹為相箕子為奴伊尹遇成湯箕子遇商紂也夫以賢事賢君君欲為治臣以賢才輔之趨舍偶合其遇固宜以賢事惡君君不欲為治臣以忠行佐之操志乖忤不遇固宜或以賢聖之臣遭欲為治之君而終有不遇孔子孟軻是也孔子絶糧陳蔡孟軻困於齊梁非時君主不用善也才下知淺不能用大才也夫能御驥騄者必王良也能臣禹稷皋陶者必堯舜也御百里之手而以調千里之足必有摧衡折軛之患有接具臣之才而以御大臣之知必有閉心塞意之變故至言棄捐聖賢距逆非憎聖賢不甘至言也聖賢務高至言難行也夫以大才干小才小才不能受不遇固宜或以大才之臣遇大才之主乃有遇不遇虞舜許由太公伯夷是也虞舜許由俱聖人也並生唐世俱面於堯虞舜紹帝統許由入山林太公伯夷俱賢也並出周國皆見武王太公受封伯夷餓死夫賢聖道同志合趨齊虞舜太公行耦許由伯夷操違者生非其世出非其時也道雖同同中有異志雖合合中有離何則道有精粗志有清濁也許由皇者之輔也生於帝者之時伯夷帝者之佐也出於王者之世並由道德俱發仁義主行道德不清不留主為仁義不高不止此其所以不遇也堯溷舜濁武王誅殘太公討暴同濁皆粗舉措鈞齊此其所以為遇者也故舜王天下皋陶佐政北人無擇深隱不見禹王天下伯益輔治伯成子高委位而耕非皋陶才愈無擇伯益能出子高也然而皋陶伯益進用無擇子高退隱進用行耦退隱操違也退隱勢異身雖屈不願進人主不須其言廢之意亦不恨是兩不相慕也商鞅三說秦孝公前二說不聽後一說用者前二帝王之論後一霸者之議也夫持帝王之論說霸者之主雖精見距更調霸說雖粗見受何則精遇孝公所不得粗遇孝公所欲行也故說者不在善在所說者善之才不待賢在所事者賢之馬圄之說無方而野人說之子貢之說有義野人不聽吹籟工為善聲因越王不善更為野聲越王大說故為善於不欲得善之主雖善不見愛為不善於欲得不善之主雖不善不見憎此以曲伎合合則遇不合則不遇或無伎妄以姦巧合上志亦有以遇者竊簪之臣雞鳴之客是也竊簪之臣親於子反雞鳴之客幸於孟嘗子反好偷臣孟嘗愛僞客也以有補於人君人君賴之其遇固宜或無補益為上所好籍孺鄧通是也籍孺幸於孝惠鄧通愛於孝文無細簡之才微薄之能偶以形佳骨嫺皮媚色稱夫好容人所好也其遇固宜或以醜面惡色稱媚於上嫫母無鹽是也嫫母進於黃帝無鹽納於齊王故賢不肖可豫知遇難先圖何則人主好惡無常人臣所進無豫偶合為是適可為上進者未必賢退者未必愚合幸得進不幸失之世俗之議曰賢人可遇不遇亦自其咎也生不希世准主觀鑒治內調能定說審詞際會能進有補贍主何不遇之有今則不然作無益之能納無補之說以夏進爐以冬奏扇為所不欲得之事獻所不欲聞之語其不遇禍幸矣何福祐之有乎進能有益納說有補人之所知也或以不補而得祐或以有益而獲罪且夏時爐以灸濕冬時扇以翣火世可希主不可准也說可轉能不可易也世主好文己為文則遇主好武己則不遇主好辨有口則遇主不好辨己則不遇文王主不好武武主不好文辨主不好行行主不好辨文與言尚可暴習行與能不可卒成學不宿習無以明名名不素著無以遇主倉猝之業須臾之名日力不足不預聞何以准主而納其說進身而託其能哉昔周人有仕數不遇年老白首泣涕於塗者人或問之何為泣乎對曰吾仕數不遇自傷年老失時是以泣也人曰仕奈何不一遇也對曰吾年少之時學為文文德成就始欲仕宦人君好用老用老主亡後主又用武吾更為武武節始就用武主又亡少主始立好用少年吾年又老是以未嘗一遇仕宦有時不可求也夫希世准主尚不可為況節高志妙不為利動性定質成不為主顧者乎且夫遇也能不預設說不宿具邂逅逢喜遭觸上意故謂之遇如准主調說以取尊貴是名為揣不名曰遇春種穀生秋刈穀收求物得物作事事成不名為遇不求自至不作自成是名為遇猶拾遺於塗托棄於野若天授地生鬼助神輔禽息之精陰薦鮑叔之魂默舉若是者乃遇耳今俗人既不能定遇不遇之論又就遇而譽之因不遇而毀之是據見效案成事不能量操審才能也
