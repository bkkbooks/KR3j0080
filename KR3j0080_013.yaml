body:
  text: 本性篇情性者人治之本禮樂所由生也故原情性之極禮為之防樂為之節性有卑謙辭讓故制禮以適其宜情有好惡喜怒哀樂故作樂以通其敬禮所以制樂所為作者情與性也昔儒舊生著作篇章莫不論說莫能實定周人世碩以為人性有善有惡舉人之善性養而致之則善長性惡養而致之則惡長如此則情性各有陰陽善惡在所養焉故世子作養書一篇密子賤漆雕開公孫尼子之徒亦論情性與世子相出入皆言性有善有惡孟子作性善之篇以為人性皆善及其不善物亂之也謂人生於天地皆稟善性長大與物交接者放縱悖亂不善日以生矣若孟子之言人幼小之時無有不善也微子曰我舊云孩子王子不出紂為孩子之時微子睹其不善之性性惡不出衆庶長大為亂不變故云也羊舌食我初生之時叔姬視之及堂聞其啼聲而還曰其聲豺狼之聲也野心無親非是莫滅羊舌氏遂不肯見及長祁勝為亂食我與焉國人殺食我羊舌氏由是滅矣紂之惡在孩子之時食我之亂見始生之聲孩子始生未與物接誰令悖者丹朱生於唐宮商均生於虞室唐虞之時可比屋而封所與接者必多善矣二帝之旁必多賢也然而丹朱慠商均虐並失帝統歷世為戒且孟子相人以眸子焉心清而眸子瞭心濁而眸子眊人生目輒眊瞭眊瞭稟之於天不同氣也非幼小之時瞭長大與人接乃更眊也性本自然善惡有質孟子之言情性未為實也然而性善之論亦有所緣或仁或義性術乖也動作趨翔性識詭也面色或白或黑身形或長或短至老極死不可變易天性然也皆知水土物器形性不同而莫知善惡稟之異也一歲嬰兒無爭奪之心長大之後或漸利色狂心悖行由此生也告子與孟子同時其論性無善惡之分譬之湍水決之東則東決之西則西夫水無分於東西猶人無分於善惡也夫告子之言謂人之性與水同也使性若水可以水喻性猶金之為金木之為木也人善因善惡亦因惡初稟天然之姿受純一之質故生而兆見善惡可察無分於善惡可推移者謂中人也不善不惡須教成者也故孔子曰中人以上可以語上也中人以下不可以語上也告子之以決水喻者徒謂中人不指極善極惡也孔子曰性相近也習相遠也夫中人之性在所習焉習善而為善習惡而為惡也至於極善極惡非復在習故孔子曰惟上智與下愚不移性有善不善聖化賢教不能復移易也孔子道德之祖諸子之中最卓者也而曰上智下愚不移故知告子之言未得實也夫告子之言亦有緣也詩曰彼姝之子何以與之其傳曰譬猶練絲染之藍則青染之朱則赤夫決水使之東西猶染絲令之青赤也丹朱商均已染於唐虞之化矣然而丹朱慠而商均虐者至惡之質不受藍朱變也孫卿有反孟子作性惡之篇以為人性惡其善者僞也性惡者以為人生皆得惡性也僞者長大之後勉使為善也若孫卿之言人幼小無有善也后稷為兒以種樹為戲孔子能行以俎豆為弄石生而堅蘭生而香生稟善氣長大就成故種樹之戲為唐司馬俎豆之弄為周聖師稟蘭石之性故有堅香之驗夫孫卿之言未為得實然而性惡之言亦有緣也一歲嬰兒無推讓之心見食號欲食之睹好啼欲玩之長大之後禁情割欲勉厲為善矣劉子政非之曰如此則天無氣也陰陽善惡不相當則人之為善安從生陸賈曰天地生人也以禮義之性人能察己所以受命則順順之謂道夫陸賈知人禮義為性人亦能察己所以受命性善者不待察而自善性惡者雖能察之猶背禮畔義義挹於善不能為也故貪者能言廉亂者能言治盜跖非人之竊也莊蹻刺人之濫也明能察己口能論賢性惡不為何益於善陸賈之言未能得實董仲舒覽孫孟之書作情性之說曰天之大經一陰一陽人之大經一情一性性生於陽情生於陰陰氣鄙陽氣仁曰性善者是見其陽也謂惡者是見其陰者也若仲舒之言謂孟子見其陽孫卿見其陰也處二家各有見可也不處人情性有善有惡未也夫人情性同生於陰陽其生於陰陽有渥有泊玉生於石有純有駮情生於陰陽安能純善仲舒之言未能得實劉子政曰性生而然者也在於身而不發情接於物而然者也形出於外形外則謂之陽不發者則謂之陰夫子政之言謂性在身而不發情接於物形出於外故謂之陽性不發不與物接故謂之陰夫如子政之言乃謂情為陽性為陰也不據本所生起苟以形出與不發見定陰陽也必以形出為陽性亦與物接造次必於是顛沛必於是惻隱不忍仁之氣也卑謙辭讓性之發也有與接會故惻隱卑謙形出於外謂性在內不與物接恐非其實不論性之善惡徒議外內陰陽理難以知且從子政之言以性為陰情為陽夫人稟情竟有善惡不也自孟子以下至劉子政鴻儒博生聞見多矣然而論情性竟無定是唯世碩公孫尼子之徒頗得其正由此言之事易知道難論也酆文茂記繁如榮華恢諧劇談甘如飴密未必得實實者人性有善有惡猶人才有高有下也高不可下下不可高謂性無善惡是謂人才無高下也稟性受命同一實也命有貴賤性有善惡謂性無善惡是謂人命無貴賤也九州田土之性善惡不均故有黃赤黑之別上中下之差水潦不同故有清濁之流東西南北之趨人稟天地之性懷五常之氣或仁或義性術乖也動作趨翔或重或輕性識詭也面色或白或黑身形或長或短至老極死不可變易天性然也皆知水土物器形性不同而莫知善惡稟之異也余固以孟軻言人性善者中人以上者也孫卿言人性惡者中人以下者也楊雄言人性善惡混者中人也若反經合道則可以為教盡性之理則未也
