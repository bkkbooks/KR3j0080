body:
  text: 量知篇程材所論論材能行操未言學知之殊奇也夫儒生之所以過文吏者學問日多簡練其性雕琢其材也故夫學者所以反情治性盡材成德也材盡德成其比於文吏亦雕琢者程量多矣貧人與富人俱齎錢百並為賻禮死哀之家知之者知貧人劣能共百以為富人饒羡有奇餘也不知之者見錢俱百以為財貨貧富皆若一也文吏儒生有似於此皆為掾史並典一曹將知之者知文吏儒生筆同而儒生胸中之藏尚多奇餘不知之者以為皆吏深淺多少同一量失實甚矣地性生草山性生木如地種葵韭山樹棗栗名曰美園茂林不復與一恆地庸山比矣文吏儒生有似於此俱有材能並用筆墨而儒生奇有先王之道先王之道非徒葵韭棗栗之謂也恆女之手紡績織經如或奇能織錦刺繡名曰卓殊不復與恆女科矣夫儒生與文吏程材而儒生侈有經傳之學猶女工織錦刺繡之奇也貧人好濫而富人守節者貧人不足而富人饒侈儒生不為非而文吏好為姦者文吏少道德而儒生多仁義也貧人富人並為賓客受賜於主人富人不慚而貧人常愧者富人有以效貧人無以復也儒生文吏俱以長吏為主人者也儒生受長吏之祿報長吏以道文吏空胸無仁義之學居住食祿終無以效所謂尸位素餐者也素者空也空虛無德餐人之祿故曰素餐無道藝之業不曉政治默坐朝廷不能言事與尸無異故曰尸位然則文吏所謂尸位素餐者也居右食嘉見將傾邪豈能舉記陳言得失乎一則不能見是非二則畏罰不敢直言禮曰情欲巧其能力言者文醜不好有骨無肉脂腴不足犯干將相指遂取間郤為地戰者不能立功名貪爵祿者不能諫於上文吏貪爵祿一日居位輒欲圖利以當資用侵漁徇身不為將官顯義雖見太山之惡安肯揚舉毛髮之言事理如此何用自解於尸位素餐乎儒生學大義以道事將不可則止有大臣之志以經勉為公正之操敢言者也位又疏遠遠而近諫禮謂之諂此則郡縣之府庭所以常廓無人者也或曰文吏筆札之能而治定簿書考理煩事雖無道學䈥力材能盡於朝廷此亦報上之效驗也曰此有似於貧人負官重責貧無以償則身為官作責乃畢竟夫官之作非屋廡則墻壁也屋廡則用斧斤墻壁則用築鍤荷斤斧把築鍤與彼握刀持筆何以殊苟謂治文書者報上之效驗此則治屋廡墻壁之人亦報上也俱為官作刀筆斧斤築鍤鈞也抱布貿絲交易有亡各得所願儒生抱道貿祿文吏無所抱何用貿易農商殊業所畜之貨貨不可同計其精粗量其多少其出溢者名曰富人富人在世鄉里願之夫先王之道非徒農商之貨也其為長吏立功致化非徒富多出溢之榮也且儒生之業豈徒出溢哉其身簡練知慮光明見是非審尤可奇也蒸所與衆山之材幹同也伐以為蒸燻以火熛熱突𥥍光色澤潤焫之於堂其耀浩廣火竈之效加也繡之未刺錦之未織恆絲庸帛何以異哉及其加五綵之巧施針鏤之飾文章炫耀黼黻華蟲山龍日月學士有文章之學其猶絲帛之有五色之巧也本質不能相過學業積聚超踰多矣物實無中核者謂之郁無刀斧之斫者謂之朴文吏不學世之教無核也郁朴之人孰與程哉骨曰切象曰瑳玉曰琢石曰磨切瑳琢磨乃成寶器人之學問知能成就猶骨象玉石切瑳琢磨也雖欲勿用賢君其舍諸孫武闔廬世之善用兵者也知或學其法者戰必勝不曉什伯之陳不知擊刺之術者彊使之軍軍覆師敗無其法也穀之始熟曰粟舂之於臼簸其粃糠蒸之於甑爨之以火成熟為飯乃甘可食可食而食之味生肌腴成也粟未為米米未成飯氣腥未熟食之傷人夫人之不學猶穀未成粟米未為飯也知心亂少猶食腥穀氣傷人也學士簡練於學成熟於師身之有益猶穀成飯食之生肌腴也銅錫未採在衆石之間工師鑿掘爐橐鑄鑠乃成器未更爐橐名曰積石積石與彼路畔之瓦山間之礫一實也故夫穀未舂蒸曰粟銅未鑄鑠曰積石人未學問曰矇矇者竹木之類也夫竹生於山木長於林未知所入截竹為筒破以為牒加筆墨之跡乃成文字大者為經小者為傳記斷木為槧析之為板力加刮削乃成奏牘夫竹木粗苴之物也雕琢刻削乃成為器用況人含天地之性最為貴者乎不入師門無經傳之教以郁朴之實不曉禮義立之朝廷植笮樹表之類也其何益哉山野草茂鉤鐮斬刈乃成道路也士未入道門邪惡未除猶山野草木未斬刈不成路也染練布帛名之曰采貴吉之服也無染練之治名觳粗觳粗不吉喪人服之人無道學仕宦朝廷其不能招致也猶喪人服粗不能招吉也能斫削柱梁謂之木匠能穿鑿穴坎謂之土匠能雕琢文書謂之史匠夫文吏之學學治文書也當與木土之匠同科安得程於儒生哉御史之遇文書不失分銖有司之陳籩豆不誤行伍其巧習者亦先學之人不貴者也小賤之能非尊大之職也無經藝之本有筆墨之末大道未足而小伎過多雖曰吾多學問御史之加有司之惠也飯黍粱者饜餐糟糠者飽雖俱曰食為腴不同儒生文吏學俱稱習其於朝廷有益不鈞鄭子皮使尹何為政子産比於未能操刀使之割也子路使子羔為費宰孔子曰賊夫人之子皆以未學不見大道也醫無方術云吾能治病問之曰何用治病曰用心意病者必不信也吏無經學曰吾能治民問之曰何用治民曰以材能是醫無方術以心意治病也百姓安肯信嚮而人君任用使之乎手中無錢之市決貨貨主問曰錢何在對曰無錢貨主必不與也夫胸中無學亦猶手中無錢也欲人君任使之百姓信嚮之奈何也
