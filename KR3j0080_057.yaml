body:
  text: 宣漢篇儒者稱五帝三王致天下太平漢興已來未有太平彼謂五帝三王致太平漢未有太平者見五帝三王聖人也聖人之德能致太平謂漢不太平者漢無聖帝也賢者之化不能太平又見孔子言鳳鳥不至河不出圖吾已矣夫方今無鳳鳥河圖瑞頗未至悉具故謂未太平此言妄也夫太平以治定為效百姓以安樂為符孔子曰修己以安百姓堯舜其猶病諸百姓安者太平之驗也夫治人以人為主百姓安而陰陽和陰陽和則萬物育萬物育則奇瑞出視今天下安乎危乎安則平矣瑞雖未具無害於平故夫王道定事以驗立實以效效驗不彰實誠不見時或實然證驗不具是故王道立事以實不必具驗聖主治世期於平安不須符瑞且夫太平之瑞猶聖王之相也聖王骨法未必同太平之瑞何為當等彼聞堯舜之時鳳皇景星皆見河圖洛書皆出以為後王治天下當復若等之物乃為太平用心若此猶謂堯當復比齒舜當復八眉也夫帝王聖相前後不同則得瑞古今不等而今王無鳳鳥河圖為未太平妄矣孔子言鳳皇河圖者假前瑞以為語也未必謂世當復有鳳皇與河圖也夫帝王之瑞衆多非一或以鳳鳥麒驎或以河圖洛書或以甘露醴泉或以陰陽和調或以百姓乂安今瑞未必同於古古應未必合於今遭以所得未必相襲何以明之以帝王興起命祐不同也周則烏魚漢斬大蛇推論唐虞猶周漢也初興始起事效物氣無相襲者太平瑞應何故當鈞以已至之瑞效方來之應猶守株待兔之蹊藏身破罝之路也天下太平瑞應各異猶家人富殖物不同也或積米穀或藏布帛或畜牛馬或長田宅夫樂米穀不愛布帛歡牛馬不美田宅則謂米穀愈布帛牛馬勝田宅矣今百姓安矣符瑞至矣終謂古瑞河圖鳳皇不至謂之未安是猶食稻之人入飯稷之鄉不見稻米謂稷為非穀也實者天下已太平矣未有聖人何以致之未見鳳皇何以效實問世儒不知聖何以知今無聖人也世人見鳳皇何以知之既無以知之何以知今無鳳皇也委不能知有聖與無又不能別鳳皇是鳳與非則必不能定今太平與未平也孔子曰如有王者必世然後仁三十年而天下平漢興至文帝時二十餘年賈誼創議以為天下洽和當改正朔服色制度定官名興禮樂文帝初即位謙讓未遑夫如賈生之議文帝時已太平矣漢興二十餘年應孔子之言必世然後仁也漢一世之年數已滿太平立矣賈生知之況至今且三百年謂未太平誤也且孔子所謂一世三十年也漢家三百歲十帝耀德未平如何夫文帝之時固已平矣歷世持平矣至平帝時前漢已滅光武中興復致太平問曰文帝有瑞可名太平光武無瑞謂之太平如何曰夫帝王瑞應前後不同雖無物瑞百姓寧集風氣調和是亦瑞也何以明之帝王治平升封太山告安也秦始皇升封太山遭雷雨之變治未平氣未和光武皇帝升封天晏然無雲太平之應也治平氣應光武之時氣和人安物瑞等至人氣已驗論者猶疑孝宣皇帝元康二年鳳皇集於太山後又集于新平四年神雀集於長樂宮或集于上林九真獻麟神雀二年鳳皇甘露降集京師四年鳳皇下杜陵及上林五鳳三年帝祭南郊神光並見或興于谷燭耀齋宮十有餘刻明年祭后土靈光復至至如南郊之時甘靈神雀降集延壽萬歲宮其年三月鸞鳳集長樂宮東門中樹上甘露元年黃龍至見于新豐醴泉滂流彼鳳皇雖五六至或時一鳥而數來或時異鳥而各至麒麟神雀黃龍鸞鳥甘露醴泉祭后土天地之時神光靈耀可謂繁盛纍積矣孝明時雖無鳳皇亦致麟甘露醴泉神雀白雉紫芝嘉禾金出鼎見離木復合五帝三王經傳所載瑞應莫盛孝明如以瑞應效太平宣明之年倍五帝三王也夫如是孝宣孝明可謂太平矣能致太平者聖人也世儒何以謂世未有聖人天之稟氣豈為前世者渥後世者泊哉周有三聖文王武王周公並時猥出漢亦一代也何以當少於周周之聖王何以當多於漢漢之高祖光武周之文武也文帝武帝宣帝孝明今上過周之成康宣王非以身生漢世可褒增頌歎以求媚稱也核事理之情定説者之實也俗好褒遠稱古講瑞上世為美論治則古王為賢睹奇於今終不信然使堯舜更生恐無聖名獵者獲禽觀者樂獵不見漁者之心不顧也是故觀於齊不虞魯遊於楚不歡宋唐虞夏殷同載在二尺四寸儒者推讀朝夕講習不見漢書謂漢劣不若亦觀獵不見漁遊齊楚不願宋魯也使漢有弘文之人經傳漢事則尚書春秋也儒者宗之學者習之將襲舊六為七今上上王至高祖皆為聖帝矣觀杜撫班固等所上漢頌頌功德符瑞汪濊深廣滂沛無量踰唐虞入皇域三代隘辟厥深汙沮也殷監不遠在夏后之世且舍唐虞夏殷近與周家斷量功德實商優劣周不如漢何以驗之周之受命者文武也漢則高祖光武也文武受命之降怪不及高祖光武初起之祐孝宣明之瑞美於周之成康宣王孝宣孝明符瑞唐虞以來可謂盛矣今上即命奉成持滿四海混一天下定寧物瑞已極人應訂隆唐世黎民雍熙今亦天下修仁歲遭運氣穀頗不登迥路無絶道之憂深幽無屯聚之姦周家越常獻白雉方今胸奴鄯善哀牢貢獻牛馬周時僅治五千里內漢氏廓土牧荒服之外牛馬珍於白雉近屬不若遠物古之戎狄今為中國古之裸人今被朝服古之露首今冠章甫古之跣跗今履高舄以盤石為沃田以桀暴為良民夷坎坷為平均化不賓為齊民非太平而何夫實德化則周不能過漢論符瑞則漢盛於周度土境則周狹於漢漢何以不如周獨謂周多聖人治致太平儒者稱聖泰隆使聖卓而無迹稱治亦泰盛使太平絶而無續也
