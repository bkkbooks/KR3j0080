body:
  text: 超奇篇通書千篇以上萬卷以下弘暢雅閑審定文讀而以教授為人師者通人也杼其義旨損益其文句而以上書奏記或興論立說結連篇章者文人鴻儒也好學勤力博聞強識世間多有著書表文論說古今萬不耐一然則著書表文博通所能用之者也入山見木長短無所不知入野見草大小無所不識然而不能伐木以作室屋採草以和方藥此知草木所不能用也夫通人覽見廣博不能掇以論說此為匿生書主人孔子所謂誦詩三百授之以政不達者也與彼草木不能伐採一實也孔子得史記以作春秋及其立義創意襃貶賞誅不復因史記者眇思自出於胸中也凡貴通者貴其能用之也即徒誦讀讀詩諷術雖千篇以上鸚鵡能言之類也衍傳書之意出膏腴之辭非俶儻之才不能任也夫通覽者世間比有著文者歷世希然近世劉子政父子楊子雲桓君山其猶文武周公並出一時也其餘直有往往而然譬珠玉不可多得以其珍也故夫能說一經者為儒生博覽古今者為通人采掇傳書以上書奏記者為文人能精思著文連結篇章者為鴻儒故儒生過俗人通人勝儒生文人踰通人鴻儒超文人故夫鴻儒所謂超而又超者也以超之奇退與儒生相料文軒之比於敝車錦繡之方於縕袍也其相過遠矣如與俗人相料太山之巔墆長狄之項跖不足以喻故夫丘山以土石為體其有銅鐵山之奇也銅鐵既奇或出金玉然鴻儒世之金玉也奇而又奇矣奇而又奇才相超乘皆有品差儒生說名於儒門過俗人遠也或不能說一經教誨後生或帶徒聚眾說論洞溢稱為經明或不能成牘治一說或能陳得失奏便宜言應經傳文如星月其高第若谷子雲唐子高者說書於牘奏之上不能連結篇章或抽列古今紀著行事若司馬子長劉子政之徒累積篇第文以萬數其過子雲子高遠矣然而因成紀前無胸中之造若夫陸賈董仲舒論說世事由意而出不假取於外然而淺露易見觀讀之者猶曰傳記陽成子長作樂經楊子雲作太玄經造於眇思極窅冥之深非庶幾之才不能成也孔子作春秋二子作兩經所謂卓爾蹈孔子之跡鴻茂參貳聖之才者也王公子問於桓君山以楊子雲君山對曰漢興以來未有此人君山差才可謂得高下之實矣采玉者心羨於玉鑽龜能知神於龜能差眾儒之才累其高下賢於所累又作新論論世間事辯照然否虛妄之言偽飾之辭莫不證定彼子長子雲說論之徒君山為甲自君山以來皆為鴻眇之才故有嘉令之文筆能著文則心能謀論文由胸中而出心以文為表觀見其文奇偉俶儻可謂得論也由此言之繁文之人人之傑也有根株於下有榮葉於上有實核於內有皮殼於外文墨辭說士之榮葉皮殼也實誠在胸臆文墨著竹帛外內表裏自相副稱意奮而筆縱故文見而實露也人之有文也猶禽之有毛也毛有五色皆生於體苟有文無實是則五色之禽毛妄生也選士以射心平體正執弓矢審固然後射中論說之出猶弓矢之發也論之應理猶矢之中的夫射以矢中效巧論以文墨驗奇奇巧俱發於心其實一也文有深指巨略君臣治術身不得行口不能泄表著情心以明己之必能為之也孔子作春秋以示王意然則孔子之春秋素王之業也諸子之傳書素相之事也觀春秋以見王意讀諸子以睹相指故曰陳平割肉丞相之端見孫叔敖決期思令尹之兆著觀讀傳書之文治道政務非徒割肉決水之占也足不彊則跡不遠鋒不銛則割不深連結篇章必大才智鴻懿之俊也或曰著書之人博覽多聞學問習熟則能推類興文文由外而興未必實才與文相副也且淺意於華葉之言無根核之深不見大道體要故立功者希安危之際文人不與無能建功之驗徒能筆說之效也曰此不然周世著書之人皆權謀之臣漢世直言之士皆通覽之吏豈謂文非華葉之生根核推之也心思為謀集札為文情見於辭意驗於言商鞅相秦致功於霸作耕戰之書虞卿為趙決計定說行退作虞氏春秋春秋之思起趙城中之議耕戰之書秦堂上之計也陸賈消呂氏之謀與新語同一意桓君山易鼂錯之策與新論共一思觀谷永之陳說唐林之直言劉向之切議以知為本筆墨之文將而送之豈徒雕文飾辭苟為華葉之言哉精誠由中故其文語感動人深是故魯連飛書燕將自殺鄒陽上䟽梁孝開牢書䟽文義奪於肝心非徒博覽者所能造習熟者所能為也夫鴻儒希有而文人比然將相長吏安可不貴豈徒用其才力游文於牒牘哉州郡有憂能治章上奏解理結煩使州郡無事有如唐子高谷子雲之吏出身盡思竭筆牘之力煩憂適有不解者哉古昔之遠四方辟匿文墨之士難得紀錄且近自以會稽言之周長生者文士之雄也在州為刺史任安舉奏在郡為太守孟觀上書事解憂除州郡無事二將以全長生之身不尊顯非其才知少功力薄也二將懷俗人之節不能貴也使遭前世燕昭則長生已蒙鄒衍之寵矣長生死後州郡遭憂無舉奏之吏以故事結不解徵詣相屬文軌不尊筆䟽不續也豈無憂上之吏哉乃其中文筆不足類也長生之才非徒銳於牒牘也作洞歷十篇上自黃帝下至漢朝鋒芒毛髮之事莫不紀載與太史公表紀相似類也上通下達故曰洞歷然則長生非徒文人所謂鴻儒者也前世有嚴夫子後有吳君高末有周長生白雉貢於越暢草獻於宛雍州出玉荊楊生金珍物產於四遠幽遼之地未可言無奇人也孔子曰文王既沒文不在茲乎文王之文在孔子孔子之文在仲舒仲舒既死豈在長生之徒與何言之卓殊文之美麗也唐勒宋玉亦楚文人也竹帛不紀者屈原在其上也會稽文才豈獨周長生哉所以末論列者長生尤踰出也九州多山而華岱為嶽四方多川而江河為瀆者華岱高而江河大也長生州郡高大者也同姓之伯賢舍而譽他族之孟未為得也長生說文辭之伯文人之所共宗獨紀錄之春秋記元於魯之義也俗好高古而稱所聞前人之業菜果甘甜後人新造蜜酪辛苦長生家在會稽生在今世文章雖奇論者猶謂穉於前人天稟元氣人受元精豈為古今者差殺哉優者為高明者為上實事之人見然否之分者睹非卻前退置於後見是推今進置於古心明知昭不惑於俗也班叔皮續太史公書百篇以上記事詳悉義浹理備觀讀之者以為甲而太史公乙子男孟堅為尚書郎文比叔皮非徒五百里也乃夫周召魯衛之謂也苟可高古而班氏父子不足紀也周有郁郁之文者在百世之末也漢在百世之後文論辭說安得不茂喻大以小推民家事以睹王廷之義廬宅始成桑麻纔有居之歷歲子孫相續桃李梅杏菴丘蔽野根莖眾多則華葉繁茂漢氏治定久矣土廣民眾義興事起華葉之言安得不繁夫華與實俱成者也無華生實物希有之山之禿也孰其茂也地之潟也孰其滋也文章之人滋茂漢朝者乃夫漢家熾盛之瑞也天晏列宿煥炳陰雨日月蔽匿方今文人並出見者乃夫漢朝明明之驗也高祖讀陸賈之書歎稱萬歲徐樂主父偃上䟽徵拜郎中方今未聞膳無苦酸之肴口所不甘味手不舉以啖人詔書每下文義經傳四科詔書斐然郁郁好文之明驗也上書不實核著書無義指萬歲之聲徵拜之恩何從發哉飾面者皆欲為好而運目者希聞音者皆欲為悲而驚耳者寡陸賈之書未奏徐樂主父之策未聞群諸瞽言之徒言事麤醜文不美潤不指所謂文辭淫滑不被濤沙之謫幸矣焉蒙徵拜為郎中之寵乎
