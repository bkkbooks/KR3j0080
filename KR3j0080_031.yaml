body:
  text: 談天篇儒書言共工與顓頊爭為天子不勝怒而觸不周之山使天柱折地維絶女媧銷煉五色石以補蒼天斷鼇足以立四極天不足西北故日月移焉地不足東南故百川注焉此久遠之文世間是之言也文雅之人怪而無以非若非而無以奪又恐其實然不敢正議以天道人事論之殆虛言也與人爭為天子不勝怒觸不周之山使天柱折地維絶有力如此天下無敵以此之力與三軍戰則士卒螻蟻也兵革毫芒也安得不勝之恨怒觸不周之山乎且堅重莫如山以萬人之力共推小山不能動也如不周之山大山也使是天柱乎折之固難使非天柱乎觸不周山而使天柱折是亦復難信顓頊與之爭舉天下之兵悉海內之衆不能當也何不勝之有且夫天者氣邪體也如氣乎雲煙無異安得柱而折之女媧以石補之是體也如審然天乃玉石之類也石之質重千里一柱不能勝也如五嶽之巔不能上極天乃為柱如觸不周上極天乎不周為共工所折當此之時天毀壞也如審毀壞何用舉之斷鼇之足以立四極說者曰鼇古之大獸也四足長大故斷其足以立四極夫不周山也鼇獸也夫天本以山為柱共工折之代以獸足骨有腐朽何能立之久且鼇足可以柱天體必長大不容於天地女媧雖聖何能殺之如能殺之殺之何用足可以柱天則皮革如鐵石刀劍矛戟不能刺之彊弩利矢不能勝射也察當今天去地甚高古天與今無異當共工缺天之時天非墜於地也女媧人也人雖長無及天者夫其補天之時何登緣階據而得治之豈古之天若屋廡之形去人不遠故共工得敗之女媧得補之乎如審然者女媧多已前齒為人者人皇最先人皇之時天如蓋乎說易者曰元氣未分渾沌為一儒書又言溟涬濛澒氣未分之類也及其分離清者為天濁者為地如說易之家儒書之言天地始分形體尚小相去近也近則或枕於不周之山共工得折之女媧得補之也含氣之類無有不長天地含氣之自然也從始立以來年歲甚多則天地相去廣狹遠近不可復計儒書之言殆有所見然其言觸不周山而折天柱絶地維銷煉五石補蒼天斷鼇之足以立四極猶為虛也何則山雖動共工之力不能折也豈天地始分之時山小而人反大乎何以能觸而折之以五色石補天尚可謂五石若藥石治病之狀至其斷鼇之足以立四極難論言也從女媧以來久矣四極之立自若鼇之足乎鄒衍之書言天下有九州禹貢之上所謂九州也禹貢九州所謂一州也若禹貢以上者九焉禹貢九州方今天下九州也在東南隅名曰赤縣神州復更有八州每一州者四海環之名曰裨海九州之外更有瀛海此言詭異聞者驚駭然亦不能實然否相隨觀讀諷述以談故虛實之事並傳世間真僞不別也世人惑焉是以難論案鄒子之知不過禹禹之治洪水以益為佐禹主治水益主記物極天之廣窮地之長辨四海之外竟四山之表三十五國之地鳥獸草木金石水土莫不畢載不言復有九州淮南王劉安召術士伍被左吳之輩充滿宮殿作道術之書論天下之事地形之篇道異類之物外國之怪列三十五國之異不言更有九州鄒子行地不若禹益聞見不過被吳才非聖人事非天授安得此言案禹之山經淮南之地形以察鄒子之書虛妄之言也太史公曰禹本紀言河山崑崙崑崙其高二千五百餘里日月所於相辟隱為光明也其上有玉泉華池今自張騫使大夏之後窮河源惡睹本紀所謂崑崙者乎故言九州山川尚書近之矣至禹本紀山經所有怪物余不敢言也夫弗敢言者謂之虛也崑崙之高玉泉華池世所共聞張騫親行無其實案禹貢九州山川怪奇之物金玉之珍莫不悉載不言崑崙山上有玉泉華池案太史公之言山經禹紀虛妄之言凡事難知是非難測極為天中方今天下在禹極之南則天極北必尚多民禹貢東漸于海西被于流沙此非天地之極際也日刺徑千里今從東海之上會稽鄞鄮則察日之初出徑二尺尚遠之驗也遠則東方之地尚多東方之地尚多則天極之北天地廣長不復訾矣夫如是鄒衍之言未可非禹紀山經淮南地形未可信也鄒衍曰方今天下在地東南名赤縣神州天極為天中如方今天下在地東南視極當在西北今正在北方今天下在極南也以極言之不在東南鄒衍之言非也如在東南近日所出日如出時其光宜大今從東海上察日及從流沙之地視日小大同也相去萬里小大不變方今天下得地之廣少矣雒陽九州之中也從雒陽北顧極正在北東海之上去雒陽三千里視極亦在北推此以度從流沙之地視極亦必復在北焉東海流沙九州東西之際也相去萬里視極猶在北者地小居狹未能辟離極也日南之郡去雒且萬里徙民還者問之言日中之時所居之地未能在日南也度之復南萬里日在日之南是則去雒陽二萬里乃為日南也今從雒地察日之去遠近非與極同也極為遠也今欲北行三萬里未能至極下也假令之至是則名為距極下也以至日南五萬里極北亦五萬里也極北亦五萬里極東西亦皆五萬里焉東西十萬南北十萬相承百萬里鄒衍之言天地之間有若天下者九案周時九州東西五千里南北亦五千里五五二十五一州者二萬五千里天下若此九之乘二萬五千里二十二萬五千里如鄒衍之書若謂之多計度驗實反為少焉儒者曰天氣也故其去人不遠人有是非陰為德害天輒知之又輒應之近人之效也如實論之天體非氣也人生於天何嫌天無氣獨有體在上與人相遠祕傳或言天之離天下六萬餘里數家計之三百六十五度一周天下有周度高有里數如天審氣氣如雲煙安得里度又以二十八宿效之二十八宿為日月舍猶地有郵亭為長吏廨矣郵亭著地亦如星舍著天也案傳書者天有形體所據不虛猶此考之則無恍惚明矣
